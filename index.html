"すぐにコップ1杯の水を飲ませて深呼吸を促す。","en":"Give a cup of water right away and encourage deep breathing.","jaRuby":"すぐにコップ1杯《ぱい》の水《みず》を飲《の》ませて深呼吸《しんこきゅう》を促《うなが》す。"}],"answer":1,"expJa":"吸引中にチアノーゼや経皮的動脈血酸素飽和度の急激な低下が見られた場合は、直ちに吸引を中止してチューブをゆっくり抜き、呼吸状態や意識を確認して速やかに看護職員や医師へ連絡・報告する。","expEn":"If cyanosis or a sudden drop in SpO2 appears during suctioning, stop immediately, remove the tube slowly, check breathing and consciousness, and quickly contact and report to a nurse or doctor.","jaRuby":"喀痰吸引《かくたんきゅういん》の実施中《じっしちゅう》に、利用者《りようしゃ》の顔色《かおいろ》が急《きゅう》に悪《わる》くなり（チアノーゼ）、パルスオキシメーターの数値《すうち》が急激《きゅうげき》に低下《ていか》した場合《ばあい》の対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"吸引中《きゅういんちゅう》にチアノーゼや経皮的動脈血酸素飽和度《けいひてきどうみゃくけつさんそほうわど》の急激《きゅうげき》な低下《ていか》が見《み》られた場合《ばあい》は、直《ただ》ちに吸引《きゅういん》を中止《ちゅうし》してチューブをゆっくり抜《ぬ》き、呼吸状態《こきゅうじょうたい》や意識《いしき》を確認《かくにん》して速《すみ》やかに看護職員《かんごしょくいん》や医師《いし》へ連絡《れんらく》・報告《ほうこく》する。"},{"id":"MC46","no":46,"chapter":"mc7","ja":"喀痰吸引器および必要物品のしくみと清潔保持（保管方法）に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about how the suction machine and supplies work and how to keep them clean (storage) is most appropriate?","options":[{"ja":"薬液浸漬法で保管している吸引チューブは、消毒液が付着したままの状態で直接利用者の気管カニューレに挿入する。","en":"A tube stored by the soaking method can be inserted directly into the user's tracheal cannula with the disinfectant still on it.","jaRuby":"薬液浸漬法《やくえきしんしほう》で保管《ほかん》している吸引《きゅういん》チューブは、消毒液《しょうどくえき》が付着《ふちゃく》したままの状態《じょうたい》で直接利用者《ちょくせつりようしゃ》の気管《きかん》カニューレに挿入《そうにゅう》する。"},{"ja":"吸引器の吸引びん（貯留びん）のふたが緩んでいても、吸引圧は正常にかかる。","en":"Even if the lid of the suction (collection) bottle is loose, the suction pressure works normally.","jaRuby":"吸引器《きゅういんき》の吸引《きゅういん》びん（貯留《ちょりゅう》びん）のふたが緩《ゆる》んでいても、吸引圧《きゅういんあつ》は正常《せいじょう》にかかる。"},{"ja":"吸引びんの廃液が70〜80パーセント程度溜まっても、あふれる寸前まで捨てる必要はない。","en":"Even if the bottle is 70–80% full of waste fluid, you do not need to empty it until it is almost overflowing.","jaRuby":"吸引《きゅういん》びんの廃液《はいえき》が70〜80パーセント程度溜《ていどた》まっても、あふれる寸前《すんぜん》まで捨《す》てる必要《ひつよう》はない。"},{"ja":"単回使用（使い捨て）と定められている気管カニューレ内部吸引の滅菌チューブは、水洗いして1か月間再利用する。","en":"Sterile single-use tubes for suctioning inside the tracheal cannula may be washed with water and reused for a month.","jaRuby":"単回使用《たんかいしよう》（使《つか》い捨《す》て）と定《さだ》められている気管《きかん》カニューレ内部吸引《ないぶきゅういん》の滅菌《めっきん》チューブは、水洗《すいせん》いして1か月間再利用《げっかんさいりよう》する。"},{"ja":"吸引チューブの保管方法には、消毒液に浸して保管する「浸漬法（しんせきほう）」と、洗浄・乾燥させて清潔に保管する「乾燥法」などがある。","en":"Suction tubes can be stored by the “soaking method” (in disinfectant) or the “dry method” (washed, dried and kept clean).","jaRuby":"吸引《きゅういん》チューブの保管方法《ほかんほうほう》には、消毒液《しょうどくえき》に浸《つ》して保管《ほかん》する「浸漬法《しんしほう》（しんせきほう）」と、洗浄《せんじょう》・乾燥《かんそう》させて清潔《せいけつ》に保管《ほかん》する「乾燥法《かんそうほう》」などがある。"}],"answer":5,"expJa":"吸引チューブの保管には浸漬法や乾燥法がある（気管カニューレ内部の吸引では原則として単回使用の滅菌チューブを用いる）。薬液浸漬法の場合は、使用前に通水用の水で消毒液を洗い流してから挿入する。吸引びんの廃液は70〜80パーセントになる前に廃棄する。","expEn":"Tubes can be stored by the soaking or dry method (for suctioning inside the tracheal cannula, sterile single-use tubes are used in principle). With the soaking method, rinse off the disinfectant with rinsing water before inserting. Empty the bottle before it reaches 70–80%.","jaRuby":"喀痰吸引器《かくたんきゅういんき》および必要物品《ひつようぶっぴん》のしくみと清潔保持《せいけつほじ》（保管方法《ほかんほうほう》）に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"吸引《きゅういん》チューブの保管《ほかん》には浸漬法《しんしほう》や乾燥法《かんそうほう》がある（気管《きかん》カニューレ内部《ないぶ》の吸引《きゅういん》では原則《げんそく》として単回使用《たんかいしよう》の滅菌《めっきん》チューブを用《もち》いる）。薬液浸漬法《やくえきしんしほう》の場合《ばあい》は、使用前《しようまえ》に通水用《つうすいよう》の水《みず》で消毒液《しょうどくえき》を洗《あら》い流《なが》してから挿入《そうにゅう》する。吸引《きゅういん》びんの廃液《はいえき》は70〜80パーセントになる前《まえ》に廃棄《はいき》する。"},{"id":"MC47","no":47,"chapter":"mc7","ja":"喀痰吸引を実施する前の「利用者の状態観察」と「環境調整」として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate “observation of the user” and “preparation of the environment” before suctioning?","options":[{"ja":"聴診器や耳で聞いて「ゴロゴロ」というたんが絡む音が全くしなくても、時間が来たら必ず吸引する。","en":"Even if you hear no rattling phlegm sound with a stethoscope or your ears, always suction when the time comes.","jaRuby":"聴診器《ちょうしんき》や耳《みみ》で聞《き》いて「ゴロゴロ」というたんが絡《から》む音《おと》が全《まった》くしなくても、時間《じかん》が来《く》たら必《かなら》ず吸引《きゅういん》する。"},{"ja":"他の利用者からよく見えるように、居室のカーテンやドアは全開にして吸引を行う。","en":"Open the curtains and door fully so other users can see well.","jaRuby":"他《ほか》の利用者《りようしゃ》からよく見《み》えるように、居室《きょしつ》のカーテンやドアは全開《ぜんかい》にして吸引《きゅういん》を行《おこな》う。"},{"ja":"食後直後はたんが出やすいため、食事が終わった1分後に必ず吸引を行う。","en":"Phlegm comes out easily right after meals, so always suction 1 minute after a meal.","jaRuby":"食後直後《しょくごちょくご》はたんが出《で》やすいため、食事《しょくじ》が終《お》わった1分後《ふんご》に必《かなら》ず吸引《きゅういん》を行《おこな》う。"},{"ja":"利用者の姿勢は、首を強く前に曲げた窮屈な姿勢に固定して吸引を開始する。","en":"Fix the user in a cramped position with the neck bent strongly forward before starting.","jaRuby":"利用者《りようしゃ》の姿勢《しせい》は、首《くび》を強《つよ》く前《まえ》に曲《ま》げた窮屈《きゅうくつ》な姿勢《しせい》に固定《こてい》して吸引《きゅういん》を開始《かいし》する。"},{"ja":"吸引前は、呼吸状態（呼吸音、呼吸数、リズム）、顔色、経皮的動脈血酸素飽和度などを観察し、吸引が必要か確認する。","en":"Before suctioning, check breathing (sounds, rate, rhythm), face color, SpO2 etc. to see if suctioning is needed.","jaRuby":"吸引前《きゅういんまえ》は、呼吸状態《こきゅうじょうたい》（呼吸音《こきゅうおん》、呼吸数《こきゅうすう》、リズム）、顔色《かおいろ》、経皮的動脈血酸素飽和度《けいひてきどうみゃくけつさんそほうわど》などを観察《かんさつ》し、吸引《きゅういん》が必要《ひつよう》か確認《かくにん》する。"}],"answer":5,"expJa":"吸引前には必ず利用者の呼吸音、呼吸状態、顔色、経皮的動脈血酸素飽和度などを観察し、吸引の必要性を確認する。プライバシー保護のためカーテン等を閉め、食後直後の吸引は嘔吐・誤嚥を招きやすいため原則として避ける。","expEn":"Before suctioning, always check breath sounds, breathing, face color and SpO2 to confirm it is needed. Close curtains to protect privacy. Avoid suctioning right after meals in principle, because it can cause vomiting and aspiration.","jaRuby":"喀痰吸引《かくたんきゅういん》を実施《じっし》する前《まえ》の「利用者《りようしゃ》の状態観察《じょうたいかんさつ》」と「環境調整《かんきょうちょうせい》」として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"吸引前《きゅういんまえ》には必《かなら》ず利用者《りようしゃ》の呼吸音《こきゅうおん》、呼吸状態《こきゅうじょうたい》、顔色《かおいろ》、経皮的動脈血酸素飽和度《けいひてきどうみゃくけつさんそほうわど》などを観察《かんさつ》し、吸引《きゅういん》の必要性《ひつようせい》を確認《かくにん》する。プライバシー保護《ほご》のためカーテン等《とう》を閉《と》め、食後直後《しょくごちょくご》の吸引《きゅういん》は嘔吐《おうと》・誤嚥《ごえん》を招《まね》きやすいため原則《げんそく》として避《さ》ける。"},{"id":"MC48","no":48,"chapter":"mc7","ja":"成人の口腔内・鼻腔内吸引における「吸引圧」と「1回の吸引時間」の一般的な基準として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate general standard for “suction pressure” and “time of one suction” for adult mouth and nose suctioning?","options":[{"ja":"吸引圧は「マイナス80〜マイナス100キロパスカル」、1回の吸引時間は「1分以上」とする。","en":"Pressure −80 to −100 kPa; one suction for 1 minute or more.","jaRuby":"吸引圧《きゅういんあつ》は「マイナス80〜マイナス100キロパスカル」、1回《かい》の吸引時間《きゅういんじかん》は「1分以上《ふんいじょう》」とする。"},{"ja":"吸引圧は「0キロパスカル」、1回の吸引時間は「30秒〜60秒」とする。","en":"Pressure 0 kPa; one suction for 30–60 seconds.","jaRuby":"吸引圧《きゅういんあつ》は「0キロパスカル」、1回《かい》の吸引時間《きゅういんじかん》は「30秒《びょう》〜60秒《びょう》」とする。"},{"ja":"吸引圧は「マイナス20〜マイナス40キロパスカル程度（または医師の指示範囲内）」、1回の吸引時間は「10〜15秒以内」とする。","en":"Pressure about −20 to −40 kPa (or within the doctor's instructions); one suction within 10–15 seconds.","jaRuby":"吸引圧《きゅういんあつ》は「マイナス20〜マイナス40キロパスカル程度《ていど》（または医師《いし》の指示範囲内《しじはんいない》）」、1回《かい》の吸引時間《きゅういんじかん》は「10〜15秒以内《びょういない》」とする。"},{"ja":"吸引圧は毎回最大のメモリまで上げ、たんがなくなるまで3分間連続で吸引する。","en":"Raise the pressure to the maximum every time and suction for 3 minutes nonstop until the phlegm is gone.","jaRuby":"吸引圧《きゅういんあつ》は毎回最大《まいかいさいだい》のメモリまで上《あ》げ、たんがなくなるまで3分間連続《ふんかんれんぞく》で吸引《きゅういん》する。"},{"ja":"吸引圧の調整は、吸引チューブを利用者の鼻腔に入れてから行う。","en":"Adjust the pressure after putting the tube into the user's nose.","jaRuby":"吸引圧《きゅういんあつ》の調整《ちょうせい》は、吸引《きゅういん》チューブを利用者《りようしゃ》の鼻腔《びくう》に入《い》れてから行《おこな》う。"}],"answer":3,"expJa":"成人の吸引圧は一般的にマイナス20〜マイナス40キロパスカル程度（医師の指示に従う）、1回の吸引時間は10〜15秒以内とし、挿入前にチューブの根元を折り曲げて吸引圧を確認する。","expEn":"For adults, suction pressure is generally about −20 to −40 kPa (follow the doctor's instructions), and one suction is within 10–15 seconds. Check the pressure before inserting by bending the base of the tube.","jaRuby":"成人《せいじん》の口腔内《こうくうない》・鼻腔内吸引《びくうないきゅういん》における「吸引圧《きゅういんあつ》」と「1回《かい》の吸引時間《きゅういんじかん》」の一般的《いっぱんてき》な基準《きじゅん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"成人《せいじん》の吸引圧《きゅういんあつ》は一般的《いっぱんてき》にマイナス20〜マイナス40キロパスカル程度《ていど》（医師《いし》の指示《しじ》に従《したが》う）、1回《かい》の吸引時間《きゅういんじかん》は10〜15秒以内《びょういない》とし、挿入前《そうにゅうまえ》にチューブの根元《ねもと》を折《お》り曲《ま》げて吸引圧《きゅういんあつ》を確認《かくにん》する。"},{"id":"MC49","no":49,"chapter":"mc7","ja":"口腔内吸引および鼻腔内吸引の実施手順における留意点として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate point in the procedure for mouth and nose suctioning?","options":[{"ja":"口腔内吸引では、舌の奥（舌根部）を強く押さえつけながら咽頭の奥深くまでチューブを入れる。","en":"In mouth suctioning, press hard on the back of the tongue and insert the tube deep into the pharynx.","jaRuby":"口腔内吸引《こうくうないきゅういん》では、舌《した》の奥《おく》（舌根部《ぜっこんぶ》）を強《つよ》く押《お》さえつけながら咽頭《いんとう》の奥深《おくふか》くまでチューブを入《い》れる。"},{"ja":"鼻腔内吸引では、鼻の穴から額（おでこ）の方向へ向かって垂直に強くチューブを押し込む。","en":"In nose suctioning, push the tube hard straight up from the nostril toward the forehead.","jaRuby":"鼻腔内吸引《びくうないきゅういん》では、鼻《はな》の穴《あな》から額《ひたい》（おでこ）の方向《ほうこう》へ向《む》かって垂直《すいちょく》に強《つよ》くチューブを押《お》し込《こ》む。"},{"ja":"吸引チューブを挿入する際は、チューブの根元を折り曲げる（閉塞する）などして、陰圧（吸引力）をかけずに挿入する。","en":"When inserting the tube, bend (block) its base so that no negative pressure (suction) is applied while inserting.","jaRuby":"吸引《きゅういん》チューブを挿入《そうにゅう》する際《さい》は、チューブの根元《ねもと》を折《お》り曲《ま》げる（閉塞《へいそく》する）などして、陰圧《いんあつ》（吸引力《きゅういんりょく》）をかけずに挿入《そうにゅう》する。"},{"ja":"吸引チューブを抜く際は、1か所に強く吸い付かせたまま一気に素早く引き抜く。","en":"When pulling the tube out, keep it stuck hard in one place and pull it out all at once quickly.","jaRuby":"吸引《きゅういん》チューブを抜《ぬ》く際《さい》は、1か所《しょ》に強《つよ》く吸《す》い付《つ》かせたまま一気《いっき》に素早《すばや》く引《ひ》き抜《ぬ》く。"},{"ja":"1回の吸引でたんが取り切れなかった場合は、呼吸が整うのを待たずに0秒で次の吸引を繰り返す。","en":"If the phlegm is not all removed in one suction, repeat immediately (0 seconds) without waiting for breathing to settle.","jaRuby":"1回《かい》の吸引《きゅういん》でたんが取《と》り切《き》れなかった場合《ばあい》は、呼吸《こきゅう》が整《ととの》うのを待《ま》たずに0秒《びょう》で次《つぎ》の吸引《きゅういん》を繰《く》り返《かえ》す。"}],"answer":3,"expJa":"粘膜の損傷を防ぐため、吸引チューブを挿入するときはチューブを折り曲げるなどして陰圧をかけずに静かに挿入し、引き抜くときにチューブを回すようにしながら吸引する。鼻腔内吸引では、鼻腔底に沿うように（顔面に対してほぼ垂直、耳穴の方向を目安に）進める。","expEn":"To prevent damage to the lining, insert the tube gently without suction (e.g. by bending it), and suction while turning the tube as you pull it out. In nose suctioning, move the tube along the floor of the nasal cavity (almost perpendicular to the face, toward the ear hole).","jaRuby":"口腔内吸引《こうくうないきゅういん》および鼻腔内吸引《びくうないきゅういん》の実施手順《じっしてじゅん》における留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"粘膜《ねんまく》の損傷《そんしょう》を防《ふせ》ぐため、吸引《きゅういん》チューブを挿入《そうにゅう》するときはチューブを折《お》り曲《ま》げるなどして陰圧《いんあつ》をかけずに静《しず》かに挿入《そうにゅう》し、引《ひ》き抜《ぬ》くときにチューブを回《まわ》すようにしながら吸引《きゅういん》する。鼻腔内吸引《びくうないきゅういん》では、鼻腔底《びくうてい》に沿《そ》うように（顔面《がんめん》に対《たい》してほぼ垂直《すいちょく》、耳穴《みみあな》の方向《ほうこう》を目安《めやす》に）進《すす》める。"},{"id":"MC50","no":50,"chapter":"mc7","ja":"気管カニューレ内部の吸引の実施手順における留意点として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate point in the procedure for suctioning inside the tracheal cannula?","options":[{"ja":"吸引チューブの先端（利用者の気管に入る部分）を素手でしっかり握って挿入する。","en":"Hold the tip of the tube (the part that goes into the trachea) firmly with bare hands when inserting.","jaRuby":"吸引《きゅういん》チューブの先端《せんたん》（利用者《りようしゃ》の気管《きかん》に入《はい》る部分《ぶぶん》）を素手《すで》でしっかり握《にぎ》って挿入《そうにゅう》する。"},{"ja":"気管カニューレ内部を吸引したチューブでそのまま口腔内を吸引し、再びそのチューブを気管カニューレに入れて吸引する。","en":"Use the same tube that suctioned the cannula to suction the mouth, then put it back into the cannula again.","jaRuby":"気管《きかん》カニューレ内部《ないぶ》を吸引《きゅういん》したチューブでそのまま口腔内《こうくうない》を吸引《きゅういん》し、再《ふたた》びそのチューブを気管《きかん》カニューレに入《い》れて吸引《きゅういん》する。"},{"ja":"人工呼吸器装着者の吸引において、コネクターを外す際は片手で気管カニューレを強く引っ張りながら外す。","en":"For a ventilator user, pull hard on the cannula with one hand when removing the connector.","jaRuby":"人工呼吸器装着者《じんこうこきゅうきそうちゃくしゃ》の吸引《きゅういん》において、コネクターを外《はず》す際《さい》は片手《かたて》で気管《きかん》カニューレを強《つよ》く引《ひ》っ張《ぱ》りながら外《はず》す。"},{"ja":"吸引チューブを挿入する深さは、あらかじめ医師から指示された長さ（気管カニューレ内部にとどまる範囲）を厳守する。","en":"Strictly keep to the insertion length set in advance by the doctor (within the inside of the cannula).","jaRuby":"吸引《きゅういん》チューブを挿入《そうにゅう》する深《ふか》さは、あらかじめ医師《いし》から指示《しじ》された長《なが》さ（気管《きかん》カニューレ内部《ないぶ》にとどまる範囲《はんい》）を厳守《げんしゅ》する。"},{"ja":"吸引終了後、人工呼吸器のコネクターを再接続した後は、胸の上がりや呼吸器が正常に作動しているかを確認する必要はない。","en":"After reconnecting the ventilator, there is no need to check chest rise or that the ventilator is working properly.","jaRuby":"吸引終了後《きゅういんしゅうりょうご》、人工呼吸器《じんこうこきゅうき》のコネクターを再接続《さいせつぞく》した後《あと》は、胸《むね》の上《あ》がりや呼吸器《こきゅうき》が正常《せいじょう》に作動《さどう》しているかを確認《かくにん》する必要《ひつよう》はない。"}],"answer":4,"expJa":"気管カニューレ内部の吸引では、気管粘膜を傷つけないよう、医師から指示された挿入の長さ（カニューレ内部の範囲）を厳守し、先端部分に素手が触れないよう清潔操作で行う。","expEn":"When suctioning inside the tracheal cannula, strictly keep to the length set by the doctor (inside the cannula) so the tracheal lining is not hurt, and use clean technique so bare hands do not touch the tip.","jaRuby":"気管《きかん》カニューレ内部《ないぶ》の吸引《きゅういん》の実施手順《じっしてじゅん》における留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"気管《きかん》カニューレ内部《ないぶ》の吸引《きゅういん》では、気管粘膜《きかんねんまく》を傷《きず》つけないよう、医師《いし》から指示《しじ》された挿入《そうにゅう》の長《なが》さ（カニューレ内部《ないぶ》の範囲《はんい》）を厳守《げんしゅ》し、先端部分《せんたんぶぶん》に素手《すで》が触《ふ》れないよう清潔操作《せいけつそうさ》で行《おこな》う。"},{"id":"MC51","no":51,"chapter":"mc7","ja":"喀痰吸引の実施後に行う「利用者の確認」と「後片づけ」の手順として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate procedure for “checking the user” and “cleaning up” after suctioning?","options":[{"ja":"吸引後のたんの性状（色、量、粘り気、臭い、血が混じっていないか）は観察せずにすぐ流す。","en":"Throw away the phlegm right away without looking at its condition (color, amount, stickiness, smell, blood).","jaRuby":"吸引後《きゅういんご》のたんの性状《せいじょう》（色《いろ》、量《りょう》、粘《ねば》り気《き》、臭《にお》い、血《ち》が混《ま》じっていないか）は観察《かんさつ》せずにすぐ流《なが》す。"},{"ja":"吸引が終わったら、利用者の呼吸状態や顔色を確認せず、無言ですぐに退室する。","en":"After suctioning, leave the room right away without a word and without checking breathing or face color.","jaRuby":"吸引《きゅういん》が終《お》わったら、利用者《りようしゃ》の呼吸状態《こきゅうじょうたい》や顔色《かおいろ》を確認《かくにん》せず、無言《むごん》ですぐに退室《たいしつ》する。"},{"ja":"使用した手袋は、手洗いをした後に外す。","en":"Remove used gloves after washing your hands.","jaRuby":"使用《しよう》した手袋《てぶくろ》は、手洗《てあら》いをした後《あと》に外《はず》す。"},{"ja":"吸引びんの廃液に真っ赤な血液が大量に混じっていても、吸引が終われば報告しなくてよい。","en":"Even if there is a lot of bright red blood in the waste fluid, you do not need to report it once suctioning is over.","jaRuby":"吸引《きゅういん》びんの廃液《はいえき》に真《ま》っ赤《あか》な血液《けつえき》が大量《たいりょう》に混《ま》じっていても、吸引《きゅういん》が終《お》われば報告《ほうこく》しなくてよい。"},{"ja":"吸引終了後は、吸引チューブの外側をアルコール綿（または清拭綿）で先端に向かって拭き取り、次に通水用の水を吸わせてチューブの内側を洗い流す。","en":"After suctioning, wipe the outside of the tube toward the tip with an alcohol (or cleaning) swab, then suck rinsing water through it to wash the inside.","jaRuby":"吸引終了後《きゅういんしゅうりょうご》は、吸引《きゅういん》チューブの外側《そとがわ》をアルコール綿《めん》（または清拭綿《せいしきめん》）で先端《せんたん》に向《む》かって拭《ふ》き取《と》り、次《つぎ》に通水用《つうすいよう》の水《みず》を吸《す》わせてチューブの内側《うちがわ》を洗《あら》い流《なが》す。"}],"answer":5,"expJa":"吸引終了後は、チューブの外側をアルコール綿等で先端に向かって拭き取り、次に通水用の水を吸わせてチューブ内側を洗浄する。利用者の呼吸状態や顔色、吸引したたんの量・色・性状を確認し、手袋を外した後に手洗いを行う。","expEn":"After suctioning, wipe the outside of the tube toward the tip with an alcohol swab etc., then suck rinsing water through to clean the inside. Check the user's breathing and face color and the amount, color and condition of the phlegm, and wash your hands after removing gloves.","jaRuby":"喀痰吸引《かくたんきゅういん》の実施後《じっしご》に行《おこな》う「利用者《りようしゃ》の確認《かくにん》」と「後片《あとかた》づけ」の手順《てじゅん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"吸引終了後《きゅういんしゅうりょうご》は、チューブの外側《そとがわ》をアルコール綿等《めんとう》で先端《せんたん》に向《む》かって拭《ふ》き取《と》り、次《つぎ》に通水用《つうすいよう》の水《みず》を吸《す》わせてチューブ内側《うちがわ》を洗浄《せんじょう》する。利用者《りようしゃ》の呼吸状態《こきゅうじょうたい》や顔色《かおいろ》、吸引《きゅういん》したたんの量《りょう》・色《いろ》・性状《せいじょう》を確認《かくにん》し、手袋《てぶくろ》を外《はず》した後《あと》に手洗《てあら》いを行《おこな》う。"},{"id":"MC52","no":52,"chapter":"mc7","ja":"喀痰吸引に伴うケア（たんを出しやすくする日常生活上のケア）として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate daily care that helps phlegm come out more easily?","options":[{"ja":"1日中ずっと同じ仰向けの姿勢で寝かせたままで過ごし、体位変換は行わない。","en":"Keep the user lying on their back in the same position all day, without changing position.","jaRuby":"1日中《にっちゅう》ずっと同《おな》じ仰向《あおむ》けの姿勢《しせい》で寝《ね》かせたままで過《す》ごし、体位変換《たいいへんかん》は行《おこな》わない。"},{"ja":"水分を摂るとたんが増えるため、すべての利用者に対して水分の摂取を全面的に禁止する。","en":"Fluids increase phlegm, so completely ban drinking for all users.","jaRuby":"水分《すいぶん》を摂《と》るとたんが増《ふ》えるため、すべての利用者《りようしゃ》に対《たい》して水分《すいぶん》の摂取《せっしゅ》を全面的《ぜんめんてき》に禁止《きんし》する。"},{"ja":"部屋の窓を閉め切り、暖房を強くして湿度を20パーセント以下に保つ。","en":"Close the windows, turn up the heating and keep humidity under 20%.","jaRuby":"部屋《へや》の窓《まど》を閉《と》め切《き》り、暖房《だんぼう》を強《つよ》くして湿度《しつど》を20パーセント以下《いか》に保《たも》つ。"},{"ja":"離床（ベッドから起き上がること）は肺の広がりを妨げるため、絶対に避ける。","en":"Getting out of bed stops the lungs from expanding, so never do it.","jaRuby":"離床《りしょう》（ベッドから起《お》き上《あ》がること）は肺《はい》の広《ひろ》がりを妨《さまた》げるため、絶対《ぜったい》に避《さ》ける。"},{"ja":"室内の空気が乾燥しないよう適切な湿度（加湿）を保ち、医師の制限がない限り十分な水分摂取を促して、たんを柔らかくする。","en":"Keep the right humidity so the air is not dry, and, unless the doctor limits it, encourage enough fluids to soften the phlegm.","jaRuby":"室内《しつない》の空気《くうき》が乾燥《かんそう》しないよう適切《てきせつ》な湿度《しつど》（加湿《かしつ》）を保《たも》ち、医師《いし》の制限《せいげん》がない限《かぎ》り十分《じゅうぶん》な水分摂取《すいぶんせっしゅ》を促《うなが》して、たんを柔《やわ》らかくする。"}],"answer":5,"expJa":"たんを出しやすくするためには、室内の加湿、適切な水分摂取（医師の制限がない場合）、体位変換（体位ドレナージ）、離床や深呼吸の促進などが有効である。","expEn":"To help phlegm come out: humidify the room, give enough fluids (if the doctor does not limit them), change position (postural drainage), and encourage getting out of bed and deep breathing.","jaRuby":"喀痰吸引《かくたんきゅういん》に伴《ともな》うケア（たんを出《だ》しやすくする日常生活上《にちじょうせいかつじょう》のケア）として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"たんを出《だ》しやすくするためには、室内《しつない》の加湿《かしつ》、適切《てきせつ》な水分摂取《すいぶんせっしゅ》（医師《いし》の制限《せいげん》がない場合《ばあい》）、体位変換《たいいへんかん》（体位《たいい》ドレナージ）、離床《りしょう》や深呼吸《しんこきゅう》の促進《そくしん》などが有効《ゆうこう》である。"},{"id":"MC53","no":53,"chapter":"mc7","ja":"喀痰吸引に関する「報告および記録」の書き方・留意点として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about how to write “reports and records” for suctioning?","options":[{"ja":"記録には、実施日時、吸引部位、吸引前後の利用者の状態、吸引物の量・性状（色や粘稠度など）、実施者名などを客観的かつ正確に記入する。","en":"Record the date and time, suction site, the user's condition before and after, amount and condition of the suctioned material (color, stickiness, etc.) and the name of the person who did it, objectively and accurately.","jaRuby":"記録《きろく》には、実施日時《じっしにちじ》、吸引部位《きゅういんぶい》、吸引前後《きゅういんぜんご》の利用者《りようしゃ》の状態《じょうたい》、吸引物《きゅういんぶつ》の量《りょう》・性状《せいじょう》（色《いろ》や粘稠度《ねんちゅうど》など）、実施者名《じっししゃめい》などを客観的《きゃっかんてき》かつ正確《せいかく》に記入《きにゅう》する。"},{"ja":"「たぶん痛かったと思う」「すごくたくさん引けた気がする」など、主観的な感想やあいまいな表現を中心に書く。","en":"Write mainly subjective impressions and vague words like “I think it probably hurt” or “I feel I got a lot out”.","jaRuby":"「たぶん痛《いた》かったと思《おも》う」「すごくたくさん引《ひ》けた気《き》がする」など、主観的《しゅかんてき》な感想《かんそう》やあいまいな表現《ひょうげん》を中心《ちゅうしん》に書《か》く。"},{"ja":"1週間分の記録を金曜日の夕方に記憶を頼りにまとめて記入する。","en":"Write a whole week's records on Friday evening from memory.","jaRuby":"1週間分《しゅうかんぶん》の記録《きろく》を金曜日《きんようび》の夕方《ゆうがた》に記憶《きおく》を頼《たよ》りにまとめて記入《きにゅう》する。"},{"ja":"書き間違えた場合は、黒く塗りつぶすかページを破り捨てて書き直す。","en":"If you make a mistake, black it out or tear out the page and rewrite.","jaRuby":"書《か》き間違《まちが》えた場合《ばあい》は、黒《くろ》く塗《ぬ》りつぶすかページを破《やぶ》り捨《す》てて書《か》き直《ただ》す。"},{"ja":"利用者に普段と違う黄緑色で悪臭のあるたんが見られても、記録に残しておけば看護職員への口頭報告は不要である。","en":"Even if the user has unusual yellow-green, bad-smelling phlegm, writing it down is enough; no need to tell the nurse.","jaRuby":"利用者《りようしゃ》に普段《ふだん》と違《ちが》う黄緑色《きみどりいろ》で悪臭《あくしゅう》のあるたんが見《み》られても、記録《きろく》に残《のこ》しておけば看護職員《かんごしょくいん》への口頭報告《こうとうほうこく》は不要《ふよう》である。"}],"answer":1,"expJa":"記録には「5W1H」を意識し、実施日時、部位、前後の状態、吸引物の量・性状などを客観的かつ正確に実施後速やかに記入する。異常（血痰や膿性痰など）があれば直ちに看護職員へ報告する。","expEn":"Keep “5W1H” in mind. Right after doing it, record the date and time, site, condition before and after, and the amount and condition of the suctioned material objectively and accurately. If there is anything abnormal (bloody or pus-like phlegm), report to the nurse immediately.","jaRuby":"喀痰吸引《かくたんきゅういん》に関《かん》する「報告《ほうこく》および記録《きろく》」の書《か》き方《かた》・留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"記録《きろく》には「5W1H」を意識《いしき》し、実施日時《じっしにちじ》、部位《ぶい》、前後《ぜんご》の状態《じょうたい》、吸引物《きゅういんぶつ》の量《りょう》・性状《せいじょう》などを客観的《きゃっかんてき》かつ正確《せいかく》に実施後速《じっしごすみ》やかに記入《きにゅう》する。異常《いじょう》（血痰《けったん》や膿性痰《のうせいたん》など）があれば直《ただ》ちに看護職員《かんごしょくいん》へ報告《ほうこく》する。"},{"id":"MC54","no":54,"chapter":"mc8","ja":"消化器系の器官とその働きに関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about the digestive organs and their functions is most appropriate?","options":[{"ja":"胃の入り口を「幽門（ゆうもん）」といい、十二指腸へ続く出口を「噴門（ふんもん）」という。","en":"The entrance of the stomach is called the “pylorus” and the exit to the duodenum the “cardia”.","jaRuby":"胃《い》の入《い》り口《くち》を「幽門《ゆうもん》」といい、十二指腸《じゅうにしちょう》へ続《つづ》く出口《でぐち》を「噴門《ふんもん》」という。"},{"ja":"栄養素の大部分は「食道」で消化・吸収され、小腸では一切吸収されない。","en":"Most nutrients are digested and absorbed in the “esophagus”; nothing is absorbed in the small intestine.","jaRuby":"栄養素《えいようそ》の大部分《だいぶぶん》は「食道《しょくどう》」で消化《しょうか》・吸収《きゅうしゅう》され、小腸《しょうちょう》では一切吸収《いっさいきゅうしゅう》されない。"},{"ja":"食べ物は、口腔、咽頭、食道、胃、小腸（十二指腸・空腸・回腸）、大腸（結腸・直腸）の順に送られ、肛門から排泄される。","en":"Food passes in this order: mouth, pharynx, esophagus, stomach, small intestine (duodenum, jejunum, ileum), large intestine (colon, rectum), and is excreted from the anus.","jaRuby":"食《た》べ物《もの》は、口腔《こうくう》、咽頭《いんとう》、食道《しょくどう》、胃《い》、小腸《しょうちょう》（十二指腸《じゅうにしちょう》・空腸《くうちょう》・回腸《かいちょう》）、大腸《だいちょう》（結腸《けっちょう》・直腸《ちょくちょう》）の順《じゅん》に送《おく》られ、肛門《こうもん》から排泄《はいせつ》される。"},{"ja":"胃液は強いアルカリ性であり、細菌を繁殖させる働きがある。","en":"Stomach juice is strongly alkaline and helps bacteria grow.","jaRuby":"胃液《いえき》は強《つよ》いアルカリ性《せい》であり、細菌《さいきん》を繁殖《はんしょく》させる働《はたら》きがある。"},{"ja":"大腸は、タンパク質や脂肪を分解する消化酵素を大量に分泌する器官である。","en":"The large intestine releases large amounts of digestive enzymes that break down protein and fat.","jaRuby":"大腸《だいちょう》は、タンパク質《しつ》や脂肪《しぼう》を分解《ぶんかい》する消化酵素《しょうかこうそ》を大量《たいりょう》に分泌《ぶんぴつ》する器官《きかん》である。"}],"answer":3,"expJa":"消化管は口腔→咽頭→食道→胃→小腸→大腸→肛門へとつながっている。胃の入り口は「噴門」、出口は「幽門」といい、胃液は強い酸性（塩酸）である。栄養素の大部分は小腸で消化・吸収され、大腸では主に水分が吸収される。","expEn":"The digestive tract goes: mouth → pharynx → esophagus → stomach → small intestine → large intestine → anus. The stomach entrance is the “cardia” and the exit is the “pylorus”; stomach juice is strongly acidic (hydrochloric acid). Most nutrients are digested and absorbed in the small intestine; the large intestine mainly absorbs water.","jaRuby":"消化器系《しょうかきけい》の器官《きかん》とその働《はたら》きに関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"消化管《しょうかかん》は口腔《こうくう》→咽頭《いんとう》→食道《しょくどう》→胃《い》→小腸《しょうちょう》→大腸《だいちょう》→肛門《こうもん》へとつながっている。胃《い》の入《い》り口《くち》は「噴門《ふんもん》」、出口《でぐち》は「幽門《ゆうもん》」といい、胃液《いえき》は強《つよ》い酸性《さんせい》（塩酸《えんさん》）である。栄養素《えいようそ》の大部分《だいぶぶん》は小腸《しょうちょう》で消化《しょうか》・吸収《きゅうしゅう》され、大腸《だいちょう》では主《おも》に水分《すいぶん》が吸収《きゅうしゅう》される。"},{"id":"MC55","no":55,"chapter":"mc8","ja":"「嚥下（えんげ：飲み込み）のしくみ」に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about “how swallowing works” is most appropriate?","options":[{"ja":"咽頭期（嚥下反射が起きる時期）には、軟口蓋（なんこうがい）が下がって鼻腔への通り道を開き、喉頭蓋が開いて気管へ食べ物を入れる。","en":"In the pharyngeal stage (when the swallowing reflex happens), the soft palate goes down to open the way to the nose, and the epiglottis opens to let food into the trachea.","jaRuby":"咽頭期《いんとうき》（嚥下反射《えんげはんしゃ》が起《お》きる時期《じき》）には、軟口蓋《なんこうがい》が下《さ》がって鼻腔《びくう》への通《とお》り道《みち》を開《ひら》き、喉頭蓋《こうとうがい》が開《ひら》いて気管《きかん》へ食《た》べ物《もの》を入《い》れる。"},{"ja":"嚥下反射が起きている瞬間も、人間は同時に大きく息を吸い続けている。","en":"Even at the moment of the swallowing reflex, people keep breathing in deeply.","jaRuby":"嚥下反射《えんげはんしゃ》が起《お》きている瞬間《しゅんかん》も、人間《にんげん》は同時《どうじ》に大《おお》きく息《いき》を吸《す》い続《つづ》けている。"},{"ja":"食べ物や唾液が誤って気管に入ってしまうことを「逆流」といい、食道に入ることを「誤嚥」という。","en":"Food or saliva going into the trachea by mistake is called “reflux”, and going into the esophagus is called “aspiration”.","jaRuby":"食《た》べ物《もの》や唾液《だえき》が誤《あやま》って気管《きかん》に入《はい》ってしまうことを「逆流《ぎゃくりゅう》」といい、食道《しょくどう》に入《はい》ることを「誤嚥《ごえん》」という。"},{"ja":"高齢になっても嚥下機能や咳反射が低下することは絶対にない。","en":"Swallowing function and the cough reflex never weaken with age.","jaRuby":"高齢《こうれい》になっても嚥下機能《えんげきのう》や咳反射《せきはんしゃ》が低下《ていか》することは絶対《ぜったい》にない。"},{"ja":"食べ物を認識して口に運ぶ時期を「先行期（認知期）」といい、口の中で噛み砕いて食塊をつくる時期を「準備期（咀嚼期）」という。","en":"The stage of recognizing food and bringing it to the mouth is the “anticipatory (cognitive) stage”; the stage of chewing food into a bolus is the “preparatory (chewing) stage”.","jaRuby":"食《た》べ物《もの》を認識《にんしき》して口《くち》に運《はこ》ぶ時期《じき》を「先行期《せんこうき》（認知期《にんちき》）」といい、口《くち》の中《なか》で噛《か》み砕《くだ》いて食塊《しょっかい》をつくる時期《じき》を「準備期《じゅんびき》（咀嚼期《そしゃくき》）」という。"}],"answer":5,"expJa":"嚥下の過程は、先行期（認知期）→準備期（咀嚼期）→口腔期→咽頭期→食道期の5期に分けられる。咽頭期には軟口蓋が上がって鼻腔を閉じ、喉頭蓋が下がって気管の入り口を閉じることで誤嚥を防いでいる（この瞬間は呼吸が一時停止する）。","expEn":"Swallowing has 5 stages: anticipatory (cognitive) → preparatory (chewing) → oral → pharyngeal → esophageal. In the pharyngeal stage, the soft palate rises to close the nasal cavity and the epiglottis goes down to close the trachea, preventing aspiration (breathing stops for a moment).","jaRuby":"「嚥下《えんげ》（えんげ：飲《の》み込《こ》み）のしくみ」に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"嚥下《えんげ》の過程《かてい》は、先行期《せんこうき》（認知期《にんちき》）→準備期《じゅんびき》（咀嚼期《そしゃくき》）→口腔期《こうくうき》→咽頭期《いんとうき》→食道期《しょくどうき》の5期《き》に分《わ》けられる。咽頭期《いんとうき》には軟口蓋《なんこうがい》が上《あ》がって鼻腔《びくう》を閉《と》じ、喉頭蓋《こうとうがい》が下《さ》がって気管《きかん》の入《い》り口《くち》を閉《と》じることで誤嚥《ごえん》を防《ふせ》いでいる（この瞬間《しゅんかん》は呼吸《こきゅう》が一時停止《いちじていし》する）。"},{"id":"MC56","no":56,"chapter":"mc8","ja":"よくある消化器の症状（嘔気・嘔吐、下痢、便秘など）とその原因・対応に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about common digestive symptoms (nausea/vomiting, diarrhea, constipation, etc.), their causes and responses is most appropriate?","options":[{"ja":"嘔吐が見られた場合は、すぐに残りの栄養剤を通常の2倍の速度で注入し切る。","en":"If vomiting is seen, give the rest of the formula right away at twice the normal speed.","jaRuby":"嘔吐《おうと》が見《み》られた場合《ばあい》は、すぐに残《のこ》りの栄養剤《えいようざい》を通常《つうじょう》の2倍《ばい》の速度《そくど》で注入《ちゅうにゅう》し切《き》る。"},{"ja":"何日も排便がなく腹部が強く張っている（便秘・腹部膨満）状態でも、そのまま気にせず栄養剤を注入してよい。","en":"Even if there has been no bowel movement for days and the stomach is very swollen, you may keep feeding without worry.","jaRuby":"何日《なんにち》も排便《はいべん》がなく腹部《ふくぶ》が強《つよ》く張《ぱ》っている（便秘《べんぴ》・腹部膨満《ふくぶぼうまん》）状態《じょうたい》でも、そのまま気《き》にせず栄養剤《えいようざい》を注入《ちゅうにゅう》してよい。"},{"ja":"水様便（激しい下痢）が続いているときは、脱水予防のために経管栄養の速度を最大に上げる。","en":"When watery stools (severe diarrhea) continue, raise the feeding speed to the maximum to prevent dehydration.","jaRuby":"水様便《すいようべん》（激《はげ》しい下痢《げり》）が続《つづ》いているときは、脱水予防《だっすいよぼう》のために経管栄養《けいかんえいよう》の速度《そくど》を最大《さいだい》に上《あ》げる。"},{"ja":"吐物にコーヒーの残りかすのような黒褐色のものが混じっている場合は、正常な消化液であるため心配ない。","en":"If the vomit contains dark brown matter like coffee grounds, it is normal digestive juice and nothing to worry about.","jaRuby":"吐物《とぶつ》にコーヒーの残《のこ》りかすのような黒褐色《こっかっしょく》のものが混《ま》じっている場合《ばあい》は、正常《せいじょう》な消化液《しょうかえき》であるため心配《しんぱい》ない。"},{"ja":"経管栄養の注入速度が速すぎたり、栄養剤の温度が冷たすぎたりすると、下痢や腹痛を引き起こす原因になる。","en":"If tube feeding is given too fast or the formula is too cold, it can cause diarrhea or stomach pain.","jaRuby":"経管栄養《けいかんえいよう》の注入速度《ちゅうにゅうそくど》が速《はや》すぎたり、栄養剤《えいようざい》の温度《おんど》が冷《つめ》たすぎたりすると、下痢《げり》や腹痛《ふくつう》を引《ひ》き起《お》こす原因《げんいん》になる。"}],"answer":5,"expJa":"栄養剤の注入速度が速すぎたり温度が冷たすぎたりすると、腸管が刺激されて下痢や腹痛を起こしやすい。嘔吐や強い腹部膨満、コーヒー残渣様の吐物（胃出血の疑い）がある場合は注入を行わず（または中止し）、直ちに医療職へ連絡する。","expEn":"Feeding too fast or too cold stimulates the intestines and easily causes diarrhea and stomach pain. If there is vomiting, strong swelling of the abdomen, or coffee-ground-like vomit (possible stomach bleeding), do not start (or stop) the feeding and contact medical staff immediately.","jaRuby":"よくある消化器《しょうかき》の症状《しょうじょう》（嘔気《おうき》・嘔吐《おうと》、下痢《げり》、便秘《べんぴ》など）とその原因《げんいん》・対応《たいおう》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"栄養剤《えいようざい》の注入速度《ちゅうにゅうそくど》が速《はや》すぎたり温度《おんど》が冷《つめ》たすぎたりすると、腸管《ちょうかん》が刺激《しげき》されて下痢《げり》や腹痛《ふくつう》を起《お》こしやすい。嘔吐《おうと》や強《つよ》い腹部膨満《ふくぶぼうまん》、コーヒー残渣様《ざんさよう》の吐物《とぶつ》（胃出血《いしゅっけつ》の疑《うたが》い）がある場合《ばあい》は注入《ちゅうにゅう》を行《おこな》わず（または中止《ちゅうし》し）、直《ただ》ちに医療職《いりょうしょく》へ連絡《れんらく》する。"},{"id":"MC57","no":57,"chapter":"mc8","ja":"「経管栄養法の種類（胃ろう・腸ろう・経鼻経管栄養）」と器具の特徴に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about types of tube feeding (gastrostomy, enterostomy, nasal tube feeding) and their devices is most appropriate?","options":[{"ja":"経鼻経管栄養は、鼻から食道を通さずに気管の中へチューブを留置して栄養を入れる方法である。","en":"Nasal tube feeding puts a tube from the nose into the trachea, not the esophagus, to give nutrition.","jaRuby":"経鼻経管栄養《けいびけいかんえいよう》は、鼻《はな》から食道《しょくどう》を通《かよ》さずに気管《きかん》の中《なか》へチューブを留置《りゅうち》して栄養《えいよう》を入《い》れる方法《ほうほう》である。"},{"ja":"胃ろう（PEG）のカテーテルには、お腹の表面に出る形状によって「ボタン型」と「チューブ型」があり、胃内部の固定方法によって「バルーン型」と「バンパー型」がある。","en":"Gastrostomy (PEG) catheters are “button type” or “tube type” by the shape outside the abdomen, and “balloon type” or “bumper type” by how they are fixed inside the stomach.","jaRuby":"胃《い》ろう（PEG）のカテーテルには、お腹《なか》の表面《ひょうめん》に出《で》る形状《けいじょう》によって「ボタン型《がた》」と「チューブ型《がた》」があり、胃内部《いないぶ》の固定方法《こていほうほう》によって「バルーン型《がた》」と「バンパー型《がた》」がある。"},{"ja":"腸ろう（空腸ろうなど）は、胃の中に大きなスペースがあるため、1回に大量の栄養剤を3分間で一気に注入できる。","en":"Enterostomy (e.g. jejunostomy) has a large space like the stomach, so a large amount of formula can be given at once in 3 minutes.","jaRuby":"腸《ちょう》ろう（空腸《くうちょう》ろうなど）は、胃《い》の中《なか》に大《おお》きなスペースがあるため、1回《かい》に大量《たいりょう》の栄養剤《えいようざい》を3分間《ふんかん》で一気《いっき》に注入《ちゅうにゅう》できる。"},{"ja":"胃ろうを造設した利用者は、口から食べ物を食べる訓練や口腔ケアを行ってはならない。","en":"Users with a gastrostomy must not do training to eat by mouth or receive oral care.","jaRuby":"胃《い》ろうを造設《ぞうせつ》した利用者《りようしゃ》は、口《くち》から食《た》べ物《もの》を食《た》べる訓練《くんれん》や口腔《こうくう》ケアを行《おこな》ってはならない。"},{"ja":"バルーン型の胃ろうカテーテルは、1度挿入すれば10年間は交換や固定水の確認が不要である。","en":"Once inserted, a balloon-type gastrostomy catheter needs no change or check of the fixing water for 10 years.","jaRuby":"バルーン型《がた》の胃《い》ろうカテーテルは、1度挿入《どそうにゅう》すれば10年間《ねんかん》は交換《こうかん》や固定水《こていすい》の確認《かくにん》が不要《ふよう》である。"}],"answer":2,"expJa":"胃ろう（PEG）カテーテルには、体外固定部の形状による「ボタン型」「チューブ型」と、胃内固定部の形状による「バルーン型」「バンパー型」がある。腸ろうは胃のように溜める空間がないため、少量ずつ時間をかけて持続的に注入する。","expEn":"PEG catheters are “button” or “tube” type (by the outside part) and “balloon” or “bumper” type (by the inside part). The intestine has no space to store food like the stomach, so enterostomy feeding is given slowly, a little at a time, continuously.","jaRuby":"「経管栄養法《けいかんえいようほう》の種類《しゅるい》（胃《い》ろう・腸《ちょう》ろう・経鼻経管栄養《けいびけいかんえいよう》）」と器具《きぐ》の特徴《とくちょう》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"胃《い》ろう（PEG）カテーテルには、体外固定部《たいがいこていぶ》の形状《けいじょう》による「ボタン型《がた》」「チューブ型《がた》」と、胃内固定部《いないこていぶ》の形状《けいじょう》による「バルーン型《がた》」「バンパー型《がた》」がある。腸《ちょう》ろうは胃《い》のように溜《た》める空間《くうかん》がないため、少量《しょうりょう》ずつ時間《じかん》をかけて持続的《じぞくてき》に注入《ちゅうにゅう》する。"},{"id":"MC58","no":58,"chapter":"mc8","ja":"経管栄養で注入する内容（液体栄養剤、半固形化栄養剤、水分など）に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about what is given by tube feeding (liquid formula, semi-solid formula, water, etc.) is most appropriate?","options":[{"ja":"栄養剤には十分な水分が含まれているため、指示書にある白湯（さゆ・水分）の注入はすべて省略してよい。","en":"Formula contains enough water, so the warm water (sayu) on the instruction sheet can always be skipped.","jaRuby":"栄養剤《えいようざい》には十分《じゅうぶん》な水分《すいぶん》が含《ふく》まれているため、指示書《しじしょ》にある白湯《さゆ》（さゆ・水分《すいぶん》）の注入《ちゅうにゅう》はすべて省略《しょうりゃく》してよい。"},{"ja":"冷蔵庫から出したばかりの冷たい栄養剤は、温めずにそのまま冷たい状態で注入するのが胃腸に最も優しい。","en":"Formula straight from the fridge is gentlest on the stomach if given cold without warming.","jaRuby":"冷蔵庫《れいぞうこ》から出《だ》したばかりの冷《つめ》たい栄養剤《えいようざい》は、温《あたた》めずにそのまま冷《つめ》たい状態《じょうたい》で注入《ちゅうにゅう》するのが胃腸《いちょう》に最《もっと》も優《やさ》しい。"},{"ja":"栄養剤を温める際は、電子レンジで沸騰するまで加熱して熱々の状態で注入する。","en":"When warming formula, heat it in a microwave until boiling and give it piping hot.","jaRuby":"栄養剤《えいようざい》を温《あたた》める際《さい》は、電子《でんし》レンジで沸騰《ふっとう》するまで加熱《かねつ》して熱々《あつあつ》の状態《じょうたい》で注入《ちゅうにゅう》する。"},{"ja":"介護職員は、利用者の家族から頼まれれば、医師の指示がない市販の牛乳やジュースを勝手に胃ろうから注入してよい。","en":"If the family asks, care workers may give store-bought milk or juice through the gastrostomy without a doctor's instruction.","jaRuby":"介護職員《かいごしょくいん》は、利用者《りようしゃ》の家族《かぞく》から頼《たよ》まれれば、医師《いし》の指示《しじ》がない市販《しはん》の牛乳《ぎゅうにゅう》やジュースを勝手《かって》に胃《い》ろうから注入《ちゅうにゅう》してよい。"},{"ja":"半固形化栄養剤は、液体栄養剤に比べて胃食道逆流や下痢を起こしにくく、注入時間を短縮できるメリットがある。","en":"Semi-solid formula causes less reflux and diarrhea than liquid formula and can be given in a shorter time.","jaRuby":"半固形化栄養剤《はんこけいかえいようざい》は、液体栄養剤《えきたいえいようざい》に比《くら》べて胃食道逆流《いしょくどうぎゃくりゅう》や下痢《げり》を起《お》こしにくく、注入時間《ちゅうにゅうじかん》を短縮《たんしゅく》できるメリットがある。"}],"answer":5,"expJa":"半固形化栄養剤は、胃内で広がりにくく逆流や下痢のリスクを減らせるほか、短時間で注入できるため褥瘡予防や離床時間の確保につながる。液体栄養剤は人肌程度（約37〜40度前後）に湯煎等で温め（電子レンジでの直接加熱は突沸や変性の恐れがあるため不可）、指示された白湯も必ず注入する。","expEn":"Semi-solid formula does not spread easily in the stomach, reducing reflux and diarrhea, and it can be given quickly, which helps prevent bedsores and gives more time out of bed. Warm liquid formula to about body temperature (about 37–40°C) in hot water (not directly in a microwave, because of sudden boiling and changes), and always give the warm water as instructed.","jaRuby":"経管栄養《けいかんえいよう》で注入《ちゅうにゅう》する内容《ないよう》（液体栄養剤《えきたいえいようざい》、半固形化栄養剤《はんこけいかえいようざい》、水分《すいぶん》など）に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"半固形化栄養剤《はんこけいかえいようざい》は、胃内《いない》で広《ひろ》がりにくく逆流《ぎゃくりゅう》や下痢《げり》のリスクを減《へ》らせるほか、短時間《たんじかん》で注入《ちゅうにゅう》できるため褥瘡予防《じょくそうよぼう》や離床時間《りしょうじかん》の確保《かくほ》につながる。液体栄養剤《えきたいえいようざい》は人肌程度《ひとはだていど》（約《やく》37〜40度前後《どぜんご》）に湯煎等《ゆせんとう》で温《あたた》め（電子《でんし》レンジでの直接加熱《ちょくせつかねつ》は突沸《とっぷつ》や変性《へんせい》の恐《おそ》れがあるため不可《ふか》）、指示《しじ》された白湯《さゆ》も必《かなら》ず注入《ちゅうにゅう》する。"},{"id":"MC59","no":59,"chapter":"mc8","ja":"子どもの経管栄養における特徴と留意点として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about the features of tube feeding for children and points to note?","options":[{"ja":"子どもが激しく泣いている最中は、腹圧が下がって逆流しにくいため、注入を開始するのに最適である。","en":"While a child is crying hard, abdominal pressure goes down and reflux is less likely, so it is the best time to start feeding.","jaRuby":"子《こ》どもが激《はげ》しく泣《な》いている最中《さいちゅう》は、腹圧《ふくあつ》が下《さ》がって逆流《ぎゃくりゅう》しにくいため、注入《ちゅうにゅう》を開始《かいし》するのに最適《さいてき》である。"},{"ja":"子どもの皮膚は成人よりも丈夫であるため、経鼻チューブを固定するテープによる皮膚トラブルは起こらない。","en":"Children's skin is stronger than adults', so the tape for the nasal tube never causes skin problems.","jaRuby":"子《こ》どもの皮膚《ひふ》は成人《せいじん》よりも丈夫《じょうぶ》であるため、経鼻《けいび》チューブを固定《こてい》するテープによる皮膚《ひふ》トラブルは起《お》こらない。"},{"ja":"注入量や注入速度は、子どもの体重や年齢にかかわらず、すべて成人と同じ量・同じ速度で行う。","en":"Give the same amount at the same speed as adults, whatever the child's weight or age.","jaRuby":"注入量《ちゅうにゅうりょう》や注入速度《ちゅうにゅうそくど》は、子《こ》どもの体重《たいじゅう》や年齢《ねんれい》にかかわらず、すべて成人《せいじん》と同《おな》じ量《りょう》・同《おな》じ速度《そくど》で行《おこな》う。"},{"ja":"経管栄養を行っている子どもは、抱っこや遊びなどのスキンシップを一切制限しなければならない。","en":"Children on tube feeding must not be hugged or play – all skin contact must be limited.","jaRuby":"経管栄養《けいかんえいよう》を行《おこな》っている子《こ》どもは、抱《だ》っこや遊《あそ》びなどのスキンシップを一切制限《いっさいせいげん》しなければならない。"},{"ja":"子どもは成長発達段階にあり、活発に動くことでチューブが抜けやすいため、テープの固定状態やチューブの長さを十分に確認する。","en":"Children are growing and move actively, so tubes come out easily; check the tape and tube length carefully.","jaRuby":"子《こ》どもは成長発達段階《せいちょうはったつだんかい》にあり、活発《かっぱつ》に動《うご》くことでチューブが抜《ぬ》けやすいため、テープの固定状態《こていじょうたい》やチューブの長《なが》さを十分《じゅうぶん》に確認《かくにん》する。"}],"answer":5,"expJa":"子どもは体動や手で引っ張ることによる自己抜去が起こりやすいため、固定テープの剥がれやチューブの挿入長の変化に注意する。激しく泣いているときは腹圧が上がり逆流・嘔吐しやすいため、あやして落ち着かせてから注入を開始する。","expEn":"Children often pull out tubes by moving or pulling with their hands, so watch for tape coming off and changes in tube length. When crying hard, abdominal pressure rises and reflux/vomiting is likely, so calm the child before starting.","jaRuby":"子《こ》どもの経管栄養《けいかんえいよう》における特徴《とくちょう》と留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"子《こ》どもは体動《たいどう》や手《て》で引《ひ》っ張《ぱ》ることによる自己抜去《じこばっきょ》が起《お》こりやすいため、固定《こてい》テープの剥《は》がれやチューブの挿入長《そうにゅうちょう》の変化《へんか》に注意《ちゅうい》する。激《はげ》しく泣《な》いているときは腹圧《ふくあつ》が上《あ》がり逆流《ぎゃくりゅう》・嘔吐《おうと》しやすいため、あやして落《お》ち着《つ》かせてから注入《ちゅうにゅう》を開始《かいし》する。"},{"id":"MC60","no":60,"chapter":"mc8","ja":"経管栄養に関連して起こる「感染」とその予防策として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about “infections” related to tube feeding and how to prevent them?","options":[{"ja":"栄養剤は細菌が繁殖しやすいため、開封後は速やかに使用し、作り置きや長時間の放置はしない。","en":"Bacteria grow easily in formula, so use it soon after opening; do not prepare it in advance or leave it out for a long time.","jaRuby":"栄養剤《えいようざい》は細菌《さいきん》が繁殖《はんしょく》しやすいため、開封後《かいふうご》は速《すみ》やかに使用《しよう》し、作《つく》り置《お》きや長時間《ちょうじかん》の放置《ほうち》はしない。"},{"ja":"経管栄養を行っている利用者は口から食事をしないため、口の中の細菌が減り、誤嚥性肺炎を起こすことはない。","en":"Tube-fed users do not eat by mouth, so mouth bacteria decrease and aspiration pneumonia never happens.","jaRuby":"経管栄養《けいかんえいよう》を行《おこな》っている利用者《りようしゃ》は口《くち》から食事《しょくじ》をしないため、口《くち》の中《なか》の細菌《さいきん》が減《へ》り、誤嚥性肺炎《ごえんせいはいえん》を起《お》こすことはない。"},{"ja":"栄養セット（イルリガートルや接続チューブ）は、水洗いさえもしないで1か月間そのまま使い続ける。","en":"Keep using the feeding set (irrigator bag and connecting tube) for a month without even rinsing it.","jaRuby":"栄養《えいよう》セット（イルリガートルや接続《せつぞく》チューブ）は、水洗《すいせん》いさえもしないで1か月間《げっかん》そのまま使《つか》い続《つづ》ける。"},{"ja":"下痢や嘔吐などの消化器感染症が疑われる場合でも、手袋を着用せず素手で排泄物の処理を行う。","en":"Even if a stomach infection (diarrhea, vomiting) is suspected, handle excretions with bare hands without gloves.","jaRuby":"下痢《げり》や嘔吐《おうと》などの消化器感染症《しょうかきかんせんしょう》が疑《うたが》われる場合《ばあい》でも、手袋《てぶくろ》を着用《ちゃくよう》せず素手《すで》で排泄物《はいせつぶつ》の処理《しょり》を行《おこな》う。"},{"ja":"胃ろうのろう孔（お腹の挿入部）の周囲は、不潔な手で毎日強くこすって刺激を与える。","en":"Rub hard around the gastrostomy opening every day with unclean hands to stimulate it.","jaRuby":"胃《い》ろうのろう孔《こう》（お腹《なか》の挿入部《そうにゅうぶ》）の周囲《しゅうい》は、不潔《ふけつ》な手《て》で毎日強《まいにちつよ》くこすって刺激《しげき》を与《あた》える。"}],"answer":1,"expJa":"栄養剤は栄養価が高く細菌が繁殖しやすいため、開封後は速やかに使用し、使用後の器具は十分に洗浄・消毒・乾燥させる。また、経管栄養の利用者も唾液の誤嚥による誤嚥性肺炎を防ぐため毎日の口腔ケアが不可欠である。","expEn":"Formula is rich in nutrients and bacteria grow easily, so use it soon after opening, and wash, disinfect and dry tools well after use. Tube-fed users also need daily oral care to prevent aspiration pneumonia from saliva.","jaRuby":"経管栄養《けいかんえいよう》に関連《かんれん》して起《お》こる「感染《かんせん》」とその予防策《よぼうさく》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"栄養剤《えいようざい》は栄養価《えいようか》が高《たか》く細菌《さいきん》が繁殖《はんしょく》しやすいため、開封後《かいふうご》は速《すみ》やかに使用《しよう》し、使用後《しようご》の器具《きぐ》は十分《じゅうぶん》に洗浄《せんじょう》・消毒《しょうどく》・乾燥《かんそう》させる。また、経管栄養《けいかんえいよう》の利用者《りようしゃ》も唾液《だえき》の誤嚥《ごえん》による誤嚥性肺炎《ごえんせいはいえん》を防《ふせ》ぐため毎日《まいにち》の口腔《こうくう》ケアが不可欠《ふかけつ》である。"},{"id":"MC61","no":61,"chapter":"mc8","ja":"経管栄養によって生じる危険（合併症・トラブル）の説明として、最も適切なものを1つ選びなさい。","en":"Which explains the dangers (complications / troubles) of tube feeding most appropriately?","options":[{"ja":"ダンピング症候群とは、栄養剤の注入速度が遅すぎるときにのみ起こる、高血圧と発熱の症状である。","en":"Dumping syndrome is high blood pressure and fever that happens only when feeding is too slow.","jaRuby":"ダンピング症候群《しょうこうぐん》とは、栄養剤《えいようざい》の注入速度《ちゅうにゅうそくど》が遅《おそ》すぎるときにのみ起《お》こる、高血圧《こうけつあつ》と発熱《はつねつ》の症状《しょうじょう》である。"},{"ja":"経鼻栄養チューブの先端が抜けて食道や咽頭にずれていても、そのまま注入して全く問題ない。","en":"Even if the nasal tube tip has slipped into the esophagus or pharynx, it is fine to keep feeding.","jaRuby":"経鼻栄養《けいびえいよう》チューブの先端《せんたん》が抜《ぬ》けて食道《しょくどう》や咽頭《いんとう》にずれていても、そのまま注入《ちゅうにゅう》して全《まった》く問題《もんだい》ない。"},{"ja":"胃から食道へ栄養剤が逆流し、それが気管に入ることで「誤嚥性肺炎」や「窒息」を引き起こす危険がある。","en":"Formula can flow back from the stomach to the esophagus and enter the trachea, causing “aspiration pneumonia” or “choking”.","jaRuby":"胃《い》から食道《しょくどう》へ栄養剤《えいようざい》が逆流《ぎゃくりゅう》し、それが気管《きかん》に入《はい》ることで「誤嚥性肺炎《ごえんせいはいえん》」や「窒息《ちっそく》」を引《ひ》き起《お》こす危険《きけん》がある。"},{"ja":"胃ろうのカテーテルが抜けてしまった場合、ろう孔（穴）は数日間は絶対に閉じないため、翌週に病院へ連絡すればよい。","en":"If a gastrostomy catheter comes out, the opening never closes for several days, so you can contact the hospital next week.","jaRuby":"胃《い》ろうのカテーテルが抜《ぬ》けてしまった場合《ばあい》、ろう孔《こう》（穴《あな》）は数日間《すうじつかん》は絶対《ぜったい》に閉《と》じないため、翌週《よくしゅう》に病院《びょういん》へ連絡《れんらく》すればよい。"},{"ja":"チューブが詰まった場合は、細い針金をチューブの中に突き刺して開通させる。","en":"If the tube is blocked, push a thin wire into the tube to open it.","jaRuby":"チューブが詰《つ》まった場合《ばあい》は、細《ほそ》い針金《はりがね》をチューブの中《なか》に突《つ》き刺《さ》して開通《かいつう》させる。"}],"answer":3,"expJa":"胃食道逆流による誤嚥性肺炎や窒息は経管栄養の重大なリスクである。胃ろうカテーテルが抜けた場合、ろう孔は数時間で縮小・閉鎖してしまうことがあるため、直ちに看護職員や医師へ連絡する。ダンピング症候群は急速に腸へ栄養剤が流れ込むことで冷や汗、動悸、めまい、下痢などを起こす症状である。","expEn":"Aspiration pneumonia and choking from reflux are serious risks of tube feeding. If a gastrostomy catheter comes out, the opening can shrink and close within a few hours, so contact a nurse or doctor immediately. Dumping syndrome is when formula flows into the intestine too quickly, causing cold sweat, palpitations, dizziness, diarrhea, etc.","jaRuby":"経管栄養《けいかんえいよう》によって生《しょう》じる危険《きけん》（合併症《がっぺいしょう》・トラブル）の説明《せつめい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"胃食道逆流《いしょくどうぎゃくりゅう》による誤嚥性肺炎《ごえんせいはいえん》や窒息《ちっそく》は経管栄養《けいかんえいよう》の重大《じゅうだい》なリスクである。胃《い》ろうカテーテルが抜《ぬ》けた場合《ばあい》、ろう孔《こう》は数時間《すうじかん》で縮小《しゅくしょう》・閉鎖《へいさ》してしまうことがあるため、直《ただ》ちに看護職員《かんごしょくいん》や医師《いし》へ連絡《れんらく》する。ダンピング症候群《しょうこうぐん》は急速《きゅうそく》に腸《ちょう》へ栄養剤《えいようざい》が流《なが》れ込《こ》むことで冷《ひ》や汗《あせ》、動悸《どうき》、めまい、下痢《げり》などを起《お》こす症状《しょうじょう》である。"},{"id":"MC62","no":62,"chapter":"mc8","ja":"経管栄養の注入中に、利用者が突然激しくせき込み、呼吸が苦しそうになり、口から栄養剤が逆流してきた場合の対応として、最も適切なものを1つ選びなさい。","en":"During tube feeding, the user suddenly coughs hard, breathing looks difficult, and formula comes back up from the mouth. What is the most appropriate response?","options":[{"ja":"クレンメを全開にして、残っている栄養剤を急いで全部流し込んでから看護職員を呼ぶ。","en":"Open the clamp fully, quickly pour in all the remaining formula, then call a nurse.","jaRuby":"クレンメを全開《ぜんかい》にして、残《のこ》っている栄養剤《えいようざい》を急《いそ》いで全部流《ぜんぶなが》し込《こ》んでから看護職員《かんごしょくいん》を呼《よ》ぶ。"},{"ja":"ベッドの頭側をすぐに水平（0度）に倒して仰向けに寝かせる。","en":"Lower the head of the bed flat (0 degrees) right away and lay the user on their back.","jaRuby":"ベッドの頭側《とうそく》をすぐに水平《すいへい》（0度《ど》）に倒《たお》して仰向《あおむ》けに寝《ね》かせる。"},{"ja":"せき込みが自然に止まるまで、注入を続けながら30分間見守る。","en":"Keep feeding and watch for 30 minutes until the coughing stops by itself.","jaRuby":"せき込《こ》みが自然《しぜん》に止《と》まるまで、注入《ちゅうにゅう》を続《つづ》けながら30分間見守《ふんかんみまも》る。"},{"ja":"経鼻チューブや胃ろうカテーテルを介護職員がその場で引き抜く。","en":"The care worker pulls out the nasal tube or gastrostomy catheter on the spot.","jaRuby":"経鼻《けいび》チューブや胃《い》ろうカテーテルを介護職員《かいごしょくいん》がその場《ば》で引《ひ》き抜《ぬ》く。"},{"ja":"直ちにクレンメを閉じて注入を中止し、顔を横に向ける（または吸引等の気道確保を行う）とともに、速やかに看護職員や医師へ連絡する。","en":"Immediately close the roller clamp to stop feeding, turn the face to the side (or secure the airway, e.g. by suctioning), and quickly contact a nurse or doctor.","jaRuby":"直《ただ》ちにクレンメを閉《と》じて注入《ちゅうにゅう》を中止《ちゅうし》し、顔《かお》を横《よこ》に向《む》ける（または吸引等《きゅういんとう》の気道確保《きどうかくほ》を行《おこな》う）とともに、速《すみ》やかに看護職員《かんごしょくいん》や医師《いし》へ連絡《れんらく》する。"}],"answer":5,"expJa":"注入中に激しいせき込みや呼吸困難、嘔吐・逆流が見られた場合は、誤嚥や窒息の危険があるため、直ちにクレンメを閉じて注入を中止し、顔を横に向けるなど気道を確保して、速やかに看護職員や医師へ連絡する。","expEn":"Hard coughing, difficulty breathing, or vomiting/reflux during feeding mean a risk of aspiration or choking. Immediately close the clamp to stop feeding, secure the airway (e.g. turn the face to the side), and quickly contact a nurse or doctor.","jaRuby":"経管栄養《けいかんえいよう》の注入中《ちゅうにゅうちゅう》に、利用者《りようしゃ》が突然激《とつぜんはげ》しくせき込《こ》み、呼吸《こきゅう》が苦《くる》しそうになり、口《くち》から栄養剤《えいようざい》が逆流《ぎゃくりゅう》してきた場合《ばあい》の対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"注入中《ちゅうにゅうちゅう》に激《はげ》しいせき込《こ》みや呼吸困難《こきゅうこんなん》、嘔吐《おうと》・逆流《ぎゃくりゅう》が見《み》られた場合《ばあい》は、誤嚥《ごえん》や窒息《ちっそく》の危険《きけん》があるため、直《ただ》ちにクレンメを閉《と》じて注入《ちゅうにゅう》を中止《ちゅうし》し、顔《かお》を横《よこ》に向《む》けるなど気道《きどう》を確保《かくほ》して、速《すみ》やかに看護職員《かんごしょくいん》や医師《いし》へ連絡《れんらく》する。"},{"id":"MC63","no":63,"chapter":"mc9","ja":"経管栄養に使用する器具・器材の清潔保持（洗浄・消毒）に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about keeping tube feeding tools clean (washing and disinfecting) is most appropriate?","options":[{"ja":"使用後の注入ボトル（イルリガートル）やカテーテルチップ型シリンジは、まず水や中性洗剤で栄養剤の汚れをしっかり洗い落としてから、消毒または乾燥させる。","en":"First wash formula off the used feeding bottle (irrigator) and catheter-tip syringe with water or mild detergent, then disinfect or dry them.","jaRuby":"使用後《しようご》の注入《ちゅうにゅう》ボトル（イルリガートル）やカテーテルチップ型《がた》シリンジは、まず水《みず》や中性洗剤《ちゅうせいせんざい》で栄養剤《えいようざい》の汚《よご》れをしっかり洗《あら》い落《お》としてから、消毒《しょうどく》または乾燥《かんそう》させる。"},{"ja":"栄養剤の油分やタンパク質が付着したまま消毒液（次亜塩素酸ナトリウムなど）に浸ければ、洗わなくても完全に消毒できる。","en":"If you soak tools in disinfectant (e.g. sodium hypochlorite) with the formula's fat and protein still on them, they are fully disinfected without washing.","jaRuby":"栄養剤《えいようざい》の油分《ゆぶん》やタンパク質《しつ》が付着《ふちゃく》したまま消毒液《しょうどくえき》（次亜塩素酸《じあえんそさん》ナトリウムなど）に浸《つ》ければ、洗《あら》わなくても完全《かんぜん》に消毒《しょうどく》できる。"},{"ja":"消毒液は、濃度が濃いほど良いため、目分量で原液をそのまま使用する。","en":"Stronger disinfectant is better, so use it undiluted, guessing by eye.","jaRuby":"消毒液《しょうどくえき》は、濃度《のうど》が濃《こ》いほど良《よ》いため、目分量《めぶんりょう》で原液《げんえき》をそのまま使用《しよう》する。"},{"ja":"消毒液に浸す際、チューブの内部に気泡（空気）が残っていても消毒効果は変わらない。","en":"Even if air bubbles remain inside the tube when soaking, the disinfecting effect does not change.","jaRuby":"消毒液《しょうどくえき》に浸《つ》す際《さい》、チューブの内部《ないぶ》に気泡《きほう》（空気《くうき》）が残《のこ》っていても消毒効果《しょうどくこうか》は変《か》わらない。"},{"ja":"洗浄・消毒後の物品は、湿った暗い箱の中に密閉して保管する。","en":"Store washed and disinfected items sealed in a damp, dark box.","jaRuby":"洗浄《せんじょう》・消毒後《しょうどくご》の物品《ぶっぴん》は、湿《しめ》った暗《くら》い箱《はこ》の中《なか》に密閉《みっぺい》して保管《ほかん》する。"}],"answer":1,"expJa":"器具に栄養剤のタンパク質や脂質が残っていると消毒効果が低下するため、まず水や中性洗剤で十分に洗浄してから、適切な濃度の消毒液に気泡が入らないよう浸漬し、乾燥させて清潔に保管する。","expEn":"Protein and fat from formula left on tools weaken disinfection. So first wash well with water or mild detergent, soak in disinfectant of the right strength without air bubbles, then dry and store cleanly.","jaRuby":"経管栄養《けいかんえいよう》に使用《しよう》する器具《きぐ》・器材《きざい》の清潔保持《せいけつほじ》（洗浄《せんじょう》・消毒《しょうどく》）に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"器具《きぐ》に栄養剤《えいようざい》のタンパク質《しつ》や脂質《ししつ》が残《のこ》っていると消毒効果《しょうどくこうか》が低下《ていか》するため、まず水《みず》や中性洗剤《ちゅうせいせんざい》で十分《じゅうぶん》に洗浄《せんじょう》してから、適切《てきせつ》な濃度《のうど》の消毒液《しょうどくえき》に気泡《きほう》が入《はい》らないよう浸漬《しんし》し、乾燥《かんそう》させて清潔《せいけつ》に保管《ほかん》する。"},{"id":"MC64","no":64,"chapter":"mc9","ja":"経管栄養を実施する前の「必要物品の準備」と「医師の指示書の確認」に関する記述として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about “preparing supplies” and “checking the doctor's instruction sheet” before tube feeding?","options":[{"ja":"栄養剤の賞味期限（使用期限）は確認する必要はない。","en":"You do not need to check the formula's expiry date.","jaRuby":"栄養剤《えいようざい》の賞味期限《しょうみきげん》（使用期限《しようきげん》）は確認《かくにん》する必要《ひつよう》はない。"},{"ja":"栄養剤の温度は、体温よりはるかに高い60度程度に熱しておく。","en":"Heat the formula to about 60°C, much higher than body temperature.","jaRuby":"栄養剤《えいようざい》の温度《おんど》は、体温《たいおん》よりはるかに高《たか》い60度程度《どていど》に熱《ねっ》しておく。"},{"ja":"栄養ボトルから接続チューブまでの間に空気が大量に入ったままの状態で、利用者のチューブに接続する。","en":"Connect to the user's tube with a lot of air still between the bottle and the connecting tube.","jaRuby":"栄養《えいよう》ボトルから接続《せつぞく》チューブまでの間《あいだ》に空気《くうき》が大量《たいりょう》に入《はい》ったままの状態《じょうたい》で、利用者《りようしゃ》のチューブに接続《せつぞく》する。"},{"ja":"医師の指示書と照らし合わせ、利用者氏名、栄養剤の種類と量、白湯の量、注入時間（滴下速度）、実施時間などを確認する。","en":"Compare with the doctor's instruction sheet and check the user's name, type and amount of formula, amount of warm water, feeding time (drip speed), time to give it, etc.","jaRuby":"医師《いし》の指示書《しじしょ》と照《て》らし合《あ》わせ、利用者氏名《りようしゃしめい》、栄養剤《えいようざい》の種類《しゅるい》と量《りょう》、白湯《さゆ》の量《りょう》、注入時間《ちゅうにゅうじかん》（滴下速度《てきかそくど》）、実施時間《じっしじかん》などを確認《かくにん》する。"},{"ja":"複数の利用者の経管栄養を準備する際、栄養ボトルに氏名を記入せず並べて置く。","en":"When preparing feeding for several users, line up the bottles without writing names on them.","jaRuby":"複数《ふくすう》の利用者《りようしゃ》の経管栄養《けいかんえいよう》を準備《じゅんび》する際《さい》、栄養《えいよう》ボトルに氏名《しめい》を記入《きにゅう》せず並《なら》べて置《お》く。"}],"answer":4,"expJa":"準備時は医師の指示書と照合し、利用者氏名、栄養剤の種類・量・使用期限、白湯の量、滴下速度などを確認する。接続チューブ内は栄養剤で満たし（プライミング）、空気を抜いてから接続する。","expEn":"When preparing, compare with the doctor's sheet and check the user's name, type/amount/expiry of formula, amount of warm water, drip speed, etc. Fill the connecting tube with formula (priming) to remove air before connecting.","jaRuby":"経管栄養《けいかんえいよう》を実施《じっし》する前《まえ》の「必要物品《ひつようぶっぴん》の準備《じゅんび》」と「医師《いし》の指示書《しじしょ》の確認《かくにん》」に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"準備時《じゅんびじ》は医師《いし》の指示書《しじしょ》と照合《しょうごう》し、利用者氏名《りようしゃしめい》、栄養剤《えいようざい》の種類《しゅるい》・量《りょう》・使用期限《しようきげん》、白湯《さゆ》の量《りょう》、滴下速度《てきかそくど》などを確認《かくにん》する。接続《せつぞく》チューブ内《ない》は栄養剤《えいようざい》で満《み》たし（プライミング）、空気《くうき》を抜《ぬ》いてから接続《せつぞく》する。"},{"id":"MC65","no":65,"chapter":"mc9","ja":"経管栄養を開始する直前の「体位の調整」と「留置部位の観察」として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate “position adjustment” and “observation of the tube site” just before starting tube feeding?","options":[{"ja":"逆流を防止するため、ベッドは水平（0度）のままにし、利用者の頭だけを高い枕で持ち上げた姿勢に整える。","en":"To prevent reflux, keep the bed flat (0 degrees) and raise only the user's head with a high pillow.","jaRuby":"逆流《ぎゃくりゅう》を防止《ぼうし》するため、ベッドは水平《すいへい》（0度《ど》）のままにし、利用者《りようしゃ》の頭《あたま》だけを高《たか》い枕《まくら》で持《も》ち上《あ》げた姿勢《しせい》に整《ととの》える。"},{"ja":"胃ろう部の観察では、発赤（赤み）、腫れ、浸出液、出血、痛み、カテーテルの抜けや破損がないかを確認する。","en":"At the gastrostomy site, check for redness, swelling, discharge, bleeding, pain, and whether the catheter has come out or is damaged.","jaRuby":"胃《い》ろう部《ぶ》の観察《かんさつ》では、発赤《ほっせき》（赤《あか》み）、腫《は》れ、浸出液《しんしゅつえき》、出血《しゅっけつ》、痛《いた》み、カテーテルの抜《ぬ》けや破損《はそん》がないかを確認《かくにん》する。"},{"ja":"経鼻経管栄養では、鼻の固定テープが剥がれてチューブが15センチメートル抜け出ていても、そのまま注入を開始する。","en":"In nasal tube feeding, start feeding even if the tape has come off and the tube has come out 15 cm.","jaRuby":"経鼻経管栄養《けいびけいかんえいよう》では、鼻《はな》の固定《こてい》テープが剥《は》がれてチューブが15センチメートル抜《ぬ》け出《で》ていても、そのまま注入《ちゅうにゅう》を開始《かいし》する。"},{"ja":"注入開始直前は、常に完全な水平仰臥位（平らに寝た姿勢）にしなければならない。","en":"Just before starting, the user must always lie completely flat on their back.","jaRuby":"注入開始直前《ちゅうにゅうかいしちょくぜん》は、常《つね》に完全《かんぜん》な水平仰臥位《すいへいぎょうがい》（平《たい》らに寝《ね》た姿勢《しせい》）にしなければならない。"},{"ja":"お腹が張っているか、吐き気がないかなどの確認は、注入がすべて終わってから行えばよい。","en":"Check for a swollen stomach or nausea only after all the feeding is finished.","jaRuby":"お腹《なか》が張《ぱ》っているか、吐《は》き気《き》がないかなどの確認《かくにん》は、注入《ちゅうにゅう》がすべて終《お》わってから行《おこな》えばよい。"}],"answer":2,"expJa":"注入開始前には、ベッドの頭側を30〜45度程度挙上した姿勢（ファーラー位など）に整え、胃ろう部の皮膚異常やカテーテルの抜け、経鼻チューブの固定状態、利用者の全身状態（腹部の張りや嘔気の有無など）を必ず確認する。","expEn":"Before starting, raise the head of the bed about 30–45 degrees (e.g. Fowler's position), and always check the skin at the gastrostomy site, whether the catheter has come out, how the nasal tube is fixed, and the user's general condition (swollen stomach, nausea, etc.).","jaRuby":"経管栄養《けいかんえいよう》を開始《かいし》する直前《ちょくぜん》の「体位《たいい》の調整《ちょうせい》」と「留置部位《りゅうちぶい》の観察《かんさつ》」として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"注入開始前《ちゅうにゅうかいしまえ》には、ベッドの頭側《とうそく》を30〜45度程度挙上《どていどきょじょう》した姿勢《しせい》（ファーラー位《い》など）に整《ととの》え、胃《い》ろう部《ぶ》の皮膚異常《ひふいじょう》やカテーテルの抜《ぬ》け、経鼻《けいび》チューブの固定状態《こていじょうたい》、利用者《りようしゃ》の全身状態《ぜんしんじょうたい》（腹部《ふくぶ》の張《ぱ》りや嘔気《おうき》の有無《うむ》など）を必《かなら》ず確認《かくにん》する。"},{"id":"MC66","no":66,"chapter":"mc9","ja":"液体栄養剤の滴下による経管栄養の実施手順（滴下速度の調整と観察）として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate procedure for drip-feeding liquid formula (adjusting drip speed and observing)?","options":[{"ja":"滴下速度は最初に一度合わせれば絶対に変化しないため、注入中は一度も訪室しなくてよい。","en":"Once set, the drip speed never changes, so you never need to visit the room during feeding.","jaRuby":"滴下速度《てきかそくど》は最初《さいしょ》に一度合《いちどあ》わせれば絶対《ぜったい》に変化《へんか》しないため、注入中《ちゅうにゅうちゅう》は一度《いちど》も訪室《ほうしつ》しなくてよい。"},{"ja":"クレンメを少しずつ緩め、時計を見ながら点滴筒（チャンバー）に落ちるしずくの数を数えて、指示された滴下速度に調整する。","en":"Loosen the roller clamp little by little, count the drops falling in the drip chamber while looking at a clock, and adjust to the instructed speed.","jaRuby":"クレンメを少《すこ》しずつ緩《ゆる》め、時計《とけい》を見《み》ながら点滴筒《てんてきとう》（チャンバー）に落《お》ちるしずくの数《かず》を数《かぞ》えて、指示《しじ》された滴下速度《てきかそくど》に調整《ちょうせい》する。"},{"ja":"利用者の体位が少し変わった後でも、滴下速度が速くなったり止まったりすることはない。","en":"Even after the user's position changes a little, the drip never speeds up or stops.","jaRuby":"利用者《りようしゃ》の体位《たいい》が少《すこ》し変《か》わった後《あと》でも、滴下速度《てきかそくど》が速《はや》くなったり止《と》まったりすることはない。"},{"ja":"予定の時間より遅れていることに気づいた場合、残りの栄養剤を5分間で一気に全開で流し込む。","en":"If you notice it is behind schedule, open the clamp fully and pour in the rest within 5 minutes.","jaRuby":"予定《よてい》の時間《じかん》より遅《おそ》れていることに気《き》づいた場合《ばあい》、残《のこ》りの栄養剤《えいようざい》を5分間《ふんかん》で一気《いっき》に全開《ぜんかい》で流《なが》し込《こ》む。"},{"ja":"点滴筒（チャンバー）の中は、常に栄養剤で満杯（100パーセント）になるまで満たしておく。","en":"Always fill the drip chamber completely (100%) with formula.","jaRuby":"点滴筒《てんてきとう》（チャンバー）の中《なか》は、常《つね》に栄養剤《えいようざい》で満杯《まんぱい》（100パーセント）になるまで満《み》たしておく。"}],"answer":2,"expJa":"時計を見ながらクレンメを操作して指示された滴下速度に調整する。利用者の体位の変化や栄養剤の残量によって滴下速度が変わることがあるため、注入中も定期的に訪室して滴下状態と利用者の様子を観察する。遅れていても一気に速度を上げてはならない。","expEn":"Adjust the clamp while looking at a clock to get the instructed drip speed. The speed can change with the user's position or the amount left, so visit regularly during feeding to check the drip and the user. Never suddenly speed up even if it is behind.","jaRuby":"液体栄養剤《えきたいえいようざい》の滴下《てきか》による経管栄養《けいかんえいよう》の実施手順《じっしてじゅん》（滴下速度《てきかそくど》の調整《ちょうせい》と観察《かんさつ》）として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"時計《とけい》を見《み》ながらクレンメを操作《そうさ》して指示《しじ》された滴下速度《てきかそくど》に調整《ちょうせい》する。利用者《りようしゃ》の体位《たいい》の変化《へんか》や栄養剤《えいようざい》の残量《ざんりょう》によって滴下速度《てきかそくど》が変《か》わることがあるため、注入中《ちゅうにゅうちゅう》も定期的《ていきてき》に訪室《ほうしつ》して滴下状態《てきかじょうたい》と利用者《りようしゃ》の様子《ようす》を観察《かんさつ》する。遅《おそ》れていても一気《いっき》に速度《そくど》を上《あ》げてはならない。"},{"id":"MC67","no":67,"chapter":"mc9","ja":"胃ろう・腸ろうによる「半固形化栄養剤」の注入手順と留意点として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate procedure and point for giving “semi-solid formula” through a gastrostomy or enterostomy?","options":[{"ja":"半固形化栄養剤は、通常の細い点滴用チューブから自然滴下でポタポタ落として注入する。","en":"Give semi-solid formula drop by drop by natural dripping through a normal thin IV tube.","jaRuby":"半固形化栄養剤《はんこけいかえいようざい》は、通常《つうじょう》の細《ほそ》い点滴用《てんてきよう》チューブから自然滴下《しぜんてきか》でポタポタ落《お》として注入《ちゅうにゅう》する。"},{"ja":"注入中に利用者がお腹の張りや苦痛を訴えても、手を止めずに最後まで一気に押し込む。","en":"Even if the user says their stomach feels full or painful, keep pushing it all in without stopping.","jaRuby":"注入中《ちゅうにゅうちゅう》に利用者《りようしゃ》がお腹《なか》の張《ぱ》りや苦痛《くつう》を訴《うった》えても、手《て》を止《と》めずに最後《さいご》まで一気《いっき》に押《お》し込《こ》む。"},{"ja":"半固形化栄養剤を使用する場合は、チューブ内に栄養剤が残らないため、終了後の白湯の注入は不要である。","en":"With semi-solid formula, no formula stays in the tube, so warm water is not needed afterwards.","jaRuby":"半固形化栄養剤《はんこけいかえいようざい》を使用《しよう》する場合《ばあい》は、チューブ内《ない》に栄養剤《えいようざい》が残《のこ》らないため、終了後《しゅうりょうご》の白湯《さゆ》の注入《ちゅうにゅう》は不要《ふよう》である。"},{"ja":"半固形化栄養剤を注入する際は、専用の加圧バッグやカテーテルチップ型シリンジなどを用い、利用者の表情や腹部の状態を観察しながら指示されたペースで注入する。","en":"Use a special pressure bag or catheter-tip syringe, and give it at the instructed pace while watching the user's face and abdomen.","jaRuby":"半固形化栄養剤《はんこけいかえいようざい》を注入《ちゅうにゅう》する際《さい》は、専用《せんよう》の加圧《かあつ》バッグやカテーテルチップ型《がた》シリンジなどを用《もち》い、利用者《りようしゃ》の表情《ひょうじょう》や腹部《ふくぶ》の状態《じょうたい》を観察《かんさつ》しながら指示《しじ》されたペースで注入《ちゅうにゅう》する。"},{"ja":"半固形化栄養剤は、鼻から入れた細い経鼻チューブに強い圧力をかけて注入する。","en":"Push semi-solid formula with strong pressure through a thin nasal tube.","jaRuby":"半固形化栄養剤《はんこけいかえいようざい》は、鼻《はな》から入《い》れた細《ほそ》い経鼻《けいび》チューブに強《つよ》い圧力《あつりょく》をかけて注入《ちゅうにゅう》する。"}],"answer":4,"expJa":"半固形化栄養剤は粘度が高いため自然滴下はできず、胃ろう・腸ろうからカテーテルチップ型シリンジや専用加圧バッグ等を用いて、指示された速度で注入する。終了後はチューブ内を清潔に保つため指示された白湯を流す。","expEn":"Semi-solid formula is thick and cannot drip naturally. Give it through the gastrostomy/enterostomy with a catheter-tip syringe or special pressure bag at the instructed speed. Afterwards, flush with the instructed warm water to keep the tube clean.","jaRuby":"胃《い》ろう・腸《ちょう》ろうによる「半固形化栄養剤《はんこけいかえいようざい》」の注入手順《ちゅうにゅうてじゅん》と留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"半固形化栄養剤《はんこけいかえいようざい》は粘度《ねんど》が高《たか》いため自然滴下《しぜんてきか》はできず、胃《い》ろう・腸《ちょう》ろうからカテーテルチップ型《がた》シリンジや専用加圧《せんようかあつ》バッグ等《とう》を用《もち》いて、指示《しじ》された速度《そくど》で注入《ちゅうにゅう》する。終了後《しゅうりょうご》はチューブ内《ない》を清潔《せいけつ》に保《たも》つため指示《しじ》された白湯《さゆ》を流《なが》す。"},{"id":"MC68","no":68,"chapter":"mc9","ja":"経管栄養の注入終了時および終了後の手順と留意点として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate procedure and point at the end of and after tube feeding?","options":[{"ja":"栄養剤の注入が終わった後は、白湯を流すと逆流の原因になるため、白湯は流さずにそのままチューブを閉じる。","en":"After the formula is finished, do not flush warm water (it causes reflux); just close the tube.","jaRuby":"栄養剤《えいようざい》の注入《ちゅうにゅう》が終《お》わった後《あと》は、白湯《さゆ》を流《なが》すと逆流《ぎゃくりゅう》の原因《げんいん》になるため、白湯《さゆ》は流《なが》さずにそのままチューブを閉《と》じる。"},{"ja":"注入が終了したら、直ちにベッドを平ら（0度）に戻して利用者をうつ伏せに寝かせる。","en":"When feeding ends, immediately lower the bed flat (0 degrees) and lay the user face down.","jaRuby":"注入《ちゅうにゅう》が終了《しゅうりょう》したら、直《ただ》ちにベッドを平《たい》ら（0度《ど》）に戻《もど》して利用者《りようしゃ》をうつ伏《ぶ》せに寝《ね》かせる。"},{"ja":"カテーテルから接続チューブを外す際は、カテーテルの栓を開けっ放しにして胃の内容物をシーツに出す。","en":"When removing the connecting tube, leave the catheter cap open and let the stomach contents come out onto the sheet.","jaRuby":"カテーテルから接続《せつぞく》チューブを外《はず》す際《さい》は、カテーテルの栓《せん》を開《あ》けっ放《ぱな》しにして胃《い》の内容物《ないようぶつ》をシーツに出《だ》す。"},{"ja":"逆流を防ぐため、注入終了後も30分〜1時間程度は上体を起こした姿勢（挙上した状態）を保つよう配慮する（医師等の指示に従う）。","en":"To prevent reflux, keep the upper body raised for about 30 minutes to 1 hour after feeding (follow the doctor's instructions).","jaRuby":"逆流《ぎゃくりゅう》を防《ふせ》ぐため、注入終了後《ちゅうにゅうしゅうりょうご》も30分《ふん》〜1時間程度《じかんていど》は上体《じょうたい》を起《お》こした姿勢《しせい》（挙上《きょじょう》した状態《じょうたい》）を保《たも》つよう配慮《はいりょ》する（医師等《いしとう》の指示《しじ》に従《したが》う）。"},{"ja":"注入終了後は、利用者に嘔気や腹痛、呼吸の変化がないかを確認する必要はない。","en":"After feeding, there is no need to check for nausea, stomach pain or changes in breathing.","jaRuby":"注入終了後《ちゅうにゅうしゅうりょうご》は、利用者《りようしゃ》に嘔気《おうき》や腹痛《ふくつう》、呼吸《こきゅう》の変化《へんか》がないかを確認《かくにん》する必要《ひつよう》はない。"}],"answer":4,"expJa":"栄養剤の注入終了後は、指示された量の白湯を流してチューブ内を洗浄し、栓を閉じる。胃食道逆流を防ぐため、注入終了後も30分〜1時間程度は上体を起こした姿勢（30〜45度挙上）を保つ。","expEn":"After feeding, flush the instructed amount of warm water to clean the tube and close the cap. To prevent reflux, keep the upper body raised (30–45 degrees) for about 30 minutes to 1 hour after feeding.","jaRuby":"経管栄養《けいかんえいよう》の注入終了時《ちゅうにゅうしゅうりょうじ》および終了後《しゅうりょうご》の手順《てじゅん》と留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"栄養剤《えいようざい》の注入終了後《ちゅうにゅうしゅうりょうご》は、指示《しじ》された量《りょう》の白湯《さゆ》を流《なが》してチューブ内《ない》を洗浄《せんじょう》し、栓《せん》を閉《と》じる。胃食道逆流《いしょくどうぎゃくりゅう》を防《ふせ》ぐため、注入終了後《ちゅうにゅうしゅうりょうご》も30分《ふん》〜1時間程度《じかんていど》は上体《じょうたい》を起《お》こした姿勢《しせい》（30〜45度挙上《どきょじょう》）を保《たも》つ。"},{"id":"MC69","no":69,"chapter":"mc9","ja":"経管栄養を実施している利用者に必要な日常生活のケア（口腔ケア、鼻腔ケア、胃ろう部のスキンケアなど）として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate daily care for tube-fed users (oral care, nose care, skin care around the gastrostomy, etc.)?","options":[{"ja":"経鼻経管栄養の固定テープは、同じ場所に1か月間貼りっぱなしにして皮膚を休ませない。","en":"Leave the nasal tube tape in the same place for a month without letting the skin rest.","jaRuby":"経鼻経管栄養《けいびけいかんえいよう》の固定《こてい》テープは、同《おな》じ場所《ばしょ》に1か月間貼《げっかんは》りっぱなしにして皮膚《ひふ》を休《やす》ませない。"},{"ja":"口から食事を摂っていない利用者であっても、唾液の分泌が減って口の中に細菌が繁殖しやすいため、毎日の口腔ケアが重要である。","en":"Even if the user does not eat by mouth, saliva decreases and bacteria grow easily, so daily oral care is important.","jaRuby":"口《くち》から食事《しょくじ》を摂《と》っていない利用者《りようしゃ》であっても、唾液《だえき》の分泌《ぶんぴつ》が減《へ》って口《くち》の中《なか》に細菌《さいきん》が繁殖《はんしょく》しやすいため、毎日《まいにち》の口腔《こうくう》ケアが重要《じゅうよう》である。"},{"ja":"胃ろうのろう孔周囲の皮膚は、石けんを使わずに消毒用アルコールで毎日強くこすり洗いする。","en":"Scrub the skin around the gastrostomy hard every day with rubbing alcohol instead of soap.","jaRuby":"胃《い》ろうのろう孔周囲《こうしゅうい》の皮膚《ひふ》は、石《せっ》けんを使《つか》わずに消毒用《しょうどくよう》アルコールで毎日強《まいにちつよ》くこすり洗《あら》いする。"},{"ja":"胃ろうのストッパー（外部バンパー）と皮膚の間は、隙間が全くないように強く締め付けて圧迫しておく。","en":"Tighten the gastrostomy stopper (external bumper) strongly against the skin so there is no gap.","jaRuby":"胃《い》ろうのストッパー（外部《がいぶ》バンパー）と皮膚《ひふ》の間《あいだ》は、隙間《すきま》が全《まった》くないように強《つよ》く締《し》め付《つ》けて圧迫《あっぱく》しておく。"},{"ja":"便秘を防ぐための腹部マッサージや日中の離床・運動は、経管栄養の利用者にはすべて禁止されている。","en":"Abdominal massage to prevent constipation and getting up and moving in the daytime are all forbidden for tube- fed users.","jaRuby":"便秘《べんぴ》を防《ふせ》ぐための腹部《ふくぶ》マッサージや日中《にっちゅう》の離床《りしょう》・運動《うんどう》は、経管栄養《けいかんえいよう》の利用者《りようしゃ》にはすべて禁止《きんし》されている。"}],"answer":2,"expJa":"口から食べていない利用者ほど自浄作用が低下して口腔内細菌が増えやすいため、誤嚥性肺炎予防のために口腔ケアが極めて重要である。経鼻テープは皮膚かぶれを防ぐため定期的に貼り替え、胃ろう周囲は石けんをよく泡立てて優しく洗い、ストッパーの下には1〜1.5センチメートル程度の適度なゆとりがあるか確認する。","expEn":"Users who do not eat by mouth have less self-cleaning action, and mouth bacteria increase, so oral care is very important to prevent aspiration pneumonia. Change nasal tape regularly to prevent skin rash, wash around the gastrostomy gently with well-lathered soap, and check there is a suitable gap of about 1–1.5 cm under the stopper.","jaRuby":"経管栄養《けいかんえいよう》を実施《じっし》している利用者《りようしゃ》に必要《ひつよう》な日常生活《にちじょうせいかつ》のケア（口腔《こうくう》ケア、鼻腔《びくう》ケア、胃《い》ろう部《ぶ》のスキンケアなど）として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"口《くち》から食《た》べていない利用者《りようしゃ》ほど自浄作用《じじょうさよう》が低下《ていか》して口腔内細菌《こうくうないさいきん》が増《ふ》えやすいため、誤嚥性肺炎予防《ごえんせいはいえんよぼう》のために口腔《こうくう》ケアが極《きわ》めて重要《じゅうよう》である。経鼻《けいび》テープは皮膚《ひふ》かぶれを防《ふせ》ぐため定期的《ていきてき》に貼《は》り替《か》え、胃《い》ろう周囲《しゅうい》は石《せっ》けんをよく泡立《あわだ》てて優《やさ》しく洗《あら》い、ストッパーの下《した》には1〜1.5センチメートル程度《ていど》の適度《てきど》なゆとりがあるか確認《かくにん》する。"},{"id":"MC70","no":70,"chapter":"mc9","ja":"経管栄養に関する「報告および記録」の記述として、最も適切なものを1つ選びなさい。","en":"Which statement about “reports and records” for tube feeding is most appropriate?","options":[{"ja":"実施日時、注入した栄養剤の種類と量、白湯の量、注入開始・終了時刻、利用者の状態（バイタルサイン、腹部症状、排便の有無、皮膚の状態など）を正確に記録・報告する。","en":"Record and report accurately: date and time, type and amount of formula, amount of warm water, start and end times, and the user's condition (vital signs, abdominal symptoms, bowel movements, skin condition, etc.).","jaRuby":"実施日時《じっしにちじ》、注入《ちゅうにゅう》した栄養剤《えいようざい》の種類《しゅるい》と量《りょう》、白湯《さゆ》の量《りょう》、注入開始《ちゅうにゅうかいし》・終了時刻《しゅうりょうじこく》、利用者《りようしゃ》の状態《じょうたい》（バイタルサイン、腹部症状《ふくぶしょうじょう》、排便《はいべん》の有無《うむ》、皮膚《ひふ》の状態《じょうたい》など）を正確《せいかく》に記録《きろく》・報告《ほうこく》する。"},{"ja":"注入前に胃ろう部から膿（うみ）のような浸出液や出血が見られたが、少量だったので記録も報告もしない。","en":"Before feeding, pus-like discharge and bleeding were seen at the gastrostomy, but it was small, so it was neither recorded nor reported.","jaRuby":"注入前《ちゅうにゅうまえ》に胃《い》ろう部《ぶ》から膿《うみ》のような浸出液《しんしゅつえき》や出血《しゅっけつ》が見《み》られたが、少量《しょうりょう》だったので記録《きろく》も報告《ほうこく》もしない。"},{"ja":"予定していた量の半分しか注入できずに中止した場合でも、記録には「全量注入完了」と書く。","en":"Even if only half the planned amount was given and feeding was stopped, write “full amount completed” in the record.","jaRuby":"予定《よてい》していた量《りょう》の半分《はんぶん》しか注入《ちゅうにゅう》できずに中止《ちゅうし》した場合《ばあい》でも、記録《きろく》には「全量注入完了《ぜんりょうちゅうにゅうかんりょう》」と書《か》く。"},{"ja":"記録は介護職員個人のメモ帳にだけ書いて持ち帰り、事業所の記録簿には記載しない。","en":"Write records only in the care worker's personal notebook, take it home, and do not write in the facility's record book.","jaRuby":"記録《きろく》は介護職員個人《かいごしょくいんこじん》のメモ帳《ちょう》にだけ書《か》いて持《も》ち帰《かえ》り、事業所《じぎょうしょ》の記録簿《きろくぼ》には記載《きさい》しない。"},{"ja":"看護職員への報告は、1か月に1回だけ口頭で行えば十分である。","en":"Reporting to the nurse verbally once a month is enough.","jaRuby":"看護職員《かんごしょくいん》への報告《ほうこく》は、1か月《つき》に1回《かい》だけ口頭《こうとう》で行《おこな》えば十分《じゅうぶん》である。"}],"answer":1,"expJa":"経管栄養の実施後は、注入した栄養剤・白湯の量、開始・終了時刻、注入前後のバイタルサインや腹部症状、排便状況、ろう孔や鼻腔の皮膚状態などを正確に記録し、看護職員へ報告する。異常があれば直ちに報告する。","expEn":"After tube feeding, accurately record the amount of formula and warm water given, start and end times, vital signs and abdominal symptoms before and after, bowel movements, and the skin around the opening or nose, and report to the nurse. Report anything abnormal immediately.","jaRuby":"経管栄養《けいかんえいよう》に関《かん》する「報告《ほうこく》および記録《きろく》」の記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"経管栄養《けいかんえいよう》の実施後《じっしご》は、注入《ちゅうにゅう》した栄養剤《えいようざい》・白湯《さゆ》の量《りょう》、開始《かいし》・終了時刻《しゅうりょうじこく》、注入前後《ちゅうにゅうぜんご》のバイタルサインや腹部症状《ふくぶしょうじょう》、排便状況《はいべんじょうきょう》、ろう孔《こう》や鼻腔《びくう》の皮膚状態《ひふじょうたい》などを正確《せいかく》に記録《きろく》し、看護職員《かんごしょくいん》へ報告《ほうこく》する。異常《いじょう》があれば直《ただ》ちに報告《ほうこく》する。"}],"nameRuby":"医療的《いりょうてき》ケア","descRuby":"喀痰吸引《かくたんきゅういん》・経管栄養《けいかんえいよう》などの5択問題《たくもんだい》（全《すべ》70問《もん》）","noteJaRuby":"この問題《もんだい》の内容《ないよう》は、手順《てじゅん》や数値《すうち》の一般的《いっぱんてき》な目安《めやす》です。実際《じっさい》のケアは、医師《いし》の指示書《しじしょ》と施設《しせつ》の手順《てじゅん》に従《したが》い、看護職員《かんごしょくいん》に確認《かくにん》してください。"}]};</script>
<script>
(function(){
"use strict";

/* ---------- ホーム画面にインストールできるようにする ----------
   https で開いたときだけ manifest と service worker をつなぐ。
   1ファイルのまま file:// で開いた場合は何もしないので、
   これまでどおりファイルを配る使い方も変わらない。
   Install support is wired up only on http(s); opening the single file
   directly (file://) keeps working exactly as before. */
(function installable(){
  var p = location.protocol;
  if(p !== "https:" && p !== "http:") return;
  function link(rel, href, extra){
    var el = document.createElement("link");
    el.rel = rel; el.href = href;
    if(extra) for(var k in extra) el.setAttribute(k, extra[k]);
    document.head.appendChild(el);
  }
  link("manifest", "manifest.webmanifest");
  link("icon", "icon-192.png", { sizes:"192x192", type:"image/png" });
  link("apple-touch-icon", "apple-touch-icon.png");
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();

var V = window.VOCAB_DATA, CF = window.CONFUSABLES, UI = window.UI_STRINGS;
var WORDS = V.words, BYID = {};
WORDS.forEach(function(w){ BYID[w.id] = w; });
var GROUPS = {};
CF.groups.forEach(function(g){ GROUPS[g.id] = g; });
/* カテゴリ・試験科目・難易度の表示名 → ふりがな付き */
var LABEL_RUBY = {};
V.categories.forEach(function(c){ LABEL_RUBY[c.name] = c.nameRuby; });
V.subjects.forEach(function(x){ LABEL_RUBY[x.name] = x.nameRuby; });
V.levels.forEach(function(l){ LABEL_RUBY[l.label] = l.labelRuby; });
function lab(name){ return rj(name, LABEL_RUBY[name]); }

/* ---------- storage ---------- */
var KEY = "kaigoWords.v1";
var LOG_MAX = 20000;              /* 解答履歴の上限。超えたら古いものから捨てる */
var REVIEW_CLEAR = 3;             /* 何回連続で正解したら「まちがえたことば」から外すか */
var DEF = { version:2,
  settings:{ showRuby:true, showRomaji:true, showEnglish:true, fontSize:"m", dailyGoal:10 },
  progress:{}, log:[], history:[], streak:{ days:0, lastDate:"" }, studyDates:[], qprog:{} };
/* 学習した日の一覧（YYYY-MM-DD・重複なし・昇順）。「学習した日数」はこの件数。
   古いデータには無いので、残っている記録の日付から作る。 */
function isDate(s){ return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function uniqDates(a){
  var m = {}; a.forEach(function(s){ if(isDate(s)) m[s] = 1; });
  return Object.keys(m).sort();
}
function deriveStudyDates(o){
  var a = Array.isArray(o.studyDates) ? o.studyDates.slice() : [];
  (o.history||[]).forEach(function(h){ if(h && h.answered) a.push(h.date); });
  (o.log||[]).forEach(function(e){ if(e && e.t) a.push(String(e.t).slice(0,10)); });
  for(var k in (o.progress||{})){ var q = o.progress[k]; a.push(q.first); a.push(q.last); }
  if(o.streak && o.streak.lastDate) a.push(o.streak.lastDate);
  return uniqDates(a);
}
var S = load();
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    var o = JSON.parse(raw);
    var d = JSON.parse(JSON.stringify(DEF));
    o.settings = Object.assign(d.settings, o.settings||{});
    o.progress = o.progress||{}; o.history = o.history||[]; o.streak = o.streak||d.streak;
    o.log = o.log||[];
    o.qprog = (o.qprog && typeof o.qprog === "object") ? o.qprog : {};
    o.studyDates = deriveStudyDates(o);
    if(!o.version || o.version < 2){          /* v1 → v2 移行 */
      for(var k in o.progress){
        var q = o.progress[k];
        if(q.run === undefined) q.run = 0;
        if(q.inReview === undefined) q.inReview = (q.wrong > 0 && q.correct < q.seen);
        if(!q.first) q.first = q.last || "";
      }
      o.version = 2;
      o.migrated = true;      /* 読み込み後すぐ保存して移行を確定させる */
    }
    return o;
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return n<10?"0"+n:""+n; }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

/* ---------- i18n helpers ---------- */
function T(path){
  var o = UI, p = path.split(".");
  for(var i=0;i<p.length;i++){ if(!o) return {ja:path,en:""}; o = o[p[i]]; }
  return o || {ja:path,en:""};
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 《》記法をふりがな付きHTMLに変換する。設定がオフのときは《》を取り除くだけ。 */
function ruby(str){
  var out = "", i = 0, re = /([\u4e00-\u9fff\u3005]+)\u300a([^\u300b]+)\u300b/g, m;
  while((m = re.exec(str))){
    out += esc(str.slice(i, m.index));
    out += S.settings.showRuby
      ? "<ruby>" + esc(m[1]) + "<rt>" + esc(m[2]) + "</rt></ruby>"
      : esc(m[1]);
    i = m.index + m[0].length;
  }
  out += esc(str.slice(i));
  return out;
}
function rubyCls(){ return S.settings.showRuby ? " hasruby" : ""; }
/* 日本語をふりがな付きで描く。ruby版がなければそのまま表示する。 */
function rj(plain, rubyStr){ return ruby(rubyStr || plain || ""); }
/* 画面文言（ui_strings.json）の日本語 */
function tj(path){ var o = T(path); return rj(o.ja, o.jaRuby); }
/* {n} などの差し込みがある文言。ふりがな側にも同じ差し替えをかける。 */
function tjn(path, map){
  var o = T(path), ja = o.ja, jr2 = o.jaRuby || o.ja;
  for(var k in map){
    ja = ja.split("{"+k+"}").join(map[k]);
    jr2 = jr2.split("{"+k+"}").join(map[k]);
  }
  return rj(ja, jr2);
}
function tjnPlain(path, map){
  var o = T(path), ja = o.ja;
  for(var k in map) ja = ja.split("{"+k+"}").join(map[k]);
  return ja;
}
/* alert / confirm 用の英文（ふりがなを入れられないため素のまま使う） */
function enPlain(path, map){
  var en = T(path).en || "";
  for(var k in map) en = en.split("{"+k+"}").join(map[k]);
  return en;
}
/* {n} などの差し込みを、日本語・ふりがな・英語のすべてに同じように入れて返す。
   Fills {n}-style placeholders in the Japanese, the furigana and the English alike. */
function fill(path, map){
  var o = T(path), ja = o.ja, jr = o.jaRuby || o.ja, en = o.en || "";
  for(var k in map){
    var v = String(map[k]);
    ja = ja.split("{"+k+"}").join(v);
    jr = jr.split("{"+k+"}").join(v);
    en = en.split("{"+k+"}").join(v);
  }
  return { ja:ja, jaRuby:jr, en:en };
}
/* お知らせ文は必ず日英で出す。設定「英語を見せる」がオフのときは日本語だけになる。
   Notices are always bilingual (English hidden only by the "show English" setting). */
function tjb(path, map){ return bi(map ? fill(path, map) : T(path)); }
/* 「まちがえ3回 / あと2回」のような数つきの表示。日本語の下に英語をもう1行出す。
   parts は fill() の戻り値か、そのまま出す文字列（％など）。 */
function statLine(parts){
  var ja = parts.map(function(p){
    return typeof p === "string" ? esc(p) : rj(p.ja, p.jaRuby);
  }).join(" / ");
  var out = '<span class="en">'+ja+'</span>';
  if(S.settings.showEnglish){
    var en = parts.map(function(p){
      return typeof p === "string" ? esc(p) : esc(p.en || p.ja);
    }).join(" / ");
    out += '<span class="en">'+en+'</span>';
  }
  return out;
}
/* アプリのコードに直接書いた日本語（ふりがなは app_literals.json） */
function L(text){ return rj(text, (window.APP_LITERALS || {})[text]); }

function bi(o, cls){
  if(!o) return "";
  var en = S.settings.showEnglish && o.en ? '<span class="en">'+esc(o.en)+'</span>' : "";
  return '<span class="'+(cls||"")+'">'+rj(o.ja, o.jaRuby)+en+'</span>';
}
function biRaw(ja, en, cls){ return bi({ja:ja,en:en}, cls); }
/* 問題文・選択肢の英訳は、答える前には出さない。
   English for the question content is withheld until the learner answers
   (or deliberately asks for it with the hint button). */
function qEn(){
  if(!S.settings.showEnglish) return false;
  if(!SES) return true;
  return !!(SES.revealed || SES.hint >= 1);
}
/* 英語のヒントは2段階：1回目＝問題文だけ英語、2回目＝選択肢もすべて英語 */
function optEn(){
  if(!S.settings.showEnglish) return false;
  if(!SES) return true;
  return !!(SES.revealed || SES.hint >= 2);
}
function hintBlock(){
  if(SES.revealed || !S.settings.showEnglish) return "";
  var lv = SES.hint || 0;
  var s = "";
  if(lv >= 1) s += '<div class="muted center">💡 '+tj(lv>=2?"quiz.hintUsed2":"quiz.hintUsed")+' / '+
    esc(T(lv>=2?"quiz.hintUsed2":"quiz.hintUsed").en)+'</div>';
  if(lv < 2) s += '<button class="btn ghost" type="button" id="hintBtn">'+
    bi(T(lv===0?"quiz.showEnglishHint":"quiz.showEnglishHint2"))+'</button>';
  return s;
}

/* ---------- Leitner ---------- */
var INTERVAL = [0,1,3,7,21];
function prog(id){ return S.progress[id]; }
/* 解答を1件ぶん履歴に残す。ことばの問題も、設問の指示を読む問題も同じ形で残す。 */
function logAnswer(rec){
  var t = today();
  if(S.studyDates[S.studyDates.length-1] !== t){ S.studyDates.push(t); S.studyDates = uniqDates(S.studyDates); }
  S.log.push(rec);
  if(S.log.length > LOG_MAX) S.log = S.log.slice(-LOG_MAX);
}
function stamp(){
  var d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
         pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
function record(id, correct, info){
  info = info || {};
  var p = S.progress[id] || { box:0, seen:0, correct:0, wrong:0, run:0,
                              inReview:false, first:"", last:"", due:"" };
  if(!p.first) p.first = today();
  p.seen++;
  if(correct){
    p.correct++; p.box = Math.min(4, p.box+1); p.run = (p.run||0) + 1;
    /* 「まちがえたことば」は、正解が REVIEW_CLEAR 回つづいたら自動で外れる */
    if(p.inReview && p.run >= REVIEW_CLEAR) p.inReview = false;
  } else {
    p.wrong++; p.box = p.box >= 2 ? 1 : 0; p.run = 0; p.inReview = true;
  }
  p.last = today();
  p.due = addDays(INTERVAL[p.box]);
  S.progress[id] = p;
  logAnswer({ t:stamp(), k:"word", id:id, m:info.m||"", f:info.f||"",
              ok:correct?1:0, sel:info.sel||"", gid:info.gid||"", run:p.run });

/* ---------- 保存データの読み込み（復元） ----------
   書き出した「すべてのデータ（JSON）」を、いまの記録と合わせて取り込む。
   数えた回数は多いほうを残し、今の状態（box・連続正解・リスト在否）は
   日付が新しいほうを採る。設定は端末のものをそのまま使う。
   Merging a backup: counts keep the larger value, the current state comes
   from whichever side is newer, and the device's own settings are untouched. */
function normalizeBackup(o){
  if(!o || typeof o !== "object" || !o.progress || typeof o.progress !== "object") return null;
  if(!Array.isArray(o.log)) o.log = [];
  if(!o.qprog || typeof o.qprog !== "object") o.qprog = {};
  if(!Array.isArray(o.history)) o.history = [];
  if(!o.streak || typeof o.streak !== "object") o.streak = { days:0, lastDate:"" };
  o.studyDates = deriveStudyDates(o);
  if(!o.version || o.version < 2){        /* 古い形式(v1)のファイルも取り込めるようにする */
    for(var k in o.progress){
      var q = o.progress[k];
      if(q.run === undefined) q.run = 0;
      if(q.inReview === undefined) q.inReview = (q.wrong > 0 && q.correct < q.seen);
      if(!q.first) q.first = q.last || "";
    }
    o.version = 2;
  }
  return o;
}
/* 同じ解答を二重に数えないための見分け方 */
function logKey(e){ return [e.t, e.k||"", e.id||"", e.f||"", e.sel||""].join(""); }
/* ことばごとの記録を、項目の順番までそろえた形にする（比べられるようにするため） */
function progShape(q){
  q = q || {};
  return { seen:q.seen||0, correct:q.correct||0, wrong:q.wrong||0, box:q.box||0,
           run:q.run||0, inReview:!!q.inReview, first:q.first||"", last:q.last||"", due:q.due||"" };
}
function mergeBackup(inc){
  var changedWords = 0, addedLogs = 0;

  for(var id in inc.progress){
    var had = !!S.progress[id];
    var a = progShape(S.progress[id]), b = progShape(inc.progress[id]);
    /* 今の状態（box・連続正解・リスト在否）は、日付が新しいほうから採る */
    var newer = !had ? b : ((b.last||"") > (a.last||"") ? b : a);
    var m = {
      seen:    Math.max(a.seen||0,    b.seen||0),
      correct: Math.max(a.correct||0, b.correct||0),
      wrong:   Math.max(a.wrong||0,   b.wrong||0),
      box:     Math.max(a.box||0,     b.box||0),
      run:      newer.run || 0,
      inReview: !!newer.inReview,
      first: [a.first, b.first].filter(Boolean).sort()[0] || "",
      last:  (a.last||"") > (b.last||"") ? a.last : (b.last||""),
      due:   newer.due || ""
    };
    /* 出題回数が正解数＋誤答数を下回らないようにそろえる */
    if(m.correct + m.wrong > m.seen) m.seen = m.correct + m.wrong;
    if(JSON.stringify(m) !== JSON.stringify(a)) changedWords++;
    S.progress[id] = m;
  }

  var have = {};
  S.log.forEach(function(e){ have[logKey(e)] = 1; });
  inc.log.forEach(function(e){
    var k = logKey(e);
    if(have[k]) return;
    have[k] = 1; S.log.push(e); addedLogs++;
  });
  S.log.sort(function(x, y){ return (x.t||"") < (y.t||"") ? -1 : (x.t||"") > (y.t||"") ? 1 : 0; });
  if(S.log.length > LOG_MAX) S.log = S.log.slice(-LOG_MAX);

  var byDate = {};
  S.history.forEach(function(h){ byDate[h.date] = { date:h.date, answered:h.answered||0, correct:h.correct||0 }; });
  inc.history.forEach(function(h){
    if(!h || !h.date) return;
    var cur = byDate[h.date];
    if(!cur) byDate[h.date] = { date:h.date, answered:h.answered||0, correct:h.correct||0 };
    else { cur.answered = Math.max(cur.answered, h.answered||0);
           cur.correct  = Math.max(cur.correct,  h.correct||0); }
  });
  S.history = Object.keys(byDate).sort().map(function(d){ return byDate[d]; }).slice(-90);

  var si = inc.streak || {};
  if((si.lastDate||"") > (S.streak.lastDate||"")) S.streak = { days:si.days||0, lastDate:si.lastDate||"" };
  else if((si.lastDate||"") === (S.streak.lastDate||"")) S.streak.days = Math.max(S.streak.days||0, si.days||0);
  S.studyDates = uniqDates(S.studyDates.concat(inc.studyDates||[]));   /* 学習した日は両方を合わせる */
  /* 実務者研修の問題（医療的ケアなど）の記録：回数は多いほう、最後の正誤は新しいほう */
  for(var qk in (inc.qprog||{})){
    var a = S.qprog[qk], b = inc.qprog[qk];
    if(!a){ S.qprog[qk] = b; continue; }
    var nb = { seen:Math.max(a.seen||0,b.seen||0), correct:Math.max(a.correct||0,b.correct||0),
               wrong:Math.max(a.wrong||0,b.wrong||0) };
    var newer = (b.last||"") > (a.last||"") ? b : a;
    nb.last = newer.last||""; nb.lastOk = newer.lastOk ? 1 : 0;
    S.qprog[qk] = nb;
  }

  return { w:changedWords, l:addedLogs };
}

var FILTER = { cat:0, subject:"", level:0 };
function filtered(){
  return WORDS.filter(function(w){
    if(FILTER.cat && w.categoryId !== FILTER.cat) return false;
    if(FILTER.subject && w.subject !== FILTER.subject) return false;
    if(FILTER.level && w.level !== FILTER.level) return false;
    return true;
  });
}
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function gapKey(w){
  if(w.exampleJa.indexOf(w.term) >= 0) return w.term;
  var s = w.term.replace(/(する|な)$/,"");
  return w.exampleJa.indexOf(s) >= 0 ? s : null;
}
function buildQueue(mode, n){
  var pool = filtered();
  if(mode === "drill") pool = pool.filter(function(w){ return !!w.exampleGapRuby; });
  if(mode === "review"){
    pool = pool.filter(function(w){ return inReview(w.id); });
    pool.sort(function(a,b){ return accuracy(prog(a.id)) - accuracy(prog(b.id)); });
    return pool.slice(0, n);
  }
  var t = today(), due=[], fresh=[], weak=[], rest=[];
  pool.forEach(function(w){
    var p = prog(w.id);
    if(!p) fresh.push(w);
    else if(p.due && p.due <= t) due.push(w);
    else if(accuracy(p) < 0.6) weak.push(w);
    else rest.push(w);
  });
  return shuffle(due).concat(shuffle(fresh), shuffle(weak), shuffle(rest)).slice(0, n);
}

function asOpt(x){
  if(x.id) return { term:x.term, termRuby:x.termRuby, kana:x.kana, en:x.english, mJa:x.easyJa,
                    mJaRuby:x.easyJaRuby, mEn:x.englishDesc, id:x.id, gid:null };
  return { term:x.term, termRuby:x.termRuby, kana:x.kana, en:x.glossEn, mJa:x.glossJa,
           mJaRuby:x.glossJaRuby, mEn:x.glossEn, id:null, gid:x.__gid };
}
function makeChoices(word){
  var picked = [], used = {};
  used[word.term] = 1;
  var pool = [];
  (CF.index[word.id]||[]).forEach(function(gid){
    GROUPS[gid].members.forEach(function(m){
      if(m.term !== word.term && !used[m.term]){
        var c = JSON.parse(JSON.stringify(m)); c.__gid = gid; pool.push(c);
      }
    });
  });
  shuffle(pool).forEach(function(m){
    if(picked.length < 2 && !used[m.term]){ used[m.term]=1; picked.push(asOpt(m)); }
  });
  function fill(list){
    shuffle(list).forEach(function(w){
      if(picked.length < 3 && !used[w.term]){ used[w.term]=1; picked.push(asOpt(w)); }
    });
  }
  fill(WORDS.filter(function(w){ return w.id!==word.id && w.categoryId===word.categoryId && w.level===word.level; }));
  if(picked.length < 3) fill(WORDS.filter(function(w){ return w.id!==word.id && w.categoryId===word.categoryId; }));
  if(picked.length < 3) fill(WORDS.filter(function(w){ return w.id!==word.id; }));
  var ans = asOpt(word); ans.correct = true;
  return shuffle([ans].concat(picked));
}
