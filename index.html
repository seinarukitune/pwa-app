んいん》になる。","noteEnRuby":""},{"id":"KV245","term":"パウチ","kana":"ぱうち","romaji":"pauchi","english":"ostomy pouch","easyJa":"人工肛門（ストーマ）から出るうんちを貯める袋","englishDesc":"A bag that collects waste from a stoma.","exampleJa":"ストーマ装具のパウチに溜まった排泄物を捨てる。","exampleEn":"Empty the waste collected in the ostomy pouch.","exampleRuby":"ストーマ装具《そうぐ》のパウチに溜《た》まった排泄物《はいせつぶつ》を捨《す》てる。","exampleGapRuby":"ストーマ装具《そうぐ》の{{GAP}}に溜《た》まった排泄物《はいせつぶつ》を捨《す》てる。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"排泄物の廃棄は介護職も可能だが、装具の交換は本人・家族・看護師が行う。","noteEn":"Emptying is allowed for care workers, but changing the appliance is done by the person, family or nurse.","gapTerm":"パウチ","termRuby":"パウチ","easyJaRuby":"人工肛門《じんこうこうもん》（ストーマ）から出《で》るうんちを貯《た》める袋《ふくろ》","noteJaRuby":"排泄物《はいせつぶつ》の廃棄《はいき》は介護職《かいごしょく》も可能《かのう》だが、装具《そうぐ》の交換《こうかん》は本人《ほんにん》・家族《かぞく》・看護師《かんごし》が行《おこな》う。","noteEnRuby":""},{"id":"KV246","term":"介護用リフト","kana":"かいごようりふと","romaji":"kaigoyōrifuto","english":"patient lift","easyJa":"機械で利用者を持ち上げる道具","englishDesc":"A machine that lifts a person.","exampleJa":"床からの立ち上がりに、介護用リフトを使用する。","exampleEn":"A patient lift is used to raise the user from the floor.","exampleRuby":"床《ゆか》からの立《た》ち上《あ》がりに、介護用《かいごよう》リフトを使用《しよう》する。","exampleGapRuby":"床《ゆか》からの立《た》ち上《あ》がりに、{{GAP}}を使用《しよう》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"リフト使用は腰痛予防に有効。使用前に必ずスリングの装着と定員を確認。","noteEn":"Lifts prevent back injury. Always check the sling fitting and load limit first.","gapTerm":"介護用リフト","termRuby":"介護用《かいごよう》リフト","easyJaRuby":"機械《きかい》で利用者《りようしゃ》を持《も》ち上《あ》げる道具《どうぐ》","noteJaRuby":"リフト使用《しよう》は腰痛予防《ようつうよぼう》に有効《ゆうこう》。使用前《しようまえ》に必《かなら》ずスリングの装着《そうちゃく》と定員《ていいん》を確認《かくにん》。","noteEnRuby":""},{"id":"KV247","term":"居室","kana":"きょしつ","romaji":"kyoshitsu","english":"resident's room","easyJa":"施設の中で、利用者が生活している自分の部屋","englishDesc":"The room where a resident lives in a facility.","exampleJa":"利用者の居室に入る前はノックをする。","exampleEn":"Knock before entering the user's room.","exampleRuby":"利用者《りようしゃ》の居室《きょしつ》に入《はい》る前《まえ》はノックをする。","exampleGapRuby":"利用者《りようしゃ》の{{GAP}}に入《はい》る前《まえ》はノックをする。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"居室は利用者の生活の場（＝自宅）。無断で入るのはプライバシー侵害。","noteEn":"The room is the resident's home; entering without permission violates privacy.","gapTerm":"居室","termRuby":"居室《きょしつ》","easyJaRuby":"施設《しせつ》の中《なか》で、利用者《りようしゃ》が生活《せいかつ》している自分《じぶん》の部屋《へや》","noteJaRuby":"居室《きょしつ》は利用者《りようしゃ》の生活《せいかつ》の場《ば》（＝自宅《じたく》）。無断《むだん》で入《はい》るのはプライバシー侵害《しんがい》。","noteEnRuby":""},{"id":"KV248","term":"離床センサー","kana":"りしょうせんさー","romaji":"rishōsensā","english":"bed exit sensor","easyJa":"利用者がベッドから起き上がったり降りたりすると音が鳴る機械","englishDesc":"A sensor that sounds when the user gets up or leaves the bed.","exampleJa":"転倒リスクが高いため、離床センサーを設置する。","exampleEn":"Because fall risk is high, a bed exit sensor is installed.","exampleRuby":"転倒《てんとう》リスクが高《たか》いため、離床《りしょう》センサーを設置《せっち》する。","exampleGapRuby":"転倒《てんとう》リスクが高《たか》いため、{{GAP}}を設置《せっち》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「離床」（getting up、良いこと）と「離床センサー」（監視機器）で意味が違う点に注意。","noteEn":"Note the gap: 離床 is a positive action, while 離床センサー is a monitoring device.","gapTerm":"離床センサー","termRuby":"離床《りしょう》センサー","easyJaRuby":"利用者《りようしゃ》がベッドから起《お》き上《あ》がったり降《お》りたりすると音《おと》が鳴《な》る機械《きかい》","noteJaRuby":"「離床《りしょう》」（getting up、良《よ》いこと）と「離床《りしょう》センサー」（監視機器《かんしきき》）で意味《いみ》が違《ちが》う点《てん》に注意《ちゅうい》。","noteEnRuby":"Note the gap: 離床《りしょう》 is a positive action, while 離床《りしょう》センサー is a monitoring device."},{"id":"KV249","term":"キャスター","kana":"きゃすたー","romaji":"kyasutā","english":"casters / front wheels","easyJa":"車いすの前についている、方向を変えるための小さなタイヤ","englishDesc":"The small front wheels of a wheelchair that change direction.","exampleJa":"段差を越える時は、前輪（キャスター）を上げる。","exampleEn":"When crossing a step, lift the front casters.","exampleRuby":"段差《だんさ》を越《こ》える時《とき》は、前輪《ぜんりん》（キャスター）を上《あ》げる。","exampleGapRuby":"段差《だんさ》を越《こ》える時《とき》は、前輪《ぜんりん》（{{GAP}}）を上《あ》げる。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"段差はキャスターを上げて越える。後輪から乗り上げるのは危険。","noteEn":"Lift the casters over steps; going up rear-wheel first is dangerous.","gapTerm":"キャスター","termRuby":"キャスター","easyJaRuby":"車《くるま》いすの前《まえ》についている、方向《ほうこう》を変《か》えるための小《ちい》さなタイヤ","noteJaRuby":"段差《だんさ》はキャスターを上《あ》げて越《こ》える。後輪《こうりん》から乗《の》り上《あ》げるのは危険《きけん》。","noteEnRuby":""},{"id":"KV250","term":"ブレーキ","kana":"ぶれーき","romaji":"burēki","english":"brakes","easyJa":"車いすが動かないようにタイヤを止める装置","englishDesc":"The device that stops the wheels of a wheelchair.","exampleJa":"移乗する前に、必ず車いすのブレーキをかける。","exampleEn":"Always apply the wheelchair brakes before transferring.","exampleRuby":"移乗《いじょう》する前《まえ》に、必《かなら》ず車《くるま》いすのブレーキをかける。","exampleGapRuby":"移乗《いじょう》する前《まえ》に、必《かなら》ず車《くるま》いすの{{GAP}}をかける。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"ブレーキ忘れは事故原因の第1位。移乗前・停車時は必ず確認する。","noteEn":"Forgetting the brake is the top cause of accidents. Always check before transfer and when stopped.","gapTerm":"ブレーキ","termRuby":"ブレーキ","easyJaRuby":"車《くるま》いすが動《うご》かないようにタイヤを止《と》める装置《そうち》","noteJaRuby":"ブレーキ忘《わす》れは事故原因《じこげんいん》の第《だい》1位《い》。移乗前《いじょうまえ》・停車時《ていしゃじ》は必《かなら》ず確認《かくにん》する。","noteEnRuby":""},{"id":"KV251","term":"フットレスト","kana":"ふっとれすと","romaji":"futtoresuto","english":"footrest","easyJa":"車いすに座る時、足を乗せる板（足台）","englishDesc":"The plate where the feet rest on a wheelchair.","exampleJa":"立ち上がる時は、利用者の足をフットレストから下ろす。","exampleEn":"When standing up, take the user's feet off the footrest.","exampleRuby":"立《た》ち上《あ》がる時《とき》は、利用者《りようしゃ》の足《あし》をフットレストから下《お》ろす。","exampleGapRuby":"立《た》ち上《あ》がる時《とき》は、利用者《りようしゃ》の足《あし》を{{GAP}}から下《お》ろす。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"立ち上がり時にフットレストに足を乗せたままだと転倒する。跳ね上げも行う。","noteEn":"Standing with feet still on the footrest causes falls; fold it up as well.","gapTerm":"フットレスト","termRuby":"フットレスト","easyJaRuby":"車《くるま》いすに座《すわ》る時《とき》、足《あし》を乗《の》せる板《いた》（足台《あしだい》）","noteJaRuby":"立《た》ち上《あ》がり時《とき》にフットレストに足《あし》を乗《の》せたままだと転倒《てんとう》する。跳《は》ね上《あ》げも行《おこな》う。","noteEnRuby":""},{"id":"KV252","term":"食具","kana":"しょくぐ","romaji":"shokugu","english":"eating utensils","easyJa":"スプーンやお箸など、ご飯を食べる時に使う道具","englishDesc":"Tools used for eating, such as spoons and chopsticks.","exampleJa":"利き手の麻痺に合わせて、使いやすい食具を選ぶ。","exampleEn":"Choose easy-to-use utensils to match paralysis of the dominant hand.","exampleRuby":"利《き》き手《て》の麻痺《まひ》に合《あ》わせて、使《つか》いやすい食具《しょくぐ》を選《えら》ぶ。","exampleGapRuby":"利《き》き手《て》の麻痺《まひ》に合《あ》わせて、使《つか》いやすい{{GAP}}を選《えら》ぶ。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"食具は自助具の一つ。太い柄・曲がったスプーンなど、本人に合わせて選ぶ。","noteEn":"Utensils are self-help devices: thick handles or angled spoons, chosen for the person.","gapTerm":"食具","termRuby":"食具《しょくぐ》","easyJaRuby":"スプーンやお箸《はし》など、ご飯《はん》を食《た》べる時《とき》に使《つか》う道具《どうぐ》","noteJaRuby":"食具《しょくぐ》は自助具《じじょぐ》の一《ひと》つ。太《ふと》い柄《え》・曲《ま》がったスプーンなど、本人《ほんにん》に合《あ》わせて選《えら》ぶ。","noteEnRuby":""},{"id":"KV253","term":"ロフストランドクラッチ","kana":"ろふすとらんどくらっち","romaji":"rofusutorandokuratchi","english":"Lofstrand crutch","easyJa":"腕を通す輪っかがついていて、握力がない人も使いやすい杖","englishDesc":"A crutch with an arm cuff, usable by people with weak grip.","exampleJa":"下半身麻痺の利用者がロフストランドクラッチを使用する。","exampleEn":"A user with lower-body paralysis uses a Lofstrand crutch.","exampleRuby":"下半身麻痺《かはんしんまひ》の利用者《りようしゃ》がロフストランドクラッチを使用《しよう》する。","exampleGapRuby":"下半身麻痺《かはんしんまひ》の利用者《りようしゃ》が{{GAP}}を使用《しよう》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"ロフストランドクラッチは前腕で支えるため握力が弱くても使える。松葉杖との違いが問われる。","noteEn":"It supports through the forearm, so weak grip is not a problem. Contrast with underarm crutches.","gapTerm":"ロフストランドクラッチ","termRuby":"ロフストランドクラッチ","easyJaRuby":"腕《うで》を通《とお》す輪《わ》っかがついていて、握力《あくりょく》がない人《ひと》も使《つか》いやすい杖《つえ》","noteJaRuby":"ロフストランドクラッチは前腕《ぜんわん》で支《ささ》えるため握力《あくりょく》が弱《よわ》くても使《つか》える。松葉杖《まつばづえ》との違《ちが》いが問《と》われる。","noteEnRuby":""},{"id":"KV254","term":"浴槽","kana":"よくそう","romaji":"yokusō","english":"bathtub","easyJa":"お風呂のお湯をためる場所（湯船）","englishDesc":"The tub that holds hot water in a bath.","exampleJa":"浴槽に入る時は、健側の足から入る。","exampleEn":"When entering the bathtub, put the unaffected leg in first.","exampleRuby":"浴槽《よくそう》に入《はい》る時《とき》は、健側《けんそく》の足《あし》から入《はい》る。","exampleGapRuby":"{{GAP}}に入《はい》る時《とき》は、健側《けんそく》の足《あし》から入《はい》る。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"浴槽は「入るときは健側から、出るときも健側から」。湯温は約40度、肩まで浸けない。","noteEn":"Enter and exit leading with the unaffected side. Water about 40°C; do not submerge to the shoulders.","gapTerm":"浴槽","termRuby":"浴槽《よくそう》","easyJaRuby":"お風呂《ふろ》のお湯《ゆ》をためる場所《ばしょ》（湯船《ゆぶね》）","noteJaRuby":"浴槽《よくそう》は「入《はい》るときは健側《けんそく》から、出《で》るときも健側《けんそく》から」。湯温《ゆおん》は約《やく》40度《ど》、肩《かた》まで浸《つ》けない。","noteEnRuby":""},{"id":"KV255","term":"照明","kana":"しょうめい","romaji":"shōmei","english":"lighting","easyJa":"部屋を明るくする電気（ライト）","englishDesc":"The electric light that makes a room bright.","exampleJa":"夜間にトイレへ行くため、足元の照明をつける。","exampleEn":"Turn on the floor lighting for going to the toilet at night.","exampleRuby":"夜間《やかん》にトイレへ行《い》くため、足元《あしもと》の照明《しょうめい》をつける。","exampleGapRuby":"夜間《やかん》にトイレへ行《い》くため、足元《あしもと》の{{GAP}}をつける。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"夜間の足元灯は転倒予防。高齢者は暗さへの目の順応が遅い点が問われる。","noteEn":"Night lighting prevents falls; older eyes adapt to darkness slowly.","gapTerm":"照明","termRuby":"照明《しょうめい》","easyJaRuby":"部屋《へや》を明《あか》るくする電気《でんき》（ライト）","noteJaRuby":"夜間《やかん》の足元灯《あしもととう》は転倒予防《てんとうよぼう》。高齢者《こうれいしゃ》は暗《くら》さへの目《め》の順応《じゅんのう》が遅《おそ》い点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV256","term":"カテーテル","kana":"かてーてる","romaji":"katēteru","english":"catheter","easyJa":"体の中に液体を入れたり出したりする細い管","englishDesc":"A thin tube put into the body to take fluid in or out.","exampleJa":"尿を排出するためのバルーンカテーテルの管理。","exampleEn":"Management of a balloon catheter used to drain urine.","exampleRuby":"尿《にょう》を排出《はいしゅつ》するためのバルーンカテーテルの管理《かんり》。","exampleGapRuby":"尿《にょう》を排出《はいしゅつ》するためのバルーン{{GAP}}の管理《かんり》。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"カテーテルの管は折れ・引っ張りに注意し、蓄尿バッグは膀胱より低く保つ。","noteEn":"Avoid kinks and pulling, and keep the drainage bag BELOW the level of the bladder.","gapTerm":"カテーテル","termRuby":"カテーテル","easyJaRuby":"体《からだ》の中《なか》に液体《えきたい》を入《い》れたり出《だ》したりする細《ほそ》い管《くだ》","noteJaRuby":"カテーテルの管《くだ》は折《お》れ・引《ひ》っ張《ぱ》りに注意《ちゅうい》し、蓄尿《ちくにょう》バッグは膀胱《ぼうこう》より低《ひく》く保《たも》つ。","noteEnRuby":""},{"id":"KV257","term":"胃ろう","kana":"いろう","romaji":"irō","english":"PEG / gastrostomy","easyJa":"お腹から直接胃に穴を開けて、チューブで栄養を入れるところ","englishDesc":"An opening made in the stomach wall for tube feeding.","exampleJa":"胃ろうからの経管栄養の準備を行う。","exampleEn":"Prepare tube feeding through the gastrostomy.","exampleRuby":"胃《い》ろうからの経管栄養《けいかんえいよう》の準備《じゅんび》を行《おこな》う。","exampleGapRuby":"{{GAP}}からの経管栄養《けいかんえいよう》の準備《じゅんび》を行《おこな》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"胃ろうがあっても口から食べられる場合がある。口腔ケアは必ず続ける。","noteEn":"People with a gastrostomy may still eat by mouth, and oral care must continue.","gapTerm":"胃ろう","termRuby":"胃《い》ろう","easyJaRuby":"お腹《なか》から直接胃《ちょくせつい》に穴《あな》を開《あ》けて、チューブで栄養《えいよう》を入《い》れるところ","noteJaRuby":"胃《い》ろうがあっても口《くち》から食《た》べられる場合《ばあい》がある。口腔《こうくう》ケアは必《かなら》ず続《つづ》ける。","noteEnRuby":""},{"id":"KV258","term":"ストーマ","kana":"すとーま","romaji":"sutōma","english":"stoma / artificial anus","easyJa":"手術でお腹に作った、おしっこやうんちを出す新しい穴（人工肛門）","englishDesc":"An artificial opening made for passing stool or urine.","exampleJa":"ストーマの周囲の皮膚を清潔に保つ。","exampleEn":"Keep the skin around the stoma clean.","exampleRuby":"ストーマの周囲《しゅうい》の皮膚《ひふ》を清潔《せいけつ》に保《たも》つ。","exampleGapRuby":"{{GAP}}の周囲《しゅうい》の皮膚《ひふ》を清潔《せいけつ》に保《たも》つ。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"ストーマ周囲の皮膚トラブルが最も多い問題。入浴も可能である点が問われる。","noteEn":"Skin problems around the stoma are most common. Note that bathing is still possible.","gapTerm":"ストーマ","termRuby":"ストーマ","easyJaRuby":"手術《しゅじゅつ》でお腹《なか》に作《つく》った、おしっこやうんちを出《だ》す新《あたら》しい穴《あな》（人工肛門《じんこうこうもん》）","noteJaRuby":"ストーマ周囲《しゅうい》の皮膚《ひふ》トラブルが最《もっと》も多《おお》い問題《もんだい》。入浴《にゅうよく》も可能《かのう》である点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV259","term":"パルスオキシメーター","kana":"ぱるすおきしめーたー","romaji":"parusuokishimētā","english":"pulse oximeter","easyJa":"指にはさんで、血液の中の酸素の量（SPO2）を測る機械","englishDesc":"A device that measures oxygen in the blood from the fingertip.","exampleJa":"息苦しそうだったため、パルスオキシメーターで測定した。","exampleEn":"Because breathing seemed hard, a pulse oximeter was used.","exampleRuby":"息苦《いきぐる》しそうだったため、パルスオキシメーターで測定《そくてい》した。","exampleGapRuby":"息苦《いきぐる》しそうだったため、{{GAP}}で測定《そくてい》した。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"測定値（SpO2）はおよそ95%以上が目安。爪の色や冷えで正しく測れないことがある。","noteEn":"SpO2 around 95% or above is the guide. Nail polish or cold fingers can distort readings.","gapTerm":"パルスオキシメーター","termRuby":"パルスオキシメーター","easyJaRuby":"指《ゆび》にはさんで、血液《けつえき》の中《なか》の酸素《さんそ》の量《りょう》（SPO2）を測《はか》る機械《きかい》","noteJaRuby":"測定値《そくていち》（SpO2）はおよそ95%以上《いじょう》が目安《めやす》。爪《つめ》の色《いろ》や冷《ひ》えで正《ただ》しく測《はか》れないことがある。","noteEnRuby":""},{"id":"KV260","term":"標準予防策","kana":"ひょうじゅんよぼうさく","romaji":"hyōjun'yobōsaku","english":"standard precautions","easyJa":"誰の血液や体液でも「ばい菌がいるかもしれない」と考えて対応する感染予防のルール","englishDesc":"Treating everyone's blood and body fluids as possibly infectious.","exampleJa":"感染症の有無に関わらず、標準予防策（スタンダード・プリコーション）を実施する。","exampleEn":"Carry out standard precautions regardless of whether infection is present.","exampleRuby":"感染症《かんせんしょう》の有無《うむ》に関《かか》わらず、標準予防策《ひょうじゅんよぼうさく》（スタンダード・プリコーション）を実施《じっし》する。","exampleGapRuby":"感染症《かんせんしょう》の有無《うむ》に関《かか》わらず、{{GAP}}（スタンダード・プリコーション）を実施《じっし》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「感染症の人にだけ行う」は誤り。全員に対して行うのが標準予防策の核心。","noteEn":"Doing it only for infected people is wrong: standard precautions apply to everyone.","gapTerm":"標準予防策","termRuby":"標準予防策《ひょうじゅんよぼうさく》","easyJaRuby":"誰《だれ》の血液《けつえき》や体液《たいえき》でも「ばい菌《きん》がいるかもしれない」と考《かんが》えて対応《たいおう》する感染予防《かんせんよぼう》のルール","noteJaRuby":"「感染症《かんせんしょう》の人《ひと》にだけ行《おこな》う」は誤《あやま》り。全員《ぜんいん》に対《たい》して行《おこな》うのが標準予防策《ひょうじゅんよぼうさく》の核心《かくしん》。","noteEnRuby":""},{"id":"KV261","term":"感染性廃棄物","kana":"かんせんせいはいきぶつ","romaji":"kansenseihaikibutsu","english":"infectious waste","easyJa":"血液や痰などがついていて、他の人にうつる危険があるゴミ","englishDesc":"Waste that may carry infection and needs special disposal.","exampleJa":"痰を拭き取ったティッシュは感染性廃棄物として処理する。","exampleEn":"Tissues used to wipe sputum are treated as infectious waste.","exampleRuby":"痰《たん》を拭《ふ》き取《と》ったティッシュは感染性廃棄物《かんせんせいはいきぶつ》として処理《しょり》する。","exampleGapRuby":"痰《たん》を拭《ふ》き取《と》ったティッシュは{{GAP}}として処理《しょり》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"感染性廃棄物は専用容器（バイオハザードマーク）で処理。一般ごみと混ぜない。","no ":"てぃっぴんぐればー","romaji":"tippingurebā","english":"tipping lever","easyJa":"車いすの前輪を上げるために、介護者が足で踏む後ろの棒","englishDesc":"The bar at the back of a wheelchair pressed by the foot to tip it.","exampleJa":"段差を上がる時は、ティッピングレバーを踏む。","exampleEn":"When going up a step, press the tipping lever.","exampleRuby":"段差《だんさ》を上《あ》がる時《とき》は、ティッピングレバーを踏《ふ》む。","exampleGapRuby":"段差《だんさ》を上《あ》がる時《とき》は、{{GAP}}を踏《ふ》む。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"ティッピングレバーを踏んでキャスターを上げる。急に倒すと利用者が驚くので声かけを。","noteEn":"Press it to lift the casters, and tell the person first so they are not startled.","gapTerm":"ティッピングレバー","termRuby":"ティッピングレバー","easyJaRuby":"車《くるま》いすの前輪《ぜんりん》を上《あ》げるために、介護者《かいごしゃ》が足《あし》で踏《ふ》む後《うし》ろの棒《ぼう》","noteJaRuby":"ティッピングレバーを踏《ふ》んでキャスターを上《あ》げる。急《きゅう》に倒《たお》すと利用者《りようしゃ》が驚《おどろ》くので声《こえ》かけを。","noteEnRuby":""},{"id":"KV267","term":"アームサポート","kana":"あーむさぽーと","romaji":"āmusapōto","english":"armrest","easyJa":"車いすなどで、腕やひじを乗せる部分（ひじ掛け）","englishDesc":"The part of the wheelchair where the arms rest.","exampleJa":"移乗する際、車いすのアームサポートを跳ね上げる。","exampleEn":"When transferring, fold up the wheelchair armrest.","exampleRuby":"移乗《いじょう》する際《さい》、車《くるま》いすのアームサポートを跳《は》ね上《あ》げる。","exampleGapRuby":"移乗《いじょう》する際《さい》、車《くるま》いすの{{GAP}}を跳《は》ね上《あ》げる。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"アームサポートを跳ね上げると横移乗ができる。跳ね上げ式かどうかを事前に確認。","noteEn":"Folding it up allows a lateral transfer; check in advance whether it folds.","gapTerm":"アームサポート","termRuby":"アームサポート","easyJaRuby":"車《くるま》いすなどで、腕《うで》やひじを乗《の》せる部分《ぶぶん》（ひじ掛《か》け）","noteJaRuby":"アームサポートを跳《は》ね上《あ》げると横移乗《よこいじょう》ができる。跳《は》ね上《あ》げ式《しき》かどうかを事前《じぜん》に確認《かくにん》。","noteEnRuby":""},{"id":"KV268","term":"リクライニング車いす","kana":"りくらいにんぐくるまいす","romaji":"rikurainingukurumaisu","english":"reclining wheelchair","easyJa":"背もたれを後ろに倒して、寝るような姿勢に at stops liquid passing through to the mattress.","exampleJa":"おむつから尿が漏れてもいいように防水シーツを敷く。","exampleEn":"Lay a waterproof sheet in case urine leaks from the diaper.","exampleRuby":"おむつから尿《にょう》が漏《も》れてもいいように防水《ぼうすい》シーツを敷《し》く。","exampleGapRuby":"おむつから尿《にょう》が漏《も》れてもいいように{{GAP}}を敷《し》く。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"防水シーツは蒸れやすく、皮膚トラブルの原因になる。必要な範囲のみ敷く。","noteEn":"Waterproof sheets trap heat and moisture, harming skin. Use only where needed.","gapTerm":"防水シーツ","termRuby":"防水《ぼうすい》シーツ","easyJaRuby":"おしっこなどでベッドのマットレスが濡《ぬ》れないように敷《し》くシート","noteJaRuby":"防水《ぼうすい》シーツは蒸《む》れやすく、皮膚《ひふ》トラブルの原因《げんいん》になる。必要《ひつよう》な範囲《はんい》のみ敷《し》く。","noteEnRuby":""},{"id":"KV271","term":"使い捨て手袋","kana":"つかいすててぶくろ","romaji":"tsukaisutetebukuro","english":"disposable gloves","easyJa":"1回使ったら捨てる衛生的な手袋（プラスチックグローブなど）","englishDesc":"Gloves used once and then thrown away.","exampleJa":"排泄介助の際は、必ず使い捨て手袋を着用する。","exampleEn":"Always wear disposable gloves when assisting with toileting.","exampleRuby":"排泄介助《はいせつかいじょ》の際《さい》は、必《かなら》ず使《つか》い捨《す》て手袋《てぶくろ》を着用《ちゃくよう》する。","exampleGapRuby":"排泄介助《はいせつかいじょ》の際《さい》は、必《かなら》ず{{GAP}}を着用《ちゃくよう》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"手袋は利用者ごとに交換。手袋をしても前後の手指消毒は必要。","noteEn":"Change gloves for each user, and disinfect hands both before and after wearing them.","gapTerm":"使い捨て手袋","termRuby":"使《つか》い捨《す》て手袋《てぶくろ》","easyJaRuby":"1回使《かいつか》ったら捨《す》てる衛生的《えいせいてき》な手袋《てぶくろ》（プラスチックグローブなど）","noteJaRuby":"手袋《てぶくろ》は利用者《りようしゃ》ごとに交換《こうかん》。手袋《てぶくろ》をしても前後《ぜんご》の手指消毒《しゅししょうどく》は必要《ひつよう》。","noteEnRuby":""},{"id":"KV272","term":"吸引器","kana":"きゅういんき","romaji":"kyūinki","english":"suction machine","easyJa":"痰（たん）などを機械の力でシュッと吸い取る道具","englishDesc":"A machine used to draw out sputum.","exampleJa":"喀痰吸引を行うため、吸引器の電源を入れる。","exampleEn":"Turn on the suction 助用車いすに乗る。","exampleEn":"A user who cannot propel themselves uses an attendant-propelled wheelchair.","exampleRuby":"自分《じぶん》でこげない利用者《りようしゃ》は介助用車《かいじょようくるま》いすに乗《の》る。","exampleGapRuby":"自分《じぶん》でこげない利用者《りようしゃ》は{{GAP}}に乗《の》る。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介助用は後輪が小さくハンドリムがない。自走できる人に使うのは自立を妨げる。","noteEn":"Attendant chairs have small rear wheels and no handrims; using one for a capable person blocks independence.","gapTerm":"介助用車いす","termRuby":"介助用車《かいじょようくるま》いす","easyJaRuby":"ハンドリムがなく、後《うし》ろから職員《しょくいん》が押《お》すための車《くるま》いす","noteJaRuby":"介助用《かいじょよう》は後輪《こうりん》が小《ちい》さくハンドリムがない。自走《じそう》できる人《ひと》に使《つか》うのは自立《じりつ》を妨《さまた》げる。","noteEnRuby":""},{"id":"KV275","term":"松葉杖","kana":"まつばづえ","romaji":"matsubazue","english":"crutches","easyJa":"脇の下にはさんで、体重を支えて歩くための大きな杖","englishDesc":"Sticks used under the arms to support walking after injury.","exampleJa":"骨折のリハビリで松葉杖を使った歩行訓練をする。","exampleEn":"Do walking training with crutches during fracture rehabilitation.","exampleRuby":"骨折《こっせつ》のリハビリで松葉杖《まつばづえ》を使《つか》った歩行訓練《ほこうくんれん》をする。","exampleGapRuby":"骨折《こっせつ》のリハビリで{{GAP}}を使《つか》った歩行訓練《ほこうくんれん》をする。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"松葉杖は脇で体重を支えない（神経麻痺の危険）。手で支えるのが正しい。","noteEn":"Do not bear weight in the armpits (risk of nerve damage); take the weight on the hands.","gapTerm":"松葉杖","termRuby":"松葉杖《まつばづえ》","easyJaRuby":"脇《わき》の下《した》にはさんで、体重《たいじゅう》を支《ささ》えて歩《ある》くための大《おお》きな杖《つえ》","noteJaRuby":"松葉杖《まつばづえ》は脇《わき》で体重《たいじゅう》を支《ささ》えない（神経麻痺《しんけいまひ》の危険《きけん》）。手《て》で支《ささ》えるのが正《ただ》しい。","noteEnRuby":""},{"id":"KV276","term":"多点杖","kana":"たてんづえ","romaji":"tatenzue","english":"multi-point cane","easyJa":"足が3つや4つに分かれていて、普通の杖より倒れにくい杖","englishDesc":"A cane with three or four feet, giving more stability.","exampleJa":"バランスが悪い利用者に多点杖（四点杖など）を提案する。","exampleEn":"Suggest a multi-point cane for a user with poor balance.","exampleRuby":"バランスが悪《わる》い利用者《りようしゃ》に多点杖《たてんづえ》（四点杖《してんづえ》など）を提案《ていあん》する。","exampleGapRuby":"バランスが悪《わる》い利用者《りようしゃ》に{{GAP}}（四点杖《してんづえ》など）を提案《ていあん》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"多点杖は安定するが重く、平らな床でしか使えない。段差では不向き。","noteEn":"More stable but heavier, and only for flat floors — unsuitable on steps.","gapTerm":"多点杖","termRuby":"多点杖《たてんづえ》","easyJaRuby":"足《あし》が3つや4つに分《わ》かれていて、普通《ふつう》の杖《つえ》より倒《たお》れにくい杖《つえ》","noteJaRuby":"多点杖《たてんづえ》は安定《あんてい》するが重《おも》く、平《たい》らな床《ゆか》でしか使《つか》えない。段差《だんさ》では不向《ふむ》き。","noteEnRuby":""},{"id":"KV277","term":"円座","kana":"えんざ","romaji":"enza","english":"donut cushion / ring cushion","easyJa":"真ん中に穴が空いているドーナツ型の座布団","englishDesc":"A ring-shaped cushion with a hole in the middle.","exampleJa":"褥瘡予防として円座を使用するのは不適切である。","exampleEn":"Using a ring cushion to prevent pressure ulcers is inappropriate.","exampleRuby":"褥瘡予防《じょくそうよぼう》として円座《えんざ》を使用《しよう》するのは不適切《ふてきせつ》である。","exampleGapRuby":"褥瘡予防《じょくそうよぼう》として{{GAP}}を使用《しよう》するのは不適切《ふてきせつ》である。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"円座は接触部分の血流を妨げ、かえって褥瘡を悪化させる。「不適切」が正解になる定番語。","noteEn":"The ring blocks blood flow at its edge and worsens ulcers. It is the classic \"incorrect\" option.","gapTerm":"円座","termRuby":"円座《えんざ》","easyJaRuby":"真《ま》ん中《なか》に穴《あな》が空《あ》いているドーナツ型《がた》の座布団《ざぶとん》","noteJaRuby":"円座《えんざ》は接触部分《せっしょくぶぶん》の血流《けつりゅう》を妨《さまた》げ、かえって褥瘡《じょくそう》を悪化《あっか》させる。「不適切《ふてきせつ》」が正解《せいかい》になる定番語《ていばんご》。","noteEnRuby":""},{"id":"KV278","term":"床頭台","kana":"しょうとうだい","romaji":"shōtōdai","english":"bedside cabinet","easyJa":"ベッドの横に置く、小さな引き出しやテーブルがついた棚","englishDesc":"A small cabinet beside the bed.","exampleJa":"テレビのリモコンを床頭台の上に置く。","exampleEn":"Put the TV remote control on the bedside cabinet.","exampleRuby":"テレビのリモコンを床頭台《しょうとうだい》の上《うえ》に置《お》く。","exampleGapRuby":"テレビのリモコンを{{GAP}}の上《うえ》に置《お》く。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"床頭台は本人の手が届く位置に整える。物を勝手に動かさないことも尊厳の配慮。","noteEn":"Arrange it within reach, and do not move the person's belongings without asking.","gapTerm":"床頭台","termRuby":"床頭台《しょうとうだい》","easyJaRuby":"ベッドの横《よこ》に置《お》く、小《ちい》さな引《ひ》き出《だ》しやテーブルがついた棚《たな》","noteJaRuby":"床頭台《しょうとうだい》は本人《ほんにん》の手《て》が届《とど》く位置《いち》に整《ととの》える。物《もの》を勝手《かって》に動《うご》かさないことも尊厳《そんげん》の配慮《はいりょ》。","noteEnRuby":""},{"id":"KV279","term":"住宅改修","kana":"じゅうたくかいしゅう","romaji":"jūtakukaishū","english":"home modification","easyJa":"家に手すりをつけたり、段差をなくしたりする工事のこと","englishDesc":"Changing the house so it is easier and safer to live in.","exampleJa":"介護保険を使って、トイレの住宅改修を行う。","exampleEn":"Use long-term care insurance to modify the toilet at home.","exampleRuby":"介護保険《かいごほけん》を使《つか》って、トイレの住宅改修《じゅうたくかいしゅう》を行《おこな》う。","exampleGapRuby":"介護保険《かいごほけん》を使《つか》って、トイレの{{GAP}}を行《おこな》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"住宅改修は支給限度額20万円（原則1回）。手すり・段差解消・扉の変更などが対象。","noteEn":"Benefit limit is 200,000 yen, in principle once. Covers handrails, step removal and door changes.","gapTerm":"住宅改修","termRuby":"住宅改修《じゅうたくかいしゅう》","easyJaRuby":"家《いえ》に手《て》すりをつけたり、段差《だんさ》をなくしたりする工事《こうじ》のこと","noteJaRuby":"住宅改修《じゅうたくかいしゅう》は支給限度額《しきゅうげんどがく》20万円《まんえん》（原則《げんそく》1回《かい》）。手《て》すり・段差解消《だんさかいしょう》・扉《とびら》の変更《へんこう》などが対象《たいしょう》。","noteEnRuby":""},{"id":"KV280","term":"車輪","kana":"しゃりん","romaji":"sharin","english":"wheel","easyJa":"車いすや歩行器についているタイヤのこと","englishDesc":"The round part that turns so something can move.","exampleJa":"歩行器の車輪にゴミが挟まっていないか点検する。","exampleEn":"Check that no rubbish is caught in the walker's wheels.","exampleRuby":"歩行器《ほこうき》の車輪《しゃりん》にゴミが挟《はさ》まっていないか点検《てんけん》する。","exampleGapRuby":"歩行器《ほこうき》の{{GAP}}にゴミが挟《はさ》まっていないか点検《てんけん》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"車輪の点検は毎日行う。空気圧が低いとブレーキが効きにくい。","noteEn":"Check wheels daily; low tyre pressure weakens the brakes.","gapTerm":"車輪","termRuby":"車輪《しゃりん》","easyJaRuby":"車《くるま》いすや歩行器《ほこうき》についているタイヤのこと","noteJaRuby":"車輪《しゃりん》の点検《てんけん》は毎日行《まいにちおこな》う。空気圧《くうきあつ》が低《ひく》いとブレーキが効《き》きにくい。","noteEnRuby":""},{"id":"KV281","term":"特殊寝台","kana":"とくしゅしんだい","romaji":"tokushushindai","english":"special bed (nursing bed)","easyJa":"介護保険で借りられる、ギャッチベッドなどの介護用ベッド","englishDesc":"An adjustable care bed provided through insurance rental.","exampleJa":"介護保険の福祉用具貸与で特殊寝台を利用する。","exampleEn":"A special bed is rented through the welfare equipment lending benefit.","exampleRuby":"介護保険《かいごほけん》の福祉用具貸与《ふくしようぐたいよ》で特殊寝台《とくしゅしんだい》を利用《りよう》する。","exampleGapRuby":"介護保険《かいごほけん》の福祉用具貸与《ふくしようぐたいよ》で{{GAP}}を利用《りよう》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"特殊寝台は原則「要介護2以上」が貸与対象。貸与と購入の区別が頻出。","noteEn":"In principle rented to people at care level 2 or above. Rental versus purchase categories are heavily tested.","gapTerm":"特殊寝台","termRuby":"特殊寝台《とくしゅしんだい》","easyJaRuby":"介護保険《かいごほけん》で借《か》りられる、ギャッチベッドなどの介護用《かいごよう》ベッド","noteJaRuby":"特殊寝台《とくしゅしんだい》は原則《げんそく》「要介護《ようかいご》2以上《いじょう》」が貸与対象《たいよたいしょう》。貸与《たいよ》と購入《こうにゅう》の区別《くべつ》が頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV282","term":"肌着","kana":"はだぎ","romaji":"hadagi","english":"underwear / innerwear","easyJa":"一番下に着る、肌に直接触れる服（下着やシャツ）","englishDesc":"Clothes worn next to the skin.","exampleJa":"汗をかいたため、清潔な肌着に交換する。","exampleEn":"Because of sweating, the underwear is changed for clean ones.","exampleRuby":"汗《あせ》をかいたため、清潔《せいけつ》な肌着《はだぎ》に交換《こうかん》する。","exampleGapRuby":"汗《あせ》をかいたため、清潔《せいけつ》な{{GAP}}に交換《こうかん》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"肌着は汗を吸うものを選ぶ。片麻痺の人の交換は「脱健着患」で行う。","noteEn":"Choose absorbent underwear, and change it following the 脱健着患 order for hemiplegia.","gapTerm":"肌着","termRuby":"肌着《はだぎ》","easyJaRuby":"一番下《いちばんした》に着《き》る、肌《はだ》に直接触《ちょくせつふ》れる服《ふく》（下着《したぎ》やシャツ）","noteJaRuby":"肌着《はだぎ》は汗《あせ》を吸《す》うものを選《えら》ぶ。片麻痺《かたまひ》の人《ひと》の交換《こうかん》は「脱健着患《だっけんちゃっかん》」で行《おこな》う。","noteEnRuby":"Choose absorbent underwear, and change it following the 脱健着患《だっけんちゃっかん》 order for hemiplegia."},{"id":"KV283","term":"防護服","kana":"ぼうごふく","romaji":"bōgofuku","english":"protective suit (PPE)","easyJa":"感染症を防ぐために着る、使い捨てのエプロンやガウン","englishDesc":"Protective clothing worn to block infection.","exampleJa":"ノロウイルス発生時は、マスクと防護服を着用する。","exampleEn":"When norovirus occurs, wear a mask and protective suit.","exampleRuby":"ノロウイルス発生時《はっせいじ》は、マスクと防護服《ぼうごふく》を着用《ちゃくよう》する。","exampleGapRuby":"ノロウイルス発生時《はっせいじ》は、マスクと{{GAP}}を着用《ちゃくよう》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"防護服は「脱ぐとき」に汚染しやすい。着脱の順番が問われる。","noteEn":"Contamination happens mostly when REMOVING PPE. The order of putting on and taking off is tested.","gapTerm":"防護服","termRuby":"防護服《ぼうごふく》","easyJaRuby":"感染症《かんせんしょう》を防《ふせ》ぐために着《き》る、使《つか》い捨《す》てのエプロンやガウン","noteJaRuby":"防護服《ぼうごふく》は「脱《ぬ》ぐとき」に汚染《おせん》しやすい。着脱《ちゃくだつ》の順番《じゅんばん》が問《と》われる。","noteEnRuby":""},{"id":"KV284","term":"空調","kana":"くうちょう","romaji":"kūchō","english":"air conditioning","easyJa":"エアコンなどの温度や湿度の調節","englishDesc":"Equipment that controls room temperature.","exampleJa":"快適な室温を保つために空調を管理する。","exampleEn":"Manage the air conditioning to keep a comfortable room temperature.","exampleRuby":"快適《かいてき》な室温《しつおん》を保《たも》つために空調《くうちょう》を管理《かんり》する。","exampleGapRuby":"快適《かいてき》な室温《しつおん》を保《たも》つために{{GAP}}を管理《かんり》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"高齢者は暑さ・寒さを感じにくい。本人の訴えだけに頼らず室温を測る。","noteEn":"Older people sense heat and cold poorly; measure the room temperature rather than relying on complaints.","gapTerm":"空調","termRuby":"空調《くうちょう》","easyJaRuby":"エアコンなどの温度《おんど》や湿度《しつど》の調節《ちょうせつ》","noteJaRuby":"高齢者《こうれいしゃ》は暑《あつ》さ・寒《さむ》さを感《かん》じにくい。本人《ほんにん》の訴《うった》えだけに頼《たよ》らず室温《しつおん》を測《はか》る。","noteEnRuby":""},{"id":"KV285","term":"スリッパ","kana":"すりっぱ","romaji":"surippa","english":"slippers","easyJa":"家の中で履く、かかとのない履き物","englishDesc":"Loose shoes worn indoors that come off easily.","exampleJa":"転倒を防ぐため、施設内でのスリッパの使用は避ける。","exampleEn":"Avoid using slippers inside the facility to prevent falls.","exampleRuby":"転倒《てんとう》を防《ふせ》ぐため、施設内《しせつない》でのスリッパの使用《しよう》は避《さ》ける。","exampleGapRuby":"転倒《てんとう》を防《ふせ》ぐため、施設内《しせつない》での{{GAP}}の使用《しよう》は避《さ》ける。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"スリッパは脱げやすく転倒の原因。かかとのある靴が適切。","noteEn":"Slippers slip off and cause falls; shoes with a heel counter are appropriate.","gapTerm":"スリッパ","termRuby":"スリッパ","easyJaRuby":"家《いえ》の中《なか》で履《は》く、かかとのない履《は》き物《もの》","noteJaRuby":"スリッパは脱《ぬ》げやすく転倒《てんとう》の原因《げんいん》。かかとのある靴《くつ》が適切《てきせつ》。","noteEnRuby":""},{"id":"KV286","term":"洗浄瓶","kana":"せんじょうびん","romaji":"senjōbin","english":"perineal wash bottle","easyJa":"陰部（おしりなど）を洗うためのお湯を入れるボトル","englishDesc":"A bottle used to pour warm water when washing the private area.","exampleJa":"おむつ交換の際、洗浄瓶でお湯をかけて陰部を洗う。","exampleEn":"During the diaper change, wash the perineal area with warm water from the bottle.","exampleRuby":"おむつ交換《こうかん》の際《さい》、洗浄瓶《せんじょうびん》でお湯《ゆ》をかけて陰部《いんぶ》を洗《あら》う。","exampleGapRuby":"おむつ交換《こうかん》の際《さい》、{{GAP}}でお湯《ゆ》をかけて陰部《いんぶ》を洗《あら》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"陰部洗浄は前から後ろへ。逆にすると尿路感染の原因になる。","noteEn":"Wash front to back; the reverse causes urinary tract infection.","gapTerm":"洗浄瓶","termRuby":"洗浄瓶《せんじょうびん》","easyJaRuby":"陰部《いんぶ》（おしりなど）を洗《あら》うためのお湯《ゆ》を入《い》れるボトル","noteJaRuby":"陰部洗浄《いんぶせんじょう》は前《まえ》から後《うし》ろへ。逆《ぎゃく》にすると尿路感染《にょうろかんせん》の原因《げんいん》になる。","noteEnRuby":""},{"id":"KV287","term":"手指消毒液","kana":"しゅししょうどくえき","romaji":"shushishōdokueki","english":"hand sanitizer","easyJa":"手についたばい菌を殺すアルコールの薬","englishDesc":"Alcohol liquid used to clean the hands.","exampleJa":"ケアの前と後には、アルコール性の手指消毒液を使用する。","exampleEn":"Use alcohol hand sanitiser before and after care.","exampleRuby":"ケアの前《まえ》と後《あと》には、アルコール性《せい》の手指消毒液《しゅししょうどくえき》を使用《しよう》する。","exampleGapRuby":"ケアの前《まえ》と後《あと》には、アルコール性《せい》の{{GAP}}を使用《しよう》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"手指衛生は感染対策の基本。ただしノロウイルスには流水と石けんが必要。","noteEn":"Hand hygiene is basic, but norovirus requires running water and soap instead.","gapTerm":"手指消毒液","termRuby":"手指消毒液《しゅししょうどくえき》","easyJaRuby":"手《て》についたばい菌《きん》を殺《ころ》すアルコールの薬《くすり》","noteJaRuby":"手指衛生《しゅしえいせい》は感染対策《かんせんたいさく》の基本《きほん》。ただしノロウイルスには流水《りゅうすい》と石《せっ》けんが必要《ひつよう》。","noteEnRuby":""},{"id":"KV288","term":"おむつカバー","kana":"おむつかばー","romaji":"omutsukabā","english":"diaper cover","easyJa":"布おむつなどの外側に履いて、漏れを防ぐカバー","englishDesc":"The outer cover worn over an absorbent diaper.","exampleJa":"体型に合ったサイズのおむつカバーを使用する。","exampleEn":"Use a diaper cover of the right size for the body shape.","exampleRuby":"体型《たいけい》に合《あ》ったサイズのおむつカバーを使用《しよう》する。","exampleGapRuby":"体型《たいけい》に合《あ》ったサイズの{{GAP}}を使用《しよう》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"サイズが合わないと漏れ・皮膚トラブルの原因。きつく締めすぎない。","noteEn":"The wrong size causes leaks and skin damage; do not fasten it too tightly.","gapTerm":"おむつカバー","termRuby":"おむつカバー","easyJaRuby":"布《ぬの》おむつなどの外側《そとがわ》に履《は》いて、漏《も》れを防《ふせ》ぐカバー","noteJaRuby":"サイズが合《あ》わないと漏《も》れ・皮膚《ひふ》トラブルの原因《げんいん》。きつく締《し》めすぎない。","noteEnRuby":""},{"id":"KV289","term":"ノーマライゼーション","kana":"のーまらいぜーしょん","romaji":"nōmaraizēshon","english":"normalization","easyJa":"障害の有無に関わらず同じように普通の生活ができる社会にする考え方","englishDesc":"The idea that people with and without disabilities should live ordinary lives together.","exampleJa":"ノーマライゼーションの理念に基づき支援する。","exampleEn":"Provide support based on the principle of normalisation.","exampleRuby":"ノーマライゼーションの理念《りねん》に基《もと》づき支援《しえん》する。","exampleGapRuby":"{{GAP}}の理念《りねん》に基《もと》づき支援《しえん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"人間の尊厳と自立","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"提唱者はデンマークのバンク-ミケルセン。「障害者を普通にする」ではなく「生活を普通にする」考え方。","noteEn":"Proposed by Bank-Mikkelsen (Denmark). It normalises living conditions, NOT the person.","gapTerm":"ノーマライゼーション","termRuby":"ノーマライゼーション","easyJaRuby":"障害《しょうがい》の有無《うむ》に関《かか》わらず同《おな》じように普通《ふつう》の生活《せいかつ》ができる社会《しゃかい》にする考《かんが》え方《かた》","noteJaRuby":"提唱者《ていしょうしゃ》はデンマークのバンク-ミケルセン。「障害者《しょうがいしゃ》を普通《ふつう》にする」ではなく「生活《せいかつ》を普通《ふつう》にする」考《かんが》え方《かた》。","noteEnRuby":""},{"id":"KV290","term":"介護保険法","kana":"かいごほけんほう","romaji":"kaigohokenhō","english":"Long-Term Care Insurance Act","easyJa":"介護が必要な人を社会全体で支える日本の法律","englishDesc":"The Japanese law under which society as a whole supports people needing care.","exampleJa":"介護保険法の目的について適切なものを選びなさい。","exampleEn":"Choose the appropriate statement about the purpose of the Long-Term Care Insurance Act.","exampleRuby":"介護保険法《かいごほけんほう》の目的《もくてき》について適切《てきせつ》なものを選《えら》びなさい。","exampleGapRuby":"{{GAP}}の目的《もくてき》について適切《てきせつ》なものを選《えら》びなさい。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"2000年施行。目的は「尊厳の保持」と「自立した日常生活の支援」。制度は改正されるため最新版を公式サイトで確認すること。","noteEn":"In force since 2000; its aims are dignity and independent daily living. The law is revised — always check the official site for the latest version.","gapTerm":"介護保険法","termRuby":"介護保険法《かいごほけんほう》","easyJaRuby":"介護《かいご》が必要《ひつよう》な人《ひと》を社会全体《しゃかいぜんたい》で支《ささ》える日本《にほん》の法律《ほうりつ》","noteJaRuby":"2000年施行《ねんしこう》。目的《もくてき》は「尊厳《そんげん》の保持《ほじ》」と「自立《じりつ》した日常生活《にちじょうせいかつ》の支援《しえん》」。制度《せいど》は改正《かいせい》されるため最新版《さいしんばん》を公式《こうしき》サイトで確認《かくにん》すること。","noteEnRuby":""},{"id":"KV291","term":"居宅介護支援","kana":"きょたくかいごしえん","romaji":"kyotakukaigoshien","english":"in-home care support","easyJa":"家で生活するための介護計画を作ること","englishDesc":"Making a care plan for people living at home.","exampleJa":"居宅介護支援事業所のケアマネジャーと相談する。","exampleEn":"Consult the care manager at the in-home care support office.","exampleRuby":"居宅介護支援事業所《きょたくかいごしえんじぎょうしょ》のケアマネジャーと相談《そうだん》する。","exampleGapRuby":"{{GAP}}事業所《じぎょうしょ》のケアマネジャーと相談《そうだん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「居宅介護支援」＝ケアプラン作成。「居宅サービス」＝実際のサービス。混同しやすい。","noteEn":"居宅介護支援 = making the plan; 居宅サービス = the services themselves. Easily confused.","gapTerm":"居宅介護支援","termRuby":"居宅介護支援《きょたくかいごしえん》","easyJaRuby":"家《いえ》で生活《せいかつ》するための介護計画《かいごけいかく》を作《つく》ること","noteJaRuby":"「居宅介護支援《きょたくかいごしえん》」＝ケアプラン作成《さくせい》。「居宅《きょたく》サービス」＝実際《じっさい》のサービス。混同《こんどう》しやすい。","noteEnRuby":"居宅介護支援《きょたくかいごしえん》 = making the plan; 居宅《きょたく》サービス = the services themselves. Easily confused."},{"id":"KV292","term":"多職種連携","kana":"たしょくしゅれんけい","romaji":"tashokushurenkei","english":"interprofessional collaboration","easyJa":"介護士、看護師、医師など色々な職業の人が協力すること","englishDesc":"Different professions working together for the user.","exampleJa":"利用者のために多職種連携を行う。","exampleEn":"Carry out interprofessional collaboration for the user.","exampleRuby":"利用者《りようしゃ》のために多職種連携《たしょくしゅれんけい》を行《おこな》う。","exampleGapRuby":"利用者《りようしゃ》のために{{GAP}}を行《おこな》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"多職種連携では各職種の専門性と役割を理解することが前提。 展","levelEn":"Advanced","noteJa":"アドボカシー＝権利擁護。成年後見制度・オンブズマンと関連づけて覚える。","noteEn":"Advocacy links to the adult guardianship system and the ombudsman.","gapTerm":"アドボカシー","termRuby":"アドボカシー","easyJaRuby":"自分《じぶん》で意見《いけん》を言《い》えない利用者《りようしゃ》の代《か》わりに、権利《けんり》を守《まも》って意見《いけん》を言《い》うこと","noteJaRuby":"アドボカシー＝権利擁護《けんりようご》。成年後見制度《せいねんこうけんせいど》・オンブズマンと関連《かんれん》づけて覚《おぼ》える。","noteEnRuby":""},{"id":"KV295","term":"インフォームド・コンセント","kana":"いんふぉーむど・こんせんと","romaji":"infōmudo-konsento","english":"informed consent","easyJa":"説明をしっかり受けて、納得してから同意すること","englishDesc":"Agreeing to treatment after receiving a full explanation.","exampleJa":"治療の前に医師からインフォームド・コンセントを受ける。","exampleEn":"Receive informed consent from the doctor before treatment.","exampleRuby":"治療《ちりょう》の前《まえ》に医師《いし》からインフォームド・コンセントを受《う》ける。","exampleGapRuby":"治療《ちりょう》の前《まえ》に医師《いし》から{{GAP}}を受《う》ける。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"人間の尊厳と自立","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"説明を受けるのは本人。家族の同意だけで進めるのは原則不適切。","noteEn":"The explanation goes to the person themselves; proceeding on family consent alone is generally wrong.","gapTerm":"インフォームド・コンセント","termRuby":"インフォームド・コンセント","easyJaRuby":"説明《せつめい》をしっかり受《う》けて、納得《なっとく》してから同意《どうい》すること","noteJaRuby":"説明《せつめい》を受《う》けるのは本人《ほんにん》。家族《かぞく》の同意《どうい》だけで進《すす》めるのは原則不適切《げんそくふてきせつ》。","noteEnRuby":""},{"id":"KV296","term":"守秘義務","kana":"しゅひぎむ","romaji":"shuhigimu","english":"duty of confidentiality","easyJa":"仕事で知った利用者の秘密を他の人に話してはいけないルール","englishDesc":"The legal duty not to tell others what you learn about a user at work.","exampleJa":"介護福祉士は法律で守秘義務が定められている。","exampleEn":"Certified care workers have a duty of confidentiality set by law.","exampleRuby":"介護福祉士《かいごふくしし》は法律《ほうりつ》で守秘義務《しゅひぎむ》が定《さだ》められている。","exampleGapRuby":"介護福祉士《かいごふくしし》は法律《ほうりつ》で{{GAP}}が定《さだ》められている。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"守秘義務は退職後も続く。社会福祉士及び介護福祉士法に規定。違反には罰則がある。","noteEn":"The duty continues after leaving the job, is set in the Act, and carries penalties.","gapTerm":"守秘義務","termRuby":"守秘義務《しゅひぎむ》","easyJaRuby":"仕事《しごと》で知《し》った利用者《りようしゃ》の秘密《ひみつ》を他《ほか》の人《ひと》に話《はな》してはいけないルール","noteJaRuby":"守秘義務《しゅひぎむ》は退職後《たいしょくご》も続《つづ》く。社会福祉士及《しゃかいふくししおよ》び介護福祉士法《かいごふくししほう》に規定《きてい》。違反《いはん》には罰則《ばっそく》がある。","noteEnRuby":""},{"id":"KV297","term":"ケアマネジャー","kana":"けあまねじゃー","romaji":"keamanejā","english":"care manager","easyJa":"介護の計画を作る専門家（介護支援専門員）","englishDesc":"The professional who makes the care plan.","exampleJa":"ケアマネジャーが利用者のケアプランを作成する。","exampleEn":"The care manager creates the user's care plan.","exampleRuby":"ケアマネジャーが利用者《りようしゃ》のケアプランを作成《さくせい》する。","exampleGapRuby":"{{GAP}}が利用者《りようしゃ》のケアプランを作成《さくせい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"正式名称は「介護支援専門員」。医師の指示ではなく、本人の希望に基づいて作成する。","noteEn":"The formal name is 介護支援専門員. Plans follow the person's wishes, not a doctor's orders.","gapTerm":"ケアマネジャー","termRuby":"ケアマネジャー","easyJaRuby":"介護《かいご》の計画《けいかく》を作《つく》る専門家《せんもんか》（介護支援専門員《かいごしえんせんもんいん》）","noteJaRuby":"正式名称《せいしきめいしょう》は「介護支援専門員《かいごしえんせんもんいん》」。医師《いし》の指示《しじ》ではなく、本人《ほんにん》の希望《きぼう》に基《もと》づいて作成《さくせい》する。","noteEnRuby":"The formal name is 介護支援専門員《かいごしえんせんもんいん》. Plans follow the person's wishes, not a doctor's orders."},{"id":"KV298","term":"地域包括支援センター","kana":"ちいきほうかつしえんせんたー","romaji":"chiikihōkatsushiensentā","english":"Community Support Center","easyJa":"高齢者が地域で生活できるように相談にのる場所","englishDesc":"A local office that gives advice so older people can live in their community.","exampleJa":"高齢者の虐待について、地域包括支援センターに相談する。","exampleEn":"Consult the community support centre about elder abuse.","exampleRuby":"高齢者《こうれいしゃ》の虐待《ぎゃくたい》について、地域包括支援《ちいきほうかつしえん》センターに相談《そうだん》する。","exampleGapRuby":"高齢者《こうれいしゃ》の虐待《ぎゃくたい》について、{{GAP}}に相談《そうだん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"市町村が設置。保健師・社会福祉士・主任ケアマネジャーの3職種が配置される。","noteEn":"Set up by municipalities, staffed by a public health nurse, a social worker and a chief care manager.","gapTerm":"地域包括支援センター","termRuby":"地域包括支援《ちいきほうかつしえん》センター","easyJaRuby":"高齢者《こうれいしゃ》が地域《ちいき》で生活《せいかつ》できるように相談《そうだん》にのる場所《ばしょ》","noteJaRuby":"市町村《しちょうそん》が設置《せっち》。保健師《ほけんし》・社会福祉士《しゃかいふくしし》・主任《しゅにん》ケアマネジャーの3職種《しょくしゅ》が配置《はいち》される。","noteEnRuby":""},{"id":"KV299","term":"尊厳","kana":"そんげん","romaji":"songen","english":"dignity","easyJa":"人として大切にされること、敬意を払われること","englishDesc":"Being treated with respect as a human being.","exampleJa":"利用者の尊厳を保持し、その人らしい生活を支える。","exampleEn":"Preserve the user's dignity and support a life that is their own.","exampleRuby":"利用者《りようしゃ》の尊厳《そんげん》を保持《ほじ》し、その人《ひと》らしい生活《せいかつ》を支《ささ》える。","exampleGapRuby":"利用者《りようしゃ》の{{GAP}}を保持《ほじ》し、その人《ひと》らしい生活《せいかつ》を支《ささ》える。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"人間の尊厳と自立","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「尊厳の保持」は介護保険法・介護福祉士の倫理の中心。身体拘束・虐待と対で問われる。","noteEn":"Preserving dignity is central to the law and to care ethics, and is tested alongside restraint and abuse.","gapTerm":"尊厳","termRuby":"尊厳《そんげん》","easyJaRuby":"人《ひと》として大切《たいせつ》にされること、敬意《けいい》を払《はら》われること","noteJaRuby":"「尊厳《そんげん》の保持《ほじ》」は介護保険法《かいごほけんほう》・介護福祉士《かいごふくしし》の倫理《りんり》の中心《ちゅうしん》。身体拘束《しんたいこうそく》・虐待《ぎゃくたい》と対《たい》で問《と》われる。","noteEnRuby":""},{"id":"KV300","term":"自立支援","kana":"じりつしえん","romaji":"jiritsushien","english":"support for independence","easyJa":"自分でできることを増やし、自分で生きるのを助けること","englishDesc":"Helping a person do more for themselves and live their own life.","exampleJa":"介護保険制度の基本理念は、利用者の自立支援である。","exampleEn":"The basic principle of the insurance system is support for the user's independence.","exampleRuby":"介護保険制度《かいごほけんせいど》の基本理念《きほんりねん》は、利用者《りようしゃ》の自立支援《じりつしえん》である。","exampleGapRuby":"介護保険制度《かいごほけんせいど》の基本理念《きほんりねん》は、利用者《りようしゃ》の{{GAP}}である。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「自立支援」は「何もしない」ことではない。できない部分を補い、できる部分を活かす。","noteEn":"It does not mean doing nothing: support what cannot be done, use what can.","gapTerm":"自立支援","termRuby":"自立支援《じりつしえん》","easyJaRuby":"自分《じぶん》でできることを増《ふ》やし、自分《じぶん》で生《い》きるのを助《たす》けること","noteJaRuby":"「自立支援《じりつしえん》」は「何《なに》もしない」ことではない。できない部分《ぶぶん》を補《おぎな》い、できる部分《ぶぶん》を活《い》かす。","noteEnRuby":""},{"id":"KV301","term":"受容","kana":"じゅよう","romaji":"juyō","english":"acceptance","easyJa":"相手の気持ちや状況を否定せずに、そのまま受け入れること","englishDesc":"Accepting the person's feelings as they are, without denying them.","exampleJa":"利用者の悲しむ気持ちをそのまま受容する。","exampleEn":"Accept the user's feelings of sadness as they are.","exampleRuby":"利用者《りようしゃ》の悲《かな》しむ気持《きも》ちをそのまま受容《じゅよう》する。","exampleGapRuby":"利用者《りようしゃ》の悲《かな》しむ気持《きも》ちをそのまま{{GAP}}する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"バイステックの7原則の一つ。受容は「賛成する」ことではない。","noteEn":"One of Biestek's seven principles. Acceptance is not the same as agreement.","gapTerm":"受容","termRuby":"受容《じゅよう》","easyJaRuby":"相手《あいて》の気持《きも》ちや状況《じょうきょう》を否定《ひてい》せずに、そのまま受《う》け入《い》れること","noteJaRuby":"バイステックの7原則《げんそく》の一《ひと》つ。受容《じゅよう》は「賛成《さんせい》する」ことではない。","noteEnRuby":""},{"id":"KV302","term":"共感","kana":"きょうかん","romaji":"kyōkan","english":"empathy","easyJa":"相手の気持ちを「自分も同じように感じる」と理解すること","englishDesc":"Understanding and feeling what the other person feels.","exampleJa":"利用者の言葉に共感的な態度で耳を傾ける。","exampleEn":"Listen to the user's words with an empathetic attitude.","exampleRuby":"利用者《りようしゃ》の言葉《ことば》に共感的《きょうかんてき》な態度《たいど》で耳《みみ》を傾《かたむ》ける。","exampleGapRuby":"利用者《りようしゃ》の言葉《ことば》に{{GAP}}的《てき》な態度《たいど》で耳《みみ》を傾《かたむ》ける。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「共感」（相手の立場で感じる）と「同情」（かわいそうと思う）は別。試験は「共感」。","noteEn":"共感 (feeling with the person) is not 同情 (pity). The exam uses 共感.","gapTerm":"共感","termRuby":"共感《きょうかん》","easyJaRuby":"相手《あいて》の気持《きも》ちを「自分《じぶん》も同《おな》じように感《かん》じる」と理解《りかい》すること","noteJaRuby":"「共感《きょうかん》」（相手《あいて》の立場《たちば》で感《かん》じる）と「同情《どうじょう》」（かわいそうと思《おも》う）は別《べつ》。試験《しけん》は「共感《きょうかん》」。","noteEnRuby":"共感《きょうかん》 (feeling with the person) is not 同情《どうじょう》 (pity). The exam uses 共感《きょうかん》."},{"id":"KV303","term":"身体拘束","kana":"しんたいこうそく","romaji":"shintaikōsoku","english":"physical restraint","easyJa":"ベッドに縛ったり、部屋に鍵をかけて動けなくすること","englishDesc":"Tying a person down or locking them in so they cannot move.","exampleJa":"利用者の安全のためであっても、身体拘束は原則禁止である。","exampleEn":"Even for the user's safety, physical restraint is banned in principle.","exampleRuby":"利用者《りようしゃ》の安全《あんぜん》のためであっても、身体拘束《しんたいこうそく》は原則禁止《げんそくきんし》である。","exampleGapRuby":"利用者《りようしゃ》の安全《あんぜん》のためであっても、{{GAP}}は原則禁止《げんそくきんし》である。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"例外3要件は「切迫性・非代替性・一時性」の全てを満たす場合のみ。記録も義務。","noteEn":"The three exceptions — imminence, no alternative, temporary — must ALL be met, and recording is mandatory.","gapTerm":"身体拘束","termRuby":"身体拘束《しんたいこうそく》","easyJaRuby":"ベッドに縛《しば》ったり、部屋《へや》に鍵《かぎ》をかけて動《うご》けなくすること","noteJaRuby":"例外《れいがい》3要件《ようけん》は「切迫性《せっぱくせい》・非代替性《ひだいたいせい》・一時性《いちじせい》」の全《すべ》てを満《み》たす場合《ばあい》のみ。記録《きろく》も義務《ぎむ》。","noteEnRuby":""},{"id":"KV304","term":"成年後見制度","kana":"せいねんこうけんせいど","romaji":"seinenkōkenseido","english":"adult guardianship system","easyJa":"自分でお金の管理ができない人を守る制度","englishDesc":"A system to protect people who can no longer manage money or contracts.","exampleJa":"契約が一人でできない利用者に成年後見制度を説明する。","exampleEn":"Explain the adult guardianship system to a user who cannot make contracts alone.","exampleRuby":"契約《けいやく》が一人《ひとり》でできない利用者《りようしゃ》に成年後見制度《せいねんこうけんせいど》を説明《せつめい》する。","exampleGapRuby":"契約《けいやく》が一人《ひとり》でできない利用者《りようしゃ》に{{GAP}}を説明《せつめい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"法定後見（後見・保佐・補助の3類型）と任意後見がある。判断能力の程度で分かれる。","noteEn":"Statutory guardianship has three types (guardianship, curatorship, assistance); voluntary guardianship is separate.","gapTerm":"成年後見制度","termRuby":"成年後見制度《せいねんこうけんせいど》","easyJaRuby":"自分《じぶん》でお金《かね》の管理《かんり》ができない人《ひと》を守《まも》る制度《せいど》","noteJaRuby":"法定後見《ほうていこうけん》（後見《こうけん》・保佐《ほさ》・補助《ほじょ》の3類型《るいけい》）と任意後見《にんいこうけん》がある。判断能力《はんだんのうりょく》の程度《ていど》で分《わ》かれる。","noteEnRuby":""},{"id":"KV305","term":"生活保護制度","kana":"せいかつほごせいど","romaji":"seikatsuhogoseido","english":"public assistance system","easyJa":"お金がなくて生活できない人を国が助けるルール","englishDesc":"The system by which the country supports people who cannot afford to live.","exampleJa":"生活保護制度の4つの原理について正しいものを選びなさい。","exampleEn":"Choose the correct statement about the four principles of public assistance.","exampleRuby":"生活保護制度《せいかつほごせいど》の4つの原理《げんり》について正《ただ》しいものを選《えら》びなさい。","exampleGapRuby":"{{GAP}}の4つの原理《げんり》について正《ただ》しいものを選《えら》びなさい。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"4つの原理は 国家責任・無差別平等・最低生活保障・補足性。生活保護は8つの扶助からなる。","noteEn":"The four principles: state responsibility, non-discrimination, minimum living standard, supplementarity. It has eight types of aid.","gapTerm":"生活保護制度","termRuby":"生活保護制度《せいかつほごせいど》","easyJaRuby":"お金《かね》がなくて生活《せいかつ》できない人《ひと》を国《くに》が助《たす》けるルール","noteJaRuby":"4つの原理《げんり》は 国家責任《こっかせきにん》・無差別平等《むさべつびょうどう》・最低生活保障《さいていせいかつほしょう》・補足性《ほそくせい》。生活保護《せいかつほご》は8つの扶助《ふじょ》からなる。","noteEnRuby":""},{"id":"KV306","term":"訪問介護","kana":"ほうもんかいご","romaji":"hōmonkaigo","english":"home help service","easyJa":"介護士が利用者の家に行って、介護や家事をすること","englishDesc":"A service in which care workers go to the user's home.","exampleJa":"訪問介護員（ホームヘルパー）が自宅で入浴介助を行う。","exampleEn":"A home helper provides bathing assistance at home.","exampleRuby":"訪問介護員《ほうもんかいごいん》（ホームヘルパー）が自宅《じたく》で入浴介助《にゅうよくかいじょ》を行《おこな》う。","exampleGapRuby":"{{GAP}}員《いん》（ホームヘルパー）が自宅《じたく》で入浴介助《にゅうよくかいじょ》を行《おこな》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"訪問介護は「身体介護」と「生活援助」に分かれる。同居家族がいる場合の生活援助の扱いが問われる。","noteEn":"It splits into personal care and household help. Household help with a co-resident family is a tested point.","gapTerm":"訪問介護","termRuby":"訪問介護《ほうもんかいご》","easyJaRuby":"介護士《かいごし》が利用者《りようしゃ》の家《いえ》に行《おこな》って、介護《かいご》や家事《かじ》をすること","noteJaRuby":"訪問介護《ほうもんかいご》は「身体介護《しんたいかいご》」と「生活援助《せいかつえんじょ》」に分《わ》かれる。同居家族《どうきょかぞく》がいる場合《ばあい》の生活援助《せいかつえんじょ》の扱《あつか》いが問《と》われる。","noteEnRuby":""},{"id":"KV307","term":"理学療法士","kana":"りがくりょうほうし","romaji":"rigakuryōhōshi","english":"physical therapist","easyJa":"歩く、座るなどの基本的な体の動きをリハビリする専門家","englishDesc":"A professional who rehabilitates basic movements such as walking and sitting.","exampleJa":"リハビリについて、理学療法士（PT）から助言をもらう。","exampleEn":"Get advice about rehabilitation from the physical therapist (PT).","exampleRuby":"リハビリについて、理学療法士《りがくりょうほうし》（PT）から助言《じょげん》をもらう。","exampleGapRuby":"リハビリについて、{{GAP}}（PT）から助言《じょげん》をもらう。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"PT（理学療法士）は基本動作、OT（作業療法士）は応用動作・生活行為。混同しやすい。","noteEn":"PT covers basic movement; OT covers applied movement and daily activities. Often confused.","gapTerm":"理学療法士","termRuby":"理学療法士《りがくりょうほうし》","easyJaRuby":"歩《ある》く、座《すわ》るなどの基本的《きほんてき》な体《からだ》の動《うご》きをリハビリする専門家《せんもんか》","noteJaRuby":"PT（理学療法士《りがくりょうほうし》）は基本動作《きほんどうさ》、OT（作業療法士《さぎょうりょうほうし》）は応用動作《おうようどうさ》・生活行為《せいかつこうい》。混同《こんどう》しやすい。","noteEnRuby":""},{"id":"KV308","term":"虐待","kana":"ぎゃくたい","romaji":"gyakutai","english":"abuse","easyJa":"叩いたり、ひどい言葉を言ったりして、いじめること","englishDesc":"Hitting someone or saying cruel things to them.","exampleJa":"高齢者虐待防止法における、心理的虐待の例として適切なもの。","exampleEn":"An example of psychological abuse under the Elder Abuse Prevention Act.","exampleRuby":"高齢者虐待防止法《こうれいしゃぎゃくたいぼうしほう》における、心理的虐待《しんりてきぎゃくたい》の例《れい》として適切《てきせつ》なもの。","exampleGapRuby":"高齢者《こうれいしゃ》{{GAP}}防止法《ぼうしほう》における、心理的虐待《しんりてきぎゃくたい》の例《れい》として適切《てきせつ》なもの。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"5類型は 身体的・心理的・性的・経済的・介護放棄（ネグレクト）。発見者には通報義務がある。","noteEn":"Five types: physical, psychological, sexual, economic, neglect. Discoverers have a duty to report.","gapTerm":"虐待","termRuby":"虐待《ぎゃくたい》","easyJaRuby":"叩《たた》いたり、ひどい言葉《ことば》を言《い》ったりして、いじめること","noteJaRuby":"5類型《るいけい》は 身体的《しんたいてき》・心理的《しんりてき》・性的《せいてき》・経済的《けいざいてき》・介護放棄《かいごほうき》（ネグレクト）。発見者《はっけんしゃ》には通報義務《つうほうぎむ》がある。","noteEnRuby":""},{"id":"KV309","term":"作業療法士","kana":"さぎょうりょうほうし","romaji":"sagyōryōhōshi","english":"occupational therapist","easyJa":"ご飯を食べるなど、生活のためのリハビリをする人","englishDesc":"A professional who rehabilitates daily-life activities such as eating.","exampleJa":"作業療法士（OT）が自助具の使い方の指導をする。","exampleEn":"The occupational therapist (OT) teaches how to use self-help devices.","exampleRuby":"作業療法士《さぎょうりょうほうし》（OT）が自助具《じじょぐ》の使《つか》い方《かた》の指導《しどう》をする。","exampleGapRuby":"{{GAP}}（OT）が自助具《じじょぐ》の使《つか》い方《かた》の指導《しどう》をする。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"OTは自助具・手工芸・生活動作を担当。PTとの役割の違いを整理する。","noteEn":"OT handles self-help devices, crafts and daily activities. Sort out the difference from PT.","gapTerm":"作業療法士","termRuby":"作業療法士《さぎょうりょうほうし》","easyJaRuby":"ご飯《はん》を食《た》べるなど、生活《せいかつ》のためのリハビリをする人《ひと》","noteJaRuby":"OTは自助具《じじょぐ》・手工芸《しゅこうげい》・生活動作《せいかつどうさ》を担当《たんとう》。PTとの役割《やくわり》の違《ちが》いを整理《せいり》する。","noteEnRuby":""},{"id":"KV310","term":"言語聴覚士","kana":"げんごちょうかくし","romaji":"gengochōkakushi","english":"speech-language therapist","easyJa":"話すことや飲み込むこと（嚥下）のリハビリをする人","englishDesc":"A professional who rehabilitates speaking and swallowing.","exampleJa":"嚥下機能の評価について、言語聴覚士（ST）に相談する。","exampleEn":"Consult the speech-language therapist (ST) about swallowing assessment.","exampleRuby":"嚥下機能《えんげきのう》の評価《ひょうか》について、言語聴覚士《げんごちょうかくし》（ST）に相談《そうだん》する。","exampleGapRuby":"嚥下機能《えんげきのう》の評価《ひょうか》について、{{GAP}}（ST）に相談《そうだん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"STは「話す・聞く・飲み込む」を担当。嚥下の評価はSTに相談するのが正解。","noteEn":"ST covers speaking, hearing and swallowing. Swallowing assessment goes to the ST.","gapTerm":"言語聴覚士","termRuby":"言語聴覚士《げんごちょうかくし》","easyJaRuby":"話《はな》すことや飲《の》み込《こ》むこと（嚥下《えんげ》）のリハビリをする人《ひと》","noteJaRuby":"STは「話《はな》す・聞《き》く・飲《の》み込《こ》む」を担当《たんとう》。嚥下《えんげ》の評価《ひょうか》はSTに相談《そうだん》するのが正解《せいかい》。","noteEnRuby":""},{"id":"KV311","term":"通所介護","kana":"つうしょかいご","romaji":"tsūshokaigo","english":"day service","easyJa":"昼間に施設へ通って、お風呂や食事、体操などをすること","englishDesc":"A service where users go to a facility in the daytime.","exampleJa":"家族の休息も兼ねて、通所介護（デイサービス）を利用する。","exampleEn":"The family uses day service, which also gives them a rest.","exampleRuby":"家族《かぞく》の休息《きゅうそく》も兼《か》ねて、通所介護《つうしょかいご》（デイサービス）を利用《りよう》する。","exampleGapRuby":"家族《かぞく》の休息《きゅうそく》も兼《か》ねて、{{GAP}}（デイサービス）を利用《りよう》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"通所介護（デイサービス）と通所リハビリテーション（デイケア）は目的が違う。","noteEn":"Day service (care and social life) differs in purpose from day care (rehabilitation).","gapTerm":"通所介護","termRuby":"通所介護《つうしょかいご》","easyJaRuby":"昼間《ひるま》に施設《しせつ》へ通《かよ》って、お風呂《ふろ》や食事《しょくじ》、体操《たいそう》などをすること","noteJaRuby":"通所介護《つうしょかいご》（デイサービス）と通所《つうしょ》リハビリテーション（デイケア）は目的《もくてき》が違《ちが》う。","noteEnRuby":""},{"id":"KV312","term":"短期入所生活介護","kana":"たんきにゅうしょせいかつかいご","romaji":"tankinyūshoseikatsukaigo","english":"short-stay service","easyJa":"短い期間だけ（数日〜数週間）施設に泊まること","englishDesc":"Staying at a facility for a short period.","exampleJa":"家族が旅行に行くため、短期入所生活介護を利用する。","exampleEn":"Short-stay service is used while the family travels.","exampleRuby":"家族《かぞく》が旅行《りょこう》に行《い》くため、短期入所生活介護《たんきにゅうしょせいかつかいご》を利用《りよう》する。","exampleGapRuby":"家族《かぞく》が旅行《りょこう》に行《い》くため、{{GAP}}を利用《りよう》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"ショートステイは家族のレスパイトにもなる。緊急時の受け入れも問われる。","noteEn":"Short stays also provide respite for families; emergency admission is also tested.","gapTerm":"短期入所生活介護","termRuby":"短期入所生活介護《たんきにゅうしょせいかつかいご》","easyJaRuby":"短《みじか》い期間《きかん》だけ（数日《すうじつ》〜数週間《すうしゅうかん》）施設《しせつ》に泊《と》まること","noteJaRuby":"ショートステイは家族《かぞく》のレスパイトにもなる。緊急時《きんきゅうじ》の受《う》け入《い》れも問《と》われる。","noteEnRuby":""},{"id":"KV313","term":"特別養護老人ホーム","kana":"とくべつようごろうじんほーむ","romaji":"tokubetsuyōgorōjinhōmu","english":"special nursing home","easyJa":"重い介護が必要な人がずっと住む施設","englishDesc":"A facility where people needing heavy care live permanently.","exampleJa":"要介護3以上の人が特別養護老人ホームに入所できる。","exampleEn":"People at care level 3 or above can enter a special nursing home.","exampleRuby":"要介護《ようかいご》3以上《いじょう》の人《ひと》が特別養護老人《とくべつようごろうじん》ホームに入所《にゅうしょ》できる。","exampleGapRuby":"要介護《ようかいご》3以上《いじょう》の人《ひと》が{{GAP}}に入所《にゅうしょ》できる。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"原則「要介護3以上」。介護老人保健施設（在宅復帰が目的）との違いが頻出。","noteEn":"In principle care level 3 or above. Contrast with a 老健, whose purpose is return to home living.","gapTerm":"特別養護老人ホーム","termRuby":"特別養護老人《とくべつようごろうじん》ホーム","easyJaRuby":"重《おも》い介護《かいご》が必要《ひつよう》な人《ひと》がずっと住《す》む施設《しせつ》","noteJaRuby":"原則《げんそく》「要介護《ようかいご》3以上《いじょう》」。介護老人保健施設《かいごろうじんほけんしせつ》（在宅復帰《ざいたくふっき》が目的《もくてき》）との違《ちが》いが頻出《ひんしゅつ》。","noteEnRuby":"In principle care level 3 or above. Contrast with a 老健《ろうけん》, whose purpose is return to home living."},{"id":"KV314","term":"プライバシー","kana":"ぷらいばしー","romaji":"puraibashī","english":"privacy","easyJa":"人に見られたくない、その人だけのプライベートなこと","englishDesc":"Things about a person that they do not want others to see or know.","exampleJa":"排泄介助では、利用者のプライバシーの保護を優先する。","exampleEn":"In toileting assistance, protecting the user's privacy comes first.","exampleRuby":"排泄介助《はいせつかいじょ》では、利用者《りようしゃ》のプライバシーの保護《ほご》を優先《ゆうせん》する。","exampleGapRuby":"排泄介助《はいせつかいじょ》では、利用者《りようしゃ》の{{GAP}}の保護《ほご》を優先《ゆうせん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"人間の尊厳と自立","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"プライバシーの保護は「見えない配慮」も含む。声の大きさ・カーテン・タイミング。","noteEn":"Privacy includes unseen consideration: voice volume, curtains and timing.","gapTerm":"プライバシー","termRuby":"プライバシー","easyJaRuby":"人《ひと》に見《み》られたくない、その人《ひと》だけのプライベートなこと","noteJaRuby":"プライバシーの保護《ほご》は「見《み》えない配慮《はいりょ》」も含《ふく》む。声《こえ》の大《おお》きさ・カーテン・タイミング。","noteEnRuby":""},{"id":"KV315","term":"インシデント","kana":"いんしでんと","romaji":"inshidento","english":"incident","easyJa":"事故にはならなかったが「ヒヤッと」した出来事","englishDesc":"A near-miss event that did not become an accident.","exampleJa":"薬を落としそうになったため、インシデント報告書を書く。","exampleEn":"Because the medicine was nearly dropped, an incident report is written.","exampleRuby":"薬《くすり》を落《お》としそうになったため、インシデント報告書《ほうこくしょ》を書《か》く。","exampleGapRuby":"薬《くすり》を落《お》としそうになったため、{{GAP}}報告書《ほうこくしょ》を書《か》く。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"インシデント（ヒヤリハット）＝事故に至らなかった。アクシデント＝事故。報告は個人の責任追及のためではない。","noteEn":"Incident = near miss; accident = actual harm. Reports exist to improve systems, not to blame individuals.","gapTerm":"インシデント","termRuby":"インシデント","easyJaRuby":"事故《じこ》にはならなかったが「ヒヤッと」した出来事《できごと》","noteJaRuby":"インシデント（ヒヤリハット）＝事故《じこ》に至《いた》らなかった。アクシデント＝事故《じこ》。報告《ほうこく》は個人《こじん》の責任追及《せきにんついきゅう》のためではない。","noteEnRuby":""},{"id":"KV316","term":"バリアフリー","kana":"ばりあふりー","romaji":"bariafurī","english":"barrier-free","easyJa":"高齢者が生活する上で、邪魔になるもの（段差など）をなくすこと","englishDesc":"Removing things such as steps that get in the way of daily life.","exampleJa":"施設内は車いすで移動しやすいようにバリアフリーになっている。","exampleEn":"The facility is barrier-free so wheelchairs can move easily.","exampleRuby":"施設内《しせつない》は車《くるま》いすで移動《いどう》しやすいようにバリアフリーになっている。","exampleGapRuby":"施設内《しせつない》は車《くるま》いすで移動《いどう》しやすいように{{GAP}}になっている。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"バリアフリーは「障壁を取り除く」、ユニバーサルデザインは「最初から皆が使える」設計。","noteEn":"Barrier-free removes existing barriers; universal design builds for everyone from the start.","gapTerm":"バリアフリー","termRuby":"バリアフリー","easyJaRuby":"高齢者《こうれいしゃ》が生活《せいかつ》する上《じょう》で、邪魔《じゃま》になるもの（段差《だんさ》など）をなくすこと","noteJaRuby":"バリアフリーは「障壁《しょうへき》を取《と》り除《のぞ》く」、ユニバーサルデザインは「最初《さいしょ》から皆《みな》が使《つか》える」設計《せっけい》。","noteEnRuby":""},{"id":"KV317","term":"ユニットケア","kana":"ゆにっとけあ","romaji":"yunittokea","english":"unit care","easyJa":"少人数を一つのグループとして介護するやり方","englishDesc":"Care that treats a small group of residents as one living unit.","exampleJa":"個別性を重視したユニットケアを実施する。","exampleEn":"Carry out unit care that values each individual.","exampleRuby":"個別性《こべつせい》を重視《じゅうし》したユニットケアを実施《じっし》する。","exampleGapRuby":"個別性《こべつせい》を重視《じゅうし》した{{GAP}}を実施《じっし》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"ユニットケアは少人数（おおむね10人以下）と個室が基本。個別性の尊重が目的。","noteEn":"Unit care uses small groups (about 10 or fewer) and private rooms, to respect individuality.","gapTerm":"ユニットケア","termRuby":"ユニットケア","easyJaRuby":"少人数《しょうにんずう》を一《ひと》つのグループとして介護《かいご》するやり方《かた》","noteJaRuby":"ユニットケアは少人数《しょうにんずう》（おおむね10人以下《にんいか》）と個室《こしつ》が基本《きほん》。個別性《こべつせい》の尊重《そんちょう》が目的《もくてき》。","noteEnRuby":""},{"id":"KV318","term":"レスパイトケア","kana":"れすぱいとけあ","romaji":"resupaitokea","english":"respite care","easyJa":"介護をしている家族が、少しの間休めるように支援すること","englishDesc":"Support that lets a caring family member rest for a while.","exampleJa":"家族の身体的・精神的な負担を軽くするレスパイトケア。","exampleEn":"Respite care that reduces the family's physical and mental burden.","exampleRuby":"家族《かぞく》の身体的《しんたいてき》・精神的《せいしんてき》な負担《ふたん》を軽《かる》くするレスパイトケア。","exampleGapRuby":"家族《かぞく》の身体的《しんたいてき》・精神的《せいしんてき》な負担《ふたん》を軽《かる》くする{{GAP}}。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"レスパイトケアの手段はショートステイ・デイサービスなど。虐待予防にもつながる。","noteEn":"Delivered through short stays and day services; it also helps prevent abuse.","gapTerm":"レスパイトケア","termRuby":"レスパイトケア","easyJaRuby":"介護《かいご》をしている家族《かぞく》が、少《すこ》しの間休《あいだやす》めるように支援《しえん》すること","noteJaRuby":"レスパイトケアの手段《しゅだん》はショートステイ・デイサービスなど。虐待予防《ぎゃくたいよぼう》にもつながる。","noteEnRuby":""},{"id":"KV319","term":"グループホーム","kana":"ぐるーぷほーむ","romaji":"gurūpuhōmu","english":"group home","easyJa":"認知症の人たちが、少人数で一緒に暮らす施設","englishDesc":"A small home where people with dementia live together.","exampleJa":"認知症対応型共同生活介護（グループホーム）の特徴。","exampleEn":"Features of group homes for people with dementia.","exampleRuby":"認知症対応型共同生活介護《にんちしょうたいおうがたきょうどうせいかつかいご》（グループホーム）の特徴《とくちょう》。","exampleGapRuby":"認知症対応型共同生活介護《にんちしょうたいおうがたきょうどうせいかつかいご》（{{GAP}}）の特徴《とくちょう》。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"正式名称は「認知症対応型共同生活介護」。1ユニット9人以下、地域密着型サービス。","noteEn":"Formally 認知症対応型共同生活介護: up to nine people per unit, a community-based service.","gapTerm":"グループホーム","termRuby":"グループホーム","easyJaRuby":"認知症《にんちしょう》の人《ひと》たちが、少人数《しょうにんずう》で一緒《いっしょ》に暮《く》らす施設《しせつ》","noteJaRuby":"正式名称《せいしきめいしょう》は「認知症対応型共同生活介護《にんちしょうたいおうがたきょうどうせいかつかいご》」。1ユニット9人以下《にんいか》、地域密着型《ちいきみっちゃくがた》サービス。","noteEnRuby":"Formally 認知症対応型共同生活介護《 ere.","gapTerm":"身体障害者手帳","termRuby":"身体障害者手帳《しんたいしょうがいしゃてちょう》","easyJaRuby":"体《からだ》に障害《しょうがい》がある人《ひと》が持《も》つ手帳《てちょう》","noteJaRuby":"申請先《しんせいさき》は市町村《しちょうそん》。等級《とうきゅう》は1〜6級《きゅう》で、1級《きゅう》が最《もっと》も重《おも》い。","noteEnRuby":""},{"id":"KV324","term":"年金制度","kana":"ねんきんせいど","romaji":"nenkinseido","english":"pension system","easyJa":"若い時に払い、年を取ってから毎月国からお金をもらえるシステム","englishDesc":"The system that pays money monthly to people in old age.","exampleJa":"日本の公的年金制度に関する記述として適切なもの。","exampleEn":"A statement about Japan's public pension system.","exampleRuby":"日本《にほん》の公的年金制度《こうてきねんきんせいど》に関《かん》する記述《きじゅつ》として適切《てきせつ》なもの。","exampleGapRuby":"日本《にほん》の公的《こうてき》{{GAP}}に関《かん》する記述《きじゅつ》として適切《てきせつ》なもの。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"公的年金は国民年金（基礎年金）と厚生年金の2階建て。社会保険の一つ。","noteEn":"The public pension has two tiers: the National Pension and the Employees' Pension. It is one of the social insurances.","gapTerm":"年金制度","termRuby":"年金制度《ねんきんせいど》","easyJaRuby":"若《わか》い時《とき》に払《はら》い、年《ねん》を取《と》ってから毎月国《まいつきくに》からお金《かね》をもらえるシステム","noteJaRuby":"公的年金《こうてきねんきん》は国民年金《こくみんねんきん》（基礎年金《きそねんきん》）と厚生年金《こうせいねんきん》の2階建《かいだ》て。社会保険《しゃかいほけん》の一《ひと》つ。","noteEnRuby":""},{"id":"KV325","term":"リスクマネジメント","kana":"りすくまねじめんと","romaji":"risukumanejimento","english":"risk management","easyJa":"事故が起きないように、あらかじめ危険を予測して対策をすること","englishDesc":"Predicting dangers in advance and preventing accidents.","exampleJa":"転倒事故を防ぐためのリスクマネジメントを行う。","exampleEn":"Carry out risk management to prevent falls.","exampleRuby":"転倒事故《てんとうじこ》を防《ふせ》ぐためのリスクマネジメントを行《おこな》う。","exampleGapRuby":"転倒事故《てんとうじこ》を防《ふせ》ぐための{{GAP}}を行《おこな》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"リスクマネジメントは「事故を隠さない」「情報を共有する」が前提。抑制で防ぐのは誤り。","noteEn":"It depends on not hiding incidents and sharing information. Preventing accidents by restraint is wrong.","gapTerm":"リスクマネジメント","termRuby":"リスクマネジメント","easyJaRuby":"事故《じこ》が起《お》きないように、あらかじめ危険《きけん》を予測《よそく》して対策《たいさく》をすること","noteJaRuby":"リスクマネジメントは「事故《じこ》を隠《かく》さない」「情報《じょうほう》を共有《きょうゆう》する」が前提《ぜんてい》。抑制《よくせい》で防《ふせ》ぐのは誤《あやま》り。","noteEnRuby":""},{"id":"KV326","term":"パターナリズム","kana":"ぱたーなりずむ","romaji":"patānarizumu","english":"paternalism","easyJa":"「あなたのためだから」と、専門家が勝手に決めてしまうこと","englishDesc":"When a professional decides for the person, saying it is for their own good.","exampleJa":"医療や介護におけるパターナリズムの考え方を避ける。","exampleEn":"Avoid paternalism in medicine and care.","exampleRuby":"医療《いりょう》や介護《かいご》におけるパターナリズムの考《かんが》え方《かた》を避《さ》ける。","exampleGapRuby":"医療《いりょう》や介護《かいご》における{{GAP}}の考《かんが》え方《かた》を避《さ》ける。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"人間の尊厳と自立","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"パターナリズムは自己決定の反対。「本人のため」でも決めつけは不適切。","noteEn":"Paternalism is the opposite of self-determination; deciding \"for their own good\" is inappropriate.","gapTerm":"パターナリズム","termRuby":"パターナリズム","easyJaRuby":"「あなたのためだから」と、専門家《せんもんか》が勝手《かって》に決《き》めてしまうこと","noteJaRuby":"パターナリズムは自己決定《じこけってい》の反対《はんたい》。「本人《ほんにん》のため」でも決《き》めつけは不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV327","term":"契約","kana":"けいやく","romaji":"keiyaku","english":"contract","easyJa":"サービスを使うために、利用者と施設が書類で約束すること","englishDesc":"A written promise between the user and the provider to use a service.","exampleJa":"介護保険サービスを利用するため、事業所と契約を結ぶ。","exampleEn":"A contract is made with the provider to use insurance services.","exampleRuby":"介護保険《かいごほけん》サービスを利用《りよう》するため、事業所《じぎょうしょ》と契約《けいやく》を結《むす》ぶ。","exampleGapRuby":"介護保険《かいごほけん》サービスを利用《りよう》するため、事業所《じぎょうしょ》と{{GAP}}を結《むす》ぶ。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介護保険は「措置」から「契約」に変わった制度。判断能力が不十分な人には成年後見制度。","noteEn":"The system moved from administrative placement to contracts. Guardianship covers those unable to contract.","gapTerm":"契約","termRuby":"契約《けいやく》","easyJaRuby":"サービスを使《つか》うために、利用者《りようしゃ》と施設《しせつ》が書類《しょるい》で約束《やくそく》すること","noteJaRuby":"介護保険《かいごほけん》は「措置《そち》」から「契約《けいやく》」に変《か》わった制度《せいど》。判断能力《はんだんのうりょく》が不十分《ふじゅうぶん》な人《ひと》には成年後見制度《せいねんこうけんせいど》。","noteEnRuby":""},{"id":"KV328","term":"介護報酬","kana":"かいごほうしゅう","romaji":"kaigohōshū","english":"nursing care remuneration","easyJa":"介護のサービスを提供した施設に、国などから払われるお金","englishDesc":"The money paid to providers for the care services they give.","exampleJa":"サービス提供記録は、介護報酬を請求する根拠となる。","exampleEn":"Service records are the basis for claiming care remuneration.","exampleRuby":"サービス提供記録《ていきょうきろく》は、介護報酬《かいごほうしゅう》を請求《せいきゅう》する根拠《こんきょ》となる。","exampleGapRuby":"サービス提供記録《ていきょうきろく》は、{{GAP}}を請求《せいきゅう》する根拠《こんきょ》となる。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"介護報酬は原則3年ごとに改定される。最新の内容は公式サイトで確認すること。","noteEn":"Rates are revised roughly every three years — check the official site for the current version.","gapTerm":"介護報酬","termRuby":"介護報酬《かいごほうしゅう》","easyJaRuby":"介護《かいご》のサービスを提供《ていきょう》した施設《しせつ》に、国《くに》などから払《はら》われるお金《かね》","noteJaRuby":"介護報酬《かいごほうしゅう》は原則《げんそく》3年《ねん》ごとに改定《かいてい》される。最新《さいしん》の内容《ないよう》は公式《こうしき》サイトで確認《かくにん》すること。","noteEnRuby":""},{"id":"KV329","term":"第1号被保険者","kana":"だいいちごうひほけんしゃ","romaji":"daiichigōhihokensha","english":"Category 1 insured person","easyJa":"介護保険に入っている「65歳以上」の人のこと","englishDesc":"An insured person aged 65 or over.","exampleJa":"介護保険の第1号被保険者は、市町村に保険料を納める。","exampleEn":"Category 1 insured persons pay premiums to the municipality.","exampleRuby":"介護保険《かいごほけん》の第《だい》1号被保険者《ごうひほけんしゃ》は、市町村《しちょうそん》に保険料《ほけんりょう》を納《おさ》める。","exampleGapRuby":"介護保険《かいごほけん》の{{GAP}}は、市町村《しちょうそん》に保険料《ほけんりょう》を納《おさ》める。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"第1号は65歳以上、第2号は40〜64歳。 s & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"個人情報の第三者提供には原則本人の同意が必要。家族も第三者にあたる場合がある。","noteEn":"Sharing with third parties needs consent, and family members can count as third parties.","gapTerm":"個人情報保護法","termRuby":"個人情報保護法《こじんじょうほうほごほう》","easyJaRuby":"個人《こじん》の秘密《ひみつ》のデータ（個人情報《こじんじょうほう》）を守《まも》るための日本《にほん》の法律《ほうりつ》","noteJaRuby":"個人情報《こじんじょうほう》の第三者提供《だいさんしゃていきょう》には原則本人《げんそくほんにん》の同意《どうい》が必要《ひつよう》。家族《かぞく》も第三者《だいさんしゃ》にあたる場合《ばあい》がある。","noteEnRuby":""},{"id":"KV336","term":"高額介護サービス費","kana":"こうがくかいごさーびすひ","romaji":"kōgakukaigosābisuhi","english":"high-cost long-term care service benefit","easyJa":"1ヶ月の介護のお金が高くなりすぎた時に、超えた分が戻ってくる仕組み","englishDesc":"A benefit that returns costs above a set monthly limit.","exampleJa":"利用者の負担を減らすため、高額介護サービス費の制度を説明する。","exampleEn":"Explain the high-cost care benefit to reduce the user's burden.","exampleRuby":"利用者《りようしゃ》の負担《ふたん》を減《へ》らすため、高額介護《こうがくかいご》サービス費《ひ》の制度《せいど》を説明《せつめい》する。","exampleGapRuby":"利用者《りようしゃ》の負担《ふたん》を減《へ》らすため、{{GAP}}の制度《せいど》を説明《せつめい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"自己負担が上限を超えた分が後から払い戻される。申請が必要である点が問われる。","noteEn":"The excess is refunded later, and an application is required.","gapTerm":"高額介護サービス費","termRuby":"高額介護《こうがくかいご》サービス費《ひ》","easyJaRuby":"1ヶ月《つき》の介護《かいご》のお金《かね》が高《たか》くなりすぎた時《とき》に、超《こ》えた分《ぶん》が戻《もど》ってくる仕組《しく》み","noteJaRuby":"自己負担《じこふたん》が上限《じょうげん》を超《こ》えた分《ぶん》が後《あと》から払《はら》い戻《もど》される。申請《しんせい》が必要《ひつよう》である点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV337","term":"第2号被保険者","kana":"だいにごうひほけんしゃ","romaji":"dainigōhihokensha","english":"Category 2 insured person","easyJa":"介護保険に入っている「40歳から64歳」の人のこと","englishDesc":"An insured person aged 40 to 64.","exampleJa":"第2号被保険者が介護保険を使える特定疾病について。","exampleEn":"About the specified diseases for which Category 2 insured persons can use the insurance.","exampleRuby":"第《だい》2号被保険者《ごうひほけんしゃ》が介護保険《かいごほけん》を使《つか》える特定疾 》によって施設《しせつ》に入所《にゅうしょ》する。","exampleGapRuby":"契約《けいやく》ではなく、市町村《しちょうそん》の{{GAP}}によって施設《しせつ》に入所《にゅうしょ》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「措置」は虐待などで契約できない場合に使われる。契約制度への例外。","noteEn":"Administrative measures are used when a contract is impossible, such as in abuse cases.","gapTerm":"措置","termRuby":"措置《そち》","easyJaRuby":"虐待《ぎゃくたい》などがあった時《とき》、市町村《しちょうそん》が利用者《りようしゃ》を守《まも》るために強制的《きょうせいてき》にサービスを使《つか》わせること","noteJaRuby":"「措置《そち》」は虐待《ぎゃくたい》などで契約《けいやく》できない場合《ばあい》に使《つか》われる。契約制度《けいやくせいど》への例外《れいがい》。","noteEnRuby":""},{"id":"KV340","term":"介護予防","kana":"かいごよぼう","romaji":"kaigoyobō","english":"long-term care prevention","easyJa":"これ以上介護が必要にならないように、体操などをすること","englishDesc":"Services that stop a person needing more care in the future.","exampleJa":"要支援の利用者に対する介護予防サービス。","exampleEn":"Care-prevention services for users at support level.","exampleRuby":"要支援《ようしえん》の利用者《りようしゃ》に対《たい》する介護予防《かいごよぼう》サービス。","exampleGapRuby":"要支援《ようしえん》の利用者《りようしゃ》に対《たい》する{{GAP}}サービス。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介護予防は「要支援1・2」が対象。地域支援事業とセットで問われる。","noteEn":"Care prevention targets support levels 1 and 2, and is tested with community support projects.","gapTerm":"介護予防","termRuby":"介護予防《かいごよぼう》","easyJaRuby":"これ以上介護《いじょうかいご》が必要《ひつよう》にならないように、体操《たいそう》などをすること","noteJaRuby":"介護予防《かいごよぼう》は「要支援《ようしえん》1・2」が対象《たいしょう》。地域支援事業《ちいきしえんじぎょう》とセットで問《と》われる。","noteEnRuby":""},{"id":"KV341","term":"任意後見","kana":"にんいこうけん","romaji":"nin'ikōken","english":"voluntary guardianship","easyJa":"自分が元気なうちに、将来お金などを管理してくれる人を自分で決めておく制度","englishDesc":"Guardianship arranged by contract while the person still has judgement.","exampleJa":"判断能力があるうちに、任意後見契約を結ぶ。","exampleEn":"Make a voluntary guardianship contract while judgement is still sound.","exampleRuby":"判断能力《はんだんのうりょく》があるうちに、任意後見契約《にんいこうけんけいやく》を結《むす》ぶ。","exampleGapRuby":"判断能力《はんだんのうりょく》があるうちに、{{GAP}}契約《けいやく》を結《むす》ぶ。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"任意後見は公正証書で契約する。法定後見との「時点の違い」が答えの鍵。","noteEn":"It requires a notarised contract. The timing difference from statutory guardianship is the key.","gapTerm":"任意後見","termRuby":"任意後見《にんいこうけん》","easyJaRuby":"自分《じぶん》が元気《げんき》なうちに、将来《しょうらい》お金《かね》などを管理《かんり》してくれる人《ひと》を自分《じぶん》で決《き》めておく制度《せいど》","noteJaRuby":"任意後見《にんいこうけん》は公正証書《こうせいしょうしょ》で契約《けいやく》する。法定後見《ほうていこうけん》との「時点《じてん》の違《ちが》い」が答《こた》えの鍵《かぎ》。","noteEnRuby":""},{"id":"KV342","term":"認知症サポーター","kana":"にんちしょうさぽーたー","romaji":"ninchishōsapōtā","english":"dementia supporter","easyJa":"認知症を正しく理解し、認知症の人を地域で温かく見守る人","englishDesc":"A local resident trained to understand and help people with dementia.","exampleJa":"地域住民を対象に、認知症サポーター養成講座を開催する。","exampleEn":"Hold a dementia supporter training course for local residents.","exampleRuby":"地域住民《ちいきじゅうみん》を対象《たいしょう》に、認知症《にんちしょう》サポーター養成講座《ようせいこうざ》を開催《かいさい》する。","exampleGapRuby":"地域住民《ちいきじゅうみん》を対象《たいしょう》に、{{GAP}}養成講座《ようせいこうざ》を開催《かいさい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"サポーターは特別な支援を行う人ではなく「正しく理解し見守る人」。","noteEn":"Supporters are not specialists; they understand dementia correctly and watch over people.","gapTerm":"認知症サポーター","termRuby":"認知症《にんちしょう》サポーター","easyJaRuby":"認知症《にんちしょう》を正《ただ》しく理解《りかい》し、認知症《にんちしょう》の人《ひと》を地域《ちいき》で温《あたた》かく見守《みまも》る人《ひと》","noteJaRuby":"サポーターは特別《とくべつ》な支援《しえん》を行《おこな》う人《ひと》ではなく「正《ただ》しく理解《りかい》し見守《みまも》る人《ひと》」。","noteEnRuby":""},{"id":"KV343","term":"権利擁護","kana":"けんりようご","romaji":"kenriyōgo","english":"protection of rights","easyJa":"利用者の人権や財産を、不当な扱いから守ること","englishDesc":"Protecting the rights of people who cannot protect them alone.","exampleJa":"虐待を防止し、高齢者の権利擁護を図る。","exam
