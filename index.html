re.","gapTerm":"身体障害者手帳","termRuby":"身体障害者手帳《しんたいしょうがいしゃてちょう》","easyJaRuby":"体《からだ》に障害《しょうがい》がある人《ひと》が持《も》つ手帳《てちょう》","noteJaRuby":"申請先《しんせいさき》は市町村《しちょうそん》。等級《とうきゅう》は1〜6級《きゅう》で、1級《きゅう》が最《もっと》も重《おも》い。","noteEnRuby":""},{"id":"KV324","term":"年金制度","kana":"ねんきんせいど","romaji":"nenkinseido","english":"pension system","easyJa":"若い時に払い、年を取ってから毎月国からお金をもらえるシステム","englishDesc":"The system that pays money monthly to people in old age.","exampleJa":"日本の公的年金制度に関する記述として適切なもの。","exampleEn":"A statement about Japan's public pension system.","exampleRuby":"日本《にほん》の公的年金制度《こうてきねんきんせいど》に関《かん》する記述《きじゅつ》として適切《てきせつ》なもの。","exampleGapRuby":"日本《にほん》の公的《こうてき》{{GAP}}に関《かん》する記述《きじゅつ》として適切《てきせつ》なもの。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"公的年金は国民年金（基礎年金）と厚生年金の2階建て。社会保険の一つ。","noteEn":"The public pension has two tiers: the National Pension and the Employees' Pension. It is one of the social insurances.","gapTerm":"年金制度","termRuby":"年金制度《ねんきんせいど》","easyJaRuby":"若《わか》い時《とき》に払《はら》い、年《ねん》を取《と》ってから毎月国《まいつきくに》からお金《かね》をもらえるシステム","noteJaRuby":"公的年金《こうてきねんきん》は国民年金《こくみんねんきん》（基礎年金《きそねんきん》）と厚生年金《こうせいねんきん》の2階建《かいだ》て。社会保険《しゃかいほけん》の一《ひと》つ。","noteEnRuby":""},{"id":"KV325","term":"リスクマネジメント","kana":"りすくまねじめんと","romaji":"risukumanejimento","english":"risk management","easyJa":"事故が起きないように、あらかじめ危険を予測して対策をすること","englishDesc":"Predicting dangers in advance and preventing accidents.","exampleJa":"転倒事故を防ぐためのリスクマネジメントを行う。","exampleEn":"Carry out risk management to prevent falls.","exampleRuby":"転倒事故《てんとうじこ》を防《ふせ》ぐためのリスクマネジメントを行《おこな》う。","exampleGapRuby":"転倒事故《てんとうじこ》を防《ふせ》ぐための{{GAP}}を行《おこな》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"リスクマネジメントは「事故を隠さない」「情報を共有する」が前提。抑制で防ぐのは誤り。","noteEn":"It depends on not hiding incidents and sharing information. Preventing accidents by restraint is wrong.","gapTerm":"リスクマネジメント","termRuby":"リスクマネジメント","easyJaRuby":"事故《じこ》が起《お》きないように、あらかじめ危険《きけん》を予測《よそく》して対策《たいさく》をすること","noteJaRuby":"リスクマネジメントは「事故《じこ》を隠《かく》さない」「情報《じょうほう》を共有《きょうゆう》する」が前提《ぜんてい》。抑制《よくせい》で防《ふせ》ぐのは誤《あやま》り。","noteEnRuby":""},{"id":"KV326","term":"パターナリズム","kana":"ぱたーなりずむ","romaji":"patānarizumu","english":"paternalism","easyJa":"「あなたのためだから」と、専門家が勝手に決めてしまうこと","englishDesc":"When a professional decides for the person, saying it is for their own good.","exampleJa":"医療や介護におけるパターナリズムの考え方を避ける。","exampleEn":"Avoid paternalism in medicine and care.","exampleRuby":"医療《いりょう》や介護《かいご》におけるパターナリズムの考《かんが》え方《かた》を避《さ》ける。","exampleGapRuby":"医療《いりょう》や介護《かいご》における{{GAP}}の考《かんが》え方《かた》を避《さ》ける。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"人間の尊厳と自立","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"パターナリズムは自己決定の反対。「本人のため」でも決めつけは不適切。","noteEn":"Paternalism is the opposite of self-determination; deciding \"for their own good\" is inappropriate.","gapTerm":"パターナリズム","termRuby":"パターナリズム","easyJaRuby":"「あなたのためだから」と、専門家《せんもんか》が勝手《かって》に決《き》めてしまうこと","noteJaRuby":"パターナリズムは自己決定《じこけってい》の反対《はんたい》。「本人《ほんにん》のため」でも決《き》めつけは不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV327","term":"契約","kana":"けいやく","romaji":"keiyaku","english":"contract","easyJa":"サービスを使うために、利用者と施設が書類で約束すること","englishDesc":"A written promise between the user and the provider to use a service.","exampleJa":"介護保険サービスを利用するため、事業所と契約を結ぶ。","exampleEn":"A contract is made with the provider to use insurance services.","exampleRuby":"介護保険《かいごほけん》サービスを利用《りよう》するため、事業所《じぎょうしょ》と契約《けいやく》を結《むす》ぶ。","exampleGapRuby":"介護保険《かいごほけん》サービスを利用《りよう》するため、事業所《じぎょうしょ》と{{GAP}}を結《むす》ぶ。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介護保険は「措置」から「契約」に変わった制度。判断能力が不十分な人には成年後見制度。","noteEn":"The system moved from administrative placement to contracts. Guardianship covers those unable to contract.","gapTerm":"契約","termRuby":"契約《けいやく》","easyJaRuby":"サービスを使《つか》うために、利用者《りようしゃ》と施設《しせつ》が書類《しょるい》で約束《やくそく》すること","noteJaRuby":"介護保険《かいごほけん》は「措置《そち》」から「契約《けいやく》」に変《か》わった制度《せいど》。判断能力《はんだんのうりょく》が不十分《ふじゅうぶん》な人《ひと》には成年後見制度《せいねんこうけんせいど》。","noteEnRuby":""},{"id":"KV328","term":"介護報酬","kana":"かいごほうしゅう","romaji":"kaigohōshū","english":"nursing care remuneration","easyJa":"介護のサービスを提供した施設に、国などから払われるお金","englishDesc":"The money paid to providers for the care services they give.","exampleJa":"サービス提供記録は、介護報酬を請求する根拠となる。","exampleEn":"Service records are the basis for claiming care remuneration.","exampleRuby":"サービス提供記録《ていきょうきろく》は、介護報酬《かいごほうしゅう》を請求《せいきゅう》する根拠《こんきょ》となる。","exampleGapRuby":"サービス提供記録《ていきょうきろく》は、{{GAP}}を請求《せいきゅう》する根拠《こんきょ》となる。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"介護報酬は原則3年ごとに改定される。最新の内容は公式サイトで確認すること。","noteEn":"Rates are revised roughly every three years — check the official site for the current version.","gapTerm":"介護報酬","termRuby":"介護報酬《かいごほうしゅう》","easyJaRuby":"介護《かいご》のサービスを提供《ていきょう》した施設《しせつ》に、国《くに》などから払《はら》われるお金《かね》","noteJaRuby":"介護報酬《かいごほうしゅう》は原則《げんそく》3年《ねん》ごとに改定《かいてい》される。最新《さいしん》の内容《ないよう》は公式《こうしき》サイトで確認《かくにん》すること。","noteEnRuby":""},{"id":"KV329","term":"第1号被保険者","kana":"だいいちごうひほけんしゃ","romaji":"daiichigōhihokensha","english":"Category 1 insured person","easyJa":"介護保険に入っている「65歳以上」の人のこと","englishDesc":"An insured person aged 65 or over.","exampleJa":"介護保険の第1号被保険者は、市町村に保険料を納める。","exampleEn":"Category 1 insured persons pay premiums to the municipality.","exampleRuby":"介護保険《かいごほけん》の第《だい》1号被保険者《ごうひほけんしゃ》は、市町村《しちょうそん》に保険料《ほけんりょう》を納《おさ》める。","exampleGapRuby":"介護保険《かいごほけん》の{{GAP}}は、市町村《しちょうそん》に保険料《ほけんりょう》を納《おさ》める。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"第1号は65歳以上、第2号は40〜64歳。原因を問わず給付されるのは第1号。","noteEn":"Category 1 is 65+, Category 2 is 40–64. Category 1 receives benefits regardless of the cause.","gapTerm":"第1号被保険者","termRuby":"第《だい》1号被保険者《ごうひほけんしゃ》","easyJaRuby":"介護保険《かいごほけん》に入《はい》っている「65歳以上《さいいじょう》」の人《ひと》のこと","noteJaRuby":"第《だい》1号《ごう》は65歳以上《さいいじょう》、第《だい》2号《ごう》は40〜64歳《さい》。原因《げんいん》を問《と》わず給付《きゅうふ》されるのは第《だい》1号《ごう》。","noteEnRuby":""},{"id":"KV330","term":"ケアプラン","kana":"けあぷらん","romaji":"keapuran","english":"care plan","easyJa":"介護サービスをどのように使うか決めた計画書（介護サービス計画）","englishDesc":"The written plan of the services a user will receive.","exampleJa":"ケアマネジャーがケアプランを作成する。","exampleEn":"The care manager creates the care plan.","exampleRuby":"ケアマネジャーがケアプランを作成《さくせい》する。","exampleGapRuby":"ケアマネジャーが{{GAP}}を作成《さくせい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"ケアプランは本人・家族の同意が必要。自分で作る（セルフプラン）ことも可能。","noteEn":"Plans need the person's and family's consent, and people may write their own (self-plan).","gapTerm":"ケアプラン","termRuby":"ケアプラン","easyJaRuby":"介護《かいご》サービスをどのように使《つか》うか決《き》めた計画書《けいかくしょ》（介護《かいご》サービス計画《けいかく》）","noteJaRuby":"ケアプランは本人《ほんにん》・家族《かぞく》の同意《どうい》が必要《ひつよう》。自分《じぶん》で作《つく》る（セルフプラン）ことも可能《かのう》。","noteEnRuby":""},{"id":"KV331","term":"サービス担当者会議","kana":"さーびすたんとうしゃかいぎ","romaji":"sābisutantōshakaigi","english":"care conference","easyJa":"関わっている専門家が集まって、ケアプランについて話し合う会議","englishDesc":"A meeting of everyone involved in the user's services.","exampleJa":"ケアプランの見直しの際、サービス担当者会議を開く。","exampleEn":"When revising the care plan, a care conference is held.","exampleRuby":"ケアプランの見直《みなお》しの際《さい》、サービス担当者会議《たんとうしゃかいぎ》を開《ひら》く。","exampleGapRuby":"ケアプランの見直《みなお》しの際《さい》、{{GAP}}を開《ひら》く。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護過程","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"サービス担当者会議はケアマネジャーが招集。本人・家族の参加が原則。","noteEn":"The care manager convenes it, and the person and family attend as a rule.","gapTerm":"サービス担当者会議","termRuby":"サービス担当者会議《たんとうしゃかいぎ》","easyJaRuby":"関《かか》わっている専門家《せんもんか》が集《あつ》まって、ケアプランについて話《はな》し合《あ》う会議《かいぎ》","noteJaRuby":"サービス担当者会議《たんとうしゃかいぎ》はケアマネジャーが招集《しょうしゅう》。本人《ほんにん》・家族《かぞく》の参加《さんか》が原則《げんそく》。","noteEnRuby":""},{"id":"KV332","term":"苦情対応","kana":"くじょうたいおう","romaji":"kujōtaiō","english":"complaint handling","easyJa":"利用者や家族からのクレーム（文句・不満）にしっかり対応すること","englishDesc":"Dealing with users' complaints about services.","exampleJa":"サービスに関する苦情対応の窓口を説明する。","exampleEn":"Explain the contact point for handling complaints about services.","exampleRuby":"サービスに関《かん》する苦情対応《くじょうたいおう》の窓口《まどぐち》を説明《せつめい》する。","exampleGapRuby":"サービスに関《かん》する{{GAP}}の窓口《まどぐち》を説明《せつめい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"苦情は事業所→市町村→国保連（国民健康保険団体連合会）の順に相談できる。","noteEn":"Complaints go to the provider, then the municipality, then the prefectural insurance federation.","gapTerm":"苦情対応","termRuby":"苦情対応《くじょうたいおう》","easyJaRuby":"利用者《りようしゃ》や家族《かぞく》からのクレーム（文句《もんく》・不満《ふまん》）にしっかり対応《たいおう》すること","noteJaRuby":"苦情《くじょう》は事業所《じぎょうしょ》→市町村《しちょうそん》→国保連《こくほれん》（国民健康保険団体連合会《こくみんけんこうほけんだんたいれんごうかい》）の順《じゅん》に相談《そうだん》できる。","noteEnRuby":""},{"id":"KV333","term":"法定後見","kana":"ほうていこうけん","romaji":"hōteikōken","english":"statutory guardianship","easyJa":"すでに判断能力がなくなった人のために、家庭裁判所が支援者を決める制度","englishDesc":"Guardianship decided by the family court when judgement is already impaired.","exampleJa":"成年後見制度には、法定後見制度と任意後見制度がある。","exampleEn":"Adult guardianship has both statutory and voluntary types.","exampleRuby":"成年後見制度《せいねんこうけんせいど》には、法定後見制度《ほうていこうけんせいど》と任意後見制度《にんいこうけんせいど》がある。","exampleGapRuby":"成年後見制度《せいねんこうけんせいど》には、{{GAP}}制度《せいど》と任意後見制度《にんいこうけんせいど》がある。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"法定後見は判断能力が下がった「後」、任意後見は「前」に契約する。時点の違いが答え。","noteEn":"Statutory guardianship starts AFTER capacity declines; voluntary guardianship is contracted BEFORE.","gapTerm":"法定後見","termRuby":"法定後見《ほうていこうけん》","easyJaRuby":"すでに判断能力《はんだんのうりょく》がなくなった人《ひと》のために、家庭裁判所《かていさいばんしょ》が支援者《しえんしゃ》を決《き》める制度《せいど》","noteJaRuby":"法定後見《ほうていこうけん》は判断能力《はんだんのうりょく》が下《さ》がった「後《あと》」、任意後見《にんいこうけん》は「前《まえ》」に契約《けいやく》する。時点《じてん》の違《ちが》いが答《こた》え。","noteEnRuby":""},{"id":"KV334","term":"クーリング・オフ","kana":"くーりんぐ・おふ","romaji":"kūringu-ofu","english":"cooling-off period","easyJa":"契約した後でも、一定の期間なら契約を取り消せるルール","englishDesc":"The right to cancel a contract within a set number of days.","exampleJa":"訪問販売で無理やり買わされた商品をクーリング・オフする。","exampleEn":"Cancel goods bought under pressure in a door-to-door sale.","exampleRuby":"訪問販売《ほうもんはんばい》で無理《むり》やり買《か》わされた商品《しょうひん》をクーリング・オフする。","exampleGapRuby":"訪問販売《ほうもんはんばい》で無理《むり》やり買《か》わされた商品《しょうひん》を{{GAP}}する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"訪問販売のクーリング・オフは原則8日以内。高齢者の消費者被害の設問で出る。","noteEn":"For door-to-door sales the period is generally eight days. Appears in consumer-harm questions.","gapTerm":"クーリング・オフ","termRuby":"クーリング・オフ","easyJaRuby":"契約《けいやく》した後《あと》でも、一定《いってい》の期間《きかん》なら契約《けいやく》を取《と》り消《け》せるルール","noteJaRuby":"訪問販売《ほうもんはんばい》のクーリング・オフは原則《げんそく》8日以内《にちいない》。高齢者《こうれいしゃ》の消費者被害《しょうひしゃひがい》の設問《せつもん》で出《で》る。","noteEnRuby":""},{"id":"KV335","term":"個人情報保護法","kana":"こじんじょうほうほごほう","romaji":"kojinjōhōhogohō","english":"Act on the Protection of Personal Information","easyJa":"個人の秘密のデータ（個人情報）を守るための日本の法律","englishDesc":"The law that protects how personal information is handled.","exampleJa":"個人情報保護法に基づき、家族に説明して同意を得る。","exampleEn":"Based on the Act, explain to the family and obtain consent.","exampleRuby":"個人情報保護法《こじんじょうほうほごほう》に基《もと》づき、家族《かぞく》に説明《せつめい》して同意《どうい》を得《え》る。","exampleGapRuby":"{{GAP}}に基《もと》づき、家族《かぞく》に説明《せつめい》して同意《どうい》を得《え》る。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"個人情報の第三者提供には原則本人の同意が必要。家族も第三者にあたる場合がある。","noteEn":"Sharing with third parties needs consent, and family members can count as third parties.","gapTerm":"個人情報保護法","termRuby":"個人情報保護法《こじんじょうほうほごほう》","easyJaRuby":"個人《こじん》の秘密《ひみつ》のデータ（個人情報《こじんじょうほう》）を守《まも》るための日本《にほん》の法律《ほうりつ》","noteJaRuby":"個人情報《こじんじょうほう》の第三者提供《だいさんしゃていきょう》には原則本人《げんそくほんにん》の同意《どうい》が必要《ひつよう》。家族《かぞく》も第三者《だいさんしゃ》にあたる場合《ばあい》がある。","noteEnRuby":""},{"id":"KV336","term":"高額介護サービス費","kana":"こうがくかいごさーびすひ","romaji":"kōgakukaigosābisuhi","english":"high-cost long-term care service benefit","easyJa":"1ヶ月の介護のお金が高くなりすぎた時に、超えた分が戻ってくる仕組み","englishDesc":"A benefit that returns costs above a set monthly limit.","exampleJa":"利用者の負担を減らすため、高額介護サービス費の制度を説明する。","exampleEn":"Explain the high-cost care benefit to reduce the user's burden.","exampleRuby":"利用者《りようしゃ》の負担《ふたん》を減《へ》らすため、高額介護《こうがくかいご》サービス費《ひ》の制度《せいど》を説明《せつめい》する。","exampleGapRuby":"利用者《りようしゃ》の負担《ふたん》を減《へ》らすため、{{GAP}}の制度《せいど》を説明《せつめい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"自己負担が上限を超えた分が後から払い戻される。申請が必要である点が問われる。","noteEn":"The excess is refunded later, and an application is required.","gapTerm":"高額介護サービス費","termRuby":"高額介護《こうがくかいご》サービス費《ひ》","easyJaRuby":"1ヶ月《つき》の介護《かいご》のお金《かね》が高《たか》くなりすぎた時《とき》に、超《こ》えた分《ぶん》が戻《もど》ってくる仕組《しく》み","noteJaRuby":"自己負担《じこふたん》が上限《じょうげん》を超《こ》えた分《ぶん》が後《あと》から払《はら》い戻《もど》される。申請《しんせい》が必要《ひつよう》である点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV337","term":"第2号被保険者","kana":"だいにごうひほけんしゃ","romaji":"dainigōhihokensha","english":"Category 2 insured person","easyJa":"介護保険に入っている「40歳から64歳」の人のこと","englishDesc":"An insured person aged 40 to 64.","exampleJa":"第2号被保険者が介護保険を使える特定疾病について。","exampleEn":"About the specified diseases for which Category 2 insured persons can use the insurance.","exampleRuby":"第《だい》2号被保険者《ごうひほけんしゃ》が介護保険《かいごほけん》を使《つか》える特定疾病《とくていしっぺい》について。","exampleGapRuby":"{{GAP}}が介護保険《かいごほけん》を使《つか》える特定疾病《とくていしっぺい》について。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"第2号は「特定疾病」が原因の場合のみ給付される。この条件が最頻出。","noteEn":"Category 2 receives benefits only when the cause is a specified disease — a top exam point.","gapTerm":"第2号被保険者","termRuby":"第《だい》2号被保険者《ごうひほけんしゃ》","easyJaRuby":"介護保険《かいごほけん》に入《はい》っている「40歳《さい》から64歳《さい》」の人《ひと》のこと","noteJaRuby":"第《だい》2号《ごう》は「特定疾病《とくていしっぺい》」が原因《げんいん》の場合《ばあい》のみ給付《きゅうふ》される。この条件《じょうけん》が最頻出《さいひんしゅつ》。","noteEnRuby":""},{"id":"KV338","term":"保健師","kana":"ほけんし","romaji":"hokenshi","english":"public health nurse","easyJa":"地域の人たちの健康を守るために相談にのる看護の専門家","englishDesc":"A nurse who works on health in the community.","exampleJa":"地域包括支援センターには保健師が配置されている。","exampleEn":"A public health nurse is assigned to the community support centre.","exampleRuby":"地域包括支援《ちいきほうかつしえん》センターには保健師《ほけんし》が配置《はいち》されている。","exampleGapRuby":"地域包括支援《ちいきほうかつしえん》センターには{{GAP}}が配置《はいち》されている。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"保健師は予防・健康教育が中心。看護師との役割の違いを整理する。","noteEn":"Public health nurses focus on prevention and health education; distinguish from ward nurses.","gapTerm":"保健師","termRuby":"保健師《ほけんし》","easyJaRuby":"地域《ちいき》の人《ひと》たちの健康《けんこう》を守《まも》るために相談《そうだん》にのる看護《かんご》の専門家《せんもんか》","noteJaRuby":"保健師《ほけんし》は予防《よぼう》・健康教育《けんこうきょういく》が中心《ちゅうしん》。看護師《かんごし》との役割《やくわり》の違《ちが》いを整理《せいり》する。","noteEnRuby":""},{"id":"KV339","term":"措置","kana":"そち","romaji":"sochi","english":"administrative measure","easyJa":"虐待などがあった時、市町村が利用者を守るために強制的にサービスを使わせること","englishDesc":"Admission decided by the municipality instead of by contract.","exampleJa":"契約ではなく、市町村の措置によって施設に入所する。","exampleEn":"Admission to the facility is by municipal measure, not by contract.","exampleRuby":"契約《けいやく》ではなく、市町村《しちょうそん》の措置《そち》によって施設《しせつ》に入所《にゅうしょ》する。","exampleGapRuby":"契約《けいやく》ではなく、市町村《しちょうそん》の{{GAP}}によって施設《しせつ》に入所《にゅうしょ》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「措置」は虐待などで契約できない場合に使われる。契約制度への例外。","noteEn":"Administrative measures are used when a contract is impossible, such as in abuse cases.","gapTerm":"措置","termRuby":"措置《そち》","easyJaRuby":"虐待《ぎゃくたい》などがあった時《とき》、市町村《しちょうそん》が利用者《りようしゃ》を守《まも》るために強制的《きょうせいてき》にサービスを使《つか》わせること","noteJaRuby":"「措置《そち》」は虐待《ぎゃくたい》などで契約《けいやく》できない場合《ばあい》に使《つか》われる。契約制度《けいやくせいど》への例外《れいがい》。","noteEnRuby":""},{"id":"KV340","term":"介護予防","kana":"かいごよぼう","romaji":"kaigoyobō","english":"long-term care prevention","easyJa":"これ以上介護が必要にならないように、体操などをすること","englishDesc":"Services that stop a person needing more care in the future.","exampleJa":"要支援の利用者に対する介護予防サービス。","exampleEn":"Care-prevention services for users at support level.","exampleRuby":"要支援《ようしえん》の利用者《りようしゃ》に対《たい》する介護予防《かいごよぼう》サービス。","exampleGapRuby":"要支援《ようしえん》の利用者《りようしゃ》に対《たい》する{{GAP}}サービス。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介護予防は「要支援1・2」が対象。地域支援事業とセットで問われる。","noteEn":"Care prevention targets support levels 1 and 2, and is tested with community support projects.","gapTerm":"介護予防","termRuby":"介護予防《かいごよぼう》","easyJaRuby":"これ以上介護《いじょうかいご》が必要《ひつよう》にならないように、体操《たいそう》などをすること","noteJaRuby":"介護予防《かいごよぼう》は「要支援《ようしえん》1・2」が対象《たいしょう》。地域支援事業《ちいきしえんじぎょう》とセットで問《と》われる。","noteEnRuby":""},{"id":"KV341","term":"任意後見","kana":"にんいこうけん","romaji":"nin'ikōken","english":"voluntary guardianship","easyJa":"自分が元気なうちに、将来お金などを管理してくれる人を自分で決めておく制度","englishDesc":"Guardianship arranged by contract while the person still has judgement.","exampleJa":"判断能力があるうちに、任意後見契約を結ぶ。","exampleEn":"Make a voluntary guardianship contract while judgement is still sound.","exampleRuby":"判断能力《はんだんのうりょく》があるうちに、任意後見契約《にんいこうけんけいやく》を結《むす》ぶ。","exampleGapRuby":"判断能力《はんだんのうりょく》があるうちに、{{GAP}}契約《けいやく》を結《むす》ぶ。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"任意後見は公正証書で契約する。法定後見との「時点の違い」が答えの鍵。","noteEn":"It requires a notarised contract. The timing difference from statutory guardianship is the key.","gapTerm":"任意後見","termRuby":"任意後見《にんいこうけん》","easyJaRuby":"自分《じぶん》が元気《げんき》なうちに、将来《しょうらい》お金《かね》などを管理《かんり》してくれる人《ひと》を自分《じぶん》で決《き》めておく制度《せいど》","noteJaRuby":"任意後見《にんいこうけん》は公正証書《こうせいしょうしょ》で契約《けいやく》する。法定後見《ほうていこうけん》との「時点《じてん》の違《ちが》い」が答《こた》えの鍵《かぎ》。","noteEnRuby":""},{"id":"KV342","term":"認知症サポーター","kana":"にんちしょうさぽーたー","romaji":"ninchishōsapōtā","english":"dementia supporter","easyJa":"認知症を正しく理解し、認知症の人を地域で温かく見守る人","englishDesc":"A local resident trained to understand and help people with dementia.","exampleJa":"地域住民を対象に、認知症サポーター養成講座を開催する。","exampleEn":"Hold a dementia supporter training course for local residents.","exampleRuby":"地域住民《ちいきじゅうみん》を対象《たいしょう》に、認知症《にんちしょう》サポーター養成講座《ようせいこうざ》を開催《かいさい》する。","exampleGapRuby":"地域住民《ちいきじゅうみん》を対象《たいしょう》に、{{GAP}}養成講座《ようせいこうざ》を開催《かいさい》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"サポーターは特別な支援を行う人ではなく「正しく理解し見守る人」。","noteEn":"Supporters are not specialists; they understand dementia correctly and watch over people.","gapTerm":"認知症サポーター","termRuby":"認知症《にんちしょう》サポーター","easyJaRuby":"認知症《にんちしょう》を正《ただ》しく理解《りかい》し、認知症《にんちしょう》の人《ひと》を地域《ちいき》で温《あたた》かく見守《みまも》る人《ひと》","noteJaRuby":"サポーターは特別《とくべつ》な支援《しえん》を行《おこな》う人《ひと》ではなく「正《ただ》しく理解《りかい》し見守《みまも》る人《ひと》」。","noteEnRuby":""},{"id":"KV343","term":"権利擁護","kana":"けんりようご","romaji":"kenriyōgo","english":"protection of rights","easyJa":"利用者の人権や財産を、不当な扱いから守ること","englishDesc":"Protecting the rights of people who cannot protect them alone.","exampleJa":"虐待を防止し、高齢者の権利擁護を図る。","examp ient rehabilitation","easyJa":"「デイケア」の正式名称（病院などに通ってリハビリをするサービス）","englishDesc":"Rehabilitation received by going to a facility in the daytime.","exampleJa":"身体機能を回復させるため、通所リハビリテーションに通う。","exampleEn":"Attend day care to recover physical function.","exampleRuby":"身体機能《しんたいきのう》を回復《かいふく》させるため、通所《つうしょ》リハビリテーションに通《かよ》う。","exampleGapRuby":"身体機能《しんたいきのう》を回復《かいふく》させるため、{{GAP}}に通《かよ》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"通所リハビリ（デイケア）は医師の指示のもとで行う。通所介護との違いが頻出。","noteEn":"Day care is provided under a doctor's direction, unlike day service. The contrast is often tested.","gapTerm":"通所リハビリテーション","termRuby":"通所《つうしょ》リハビリテーション","easyJaRuby":"「デイケア」の正式名称《せいしきめいしょう》（病院《びょういん》などに通《かよ》ってリハビリをするサービス）","noteJaRuby":"通所《つうしょ》リハビリ（デイケア）は医師《いし》の指示《しじ》のもとで行《おこな》う。通所介護《つうしょかいご》との違《ちが》いが頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV348","term":"後期高齢者医療制度","kana":"こうきこうれいしゃいりょうせいど","romaji":"kōkikōreishairyōseido","english":"medical care system for the advanced elderly","easyJa":"75歳以上の人が入る、お年寄り専用の医療保険のルール","englishDesc":"The medical insurance system for people aged 75 and over.","exampleJa":"75歳になったので、後期高齢者医療制度の対象となる。","exampleEn":"On turning 75, the person comes under the system for the advanced elderly.","exampleRuby":"75歳《さい》になったので、後期高齢者医療制度《こうきこうれいしゃいりょうせいど》の対象《たいしょう》となる。","exampleGapRuby":"75歳《さい》になったので、{{GAP}}の対象《たいしょう》となる。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"対象は原則75歳以上（一定の障害があれば65歳以上）。運営は広域連合。","noteEn":"Generally 75+, or 65+ with certain disabilities. Run by wide-area associations.","gapTerm":"後期高齢者医療制度","termRuby":"後期高齢者医療制度《こうきこうれいしゃいりょうせいど》","easyJaRuby":"75歳以上《さいいじょう》の人《ひと》が入《はい》る、お年寄《としよ》り専用《せんよう》の医療保険《いりょうほけん》のルール","noteJaRuby":"対象《たいしょう》は原則《げんそく》75歳以上《さいいじょう》（一定《いってい》の障害《しょうがい》があれば65歳以上《さいいじょう》）。運営《うんえい》は広域連合《こういきれんごう》。","noteEnRuby":""},{"id":"KV349","term":"ホームヘルパー","kana":"ほーむへるぱー","romaji":"hōmuherupā","english":"home helper","easyJa":"訪問介護員のこと（利用者の家に行く介護士）","englishDesc":"A care worker who visits homes.","exampleJa":"ホームヘルパーが掃除や洗濯などの生活援助を行う。","exampleEn":"The home helper does household support such as cleaning and laundry.","exampleRuby":"ホームヘルパーが掃除《そうじ》や洗濯《せんたく》などの生活援助《せいかつえんじょ》を行《おこな》う。","exampleGapRuby":"{{GAP}}が掃除《そうじ》や洗濯《せんたく》などの生活援助《せいかつえんじょ》を行《おこな》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"生活援助は「本人のため」の家事のみ。家族の分の調理・掃除は対象外。","noteEn":"Household support covers only the user's own needs, not chores for family members.","gapTerm":"ホームヘルパー","termRuby":"ホームヘルパー","easyJaRuby":"訪問介護員《ほうもんかいごいん》のこと（利用者《りようしゃ》の家《いえ》に行《い》く介護士《かいごし》）","noteJaRuby":"生活援助《せいかつえんじょ》は「本人《ほんにん》のため」の家事《かじ》のみ。家族《かぞく》の分《ぶん》の調理《ちょうり》・掃除《そうじ》は対象外《たいしょうがい》。","noteEnRuby":""},{"id":"KV350","term":"コンプライアンス","kana":"こんぷらいあんす","romaji":"konpuraiansu","english":"compliance","easyJa":"法律やルール、社会の決まりをしっかり守ること","englishDesc":"Following laws and rules in the work of an organisation.","exampleJa":"介護事業所の職員としてコンプライアンスを遵守する。","exampleEn":"As a staff member, comply with rules and laws.","exampleRuby":"介護事業所《かいごじぎょうしょ》の職員《しょくいん》としてコンプライアンスを遵守《じゅんしゅ》する。","exampleGapRuby":"介護事業所《かいごじぎょうしょ》の職員《しょくいん》として{{GAP}}を遵守《じゅんしゅ》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"コンプライアンスは法令＋倫理＋施設の規則。不適切なケアの通報も含まれる。","noteEn":"Compliance covers laws, ethics and internal rules, including reporting inappropriate care.","gapTerm":"コンプライアンス","termRuby":"コンプライアンス","easyJaRuby":"法律《ほうりつ》やルール、社会《しゃかい》の決《き》まりをしっかり守《まも》ること","noteJaRuby":"コンプライアンスは法令《ほうれい》＋倫理《りんり》＋施設《しせつ》の規則《きそく》。不適切《ふてきせつ》なケアの通報《つうほう》も含《ふく》まれる。","noteEnRuby":""},{"id":"KV351","term":"インクルージョン","kana":"いんくるーじょん","romaji":"inkurūjon","english":"inclusion","easyJa":"障害がある人もない人も、みんな一緒に社会に包み込まれる考え方","englishDesc":"A society in which no one is left out or excluded.","exampleJa":"ソーシャル・インクルージョン（社会的包摂）の理念。","exampleEn":"The principle of social inclusion.","exampleRuby":"ソーシャル・インクルージョン（社会的包摂《しゃかいてきほうせつ》）の理念《りねん》。","exampleGapRuby":"ソーシャル・{{GAP}}（社会的包摂《しゃかいてきほうせつ》）の理念《りねん》。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"インクルージョン（包摂）⇔エクスクルージョン（排除）。ノーマライゼーションと関連。","noteEn":"Inclusion ⇔ exclusion, and it is closely linked to normalisation.","gapTerm":"インクルージョン","termRuby":"インクルージョン","easyJaRuby":"障害《しょうがい》がある人《ひと》もない人《ひと》も、みんな一緒《いっしょ》に社会《しゃかい》に包《つつ》み込《こ》まれる考《かんが》え方《かた》","noteJaRuby":"インクルージョン（包摂《ほうせつ》）⇔エクスクルージョン（排除《はいじょ》）。ノーマライゼーションと関連《かんれん》。","noteEnRuby":""},{"id":"KV352","term":"基本的人権","kana":"きほんてきじんけん","romaji":"kihontekijinken","english":"fundamental human rights","easyJa":"人間として生まれながらに持っている、自由に生きるための権利","englishDesc":"The basic rights that every person has.","exampleJa":"憲法第25条で保障されている基本的人権について。","exampleEn":"About the fundamental human rights guaranteed by Article 25 of the Constitution.","exampleRuby":"憲法第《けんぽうだい》25条《じょう》で保障《ほしょう》されている基本的人権《きほんてきじんけん》について。","exampleGapRuby":"憲法第《けんぽうだい》25条《じょう》で保障《ほしょう》されている{{GAP}}について。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"憲法第25条は「健康で文化的な最低限度の生活」＝生存権。生活保護の根拠。","noteEn":"Article 25 guarantees a healthy, cultured minimum standard of living — the basis of public assistance.","gapTerm":"基本的人権","termRuby":"基本的人権《きほんてきじんけん》","easyJaRuby":"人間《にんげん》として生《う》まれながらに持《も》っている、自由《じゆう》に生《い》きるための権利《けんり》","noteJaRuby":"憲法第《けんぽうだい》25条《じょう》は「健康《けんこう》で文化的《ぶんかてき》な最低限度《さいていげんど》の生活《せいかつ》」＝生存権《せいぞんけん》。生活保護《せいかつほご》の根拠《こんきょ》。","noteEnRuby":""},{"id":"KV353","term":"保険者","kana":"ほけんじゃ","romaji":"hokenja","english":"insurer","easyJa":"保険の仕組みを運営してお金を集める人（市町村など）","englishDesc":"The body that runs an insurance system.","exampleJa":"介護保険の保険者は、市町村および特別区である。","exampleEn":"The insurers of long-term care insurance are municipalities and special wards.","exampleRuby":"介護保険《かいごほけん》の保険者《ほけんじゃ》は、市町村《しちょうそん》および特別区《とくべつく》である。","exampleGapRuby":"介護保険《かいごほけん》の{{GAP}}は、市町村《しちょうそん》および特別区《とくべつく》である。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「保険者」（運営する側）と「被保険者」（加入する人）を逆に読むミスが多い。","noteEn":"保険者 (the operator) and 被保険者 (the insured person) are easily reversed. 被 marks the passive side.","gapTerm":"保険者","termRuby":"保険者《ほけんじゃ》","easyJaRuby":"保険《ほけん》の仕組《しく》みを運営《うんえい》してお金《かね》を集《あつ》める人《ひと》（市町村《しちょうそん》など）","noteJaRuby":"「保険者《ほけんじゃ》」（運営《うんえい》する側《がわ》）と「被保険者《ひほけんしゃ》」（加入《かにゅう》する人《ひと》）を逆《ぎゃく》に読《よ》むミスが多《おお》い。","noteEnRuby":"保険者《ほけんじゃ》 (the operator) and 被保険者《ひほけんしゃ》 (the insured person) are easily reversed. 被《ひ》 marks the passive side."},{"id":"KV354","term":"ユニバーサルデザイン","kana":"ゆにばーさるでざいん","romaji":"yunibāsarudezain","english":"universal design","easyJa":"年齢や障害に関係なく、最初から「すべての人」が使いやすく作られたデザイン","englishDesc":"Design that is easy for everyone to use from the start.","exampleJa":"車いすでも使いやすいユニバーサルデザインの考え方。","exampleEn":"The idea of universal design, usable even in a wheelchair.","exampleRuby":"車《くるま》いすでも使《つか》いやすいユニバーサルデザインの考《かんが》え方《かた》。","exampleGapRuby":"車《くるま》いすでも使《つか》いやすい{{GAP}}の考《かんが》え方《かた》。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"ユニバーサルデザインは「最初から誰でも」、バリアフリーは「後から障壁を除く」。","noteEn":"Universal design is inclusive from the start; barrier-free removes barriers afterwards.","gapTerm":"ユニバーサルデザイン","termRuby":"ユニバーサルデザイン","easyJaRuby":"年齢《ねんれい》や障害《しょうがい》に関係《かんけい》なく、最初《さいしょ》から「すべての人《ひと》」が使《つか》いやすく作《つく》られたデザイン","noteJaRuby":"ユニバーサルデザインは「最初《さいしょ》から誰《だれ》でも」、バリアフリーは「後《あと》から障壁《しょうへき》を除《のぞ》く」。","noteEnRuby":""},{"id":"KV355","term":"老人福祉法","kana":"ろうじんふくしほう","romaji":"rōjinfukushihō","english":"Act on Social Welfare for the Elderly","easyJa":"高齢者の生活を守るための、日本の昔からの基本の法律","englishDesc":"The law on welfare services for older people.","exampleJa":"老人福祉法に基づく措置入所について。","exampleEn":"About admission by measure under the Act on Social Welfare for the Elderly.","exampleRuby":"老人福祉法《ろうじんふくしほう》に基《もと》づく措置入所《そちにゅうしょ》について。","exampleGapRuby":"{{GAP}}に基《もと》づく措置入所《そちにゅうしょ》について。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"1963年制定。介護保険法ができた後も、措置による入所の根拠として残っている。","noteEn":"Enacted in 1963; it still provides the basis for admission by administrative measure.","gapTerm":"老人福祉法","termRuby":"老人福祉法《ろうじんふくしほう》","easyJaRuby":"高齢者《こうれいしゃ》の生活《せいかつ》を守《まも》るための、日本《にほん》の昔《むかし》からの基本《きほん》の法律《ほうりつ》","noteJaRuby":"1963年制定《ねんせいてい》。介護保険法《かいごほけんほう》ができた後《あと》も、措置《そち》による入所《にゅうしょ》の根拠《こんきょ》として残《のこ》っている。","noteEnRuby":""},{"id":"KV356","term":"社会福祉協議会","kana":"しゃかいふくしきょうぎかい","romaji":"shakaifukushikyōgikai","english":"Council of Social Welfare","easyJa":"地域のみんなが安心して暮らせるように活動する民間の団体（社協）","englishDesc":"A private organisation that promotes community welfare.","exampleJa":"ボランティア活動について社会福祉協議会に相談する。","exampleEn":"Consult the council of social welfare about volunteer activities.","exampleRuby":"ボランティア活動《かつどう》について社会福祉協議会《しゃかいふくしきょうぎかい》に相談《そうだん》する。","exampleGapRuby":"ボランティア活動《かつどう》について{{GAP}}に相談《そうだん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"社会福祉協議会は民間団体。日常生活自立支援事業も担う。行政機関ではない。","noteEn":"It is a private body, not a government office, and also runs the daily-life independence support programme.","gapTerm":"社会福祉協議会","termRuby":"社会福祉協議会《しゃかいふくしきょうぎかい》","easyJaRuby":"地域《ちいき》のみんなが安心《あんしん》して暮《く》らせるように活動《かつどう》する民間《みんかん》の団体《だんたい》（社協《しゃきょう》）","noteJaRuby":"社会福祉協議会《しゃかいふくしきょうぎかい》は民間団体《みんかんだんたい》。日常生活自立支援事業《にちじょうせいかつじりつしえんじぎょう》も担《にな》う。行政機関《ぎょうせいきかん》ではない。","noteEnRuby":""},{"id":"KV357","term":"アカウンタビリティ","kana":"あかうんたびりてぃ","romaji":"akauntabiriti","english":"accountability","easyJa":"専門家が利用者や家族に、自分のやったことをしっかり説明する責任","englishDesc":"The duty to explain your work and be answerable for it.","exampleJa":"介護サービスを提供する際、アカウンタビリティ（説明責任）を果たす。","exampleEn":"Fulfil accountability when providing care services.","exampleRuby":"介護《かいご》サービスを提供《ていきょう》する際《さい》、アカウンタビリティ（説明責任《せつめいせきにん》）を果《は》たす。","exampleGapRuby":"介護《かいご》サービスを提供《ていきょう》する際《さい》、{{GAP}}（説明責任《せつめいせきにん》）を果《は》たす。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"アカウンタビリティ＝説明責任。記録・情報開示とセットで問われる。","noteEn":"Accountability is tested together with record-keeping and information disclosure.","gapTerm":"アカウンタビリティ","termRuby":"アカウンタビリティ","easyJaRuby":"専門家《せんもんか》が利用者《りようしゃ》や家族《かぞく》に、自分《じぶん》のやったことをしっかり説明《せつめい》する責任《せきにん》","noteJaRuby":"アカウンタビリティ＝説明責任《せつめいせきにん》。記録《きろく》・情報開示《じょうほうかいじ》とセットで問《と》われる。","noteEnRuby":""},{"id":"KV358","term":"自助グループ","kana":"じじょぐるーぷ","romaji":"jijogurūpu","english":"self-help group","easyJa":"同じ悩みや病気を持つ人たちが集まって、お互いに助け合うグループ","englishDesc":"A group where people with the same problem support each other.","exampleJa":"アルコール依存症の患者が自助グループに参加する。","exampleEn":"A patient with alcohol dependence attends a self-help group.","exampleRuby":"アルコール依存症《いぞんしょう》の患者《かんじゃ》が自助《じじょ》グループに参加《さんか》する。","exampleGapRuby":"アルコール依存症《いぞんしょう》の患者《かんじゃ》が{{GAP}}に参加《さんか》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"自助グループは当事者同士の支え合い。専門職が指導する場ではない。","noteEn":"Self-help groups are peer support, not sessions led by professionals.","gapTerm":"自助グループ","termRuby":"自助《じじょ》グループ","easyJaRuby":"同《おな》じ悩《なや》みや病気《びょうき》を持《も》つ人《ひと》たちが集《あつ》まって、お互《たが》いに助《たす》け合《あ》うグループ","noteJaRuby":"自助《じじょ》グループは当事者同士《とうじしゃどうし》の支《ささ》え合《あ》い。専門職《せんもんしょく》が指導《しどう》する場《ば》ではない。","noteEnRuby":""},{"id":"KV359","term":"管理者","kana":"かんりしゃ","romaji":"kanrisha","english":"facility manager / administrator","easyJa":"施設や事業所の責任者（一番えらいリーダー）","englishDesc":"The person responsible for running a facility.","exampleJa":"事故が発生したため、すぐに施設の管理者に報告する。","exampleEn":"Because an accident occurred, report to the facility manager immediately.","exampleRuby":"事故《じこ》が発生《はっせい》したため、すぐに施設《しせつ》の管理者《かんりしゃ》に報告《ほうこく》する。","exampleGapRuby":"事故《じこ》が発生《はっせい》したため、すぐに施設《しせつ》の{{GAP}}に報告《ほうこく》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"事故発生時の報告経路（発見者→管理者→家族・市町村）を覚える。","noteEn":"Learn the reporting route: finder → manager → family and municipality.","gapTerm":"管理者","termRuby":"管理者《かんりしゃ》","easyJaRuby":"施設《しせつ》や事業所《じぎょうしょ》の責任者《せきにんしゃ》（一番《いちばん》えらいリーダー）","noteJaRuby":"事故発生時《じこはっせいじ》の報告経路《ほうこくけいろ》（発見者《はっけんしゃ》→管理者《かんりしゃ》→家族《かぞく》・市町村《しちょうそん》）を覚《おぼ》える。","noteEnRuby":""},{"id":"KV360","term":"オンブズマン","kana":"おんぶずまん","romaji":"onbuzuman","english":"ombudsman","easyJa":"利用者の代わりに苦情を聞いて、施設が正しくやっているかチェックする第三者の人","englishDesc":"An independent person who hears complaints and checks services.","exampleJa":"福祉サービスにおけるオンブズマン制度の役割。","exampleEn":"The role of the ombudsman system in welfare services.","exampleRuby":"福祉《ふくし》サービスにおけるオンブズマン制度《せいど》の役割《やくわり》。","exampleGapRuby":"福祉《ふくし》サービスにおける{{GAP}}制度《せいど》の役割《やくわり》。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"オンブズマンは第三者。事業所の職員ではない点が問われる。","noteEn":"The ombudsman is a third party, not a staff member of the provider.","gapTerm":"オンブズマン","termRuby":"オンブズマン","easyJaRuby":"利用者《りようしゃ》の代《か》わりに苦情《くじょう》を聞《き》いて、施設《しせつ》が正《ただ》しくやっているかチェックする第三者《だいさんしゃ》の人《ひと》","noteJaRuby":"オンブズマンは第三者《だいさんしゃ》。事業所《じぎょうしょ》の職員《しょくいん》ではない点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV361","term":"支援費制度","kana":"しえんひせいど","romaji":"shienhiseido","english":"support payment system","easyJa":"障害のある人が自分でサービスをえらんで、事業者と契約したしくみ。今はない","englishDesc":"A former system (2003–2006) in which people with disabilities chose services and made contracts themselves.","exampleJa":"支援費制度から障害者自立支援法への移行に関する記述として、適切なもの。","exampleEn":"Choose the appropriate statement about the change from the support payment system to the Services and Supports for Persons with Disabilities Act.","exampleRuby":"支援費制度《しえんひせいど》から障害者自立支援法《しょうがいしゃじりつしえんほう》への移行《いこう》に関《かん》する記述《きじゅつ》として、適切《てきせつ》なもの。","exampleGapRuby":"{{GAP}}から障害者自立支援法《しょうがいしゃじりつしえんほう》への移行《いこう》に関《かん》する記述《きじゅつ》として、適切《てきせつ》なもの。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"2003年に始まり2006年に終わった。「措置（行政が決める）」から「契約（自分でえらぶ）」へ変わった点が問われる。","noteEn":"Started in 2003 and ended in 2006. The key point is the change from \"the government decides\" (sochi) to \"the user makes a contract\".","gapTerm":"支援費制度","termRuby":"支援費制度《しえんひせいど》","easyJaRuby":"障害《しょうがい》のある人《ひと》が自分《じぶん》でサービスをえらんで、事業者《じぎょうしゃ》と契約《けいやく》したしくみ。今《いま》はない","noteJaRuby":"2003年《ねん》に始《はじ》まり2006年《ねん》に終《お》わった。「措置《そち》（行政《ぎょうせい》が決《き》める）」から「契約《けいやく》（自分《じぶん》でえらぶ）」へ変《か》わった点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV362","term":"非審判的態度","kana":"ひしんぱんてきたいど","romaji":"hishinpantekitaido","english":"non-judgmental attitude","easyJa":"利用者のしたことを、自分の考えで「よい・わるい」と決めない態度","englishDesc":"Not judging the user's actions as good or bad by your own values.","exampleJa":"バイスティックの7原則のうち、非審判的態度の説明として正しいもの。","exampleEn":"Choose the correct explanation of the non-judgmental attitude in Biestek's 7 principles.","exampleRuby":"バイスティックの7原則《げんそく》のうち、非審判的態度《ひしんぱんてきたいど》の説明《せつめい》として正《ただ》しいもの。","exampleGapRuby":"バイスティックの7原則《げんそく》のうち、{{GAP}}の説明《せつめい》として正《ただ》しいもの。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「非」は「〜しない」、「審判」は「裁く」という意味。「受容」（そのまま受けとめる）といっしょに問われやすい。","noteEn":"非 means \"not\" and 審判 means \"judging\". It is often tested together with acceptance (受容).","gapTerm":"非審判的態度","termRuby":"非審判的態度《ひしんぱんてきたいど》","easyJaRuby":"利用者《りようしゃ》のしたことを、自分《じぶん》の考《かんが》えで「よい・わるい」と決《き》めない態度《たいど》","noteJaRuby":"「非《ひ》」は「〜しない」、「審判《しんぱん》」は「裁《さば》く」という意味《いみ》。「受容《じゅよう》」（そのまま受《う》けとめる）といっしょに問《と》われやすい。","noteEnRuby":"非《ひ》 means \"not\" and 審判《しんぱん》 means \"judging\". It is often tested together with acceptance (受容《じゅよう》)."},{"id":"KV363","term":"誠実義務","kana":"せいじつぎむ","romaji":"seijitsugimu","english":"duty of sincerity","easyJa":"いつも利用者の立場に立って、まじめに仕事をしなければならないという介護福祉士のきまり","englishDesc":"A certified care worker's duty to always work sincerely from the user's point of view.","exampleJa":"社会福祉士及び介護福祉士法に定められた誠実義務の内容として、正しいもの。","exampleEn":"Choose the correct content of the duty of sincerity in the Certified Social Workers and Certified Care Workers Act.","exampleRuby":"社会福祉士及《しゃかいふくししおよ》び介護福祉士法《かいごふくししほう》に定《さだ》められた誠実義務《せいじつぎむ》の内容《ないよう》として、正《ただ》しいもの。","exampleGapRuby":"社会福祉士及《しゃかいふくししおよ》び介護福祉士法《かいごふくししほう》に定《さだ》められた{{GAP}}の内容《ないよう》として、正《ただ》しいもの。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介護福祉士の義務には「誠実義務・信用失墜行為の禁止・秘密保持義務・連携・資質向上の責務」がある。名前と内容の組み合わせが問われる。","noteEn":"The duties include sincerity, not damaging trust, confidentiality, cooperation and self-improvement. Matching each name to its content is tested.","gapTerm":"誠実義務","termRuby":"誠実義務《せいじつぎむ》","easyJaRuby":"いつも利用者《りようしゃ》の立場《たちば》に立《た》って、まじめに仕事《しごと》をしなければならないという介護福祉士《かいごふくしし》のきまり","noteJaRuby":"介護福祉士《かいごふくしし》の義務《ぎむ》には「誠実義務《せいじつぎむ》・信用失墜行為《しんようしっついこうい》の禁止《きんし》・秘密保持義務《ひみつほじぎむ》・連携《れんけい》・資質向上《ししつこうじょう》の責務《せきむ》」がある。名前《なまえ》と内容《ないよう》の組《く》み合《あ》わせが問《と》われる。","noteEnRuby":""},{"id":"KV364","term":"機能性失禁","kana":"きのうせいしっきん","romaji":"kinōseishikkin","english":"functional incontinence","easyJa":"おしっこのしくみは正常だが、歩くのに時間がかかる・トイレの場所がわからないなどで、トイレに間に合わずにもれること","englishDesc":"Leaking urine because the person cannot reach the toilet in time, although the bladder works normally.","exampleJa":"認知症でトイレの場所がわからずに起こる機能性失禁への対応として、適切なもの。","exampleEn":"Choose the appropriate response to functional incontinence that happens because a person with dementia cannot find the toilet.","exampleRuby":"認知症《にんちしょう》でトイレの場所《ばしょ》がわからずに起《お》こる機能性失禁《きのうせいしっきん》への対応《たいおう》として、適切《てきせつ》なもの。","exampleGapRuby":"認知症《にんちしょう》でトイレの場所《ばしょ》がわからずに起《お》こる{{GAP}}への対応《たいおう》として、適切《てきせつ》なもの。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"失禁の種類（腹圧性・切迫性・溢流性・機能性）の区別が問われる。機能性は「排尿のしくみは正常」が目印。","noteEn":"Know the types: stress, urge, overflow and functional. \"Functional\" means the urinary system itself is normal.","gapTerm":"機能性失禁","termRuby":"機能性失禁《きのうせいしっきん》","easyJaRuby":"おしっこのしくみは正常《せいじょう》だが、歩《ある》くのに時間《じかん》がかかる・トイレの場所《ばしょ》がわからないなどで、トイレに間《ま》に合《あ》わずにもれること","noteJaRuby":"失禁《しっきん》の種類《しゅるい》（腹圧性《ふくあつせい》・切迫性《せっぱくせい》・溢流性《いつりゅうせい》・機能性《きのうせい》）の区別《くべつ》が問《と》われる。機能性《きのうせい》は「排尿《はいにょう》のしくみは正常《せいじょう》」が目印《めじるし》。","noteEnRuby":""},{"id":"KV365","term":"メラトニン","kana":"めらとにん","romaji":"meratonin","english":"melatonin","easyJa":"夜に脳から出て、自然にねむくなるようにするホルモン","englishDesc":"A hormone made in the brain that brings natural sleep at night.","exampleJa":"高齢者の睡眠とメラトニンの関係について、正しいもの。","exampleEn":"Choose the correct statement about older people's sleep and melatonin.","exampleRuby":"高齢者《こうれいしゃ》の睡眠《すいみん》とメラトニンの関係《かんけい》について、正《ただ》しいもの。","exampleGapRuby":"高齢者《こうれいしゃ》の睡眠《すいみん》と{{GAP}}の関係《かんけい》について、正《ただ》しいもの。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"年をとると出る量が減り、高齢者の不眠の原因の一つになる。「睡眠ホルモン」と呼ばれる。","noteEn":"The amount decreases with age, which is one cause of poor sleep in older people. It is called the \"sleep hormone\".","gapTerm":"メラトニン","termRuby":"メラトニン","easyJaRuby":"夜《よる》に脳《のう》から出《で》て、自然《しぜん》にねむくなるようにするホルモン","noteJaRuby":"年《ねん》をとると出《で》る量《りょう》が減《へ》り、高齢者《こうれいしゃ》の不眠《ふみん》の原因《げんいん》の一《ひと》つになる。「睡眠《すいみん》ホルモン」と呼《よ》ばれる。","noteEnRuby":""},{"id":"KV366","term":"手続き記憶","kana":"てつづききおく","romaji":"tetsuzukikioku","english":"procedural memory","easyJa":"自転車に乗るなど、体でおぼえた動きの記憶","englishDesc":"Memory of skills learned by the body, such as riding a bicycle.","exampleJa":"認知症が進行しても比較的保たれやすい手続き記憶の例として、適切なもの。","exampleEn":"Choose an appropriate example of procedural memory, which tends to remain even as dementia progresses.","exampleRuby":"認知症《にんちしょう》が進行《しんこう》しても比較的保《ひかくてきたも》たれやすい手続《てつづ》き記憶《きおく》の例《れい》として、適切《てきせつ》なもの。","exampleGapRuby":"認知症《にんちしょう》が進行《しんこう》しても比較的保《ひかくてきたも》たれやすい{{GAP}}の例《れい》として、適切《てきせつ》なもの。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"記憶の種類（エピソード記憶・意味記憶・手続き記憶）の区別が問われる。この「手続き」は書類の手続きのことではない。","noteEn":"Distinguish episodic, semantic and procedural memory. 手続き here does not mean paperwork.","gapTerm":"手続き記憶","termRuby":"手続《てつづ》き記憶《きおく》","easyJaRuby":"自転車《じてんしゃ》に乗《の》るなど、体《からだ》でおぼえた動《うご》きの記憶《きおく》","noteJaRuby":"記憶《きおく》の種類《しゅるい》（エピソード記憶《きおく》・意味記憶《いみきおく》・手続《てつづ》き記憶《きおく》）の区別《くべつ》が問《と》われる。この「手続《てつづ》き」は書類《しょるい》の手続《てつづ》きのことではない。","noteEnRuby":"Distinguish episodic, semantic and procedural memory. 手続《てつづ》き here does not mean paperwork."},{"id":"KV367","term":"BPSD","kana":"びーぴーえすでぃー","romaji":"BPSD","english":"BPSD (behavioral and psychological symptoms of dementia)","easyJa":"認知症の人に出る、行動や気持ちの症状。歩きまわる、本当ではないことを信じる、など","englishDesc":"Behavioral and psychological symptoms of dementia, such as wandering, delusions and hallucinations.","exampleJa":"BPSDに該当するものとして、適切なもの。","exampleEn":"Choose the one that is a BPSD (behavioral and psychological symptom of dementia).","exampleRuby":"BPSDに該当《がいとう》するものとして、適切《てきせつ》なもの。","exampleGapRuby":"{{GAP}}に該当《がいとう》するものとして、適切《てきせつ》なもの。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"記憶障害などの「中核症状」と、環境や体調で強く出る「BPSD（行動・心理症状）」を区別する。","noteEn":"Distinguish core symptoms (such as memory loss) from BPSD, which can become stronger depending on surroundings and physical condition.","gapTerm":"BPSD","termRuby":"BPSD","easyJaRuby":"認知症《にんちしょう》の人《ひと》に出《で》る、行動《こうどう》や気持《きも》ちの症状《しょうじょう》。歩《ある》きまわる、本当《ほんとう》ではないことを信《しん》じる、など","noteJaRuby":"記憶障害《きおくしょうがい》などの「中核症状《ちゅうかくしょうじょう》」と、環境《かんきょう》や体調《たいちょう》で強《つよ》く出《で》る「BPSD（行動《こうどう》・心理症状《しんりしょうじょう》）」を区別《くべつ》する。","noteEnRuby":""},{"id":"KV368","term":"アルツハイマー型認知症","kana":"あるつはいまーがたにんちしょう","romaji":"arutsuhaimāgataninchishō","english":"Alzheimer's-type dementia","easyJa":"脳が少しずつ小さくなる認知症。認知症の中でいちばん多く、もの忘れから始まることが多い","englishDesc":"The most common type of dementia. The brain slowly shrinks, and it often starts with memory loss.","exampleJa":"アルツハイマー型認知症の特徴として、最も適切なもの。","exampleEn":"Choose the most appropriate feature of Alzheimer's-type dementia.","exampleRuby":"アルツハイマー型認知症《がたにんちしょう》の特徴《とくちょう》として、最《もっと》も適切《てきせつ》なもの。","exampleGapRuby":"{{GAP}}の特徴《とくちょう》として、最《もっと》も適切《てきせつ》なもの。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"認知症の原因の病気でいちばん多い（全体の約半数）。血管性認知症やレビー小体型認知症との区別が問われる。","noteEn":"The most common cause of dementia (about half of all cases). Distinguishing it from vascular dementia and dementia with Lewy bodies is tested.","gapTerm":"アルツハイマー型認知症","termRuby":"アルツハイマー型認知症《がたにんちしょう》","easyJaRuby":"脳《のう》が少《すこ》しずつ小《ちい》さくなる認知症《にんちしょう》。認知症《にんちしょう》の中《なか》でいちばん多《おお》く、もの忘《わす》れから始《はじ》まることが多《おお》い","noteJaRuby":"認知症《にんちしょう》の原因《げんいん》の病気《びょうき》でいちばん多《おお》い（全体《ぜんたい》の約半数《やくはんすう》）。血管性認知症《けっかんせいにんちしょう》やレビー小体型認知症《しょうたいがたにんちしょう》との区別《くべつ》が問《と》われる。","noteEnRuby":""},{"id":"KV369","term":"民生委員","kana":"みんせいいいん","romaji":"minseiiin","english":"community welfare volunteer (minsei-iin)","easyJa":"地域の人の相談を聞いて、必要な支援につなぐボランティア","englishDesc":"A volunteer who listens to local residents' problems and connects them to support.","exampleJa":"民生委員の役割に関する記述として、適切なもの。","exampleEn":"Choose the appropriate statement about the role of community welfare volunteers.","exampleRuby":"民生委員《みんせいいいん》の役割《やくわり》に関《かん》する記述《きじゅつ》として、適切《てきせつ》なもの。","exampleGapRuby":"{{GAP}}の役割《やくわり》に関《かん》する記述《きじゅつ》として、適切《てきせつ》なもの。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"厚生労働大臣から委嘱される、給料のないボランティア。児童委員も兼ねる。読み方は「みんせいいいん」で「い」が3つ続く。","noteEn":"Unpaid volunteers commissioned by the Minister of Health, Labour and Welfare. They also serve as child welfare volunteers. The reading has three い in a row.","gapTerm":"民生委員","termRuby":"民生委員《みんせいいいん》","easyJaRuby":"地域《ちいき》の人《ひと》の相談《そうだん》を聞《き》いて、必要《ひつよう》な支援《しえん》につなぐボランティア","noteJaRuby":"厚生労働大臣《こうせいろうどうだいじん》から委嘱《いしょく》される、給料《きゅうりょう》のないボランティア。児童委員《じどういいん》も兼《か》ねる。読《よ》み方《かた》は「みんせいいいん」で「い」が3つ続《つづ》く。","noteEnRuby":""},{"id":"KV370","term":"ダウン症候群","kana":"だうんしょうこうぐん","romaji":"daunshōkōgun","english":"Down syndrome","easyJa":"生まれつき、体の中の「染色体」が1本多いことで起こる状態","englishDesc":"A condition present from birth, caused by one extra chromosome 21.","exampleJa":"ダウン症候群の特徴に関する記述として、適切なもの。","exampleEn":"Choose the appropriate statement about the features of Down syndrome.","exampleRuby":"ダウン症候群《しょうこうぐん》の特徴《とくちょう》に関《かん》する記述《きじゅつ》として、適切《てきせつ》なもの。","exampleGapRuby":"{{GAP}}の特徴《とくちょう》に関《かん》する記述《きじゅつ》として、適切《てきせつ》なもの。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"21番目の染色体が3本ある（トリソミー）。知的障害や心臓の病気などをともなうことがある。","noteEn":"There are three copies of chromosome 21 (trisomy). It may come with intellectual disability or heart problems.","gapTerm":"ダウン症候群","termRuby":"ダウン症候群《しょうこうぐん》","easyJaRuby":"生《う》まれつき、体《からだ》の中  live a normal life in the community?","jaRuby":"障害《しょうがい》の有無《うむ》にかかわらず、誰《だれ》もが地域《ちいき》で通常《つうじょう》の生活《せいかつ》ができるようにする社会理念《しゃかいりねん》はどれか。"}],"pointJaRuby":"障害《しょうがい》の有無《うむ》にかかわらず地域《ちいき》で当《あ》たり前《まえ》に生活《せいかつ》する／バンク-ミケルセンが提唱《ていしょう》"},{"id":"JT02","no":2,"group":"B","vocabId":"KV322","answerEn":"Care Needs Certification Committee","pointJa":"要介護認定の審査・判定を行う／市町村に設置される","pointEn":"Reviews and decides care-needs certification / set up in each municipality","questions":[{"id":"JT02a","ja":"要介護認定の審査および判定を行う機関はどれか。","en":"Which organization conducts the examination and judgment for long-term care needs certification?","jaRuby":"要介護認定《ようかいごにんてい》の審査《しんさ》および判定《はんてい》を行《おこな》う機関《きかん》はどれか。"},{"id":"JT02b","ja":"介護認定審査会が設置されているのはどこか。","en":"Where is the Care Needs Certification Board established?","answer":"市町村","answerKana":"しちょうそん","answerEn":"Municipality (city, town, village)","choices":[{"term":"市町村","kana":"しちょうそん","en":"Municipality","termRuby":"市町村《しちょうそん》"},{"term":"都道府県","kana":"とどうふけん","en":"Prefecture","termRuby":"都道府県《とどうふけん》"},{"term":"国","kana":"くに","en":"National government","termRuby":"国《くに》"},{"term":"地域包括支援センター","kana":"ちいきほうかつしえんせんたー","en":"Community General Support Center","termRuby":"地域包括支援《ちいきほうかつしえん》センター"}],"jaRuby":"介護認定審査会《かいごにんていしんさかい》が設置《せっち》されているのはどこか。","answerRuby":"市町村《しちょうそん》"},{"id":"JT02c","ja":"要介護認定の審査及び判定を行う『介護認定審査会』が設置される場所として正しいものはどれか。","en":"Where is the Care Needs Certification Committee set up?","answer":"市町村","answerKana":"しちょうそん","answerEn":"Municipality (city, town, village)","choices":[{"term":"市町村","kana":"しちょうそん","en":"Municipality","termRuby":"市町村《しちょうそん》"},{"term":"都道府県","kana":"とどうふけん","en":"Prefecture","termRuby":"都道府県《とどうふけん》"},{"term":"国","kana":"くに","en":"National government","termRuby":"国《くに》"},{"term":"地域包括支援センター","kana":"ちいきほうかつしえんせんたー","en":"Community General Support Center","termRuby":"地域包括支援《ちいきほうかつしえん》センター"}],"jaRuby":"要介護認定《ようかいごにんてい》の審査及《しんさおよ》び判定《はんてい》を行《おこな》う『介護認定審査会《かいごにんていしんさかい》』が設置《せっち》される場所《ばしょ》として正《ただ》しいものはどれか。","answerRuby":"市町村《しちょうそん》"}],"pointJaRuby":"要介護認定《ようかいごにんてい》の審査《しんさ》・判定《はんてい》を行《おこな》う／市町村《しちょうそん》に設置《せっち》される"},{"id":"JT03","no":3,"group":"B","vocabId":"KV361","answerEn":"Support Payment System","pointJa":"2003年に始まり2006年に廃止された／措置から契約へ","pointEn":"Started April 2003, ended April 2006 / from \"the government decides\" to \"the user makes a contract\"","questions":[{"id":"JT03a","ja":"2003年に導入され、2006年に廃止された、障害者が自らサービスを選択する制度はどれか。","en":"Which system, introduced in 2003 and abolished in 2006, allowed persons with disabilities to choose their own services?","jaRuby":"2003年《ねん》に導入《どうにゅう》され、2006年《ねん》に廃止《はいし》された、障害者《しょうがいしゃ》が自《みずか》らサービスを選択《せんたく》する制度《せいど》はどれか。"},{"id":"JT03b","ja":"措置制度から転換され、障害者と事業者が直接契約を結ぶ形でかつて存在した制度は何か。","en":"What was the former system, shifted from the administrative placement system, where persons with disabilities contracted directly with providers?","jaRuby":"措置制度《そちせいど》から転換《てんかん》され、障害者《しょうがいしゃ》と事業者《じぎょうしゃ》が直接契約《ちょくせつけいやく》を結《むす》ぶ形《かたち》でかつて存在《そんざい》した制度《せいど》は何《なに》か。"},{"id":"JT03c","ja":"2003年に導入され、障害者が事業者と直接契約を結ぶ仕組みであったが、2006年に廃止された制度は何か。","en":"Which system started in 2003, let people with disabilities sign contracts directly with service providers, and ended in 2006?","jaRuby":"2003年《ねん》に導入《どうにゅう》され、障害者《しょうがいしゃ》が事業者《じぎょうしゃ》と直接契約《ちょくせつけいやく》を結《むす》ぶ仕組《しく》みであったが、2006年《ねん》に廃止《はいし》された制度《せいど》は何《なに》か。"}],"pointJaRuby":"2003年《ねん》に始《はじ》まり2006年《ねん》に廃止《はいし》された／措置《そち》から契約《けいやく》へ"},{"id":"JT04","no":4,"group":"A","vocabId":"KV362","answerEn":"Non-judgmental attitude","pointJa":"バイスティックの7原則の1つ／自分の価値観で利用者を裁かない","pointEn":"One of Biestek's 7 principles / do not judge the user by your own values","questions":[{"id":"JT04a","ja":"バイスティックの7原則のうち、援助者が自らの価値観で利用者を「善悪」で批判しない態度を何というか。","en":"Among Biestek's 7 principles, which refers to the helper's attitude of not judging the user's actions as 'good or bad' based on their own values?","jaRuby":"バイスティックの7原則《げんそく》のうち、援助者《えんじょしゃ》が自《みずか》らの価値観《かちかん》で利用者《りようしゃ》を「善悪《ぜんあく》」で批判《ひはん》しない態度《たいど》を何《なに》というか。"},{"id":"JT04b","ja":"対人援助において、利用者の行動や態度を道徳的な基準で裁かないことを求める原則はどれか。","en":"Which principle in interpersonal support requires not judging the user's behavior or attitude based on moral standards?","jaRuby":"対人援助《たいじんえんじょ》において、利用者《りようしゃ》の行動《こうどう》や態度《たいど》を道徳的《どうとくてき》な基準《きじゅん》で裁《さば》かないことを求《もと》める原則《げんそく》はどれか。"},{"id":"JT04c","ja":"バイスティックの7原則のうち、援助者が自らの価値観で利用者を裁かないことを指す原則はどれか。","en":"Among Biestek's 7 principles, which one means the caregiver does not judge the user by their own values?","jaRuby":"バイスティックの7原則《げんそく》のうち、援助者《えんじょしゃ》が自《みずか》らの価値観《かちかん》で利用者《りようしゃ》を裁《さば》かないことを指《さ》す原則《げんそく》はどれか。"}],"pointJaRuby":"バイスティックの7原則《げんそく》の1つ／自分《じぶん》の価値観《かちかん》で利用者《りようしゃ》を裁《さば》かない"},{"id":"JT05","no":5,"group":"B","vocabId":"KV363","answerEn":"Duty of sincerity","pointJa":"介護福祉士の義務／常に担当する者の立場に立って誠実に","pointEn":"A duty of a certified care worker / always work sincerely from the user's point of view","questions":[{"id":"JT05a","ja":"介護福祉士の義務のうち、「常に担当する者の立場に立って、誠実に業務を行わなければならない」とするものはどれか。","en":"Which obligation of a certified care worker states they must 'always stand in the position of the person they are in charge of and perform their duties sincerely'?","jaRuby":"介護福祉士《かいごふくしし》の義務《ぎむ》のうち、「常《つね》に担当《たんとう》する者《もの》の立場《たちば》に立《た》って、誠実《せいじつ》に業務《ぎょうむ》を行《おこな》わなければならない」とするものはどれか。"},{"id":"JT05b","ja":"利用者の利益を最優先し、真心をもって職務を遂行することを定めた介護福祉士の義務は何か。","en":"What obligation requires care workers to prioritize the user's interests and carry out their duties with a true heart?","jaRuby":"利用者《りようしゃ》の利益《りえき》を最優先《さいゆうせん》し、真心《まごころ》をもって職務《しょくむ》を遂行《すいこう》することを定《さだ》めた介護福祉士《かいごふくしし》の義務《ぎむ》は何《なに》か。"},{"id":"JT05c","ja":"介護福祉士の義務のうち、『常にその担当する者の立場に立って、誠実にその業務を行わなければならない』と定められているものはどれか。","en":"Which duty of a certified care worker says \"always stand in the position of the person in your care and do your work sincerely\"?","jaRuby":"介護福祉士《かいごふくしし》の義務《ぎむ》のうち、『常《つね》にその担当《たんとう》する者《もの》の立場《たちば》に立《た》って、誠実《せいじつ》にその業務《ぎょうむ》を行《おこな》わなければならない』と定《さだ》められているものはどれか。"}],"pointJaRuby":"介護福祉士《かいごふくしし》の義務《ぎむ》／常《つね》に担当《たんとう》する者《もの》の立場《たちば》に立《た》って誠実《せいじつ》に"},{"id":"JT06","no":6,"group":"C","vocabId":"KV364","answerEn":"Functional incontinence","pointJa":"排尿機能は正常／歩行障害や認知症でトイレに間に合わない","pointEn":"The bladder works normally / walking problems or dementia make the person too late for the toilet","questions":[{"id":"JT06a","ja":"排尿機能は正常だが、歩行障害などでトイレに間に合わずに起こる尿失禁を何というか。","en":"What type of incontinence occurs when urinary function is normal, but the person cannot reach the toilet in time due to a walking disability?","jaRuby":"排尿機能《はいにょうきのう》は正常《せいじょう》だが、歩行障害《ほこうしょうがい》などでトイレに間《ま》に合《あ》わずに起《お》こる尿失禁《にょうしっきん》を何《なに》というか。"},{"id":"JT06b","ja":"認知症でトイレの場所が分からなくなるなど、身体・認知機能の低下が原因で生じる失禁はどれか。","en":"Which incontinence is caused by physical or cognitive decline, such as forgetting the toilet's location due to dementia?","jaRuby":"認知症《にんちしょう》でトイレの場所《ばしょ》が分《わ》からなくなるなど、身体《しんたい》・認知機能《にんちきのう》の低下《ていか》が原因《げんいん》で生《しょう》じる失禁《しっきん》はどれか。"},{"id":"JT06c","ja":"排尿機能に異常はないが、運動機能の低下や認知症などが原因でトイレでの排泄が間に合わずに起こる失禁を何というか。","en":"What is it called when the bladder is normal, but weak movement or dementia makes the person too late for the toilet?","jaRuby":"排尿機能《はいにょうきのう》に異常《いじょう》はないが、運動機能《うんどうきのう》の低下《ていか》や認知症《にんちしょう》などが原因《げんいん》でトイレでの排泄《はいせつ》が間《ま》に合《あ》わずに起《お》こる失禁《しっきん》を何《なに》というか。"}],"pointJaRuby":"排尿機能《はいにょうきのう》は正常《せいじょう》／歩行障害《ほこうしょうがい》や認知症《にんちしょう》でトイレに間《ま》に合《あ》わない"},{"id":"JT07","no":7,"group":"C","vocabId":"KV113","answerEn":"Disuse syndrome","pointJa":"寝たきりや過度な安静で心身の機能が低下する／別名「生活不活発病」","pointEn":"Body and mind get weaker from staying in bed or resting too much / also called \"inactivity disease\"","questions":[{"id":"JT07a","ja":"長期間の寝たきりなど、身体を動かさないことで起こる心身の機能低下を何というか。","en":"What is the term for the decline in physical and mental functions caused by prolonged bed rest or inactivity?","jaRuby":"長期間《ちょうきかん》の寝《ね》たきりなど、身体《しんたい》を動《うご》かさないことで起《お》こる心身《しんしん》の機能低下《きのうていか》を何《なに》というか。"},{"id":"JT07b","ja":"「生活不活発病」とも呼ばれ、過度な安静によって筋力低下などが生じる状態はどれか。","en":"Also known as 'lifestyle inactivity disease', what condition causes muscle weakness due to excessive rest?","jaRuby":"「生活不活発病《せいかつふかっぱつびょう》」とも呼《よ》ばれ、過度《かど》な安静《あんせい》によって筋力低下《きんりょくていか》などが生《しょう》じる状態《じょうたい》はどれか。"},{"id":"JT07c","ja":"長期間の臥床（寝たきり）状態などが原因で、筋力低下や関節拘縮などが生じる状態を何というか。","en":"What is the condition where muscles become weak and joints become stiff because of lying in bed (being bedridden) for a long time?","jaRuby":"長期間《ちょうきかん》の臥床《がしょう》（寝《ね》たきり）状態《じょうたい》などが原因《げんいん》で、筋力低下《きんりょくていか》や関節拘縮《かんせつこうしゅく》などが生《しょう》じる状態《じょうたい》を何《なに》というか。"}],"pointJaRuby":"寝《ね》たきりや過度《かど》な安静《あんせい》で心身《しんしん》の機能《きのう》が低下《ていか》する／別名《べつめい》「生活不活発病《せいかつふかっぱつびょう》」"},{"id":"JT08","no":8,"group":"C","vocabId":"KV365","answerEn":"Melatonin","pointJa":"睡眠ホルモン／加齢で分泌が減り、高齢者の不眠の一因になる","pointEn":"Sleep hormone / decreases with age, one cause of poor sleep in older people","questions":[{"id":"JT08a","ja":"脳から分泌され、体内時計に働きかけて自然な眠りを誘う「睡眠ホルモン」はどれか。","en":"Which 'sleep hormone' is secreted from the brain and acts on the biological clock to induce natural sleep?","jaRuby":"脳《のう》から分泌《ぶんぴつ》され、体内時計《たいないどけい》に働《はたら》きかけて自然《しぜん》な眠《ねむ》りを誘《さそ》う「睡眠《すいみん》ホルモン」はどれか。"},{"id":"JT08b","ja":"加齢とともに分泌量が減少し、高齢者の不眠の一因となるホルモンは何か。","en":"Which hormone decreases in secretion with age, contributing to insomnia in the elderly?","jaRuby":"加齢《かれい》とともに分泌量《ぶんぴつりょう》が減少《げんしょう》し、高齢者《こうれいしゃ》の不眠《ふみん》の一因《いちいん》となるホルモンは何《なに》か。"},{"id":"JT08c","ja":"睡眠と覚醒のリズムを調節する働きがあり、『睡眠ホルモン』とも呼ばれるものはどれか。","en":"Which one controls the rhythm of sleeping and waking and is also called the \"sleep hormone\"?","jaRuby":"睡眠《すいみん》と覚醒《かくせい》のリズムを調節《ちょうせつ》する働《はたら》きがあり、『睡眠《すいみん》ホルモン』とも呼《よ》ばれるものはどれか。"}],"pointJaRuby":"睡眠《すいみん》ホルモン／加齢《かれい》で分泌《ぶんぴつ》が減《へ》り、高齢者《こうれいしゃ》の不眠《ふみん》の一因《いちいん》になる"},{"id":"JT09","no":9,"group":"C","vocabId":"KV366","answerEn":"Procedural memory","pointJa":"体で覚えた記憶（自転車・楽器）／認知症でも保たれやすい","pointEn":"Memory learned by the body (bicycle, musical instruments) / tends to remain even with dementia","questions":[{"id":"JT09a","ja":"自転車の乗り方など、反復によって「体で覚えた」動作の記憶を何というか。","en":"What do you call the memory of movements or skills 'learned by the body' through repetition, such as riding a bicycle?","jaRuby":"自転車《じてんしゃ》の乗《の》り方《かた》など、反復《はんぷく》によって「体《からだ》で覚《おぼ》えた」動作《どうさ》の記憶《きおく》を何《なに》というか。"},{"id":"JT09b","ja":"認知症になっても比較的保たれやすいとされる、技術や動作に関する長期記憶はどれか。","en":"Which long-term memory related to skills and movements is relatively well preserved even in dementia?","jaRuby":"認知症《にんちしょう》になっても比較的保《ひかくてきたも》たれやすいとされる、技術《ぎじゅつ》や動作《どうさ》に関《かん》する長期記憶《ちょうききおく》はどれか。"},{"id":"JT09c","ja":"長期記憶のうち、自転車の乗り方などのように身体の動作として記憶され、認知症の進行後も保たれやすい記憶はどれか。","en":"Which type of long-term memory is stored as body movement (like riding a bicycle) and tends to remain even as dementia gets worse?","jaRuby":"長期記憶《ちょうききおく》のうち、自転車《じてんしゃ》の乗《の》り方《かた》などのように身体《しんたい》の動作《どうさ》として記憶《きおく》され、認知症《にんちしょう》の進行後《しんこうご》も保《たも》たれやすい記憶《きおく》はどれか。"}],"pointJaRuby":"体《からだ》で覚《おぼ》えた記憶《きおく》（自転車《じてんしゃ》・楽器《がっき》）／認知症《にんちしょう》でも保《たも》たれやすい"},{"id":"JT10","no":10,"group":"D","vocabId":"KV102","answerEn":"Depression","pointJa":"認知症に似た症状が出る（仮性認知症）／物忘れ・無気力","pointEn":"Symptoms look like dementia (pseudo-dementia) / forgetfulness, no energy","questions":[{"id":"JT10a","ja":"「物忘れ」や「無気力」が強く出ることがあり、仮性認知症と間違われやすい疾患はどれか。","en":"Which disorder can cause severe 'forgetfulness' or 'apathy' and is often mistaken for pseudodementia?","jaRuby":"「物忘《ものわす》れ」や「無気力《むきりょく》」が強《つよ》く出《で》ることがあり、仮性認知症《かせいにんちしょう》と間違《まちが》われやすい疾患《しっかん》はどれか。"},{"id":"JT10b","ja":"高齢者において、意欲低下などの症状から認知症に似た状態を呈することがある精神疾患は何か。","en":"Which mental disorder in the elderly can present symptoms similar to dementia, such as decreased motivation?","jaRuby":"高齢者《こうれいしゃ》において、意欲低下《いよくていか》などの症状《しょうじょう》から認知症《にんちしょう》に似《に》た状態《じょうたい》を呈《てい》することがある精神疾患《せいしんしっかん》は何《なに》か。"},{"id":"JT10c","ja":"高齢者に多く見られ、意欲低下や記憶力低下などの症状から、認知症と間違われやすい疾患はどれか。","en":"Which illness is common in older people and often mistaken for dementia because of low motivation and poor memory?","jaRuby":"高齢者《こうれいしゃ》に多《おお》く見《み》られ、意欲低下《いよくていか》や記憶力低下《きおくりょくていか》などの症状《しょうじょう》から、認知症《にんちしょう》と間違《まちが》われやすい疾患《しっかん》はどれか。"}],"pointJaRuby":"認知症《にんちしょう》に似《に》た症状《しょうじょう》が出《で》る（仮性認知症《かせいにんちしょう》）／物忘《ものわす》れ・無気力《むきりょく》"},{"id":"JT11","no":11,"group":"D","vocabId":"KV367","answerEn":"BPSD (Behavioral and Psychological Symptoms of Dementia)","pointJa":"認知症の行動・心理症状／徘徊・妄想・幻覚・暴言など","pointEn":"Behavioral and psychological symptoms of dementia / wandering, delusions, hallucinations, abusive words, etc.","questions":[{"id":"JT11a","ja":"認知症の症状のうち、徘徊や妄想などの「行動・心理症状」をアルファベットで何というか。","en":"What is the acronym for 'Behavioral and Psychological Symptoms of Dementia', such as wandering and delusions?","jaRuby":"認知症《にんちしょう》の症状《しょうじょう》のうち、徘徊《はいかい》や妄想《もうそう》などの「行動《こうどう》・心理症状《しんりしょうじょう》」をアルファベットで何《なに》というか。"},{"id":"JT11b","ja":"中核症状をベースに、本人の性格や環境が絡み合って起こる認知症の周辺症状はどれか。","en":"Which refers to the peripheral symptoms of dementia arising from a combination of core symptoms, personality, and environment?","jaRuby":"中核症状《ちゅうかくしょうじょう》をベースに、本人《ほんにん》の性格《せいかく》や環境《かんきょう》が絡《から》み合《あ》って起《お》こる認知症《にんちしょう》の周辺症状《しゅうへんしょうじょう》はどれか。"},{"id":"JT11c","ja":"認知症の症状のうち、不安、焦燥、幻覚、妄想、徘徊などの『行動・心理症状』をアルファベットで何というか。","en":"What is the alphabet abbreviation for the \"behavioral and psychological symptoms\" of dementia, such as anxiety, restlessness, hallucinations, delusions and wandering?","jaRuby":"認知症《にんちしょう》の症状《しょうじょう》のうち、不安《ふあん》、焦燥《しょうそう》、幻覚《げんかく》、妄想《もうそう》、徘徊《はいかい》などの『行動《こうどう》・心理症状《しんりしょうじょう》』をアルファベットで何《なに》というか。"}],"pointJaRuby":"認知症《にんちしょう》の行動《こうどう》・心理症状《しんりしょうじょう》／徘徊《はいかい》・妄想《もうそう》・幻覚《げんかく》・暴言《ぼうげん》など"},{"id":"JT12","no":12,"group":"D","vocabId":"KV368","answerEn":"Alzheimer's-type dementia","pointJa":"認知症の原因疾患で最も多い（全体の約半数）／記憶障害から始まる","pointEn":"The most common cause of dementia (about half of all cases) / starts with memory problems","questions":[{"id":"JT12a","ja":"認知症の原因疾患の中で最も割合が高く、全体の約半数を占めるものはどれか。","en":"Which cause of dementia has the highest proportion, accounting for about half of all cases?","jaRuby":"認知症《にんちしょう》の原因疾患《げんいんしっかん》の中《なか》で最《もっと》も割合《わりあい》が高《たか》く、全体《ぜんたい》の約半数《やくはんすう》を占《し》めるものはどれか。"},{"id":"JT12b","ja":"脳が萎縮し記憶障害から始まることが多い、認知症の約50%以上を占める疾患は何か。","en":"Which disease, often starting with memory loss due to brain atrophy, accounts for over 50% of 援助者《えんじょしゃ》と利用者《りようしゃ》の間《あいだ》に築《きず》かれる「相互《そうご》に信頼《しんらい》し合《あ》える関係《かんけい》」を何《なに》というか。"},{"id":"JT14b","ja":"コミュニケーションの土台となる、心の通い合った信頼関係を指す言葉はどれか。","en":"Which word indicates the heart-to-heart relationship of trust that forms the foundation of communication?","jaRuby":"コミュニケーションの土台《どだい》となる、心《こころ》の通《かよ》い合《あ》った信頼関係《しんらいかんけい》を指《さ》す言葉《ことば》はどれか。"},{"id":"JT14c","ja":"介護福祉職と利用者の間で形成される、互いに信頼し、安心して感情を表現できる関係性のことを何というか。","en":"What is the relationship called in which the care worker and the user trust each other and can safely show their feelings?","jaRuby":"介護福祉職《かいごふくししょく》と利用者《りようしゃ》の間《あいだ》で形成《けいせい》される、互《たが》いに信頼《しんらい》し、安心《あんしん》して感情《かんじょう》を表現《ひょうげん》できる関係性《かんけいせい》のことを何《なに》というか。"}],"pointJaRuby":"援助者《えんじょしゃ》と利用者《りようしゃ》の信頼関係《しんらいかんけい》／コミュニケーションの土台《どだい》"},{"id":"JT15","no":15,"group":"E","vocabId":"KV370","answerEn":"Down syndrome","pointJa":"染色体異常／21番染色体が1本多い（トリソミー）","pointEn":"A chromosome disorder / one extra chromosome 21 (trisomy)","questions":[{"id":"JT15a","ja":"21番目の染色体が通常より1本多いことで生じる先天性の染色体異常はどれか。","en":"Which congenital chromosomal abnormality is caused by having one extra 21st chromosome?","jaRuby":"21番目《ばんめ》の染色体《せんしょくたい》が通常《つうじょう》より1本多《ほんおお》いことで生《しょう》じる先天性《せんてんせい》の染色体異常《せんしょくたいいじょう》はどれか。"},{"id":"JT15b","ja":"染色体異常（21トリソミー）が原因で、知的障害などを伴うことがある疾患は何か。","en":"Which condition, caused by a chromosomal abnormality (trisomy 21), can be accompanied by intellectual disability?","jaRuby":"染色体異常《せんしょくたいいじょう》（21トリソミー）が原因《げんいん》で、知的障害《ちてきしょうがい》などを伴《ともな》うことがある疾患《しっかん》は何《なに》か。"},{"id":"JT15c","ja":"21番染色体が1本多いことによる染色体異常で生じる疾患はどれか。","en":"Which condition is caused by one extra chromosome 21?","jaRuby":"21番染色体《ばんせんしょくたい》が1本多《ほんおお》いことによる染色体異常《せんしょくたいいじょう》で生《しょう》じる疾患《しっかん》はどれか。"}],"pointJaRuby":"染色体異常《せんしょくたいいじょう》／21番染色体《ばんせんしょくたい》が1本多《ほんおお》い（トリソミー）"},{"id":"JT16","no":16,"group":"B","vocabId":"KV371","answerEn":"Community Life Support Services","pointJa":"障害者総合支援法／市町村などが地域の実情に応じて行う（例：移動支援）","pointEn":"Comprehensive Support Act / run by municipalities and prefectures to fit local needs (e.g. mobility support)","questions":[{"id":"JT16a","ja":"障害者総合支援法において、「市町村」や「都道府県」が地域の実情に応じて柔軟に企画・実施できる事業はどれか。","en":"Under the Comprehensive Services for Persons with Disabilities Act, which projects can municipalities and prefectures flexibly plan and implement according to local conditions?","jaRuby":"障害者総合支援法《しょうがいしゃそうごうしえんほう》において、「市町村《しちょうそん》」や「都道府県《とどうふけん》」が地域《ちいき》の実情《じつじょう》に応《おう》じて柔軟《じゅうなん》に企画《きかく》・実施《じっし》できる事業《じぎょう》はどれか。"},{"id":"JT16b","ja":"国の一律なサービスではなく、移動支援など自治体が独自の判断で行える事業を総称して何というか。","en":"What is the collective term for projects, like mobility support, that local governments can implement at their own discretion rather than as a uniform national service?","jaRuby":"国《くに》の一律《いちりつ》なサービスではなく、移動支援《いどうしえん》など自治体《じちたい》が独自《どくじ》の判断《はんだん》で行《おこな》える事業《じぎょう》を総称《そうしょう》して何《なに》というか。"},{"id":"JT16c","ja":"障害者総合支援法に基づき、市町村が地域の実情に応じて柔軟な形態で実施できる事業（移動支援など）を総称して何というか。","en":"Under the Comprehensive Support Act, what is the general name for services (like mobility support) that municipalities can run flexibly to fit local needs?","jaRuby":"障害者総合支援法《しょうがいしゃそうごうしえんほう》に基《もと》づき、市町村《しちょうそん》が地域《ちいき》の実情《じつじょう》に応《おう》じて柔軟《じゅうなん》な形態《けいたい》で実施《じっし》できる事業《じぎょう》（移動支援《いどうしえん》など）を総称《そうしょう》して何《なに》というか。"}],"pointJaRuby":"障害者総合支援法《しょうがいしゃそうごうしえんほう》／市町村《しちょうそん》などが地域《ちいき》の実情《じつじょう》に応《おう》じて行《おこな》う（例《れい》：移動支援《いどうしえん》）"}],"categories":[{"id":"basic","type":"keyword","name":"基本の16語","nameEn":"Basic 16 keywords","desc":"介護の理念・制度・こころとからだ・認知症・障害の16語","descEn":"16 keywords: care ideas, systems, mind & body, dementia, disabilities","nameRuby":"基本《きほん》の16語《ご》","descRuby":"介護《かいご》の理念《りねん》・制度《せいど》・こころとからだ・認知症《にんちしょう》・障害《しょうがい》の16語《ご》"},{"id":"iryo","type":"choice","name":"医療的ケア","nameEn":"Medical care","desc":"喀痰吸引・経管栄養などの5択問題（全70問）","descEn":"5-choice questions on suctioning, tube feeding and more (70 questions)","source":"医療的ケア_5肢択一テスト問題集（全70問）_修正版.md（日本語）と 同_ルビ英訳付き.pdf（英訳）を統合。","noteJa":"この問題の内容は、手順や数値の一般的な目安です。実際のケアは、医師の指示書と施設の手順に従い、看護職員に確認してください。","noteEn":"The procedures and numbers here are general guidelines. In real care, follow the doctor's instruction sheet and your facility's procedures, and check with a nurse.","chapters":[{"id":"mc1","part":"基礎知識編","partEn":"Basic knowledge","name":"人間と社会","nameEn":"People and society","fullName":"第1章 人間と社会","nameRuby":"人間《にんげん》と社会《しゃかい》","partRuby":"基礎知識編《きそちしきへん》"},{"id":"mc2","part":"基礎知識編","partEn":"Basic knowledge","name":"保健医療制度とチーム医療","nameEn":"Health care systems and team care","fullName":"第2章 保健医療制度とチーム医療","nameRuby":"保健医療制度《ほけんいりょうせいど》とチーム医療《いりょう》","partRuby":"基礎知識編《きそちしきへん》"},{"id":"mc3","part":"基礎知識編","partEn":"Basic knowledge","name":"安全な療養生活","nameEn":"Safe life during treatment","fullName":"第3章 安全な療養生活","nameRuby":"安全《あんぜん》な療養生活《りょうようせいかつ》","partRuby":"基礎知識編《きそちしきへん》"},{"id":"mc4","part":"基礎知識編","partEn":"Basic knowledge","name":"清潔保持と感染予防","nameEn":"Keeping clean and preventing infection","fullName":"第4章 清潔保持と感染予防","nameRuby":"清潔保持《せいけつほじ》と感染予防《かんせんよぼう》","partRuby":"基礎知識編《きそちしきへん》"},{"id":"mc5","part":"基礎知識編","partEn":"Basic knowledge","name":"健康状態の把握","nameEn":"Understanding health condition","fullName":"第5章 健康状態の把握","nameRuby":"健康状態《けんこうじょうたい》の把握《はあく》","partRuby":"基礎知識編《きそちしきへん》"},{"id":"mc6","part":"実践編","partEn":"Practice","name":"喀痰吸引","nameEn":"Suctioning for older people and people/children with disabilities","fullName":"第1章 高齢者および障害児・者の「喀痰吸引」","nameRuby":"喀痰吸引《かくたんきゅういん》","partRuby":"実践編《じっせんへん》"},{"id":"mc7","part":"実践編","partEn":"Practice","name":"喀痰吸引の実施手順","nameEn":"Suctioning procedures","fullName":"第2章 高齢者および障害児・者の「喀痰吸引」実施手順","nameRuby":"喀痰吸引《かくたんきゅういん》の実施手順《じっしてじゅん》","partRuby":"実践編《じっせんへん》"},{"id":"mc8","part":"実践編","partEn":"Practice","name":"経管栄養","nameEn":"Tube feeding for older people and people/children with disabilities","fullName":"第3章 高齢者および障害児・者の「経管栄養」","nameRuby":"経管栄養《けいかんえいよう》","partRuby":"実践編《じっせんへん》"},{"id":"mc9","part":"実践編","partEn":"Practice","name":"経管栄養の実施手順","nameEn":"Tube feeding procedures","fullName":"第4章 高齢者および障害児・者の「経管栄養」実施手順","nameRuby":"経管栄養《けいかんえいよう》の実施手順《じっしてじゅん》","partRuby":"実践編《じっせんへん》"}],"questions":[{"id":"MC01","no":1,"chapter":"mc1","ja":"介護職員が医療的ケア（喀痰吸引および経管栄養）を実施する上での専門的役割や基本姿勢として、最も適切なものを1つ選びなさい。","en":"When care workers do medical care (suctioning of phlegm and tube feeding), which is the most appropriate role or basic attitude?","options":[{"ja":"医療的ケアの技術習得を最優先とし、利用者の生活習慣や価値観への配慮は二の次とする。","en":"Put learning medical care skills first, and think about the user's lifestyle and values later.","jaRuby":"医療的《いりょうてき》ケアの技術習得《ぎじゅつしゅうとく》を最優先《さいゆうせん》とし、利用者《りようしゃ》の生活習慣《せいかつしゅうかん》や価値観《かちかん》への配慮《はいりょ》は二《に》の次《つぎ》とする。"},{"ja":"医師の指示があれば、利用者の日々の状態観察は看護職員にすべて任せてよい。","en":"If the doctor gives instructions, care workers can leave all daily observation of the user to the nurses.","jaRuby":"医師《いし》の指示《しじ》があれば、利用者《りようしゃ》の日々《ひび》の状態観察《じょうたいかんさつ》は看護職員《かんごしょくいん》にすべて任《まか》せてよい。"},{"ja":"医療的ケアを特別な医療行為として切り離すのではなく、利用者の日常生活を支えるケアの一部として位置づける。","en":"Do not treat medical care as a special, separate medical act; see it as part of the care that supports the user's daily life.","jaRuby":"医療的《いりょうてき》ケアを特別《とくべつ》な医療行為《いりょうこうい》として切《き》り離《はな》すのではなく、利用者《りようしゃ》の日常生活《にちじょうせいかつ》を支《ささ》えるケアの一部《いちぶ》として位置《いち》づける。"},{"ja":"介護職員は生活支援の専門職であるため、医療的ケアに関する医学的知識を学ぶ必要はない。","en":"Care workers are specialists in daily-life support, so they do not need to learn medical knowledge about medical care.","jaRuby":"介護職員《かいごしょくいん》は生活支援《せいかつしえん》の専門職《せんもんしょく》であるため、医療的《いりょうてき》ケアに関《かん》する医学的知識《いがくてきちしき》を学《まな》ぶ必要《ひつよう》はない。"},{"ja":"利用者が在宅で生活するよりも、常に医療機関に入院して管理されることを目指して支援する。","en":"Aim for the user to always stay in a hospital rather than living at home.","jaRuby":"利用者《りようしゃ》が在宅《ざいたく》で生活《せいかつ》するよりも、常《つね》に医療機関《いりょうきかん》に入院《にゅういん》して管理《かんり》されることを目指《めざ》して支援《しえん》する。"}],"answer":3,"expJa":"介護職員が行う医療的ケアは、単に技術を提供するだけでなく、利用者の尊厳を守り、その人らしい日常生活を支える生活支援の一部として行うことが重要である。","expEn":"Medical care by care workers is not just giving a technique. It is important to do it as part of daily-life support that protects the user's dignity and supports the life they want.","jaRuby":"介護職員《かいごしょくいん》が医療的《いりょうてき》ケア（喀痰吸引《かくたんきゅういん》および経管栄養《けいかんえいよう》）を実施《じっし》する上《うえ》での専門的役割《せんもんてきやくわり》や基本姿勢《きほんしせい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"介護職員《かいごしょくいん》が行《おこな》う医療的《いりょうてき》ケアは、単《たん》に技術《ぎじゅつ》を提供《ていきょう》するだけでなく、利用者《りようしゃ》の尊厳《そんげん》を守《まも》り、その人《ひと》らしい日常生活《にちじょうせいかつ》を支《ささ》える生活支援《せいかつしえん》の一部《いちぶ》として行《おこな》うことが重要《じゅうよう》である。"},{"id":"MC02","no":2,"chapter":"mc1","ja":"2012年（平成24年）施行の「社会福祉士及び介護福祉士法」の一部改正により、介護職員等による喀痰吸引等が制度化された背景（社会的ニーズ）として、最も適切なものを1つ選びなさい。","en":"The 2012 revision of the Certified Social Workers and Certified Care Workers Act made suctioning etc. by care workers part of the system. What was the main social need behind this?","options":[{"ja":"病院の病床数が増加し、入院患者の長期入院を促進する必要が生じたため。","en":"Hospital beds increased, so long hospital stays had to be encouraged.","jaRuby":"病院《びょういん》の病床数《びょうしょうすう》が増加《ぞうか》し、入院患者《にゅういんかんじゃ》の長期入院《ちょうきにゅういん》を促進《そくしん》する必要《ひつよう》が生《しょう》じたため。"},{"ja":"医師や看護師の人数が大幅に余剰となり、業務を介護職員へ完全に移管する必要が生じたため。","en":"There were far too many doctors and nurses, so all their work had to be moved to care workers.","jaRuby":"医師《いし》や看護師《かんごし》の人数《にんずう》が大幅《おおはば》に余剰《よじょう》となり、業務《ぎょうむ》を介護職員《かいごしょくいん》へ完全《かんぜん》に移管《いかん》する必要《ひつよう》が生《しょう》じたため。"},{"ja":"医療的ケアを必要とする高齢者や障害児・者が増加し、地域や施設で安心して暮らせる体制整備が求められたため。","en":"More older people and people/children with disabilities needed medical care, so a system was needed for them to live safely in the community and in facilities.","jaRuby":"医療的《いりょうてき》ケアを必要《ひつよう》とする高齢者《こうれいしゃ》や障害児《しょうがいじ》・者《しゃ》が増加《ぞうか》し、地域《ちいき》や施設《しせつ》で安心《あんしん》して暮《く》らせる体制整備《たいせいせいび》が求《もと》められたため。"},{"ja":"家族による介護負担を意図的に増やし、在宅での看取りを義務化するため。","en":"To increase the family's care burden on purpose and make dying at home compulsory.","jaRuby":"家族《かぞく》による介護負担《かいごふたん》を意図的《いとてき》に増《ふ》やし、在宅《ざいたく》での看取《みと》りを義務化《ぎむか》するため。"},{"ja":"介護職員が単独で診断や処方を行えるようにし、医療費を削減するため。","en":"To let care workers diagnose and prescribe alone and reduce medical costs.","jaRuby":"介護職員《かいごしょくいん》が単独《たんどく》で診断《しんだん》や処方《しょほう》を行《おこな》えるようにし、医療費《いりょうひ》を削減《さくげん》するため。"}],"answer":3,"expJa":"高齢化の進展や在宅医療の推進に伴い、たんの吸引や経管栄養を必要とする方が増加したことから、2012年（平成24年）の法改正により、一定の研修を受けた介護職員等が特定行為を実施できるよう制度化された。","expEn":"As the population aged and home medical care grew, more people needed phlegm suctioning and tube feeding. So in 2012 the law was changed so that care workers who finish certain training can do these specified acts.","jaRuby":"2012年《ねん》（平成《へいせい》24年《ねん》）施行《しこう》の「社会福祉士及《しゃかいふくししおよ》び介護福祉士法《かいごふくししほう》」の一部改正《いちぶかいせい》により、介護職員等《かいごしょくいんとう》による喀痰吸引等《かくたんきゅういんとう》が制度化《せいどか》された背景《はいけい》（社会的《しゃかいてき》ニーズ）として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"高齢化《こうれいか》の進展《しんてん》や在宅医療《ざいたくいりょう》の推進《すいしん》に伴《ともな》い、たんの吸引《きゅういん》や経管栄養《けいかんえいよう》を必要《ひつよう》とする方《かた》が増加《ぞうか》したことから、2012年《ねん》（平成《へいせい》24年《ねん》）の法改正《ほうかいせい》により、一定《いってい》の研修《けんしゅう》を受《う》けた介護職員等《かいごしょくいんとう》が特定行為《とくていこうい》を実施《じっし》できるよう制度化《せいどか》された。"},{"id":"MC03","no":3,"chapter":"mc1","ja":"介護福祉士や一定の研修を受けた介護職員等（認定特定行為業務従事者）が、法令に基づき実務として喀痰吸引等を実施するための要件として、最も適切なものを1つ選びなさい。","en":"What is required for certified care workers or trained care workers (Certified Specified-Act Workers) to do suctioning etc. as part of their job under the law?","options":[{"ja":"実務者研修を修了すれば、所属する事業所の登録がなくても個人の判断で実施できる。","en":"After finishing Practical Training, they can do it on their own judgment, even if their workplace is not registered.","jaRuby":"実務者研修《じつむしゃけんしゅう》を修了《しゅうりょう》すれば、所属《しょぞく》する事業所《じぎょうしょ》の登録《とうろく》がなくても個人《こじん》の判断《はんだん》で実施《じっし》できる。"},{"ja":"登録喀痰吸引等事業者（または登録特定行為事業者）において、医師の文書による指示と看護職員との連携のもとで実施する。","en":"They do it at a registered provider, with the doctor's written instructions and in cooperation with nurses.","jaRuby":"登録喀痰吸引等事業者《とうろくかくたんきゅういんとうじぎょうしゃ》（または登録特定行為事業者《とうろくとくていこういじぎょうしゃ》）において、医師《いし》の文書《ぶんしょ》による指示《しじ》と看護職員《かんごしょくいん》との連携《れんけい》のもとで実施《じっし》する。"},{"ja":"利用者や家族の口頭での要望があれば、医師の指示書がなくても直ちに実施できる。","en":"If the user or family asks verbally, they can do it right away without a doctor's instruction sheet.","jaRuby":"利用者《りようしゃ》や家族《かぞく》の口頭《こうとう》での要望《ようぼう》があれば、医師《いし》の指示書《しじしょ》がなくても直《ただ》ちに実施《じっし》できる。"},{"ja":"介護福祉士の資格を取得した者は、実地研修を受けなくてもすべての特定行為を制限なく実施できる。","en":"Anyone with the certified care worker license can do all specified acts without limits, even without on-site training.","jaRuby":"介護福祉士《かいごふくしし》の資格《しかく》を取得《しゅとく》した者《もの》は、実地研修《じっちけんしゅう》を受《う》けなくてもすべての特定行為《とくていこうい》を制限《せいげん》なく実施《じっし》できる。"},{"ja":"看護師から電話で指示を受ければ、未経験の手技であってもその場で実施してよい。","en":"If a nurse gives instructions by phone, they may do a technique they have never done before.","jaRuby":"看護師《かんごし》から電話《でんわ》で指示《しじ》を受《う》ければ、未経験《みけいけん》の手技《しゅぎ》であってもその場《ば》で実施《じっし》してよい。"}],"answer":2,"expJa":"介護職員等が喀痰吸引等を行うには、登録事業者において、医師の文書による指示（指示書）を受け、看護職員との密接な連携体制のもとで実施する必要がある。","expEn":"To do suctioning etc., care workers must work at a registered provider, receive the doctor's written instructions (instruction sheet), and work in close cooperation with nurses.","jaRuby":"介護福祉士《かいごふくしし》や一定《いってい》の研修《けんしゅう》を受《う》けた介護職員等《かいごしょくいんとう》（認定特定行為業務従事者《にんていとくていこういぎょうむじゅうじしゃ》）が、法令《ほうれい》に基《もと》づき実務《じつむ》として喀痰吸引等《かくたんきゅういんとう》を実施《じっし》するための要件《ようけん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"介護職員等《かいごしょくいんとう》が喀痰吸引等《かくたんきゅういんとう》を行《おこな》うには、登録事業者《とうろくじぎょうしゃ》において、医師《いし》の文書《ぶんしょ》による指示《しじ》（指示書《しじしょ》）を受《う》け、看護職員《かんごしょくいん》との密接《みっせつ》な連携体制《れんけいたいせい》のもとで実施《じっし》する必要《ひつよう》がある。"},{"id":"MC04","no":4,"chapter":"mc1","ja":"「社会福祉士及び介護福祉士法」において、一定の研修を修了した介護職員等が実施可能な「特定行為（医療的ケア）」の範囲として、正しいものを1つ選びなさい。","en":"Under the Act, which is the correct range of “specified acts (medical care)” that trained care workers can do?","options":[{"ja":"咽頭を越えた奥までの気管内吸引および気管カニューレの交換","en":"Suctioning inside the trachea beyond the pharynx, and changing the tracheal cannula","jaRuby":"咽頭《いんとう》を越《こ》えた奥《おく》までの気管内吸引《きかんないきゅういん》および気管《きかん》カニューレの交換《こうかん》"},{"ja":"咽頭の手前までの口腔内吸引、鼻腔内吸引、気管カニューレ内部の吸引","en":"Suctioning inside the mouth (up to just before the pharynx), inside the nose, and inside the tracheostomy tube (tracheal cannula)","jaRuby":"咽頭《いんとう》の手前《てまえ》までの口腔内吸引《こうくうないきゅういん》、鼻腔内吸引《びくうないきゅういん》、気管《きかん》カニューレ内部《ないぶ》の吸引《きゅういん》"},{"ja":"胃ろう・腸ろう・経鼻経管栄養のチューブの挿入および抜去","en":"Inserting and removing tubes for gastrostomy, enterostomy and nasal tube feeding","jaRuby":"胃《い》ろう・腸《ちょう》ろう・経鼻経管栄養《けいびけいかんえいよう》のチューブの挿入《そうにゅう》および抜去《ばっきょ》"},{"ja":"インスリン注射の実施および血糖測定器の穿刺針による採血","en":"Giving insulin injections and taking blood with a lancet for blood sugar tests","jaRuby":"インスリン注射《ちゅうしゃ》の実施《じっし》および血糖測定器《けっとうそくていき》の穿刺針《せんしばり》による採血《さいけつ》"},{"ja":"床ずれ（褥瘡）の壊死組織の切除および医療用ガーゼによる処置","en":"Cutting away dead tissue of bedsores (pressure ulcers) and treating them with medical gauze","jaRuby":"床《とこ》ずれ（褥瘡《じょくそう》）の壊死組織《えしそしき》の切除《せつじょ》および医療用《いりょうよう》ガーゼによる処置《しょち》"}],"answer":2,"expJa":"介護職員等が実施可能な特定行為は、①喀痰吸引（口腔内［咽頭の手前まで］、鼻腔内、気管カニューレ内部）と、②経管栄養（胃ろうまたは腸ろう、経鼻経管栄養）の計5行為である。チューブの挿入・抜去やインスリン注射、褥瘡処置は行えない。","expEn":"Care workers can do 5 acts in total: (1) suctioning – inside the mouth [up to before the pharynx], inside the nose, inside the tracheal cannula; and (2) tube feeding – gastrostomy or enterostomy, and nasal tube feeding. They cannot insert or remove tubes, give insulin injections, or treat bedsores.","jaRuby":"「社会福祉士及《しゃかいふくししおよ》び介護福祉士法《かいごふくししほう》」において、一定《いってい》の研修《けんしゅう》を修了《しゅうりょう》した介護職員等《かいごしょくいんとう》が実施可能《じっしかのう》な「特定行為《とくていこうい》（医療的《いりょうてき》ケア）」の範囲《はんい》として、正《ただ》しいものを1つ選《えら》びなさい。","expJaRuby":"介護職員等《かいごしょくいんとう》が実施可能《じっしかのう》な特定行為《とくていこうい》は、①喀痰吸引《かくたんきゅういん》（口腔内《こうくうない》［咽頭《いんとう》の手前《てまえ》まで］、鼻腔内《びくうない》、気管《きかん》カニューレ内部《ないぶ》）と、②経管栄養《けいかんえいよう》（胃《い》ろうまたは腸《ちょう》ろう、経鼻経管栄養《けいびけいかんえいよう》）の計《けい》5行為《こうい》である。チューブの挿入《そうにゅう》・抜去《ばっきょ》やインスリン注射《ちゅうしゃ》、褥瘡処置《じょくそうしょち》は行《おこな》えない。"},{"id":"MC05","no":5,"chapter":"mc1","ja":"介護職員等が実施する口腔内の喀痰吸引の範囲に関する規定として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate rule about how far care workers may suction inside the mouth?","options":[{"ja":"吸引チューブを挿入できる深さに制限はなく、気管分岐部まで挿入して吸引する。","en":"There is no limit; insert the tube down to where the trachea divides and suction.","jaRuby":"吸引《きゅういん》チューブを挿入《そうにゅう》できる深《ふか》さに制限《せいげん》はなく、気管分岐部《きかんぶんきぶ》まで挿入《そうにゅう》して吸引《きゅういん》する。"},{"ja":"歯茎と頬の間のみに限定され、舌の上や周囲は吸引してはならない。","en":"Only between the gums and cheeks; never suction on or around the tongue.","jaRuby":"歯茎《はぐき》と頬《ほお》の間《あいだ》のみに限定《げんてい》され、舌《した》の上《うえ》や周囲《しゅうい》は吸引《きゅういん》してはならない。"},{"ja":"咽頭の手前（咽頭の後壁の手前）までを限度として吸引する。","en":"Suction only up to just before the pharynx (before the back wall of the pharynx).","jaRuby":"咽頭《いんとう》の手前《てまえ》（咽頭《いんとう》の後壁《こうへき》の手前《てまえ》）までを限度《げんど》として吸引《きゅういん》する。"},{"ja":"出血を伴う場合であっても、咽頭の奥まで強く押し込んで吸引する。","en":"Even if there is bleeding, push the tube hard deep into the pharynx and suction.","jaRuby":"出血《しゅっけつ》を伴《ともな》う場合《ばあい》であっても、咽頭《いんとう》の奥《おく》まで強《つよ》く押《お》し込《こ》んで吸引《きゅういん》する。"},{"ja":"口腔内吸引を行う際は、必ず開口器を使用して強制的に口を開けさせる。","en":"Always use a mouth opener to force the mouth open.","jaRuby":"口腔内吸引《こうくうないきゅういん》を行《おこな》う際《さい》は、必《かなら》ず開口器《かいこうき》を使用《しよう》して強制的《きょうせいてき》に口《くち》を開《あ》けさせる。"}],"answer":3,"expJa":"口腔内の喀痰吸引は、咽頭の手前までを限度とする。咽頭の奥まで挿入すると、嘔吐反射や粘膜損傷、迷走神経反射などを引き起こす危険がある。","expEn":"Suctioning inside the mouth is limited to just before the pharynx. Going deeper can cause the gag reflex, damage to the mucous membrane, or a vagus nerve reflex.","jaRuby":"介護職員等《かいごしょくいんとう》が実施《じっし》する口腔内《こうくうない》の喀痰吸引《かくたんきゅういん》の範囲《はんい》に関《かん》する規定《きてい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"口腔内《こうくうない》の喀痰吸引《かくたんきゅういん》は、咽頭《いんとう》の手前《てまえ》までを限度《げんど》とする。咽頭《いんとう》の奥《おく》まで挿入《そうにゅう》すると、嘔吐反射《おうとはんしゃ》や粘膜損傷《ねんまくそんしょう》、迷走神経反射《めいそうしんけいはんしゃ》などを引《ひ》き起《お》こす危険《きけん》がある。"},{"id":"MC06","no":6,"chapter":"mc1","ja":"介護職員等が実施する経管栄養の範囲に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about the range of tube feeding done by care workers is most appropriate?","options":[{"ja":"経鼻経管栄養において、胃の中にチューブが正しく入っているかどうかの確認（気泡音の聴取等）は介護職員が単独で行う。","en":"In nasal tube feeding, the care worker alone checks that the tube is correctly in the stomach (e.g. listening for air bubble sounds).","jaRuby":"経鼻経管栄養《けいびけいかんえいよう》において、胃《い》の中《なか》にチューブが正《ただ》しく入《はい》っているかどうかの確認《かくにん》（気泡音《きほうおん》の聴取等《ちょうしゅとう》）は介護職員《かいごしょくいん》が単独《たんどく》で行《おこな》う。"},{"ja":"経鼻経管栄養のチューブ先端の位置確認は医師または看護職員が行い、介護職員は栄養剤の注入や見守り等を行う。","en":"The doctor or nurse checks the position of the nasal tube tip; the care worker gives the nutrition and watches the user.","jaRuby":"経鼻経管栄養《けいびけいかんえいよう》のチューブ先端《せんたん》の位置確認《いちかくにん》は医師《いし》または看護職員《かんごしょくいん》が行《おこな》い、介護職員《かいごしょくいん》は栄養剤《えいようざい》の注入《ちゅうにゅう》や見守《みまも》り等《とう》を行《おこな》う。"},{"ja":"胃ろうや腸ろうのボタン・チューブが抜けてしまった場合、介護職員が速やかに再挿入する。","en":"If a gastrostomy/enterostomy button or tube comes out, the care worker quickly puts it back in.","jaRuby":"胃《い》ろうや腸《ちょう》ろうのボタン・チューブが抜《ぬ》けてしまった場合《ばあい》、介護職員《かいごしょくいん》が速《すみ》やかに再挿入《さいそうにゅう》する。"},{"ja":"経鼻経管栄養の栄養チューブが咽頭でトグロを巻いている場合、介護職員が入れ直す。","en":"If the nasal feeding tube is coiled in the throat, the care worker reinserts it.","jaRuby":"経鼻経管栄養《けいびけいかんえいよう》の栄養《えいよう》チューブが咽頭《いんとう》でトグロを巻《ま》いている場合《ばあい》、介護職員《かいごしょくいん》が入《い》れ直《ただ》す。"},{"ja":"医師の指示書に記載された栄養剤の注入速度は、介護職員の都合に合わせて自由に変更できる。","en":"The care worker may freely change the feeding speed written on the doctor's sheet to suit their own schedule.","jaRuby":"医師《いし》の指示書《しじしょ》に記載《きさい》された栄養剤《えいようざい》の注入速度《ちゅうにゅうそくど》は、介護職員《かいごしょくいん》の都合《つごう》に合《あ》わせて自由《じゆう》に変更《へんこう》できる。"}],"answer":2,"expJa":"経鼻経管栄養において、チューブの先端が胃内に正しく留置されているかの確認は、医師または看護職員が行う。胃ろう・腸ろう・経鼻チューブの再挿入も介護職員は行えない。","expEn":"In nasal tube feeding, the doctor or nurse checks that the tube tip is correctly in the stomach. Care workers also cannot reinsert gastrostomy, enterostomy or nasal tubes.","jaRuby":"介護職員等《かいごしょくいんとう》が実施《じっし》する経管栄養《けいかんえいよう》の範囲《はんい》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"経鼻経管栄養《けいびけいかんえいよう》において、チューブの先端《せんたん》が胃内《いない》に正《ただ》しく留置《りゅうち》されているかの確認《かくにん》は、医師《いし》または看護職員《かんごしょくいん》が行《おこな》う。胃《い》ろう・腸《ちょう》ろう・経鼻《けいび》チューブの再挿入《さいそうにゅう》も介護職員《かいごしょくいん》は行《おこな》えない。"},{"id":"MC07","no":7,"chapter":"mc2","ja":"日本の保健医療・福祉に関する諸制度の説明として、最も適切なものを1つ選びなさい。","en":"Which explanation of Japan's health, medical and welfare systems is most appropriate?","options":[{"ja":"医療保険制度は、75歳以上の高齢者のみを対象とした制度であり、若年層は加入できない。","en":"Medical insurance is only for people aged 75 and over; young people cannot join.","jaRuby":"医療保険制度《いりょうほけんせいど》は、75歳以上《さいいじょう》の高齢者《こうれいしゃ》のみを対象《たいしょう》とした制度《せいど》であり、若年層《じゃくねんそう》は加入《かにゅう》できない。"},{"ja":"介護保険制度において、要介護認定を受けた利用者が訪問看護を利用することはできない。","en":"Users certified as needing care cannot use home-visit nursing un
