function startJitsumu(items){
  items = (items && items.length) ? items : (JT.items||[]);
  var q = shuffle(items).filter(function(it){ return BYID[it.vocabId]; }).map(function(it){
    return { it:it, q:it.questions[Math.floor(Math.random()*it.questions.length)], w:BYID[it.vocabId] };
  });
  if(!q.length){ alert(T("msg.empty").ja + "\n" + T("msg.empty").en); return; }
  SES = { mode:"jitsumu", queue:q, i:0, step:1, revealed:false, hint:0, right:0, wrong:[],
          wrongItems:[], stem:null, choices:null, dir:null };
  go("study");
}
/* 選択肢：正解＋ほかの語の答え3つ（同じ分野を優先）。独自の答えを持つ問題はその選択肢を使う */
function jtChoices(e){
  if(e.q.answer){
    return shuffle(e.q.choices.map(function(c){
      return { term:c.term, termRuby:c.termRuby, kana:c.kana, en:c.en, correct:c.term===e.q.answer };
    }));
  }
  function opt(it){ var w = BYID[it.vocabId];
    return { term:w.term, termRuby:w.termRuby, kana:w.kana, en:it.answerEn, correct:it.id===e.it.id }; }
  var others = (JT.items||[]).filter(function(it){ return it.id!==e.it.id && BYID[it.vocabId]; });
  var same = shuffle(others.filter(function(it){ return it.group===e.it.group; }));
  var rest = shuffle(others.filter(function(it){ return it.group!==e.it.group; }));
  var pick = same.concat(rest).slice(0, 3);
  return shuffle([opt(e.it)].concat(pick.map(opt)));
}

/* ---------- session ---------- */
var SES = null;
/* 1回の学習で出す数。3つの学習モードとも、設定の「1日の目標」の数をそのまま使う。
   （設問ドリルは1問が2段階＝指示を読む→ことばを選ぶ、だが「1問」として数える。
     2段階目の正誤だけを1日のカウントに入れるので、10問やれば目標10に届く。） */
function sessionSize(mode){
  var g = parseInt(S.settings.dailyGoal, 10);
  if(!g || g < 1) g = 10;
  return g;
}
function startSession(mode){
  var n = sessionSize(mode);
  var q = buildQueue(mode, n);
  if(!q.length){ alert(T("msg.empty").ja + "\n" + T("msg.empty").en); return; }
  SES = { mode:mode, queue:q, i:0, step:1, revealed:false, hint:0, right:0, wrong:[],
          stem:null, choices:null, dir:null };
  go("study");
}
function nextItem(){
  SES.i++; SES.revealed=false; SES.step=1; SES.choices=null; SES.stem=null; SES.hint=0;
  if(SES.endless && SES.i >= SES.queue.length){
    /* 「全部の章から」は終わりなし：一巡したら、また未回答→まちがえた→その他の順に足す。
       直前と同じ問題が続かないようにする */
    var more = orderQs(SES.pool), last = SES.queue[SES.queue.length-1];
    if(more.length > 1 && more[0] === last) more.push(more.shift());
    SES.queue = SES.queue.concat(more);
  }
  if(SES.i >= SES.queue.length) go("result"); else render();
}
/* 「やめる」：ここまでに答えた問題で結果を出す */
function stopSession(){
  var n = SES.i + (SES.revealed ? 1 : 0);
  if(!n){ screen = HIST.pop() || "home"; window.scrollTo(0,0); render(); return; }
  SES.queue = SES.queue.slice(0, n);
  go("result");
}

/* ---------- router ---------- */
var screen = "home";
var HIST = [];
function go(s, keep){
  if(!keep) HIST.push(screen);
  screen = s; window.scrollTo(0,0); render();
}
function back(){
  if(screen === "study" && SES && SES.i > 0){
    if(!confirm("学習をやめますか。\nStop this session?")) return;
  }
  screen = HIST.pop() || "home"; window.scrollTo(0,0); render();
}

/* ---------- views ---------- */
function todayStat(){
  var h = S.history[S.history.length-1];
  return (h && h.date===today()) ? h : { answered:0, correct:0 };
}
/* おぼえた語：定着度(box)が3以上＝次の復習が7日後より先になった語。ホームときろくで共通 */
function learnedCount(){ return WORDS.filter(function(w){ var p=prog(w.id); return p && p.box>=3; }).length; }
/* 学習した語：一度でも出題された語 */
function studiedCount(){ return WORDS.filter(function(w){ return !!prog(w.id); }).length; }
/* 学習した日数：これまでに1問でも答えた日の合計（連続でなくてよい） */
function studyDays(){ return S.studyDates.length; }
function ofTotal(n){ return n+'<small> / '+WORDS.length+'</small>'; }

    }).join("")+'</div>';

  var subs = [{v:"",label:T("filter.all").ja,on:FILTER.subject===""}].concat(
    V.subjects.map(function(s){ return {v:s.name,ruby:ruby(s.nameRuby)+" ("+s.count+")",label:s.name,on:FILTER.subject===s.name}; }));
  var lvs = [{v:0,label:T("filter.all").ja,on:FILTER.level===0}].concat(
    V.levels.map(function(l){ return {v:l.level,ruby:ruby(l.labelRuby)+" ("+l.count+")",label:l.label,on:FILTER.level===l.level}; }));
  return '<div class="card"><h2>'+bi(T("filter.category"))+'</h2>'+chips("cat",cats)+'</div>'+
    '<div class="card"><h2>'+bi(T("filter.subject"))+'</h2>'+chips("subject",subs)+'</div>'+
    '<div class="card"><h2>'+bi(T("filter.level"))+'</h2>'+chips("level",lvs)+'</div>'+
    '<div class="card center"><div class="term" style="font-size:1.6em">'+count+'</div>'+
      bi(T("filter.count"))+
      (PENDING_MODE ? '<div class="sec"><span class="lb">'+tj("filter.perSession")+

        '<div style="font-weight:800;font-size:1.15em;margin-top:4px">'+
        tjn("filter.questions",{n:Math.min(count, sessionSize(PENDING_MODE))})+'</div></div>' : '')+
      '</div>'+
    '<button class="btn primary" type="button" id="startBtn"'+(count?"":" disabled")+'>'+bi(T("filter.start"))+'</button>'+

  if(S.settings.showRomaji) s += '<div class="romaji">'+esc(w.romaji)+'</div>';
  s += '<div style="margin-top:10px">'+
       '<span class="tag">'+lab(w.category)+'</span>'+
       '<span class="tag">'+lab(w.subject)+'</span>'+
       '<span class="tag">'+lab(w.levelLabel)+'</span></div>';
  if(opts.full){
    s += '<div class="sec"><div class="lb">'+tj("card.meaning")+
         (S.settings.showEnglish?' <span class="en">'+esc(T("card.meaning").en)+'</span>':'')+'</div>'+
         '<div style="font-weight:700">'+rj(w.easyJa, w.easyJaRuby)+'</div>'+
         (S.settings.showEnglish?'<div class="en">'+esc(w.englishDesc)+'</div><div class="en">'+esc(w.english)+'</div>':'')+
         '</div>';
    s += '<div class="sec"><div class="lb">'+tj("card.example")+
         (S.settings.showEnglish?' <span class="en">'+esc(T("card.example").en)+'</span>':'')+'</div>'+
         '<div class="ex'+rubyCls()+'">'+ruby(w.exampleRuby)+
         (S.settings.showEnglish?'<span class="en">'+esc(w.exampleEn)+'</span>':'')+'</div></div>';
    s += '<div class="sec"><div class="lb">'+tj("card.note")+
         (S.settings.showEnglish?' <span class="en">'+esc(T("card.note").en)+'</span>':'')+'</div>'+

function progHeader(){
  if(SES.endless){
    return '<div class="prog"><span>'+tj("quiz.progress")+' '+(SES.i+1)+'</span>'+
      '<span class="muted" style="flex:1;text-align:center">'+tj("quiz.correct")+' '+SES.right+'</span>'+
      '<button class="btn small ghost" type="button" id="stopBtn" style="width:auto;min-height:40px;padding:6px 14px">'+
      tj("jt.stop")+(S.settings.showEnglish?' <span class="en" style="display:inline">'+esc(T("jt.stop").en)+'</span>':'')+'</button></div>';
  }
  var pct = Math.round(SES.i/SES.queue.length*100);
  return '<div class="prog"><span>'+tj("quiz.progress")+' '+(SES.i+1)+'/'+SES.queue.length+'</span>'+
    '<span class="bar"><i style="width:'+pct+'%"></i></span></div>';
}

function vStudy(){
  if(SES.mode === "jitsumu" && SES.kind === "choice") return vJtChoice(SES.queue[SES.i]);
  if(SES.mode === "jitsumu") return vJitsumu(SES.queue[SES.i]);
  var w = SES.queue[SES.i];
  if(SES.mode === "card") return vCard(w);
  if(SES.mode === "drill") return vDrill(w);
  return vQuiz(w);
}

function vCard(w){
  var s = progHeader() + '<div class="card">'+ wordBody(w, {full:SES.revealed}) +'</div>';
  if(!SES.revealed){
    s += '<button class="btn primary" type="button" id="revealBtn">'+bi(T("card.showAnswer"))+'</button>';
  }else{
    s += '<div class="row">'+
      '<button class="btn small ghost" type="button" data-ans="0">✕ '+tj("card.unknown")+'</button>'+
      '<button class="btn small primary" type="button" data-ans="1">○ '+tj("card.known")+'</button></div>'+
      (S.settings.showEnglish?'<div class="muted center">'+esc(T("card.unknown").en)+' / '+esc(T("card.known").en)+'</div>':'');
  }
  return s;
}

function vQuiz(w){
  if(!SES.choices){ SES.choices = makeChoices(w); SES.dir = Math.random()<0.5 ? "w2m" : "m2w"; }
  var d = SES.dir;
  var stem = d==="w2m"
    ? '<div class="kana kana-dup">'+esc(w.kana)+'</div><div class="term">'+rj(w.term, w.termRuby)+'</div>'+
      (S.settings.showRomaji?'<div class="romaji">'+esc(w.romaji)+'</div>':'')
    : '<div class="stem">'+rj(w.easyJa, w.easyJaRuby)+'</div>'+
      (qEn()?'<div class="en">'+esc(w.englishDesc)+'</div>':'');
  var q = d==="w2m" ? T("quiz.questionMeaning") : T("quiz.questionWord");
  var s = progHeader() +
    '<div class="card"><div class="lb muted" style="font-weight:800">'+rj(q.ja, q.jaRuby)+
    (S.settings.showEnglish?'<span class="en">'+esc(q.en)+'</span>':'')+'</div>'+
    '<div class="sec">'+stem+'</div></div>';
  s += '<div class="stack">' + SES.choices.map(function(o,i){
    var label = d==="w2m"
      ? rj(o.mJa, o.mJaRuby) + (optEn()?'<span class="en">'+esc(o.mEn)+'</span>':'')
      : '<b>'+rj(o.term, o.termRuby)+'</b><span class="en kana-dup">'+esc(o.kana)+'</span>'+
        (optEn() && o.en ? '<span class="en">'+esc(o.en)+'</span>' : '');
    var cls = "btn opt";
    if(SES.revealed){
      if(o.correct) cls += " ok";
      else if(SES.picked === i) cls += " ng";
    }
    return '<button class="'+cls+'" type="button" data-pick="'+i+'"'+(SES.revealed?" disabled":"")+'>'+
      '<span class="num">'+(i+1)+'</span>'+label+'</button>';
  }).join("") + '</div>';
  s += hintBlock();
  if(SES.revealed) s += feedback(w, SES.choices[SES.picked]);
  return s;
}

function vDrill(w){
  if(!SES.stem){ SES.stem = STEMS[Math.floor(Math.random()*STEMS.length)]; }
  if(SES.step === 1){
    var s = progHeader() +
      '<div class="card"><div class="lb muted" style="font-weight:800">'+tj("drill.step1Intro")+
      (S.settings.showEnglish?'<span class="en">'+esc(T("drill.step1Intro").en)+'</span>':'')+'</div>'+
      '<div class="sec ex stem'+rubyCls()+'">'+ruby(SES.stem.jaRuby)+
      (SES.revealed && S.settings.showEnglish
        ? '<span class="en" style="margin-top:6px">'+tj("drill.translation")+'：'+esc(SES.stem.en)+'</span>' : '')+'</div>'+
      '<div class="sec">'+bi(T("drill.instructionCheck"),"stem")+'</div></div>';
    var opts = [
      { v:"correct", t:T("drill.optAppropriate") },
      { v:"incorrect", t:T("drill.optWrong") }
    ];
    s += '<div class="stack">'+ opts.map(function(o,i){
      var cls = "btn opt";
      if(SES.revealed){
        if(o.v === SES.stem.want) cls += " ok";
        else if(SES.picked === i) cls += " ng";
      }
      return '<button class="'+cls+'" type="button" data-step1="'+i+'" data-v="'+o.v+'"'+(SES.revealed?" disabled":"")+'>'+
        '<span class="num">'+(i+1)+'</span>'+rj(o.t.ja, o.t.jaRuby)+
        (S.settings.showEnglish?'<span class="en">'+esc(o.t.en)+'</span>':'')+'</button>';
    }).join("")+'</div>';
    if(SES.revealed){
      var ok = opts[SES.picked] && opts[SES.picked].v === SES.stem.want;
      s += '<div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"○ ":"✕ ")+
        tj(ok?"quiz.correct":"quiz.wrong")+
        (S.settings.showEnglish?'<span class="en">'+esc(T(ok?"quiz.correct":"quiz.wrong").en)+'</span>':'')+'</div>';
      s += '<div class="card note">'+L(SES.stem.want==="correct"
          ? "この設問は「正しいもの・適切なもの」を1つ選びます。"
          : "この設問は「まちがっているもの」を1つ選びます。文の終わりまで必ず読みましょう。")+
        (S.settings.showEnglish?'<span class="en">'+esc(SES.stem.want==="correct"
          ? "This question asks for the correct / appropriate option."
          : "This question asks for the INCORRECT option. Always read to the end of the sentence.")+'</span>':'')+'</div>';
      s += '<button class="btn primary" type="button" id="toStep2">'+bi(T("card.next"))+'</button>';
    }
    return s;
  }
  /* step 2 : gap fill */
  if(!SES.choices) SES.choices = makeChoices(w);
  var sentence = ruby(w.exampleGapRuby).replace('{{GAP}}', '<span class="gap">（　　）</span>');
  var s2 = progHeader() +
    '<div class="card"><div class="lb muted" style="font-weight:800">'+tj("drill.step2Intro")+
    (S.settings.showEnglish?'<span class="en">'+esc(T("drill.step2Intro").en)+'</span>':'')+'</div>'+
    '<div class="sec ex stem'+rubyCls()+'">'+sentence+'</div></div>';
  s2 += '<div class="stack">'+ SES.choices.map(function(o,i){
    var cls = "btn opt";
    if(SES.revealed){
      if(o.correct) cls += " ok";
      else if(SES.picked === i) cls += " ng";
    }
    return '<button class="'+cls+'" type="button" data-pick="'+i+'"'+(SES.revealed?" disabled":"")+'>'+
      '<span class="num">'+(i+1)+'</span><b>'+rj(o.term, o.termRuby)+'</b><span class="en kana-dup">'+esc(o.kana)+'</span></button>';
  }).join("")+'</div>';
  if(SES.revealed){
    s2 += feedback(w, SES.choices[SES.picked]);
    s2 = s2.replace('id="nextBtn"','id="nextBtn"');
  }
  return s2;
}

function feedback(w, picked){
  var ok = picked && picked.correct;
  var s = '<div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"○ ":"✕ ")+
    tj(ok?"quiz.correct":"quiz.wrong")+
    (S.settings.showEnglish?'<span class="en">'+esc(T(ok?"quiz.correct":"quiz.wrong").en)+'</span>':'')+'</div>';
  s += '<div class="card">'+
       '<div class="lb muted" style="font-weight:800">'+tj("quiz.answerWas")+'</div>'+
       '<div class="term" style="font-size:1.5em">'+rj(w.term, w.termRuby)+'</div>'+
       '<div class="kana">'+(S.settings.showRuby ? '' : esc(w.kana)+(S.settings.showRomaji?' / ':''))+
       (S.settings.showRomaji?'<i>'+esc(w.romaji)+'</i>':'')+'</div>'+
       '<div style="margin-top:8px;font-weight:700">'+rj(w.easyJa, w.easyJaRuby)+'</div>'+
       (S.settings.showEnglish?'<div class="en">'+esc(w.englishDesc)+'</div>':'')+
       '<div class="sec"><div class="ex'+rubyCls()+'">'+ruby(w.exampleRuby)+
       (S.settings.showEnglish?'<span class="en">'+esc(w.exampleEn)+'</span>':'')+'</div></div>';
  var g = (!ok && picked && picked.gid) ? GROUPS[picked.gid] : null;
  if(g){
    s += '<div class="sec"><div class="lb">'+tj("quiz.whyWrong")+
      (S.settings.showEnglish?' <span class="en">'+esc(T("quiz.whyWrong").en)+'</span>':'')+'</div>'+
      '<div class="note"><b>'+rj(picked.term, picked.termRuby)+'</b>：'+rj(picked.mJa, picked.mJaRuby)+
      (S.settings.showEnglish?'<span class="en">'+esc(picked.mEn)+'</span>':'')+
      '<div style="margin-top:8px">'+rj(g.pointJa, g.pointJaRuby)+
      (S.settings.showEnglish?'<span class="en">'+rj(g.pointEn, g.pointEnRuby)+'</span>':'')+'</div></div></div>';
  }else{
    s += '<div class="sec"><div class="lb">'+tj("card.note")+'</div>'+
      '<div class="note">'+rj(w.noteJa, w.noteJaRuby)+
      (S.settings.showEnglish?'<span class="en">'+rj(w.noteEn, w.noteEnRuby)+'</span>':'')+'</div></div>';
  }

function vStats(){
  var total = WORDS.length;
  var ans = 0, cor = 0;
  S.history.forEach(function(h){ ans += h.answered; cor += h.correct; });
  var s = '<div class="card"><div class="kpi two">'+
    '<div><b>'+ofTotal(learnedCount())+'</b><span>'+tjb("stats.learned")+'</span></div>'+
    '<div><b>'+ofTotal(studiedCount())+'</b><span>'+tjb("stats.studied")+'</span></div>'+
    '<div><b>'+(ans?Math.round(cor/ans*100):0)+'%</b><span>'+tjb("stats.accuracy")+'</span></div>'+
    '<div><b>'+studyDays()+'</b><span>'+tjb("stats.studyDays")+'</span></div></div>'+
    '<div class="muted" style="margin-top:10px">'+tjb("stats.learnedNote")+'</div></div>';
  s += '<div class="card"><h2>'+bi(T("stats.byCategory"))+'</h2>'+
    V.categories.map(function(c){
      var ws = WORDS.filter(function(w){ return w.categoryId===c.id; });
      var done = ws.filter(function(w){ var p=prog(w.id); return p && p.box>=3; }).length;
      var pct = Math.round(done/ws.length*100);
      return '<div class="sec" style="border-top-color:#eef2f6">'+
        '<div style="display:flex;justify-content:space-between;font-weight:700"><span>'+rj(c.name, c.nameRuby)+'</span>'+
        '<span>'+done+'/'+ws.length+'</span></div>'+
        '<div class="bar" style="margin-top:6px"><i style="width:'+pct+'%"></i></div></div>';
    }).join("")+'</div>';
  /* よくまちがえることば：誤答回数の多い順（卒業済みの語も含む＝傾向を見るため） */
  var missed = WORDS.filter(function(w){ var p=prog(w.id); return p && p.wrong>=2; })
    .sort(function(a,b){
      var d = prog(b.id).wrong - prog(a.id).wrong;
      return d !== 0 ? d : accuracy(prog(a.id)) - accuracy(prog(b.id));
    }).slice(0,10);
  if(missed.length){
    s += '<div class="card"><h2>'+bi(T("stats.mostMissed"))+'</h2><div class="stack">'+
      missed.map(function(w){
        return '<button class="listitem" type="button" data-word="'+w.id+'">'+
          '<span class="dot'+(prog(w.id).box?" b"+prog(w.id).box:"")+'"></span>'+
          '<span class="t"><b>'+rj(w.term, w.termRuby)+'</b>'+
          statLine([fill("stats.wrongTimes",{n:prog(w.id).wrong}),
                    Math.round(accuracy(prog(w.id))*100)+'%'])+
          '<span class="ja2">'+rj(w.easyJa, w.easyJaRuby)+'</span></span>›</button>';
      }).join("")+'</div></div>';
  }

  /* よみまちがえやすい設問の言い方（設問ドリル①の履歴から集計） */
  var stemStat = {};
  S.log.forEach(function(e){
    if(e.k !== "stem") return;
    var x = stemStat[e.id] || (stemStat[e.id] = { n:0, ng:0 });
    x.n++; if(!e.ok) x.ng++;
  });
  var stemRows = Object.keys(stemStat).filter(function(id){ return stemStat[id].ng > 0; })
    .sort(function(a,b){ return stemStat[b].ng - stemStat[a].ng; }).slice(0,5);
  if(stemRows.length){
    s += '<div class="card"><h2>'+bi(T("stats.missedStems"))+'</h2>'+
      stemRows.map(function(id){
        var stx = STEM_BY_ID[id] || {};
        return '<div class="sec" style="border-top-color:#eef2f6">'+
          '<div>'+rj(stx.ja||id, stx.jaRuby)+'</div>'+
          statLine([fill("stats.wrongTimes",{n:stemStat[id].ng}), String(stemStat[id].n)])+'</div>';
      }).join("")+'</div>';
  }
  /* まちがえたことばリスト（3回連続正解で卒業） */
  var rv = reviewWords();
  if(rv.length){
    s += '<div class="card"><h2>'+bi(T("mode.review"))+' ('+rv.length+')</h2>'+
      '<div class="muted" style="margin-bottom:10px">'+tjb("stats.reviewNote")+'</div><div class="stack">'+
      rv.slice(0,30).map(function(w){
        return '<button class="listitem" type="button" data-word="'+w.id+'">'+
          '<span class="dot"></span><span class="t"><b>'+rj(w.term, w.termRuby)+'</b>'+
          statLine([fill("stats.wrongTimes",{n:prog(w.id).wrong}),
                    fill("stats.toClear",{n:toClear(w.id)})])+
          '<span class="ja2">'+rj(w.easyJa, w.easyJaRuby)+'</span></span>›</button>';
      }).join("")+'</div></div>';
  }

  /* 学習の履歴とデータの書き出し */
  var first = S.log.length ? S.log[0].t.slice(0,10) : "";
  var lastT = S.log.length ? S.log[S.log.length-1].t.slice(0,10) : "";
  s += '<div class="card"><h2>'+bi(T("stats.history"))+'</h2>'+
    '<div class="muted">'+tjb("stats.historyCount",{n:S.log.length})+'</div>'+
    (S.log.length ? '<div class="muted">'+esc(tjnPlain("stats.historyRange",{a:first,b:lastT}))+'</div>' : '')+
    '<div class="sec"><div class="lb">'+tjb("stats.download")+'</div>'+
    '<div class="stack" style="margin-top:10px">'+
      '<button class="btn ghost" type="button" data-dl="answers"'+(S.log.length?'':' disabled')+'>'+bi(T("stats.dlAnswers"))+'</button>'+
      '<button class="btn ghost" type="button" data-dl="words">'+bi(T("stats.dlWords"))+'</button>'+
      '<button class="btn ghost" type="button" data-dl="backup">'+bi(T("stats.dlBackup"))+'</button>'+
    '</div>'+
    '<div class="muted" style="margin-top:10px">'+tjb("stats.dlNote")+'</div>'+
    '<div class="muted">'+tjb("stats.localOnly")+'</div></div>'+
    /* 書き出したデータを読み込み直す */
    '<div class="sec"><div class="lb">'+tjb("stats.restore")+'</div>'+
    '<div class="muted" style="margin:6px 0 10px">'+tjb("stats.restoreNote")+'</div>'+
    '<button class="btn ghost" type="button" id="restoreBtn">'+bi(T("stats.restorePick"))+'</button>'+
    '<input type="file" id="restoreFile" accept=".json,application/json" style="display:none">'+
    '</div></div>';

  if(EXPORT_TEXT){
    s += '<div class="card"><h2>'+esc(EXPORT_TEXT.name)+'</h2>'+
      '<div class="muted" style="margin-bottom:8px">'+tjb("stats.copyInstead")+'</div>'+
      '<textarea id="dlText" readonly>'+esc(EXPORT_TEXT.text.slice(0, 200000))+'</textarea>'+
      '<div class="row" style="margin-top:10px">'+
        '<button class="btn small ghost" type="button" id="copyBtn">'+bi(T("stats.copy"))+'</button>'+
        '<button class="btn small ghost" type="button" id="closeDl">'+bi(T("stats.close"))+'</button>'+
      '</div></div>';
  }

  s += '<button class="btn ghost" type="button" id="resetBtn">'+bi(T("stats.reset"))+'</button>';
  return s;
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll("[data-nav]").forEach(function(b){
    b.onclick = function(){ HIST = []; EXPORT_TEXT = null; screen = b.dataset.nav; window.scrollTo(0,0); render(); };
  });
  document.querySelectorAll("[data-mode]").forEach(function(b){
    b.onclick = function(){
      if(b.dataset.mode === "jitsumu"){ go("jtmenu"); return; }
      PENDING_MODE = b.dataset.mode; go("setup");
    };
  });
  document.querySelectorAll("[data-f]").forEach(function(b){
    b.onclick = function(){
      var f = b.dataset.f, v = b.dataset.v;
      FILTER[f] = (f==="subject") ? v : parseInt(v,10);
      render();
    };
  });
  var sb = document.getElementById("startBtn");
  if(sb) sb.onclick = function(){ startSession(PENDING_MODE); };

  var rb = document.getElementById("revealBtn");
  if(rb) rb.onclick = function(){ SES.revealed = true; render(); };

  document.querySelectorAll("[data-ans]").forEach(function(b){
    b.onclick = function(){
      var ok = b.dataset.ans === "1";
      var w = SES.queue[SES.i];
      record(w.id, ok, { m:SES.mode, f:"card", sel: ok ? "わかる" : "まだ" });
      if(ok) SES.right++; else SES.wrong.push(w.id);
      nextItem();
    };
  });

  document.querySelectorAll("[data-jtcat]").forEach(function(b){
    b.onclick = function(){ startJitsumu(); };
  });
  document.querySelectorAll("[data-jtmix]").forEach(function(b){
    b.onclick = function(){ var c = jtCat(b.dataset.jtmix); startChoice(c.id, c.questions, 0, true); };
  });
  document.querySelectorAll("[data-jtmiss]").forEach(function(b){
    b.onclick = function(){ var c = jtCat(b.dataset.jtmiss);
      startChoice(c.id, c.questions.filter(function(q){ var p=qp(q.id); return p && !p.lastOk; })); };
  });
  document.querySelectorAll("[data-jtch]").forEach(function(b){
    b.onclick = function(){ var v = b.dataset.jtch.split("|"), c = jtCat(v[0]);
      startChoice(c.id, c.questions.filter(function(q){ return q.chapter===v[1]; })); };
  });
  document.querySelectorAll("[data-cpick]").forEach(function(b){
    b.onclick = function(){
      if(SES.revealed) return;
      SES.picked = parseInt(b.dataset.cpick,10);
      SES.revealed = true;
      var q = SES.queue[SES.i], ok = (SES.picked+1 === q.answer);
      recordQ(q.id, ok, SES.picked+1);
      if(ok) SES.right++; else if(SES.wrongQs.indexOf(q)<0) SES.wrongQs.push(q);
      render();
    };
  });
  document.querySelectorAll("[data-jpick]").forEach(function(b){
    b.onclick = function(){
      if(SES.revealed) return;
      SES.picked = parseInt(b.dataset.jpick,10);
      SES.revealed = true;
      var e = SES.queue[SES.i], chosen = SES.choices[SES.picked], ok = !!chosen.correct;
      record(e.w.id, ok, { m:"jitsumu", f:"jt", sel:chosen.term });
      if(ok) SES.right++;
      else{
        if(SES.wrong.indexOf(e.w.id)<0) SES.wrong.push(e.w.id);
        if(SES.wrongItems.indexOf(e.it)<0) SES.wrongItems.push(e.it);
      }
      render();
    };
  });
  document.querySelectorAll("[data-pick]").forEach(function(b){
    b.onclick = function(){
      if(SES.revealed) return;
      SES.picked = parseInt(b.dataset.pick,10);
      SES.revealed = true;
      var w = SES.queue[SES.i];
      var chosen = SES.choices[SES.picked];
      var ok = !!chosen.correct;
      record(w.id, ok, { m:SES.mode,
        f: (SES.mode==="drill" ? "gap" : (SES.dir==="w2m" ? "word2meaning" : "meaning2word")),
        sel: chosen.term, gid: chosen.gid || "" });
      if(ok) SES.right++; else if(SES.wrong.indexOf(w.id)<0) SES.wrong.push(w.id);
      render();
    };
  });

  document.querySelectorAll("[data-step1]").forEach(function(b){
    b.onclick = function(){
      if(SES.revealed) return;
      SES.picked = parseInt(b.dataset.step1,10);
      SES.revealed = true;
      /* 設問の指示を読み取る問題も記録に残す（どの言い回しで間違えるかを見るため）。
         ただし1日のカウントには入れない。設問ドリルは「指示を読む→ことばを選ぶ」の
         2段階で1問なので、ここで数えると1問が2問分になり、設定した1日の目標と
         合わなくなるため。1日のカウントは2段階目（ことばを選ぶ）だけで行う。 */
      var okStem = b.dataset.v === SES.stem.want;
      logAnswer({ t:stamp(), k:"stem", id:SES.stem.id, m:"drill", f:"instruction",
                  ok:okStem?1:0, sel:b.dataset.v, gid:"", run:0 });
      save();
      render();
    };
  });
  var t2 = document.getElementById("toStep2");
  if(t2) t2.onclick = function(){ SES.step = 2; SES.revealed = false; SES.picked = null; SES.hint = 0; render(); };

  var hn = document.getElementById("hintBtn");
  if(hn) hn.onclick = function(){ SES.hint = Math.min(2, (SES.hint||0) + 1); render(); };

  var sb2 = document.getElementById("stopBtn");
  if(sb2) sb2.onclick = stopSession;
  var nb = document.getElementById("nextBtn");
  if(nb) nb.onclick = nextItem;

  var hb = document.getElementById("homeBtn");
  if(hb) hb.onclick = function(){ HIST=[]; screen="home"; window.scrollTo(0,0); render(); };
  var rt = document.getElementById("retryBtn");
  if(rt) rt.onclick = function(){
    if(SES.kind === "choice"){ HIST = ["home"]; screen = "jtmenu"; startChoice(SES.cat.id, SES.wrongQs.slice()); return; }
    if(SES.mode === "jitsumu"){ HIST = ["home"]; screen = "jtmenu"; startJitsumu(SES.wrongItems.slice()); return; }
    var ids = SES.wrong.slice(0, sessionSize("quiz"));
    SES = { mode:"quiz", queue:ids.map(function(i){return BYID[i];}), i:0, step:1,
            revealed:false, hint:0, right:0, wrong:[], stem:null, choices:null, dir:null };
    screen = "study"; window.scrollTo(0,0); render();
  };

  document.querySelectorAll("[data-word]").forEach(function(b){
    b.onclick = function(){ DETAIL = b.dataset.word; go("detail"); };
  });

  var q = document.getElementById("q");
  if(q) q.oninput = function(){
    LISTQ = q.value;
    var pos = q.selectionStart;
    render();
    var q2 = document.getElementById("q");
    if(q2){ q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} }
  };
  var fb = document.getElementById("filterBtn");
  if(fb) fb.onclick = function(){ PENDING_MODE = null; go("setup"); };

  var tb = document.getElementById("tgRuby");
  if(tb) tb.onclick = function(){ S.settings.showRuby = !S.settings.showRuby; applySize(); save(); render(); };

  var tr = document.getElementById("tgRomaji");
  if(tr) tr.onclick = function(){ S.settings.showRomaji = !S.settings.showRomaji; save(); render(); };
  var te = document.getElementById("tgEnglish");
  if(te) te.onclick = function(){ S.settings.showEnglish = !S.settings.showEnglish; save(); render(); };
  document.querySelectorAll("[data-size]").forEach(function(b){
    b.onclick = function(){ S.settings.fontSize = b.dataset.size; applySize(); save(); render(); };
  });
  document.querySelectorAll("[data-goal]").forEach(function(b){
    b.onclick = function(){ S.settings.dailyGoal = parseInt(b.dataset.goal,10); save(); render(); };
  });
  document.querySelectorAll("[data-dl]").forEach(function(b){
    b.onclick = function(){
      var kind = b.dataset.dl, n = stampName();
      if(kind === "answers") download("kaigo-answers-"+n+".csv", answersCsv(), "text/csv");
      else if(kind === "words") download("kaigo-words-summary-"+n+".csv", wordsCsv(), "text/csv");
      else download("kaigo-backup-"+n+".json", backupJson(), "application/json");
    };
  });
  var cp = document.getElementById("copyBtn");
  if(cp) cp.onclick = function(){
    var ta = document.getElementById("dlText");
    if(!ta) return;
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var done = false;
    try{ done = document.execCommand("copy"); }catch(e){}
    if(!done && navigator.clipboard){ try{ navigator.clipboard.writeText(ta.value); done = true; }catch(e){} }
    if(done) alert(T("stats.copied").ja + "\n" + T("stats.copied").en);
  };
  var cd = document.getElementById("closeDl");
  if(cd) cd.onclick = function(){ EXPORT_TEXT = null; render(); };

  /* 書き出した「すべてのデータ（JSON）」を読み込んで、いまの記録と合わせる */
  var rb = document.getElementById("restoreBtn"), rf = document.getElementById("restoreFile");
  if(rb && rf){
    function badFile(){ alert(T("stats.restoreBad").ja + "\n\n" + T("stats.restoreBad").en); }
    rb.onclick = function(){ rf.value = ""; rf.click(); };
    rf.onchange = function(){
      var f = rf.files && rf.files[0];
      if(!f) return;
      var reader = new FileReader();
      reader.onerror = badFile;
      reader.onload = function(){
        var inc = null;
        try{ inc = normalizeBackup(JSON.parse(String(reader.result))); }catch(e){ inc = null; }
        if(!inc){ badFile(); return; }
        var n = { w:Object.keys(inc.progress).length, l:inc.log.length };
        if(!confirm(tjnPlain("stats.restoreConfirm", n) + "\n\n" + enPlain("stats.restoreConfirm", n))) return;
        var r = mergeBackup(inc);
        EXPORT_TEXT = null; save(); render();
        var key = (r.w || r.l) ? "stats.restoreDone" : "stats.restoreNone";
        alert(tjnPlain(key, r) + "\n\n" + enPlain(key, r));
      };
      reader.readAsText(f);
    };
  }

  var rs = document.getElementById("resetBtn");
  if(rs) rs.onclick = function(){
    if(confirm(T("stats.resetConfirm").ja + "\n" + T("stats.resetConfirm").en)){
      S.progress = {}; S.history = []; S.log = []; S.streak = { days:0, lastDate:"" }; S.studyDates = []; S.qprog = {};
      EXPORT_TEXT = null; save(); render();
    }
  };
}

function applySize(){
  document.documentElement.setAttribute("data-size", S.settings.fontSize || "m");
  document.documentElement.setAttribute("data-ruby", S.settings.showRuby ? "1" : "0");
}

/* start */
applySize();
if(S.migrated){ delete S.migrated; save(); }
render();
})();
</script>
</body>
</html>
