の自宅を訪問する。","exampleEn":"The care manager visits the user's home at least once a month.","exampleRuby":"介護支援専門員《かいごしえんせんもんいん》は、月《つき》に1回以上利用者《かいいじょうりようしゃ》の自宅《じたく》を訪問《ほうもん》する。","exampleGapRuby":"{{GAP}}は、月《つき》に1回以上利用者《かいいじょうりようしゃ》の自宅《じたく》を訪問《ほうもん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「介護支援専門員」＝ケアマネジャー。同じ職種の別名である点に注意。","noteEn":"介護支援専門員 and ケアマネジャー are the same profession under two names.","gapTerm":"介護支援専門員","termRuby":"介護支援専門員《かいごしえんせんもんいん》","easyJaRuby":"「ケアマネジャー」の法律上《ほうりつじょう》の正式《せいしき》な名前《なまえ》","noteJaRuby":"「介護支援専門員《かいごしえんせんもんいん》」＝ケアマネジャー。同《おな》じ職種《しょくしゅ》の別名《べつめい》である点《てん》に注意《ちゅうい》。","noteEnRuby":"介護支援専門員《かいごしえんせんもんいん》 and ケアマネジャー are the same profession under two names."},{"id":"KV346","term":"特定疾病","kana":"とくていしっぺい","romaji":"tokuteishippei","english":"specified diseases","easyJa":"40歳〜64歳の人が介護保険を使えるようになる「16の特別な病気」","englishDesc":"The 16 diseases that let people aged 40–64 use the insurance.","exampleJa":"がん末期や関節リウマチは、介護保険の特定疾病に含まれる。","exampleEn":"Terminal cancer and rheumatoid arthritis are among the specified diseases.","exampleRuby":"がん末期《まっき》や関節《かんせつ》リウマチは、介護保険《かいごほけん》の特定疾病《とくていしっぺい》に含《ふく》まれる。","exampleGapRuby":"がん末期《まっき》や関節《かんせつ》リウマチは、介護保険《かいごほけん》の{{GAP}}に含《ふく》まれる。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"特定疾病は16種類。加齢に関係する病気に限られる。事故による障害は対象外。","noteEn":"There are 16, all age-related. Disability from an accident is not covered.","gapTerm":"特定疾病","termRuby":"特定疾病《とくていしっぺい》","easyJaRuby":"40歳《さい》〜64歳《さい》の人《ひと》が介護保険《かいごほけん》を使《つか》えるようになる「16の特別《とくべつ》な病気《びょうき》」","noteJaRuby":"特定疾病《とくていしっぺい》は16種類《しゅるい》。加齢《かれい》に関係《かんけい》する病気《びょうき》に限《かぎ》られる。事故《じこ》による障害《しょうがい》は対象外《たいしょうがい》。","noteEnRuby":""},{"id":"KV347","term":"通所リハビリテーション","kana":"つうしょりはびりてーしょん","romaji":"tsūshorihabiritēshon","english":"day care / outpatient rehabilitation","easyJa":"「デイケア」の正式名称（病院などに通ってリハビリをするサービス）","englishDesc":"Rehabilitation received by going to a facility in the daytime.","exampleJa":"身体機能を回復させるため、通所リハビリテーションに通う。","exampleEn":"Attend day care to recover physical function.","exampleRuby":"身体機能《しんたいきのう》を回復《かいふく》させるため、通所《つうしょ》リハビリテーションに通《かよ》う。","exampleGapRuby":"身体機能《しんたいきのう》を回復《かいふく》させるため、{{GAP}}に通《かよ》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"通所リハビリ（デイケア）は医師の指示のもとで行う。通所介護との違いが頻出。","noteEn":"Day care is provided under a doctor's direction, unlike day service. The contrast is often tested.","gapTerm":"通所リハビリテーション","termRuby":"通所《つうしょ》リハビリテーション","easyJaRuby":"「デイケア」の正式名称《せいしきめいしょう》（病院《びょういん》などに通《かよ》ってリハビリをするサービス）","noteJaRuby":"通所《つうしょ》リハビリ（デイケア）は医師《いし》の指示《しじ》のもとで行《おこな》う。通所介護《つうしょかいご》との違《ちが》いが頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV348","term":"後期高齢者医療制度","kana":"こうきこうれいしゃいりょうせいど","romaji":"kōkikōreishairyōseido","english":"medical care system for the advanced elderly","easyJa":"75歳以上の人が入る、お年寄り専用の医療保険のルール","englishDesc":"The medical insurance system for people aged 75 and over.","exampleJa":"75歳になったので、後期高齢者医療制度の対象となる。","exampleEn":"On turning 75, the person comes under the system for the advanced elderly.","exampleRuby":"75歳《さい》になったので、後期高齢者医療制度《こうきこうれいしゃいりょうせいど》の対象《たいしょう》となる。","exampleGapRuby":"75歳《さい》になったので、{{GAP}}の対象《たいしょう》となる。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"対象は原則75歳以上（一定の障害があれば65歳以上）。運営は広域連合。","noteEn":"Generally 75+, or 65+ with certain disabilities. Run by wide-area associations.","gapTerm":"後期高齢者医療制度","termRuby":"後期高齢者医療制度《こうきこうれいしゃいりょうせいど》","easyJaRuby":"75歳以上《さいいじょう》の人《ひと》が入《はい》る、お年寄《としよ》り専用《せんよう》の医療保険《いりょうほけん》のルール","noteJaRuby":"対象《たいしょう》は原則《げんそく》75歳以上《さいいじょう》（一定《いってい》の障害《しょうがい》があれば65歳以上《さいいじょう》）。運営《うんえい》は広域連合《こういきれんごう》。","noteEnRuby":""},{"id":"KV349","term":"ホームヘルパー","kana":"ほーむへるぱー","romaji":"hōmuherupā","english":"home helper","easyJa":"訪問介護員のこと（利用者の家に行く介護士）","englishDesc":"A care worker who visits homes.","exampleJa":"ホームヘルパーが掃除や洗濯などの生活援助を行う。","exampleEn":"The home helper does household support such as cleaning and laundry.","exampleRuby":"ホームヘルパーが掃除《そうじ》や洗濯《せんたく》などの生活援助《せいかつえんじょ》を行《おこな》う。","exampleGapRuby":"{{GAP}}が掃除《そうじ》や洗濯《せんたく》などの生活援助《せいかつえんじょ》を行《おこな》う。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"生活援助は「本人のため」の家事のみ。家族の分の調理・掃除は対象外。","noteEn":"Household support covers only the user's own needs, not chores for family members.","gapTerm":"ホームヘルパー","termRuby":"ホームヘルパー","easyJaRuby":"訪問介護員《ほうもんかいごいん》のこと（利用者《りようしゃ》の家《いえ》に行《い》く介護士《かいごし》）","noteJaRuby":"生活援助《せいかつえんじょ》は「本人《ほんにん》のため」の家事《かじ》のみ。家族《かぞく》の分《ぶん》の調理《ちょうり》・掃除《そうじ》は対象外《たいしょうがい》。","noteEnRuby":""},{"id":"KV350","term":"コンプライアンス","kana":"こんぷらいあんす","romaji":"konpuraiansu","english":"compliance","easyJa":"法律やルール、社会の決まりをしっかり守ること","englishDesc":"Following laws and rules in the work of an organisation.","exampleJa":"介護事業所の職員としてコンプライアンスを遵守する。","exampleEn":"As a staff member, comply with rules and laws.","exampleRuby":"介護事業所《かいごじぎょうしょ》の職員《しょくいん》としてコンプライアンスを遵守《じゅんしゅ》する。","exampleGapRuby":"介護事業所《かいごじぎょうしょ》の職員《しょくいん》として{{GAP}}を遵守《じゅんしゅ》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"コンプライアンスは法令＋倫理＋施設の規則。不適切なケアの通報も含まれる。","noteEn":"Compliance covers laws, ethics and internal rules, including reporting inappropriate care.","gapTerm":"コンプライアンス","termRuby":"コンプライアンス","easyJaRuby":"法律《ほうりつ》やルール、社会《しゃかい》の決《き》まりをしっかり守《まも》ること","noteJaRuby":"コンプライアンスは法令《ほうれい》＋倫理《りんり》＋施設《しせつ》の規則《きそく》。不適切《ふてきせつ》なケアの通報《つうほう》も含《ふく》まれる。","noteEnRuby":""},{"id":"KV351","term":"インクルージョン","kana":"いんくるーじょん","romaji":"inkurūjon","english":"inclusion","easyJa":"障害がある人もない人も、みんな一緒に社会に包み込まれる考え方","englishDesc":"A society in which no one is left out or excluded.","exampleJa":"ソーシャル・インクルージョン（社会的包摂）の理念。","exampleEn":"The principle of social inclusion.","exampleRuby":"ソーシャル・インクルージョン（社会的包摂《しゃかいてきほうせつ》）の理念《りねん》。","exampleGapRuby":"ソーシャル・{{GAP}}（社会的包摂《しゃかいてきほうせつ》）の理念《りねん》。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"インクルージョン（包摂）⇔エクスクルージョン（排除）。ノーマライゼーションと関連。","noteEn":"Inclusion ⇔ exclusion, and it is closely linked to normalisation.","gapTerm":"インクルージョン","termRuby":"インクルージョン","easyJaRuby":"障害《しょうがい》がある人《ひと》もない人《ひと》も、みんな一緒《いっしょ》に社会《しゃかい》に包《つつ》み込《こ》まれる考《かんが》え方《かた》","noteJaRuby":"インクルージョン（包摂《ほうせつ》）⇔エクスクルージョン（排除《はいじょ》）。ノーマライゼーションと関連《かんれん》。","noteEnRuby":""},{"id":"KV352","term":"基本的人権","kana":"きほんてきじんけん","romaji":"kihontekijinken","english":"fundamental human rights","easyJa":"人間として生まれながらに持っている、自由に生きるための権利","englishDesc":"The basic rights that every person has.","exampleJa":"憲法第25条で保障されている基本的人権について。","exampleEn":"About the fundamental human rights guaranteed by Article 25 of the Constitution.","exampleRuby":"憲法第《けんぽうだい》25条《じょう》で保障《ほしょう》されている基本的人権《きほんてきじんけん》について。","exampleGapRuby":"憲法第《けんぽうだい》25条《じょう》で保障《ほしょう》されている{{GAP}}について。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"憲法第25条は「健康で文化的な最低限度の生活」＝生存権。生活保護の根拠。","noteEn":"Article 25 guarantees a healthy, cultured minimum standard of living — the basis of public assistance.","gapTerm":"基本的人権","termRuby":"基本的人権《きほんてきじんけん》","easyJaRuby":"人間《にんげん》として生《う》まれながらに持《も》っている、自由《じゆう》に生《い》きるための権利《けんり》","noteJaRuby":"憲法第《けんぽうだい》25条《じょう》は「健康《けんこう》で文化的《ぶんかてき》な最低限度《さいていげんど》の生活《せいかつ》」＝生存権《せいぞんけん》。生活保護《せいかつほご》の根拠《こんきょ》。","noteEnRuby":""},{"id":"KV353","term":"保険者","kana":"ほけんじゃ","romaji":"hokenja","english":"insurer","easyJa":"保険の仕組みを運営してお金を集める人（市町村など）","englishDesc":"The body that runs an insurance system.","exampleJa":"介護保険の保険者は、市町村および特別区である。","exampleEn":"The insurers of long-term care insurance are municipalities and special wards.","exampleRuby":"介護保険《かいごほけん》の保険者《ほけんじゃ》は、市町村《しちょうそん》および特別区《とくべつく》である。","exampleGapRuby":"介護保険《かいごほけん》の{{GAP}}は、市町村《しちょうそん》および特別区《とくべつく》である。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「保険者」（運営する側）と「被保険者」（加入する人）を逆に読むミスが多い。","noteEn":"保険者 (the operator) and 被保険者 (the insured person) are easily reversed. 被 marks the passive side.","gapTerm":"保険者","termRuby":"保険者《ほけんじゃ》","easyJaRuby":"保険《ほけん》の仕組《しく》みを運営《うんえい》してお金《かね》を集《あつ》める人《ひと》（市町村《しちょうそん》など）","noteJaRuby":"「保険者《ほけんじゃ》」（運営《うんえい》する側《がわ》）と「被保険者《ひほけんしゃ》」（加入《かにゅう》する人《ひと》）を逆《ぎゃく》に読《よ》むミスが多《おお》い。","noteEnRuby":"保険者《ほけんじゃ》 (the operator) and 被保険者《ひほけんしゃ》 (the insured person) are easily reversed. 被《ひ》 marks the passive side."},{"id":"KV354","term":"ユニバーサルデザイン","kana":"ゆにばーさるでざいん","romaji":"yunibāsarudezain","english":"universal design","easyJa":"年齢や障害に関係なく、最初から「すべての人」が使いやすく作られたデザイン","englishDesc":"Design that is easy for everyone to use from the start.","exampleJa":"車いすでも使いやすいユニバーサルデザインの考え方。","exampleEn":"The idea of universal design, usable even in a wheelchair.","exampleRuby":"車《くるま》いすでも使《つか》いやすいユニバーサルデザインの考《かんが》え方《かた》。","exampleGapRuby":"車《くるま》いすでも使《つか》いやすい{{GAP}}の考《かんが》え方《かた》。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"ユニバーサルデザインは「最初から誰でも」、バリアフリーは「後から障壁を除く」。","noteEn":"Universal design is inclusive from the start; barrier-free removes barriers afterwards.","gapTerm":"ユニバーサルデザイン","termRuby":"ユニバーサルデザイン","easyJaRuby":"年齢《ねんれい》や障害《しょうがい》に関係《かんけい》なく、最初《さいしょ》から「すべての人《ひと》」が使《つか》いやすく作《つく》られたデザイン","noteJaRuby":"ユニバーサルデザインは「最初《さいしょ》から誰《だれ》でも」、バリアフリーは「後《あと》から障壁《しょうへき》を除《のぞ》く」。","noteEnRuby":""},{"id":"KV355","term":"老人福祉法","kana":"ろうじんふくしほう","romaji":"rōjinfukushihō","english":"Act on Social Welfare for the Elderly","easyJa":"高齢者の生活を守るための、日本の昔からの基本の法律","englishDesc":"The law on welfare services for older people.","exampleJa":"老人福祉法に基づく措置入所について。","exampleEn":"About admission by measure under the Act on Social Welfare for the Elderly.","exampleRuby":"老人福祉法《ろうじんふくしほう》に基《もと》づく措置入所《そちにゅうしょ》について。","exampleGapRuby":"{{GAP}}に基《もと》づく措置入所《そちにゅうしょ》について。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"1963年制定。介護保険法ができた後も、措置による入所の根拠として残っている。","noteEn":"Enacted in 1963; it still provides the basis for admission by administrative measure.","gapTerm":"老人福祉法","termRuby":"老人福祉法《ろうじんふくしほう》","easyJaRuby":"高齢者《こうれいしゃ》の生活《せいかつ》を守《まも》るための、日本《にほん》の昔《むかし》からの基本《きほん》の法律《ほうりつ》","noteJaRuby":"1963年制定《ねんせいてい》。介護保険法《かいごほけんほう》ができた後《あと》も、措置《そち》による入所《にゅうしょ》の根拠《こんきょ》として残《のこ》っている。","noteEnRuby":""},{"id":"KV356","term":"社会福祉協議会","kana":"しゃかいふくしきょうぎかい","romaji":"shakaifukushikyōgikai","english":"Council of Social Welfare","easyJa":"地域のみんなが安心して暮らせるように活動する民間の団体（社協）","englishDesc":"A private organisation that promotes community welfare.","exampleJa":"ボランティア活動について社会福祉協議会に相談する。","exampleEn":"Consult the council of social welfare about volunteer activities.","exampleRuby":"ボランティア活動《かつどう》について社会福祉協議会《しゃかいふくしきょうぎかい》に相談《そうだん》する。","exampleGapRuby":"ボランティア活動《かつどう》について{{GAP}}に相談《そうだん》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"社会福祉協議会は民間団体。日常生活自立支援事業も担う。行政機関ではない。","noteEn":"It is a private body, not a government office, and also runs the daily-life independence support programme.","gapTerm":"社会福祉協議会","termRuby":"社会福祉協議会《しゃかいふくしきょうぎかい》","easyJaRuby":"地域《ちいき》のみんなが安心《あんしん》して暮《く》らせるように活動《かつどう》する民間《みんかん》の団体《だんたい》（社協《しゃきょう》）","noteJaRuby":"社会福祉協議会《しゃかいふくしきょうぎかい》は民間団体《みんかんだんたい》。日常生活自立支援事業《にちじょうせいかつじりつしえんじぎょう》も担《にな》う。行政機関《ぎょうせいきかん》ではない。","noteEnRuby":""},{"id":"KV357","term":"アカウンタビリティ","kana":"あかうんたびりてぃ","romaji":"akauntabiriti","english":"accountability","easyJa":"専門家が利用者や家族に、自分のやったことをしっかり説明する責任","englishDesc":"The duty to explain your work and be answerable for it.","exampleJa":"介護サービスを提供する際、アカウンタビリティ（説明責任）を果たす。","exampleEn":"Fulfil accountability when providing care services.","exampleRuby":"介護《かいご》サービスを提供《ていきょう》する際《さい》、アカウンタビリティ（説明責任《せつめいせきにん》）を果《は》たす。","exampleGapRuby":"介護《かいご》サービスを提供《ていきょう》する際《さい》、{{GAP}}（説明責任《せつめいせきにん》）を果《は》たす。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"アカウンタビリティ＝説明責任。記録・情報開示とセットで問われる。","noteEn":"Accountability is tested together with record-keeping and information disclosure.","gapTerm":"アカウンタビリティ","termRuby":"アカウンタビリティ","easyJaRuby":"専門家《せんもんか》が利用者《りようしゃ》や家族《かぞく》に、自分《じぶん》のやったことをしっかり説明《せつめい》する責任《せきにん》","noteJaRuby":"アカウンタビリティ＝説明責任《せつめいせきにん》。記録《きろく》・情報開示《じょうほうかいじ》とセットで問《と》われる。","noteEnRuby":""},{"id":"KV358","term":"自助グループ","kana":"じじょぐるーぷ","romaji":"jijogurūpu","english":"self-help group","easyJa":"同じ悩みや病気を持つ人たちが集まって、お互いに助け合うグループ","englishDesc":"A group where people with the same problem support each other.","exampleJa":"アルコール依存症の患者が自助グループに参加する。","exampleEn":"A patient with alcohol dependence attends a self-help group.","exampleRuby":"アルコール依存症《いぞんしょう》の患者《かんじゃ》が自助《じじょ》グループに参加《さんか》する。","exampleGapRuby":"アルコール依存症《いぞんしょう》の患者《かんじゃ》が{{GAP}}に参加《さんか》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"自助グループは当事者同士の支え合い。専門職が指導する場ではない。","noteEn":"Self-help groups are peer support, not sessions led by professionals.","gapTerm":"自助グループ","termRuby":"自助《じじょ》グループ","easyJaRuby":"同《おな》じ悩《なや》みや病気《びょうき》を持《も》つ人《ひと》たちが集《あつ》まって、お互《たが》いに助《たす》け合《あ》うグループ","noteJaRuby":"自助《じじょ》グループは当事者同士《とうじしゃどうし》の支《ささ》え合《あ》い。専門職《せんもんしょく》が指導《しどう》する場《ば》ではない。","noteEnRuby":""},{"id":"KV359","term":"管理者","kana":"かんりしゃ","romaji":"kanrisha","english":"facility manager / administrator","easyJa":"施設や事業所の責任者（一番えらいリーダー）","englishDesc":"The person responsible for running a facility.","exampleJa":"事故が発生したため、すぐに施設の管理者に報告する。","exampleEn":"Because an accident occurred, report to the facility manager immediately.","exampleRuby":"事故《じこ》が発生《はっせい》したため、すぐに施設《しせつ》の管理者《かんりしゃ》に報告《ほうこく》する。","exampleGapRuby":"事故《じこ》が発生《はっせい》したため、すぐに施設《しせつ》の{{GAP}}に報告《ほうこく》する。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"事故発生時の報告経路（発見者→管理者→家族・市町村）を覚える。","noteEn":"Learn the reporting route: finder → manager → family and municipality.","gapTerm":"管理者","termRuby":"管理者《かんりしゃ》","easyJaRuby":"施設《しせつ》や事業所《じぎょうしょ》の責任者《せきにんしゃ》（一番《いちばん》えらいリーダー）","noteJaRuby":"事故発生時《じこはっせいじ》の報告経路《ほうこくけいろ》（発見者《はっけんしゃ》→管理者《かんりしゃ》→家族《かぞく》・市町村《しちょうそん》）を覚《おぼ》える。","noteEnRuby":""},{"id":"KV360","term":"オンブズマン","kana":"おんぶずまん","romaji":"onbuzuman","english":"ombudsman","easyJa":"利用者の代わりに苦情を聞いて、施設が正しくやっているかチェックする第三者の人","englishDesc":"An independent person who hears complaints and checks services.","exampleJa":"福祉サービスにおけるオンブズマン制度の役割。","exampleEn":"The role of the ombudsman system in welfare services.","exampleRuby":"福祉《ふくし》サービスにおけるオンブズマン制度《せいど》の役割《やくわり》。","exampleGapRuby":"福祉《ふくし》サービスにおける{{GAP}}制度《せいど》の役割《やくわり》。","categoryId":5,"category":"制度・法律・理念・職種","categoryEn":"Systems, laws, principles & professions","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"オンブズマンは第三者。事業所の職員ではない点が問われる。","noteEn":"The ombudsman is a third party, not a staff member of the provider.","gapTerm":"オンブズマン","termRuby":"オンブズマン","easyJaRuby":"利用者《りようしゃ》の代《か》わりに苦情《くじょう》を聞《き》いて、施設《しせつ》が正《ただ》しくやっているかチェックする第三者《だいさんしゃ》の人《ひと》","noteJaRuby":"オンブズマンは第三者《だいさんしゃ》。事業所《じぎょうしょ》の職員《しょく Ruby":"「社会保障《しゃかいほしょう》」「人権《じんけん》を保障《ほしょう》する」は保障《ほしょう》。「品質保証《ひんしつほしょう》」は保証《ほしょう》、「損害補償《そんがいほしょう》」は補償《ほしょう》。","pointEnRuby":"社会保障《しゃかいほしょう》 and 人権《じんけん》を保障《ほしょう》する use 保障《ほしょう》; 品質保証《ひんしつほしょう》 uses 保証《ほしょう》; 損害補償《そんがいほしょう》 uses 補償《ほしょう》."},{"id":"CF002","type":"homophone","typeJa":"同音異義","typeEn":"Same sound, different kanji","members":[{"term":"適用","kana":"てきよう","glossJa":"制度やルールを当てはめること","glossEn":"to apply a rule or system","vocabId":null,"inVocab":false,"termRuby":"適用《てきよう》","glossJaRuby":"制度《せいど》やルールを当《あ》てはめること"},{"term":"適応","kana":"てきおう","glossJa":"環境に合わせて慣れること","glossEn":"to adapt to an environment","vocabId":null,"inVocab":false,"termRuby":"適応《てきおう》","glossJaRuby":"環境《かんきょう》に合《あ》わせて慣《な》れること"}],"pointJa":"制度は「適用」、環境への慣れは「適応」。読みも「てきよう／てきおう」で違う。","pointEn":"Systems are 適用; adapting to surroundings is 適応. The readings differ too.","typeJaRuby":"同音異義《どうおんいぎ》","pointJaRuby":"制度《せいど》は「適用《てきよう》」、環境《かんきょう》への慣《な》れは「適応《てきおう》」。読《よ》みも「てきよう／てきおう」で違《ちが》う。","pointEnRuby":"Systems are 適用《てきよう》; adapting to surroundings is 適応《てきおう》. The readings differ too."},{"id":"CF003","type":"homophone","typeJa":"同音異義","typeEn":"Same sound, different kanji","members":[{"term":"過程","kana":"かてい","glossJa":"物事が進む道すじ","glossEn":"the process something goes through","vocabId":"KV030","inVocab":true,"termRuby":"過程《かてい》","glossJaRuby":"物事《ものごと》が進《すす》む道《みち》すじ"},{"term":"課程","kana":"かてい","glossJa":"学校などの学習コース","glossEn":"a course of study","vocabId":null,"inVocab":false,"termRuby":"課程《かてい》","glossJaRuby":"学校《がっこう》などの学習《がくしゅう》コース"}],"pointJa":"「介護過程」は道すじの過程。学校の「教育課程」は課程。","pointEn":"介護過程 uses 過程 (process); school courses use 課程.","typeJaRuby":"同音異義《どうおんいぎ》","pointJaRuby":"「介護過程《かいごかてい》」は道《みち》すじの過程《かてい》。学校《がっこう》の「教育課程《きょういくかてい》」は課程《かてい》。","pointEnRuby":"介護過程《かいごかてい》 uses 過程《かてい》 (process); school courses use 課程《かてい》."},{"id":"CF004","type":"homophone","typeJa":"同音異義","typeEn":"Same sound, different kanji","members":[{"term":"自立","kana":"じりつ","glossJa":"自分の力で生活すること","glossEn":"living by one's own ability","vocabId":"KV164","inVocab":true,"termRuby":"自立《じりつ》","glossJaRuby":"自分《じぶん》の力《ちから》で生活《せいかつ》すること"},{"term":"自律","kana":"じりつ","glossJa":"自分で決めて行動すること","glossEn":"deciding and acting for oneself","vocabId":null,"inVocab":false,"termRuby":"自律《じりつ》","glossJaRuby":"自分《じぶん》で決《き》めて行動《こうどう》すること"}],"pointJa":"介護保険の理念は「自立支援」。自分で決める力は「自律」。","pointEn":"The insurance principle is 自立支援. The power to decide for oneself is 自律.","typeJaRuby":"同音異義《どうおんいぎ》","pointJaRuby":"介護保険《かいごほけん》の理念《りねん》は「自立支援《じりつしえん》」。自分《じぶん》で決《き》める力《ちから》は「自律《じりつ》」。","pointEnRuby":"The insurance principle is 自立支援《じりつしえん》. The power to decide for oneself is 自律《じりつ》."},{"id":"CF005","type":"homophone","typeJa":"同音異義","typeEn":"Same sound, different kanji","members":[{"term":"意向","kana":"いこう","glossJa":"本人がどうしたいかという希望","glossEn":"what the person wishes to do","vocabId":"KV044","inVocab":true,"termRuby":"意向《いこう》","glossJaRuby":"本人《ほんにん》がどうしたいかという希望《きぼう》"},{"term":"移行","kana":"いこう","glossJa":"別の状態へ移り変わること","glossEn":"shifting to another state","vocabId":null,"inVocab":false,"termRuby":"移行《いこう》","glossJaRuby":"別《べつ》の状態《じょうたい》へ移《うつ》り変《か》わること"}],"pointJa":"「本人の意向を確認する」は希望の意向。制度が変わるのは移行。","pointEn":"本人の意向 means wishes; a system changing is 移行.","typeJaRuby":"同音異義《どうおんいぎ》","pointJaRuby":"「本人《ほんにん》の意向《いこう》を確認《かくにん》する」は希望《きぼう》の意向《いこう》。制度《せいど》が変《か》わるのは移行《いこう》。","pointEnRuby":"本人《ほんにん》の意向《いこう》 means wishes; a system changing is 移行《いこう》."},{"id":"CF006","type":"homophone","typeJa":"同音異義","typeEn":"Same sound, different kanji","members":[{"term":"衛生","kana":"えいせい","glossJa":"清潔を保って健康を守ること","glossEn":"keeping things clean and healthy","vocabId":null,"inVocab":false,"termRuby":"衛生《えいせい》","glossJaRuby":"清潔《せいけつ》を保《たも》って健康《けんこう》を守《まも》ること"},{"term":"衛星","kana":"えいせい","glossJa":"惑星のまわりを回る星","glossEn":"a satellite in space","vocabId":null,"inVocab":false,"termRuby":"衛星《えいせい》","glossJaRuby":"惑星《わくせい》のまわりを回《まわ》る星《ほし》"}],"pointJa":"「手指衛生」「衛生管理」は生（せい）の字。字形が近いので書き分けに注意。","pointEn":"手指衛生 and 衛生管理 use 生, not 星. The characters look alik <script>window.APP_LITERALS = {"戻る":"戻《もど》る","学習をやめますか。":"学習《がくしゅう》をやめますか。","この設問は「正しいもの・適切なもの」を1つ選びます。":"この設問《せつもん》は「正《ただ》しいもの・適切《てきせつ》なもの」を1つ選《えら》びます。","この設問は「まちがっているもの」を1つ選びます。文の終わりまで必ず読みましょう。":"この設問《せつもん》は「まちがっているもの」を1つ選《えら》びます。文《ぶん》の終《お》わりまで必《かなら》ず読《よ》みましょう。","回":"回《かい》","小":"小《ちい》","中":"中《なか》","大":"大《おお》","介護のことば":"介護《かいご》のことば","語":"語《ご》"};</script>
<script>
(function(){
"use strict";

/* ---------- ホーム画面にインストールできるようにする ----------
   https で開いたときだけ manifest と service worker をつなぐ。
   1ファイルのまま file:// で開いた場合は何もしないので、
   これまでどおりファイルを配る使い方も変わらない。
   Install support is wired up only on http(s); opening the single file
   directly (file://) keeps working exactly as before. */
(function installable(){
  var p = location.protocol;
  if(p !== "https:" && p !== "http:") return;
  function link(rel, href, extra){
    var el = document.createElement("link");
    el.rel = rel; el.href = href;
    if(extra) for(var k in extra) el.setAttribute(k, extra[k]);
    document.head.appendChild(el);
  }
  link("manifest", "manifest.webmanifest");
  link("icon", "icon-192.png", { sizes:"192x192", type:"image/png" });
  link("apple-touch-icon", "apple-touch-icon.png");
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();

var V = window.VOCAB_DATA, CF = window.CONFUSABLES, UI = window.UI_STRINGS;
var WORDS = V.words, BYID = {};
WORDS.forEach(function(w){ BYID[w.id] = w; });
var GROUPS = {};
CF.groups.forEach(function(g){ GROUPS[g.id] = g; });
/* カテゴリ・試験科目・難易度の表示名 → ふりがな付き */
var LABEL_RUBY = {};
V.categories.forEach(function(c){ LABEL_RUBY[c.name] = c.nameRuby; });
V.subjects.forEach(function(x){ LABEL_RUBY[x.name] = x.nameRuby; });
V.levels.forEach(function(l){ LABEL_RUBY[l.label] = l.labelRuby; });
function lab(name){ return rj(name, LABEL_RUBY[name]); }

/* ---------- storage ---------- */
var KEY = "kaigoWords.v1";
var LOG_MAX = 20000;              /* 解答履歴の上限。超えたら古いものから捨てる */
var REVIEW_CLEAR = 3;             /* 何回連続で正解したら「まちがえたことば」から外すか */
var DEF = { version:2,
  settings:{ showRuby:true, showRomaji:true, showEnglish:true, fontSize:"m", dailyGoal:10 },
  progress:{}, log:[], history:[], streak:{ days:0, lastDate:"" } };
var S = load();
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    var o = JSON.parse(raw);
    var d = JSON.parse(JSON.stringify(DEF));
    o.settings = Object.assign(d.settings, o.settings||{});
    o.progress = o.progress||{}; o.history = o.history||[]; o.streak = o.streak||d.streak;
    o.log = o.log||[];
    if(!o.version || o.version < 2){          /* v1 → v2 移行 */
      for(var k in o.progress){
        var q = o.progress[k];
        if(q.run === undefined) q.run = 0;
        if(q.inReview === undefined) q.inReview = (q.wrong > 0 && q.correct < q.seen);
        if(!q.first) q.first = q.last || "";
      }
      o.version = 2;
      o.migrated = true;      /* 読み込み後すぐ保存して移行を確定させる */
    }
    return o;
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return n<10?"0"+n:""+n; }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

/* ---------- i18n helpers ---------- */
function T(path){
  var o = UI, p = path.split(".");
  for(var i=0;i<p.length;i++){ if(!o) return {ja:path,en:""}; o = o[p[i]]; }
  return o || {ja:path,en:""};
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 《》記法をふりがな付きHTMLに変換する。設定がオフのときは《》を取り除くだけ。 */
function ruby(str){
  var out = "", i = 0, re = /([\u4e00-\u9fff\u3005]+)\u300a([^\u300b]+)\u300b/g, m;
  while((m = re.exec(str))){
    out += esc(str.slice(i, m.index));
    out += S.settings.showRuby
      ? "<ruby>" + esc(m[1]) + "<rt>" + esc(m[2]) + "</rt></ruby>"
      : esc(m[1]);
    i = m.index + m[0].length;
  }
  out += esc(str.slice(i));
  return out;
}
function rubyCls(){ return S.settings.showRuby ? " hasruby" : ""; }
/* 日本語をふりがな付きで描く。ruby版がなければそのまま表示する。 */
function rj(plain, rubyStr){ return ruby(rubyStr || plain || ""); }
/* 画面文言（ui_strings.json）の日本語 */
function tj(path){ var o = T(path); return rj(o.ja, o.jaRuby); }
/* {n} などの差し込みがある文言。ふりがな側にも同じ差し替えをかける。 */
function tjn(path, map){
  var o = T(path), ja = o.ja, jr2 = o.jaRuby || o.ja;
  for(var k in map){
    ja = ja.split("{"+k+"}").join(map[k]);
    jr2 = jr2.split("{"+k+"}").join(map[k]);
  }
  return rj(ja, jr2);
}
function tjnPlain(path, map){
  var o = T(path), ja = o.ja;
  for(var k in map) ja = ja.split("{"+k+"}").join(map[k]);
  return ja;
}
/* alert / confirm 用の英文（ふりがなを入れられないため素のまま使う） */
function enPlain(path, map){
  var en = T(path).en || "";
  for(var k in map) en = en.split("{"+k+"}").join(map[k]);
  return en;
}
/* {n} などの差し込みを、日本語・ふりがな・英語のすべてに同じように入れて返す。
   Fills {n}-style placeholders in the Japanese, the furigana and the English alike. */
function fill(path, map){
  var o = T(path), ja = o.ja, jr = o.jaRuby || o.ja, en = o.en || "";
  for(var k in map){
    var v = String(map[k]);
    ja = ja.split("{"+k+"}").join(v);
    jr = jr.split("{"+k+"}").join(v);
    en = en.split("{"+k+"}").join(v);
  }
  return { ja:ja, jaRuby:jr, en:en };
}
/* お知らせ文は必ず日英で出す。設定「英語を見せる」がオフのときは日本語だけになる。
   Notices are always bilingual (English hidden only by the "show English" setting). */
function tjb(path, map){ return bi(map ? fill(path, map) : T(path)); }
/* 「まちがえ3回 / あと2回」のような数つきの表示。日本語の下に英語をもう1行出す。
   parts は fill() の戻り値か、そのまま出す文字列（％など）。 */
function statLine(parts){
  var ja = parts.map(function(p){
    return typeof p === "string" ? esc(p) : rj(p.ja, p.jaRuby);
  }).join(" / ");
  var out = '<span class="en">'+ja+'</span>';
  if(S.settings.showEnglish){
    var en = parts.map(function(p){
      return typeof p === "string" ? esc(p) : esc(p.en || p.ja);
    }).join(" / ");
    out += '<span class="en">'+en+'</span>';
  }
  return out;
}
/* アプリのコードに直接書いた日本語（ふりがなは app_literals.json） */
function L(text){ return rj(text, (window.APP_LITERALS || {})[text]); }

function bi(o, cls){
  if(!o) return "";
  var en = S.settings.showEnglish && o.en ? '<span class="en">'+esc(o.en)+'</span>' : "";
  return '<span class="'+(cls||"")+'">'+rj(o.ja, o.jaRuby)+en+'</span>';
}
function biRaw(ja, en, cls){ return bi({ja:ja,en:en}, cls); }
/* 問題文・選択肢の英訳は、答える前には出さない。
   English for the question content is withheld until the learner answers
   (or deliberately asks for it with the hint button). */
function qEn(){
  if(!S.settings.showEnglish) return false;
  if(!SES) return true;
  return !!(SES.revealed || SES.hint);
}

/* ---------- Leitner ---------- */
var INTERVAL = [0,1,3,7,21];
function prog(id){ return S.progress[id]; }
/* 解答を1件ぶん履歴に残す。ことばの問題も、設問の指示を読む問題も同じ形で残す。 */
function logAnswer(rec){
  S.log.push(rec);
  if(S.log.length > LOG_MAX) S.log = S.log.slice(-LOG_MAX);
}
function stamp(){
  var d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
         pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
function record(id, correct, info){
  info = info || {};
  var p = S.progress[id] || { box:0, seen:0, correct:0, wrong:0, run:0,
                              inReview:false, first:"", last:"", due:"" };
  if(!p.first) p.first = today();
  p.seen++;
  if(correct){
    p.correct++; p.box = Math.min(4, p.box+1); p.run = (p.run||0) + 1;
    /* 「まちがえたことば」は、正解が REVIEW_CLEAR 回つづいたら自動で外れる */
    if(p.inReview && p.run >= REVIEW_CLEAR) p.inReview = false;
  } else {
    p.wrong++; p.box = p.box >= 2 ? 1 : 0; p.run = 0; p.inReview = true;
  }
  p.last = today();
  p.due = addDays(INTERVAL[p.box]);
  S.progress[id] = p;
  logAnswer({ t:stamp(), k:"word", id:id, m:info.m||"", f:info.f||"",
              ok:correct?1:0, sel:info.sel||"", gid:info.gid||"", run:p.run });
  var h = S.history[S.history.length-1];
  if(!h || h.date !== today()){ h = { date:today(), answered:0, correct:0 }; S.history.push(h); }
  h.answered++; if(correct) h.correct++;
  if(S.history.length > 90) S.history = S.history.slice(-90);
  if(S.streak.lastDate !== today()){
    S.streak.days = (S.streak.lastDate === addDays(-1)) ? S.streak.days+1 : 1;
    S.streak.lastDate = today();
  }
  save();
}
function accuracy(p){ return p && p.seen ? p.correct/p.seen : 0; }
/* 「まちがえたことば」リストに入っているか */
function inReview(id){ var p = prog(id); return !!(p && p.inReview); }
function reviewWords(){ return WORDS.filter(function(w){ return inReview(w.id); }); }
/* あと何回連続で正解すればリストから外れるか */
function toClear(id){ var p = prog(id); return Math.max(0, REVIEW_CLEAR - ((p && p.run) || 0)); }

/* ---------- データの書き出し ---------- */
var MODE_JA = { card:"カードでおぼえる", quiz:"4つからえらぶ", drill:"設問を読む", review:"まちがえたことば" };
var FORM_JA = { card:"カード", word2meaning:"ことば→意味", meaning2word:"意味→ことば",
                gap:"空欄補充", instruction:"設問の指示" };
var STEM_BY_ID = {};
(window.EXAM_STEMS.stems||[]).forEach(function(x){ STEM_BY_ID[x.id] = x; });

function cq(v){
  v = (v==null) ? "" : String(v);
  return /[",\n\r]/.test(v) ? '"' + v.split('"').join('""') + '"' : v;
}
function toCsv(rows){
  return "\ufeff" + rows.map(function(r){ return r.map(cq).join(","); }).join("\r\n") + "\r\n";
}
/* 解答1件ごとの履歴 */
function answersCsv(){
  var rows = [["日時","種別","ID","見出し語・設問文","ふりがな","カテゴリ","試験科目","難易度",
               "学習モード","出題形式","正誤","選んだ答え","混同グループ","連続正解"]];
  S.log.forEach(function(e){
    if(e.k === "stem"){
      var st = STEM_BY_ID[e.id] || {};
      rows.push([e.t, "設問の指示", e.id, st.ja||"", "", "", "", "",
                 MODE_JA[e.m]||e.m, FORM_JA[e.f]||e.f, e.ok?"正解":"誤答",
                 e.sel==="correct"?"正しいもの":(e.sel==="incorrect"?"まちがっているもの":e.sel), "", ""]);
    } else {
      var w = BYID[e.id] || {};
      rows.push([e.t, "ことば", e.id, w.term||"", w.kana||"", w.category||"", w.subject||"",
                 w.levelLabel||"", MODE_JA[e.m]||e.m, FORM_JA[e.f]||e.f,
                 e.ok?"正解":"誤答", e.sel||"", e.gid||"", e.run==null?"":e.run]);
    }
  });
  return toCsv(rows);
}
/* ことばごとの集計 */
function wordsCsv(){
  var rows = [["ID","見出し語","ふりがな","ローマ字","カテゴリ","試験科目","難易度",
               "出題回数","正解数","誤答数","正解率","連続正解","まちがえたことばリスト",
               "定着度(box)","初回学習日","最終学習日","次回出題日"]];
  WORDS.forEach(function(w){
    var p = prog(w.id);
    if(!p) return;
    rows.push([w.id, w.term, w.kana, w.romaji, w.category, w.subject, w.levelLabel,
               p.seen, p.correct, p.wrong, Math.round(accuracy(p)*100)+"%",
               p.run||0, p.inReview ? "入っている" : "なし",
               p.box, p.first||"", p.last||"", p.due||""]);
  });
  return toCsv(rows);
}
function backupJson(){ return JSON.stringify(S, null, 1); }

var EXPORT_TEXT = null;   /* ダウンロードできない端末向けの控え */
function download(name, text, mime){
  try{
    var blob = new Blob([text], { type: mime + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }catch(e){}
  EXPORT_TEXT = { name:name, text:text };
  render();
}
/* ---------- 保存データの読み込み（復元） ----------
   書き出した「すべてのデータ（JSON）」を、いまの記録と合わせて取り込む。
   数えた回数は多いほうを残し、今の状態（box・連続正解・リスト在否）は
   日付が新しいほうを採る。設定は端末のものをそのまま使う。
   Merging a backup: counts keep the larger value, the current state comes
   from whichever side is newer, and the device's own settings are untouched. */
function normalizeBackup(o){
  if(!o || typeof o !== "object" || !o.progress || typeof o.progress !== "object") return null;
  if(!Array.isArray(o.log)) o.log = [];
  if(!Array.isArray(o.history)) o.history = [];
  if(!o.streak || typeof o.streak !== "object") o.streak = { days:0, lastDate:"" };
  if(!o.version || o.version < 2){        /* 古い形式(v1)のファイルも取り込めるようにする */
    for(var k in o.progress){
      var q = o.progress[k];
      if(q.run === undefined) q.run = 0;
      if(q.inReview === undefined) q.inReview = (q.wrong > 0 && q.correct < q.seen);
      if(!q.first) q.first = q.last || "";
    }
    o.version = 2;
  }
  return o;
}
/* 同じ解答を二重に数えないための見分け方 */
function logKey(e){ return [e.t, e.k||"", e.id||"", e.f||"", e.sel||""].join(""); }
/* ことばごとの記録を、項目の順番までそろえた形にする（比べられるようにするため） */
function progShape(q){
  q = q || {};
  return { seen:q.seen||0, correct:q.correct||0, wrong:q.wrong||0, box:q.box||0,
           run:q.run||0, inReview:!!q.inReview, first:q.first||"", last:q.last||"", due:q.due||"" };
}
function mergeBackup(inc){
  var changedWords = 0, addedLogs = 0;

  for(var id in inc.progress){
    var had = !!S.progress[id];
    var a = progShape(S.progress[id]), b = progShape(inc.progress[id]);
    /* 今の状態（box・連続正解・リスト在否）は、日付が新しいほうから採る */
    var newer = !had ? b : ((b.last||"") > (a.last||"") ? b : a);
    var m = {
      seen:    Math.max(a.seen||0,    b.seen||0),
      correct: Math.max(a.correct||0, b.correct||0),
      wrong:   Math.max(a.wrong||0,   b.wrong||0),
      box:     Math.max(a.box||0,     b.box||0),
      run:      newer.run || 0,
      inReview: !!newer.inReview,
      first: [a.first, b.first].filter(Boolean).sort()[0] || "",
      last:  (a.last||"") > (b.last||"") ? a.last : (b.last||""),
      due:   newer.due || ""
    };
    /* 出題回数が正解数＋誤答数を下回らないようにそろえる */
    if(m.correct + m.wrong > m.seen) m.seen = m.correct + m.wrong;
    if(JSON.stringify(m) !== JSON.stringify(a)) changedWords++;
    S.progress[id] = m;
  }

  var have = {};
  S.log.forEach(function(e){ have[logKey(e)] = 1; });
  inc.log.forEach(function(e){
    var k = logKey(e);
    if(have[k]) return;
    have[k] = 1; S.log.push(e); addedLogs++;
  });
  S.log.sort(function(x, y){ return (x.t||"") < (y.t||"") ? -1 : (x.t||"") > (y.t||"") ? 1 : 0; });
  if(S.log.length > LOG_MAX) S.log = S.log.slice(-LOG_MAX);

  var byDate = {};
  S.history.forEach(function(h){ byDate[h.date] = { date:h.date, answered:h.answered||0, correct:h.correct||0 }; });
  inc.history.forEach(function(h){
    if(!h || !h.date) return;
    var cur = byDate[h.date];
    if(!cur) byDate[h.date] = { date:h.date, answered:h.answered||0, correct:h.correct||0 };
    else { cur.answered = Math.max(cur.answered, h.answered||0);
           cur.correct  = Math.max(cur.correct,  h.correct||0); }
  });
  S.history = Object.keys(byDate).sort().map(function(d){ return byDate[d]; }).slice(-90);

  var si = inc.streak || {};
  if((si.lastDate||"") > (S.streak.lastDate||"")) S.streak = { days:si.days||0, lastDate:si.lastDate||"" };
  else if((si.lastDate||"") === (S.streak.lastDate||"")) S.streak.days = Math.max(S.streak.days||0, si.days||0);

  return { w:changedWords, l:addedLogs };
}

function stampName(){
  var d = new Date();

/* ---------- filtering & queue ---------- */
var FILTER = { cat:0, subject:"", level:0 };
function filtered(){
  return WORDS.filter(function(w){
    if(FILTER.cat && w.categoryId !== FILTER.cat) return false;
    if(FILTER.subject && w.subject !== FILTER.subject) return false;
    if(FILTER.level && w.level !== FILTER.level) return false;
    return true;
  });
}
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function gapKey(w){
  if(w.exampleJa.indexOf(w.term) >= 0) return w.term;
  var s = w.term.replace(/(する|な)$/,"");
  return w.exampleJa.indexOf(s) >= 0 ? s : null;
}
function buildQueue(mode, n){
  var pool = filtered();
  if(mode === "drill") pool = pool.filter(function(w){ return !!w.exampleGapRuby; });
  if(mode === "review"){
    pool = pool.filter(function(w){ return inReview(w.id); });
    pool.sort(function(a,b){ return accuracy(prog(a.id)) - accuracy(prog(b.id)); });
    return pool.slice(0, n);
  }
  var t = today(), due=[], fresh=[], weak=[], rest=[];
  pool.forEach(function(w){
    var p = prog(w.id);
    if(!p) fresh.push(w);
    else if(p.due && p.due <= t) due.push(w);
    else if(accuracy(p) < 0.6) weak.push(w);
    else rest.push(w);
  });
  return shuffle(due).concat(shuffle(fresh), shuffle(weak), shuffle(rest)).slice(0, n);
}

/* ---------- distractors ---------- */
function asOpt(x){
  if(x.id) return { term:x.term, termRuby:x.termRuby, kana:x.kana, mJa:x.easyJa,
                    mJaRuby:x.easyJaRuby, mEn:x.englishDesc, id:x.id, gid:null };
  return { term:x.term, termRuby:x.termRuby, kana:x.kana, mJa:x.glossJa,
           mJaRuby:x.glossJaRuby, mEn:x.glossEn, id:null, gid:x.__gid };
}
function makeChoices(word){
  var picked = [], used = {};
  used[word.term] = 1;
  var pool = [];
  (CF.index[word.id]||[]).forEach(function(gid){
    GROUPS[gid].members.forEach(function(m){
      if(m.term !== word.term && !used[m.term]){
        var c = JSON.parse(JSON.stringify(m)); c.__gid = gid; pool.push(c);
      }
    });
  });
  shuffle(pool).forEach(function(m){
    if(picked.length < 2 && !used[m.term]){ used[m.term]=1; picked.push(asOpt(m)); }
  });
  function fill(list){
    shuffle(list).forEach(function(w){
      if(picked.length < 3 && !used[w.term]){ used[w.term]=1; picked.push(asOpt(w)); }
    });
  }
  fill(WORDS.filter(function(w){ return w.id!==word.id && w.categoryId===word.categoryId && w.level===word.level; }));
  if(picked.length < 3) fill(WORDS.filter(function(w){ return w.id!==word.id && w.categoryId===word.categoryId; }));
  if(picked.length < 3) fill(WORDS.filter(function(w){ return w.id!==word.id; }));
  var ans = asOpt(word); ans.correct = true;
  return shuffle([ans].concat(picked));
}

/* 1回の学習で出す数。3つの学習モードとも、設定の「1日の目標」の数をそのまま使う。
   （設問ドリルは1問が2段階＝指示を読む→ことばを選ぶ、だが「1問」として数える。
     2段階目の正誤だけを1日のカウントに入れるので、10問やれば目標10に届く。） */
function sessionSize(mode){
  var g = parseInt(S.settings.dailyGoal, 10);
  if(!g || g < 1) g = 10;
  return g;
}
function startSession(mode){
  var n = sessionSize(mode);
  var q = buildQueue(mode, n);
  if(!q.length){ alert(T("msg.empty").ja + "\n" + T("msg.empty").en); return; }
  SES = { mode:mode, queue:q, i:0, step:1, revealed:false, hint:false, right:0, wrong:[],
          stem:null, choices:null, dir:null };
  go("study");
}
function nextItem(){
  SES.i++; SES.revealed=false; SES.step=1; SES.choices=null; SES.stem=null; SES.hint=false;
  if(SES.i >= SES.queue.length) go("result"); else render();
}

  var ok = picked && picked.correct;
  var s = '<div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"○ ":"✕ ")+
    tj(ok?"quiz.correct":"quiz.wrong")+

       '<div class="lb muted" style="font-weight:800">'+tj("quiz.answerWas")+'</div>'+
       '<div class="term" style="font-size:1.5em">'+rj(w.term, w.termRuby)+'</div>'+
       '<div class="kana">'+(S.settings.showRuby ? '' : esc(w.kana)+(S.settings.showRomaji?' / ':''))+
       (S.settings.showRomaji?'<i>'+esc(w.romaji)+'</i>':'')+'</div>'+
       '<div style="margin-top:8px;font-weight:700">'+rj(w.easyJa, w.easyJaRuby)+'</div>'+
       (S.settings.showEnglish?'<div class="en">'+esc(w.englishDesc)+'</div>':'')+
       '<div class="sec"><div class="ex'+rubyCls()+'">'+ruby(w.exampleRuby)+
       (S.settings.showEnglish?'<span class="en">'+esc(w.exampleEn)+'</span>':'')+'</div></div>';
  var g = (!ok && picked && picked.gid) ? GROUPS[picked.gid] : null;
  if(g){
    s += '<div class="sec"><div class="lb">'+tj("quiz.whyWrong")+
      (S.settings.showEnglish?' <span class="en">'+esc(T("quiz.whyWrong").en)+'</span>':'')+'</div>'+
      '<div class="note"><b>'+rj(picked.term, picked.termRuby)+'</b>：'+rj(picked.mJa, picked.mJaRuby)+
      (S.settings.showEnglish?'<span class="en">'+esc(picked.mEn)+'</span>':'')+
      '<div style="margin-top:8px">'+rj(g.pointJa, g.pointJaRuby)+
      (S.settings.showEnglish?'<span class="en">'+rj(g.pointEn, g.pointEnRuby)+'</span>':'')+'</div></div></div>';
  }else{
    s += '<div class="sec"><div class="lb">'+tj("card.note")+'</div>'+
      '<div class="note">'+rj(w.noteJa, w.noteJaRuby)+
      (S.settings.showEnglish?'<span class="en">'+rj(w.noteEn, w.noteEnRuby)+'</span>':'')+'</div></div>';
  }
  s += '</div><button class="btn primary" type="button" id="nextBtn">'+
    bi(T(SES.i === SES.queue.length-1 ? "quiz.finish" : "card.next"))+'</button>';
  return s;
}

function vResult(){
  var n = SES.queue.length, r = SES.right;
  var pct = Math.round(r/n*100);
  var s = '<div class="card center">'+
    '<div class="muted">'+tj("quiz.score")+'</div>'+
    '<div class="term" style="font-size:2.6em">'+r+' / '+n+'</div>'+
    '<div class="bar" style="margin-top:10px"><i style="width:'+pct+'%"></i></div>'+
    '<div class="muted" style="margin-top:8px">'+pct+'%</div></div>';
  if(SES.wrong.length){
    s += '<div class="card"><h2>'+bi(T("stats.weakWords"))+'</h2><div class="stack">'+
      SES.wrong.map(function(id){ var w = BYID[id];
        return '<button class="listitem" type="button" data-word="'+w.id+'">'+
          '<span class="dot"></span><span class="t"><b>'+rj(w.term, w.termRuby)+'</b>'+
          '<span class="en kana-dup">'+esc(w.kana)+'</span><span class="ja2">'+rj(w.easyJa, w.easyJaRuby)+'</span></span>›</button>';
      }).join("")+'</div></div>';
    s += '<button class="btn ghost" type="button" id="retryBtn">'+bi(T("quiz.retryWrong"))+'</button>';
  }
  s += '<button class="btn primary" type="button" id="homeBtn">'+bi(T("nav.home"))+'</button>';
  return s;
}

var LISTQ = "";
function vList(){
  var q = LISTQ.trim().toLowerCase();
  var rows = filtered().filter(function(w){
    if(!q) return true;
    return (w.term+w.kana+w.romaji+w.english+w.easyJa+w.englishDesc).toLowerCase().indexOf(q) >= 0;
  });
  var s = '<input type="search" id="q" placeholder="ことば・romaji・English" value="'+esc(LISTQ)+'">'+
    '<button class="btn ghost" type="button" id="filterBtn">'+bi(T("filter.category"))+' ・ '+
    tj("filter.level")+'（'+filtered().length+'）</button>'+
    '<div class="muted">'+rows.length+' '+tj("filter.count")+'</div>';
  s += '<div class="stack">'+ rows.slice(0,300).map(function(w){
    var p = prog(w.id);
    return '<button class="listitem" type="button" data-word="'+w.id+'">'+
      '<span class="dot'+(p&&p.box?" b"+p.box:"")+'"></span>'+
      '<span class="t"><b>'+rj(w.term, w.termRuby)+'</b><span class="en">'+esc(w.kana)+'</span>'+
      '<span class="ja2">'+rj(w.easyJa, w.easyJaRuby)+'</span></span>›</button>';
  }).join("")+'</div>';
  if(rows.length > 300) s += '<div class="muted center">… '+(rows.length-300)+' more</div>';
  if(!rows.length) s += '<div class="card">'+bi(T("msg.empty"))+'</div>';
  return s;
}

var DETAIL = null;
function vDetail(){
  var w = BYID[DETAIL];
  var p = prog(w.id);
  var s = '<div class="card">'+wordBody(w,{full:true})+'</div>';
  var gids = CF.index[w.id] || [];
  if(gids.length){
    s += gids.map(function(gid){ var g = GROUPS[gid];
      return '<div class="card"><h2>'+rj(g.typeJa, g.typeJaRuby)+
        (S.settings.showEnglish?'<span class="en">'+esc(g.typeEn)+'</span>':'')+'</h2>'+
        g.members.map(function(m){
          return '<div class="sec" style="border-top-color:#eef2f6"><b>'+rj(m.term, m.termRuby)+'</b> <span class="kana kana-dup">'+esc(m.kana)+'</span>'+
            '<div>'+rj(m.glossJa, m.glossJaRuby)+'</div>'+
            (S.settings.showEnglish?'<div class="en">'+esc(m.glossEn)+'</div>':'')+'</div>';
        }).join("")+
        '<div class="sec"><div class="note">'+rj(g.pointJa, g.pointJaRuby)+
        (S.settings.showEnglish?'<span class="en">'+rj(g.pointEn, g.pointEnRuby)+'</span>':'')+'</div></div></div>';
    }).join("");
  }
  if(p){
    s += '<div class="card"><div class="kpi">'+
      '<div><b>'+p.seen+'</b><span>'+L("回")+'</span></div>'+
      '<div><b>'+Math.round(accuracy(p)*100)+'%</b><span>'+tj("stats.accuracy")+'</span></div>'+
      '<div><b>'+p.box+'</b><span>box</span></div></div></div>';
  }
  return s;
}

function vStats(){
  var total = WORDS.length;
  var ans = 0, cor = 0;
  S.history.forEach(function(h){ ans += h.answered; cor += h.correct; });
  var s = '<div class="card"><div class="kpi two">'+
    '<div><b>'+ofTotal(learnedCount())+'</b><span>'+tjb("stats.learned")+'</span></div>'+
    '<div><b>'+ofTotal(studiedCount())+'</b><span>'+tjb("stats.studied")+'</span></div>'+
    '<div><b>'+(ans?Math.round(cor/ans*100):0)+'%</b><span>'+tjb("stats.accuracy")+'</span></div>'+
    '<div><b>'+streakDays()+'</b><span>'+tjb("stats.streak")+'</span></div></div>'+
    '<div class="muted" style="margin-top:10px">'+tjb("stats.learnedNote")+'</div></div>';
  s += '<div class="card"><h2>'+bi(T("stats.byCategory"))+'</h2>'+
    V.categories.map(function(c){
      var ws = WORDS.filter(function(w){ return w.categoryId===c.id; });
      var done = ws.filter(function(w){ var p=prog(w.id); return p && p.box>=3; }).length;
      var pct = Math.round(done/ws.length*100);
      return '<div class="sec" style="border-top-color:#eef2f6">'+
        '<div style="display:flex;justify-content:space-between;font-weight:700"><span>'+rj(c.name, c.nameRuby)+'</span>'+
        '<span>'+done+'/'+ws.length+'</span></div>'+
        '<div class="bar" style="margin-top:6px"><i style="width:'+pct+'%"></i></div></div>';
    }).join("")+'</div>';
  /* よくまちがえることば：誤答回数の多い順（卒業済みの語も含む＝傾向を見るため） */
  var missed = WORDS.filter(function(w){ var p=prog(w.id); return p && p.wrong>=2; })
    .sort(function(a,b){
      var d = prog(b.id).wrong - prog(a.id).wrong;
      return d !== 0 ? d : accuracy(prog(a.id)) - accuracy(prog(b.id));
    }).slice(0,10);
  if(missed.length){
    s += '<div class="card"><h2>'+bi(T("stats.mostMissed"))+'</h2><div class="stack">'+
      missed.map(function(w){
        return '<button class="listitem" type="button" data-word="'+w.id+'">'+
          '<span class="dot'+(prog(w.id).box?" b"+prog(w.id).box:"")+'"></span>'+
          '<span class="t"><b>'+rj(w.term, w.termRuby)+'</b>'+
          statLine([fill("stats.wrongTimes",{n:prog(w.id).wrong}),
                    Math.round(accuracy(prog(w.id))*100)+'%'])+
          '<span class="ja2">'+rj(w.easyJa, w.easyJaRuby)+'</span></span>›</button>';
      }).join("")+'</div></div>';
  }

  /* よみまちがえやすい設問の言い方（設問ドリル①の履歴から集計） */
  var stemStat = {};
  S.log.forEach(function(e){
    if(e.k !== "stem") return;
    var x = stemStat[e.id] || (stemStat[e.id] = { n:0, ng:0 });
    x.n++; if(!e.ok) x.ng++;
  });
  var stemRows = Object.keys(stemStat).filter(function(id){ return stemStat[id].ng > 0; })
    .sort(function(a,b){ return stemStat[b].ng - stemStat[a].ng; }).slice(0,5);
  if(stemRows.length){
    s += '<div class="card"><h2>'+bi(T("stats.missedStems"))+'</h2>'+
      stemRows.map(function(id){
        var stx = STEM_BY_ID[id] || {};
        return '<div class="sec" style="border-top-color:#eef2f6">'+
          '<div>'+rj(stx.ja||id, stx.jaRuby)+'</div>'+
          statLine([fill("stats.wrongTimes",{n:stemStat[id].ng}), String(stemStat[id].n)])+'</div>';
      }).join("")+'</div>';
  }
  /* まちがえたことばリスト（3回連続正解で卒業） */
  var rv = reviewWords();
  if(rv.length){
    s += '<div class="card"><h2>'+bi(T("mode.review"))+' ('+rv.length+')</h2>'+
      '<div class="muted" style="margin-bottom:10px">'+tjb("stats.reviewNote")+'</div><div class="stack">'+
      rv.slice(0,30).map(function(w){
        return '<button class="listitem" type="button" data-word="'+w.id+'">'+
          '<span class="dot"></span><span class="t"><b>'+rj(w.term, w.termRuby)+'</b>'+
          statLine([fill("stats.wrongTimes",{n:prog(w.id).wrong}),
                    fill("stats.toClear",{n:toClear(w.id)})])+
          '<span class="ja2">'+rj(w.easyJa, w.easyJaRuby)+'</span></span>›</button>';
      }).join("")+'</div></div>';
  }

  /* 学習の履歴とデータの書き出し */
  var first = S.log.length ? S.log[0].t.slice(0,10) : "";
  var lastT = S.log.length ? S.log[S.log.length-1].t.slice(0,10) : "";
  s += '<div class="card"><h2>'+bi(T("stats.history"))+'</h2>'+
    '<div class="muted">'+tjb("stats.historyCount",{n:S.log.length})+'</div>'+
    (S.log.length ? '<div class="muted">'+esc(tjnPlain("stats.historyRange",{a:first,b:lastT}))+'</div>' : '')+
    '<div class="sec"><div class="lb">'+tjb("stats.download")+'</div>'+
    '<div class="stack" style="margin-top:10px">'+
      '<button class="btn ghost" type="button" data-dl="answers"'+(S.log.length?'':' disabled')+'>'+bi(T("stats.dlAnswers"))+'</button>'+
      '<button class="btn ghost" type="button" data-dl="words">'+bi(T("stats.dlWords"))+'</button>'+
      '<button class="btn ghost" type="button" data-dl="backup">'+bi(T("stats.dlBackup"))+'</button>'+
    '</div>'+
    '<div class="muted" style="margin-top:10px">'+tjb("stats.dlNote")+'</div>'+
    '<div class="muted">'+tjb("stats.localOnly")+'</div></div>'+
    /* 書き出したデータを読み込み直す */
    '<div class="sec"><div class="lb">'+tjb("stats.restore")+'</div>'+
    '<div class="muted" style="margin:6px 0 10px">'+tjb("stats.restoreNote")+'</div>'+
    '<button class="btn ghost" type="button" id="restoreBtn">'+bi(T("stats.restorePick"))+'</button>'+
    '<input type="file" id="restoreFile" accept=".json,application/json" style="display:none">'+
    '</div></div>';

  if(EXPORT_TEXT){
    s += '<div class="card"><h2>'+esc(EXPORT_TEXT.name)+'</h2>'+
      '<div class="muted" style="margin-bottom:8px">'+tjb("stats.copyInstead")+'</div>'+
      '<textarea id="dlText" readonly>'+esc(EXPORT_TEXT.text.slice(0, 200000))+'</textarea>'+
      '<div class="row" style="margin-top:10px">'+
        '<button class="btn small ghost" type="button" id="copyBtn">'+bi(T("stats.copy"))+'</button>'+
        '<button class="btn small ghost" type="button" id="closeDl">'+bi(T("stats.close"))+'</button>'+
      '</div></div>';
  }

  s += '<button class="btn ghost" type="button" id="resetBtn">'+bi(T("stats.reset"))+'</button>';
  return s;
}

function vSettings(){
  function sw(key, on, id){
    return '<div class="switch"><span class="lb">'+bi(T(key))+'</span>'+
      '<button class="tg" type="button" id="'+id+'" role="switch" aria-checked="'+on+'"></button></div>';
  }
  var sizes = [["s","小","S"],["m","中","M"],["l","大","L"]];
  var goals = [5,10,20,30];
  return '<div class="card">'+
    sw("settings.showRuby", S.settings.showRuby, "tgRuby")+
    sw("settings.showRomaji", S.settings.showRomaji, "tgRomaji")+
    sw("settings.showEnglish", S.settings.showEnglish, "tgEnglish")+
    '</div>'+
    '<div class="card"><h2>'+bi(T("settings.fontSize"))+'</h2><div class="chips">'+
      sizes.map(function(x){ return '<button class="chip" type="button" data-size="'+x[0]+'" aria-pressed="'+
        (S.settings.fontSize===x[0])+'">'+L(x[1])+' / '+x[2]+'</button>'; }).join("")+'</div></div>'+
    '<div class="card"><h2>'+bi(T("settings.dailyGoal"))+'</h2><div class="chips">'+
      goals.map(function(g){ return '<button class="chip" type="button" data-goal="'+g+'" aria-pressed="'+
        (S.settings.dailyGoal===g)+'">'+g+'</button>'; }).join("")+'</div>'+
      '<div class="muted" style="margin-top:10px">'+tj("settings.dailyGoalNote")+
      (S.settings.showEnglish?'<span class="en">'+esc(T("settings.dailyGoalNote").en)+'</span>':'')+'</div></div>'+
    '<div class="card"><div class="muted">'+tj("msg.disclaimer")+'</div>'+
    '<div class="sec muted"><div>'+esc(T("msg.disclaimer").en)+'</div>'+
    '<div style="margin-top:8px">データ v'+esc(V.meta.version)+'（'+esc(V.meta.updated)+'）／'+WORDS.length+L("語")+'</div></div></div>'+
    '<p class="foot">'+tj("msg.saved")+' / '+esc(T("msg.saved").en)+'</p>';
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll("[data-nav]").forEach(function(b){
    b.onclick = function(){ HIST = []; EXPORT_TEXT = null; screen = b.dataset.nav; window.scrollTo(0,0); render(); };
  });
  document.querySelectorAll("[data-mode]").forEach(function(b){
    b.onclick = function(){ PENDING_MODE = b.dataset.mode; go("setup"); };
  });
  document.querySelectorAll("[data-f]").forEach(function(b){
    b.onclick = function(){
      var f = b.dataset.f, v = b.dataset.v;
      FILTER[f] = (f==="subject") ? v : parseInt(v,10);
      render();
    };
  });
  var sb = document.getElementById("startBtn");
  if(sb) sb.onclick = function(){ startSession(PENDING_MODE); };

  var rb = document.getElementById("revealBtn");
  if(rb) rb.onclick = function(){ SES.revealed = true; render(); };

  document.querySelectorAll("[data-ans]").forEach(function(b){
    b.onclick = function(){
      var ok = b.dataset.ans === "1";
      var w = SES.queue[SES.i];
      record(w.id, ok, { m:SES.mode, f:"card", sel: ok ? "わかる" : "まだ" });
      if(ok) SES.right++; else SES.wrong.push(w.id);
      nextItem();
    };
  });

  document.querySelectorAll("[data-pick]").forEach(function(b){
    b.onclick = function(){
      if(SES.revealed) return;
      SES.picked = parseInt(b.dataset.pick,10);
      SES.revealed = true;
      var w = SES.queue[SES.i];
      var chosen = SES.choices[SES.picked];
      var ok = !!chosen.correct;
      record(w.id, ok, { m:SES.mode,
        f: (SES.mode==="drill" ? "gap" : (SES.dir==="w2m" ? "word2meaning" : "meaning2word")),
        sel: chosen.term, gid: chosen.gid || "" });
      if(ok) SES.right++; else if(SES.wrong.indexOf(w.id)<0) SES.wrong.push(w.id);
      render();
    };
  });

  document.querySelectorAll("[data-step1]").forEach(function(b){
    b.onclick = function(){
      if(SES.revealed) return;
      SES.picked = parseInt(b.dataset.step1,10);
      SES.revealed = true;
      /* 設問の指示を読み取る問題も記録に残す（どの言い回しで間違えるかを見るため）。
         ただし1日のカウントには入れない。設問ドリルは「指示を読む→ことばを選ぶ」の
         2段階で1問なので、ここで数えると1問が2問分になり、設定した1日の目標と
         合わなくなるため。1日のカウントは2段階目（ことばを選ぶ）だけで行う。 */
      var okStem = b.dataset.v === SES.stem.want;
      logAnswer({ t:stamp(), k:"stem", id:SES.stem.id, m:"drill", f:"instruction",
                  ok:okStem?1:0, sel:b.dataset.v, gid:"", run:0 });
      save();
      render();
    };
  });
  var t2 = document.getElementById("toStep2");
  if(t2) t2.onclick = function(){ SES.step = 2; SES.revealed = false; SES.picked = null; SES.hint = false; render(); };

  var hn = document.getElementById("hintBtn");
  if(hn) hn.onclick = function(){ SES.hint = true; render(); };

  var nb = document.getElementById("nextBtn");
  if(nb) nb.onclick = nextItem;

  var hb = document.getElementById("homeBtn");
  if(hb) hb.onclick = function(){ HIST=[]; screen="home"; window.scrollTo(0,0); render(); };
  var rt = document.getElementById("retryBtn");
  if(rt) rt.onclick = function(){
    var ids = SES.wrong.slice(0, sessionSize("quiz"));
    SES = { mode:"quiz", queue:ids.map(function(i){return BYID[i];}), i:0, step:1,
            revealed:false, hint:false, right:0, wrong:[], stem:null, choices:null, dir:null };
    screen = "study"; window.scrollTo(0,0); render();
  };

  document.querySelectorAll("[data-word]").forEach(function(b){
    b.onclick = function(){ DETAIL = b.dataset.word; go("detail"); };
  });

  var q = document.getElementById("q");
  if(q) q.oninput = function(){
    LISTQ = q.value;
    var pos = q.selectionStart;
    render();
    var q2 = document.getElementById("q");
    if(q2){ q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} }
  };
  var fb = document.getElementById("filterBtn");
  if(fb) fb.onclick = function(){ PENDING_MODE = null; go("setup"); };

  var tb = document.getElementById("tgRuby");
  if(tb) tb.onclick = function(){ S.settings.showRuby = !S.settings.showRuby; applySize(); save(); render(); };

  var tr = document.getElementById("tgRomaji");
  if(tr) tr.onclick = function(){ S.settings.showRomaji = !S.settings.showRomaji; save(); render(); };
  var te = document.getElementById("tgEnglish");
  if(te) te.onclick = function(){ S.settings.showEnglish = !S.settings.showEnglish; save(); render(); };
  document.querySelectorAll("[data-size]").forEach(function(b){
    b.onclick = function(){ S.settings.fontSize = b.dataset.size; applySize(); save(); render(); };
  });
  document.querySelectorAll("[data-goal]").forEach(function(b){
    b.onclick = function(){ S.settings.dailyGoal = parseInt(b.dataset.goal,10); save(); render(); };
  });
  document.querySelectorAll("[data-dl]").forEach(function(b){
    b.onclick = function(){
      var kind = b.dataset.dl, n = stampName();
      if(kind === "answers") download("kaigo-answers-"+n+".csv", answersCsv(), "text/csv");
      else if(kind === "words") download("kaigo-words-summary-"+n+".csv", wordsCsv(), "text/csv");
      else download("kaigo-backup-"+n+".json", backupJson(), "application/json");
    };
  });
  var cp = document.getElementById("copyBtn");
  if(cp) cp.onclick = function(){
    var ta = document.getElementById("dlText");
    if(!ta) return;
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var done = false;
    try{ done = document.execCommand("copy"); }catch(e){}
    if(!done && navigator.clipboard){ try{ navigator.clipboard.writeText(ta.value); done = true; }catch(e){} }
    if(done) alert(T("stats.copied").ja + "\n" + T("stats.copied").en);
  };
  var cd = document.getElementById("closeDl");
  if(cd) cd.onclick = function(){ EXPORT_TEXT = null; render(); };

  /* 書き出した「すべてのデータ（JSON）」を読み込んで、いまの記録と合わせる */
  var rb = document.getElementById("restoreBtn"), rf = document.getElementById("restoreFile");
  if(rb && rf){
    function badFile(){ alert(T("stats.restoreBad").ja + "\n\n" + T("stats.restoreBad").en); }
    rb.onclick = function(){ rf.value = ""; rf.click(); };
    rf.onchange = function(){
      var f = rf.files && rf.files[0];
      if(!f) return;
      var reader = new FileReader();
      reader.onerror = badFile;
      reader.onload = function(){
        var inc = null;
        try{ inc = normalizeBackup(JSON.parse(String(reader.result))); }catch(e){ inc = null; }
        if(!inc){ badFile(); return; }
        var n = { w:Object.keys(inc.progress).length, l:inc.log.length };
        if(!confirm(tjnPlain("stats.restoreConfirm", n) + "\n\n" + enPlain("stats.restoreConfirm", n))) return;
        var r = mergeBackup(inc);
        EXPORT_TEXT = null; save(); render();
        var key = (r.w || r.l) ? "stats.restoreDone" : "stats.restoreNone";
        alert(tjnPlain(key, r) + "\n\n" + enPlain(key, r));
      };
      reader.readAsText(f);
    };
  }

  var rs = document.getElementById("resetBtn");
  if(rs) rs.onclick = function(){
    if(confirm(T("stats.resetConfirm").ja + "\n" + T("stats.resetConfirm").en)){
      S.progress = {}; S.history = []; S.log = []; S.streak = { days:0, lastDate:"" };
      EXPORT_TEXT = null; save(); render();
    }
  };
}

function applySize(){
  document.documentElement.setAttribute("data-size", S.settings.fontSize || "m");
  document.documentElement.setAttribute("data-ruby", S.settings.showRuby ? "1" : "0");
}

/* start */
applySize();
if(S.migrated){ delete S.migrated; save(); }
render();
