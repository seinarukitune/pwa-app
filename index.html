tandard","noteJa":"「依存」は自立の反対方向。「依存」を減らすのが自立支援。「依頼」（request）とは別。","noteEn":"依存 is the opposite direction from independence. Do not confuse with 依頼 (a request).","gapTerm":"依存","termRuby":"依存《いぞん》する","easyJaRuby":"誰《だれ》かに頼《たよ》りきりになること","noteJaRuby":"「依存《いぞん》」は自立《じりつ》の反対方向《はんたいほうこう》。「依存《いぞん》」を減《へ》らすのが自立支援《じりつしえん》。「依頼《いらい》」（request）とは別《べつ》。","noteEnRuby":"依存《いぞん》 is the opposite direction from independence. Do not confuse with 依頼《いらい》 (a request)."},{"id":"KV054","term":"推測する","kana":"すいそくする","romaji":"suisokusuru","english":"to guess / to infer","easyJa":"状況を見て「たぶんこうだろう」と考えること","englishDesc":"To form an idea about something you cannot see directly.","exampleJa":"利用者の表情の変化から痛みの有無を推測する。","exampleEn":"Infer whether there is pain from changes in the user's expression.","exampleRuby":"利用者《りようしゃ》の表情《ひょうじょう》の変化《へんか》から痛《いた》みの有無《うむ》を推測《すいそく》する。","exampleGapRuby":"利用者《りようしゃ》の表情《ひょうじょう》の変化《へんか》から痛《いた》みの有無《うむ》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「推測」は自分の考え。記録には「〜と推測される」と書き、事実と分ける。","noteEn":"推測 is your own inference. In records write 〜と推測される and keep it separate from facts.","gapTerm":"推測する","termRuby":"推測《すいそく》する","easyJaRuby":"状況《じょうきょう》を見《み》て「たぶんこうだろう」と考《かんが》えること","noteJaRuby":"「推測《すいそく》」は自分《じぶん》の考《かんが》え。記録《きろく》には「〜と推測《すいそく》される」と書《か》き、事実《じじつ》と分《わ》ける。","noteEnRuby":"推測《すいそく》 is your own inference. In records write 〜と推測《すいそく》される and keep it separate from facts."},{"id":"KV055","term":"放置する","kana":"ほうちする","romaji":"hōchisuru","english":"to neglect / to leave as is","easyJa":"何もせずにそのままにしておくこと","englishDesc":"To leave something bad as it is and do nothing.","exampleJa":"おむつが汚れたまま放置してはいけない。","exampleEn":"A soiled diaper must not be left unchanged.","exampleRuby":"おむつが汚《よご》れたまま放置《ほうち》してはいけない。","exampleGapRuby":"おむつが汚《よご》れたまま{{GAP}}してはいけない。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「放置」は虐待（介護放棄・ネグレクト）につながる語。試験では必ず不適切。","noteEn":"放置 links to neglect (ネグレクト), a form of abuse. It is always the wrong answer.","gapTerm":"放置","termRuby":"放置《ほうち》する","easyJaRuby":"何《なに》もせずにそのままにしておくこと","noteJaRuby":"「放置《ほうち》」は虐待《ぎゃくたい》（介護放棄《かいごほうき》・ネグレクト）につながる語《ご》。試験《しけん》では必《かなら》ず不適切《ふてきせつ》。","noteEnRuby":"放置《ほうち》 links to neglect (ネグレクト), a form of abuse. It is always the wrong answer."},{"id":"KV056","term":"妥当な","kana":"だとうな","romaji":"datōna","english":"valid / appropriate","easyJa":"それで合っている、無理がなく正しい","englishDesc":"Reasonable and suitable for the situation.","exampleJa":"支援の目標として最も妥当なものを選ぶ。","exampleEn":"Choose the most valid goal for the support.","exampleRuby":"支援《しえん》の目標《もくひょう》として最《もっと》も妥当《だとう》なものを選《えら》ぶ。","exampleGapRuby":"支援《しえん》の目標《もくひょう》として最《もっと》も{{GAP}}ものを選《えら》ぶ。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「妥当」は「適切」とほぼ同義。「妥協」（compromise）と混同しない。","noteEn":"妥当 ≈ appropriate. Do not confuse with 妥協 (compromise).","gapTerm":"妥当な","termRuby":"妥当《だとう》な","easyJaRuby":"それで合《あ》っている、無理《むり》がなく正《ただ》しい","noteJaRuby":"「妥当《だとう》」は「適切《てきせつ》」とほぼ同義《どうぎ》。「妥協《だきょう》」（compromise）と混同《こんどう》しない。","noteEnRuby":"妥当《だとう》 ≈ appropriate. Do not confuse with 妥協《だきょう》 (compromise)."},{"id":"KV057","term":"直ちに","kana":"ただちに","romaji":"tadachini","english":"immediately / at once","easyJa":"今すぐ、時間をおかずに急いで","englishDesc":"Right now, without waiting.","exampleJa":"事故が起きた時は、直ちに上司に報告する。","exampleEn":"When an accident happens, report to your supervisor immediately.","exampleRuby":"事故《じこ》が起《お》きた時《とき》は、直《ただ》ちに上司《じょうし》に報告《ほうこく》する。","exampleGapRuby":"事故《じこ》が起《お》きた時《とき》は、{{GAP}}上司《じょうし》に報告《ほうこく》する。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「直ちに」＞「速やかに」＞「遅滞なく」の順に急ぐ。法令文で使い分けられる。","noteEn":"Urgency order: 直ちに (at once) > 速やかに (promptly) > 遅滞なく (without delay). Used precisely in laws.","gapTerm":"直ちに","termRuby":"直《ただ》ちに","easyJaRuby":"今《いま》すぐ、時間《じかん》をおかずに急《いそ》いで","noteJaRuby":"「直《ただ》ちに」＞「速《すみ》やかに」＞「遅滞《ちたい》なく」の順《じゅん》に急《いそ》ぐ。法令文《ほうれいぶん》で使《つか》い分《わ》けられる。","noteEnRuby":"Urgency order: 直《ただ》ちに (at once) > 速《すみ》やかに (promptly) > 遅滞《ちたい》なく (without delay). Used precisely in laws."},{"id":"KV058","term":"着目する","kana":"ちゃくもくする","romaji":"chakumokusuru","english":"to focus on","easyJa":"そこに特に注意して見ること","englishDesc":"To pay attention to one particular point.","exampleJa":"利用者の残存機能（できること）に着目する。","exampleEn":"Focus on the user's remaining abilities.","exampleRuby":"利用者《りようしゃ》の残存機能《ざんぞんきのう》（できること）に着目《ちゃくもく》する。","exampleGapRuby":"利用者《りようしゃ》の残存機能《ざんぞんきのう》（できること）に{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「着目」は「注目」とほぼ同じ。「〜に着目する」の助詞は「に」。","noteEn":"着目 ≈ 注目 (focus on). The particle is に.","gapTerm":"着目する","termRuby":"着目《ちゃくもく》する","easyJaRuby":"そこに特《とく》に注意《ちゅうい》して見《み》ること","noteJaRuby":"「着目《ちゃくもく》」は「注目《ちゅうもく》」とほぼ同《おな》じ。「〜に着目《ちゃくもく》する」の助詞《じょし》は「に」。","noteEnRuby":"着目《ちゃくもく》 ≈ 注目《ちゅうもく》 (focus on). The particle is に."},{"id":"KV059","term":"一致する","kana":"いっちする","romaji":"itchisuru","english":"to match / to agree","easyJa":"同じになる、ピッタリ合う","englishDesc":"To be the same; to agree with each other.","exampleJa":"本人の希望と家族の意見が一致する。","exampleEn":"The person's wish and the family's opinion match.","exampleRuby":"本人《ほんにん》の希望《きぼう》と家族《かぞく》の意見《いけん》が一致《いっち》する。","exampleGapRuby":"本人《ほんにん》の希望《きぼう》と家族《かぞく》の意見《いけん》が{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「一致」（match）と「合意」（agreement reached）は違う。事例で意見が「一致しない」場合の対応が問われる。","noteEn":"一致 = they happen to match; 合意 = an agreement was reached. Cases often test what to do when they do NOT match.","gapTerm":"一致する","termRuby":"一致《いっち》する","easyJaRuby":"同《おな》じになる、ピッタリ合《あ》う","noteJaRuby":"「一致《いっち》」（match）と「合意《ごうい》」（agreement reached）は違《ちが》う。事例《じれい》で意見《いけん》が「一致《いっち》しない」場合《ばあい》の対応《たいおう》が問《と》われる。","noteEnRuby":"一致《いっち》 = they happen to match; 合意《ごうい》 = an agreement was reached. Cases often test what to do when they do NOT match."},{"id":"KV060","term":"従う","kana":"したがう","romaji":"shitagau","english":"to follow / to obey","easyJa":"言われた通りにする、ルールを守る","englishDesc":"To do as someone tells or instructs you.","exampleJa":"医療行為については医師の指示に従う。","exampleEn":"Follow the doctor's instructions for medical procedures.","exampleRuby":"医療行為《いりょうこうい》については医師《いし》の指示《しじ》に従《したが》う。","exampleGapRuby":"医療行為《いりょうこうい》については医師《いし》の指示《しじ》に{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「指示に従う」は定型。医行為は必ず医師の指示が必要という点が頻出。","noteEn":"指示に従う is a set phrase. Medical acts always require a doctor's instruction — a common exam point.","gapTerm":"従う","termRuby":"従《したが》う","easyJaRuby":"言《い》われた通《とお》りにする、ルールを守《まも》る","noteJaRuby":"「指示《しじ》に従《したが》う」は定型《ていけい》。医行為《いこうい》は必《かなら》ず医師《いし》の指示《しじ》が必要《ひつよう》という点《てん》が頻出《ひんしゅつ》。","noteEnRuby":"指示《しじ》に従《したが》う is a set phrase. Medical acts always require a doctor's instruction — a common exam point."},{"id":"KV061","term":"共有する","kana":"きょうゆうする","romaji":"kyōyūsuru","english":"to share","easyJa":"知っている情報を、他の人にも教えて一緒に持つこと","englishDesc":"To use or hold information together with others.","exampleJa":"チーム会議で利用者の情報を共有する。","exampleEn":"Share the user's information at the team meeting.","exampleRuby":"チーム会議《かいぎ》で利用者《りようしゃ》の情報《じょうほう》を共有《きょうゆう》する。","exampleGapRuby":"チーム会議《かいぎ》で利用者《りようしゃ》の情報《じょうほう》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「共有」（share with others）と「共通」（in common）を区別。守秘義務との関係も問われる。","noteEn":"共有 (share with others) vs 共通 (shared trait). Often linked to confidentiality questions.","gapTerm":"共有する","termRuby":"共有《きょうゆう》する","easyJaRuby":"知《し》っている情報《じょうほう》を、他《ほか》の人《ひと》にも教《おし》えて一緒《いっしょ》に持《も》つこと","noteJaRuby":"「共有《きょうゆう》」（share with others）と「共通《きょうつう》」（in common）を区別《くべつ》。守秘義務《しゅひぎむ》との関係《かんけい》も問《と》われる。","noteEnRuby":"共有《きょうゆう》 (share with others) vs 共通《きょうつう》 (shared trait). Often linked to confidentiality questions."},{"id":"KV062","term":"保障する","kana":"ほしょうする","romaji":"hoshōsuru","english":"to guarantee / to secure","easyJa":"権利や生活が守られるように約束すること","englishDesc":"To make certain that something is provided by law.","exampleJa":"全ての人に最低限度の生活を保障する。","exampleEn":"Guarantee a minimum standard of living for everyone.","exampleRuby":"全《すべ》ての人《ひと》に最低限度《さいていげんど》の生活《せいかつ》を保障《ほしょう》する。","exampleGapRuby":"全《すべ》ての人《ひと》に最低限度《さいていげんど》の生活《せいかつ》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"社会の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「保障」（guarantee rights）「保証」（guarantee quality）「補償」（compensate for damage）は全て「ほしょう」。社会保障は「保障」。","noteEn":"保障 (guarantee rights), 保証 (guarantee quality), 補償 (compensate) are all hoshō. 社会保障 uses 保障.","gapTerm":"保障する","termRuby":"保障《ほしょう》する","easyJaRuby":"権利《けんり》や生活《せいかつ》が守《まも》られるように約束《やくそく》すること","noteJaRuby":"「保障《ほしょう》」（guarantee rights）「保証《ほしょう》」（guarantee quality）「補償《ほしょう》」（compensate for damage）は全《すべ》て「ほしょう」。社会保障《しゃかいほしょう》は「保障《ほしょう》」。","noteEnRuby":"保障《ほしょう》 (guarantee rights), 保証《ほしょう》 (guarantee quality), 補償《ほしょう》 (compensate) are all hoshō. 社会保障《しゃかいほしょう》 uses 保障《ほしょう》."},{"id":"KV063","term":"振り返る","kana":"ふりかえる","romaji":"furikaeru","english":"to reflect on","easyJa":"過去のことや、自分がやったことを見直すこと","englishDesc":"To look back at what you did and think about it.","exampleJa":"自分の介護のやり方を振り返る。","exampleEn":"Reflect on your own way of providing care.","exampleRuby":"自分《じぶん》の介護《かいご》のやり方《かた》を振《ふ》り返《かえ》る。","exampleGapRuby":"自分《じぶん》の介護《かいご》のやり方《かた》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「振り返る」は自己評価のこと。介護過程の「評価」と関連づけて覚える。","noteEn":"振り返る = self-review. Link it to 評価 in the care process.","gapTerm":"振り返る","termRuby":"振《ふ》り返《かえ》る","easyJaRuby":"過去《かこ》のことや、自分《じぶん》がやったことを見直《みなお》すこと","noteJaRuby":"「振《ふ》り返《かえ》る」は自己評価《じこひょうか》のこと。介護過程《かいごかてい》の「評価《ひょうか》」と関連《かんれん》づけて覚《おぼ》える。","noteEnRuby":"振《ふ》り返《かえ》る = self-review. Link it to 評価《ひょうか》 in the care process."},{"id":"KV064","term":"明確にする","kana":"めいかくにする","romaji":"meikakunisuru","english":"to clarify","easyJa":"はっきりさせて、誰が見てもわかるようにする","englishDesc":"To make something clear and easy to understand.","exampleJa":"ケアプランの目標を明確にする。","exampleEn":"Clarify the goals of the care plan.","exampleRuby":"ケアプランの目標《もくひょう》を明確《めいかく》にする。","exampleGapRuby":"ケアプランの目標《もくひょう》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「明確にする」＝はっきりさせる。目標は「誰が・何を・いつまでに」を明確にする。","noteEn":"明確にする = make clear. Goals should state who, what, and by when.","gapTerm":"明確にする","termRuby":"明確《めいかく》にする","easyJaRuby":"はっきりさせて、誰《だれ》が見《み》てもわかるようにする","noteJaRuby":"「明確《めいかく》にする」＝はっきりさせる。目標《もくひょう》は「誰《だれ》が・何《なに》を・いつまでに」を明確《めいかく》にする。","noteEnRuby":"明確《めいかく》にする = make clear. Goals should state who, what, and by when."},{"id":"KV065","term":"緩和する","kana":"かんわする","romaji":"kanwasuru","english":"to alleviate / to relieve","easyJa":"痛みや苦しみを和らげて、軽くすること","englishDesc":"To make pain or a hard feeling weaker.","exampleJa":"がん末期の利用者の疼痛（痛み）を緩和するケア。","exampleEn":"Care that relieves the pain of a user in the terminal stage of cancer.","exampleRuby":"がん末期《まっき》の利用者《りようしゃ》の疼痛《とうつう》（痛《いた》み）を緩和《かんわ》するケア。","exampleGapRuby":"がん末期《まっき》の利用者《りようしゃ》の疼痛《とうつう》（痛《いた》み）を{{GAP}}ケア。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「緩和」は痛みを和らげること。「緩和ケア＝終末期のケア」ではなく、早期から行える点に注意。","noteEn":"緩和 = relieve. Palliative care is not only for the final days; it can start early.","gapTerm":"緩和する","termRuby":"緩和《かんわ》する","easyJaRuby":"痛《いた》みや苦《くる》しみを和《やわ》らげて、軽《かる》くすること","noteJaRuby":"「緩和《かんわ》」は痛《いた》みを和《やわ》らげること。「緩和《かんわ》ケア＝終末期《しゅうまつき》のケア」ではなく、早期《そうき》から行《おこな》える点《てん》に注意《ちゅうい》。","noteEnRuby":"緩和《かんわ》 = relieve. Palliative care is not only for the final days; it can start early."},{"id":"KV066","term":"調整する","kana":"ちょうせいする","romaji":"chōseisuru","english":"to adjust / to coordinate","easyJa":"具合が良くなるように、バランスを合わせること","englishDesc":"To change something so it fits better; also to bring people together.","exampleJa":"利用者の体格に合わせて車いすの高さを調整する。","exampleEn":"Adjust the height of the wheelchair to the user's body size.","exampleRuby":"利用者《りようしゃ》の体格《たいかく》に合《あ》わせて車《くるま》いすの高《たか》さを調整《ちょうせい》する。","exampleGapRuby":"利用者《りようしゃ》の体格《たいかく》に合《あ》わせて車《くるま》いすの高《たか》さを{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「調整」は物にも人間関係にも使う。「調節」（fine-tune a machine）とほぼ同じだが、連携は「調整」。","noteEn":"調整 is used for both objects and relationships. 調節 is for fine-tuning devices; coordination uses 調整.","gapTerm":"調整する","termRuby":"調整《ちょうせい》する","easyJaRuby":"具合《ぐあい》が良《よ》くなるように、バランスを合《あ》わせること","noteJaRuby":"「調整《ちょうせい》」は物《もの》にも人間関係《にんげんかんけい》にも使《つか》う。「調節《ちょうせつ》」（fine-tune a machine）とほぼ同《おな》じだが、連携《れんけい》は「調整《ちょうせい》」。","noteEnRuby":"調整《ちょうせい》 is used for both objects and relationships. 調節《ちょうせつ》 is for fine-tuning devices; coordination uses 調整《ちょうせい》."},{"id":"KV067","term":"遵守する","kana":"じゅんしゅする","romaji":"junshusuru","english":"to comply with / to observe","easyJa":"決められた法律やルールをしっかり守ること","englishDesc":"To follow a rule exactly.","exampleJa":"施設が定めたマニュアルを遵守する。","exampleEn":"Comply with the manual set by the facility.","exampleRuby":"施設《しせつ》が定《さだ》めたマニュアルを遵守《じゅんしゅ》する。","exampleGapRuby":"施設《しせつ》が定《さだ》めたマニュアルを{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「遵守」は「じゅんしゅ」。「順守」とも書く。コンプライアンスの訳語として頻出。","noteEn":"Read じゅんしゅ (also written 順守). It is the Japanese word for compliance.","gapTerm":"遵守する","termRuby":"遵守《じゅんしゅ》する","easyJaRuby":"決《き》められた法律《ほうりつ》やルールをしっかり守《まも》ること","noteJaRuby":"「遵守《じゅんしゅ》」は「じゅんしゅ」。「順守《じゅんしゅ》」とも書《か》く。コンプライアンスの訳語《やくご》として頻出《ひんしゅつ》。","noteEnRuby":"Read じゅんしゅ (also written 順守《じゅんしゅ》). It is the Japanese word for compliance."},{"id":"KV068","term":"想定する","kana":"そうていする","romaji":"sōteisuru","english":"to assume / to suppose","easyJa":"「もしこうなったら」と前もって考えること","englishDesc":"To imagine that a situation may happen and prepare for it.","exampleJa":"地震などの災害時を想定した避難訓練を行う。","exampleEn":"Hold an evacuation drill assuming a disaster such as an earthquake.","exampleRuby":"地震《じしん》などの災害時《さいがいじ》を想定《そうてい》した避難訓練《ひなんくんれん》を行《おこな》う。","exampleGapRuby":"地震《じしん》などの災害時《さいがいじ》を{{GAP}}した避難訓練《ひなんくんれん》を行《おこな》う。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「想定」（assume a case）と「予想」（predict）は近い。「想定外」＝考えていなかった事態。","noteEn":"想定 (assume a scenario) ≈ 予想 (predict). 想定外 = beyond what was assumed.","gapTerm":"想定","termRuby":"想定《そうてい》する","easyJaRuby":"「もしこうなったら」と前《まえ》もって考《かんが》えること","noteJaRuby":"「想定《そうてい》」（assume a case）と「予想《よそう》」（predict）は近《ちか》い。「想定外《そうていがい》」＝考《かんが》えていなかった事態《じたい》。","noteEnRuby":"想定《そうてい》 (assume a scenario) ≈ 予想《よそう》 (predict). 想定外《そうていがい》 = beyond what was assumed."},{"id":"KV069","term":"指導する","kana":"しどうする","romaji":"shidōsuru","english":"to instruct / to guide","easyJa":"やり方を教えて、良い方向へ導くこと","englishDesc":"To teach someone how to do something correctly.","exampleJa":"新人職員に対して、正しい介護技術を指導する。","exampleEn":"Instruct new staff in correct care techniques.","exampleRuby":"新人職員《しんじんしょくいん》に対《たい》して、正《ただ》しい介護技術《かいごぎじゅつ》を指導《しどう》する。","exampleGapRuby":"新人職員《しんじんしょくいん》に対《たい》して、正《ただ》しい介護技術《かいごぎじゅつ》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「指導」は上下関係がある。利用者や家族には「助言」を使うのが適切。","noteEn":"指導 implies a senior-to-junior relationship. For users and families, 助言 is the appropriate word.","gapTerm":"指導する","termRuby":"指導《しどう》する","easyJaRuby":"やり方《かた》を教《おし》えて、良《よ》い方向《ほうこう》へ導《みちび》くこと","noteJaRuby":"「指導《しどう》」は上下関係《じょうげかんけい》がある。利用者《りようしゃ》や家族《かぞく》には「助言《じょげん》」を使《つか》うのが適切《てきせつ》。","noteEnRuby":"指導《しどう》 implies a senior-to-junior relationship. For users and families, 助言《じょげん》 is the appropriate word."},{"id":"KV070","term":"孤立する","kana":"こりつする","romaji":"koritsusuru","english":"to be isolated","easyJa":"誰からも助けてもらえず、一人ぼっちになること","englishDesc":"To be alone and cut off from other people.","exampleJa":"地域社会から孤立する高齢者への支援。","exampleEn":"Support for older people who are isolated from the local community.","exampleRuby":"地域社会《ちいきしゃかい》から孤立《こりつ》する高齢者《こうれいしゃ》への支援《しえん》。","exampleGapRuby":"地域社会《ちいきしゃかい》から{{GAP}}高齢者《こうれいしゃ》への支援《しえん》。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「孤立」（cut off from people）と「孤独」（feeling lonely）は違う。孤立は状態、孤独は感情。","noteEn":"孤立 = objectively cut off; 孤独 = the feeling of loneliness.","gapTerm":"孤立する","termRuby":"孤立《こりつ》する","easyJaRuby":"誰《だれ》からも助《たす》けてもらえず、一人《ひとり》ぼっちになること","noteJaRuby":"「孤立《こりつ》」（cut off from people）と「孤独《こどく》」（feeling lonely）は違《ちが》う。孤立《こりつ》は状態《じょうたい》、孤独《こどく》は感情《かんじょう》。","noteEnRuby":"孤立《こりつ》 = objectively cut off; 孤独《こどく》 = the feeling of loneliness."},{"id":"KV071","term":"構築する","kana":"こうちくする","romaji":"kōchikusuru","english":"to build / to construct","easyJa":"良い関係や仕組みを、しっかり組み立てて作ること","englishDesc":"To build something up, such as a relationship.","exampleJa":"家族との間に良好な信頼関係を構築する。","exampleEn":"Build a good relationship of trust with the family.","exampleRuby":"家族《かぞく》との間《あいだ》に良好《りょうこう》な信頼関係《しんらいかんけい》を構築《こうちく》する。","exampleGapRuby":"家族《かぞく》との間《あいだ》に良好《りょうこう》な信頼関係《しんらいかんけい》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"コミュニケーション技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「構築」は硬い書き言葉。「信頼関係を構築する」は定型表現。「築く」も同義。","noteEn":"構築 is formal written Japanese. 信頼関係を構築する is a set phrase; 築く means the same.","gapTerm":"構築する","termRuby":"構築《こうちく》する","easyJaRuby":"良《よ》い関係《かんけい》や仕組《しく》みを、しっかり組《く》み立《た》てて作《つく》ること","noteJaRuby":"「構築《こうちく》」は硬《かた》い書《か》き言葉《ことば》。「信頼関係《しんらいかんけい》を構築《こうちく》する」は定型表現《ていけいひょうげん》。「築《きず》く」も同義《どうぎ》。","noteEnRuby":"構築《こうちく》 is formal written Japanese. 信頼関係《しんらいかんけい》を構築《こうちく》する is a set phrase; 築《きず》く means the same."},{"id":"KV072","term":"検討する","kana":"けんとうする","romaji":"kentōsuru","english":"to consider / to examine","easyJa":"良いかどうか、どうするべきかよく考えること","englishDesc":"To think about something carefully before deciding.","exampleJa":"状態の変化に合わせてケアプランの見直しを検討する。","exampleEn":"Consider revising the care plan as the condition changes.","exampleRuby":"状態《じょうたい》の変化《へんか》に合《あ》わせてケアプランの見直《みなお》しを検討《けんとう》する。","exampleGapRuby":"状態《じょうたい》の変化《へんか》に合《あ》わせてケアプランの見直《みなお》しを{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「検討する」はまだ決めていない段階。「決定する」との違いが事例問題で問われる。","noteEn":"検討する means \"still deciding\". Cases test the difference from 決定する (decide).","gapTerm":"検討する","termRuby":"検討《けんとう》する","easyJaRuby":"良《よ》いかどうか、どうするべきかよく考《かんが》えること","noteJaRuby":"「検討《けんとう》する」はまだ決《き》めていない段階《だんかい》。「決定《けってい》する」との違《ちが》いが事例問題《じれいもんだい》で問《と》われる。","noteEnRuby":"検討《けんとう》する means \"still deciding\". Cases test the difference from 決定《けってい》する (decide)."},{"id":"KV073","term":"褥瘡","kana":"じょくそう","romaji":"jokusō","english":"bedsore / pressure ulcer","easyJa":"床ずれ","englishDesc":"A wound that forms when the skin is pressed for a long time by body weight.","exampleJa":"褥瘡を予防するために体位変換を行う。","exampleEn":"Carry out repositioning to prevent pressure ulcers.","exampleRuby":"褥瘡《じょくそう》を予防《よぼう》するために体位変換《たいいへんかん》を行《おこな》う。","exampleGapRuby":"{{GAP}}を予防《よぼう》するために体位変換《たいいへんかん》を行《おこな》う。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「褥瘡（じょくそう）」＝床ずれ。読みが難しいが頻出。予防は「体位変換」「除圧」「栄養」。","noteEn":"Read じょくそう; the everyday word is 床ずれ. Prevention: repositioning, pressure relief, nutrition.","gapTerm":"褥瘡","termRuby":"褥瘡《じょくそう》","easyJaRuby":"床《とこ》ずれ","noteJaRuby":"「褥瘡《じょくそう》」＝床《とこ》ずれ。読《よ》みが難《むずか》しいが頻出《ひんしゅつ》。予防《よぼう》は「体位変換《たいいへんかん》」「除圧《じょあつ》」「栄養《えいよう》」。","noteEnRuby":"Read じょくそう; the everyday word is 床《とこ》ずれ. Prevention: repositioning, pressure relief, nutrition."},{"id":"KV074","term":"拘縮","kana":"こうしゅく","romaji":"kōshuku","english":"contracture","easyJa":"関節が硬くなって動かなくなること","englishDesc":"When a joint becomes stiff and can no longer move well.","exampleJa":"関節の拘縮を防ぐためのケアを行う。","exampleEn":"Provide care to prevent joint contracture.","exampleRuby":"関節《かんせつ》の拘縮《こうしゅく》を防《ふせ》ぐためのケアを行《おこな》う。","exampleGapRuby":"関節《かんせつ》の{{GAP}}を防《ふせ》ぐためのケアを行《おこな》う。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「拘縮」（joint stiffens）と「萎縮」（muscle shrinks）は別。廃用症候群の症状として一緒に出る。","noteEn":"拘縮 (joint stiffens) is not 萎縮 (muscle shrinks). Both appear as symptoms of disuse syndrome.","gapTerm":"拘縮","termRuby":"拘縮《こうしゅく》","easyJaRuby":"関節《かんせつ》が硬《かた》くなって動《うご》かなくなること","noteJaRuby":"「拘縮《こうしゅく》」（joint stiffens）と「萎縮《いしゅく》」（muscle shrinks）は別《べつ》。廃用症候群《はいようしょうこうぐん》の症状《しょうじょう》として一緒《いっしょ》に出《で》る。","noteEnRuby":"拘縮《こうしゅく》 (joint stiffens) is not 萎縮《いしゅく》 (muscle shrinks). Both appear as symptoms of disuse syndrome."},{"id":"KV075","term":"片麻痺","kana":"かたまひ","romaji":"katamahi","english":"hemiplegia","easyJa":"体の右か左の半分が動かないこと","englishDesc":"When one side of the body, right or left, cannot move.","exampleJa":"左片麻痺のある利用者の更衣介助を行う。","exampleEn":"Provide dressing assistance for a user with left hemiplegia.","exampleRuby":"左片麻痺《ひだりかたまひ》のある利用者《りようしゃ》の更衣介助《こういかいじょ》を行《おこな》う。","exampleGapRuby":"左《ひだり》{{GAP}}のある利用者《りようしゃ》の更衣介助《こういかいじょ》を行《おこな》う。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「左片麻痺」＝体の左が動かない。原因の脳の障害は反対側（右脳）。左右を逆に読むミスが多い。","noteEn":"左片麻痺 = the LEFT side cannot move, caused by damage to the RIGHT side of the brain. Sides are easily reversed.","gapTerm":"片麻痺","termRuby":"片麻痺《かたまひ》","easyJaRuby":"体《からだ》の右《みぎ》か左《ひだり》の半分《はんぶん》が動《うご》かないこと","noteJaRuby":"「左片麻痺《ひだりかたまひ》」＝体《からだ》の左《ひだり》が動《うご》かない。原因《げんいん》の脳《のう》の障害《しょうがい》は反対側《はんたいがわ》（右脳《うのう》）。左右《さゆう》を逆《ぎゃく》に読《よ》むミスが多《おお》い。","noteEnRuby":"左片麻痺《ひだりかたまひ》 = the LEFT side cannot move, caused by damage to the RIGHT side of the brain. Sides are easily reversed."},{"id":"KV076","term":"嚥下","kana":"えんげ","romaji":"enge","english":"swallowing","easyJa":"食べ物や飲み物を飲み込むこと","englishDesc":"Swallowing food or drink down into the stomach.","exampleJa":"嚥下機能が低下している利用者の食事介助。","exampleEn":"Meal assistance for a user with reduced swallowing function.","exampleRuby":"嚥下機能《えんげきのう》が低下《ていか》している利用者《りようしゃ》の食事介助《しょくじかいじょ》。","exampleGapRuby":"{{GAP}}機能《きのう》が低下《ていか》している利用者《りようしゃ》の食事介助《しょくじかいじょ》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「嚥下（えんげ）」。「誤嚥（ごえん）」と字が似ている。嚥下＝正しく飲み込む、誤嚥＝間違って気管に入る。","noteEn":"嚥下 (correct swallowing) and 誤嚥 (food entering the airway) look similar but are opposite.","gapTerm":"嚥下","termRuby":"嚥下《えんげ》","easyJaRuby":"食《た》べ物《もの》や飲《の》み物《もの》を飲《の》み込《こ》むこと","noteJaRuby":"「嚥下《えんげ》」。「誤嚥《ごえん》」と字《じ》が似《に》ている。嚥下《えんげ》＝正《ただ》しく飲《の》み込《こ》む、誤嚥《ごえん》＝間違《まちが》って気管《きかん》に入《はい》る。","noteEnRuby":"嚥下《えんげ》 (correct swallowing) and 誤嚥《ごえん》 (food entering the airway) look similar but are opposite."},{"id":"KV077","term":"見当識障害","kana":"けんとうしきしょうがい","romaji":"kentōshikishōgai","english":"disorientation","easyJa":"今の時間や場所、人がわからなくなること","englishDesc":"Not knowing the time, the place, or who people are.","exampleJa":"見当識障害のある認知症利用者への対応。","exampleEn":"Responding to a user with dementia who has disorientation.","exampleRuby":"見当識障害《けんとうしきしょうがい》のある認知症利用者《にんちしょうりようしゃ》への対応《たいおう》。","exampleGapRuby":"{{GAP}}のある認知症利用者《にんちしょうりようしゃ》への対応《たいおう》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"見当識障害の順番は「時間→場所→人」。中核症状の一つ。「見当」の読みは「けんとう」。","noteEn":"Disorientation is lost in the order time → place → person. It is a core symptom of dementia.","gapTerm":"見当識障害","termRuby":"見当識障害《けんとうしきしょうがい》","easyJaRuby":"今《いま》の時間《じかん》や場所《ばしょ》、人《ひと》がわからなくなること","noteJaRuby":"見当識障害《けんとうしきしょうがい》の順番《じゅんばん》は「時間《じかん》→場所《ばしょ》→人《ひと》」。中核症状《ちゅうかくしょうじょう》の一《ひと》つ。「見当《けんとう》」の読《よ》みは「けんとう」。","noteEnRuby":""},{"id":"KV078","term":"失語症","kana":"しつごしょう","romaji":"shitsugoshō","english":"aphasia","easyJa":"言葉が話せなくなったり、理解できなくなること","englishDesc":"Not being able to speak or understand words because of brain damage.","exampleJa":"失語症のある利用者とのコミュニケーション方法。","exampleEn":"Communication methods for a user with aphasia.","exampleRuby":"失語症《しつごしょう》のある利用者《りようしゃ》とのコミュニケーション方法《ほうほう》。","exampleGapRuby":"{{GAP}}のある利用者《りようしゃ》とのコミュニケーション方法《ほうほう》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「失語症」（言葉が出ない・わからない）と「構音障害」（発音できないが言葉はわかる）は別。","noteEn":"失語症 (language itself is lost) is different from 構音障害 (words are known but cannot be pronounced).","gapTerm":"失語症","termRuby":"失語症《しつごしょう》","easyJaRuby":"言葉《ことば》が話《はな》せなくなったり、理解《りかい》できなくなること","noteJaRuby":"「失語症《しつごしょう》」（言葉《ことば》が出《で》ない・わからない）と「構音障害《こうおんしょうがい》」（発音《はつおん》できないが言葉《ことば》はわかる）は別《べつ》。","noteEnRuby":"失語症《しつごしょう》 (language itself is lost) is different from 構音障害《こうおんしょうがい》 (words are known but cannot be pronounced)."},{"id":"KV079","term":"誤嚥","kana":"ごえん","romaji":"goen","english":"aspiration","easyJa":"食べ物が胃ではなく気管（肺）に入ってしまうこと","englishDesc":"When food or drink goes into the windpipe instead of the stomach.","exampleJa":"誤嚥を防ぐために、飲み物に少しとろみをつける。","exampleEn":"Add a little thickener to drinks to prevent aspiration.","exampleRuby":"誤嚥《ごえん》を防《ふせ》ぐために、飲《の》み物《もの》に少《すこ》しとろみをつける。","exampleGapRuby":"{{GAP}}を防《ふせ》ぐために、飲《の》み物《もの》に少《すこ》しとろみをつける。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「誤嚥」→「誤嚥性肺炎」につながる。予防は姿勢（顎を引く）、とろみ、口腔ケア。","noteEn":"誤嚥 leads to aspiration pneumonia. Prevention: chin-down posture, thickened liquids, oral care.","gapTerm":"誤嚥","termRuby":"誤嚥《ごえん》","easyJaRuby":"食《た》べ物《もの》が胃《い》ではなく気管《きかん》（肺《はい》）に入《はい》ってしまうこと","noteJaRuby":"「誤嚥《ごえん》」→「誤嚥性肺炎《ごえんせいはいえん》」につながる。予防《よぼう》は姿勢《しせい》（顎《あご》を引《ひ》く）、とろみ、口腔《こうくう》ケア。","noteEnRuby":"誤嚥《ごえん》 leads to aspiration pneumonia. Prevention: chin-down posture, thickened liquids, oral care."},{"id":"KV080","term":"チアノーゼ","kana":"ちあのーぜ","romaji":"chianōze","english":"cyanosis","easyJa":"酸素が足りなくて、唇や爪が青紫色になること","englishDesc":"When lips and nails turn blue-purple because there is not enough oxygen.","exampleJa":"入浴中にチアノーゼが見られたため、中止した。","exampleEn":"Bathing was stopped because cyanosis was seen.","exampleRuby":"入浴中《にゅうよくちゅう》にチアノーゼが見《み》られたため、中止《ちゅうし》した。","exampleGapRuby":"入浴中《にゅうよくちゅう》に{{GAP}}が見《み》られたため、中止《ちゅうし》した。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「チアノーゼ」は緊急サイン。入浴中止・観察・報告が正解になりやすい。","noteEn":"Cyanosis is an emergency sign. Stopping the activity, observing and reporting is usually the correct answer.","gapTerm":"チアノーゼ","termRuby":"チアノーゼ","easyJaRuby":"酸素《さんそ》が足《た》りなくて、唇《くちびる》や爪《つめ》が青紫色《あおむらさきいろ》になること","noteJaRuby":"「チアノーゼ」は緊急《きんきゅう》サイン。入浴中止《にゅうよくちゅうし》・観察《かんさつ》・報告《ほうこく》が正解《せいかい》になりやすい。","noteEnRuby":""},{"id":"KV081","term":"浮腫","kana":"ふしゅ","romaji":"fushu","english":"edema","easyJa":"むくみ","englishDesc":"Swelling caused by water collecting under the skin.","exampleJa":"下肢の浮腫を軽減するために足を高くする。","exampleEn":"Raise the legs to reduce swelling in the lower limbs.","exampleRuby":"下肢《かし》の浮腫《ふしゅ》を軽減《けいげん》するために足《あし》を高《たか》くする。","exampleGapRuby":"下肢《かし》の{{GAP}}を軽減《けいげん》するために足《あし》を高《たか》くする。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「浮腫（ふしゅ）」＝むくみ。心臓・腎臓の病気でも起こる。足を高くするのが基本のケア。","noteEn":"浮腫 (fushu) = swelling. It can come from heart or kidney disease. Elevating the legs is basic care.","gapTerm":"浮腫","termRuby":"浮腫《ふしゅ》","easyJaRuby":"むくみ","noteJaRuby":"「浮腫《ふしゅ》」＝むくみ。心臓《しんぞう》・腎臓《じんぞう》の病気《びょうき》でも起《お》こる。足《あし》を高《たか》くするのが基本《きほん》のケア。","noteEnRuby":"浮腫《ふしゅ》 (fushu) = swelling. It can come from heart or kidney disease. Elevating the legs is basic care."},{"id":"KV082","term":"骨粗鬆症","kana":"こつそしょうしょう","romaji":"kotsusoshōshō","english":"osteoporosis","easyJa":"骨がスカスカになって折れやすくなる病気","englishDesc":"A disease in which bones become weak and break easily.","exampleJa":"骨粗鬆症の利用者は、転倒による骨折に注意する。","exampleEn":"Users with osteoporosis need care against fractures from falls.","exampleRuby":"骨粗鬆症《こつそしょうしょう》の利用者《りようしゃ》は、転倒《てんとう》による骨折《こっせつ》に注意《ちゅうい》する。","exampleGapRuby":"{{GAP}}の利用者《りようしゃ》は、転倒《てんとう》による骨折《こっせつ》に注意《ちゅうい》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"発達と老化の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「骨粗鬆症（こつそしょうしょう）」は読みが難しい。女性・高齢者に多い。大腿骨頸部骨折とセットで出る。","noteEn":"Read こつそしょうしょう. Common in older women; often paired with femoral neck fracture.","gapTerm":"骨粗鬆症","termRuby":"骨粗鬆症《こつそしょうしょう》","easyJaRuby":"骨《ほね》がスカスカになって折《お》れやすくなる病気《びょうき》","noteJaRuby":"「骨粗鬆症《こつそしょうしょう》」は読《よ》みが難《むずか》しい。女性《じょせい》・高齢者《こうれいしゃ》に多《おお》い。大腿骨頸部骨折《だいたいこつけいぶこっせつ》とセットで出《で》る。","noteEnRuby":""},{"id":"KV083","term":"認知症","kana":"にんちしょう","romaji":"ninchishō","english":"dementia","easyJa":"脳の病気で、記憶や考える力が難しくなること","englishDesc":"A brain disease that makes memory and thinking difficult.","exampleJa":"認知症の周辺症状（BPSD）への対応。","exampleEn":"Responding to the behavioural and psychological symptoms of dementia (BPSD).","exampleRuby":"認知症《にんちしょう》の周辺症状《しゅうへんしょうじょう》（BPSD）への対応《たいおう》。","exampleGapRuby":"{{GAP}}の周辺症状《しゅうへんしょうじょう》（BPSD）への対応《たいおう》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"中核症状（記憶障害など・必ず出る）と周辺症状＝BPSD（人によって違う）を区別する。","noteEn":"Distinguish core symptoms (always present, e.g. memory loss) from BPSD (varies by person).","gapTerm":"認知症","termRuby":"認知症《にんちしょう》","easyJaRuby":"脳《のう》の病気《びょうき》で、記憶《きおく》や考《かんが》える力《ちから》が難《むずか》しくなること","noteJaRuby":"中核症状《ちゅうかくしょうじょう》（記憶障害《きおくしょうがい》など・必《かなら》ず出《で》る）と周辺症状《しゅうへんしょうじょう》＝BPSD（人《ひと》によって違《ちが》う）を区別《くべつ》する。","noteEnRuby":""},{"id":"KV084","term":"失禁","kana":"しっきん","romaji":"shikkin","english":"incontinence","easyJa":"トイレまで間に合わず、漏れること","englishDesc":"Not being able to hold urine or stool until reaching the toilet.","exampleJa":"尿失禁のある利用者への排泄ケア。","exampleEn":"Toileting care for a user with urinary incontinence.","exampleRuby":"尿失禁《にょうしっきん》のある利用者《りようしゃ》への排泄《はいせつ》ケア。","exampleGapRuby":"尿《にょう》{{GAP}}のある利用者《りようしゃ》への排泄《はいせつ》ケア。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「失禁」は本人の責任ではない。「尿失禁」には腹圧性・切迫性などの種類がある。","noteEn":"Incontinence is not the person's fault. Types include stress and urge incontinence.","gapTerm":"失禁","termRuby":"失禁《しっきん》","easyJaRuby":"トイレまで間《ま》に合《あ》わず、漏《も》れること","noteJaRuby":"「失禁《しっきん》」は本人《ほんにん》の責任《せきにん》ではない。「尿失禁《にょうしっきん》」には腹圧性《ふくあつせい》・切迫性《せっぱくせい》などの種類《しゅるい》がある。","noteEnRuby":""},{"id":"KV085","term":"便秘","kana":"べんぴ","romaji":"benpi","english":"constipation","easyJa":"うんちが何日も出ないこと","englishDesc":"Not passing stool for several days.","exampleJa":"便秘を予防するために食物繊維を多くとる。","exampleEn":"Eat more dietary fibre to prevent constipation.","exampleRuby":"便秘《べんぴ》を予防《よぼう》するために食物繊維《しょくもつせんい》を多《おお》くとる。","exampleGapRuby":"{{GAP}}を予防《よぼう》するために食物繊維《しょくもつせんい》を多《おお》くとる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「便秘」の予防は水分・食物繊維・運動。下剤に頼る選択肢は不適切になりやすい。","noteEn":"Prevention: fluids, fibre, exercise. Options that rely on laxatives are usually incorrect.","gapTerm":"便秘","termRuby":"便秘《べんぴ》","easyJaRuby":"うんちが何日《なんにち》も出《で》ないこと","noteJaRuby":"「便秘《べんぴ》」の予防《よぼう》は水分《すいぶん》・食物繊維《しょくもつせんい》・運動《うんどう》。下剤《げざい》に頼《たよ》る選択肢《せんたくし》は不適切《ふてきせつ》になりやすい。","noteEnRuby":""},{"id":"KV086","term":"脱水","kana":"だっすい","romaji":"dassui","english":"dehydration","easyJa":"体の中の水分が足りなくなること","englishDesc":"When the body does not have enough water.","exampleJa":"夏場は脱水症状に注意して水分補給を行う。","exampleEn":"Provide fluids in summer, watching for signs of dehydration.","exampleRuby":"夏場《なつば》は脱水症状《だっすいしょうじょう》に注意《ちゅうい》して水分補給《すいぶんほきゅう》を行《おこな》う。","exampleGapRuby":"夏場《なつば》は{{GAP}}症状《しょうじょう》に注意《ちゅうい》して水分補給《すいぶんほきゅう》を行《おこな》う。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"高齢者は喉の渇きを感じにくいため脱水になりやすい。この理由を問う問題が頻出。","noteEn":"Older people feel thirst less, so they dehydrate easily. This reason is often tested.","gapTerm":"脱水","termRuby":"脱水《だっすい》","easyJaRuby":"体《からだ》の中《なか》の水分《すいぶん》が足《た》りなくなること","noteJaRuby":"高齢者《こうれいしゃ》は喉《のど》の渇《かわ》きを感《かん》じにくいため脱水《だっすい》になりやすい。この理由《りゆう》を問《と》う問題《もんだい》が頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV087","term":"徘徊","kana":"はいかい","romaji":"haikai","english":"wandering","easyJa":"目的なく外や家の中を歩き回ること","englishDesc":"Walking around inside or outside without a clear purpose.","exampleJa":"夜間に徘徊する利用者への安全対策。","exampleEn":"Safety measures for a user who wanders at night.","exampleRuby":"夜間《やかん》に徘徊《はいかい》する利用者《りようしゃ》への安全対策《あんぜんたいさく》。","exampleGapRuby":"夜間《やかん》に{{GAP}}する利用者《りようしゃ》への安全対策《あんぜんたいさく》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「徘徊」は本人には目的がある場合が多い。止めるより、安全を確保して理由を探すのが原則。","noteEn":"The person usually has a reason. The rule is to secure safety and find the reason, not to stop them.","gapTerm":"徘徊","termRuby":"徘徊《はいかい》","easyJaRuby":"目的《もくてき》なく外《そと》や家《いえ》の中《なか》を歩《ある》き回《まわ》ること","noteJaRuby":"「徘徊《はいかい》」は本人《ほんにん》には目的《もくてき》がある場合《ばあい》が多《おお》い。止《と》めるより、安全《あんぜん》を確保《かくほ》して理由《りゆう》を探《さが》すのが原則《げんそく》。","noteEnRuby":""},{"id":"KV088","term":"白内障","kana":"はくないしょう","romaji":"hakunaishō","english":"cataract","easyJa":"目の中が白く濁って、前が見えにくくなる病気","englishDesc":"An eye disease in which the lens becomes cloudy and vision blurs.","exampleJa":"白内障の利用者は、段差が見えにくいため注意する。","exampleEn":"Users with cataracts need care because steps are hard to see.","exampleRuby":"白内障《はくないしょう》の利用者《りようしゃ》は、段差《だんさ》が見《み》えにくいため注意《ちゅうい》する。","exampleGapRuby":"{{GAP}}の利用者《りようしゃ》は、段差《だんさ》が見《み》えにくいため注意《ちゅうい》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"発達と老化の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「白内障」（水晶体が白く濁る）と「緑内障」（視野が狭くなる）を混同しない。","noteEn":"白内障 (clouded lens) vs 緑内障 (narrowing field of vision) — do not mix them up.","gapTerm":"白内障","termRuby":"白内障《はくないしょう》","easyJaRuby":"目《め》の中《なか》が白《しろ》く濁《にご》って、前《まえ》が見《み》えにくくなる病気《びょうき》","noteJaRuby":"「白内障《はくないしょう》」（水晶体《すいしょうたい》が白《しろ》く濁《にご》る）と「緑内障《りょくないしょう》」（視野《しや》が狭《せま》くなる）を混同《こんどう》しない。","noteEnRuby":"白内障《はくないしょう》 (clouded lens) vs 緑内障《りょくないしょう》 (narrowing field of vision) — do not mix them up."},{"id":"KV089","term":"パーキンソン病","kana":"ぱーきんそんびょう","romaji":"pākinsonbyō","english":"Parkinson's disease","easyJa":"手足が震えたり、動きが硬くなる脳の病気","englishDesc":"A brain disease causing shaking hands and stiff movements.","exampleJa":"パーキンソン病の症状として「すくみ足」がある。","exampleEn":"\"Freezing of gait\" is a symptom of Parkinson's disease.","exampleRuby":"パーキンソン病《びょう》の症状《しょうじょう》として「すくみ足《あし》」がある。","exampleGapRuby":"{{GAP}}の症状《しょうじょう》として「すくみ足《あし》」がある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"四大症状は「振戦・固縮・無動・姿勢反射障害」。パーキンソン「病」と「症候群」は別。","noteEn":"Four main signs: tremor, rigidity, akinesia, postural instability. Disease ≠ syndrome.","gapTerm":"パーキンソン病","termRuby":"パーキンソン病《びょう》","easyJaRuby":"手足《てあし》が震《ふる》えたり、動《うご》きが硬《かた》くなる脳《のう》の病気《びょうき》","noteJaRuby":"四大症状《よんだいしょうじょう》は「振戦《しんせん》・固縮《こしゅく》・無動《むどう》・姿勢反射障害《しせいはんしゃしょうがい》」。パーキンソン「病《びょう》」と「症候群《しょうこうぐん》」は別《べつ》。","noteEnRuby":""},{"id":"KV090","term":"頻尿","kana":"ひんにょう","romaji":"hinnyō","english":"frequent urination","easyJa":"おしっこに行く回数がとても多いこと","englishDesc":"Needing to pass urine very often.","exampleJa":"夜間頻尿により、睡眠不足になっている利用者。","exampleEn":"A user who lacks sleep because of frequent night-time urination.","exampleRuby":"夜間頻尿《やかんひんにょう》により、睡眠不足《すいみんぶそく》になっている利用者《りようしゃ》。","exampleGapRuby":"夜間《やかん》{{GAP}}により、睡眠不足《すいみんぶそく》になっている利用者《りようしゃ》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「頻尿」（回数が多い）と「多尿」（量が多い）は違う。夜間頻尿は転倒リスクにつながる。","noteEn":"頻尿 = frequent; 多尿 = large volume. Night-time frequency raises the risk of falls.","gapTerm":"頻尿","termRuby":"頻尿《ひんにょう》","easyJaRuby":"おしっこに行《い》く回数《かいすう》がとても多《おお》いこと","noteJaRuby":"「頻尿《ひんにょう》」（回数《かいすう》が多《おお》い）と「多尿《たにょう》」（量《りょう》が多《おお》い）は違《ちが》う。夜間頻尿《やかんひんにょう》は転倒《てんとう》リスクにつながる。","noteEnRuby":"頻尿《ひんにょう》 = frequent; 多尿《たにょう》 = large volume. Night-time frequency raises the risk of falls."},{"id":"KV091","term":"疾患","kana":"しっかん","romaji":"shikkan","english":"disease / illness","easyJa":"病気のこと","englishDesc":"An illness or disease.","exampleJa":"次のうち、生活習慣病に該当する疾患を選びなさい。","exampleEn":"Choose the disease that is classified as a lifestyle-related disease.","exampleRuby":"次《つぎ》のうち、生活習慣病《せいかつしゅうかんびょう》に該当《がいとう》する疾患《しっかん》を選《えら》びなさい。","exampleGapRuby":"次《つぎ》のうち、生活習慣病《せいかつしゅうかんびょう》に該当《がいとう》する{{GAP}}を選《えら》びなさい。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「疾患」は書き言葉。「病気」の硬い言い方。「疾病（しっぺい）」もほぼ同義。","noteEn":"疾患 is the formal written word for illness. 疾病 (shippei) means much the same.","gapTerm":"疾患","termRuby":"疾患《しっかん》","easyJaRuby":"病気《びょうき》のこと","noteJaRuby":"「疾患《しっかん》」は書《か》き言葉《ことば》。「病気《びょうき》」の硬《かた》い言《い》い方《かた》。「疾病《しっぺい》」もほぼ同義《どうぎ》。","noteEnRuby":"疾患《しっかん》 is the formal written word for illness. 疾病《しっぺい》 (shippei) means much the same."},{"id":"KV092","term":"幻覚","kana":"げんかく","romaji":"genkaku","english":"hallucination","easyJa":"本当はないものが見えたり、聞こえたりすること","englishDesc":"Seeing or hearing something that is not really there.","exampleJa":"レビー小体型認知症の症状として幻覚が見られる。","exampleEn":"Hallucinations are seen as a symptom of dementia with Lewy bodies.","exampleRuby":"レビー小体型認知症《しょうたいがたにんちしょう》の症状《しょうじょう》として幻覚《げんかく》が見《み》られる。","exampleGapRuby":"レビー小体型認知症《しょうたいがたにんちしょう》の症状《しょうじょう》として{{GAP}}が見《み》られる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「幻覚」（見える・聞こえる）と「妄想」（事実でないことを信じる）は別。レビー小体型は幻視が特徴。","noteEn":"幻覚 (seeing/hearing) is not 妄想 (false belief). Lewy body dementia features visual hallucinations.","gapTerm":"幻覚","termRuby":"幻覚《げんかく》","easyJaRuby":"本当《ほんとう》はないものが見《み》えたり、聞《き》こえたりすること","noteJaRuby":"「幻覚《げんかく》」（見《み》える・聞《き》こえる）と「妄想《もうそう》」（事実《じじつ》でないことを信《しん》じる）は別《べつ》。レビー小体型《しょうたいがた》は幻視《げんし》が特徴《とくちょう》。","noteEnRuby":"幻覚《げんかく》 (seeing/hearing) is not 妄想《もうそう》 (false belief). Lewy body dementia features visual hallucinations."},{"id":"KV093","term":"脳梗塞","kana":"のうこうそく","romaji":"nōkōsoku","english":"cerebral infarction","easyJa":"脳の血管が詰まって、細胞が死んでしまう病気","englishDesc":"A disease in which a blood vessel in the brain becomes blocked.","exampleJa":"脳梗塞の後遺症として右片麻痺がある。","exampleEn":"Right hemiplegia remains as an after-effect of cerebral infarction.","exampleRuby":"脳梗塞《のうこうそく》の後遺症《こういしょう》として右片麻痺《みぎかたまひ》がある。","exampleGapRuby":"{{GAP}}の後遺症《こういしょう》として右片麻痺《みぎかたまひ》がある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「脳梗塞」（詰まる）と「脳出血」（破れる）は別。合わせて「脳血管障害」。","noteEn":"脳梗塞 (blocked) vs 脳出血 (ruptured). Together they are called cerebrovascular disease.","gapTerm":"脳梗塞","termRuby":"脳梗塞《のうこうそく》","easyJaRuby":"脳《のう》の血管《けっかん》が詰《つ》まって、細胞《さいぼう》が死《し》んでしまう病気《びょうき》","noteJaRuby":"「脳梗塞《のうこうそく》」（詰《つ》まる）と「脳出血《のうしゅっけつ》」（破《やぶ》れる）は別《べつ》。合《あ》わせて「脳血管障害《のうけっかんしょうがい》」。","noteEnRuby":"脳梗塞《のうこうそく》 (blocked) vs 脳出血《のうしゅっけつ》 (ruptured). Together they are called cerebrovascular disease."},{"id":"KV094","term":"糖尿病","kana":"とうにょうびょう","romaji":"tōnyōbyō","english":"diabetes","easyJa":"血液の中の砂糖（血糖値）が高くなる病気","englishDesc":"A disease in which blood sugar stays high.","exampleJa":"糖尿病の利用者は、食事のカロリー制限がある。","exampleEn":"Users with diabetes have calorie restrictions in their meals.","exampleRuby":"糖尿病《とうにょうびょう》の利用者《りようしゃ》は、食事《しょくじ》のカロリー制限《せいげん》がある。","exampleGapRuby":"{{GAP}}の利用者《りようしゃ》は、食事《しょくじ》のカロリー制限《せいげん》がある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"低血糖（冷や汗・ふるえ）は緊急。糖尿病の合併症（網膜症・腎症・神経障害）も頻出。","noteEn":"Hypoglycaemia (sweating, trembling) is an emergency. Complications: retinopathy, nephropathy, neuropathy.","gapTerm":"糖尿病","termRuby":"糖尿病《とうにょうびょう》","easyJaRuby":"血液《けつえき》の中《なか》の砂糖《さとう》（血糖値《けっとうち》）が高《たか》くなる病気《びょうき》","noteJaRuby":"低血糖《ていけっとう》（冷《ひ》や汗《あせ》・ふるえ）は緊急《きんきゅう》。糖尿病《とうにょうびょう》の合併症《がっぺいしょう》（網膜症《もうまくしょう》・腎症《じんしょう》・神経障害《しんけいしょうがい》）も頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV095","term":"高血圧","kana":"こうけつあつ","romaji":"kōketsuatsu","english":"high blood pressure","easyJa":"血圧がずっと高い病気","englishDesc":"A condition in which blood pressure stays high.","exampleJa":"高血圧を予防するために塩分を控える。","exampleEn":"Reduce salt to prevent high blood pressure.","exampleRuby":"高血圧《こうけつあつ》を予防《よぼう》するために塩分《えんぶん》を控《ひか》える。","exampleGapRuby":"{{GAP}}を予防《よぼう》するために塩分《えんぶん》を控《ひか》える。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「高血圧」は自覚症状が出にくい。入浴前後の血圧変動（ヒートショック）も問われる。","noteEn":"High blood pressure often has no symptoms. Bathing-related pressure swings (heat shock) are also tested.","gapTerm":"高血圧","termRuby":"高血圧《こうけつあつ》","easyJaRuby":"血圧《けつあつ》がずっと高《たか》い病気《びょうき》","noteJaRuby":"「高血圧《こうけつあつ》」は自覚症状《じかくしょうじょう》が出《で》にくい。入浴前後《にゅうよくぜんご》の血圧変動《けつあつへんどう》（ヒートショック）も問《と》われる。","noteEnRuby":""},{"id":"KV096","term":"肺炎","kana":"はいえん","romaji":"haien","english":"pneumonia","easyJa":"肺にばい菌が入って、熱が出たり苦しくなる病気","englishDesc":"An illness in which the lungs become infected, causing fever and hard breathing.","exampleJa":"高齢者は誤嚥によって肺炎を起こしやすい。","exampleEn":"Older people easily develop pneumonia through aspiration.","exampleRuby":"高齢者《こうれいしゃ》は誤嚥《ごえん》によって肺炎《はいえん》を起《お》こしやすい。","exampleGapRuby":"高齢者《こうれいしゃ》は誤嚥《ごえん》によって{{GAP}}を起《お》こしやすい。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"高齢者の肺炎は熱が出ないこともある。「元気がない」だけのことも多い点が問われる。","noteEn":"In older people pneumonia may cause no fever — only low energy. This point is frequently tested.","gapTerm":"肺炎","termRuby":"肺炎《はいえん》","easyJaRuby":"肺《はい》にばい菌《きん》が入《はい》って、熱《ねつ》が出《で》たり苦《くる》しくなる病気《びょうき》","noteJaRuby":"高齢者《こうれいしゃ》の肺炎《はいえん》は熱《ねつ》が出《で》ないこともある。「元気《げんき》がない」だけのことも多《おお》い点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV097","term":"関節リウマチ","kana":"かんせつりうまち","romaji":"kansetsuriumachi","english":"rheumatoid arthritis","easyJa":"関節が痛くなったり、形が変わったりする病気","englishDesc":"A disease in which joints hurt and change shape.","exampleJa":"関節リウマチの利用者は、朝にこわばりがある。","exampleEn":"Users with rheumatoid arthritis have stiffness in the morning.","exampleRuby":"関節《かんせつ》リウマチの利用者《りようしゃ》は、朝《あさ》にこわばりがある。","exampleGapRuby":"{{GAP}}の利用者《りようしゃ》は、朝《あさ》にこわばりがある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"朝のこわばりが特徴。介助は本人のペースに合わせ、痛みのある関節を強く動かさない。","noteEn":"Morning stiffness is typical. Assist at the person's pace and never force a painful joint.","gapTerm":"関節リウマチ","termRuby":"関節《かんせつ》リウマチ","easyJaRuby":"関節《かんせつ》が痛《いた》くなったり、形《かたち》が変《か》わったりする病気《びょうき》","noteJaRuby":"朝《あさ》のこわばりが特徴《とくちょう》。介助《かいじょ》は本人《ほんにん》のペースに合《あ》わせ、痛《いた》みのある関節《かんせつ》を強《つよ》く動《うご》かさない。","noteEnRuby":""},{"id":"KV098","term":"緑内障","kana":"りょくないしょう","romaji":"ryokunaishō","english":"glaucoma","easyJa":"目の神経が悪くなり、見える範囲が狭くなる病気","englishDesc":"An eye disease in which the field of vision becomes narrow.","exampleJa":"緑内障が進行すると、視野が狭くなる。","exampleEn":"As glaucoma progresses, the field of vision narrows.","exampleRuby":"緑内障《りょくないしょう》が進行《しんこう》すると、視野《しや》が狭《せま》くなる。","exampleGapRuby":"{{GAP}}が進行《しんこう》すると、視野《しや》が狭《せま》くなる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"発達と老化の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「緑内障」は視野が欠ける。失われた視野は戻らない。白内障との違いを必ず整理する。","noteEn":"Lost visual field does not come back. Always contrast it with cataract.","gapTerm":"緑内障","termRuby":"緑内障《りょくないしょう》","easyJaRuby":"目《め》の神経《しんけい》が悪《わる》くなり、見《み》える範囲《はんい》が狭《せま》くなる病気《びょうき》","noteJaRuby":"「緑内障《りょくないしょう》」は視野《しや》が欠《か》ける。失《うしな》われた視野《しや》は戻《もど》らない。白内障《はくないしょう》との違《ちが》いを必《かなら》ず整理《せいり》する。","noteEnRuby":""},{"id":"KV099","term":"不眠","kana":"ふみん","romaji":"fumin","english":"insomnia","easyJa":"夜、なかなか眠れなかったり、すぐ起きてしまうこと","englishDesc":"Not being able to sleep well at night.","exampleJa":"夜間の不眠が続いている利用者への対応。","exampleEn":"Responding to a user with continuing insomnia at night.","exampleRuby":"夜間《やかん》の不眠《ふみん》が続《つづ》いている利用者《りようしゃ》への対応《たいおう》。","exampleGapRuby":"夜間《やかん》の{{GAP}}が続《つづ》いている利用者《りようしゃ》への対応《たいおう》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"不眠の対応はまず生活リズム（日中の活動・光）を整える。すぐ薬という選択肢は不適切。","noteEn":"First adjust daily rhythm (daytime activity, light). Options that go straight to medication are wrong.","gapTerm":"不眠","termRuby":"不眠《ふみん》","easyJaRuby":"夜《よる》、なかなか眠《ねむ》れなかったり、すぐ起《お》きてしまうこと","noteJaRuby":"不眠《ふみん》の対応《たいおう》はまず生活《せいかつ》リズム（日中《にっちゅう》の活動《かつどう》・光《ひかり》）を整《ととの》える。すぐ薬《くすり》という選択肢《せんたくし》は不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV100","term":"難聴","kana":"なんちょう","romaji":"nanchō","english":"hearing loss","easyJa":"耳が遠くなる、音が聞こえにくくなること","englishDesc":"When hearing becomes weak.","exampleJa":"加齢性難聴の利用者には、低い声でゆっくり話す。","exampleEn":"For users with age-related hearing loss, speak slowly in a low voice.","exampleRuby":"加齢性難聴《かれいせいなんちょう》の利用者《りようしゃ》には、低《ひく》い声《こえ》でゆっくり話《はな》す。","exampleGapRuby":"加齢性《かれいせい》{{GAP}}の利用者《りようしゃ》には、低《ひく》い声《こえ》でゆっくり話《はな》す。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"発達と老化の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"加齢性難聴は「高い音」が聞こえにくい。だから「低い声でゆっくり」が正解。大声は不適切。","noteEn":"Age-related loss affects HIGH tones, so speak in a LOW voice slowly. Shouting is incorrect.","gapTerm":"難聴","termRuby":"難聴《なんちょう》","easyJaRuby":"耳《みみ》が遠《とお》くなる、音《おと》が聞《き》こえにくくなること","noteJaRuby":"加齢性難聴《かれいせいなんちょう》は「高《たか》い音《おと》」が聞《き》こえにくい。だから「低《ひく》い声《こえ》でゆっくり」が正解《せいかい》。大声《おおごえ》は不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV101","term":"せん妄","kana":"せんもう","romaji":"senmō","english":"delirium","easyJa":"急に頭が混乱して、幻覚が見えたり暴れたりすること","englishDesc":"Sudden confusion with hallucinations or restlessness.","exampleJa":"環境の変化により、夜間にせん妄が現れた。","exampleEn":"Delirium appeared at night because of the change of environment.","exampleRuby":"環境《かんきょう》の変化《へんか》により、夜間《やかん》にせん妄《もう》が現《あらわ》れた。","exampleGapRuby":"環境《かんきょう》の変化《へんか》により、夜間《やかん》に{{GAP}}が現《あらわ》れた。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「せん妄」は急に起こり、治ることがある。「認知症」はゆっくり進む。この違いが最頻出。","noteEn":"Delirium starts suddenly and can resolve; dementia develops slowly. This contrast is heavily tested.","gapTerm":"せん妄","termRuby":"せん妄《もう》","easyJaRuby":"急《きゅう》に頭《あたま》が混乱《こんらん》して、幻覚《げんかく》が見《み》えたり暴《あば》れたりすること","noteJaRuby":"「せん妄《もう》」は急《きゅう》に起《お》こり、治《なお》ることがある。「認知症《にんちしょう》」はゆっくり進《すす》む。この違《ちが》いが最頻出《さいひんしゅつ》。","noteEnRuby":""},{"id":"KV102","term":"うつ病","kana":"うつびょう","romaji":"utsubyō","english":"depression","easyJa":"気分がひどく落ち込んで、何もしたくなくなる病気","englishDesc":"An illness in which mood is very low and the person loses interest.","exampleJa":"高齢者のうつ病の症状に関する説明として正しいもの。","exampleEn":"Choose the correct description of depression in older people.","exampleRuby":"高齢者《こうれいしゃ》のうつ病《びょう》の症状《しょうじょう》に関《かん》する説明《せつめい》として正《ただ》しいもの。","exampleGapRuby":"高齢者《こうれいしゃ》の{{GAP}}の症状《しょうじょう》に関《かん》する説明《せつめい》として正《ただ》しいもの。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"高齢者のうつは「もの忘れ」に見えることがあり、認知症と間違えやすい（仮性認知症）。","noteEn":"Depression in older people can look like memory loss and be mistaken for dementia (pseudodementia).","gapTerm":"うつ病","termRuby":"うつ病《びょう》","easyJaRuby":"気分《きぶん》がひどく落《お》ち込《こ》んで、何《なに》もしたくなくなる病気《びょうき》","noteJaRuby":"高齢者《こうれいしゃ》のうつは「もの忘《わす》れ」に見《み》えることがあり、認知症《にんちしょう》と間違《まちが》えやすい（仮性認知症《かせいにんちしょう》）。","noteEnRuby":""},{"id":"KV103","term":"疼痛","kana":"とうつう","romaji":"tōtsū","english":"pain","easyJa":"痛み（ズキズキ痛むことなど）","englishDesc":"Pain, especially aching pain in the body.","exampleJa":"関節リウマチによる疼痛を和らげる。","exampleEn":"Relieve the pain caused by rheumatoid arthritis.","exampleRuby":"関節《かんせつ》リウマチによる疼痛《とうつう》を和《やわ》らげる。","exampleGapRuby":"関節《かんせつ》リウマチによる{{GAP}}を和《やわ》らげる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「疼痛（とうつう）」は書き言葉。痛みは主観的なもので、本人の訴えを尊重する。","noteEn":"Read とうつう. Pain is subjective; the person's own report must be respected.","gapTerm":"疼痛","termRuby":"疼痛《とうつう》","easyJaRuby":"痛《いた》み（ズキズキ痛《いた》むことなど）","noteJaRuby":"「疼痛《とうつう》」は書《か》き言葉《ことば》。痛《いた》みは主観的《しゅかんてき》なもので、本人《ほんにん》の訴《うった》えを尊重《そんちょう》する。","noteEnRuby":""},{"id":"KV104","term":"嘔吐","kana":"おうと","romaji":"ōto","english":"vomiting","easyJa":"胃の中にあるものを口から吐き出してしまうこと","englishDesc":"Bringing up what is in the stomach through the mouth.","exampleJa":"ノロウイルスに感染し、激しい嘔吐が見られる。","exampleEn":"Severe vomiting is seen after infection with norovirus.","exampleRuby":"ノロウイルスに感染《かんせん》し、激《はげ》しい嘔吐《おうと》が見《み》られる。","exampleGapRuby":"ノロウイルスに感染《かんせん》し、激《はげ》しい{{GAP}}が見《み》られる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"嘔吐物の処理は使い捨て手袋・マスク・エプロン、次亜塩素酸ナトリウム。アルコールは効かない。","noteEn":"Clean vomit with disposable gloves, mask and apron, using sodium hypochlorite. Alcohol does not work.","gapTerm":"嘔吐","termRuby":"嘔吐《おうと》","easyJaRuby":"胃《い》の中《なか》にあるものを口《くち》から吐《は》き出《だ》してしまうこと","noteJaRuby":"嘔吐物《おうとぶつ》の処理《しょり》は使《つか》い捨《す》て手袋《てぶくろ》・マスク・エプロン、次亜塩素酸《じあえんそさん》ナトリウム。アルコールは効《き》かない。","noteEnRuby":""},{"id":"KV105","term":"発熱","kana":"はつねつ","romaji":"hatsunetsu","english":"fever","easyJa":"熱が出ること、体温が高くなること","englishDesc":"When body temperature becomes higher than normal.","exampleJa":"肺炎の症状として、咳と発熱がある。","exampleEn":"Cough and fever are symptoms of pneumonia.","exampleRuby":"肺炎《はいえん》の症状《しょうじょう》として、咳《せき》と発熱《はつねつ》がある。","exampleGapRuby":"肺炎《はいえん》の症状《しょうじょう》として、咳《せき》と{{GAP}}がある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"高齢者は発熱しにくいので、平熱を知っておくことが重要。「微熱」でも重症のことがある。","noteEn":"Older people may not develop fever, so knowing their normal temperature matters. Even a slight fever can be serious.","gapTerm":"発熱","termRuby":"発熱《はつねつ》","easyJaRuby":"熱《ねつ》が出《で》ること、体温《たいおん》が高《たか》くなること","noteJaRuby":"高齢者《こうれいしゃ》は発熱《はつねつ》しにくいので、平熱《へいねつ》を知《し》っておくことが重要《じゅうよう》。「微熱《びねつ》」でも重症《じゅうしょう》のことがある。","noteEnRuby":""},{"id":"KV106","term":"下痢","kana":"げり","romaji":"geri","english":"diarrhea","easyJa":"うんちが水のようにシャビシャビになること","englishDesc":"Passing very watery stool.","exampleJa":"下痢が続いているため、脱水に注意する。","exampleEn":"Because diarrhoea continues, watch carefully for dehydration.","exampleRuby":"下痢《げり》が続《つづ》いているため、脱水《だっすい》に注意《ちゅうい》する。","exampleGapRuby":"{{GAP}}が続《つづ》いているため、脱水《だっすい》に注意《ちゅうい》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"下痢が続くと脱水になる。感染性の可能性があるため、排泄物の処理に注意する。","noteEn":"Ongoing diarrhoea causes dehydration. Treat the stool as possibly infectious.","gapTerm":"下痢","termRuby":"下痢《げり》","easyJaRuby":"うんちが水《みず》のようにシャビシャビになること","noteJaRuby":"下痢《げり》が続《つづ》くと脱水《だっすい》になる。感染性《かんせんせい》の可能性《かのうせい》があるため、排泄物《はいせつぶつ》の処理《しょり》に注意《ちゅうい》する。","noteEnRuby":""},{"id":"KV107","term":"喘息","kana":"ぜんそく","romaji":"zensoku","english":"asthma","easyJa":"呼吸の通り道が狭くなり、息が苦しくなる病気","englishDesc":"A disease in which the airways narrow and breathing becomes hard.","exampleJa":"気管支喘息の発作が起きたときの対応。","exampleEn":"How to respond when an asthma attack occurs.","exampleRuby":"気管支喘息《きかんしぜんそく》の発作《ほっさ》が起《お》きたときの対応《たいおう》。","exampleGapRuby":"気管支《きかんし》{{GAP}}の発作《ほっさ》が起《お》きたときの対応《たいおう》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"発作時は「起座位（座る姿勢）」が楽。寝かせるのは不適切。","noteEn":"During an attack, sitting upright makes breathing easier. Laying the person flat is incorrect.","gapTerm":"喘息","termRuby":"喘息《ぜんそく》","easyJaRuby":"呼吸《こきゅう》の通《とお》り道《みち》が狭《せま》くなり、息《いき》が苦《くる》しくなる病気《びょうき》","noteJaRuby":"発作時《ほっさじ》は「起座位《きざい》（座《すわ》る姿勢《しせい》）」が楽《らく》。寝《ね》かせるのは不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV108","term":"大腿骨","kana":"だいたいこつ","romaji":"daitaikotsu","english":"femur / thigh bone","easyJa":"太ももの中にある、人間の体で一番大きな骨","englishDesc":"The thigh bone, the largest bone in the human body.","exampleJa":"転倒により大腿骨頸部を骨折した。","exampleEn":"The neck of the femur was fractured in a fall.","exampleRuby":"転倒《てんとう》により大腿骨頸部《だいたいこつけいぶ》を骨折《こっせつ》した。","exampleGapRuby":"転倒《てんとう》により{{GAP}}頸部《けいぶ》を骨折《こっせつ》した。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「大腿骨頸部骨折」は転倒による代表的な骨折。寝たきりのきっかけになりやすい。","noteEn":"Femoral neck fracture is the classic fall injury and often leads to being bedridden.","gapTerm":"大腿骨","termRuby":"大腿骨《だいたいこつ》","easyJaRuby":"太《ふと》ももの中《なか》にある、人間《にんげん》の体《からだ》で一番大《いちばんおお》きな骨《ほね》","noteJaRuby":"「大腿骨頸部骨折《だいたいこつけいぶこっせつ》」は転倒《てんとう》による代表的《だいひょうてき》な骨折《こっせつ》。寝《ね》たきりのきっかけになりやすい。","noteEnRuby":""},{"id":"KV109","term":"不穏","kana":"ふおん","romaji":"fuon","english":"restlessness / agitation","easyJa":"気持ちが落ち着かず、ソワソワしたり怒りっぽくなる","englishDesc":"Being restless, unsettled or easily angered.","exampleJa":"夕方になると認知症の利用者が不穏になる。","exampleEn":"The user with dementia becomes restless in the evening.","exampleRuby":"夕方《ゆうがた》になると認知症《にんちしょう》の利用者《りようしゃ》が不穏《ふおん》になる。","exampleGapRuby":"夕方《ゆうがた》になると認知症《にんちしょう》の利用者《りようしゃ》が{{GAP}}になる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"夕方に強くなるものを「夕暮れ症候群」という。原因（痛み・空腹・不安）を探すのが原則。","noteEn":"When it worsens in the evening it is called sundowning. Look for causes: pain, hunger, anxiety.","gapTerm":"不穏","termRuby":"不穏《ふおん》","easyJaRuby":"気持《きも》ちが落《お》ち着《つ》かず、ソワソワしたり怒《おこ》りっぽくなる","noteJaRuby":"夕方《ゆうがた》に強《つよ》くなるものを「夕暮《ゆうぐ》れ症候群《しょうこうぐん》」という。原因《げんいん》（痛《いた》み・空腹《くうふく》・不安《ふあん》）を探《さが》すのが原則《げんそく》。","noteEnRuby":""},{"id":"KV110","term":"構音障害","kana":"こうおんしょうがい","romaji":"kōonshōgai","english":"articulation disorder","easyJa":"舌や口がうまく動かず、発音が正しくできない状態","englishDesc":"Not being able to pronounce words clearly because the mouth or tongue does not move well.","exampleJa":"脳梗塞の後遺症で、構音障害がある。","exampleEn":"There is an articulation disorder as an after-effect of cerebral infarction.","exampleRuby":"脳梗塞《のうこうそく》の後遺症《こういしょう》で、構音障害《こうおんしょうがい》がある。","exampleGapRuby":"脳梗塞《のうこうそく》の後遺症《こういしょう》で、{{GAP}}がある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"構音障害では「言葉は理解できる」。ゆっくり話してもらい、閉じられた質問を使うと良い。","noteEn":"The person still understands language. Let them speak slowly and use closed questions.","gapTerm":"構音障害","termRuby":"構音障害《こうおんしょうがい》","easyJaRuby":"舌《した》や口《くち》がうまく動《うご》かず、発音《はつおん》が正《ただ》しくできない状態《じょうたい》","noteJaRuby":"構音障害《こうおんしょうがい》では「言葉《ことば》は理解《りかい》できる」。ゆっくり話《はな》してもらい、閉《と》じられた質問《しつもん》を使《つか》うと良《よ》い。","noteEnRuby":""},{"id":"KV111","term":"感染症","kana":"かんせんしょう","romaji":"kansenshō","english":"infectious disease","easyJa":"ウイルスや細菌が体に入って起こる病気","englishDesc":"An illness caused by viruses or bacteria entering the body.","exampleJa":"施設内での感染症の拡大を防ぐ。","exampleEn":"Prevent the spread of infectious disease inside the facility.","exampleRuby":"施設内《しせつない》での感染症《かんせんしょう》の拡大《かくだい》を防《ふせ》ぐ。","exampleGapRuby":"施設内《しせつない》での{{GAP}}の拡大《かくだい》を防《ふせ》ぐ。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"医療的ケア","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"感染の三要素は「感染源・感染経路・宿主」。経路を断つのが最も現実的。","noteEn":"The three elements are source, route and host. Cutting the route is the most practical measure.","gapTerm":"感染症","termRuby":"感染症《かんせんしょう》","easyJaRuby":"ウイルスや細菌《さいきん》が体《からだ》に入《はい》って起《お》こる病気《びょうき》","noteJaRuby":"感染《かんせん》の三要素《さんようそ》は「感染源《かんせんげん》・感染経路《かんせんけいろ》・宿主《しゅくしゅ》」。経路《けいろ》を断《た》つのが最《もっと》も現実的《げんじつてき》。","noteEnRuby":""},{"id":"KV112","term":"統合失調症","kana":"とうごうしっちょうしょう","romaji":"tōgōshitchōshō","english":"schizophrenia","easyJa":"幻覚が見えたり、考えがまとまらなくなる精神の病気","englishDesc":"A mental illness with hallucinations and disordered thinking.","exampleJa":"統合失調症の陽性症状について。","exampleEn":"About the positive symptoms of schizophrenia.","exampleRuby":"統合失調症《とうごうしっちょうしょう》の陽性症状《ようせいしょうじょう》について。","exampleGapRuby":"{{GAP}}の陽性症状《ようせいしょうじょう》について。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"陽性症状（幻覚・妄想）と陰性症状（意欲低下）を区別する。","noteEn":"Distinguish positive symptoms (hallucinations, delusions) from negative symptoms (loss of motivation).","gapTerm":"統合失調症","termRuby":"統合失調症《とうごうしっちょうしょう》","easyJaRuby":"幻覚《げんかく》が見《み》えたり、考《かんが》えがまとまらなくなる精神《せいしん》の病気《びょうき》","noteJaRuby":"陽性症状《ようせいしょうじょう》（幻覚《げんかく》・妄想《もうそう》）と陰性症状《いんせいしょうじょう》（意欲低下《いよくていか》）を区別《くべつ》する。","noteEnRuby":""},{"id":"KV113","term":"廃用症候群","kana":"はいようしょうこうぐん","romaji":"haiyōshōkōgun","english":"disuse syndrome","easyJa":"動かないことで、体や脳の機能が落ちてしまうこと","englishDesc":"Weakening of body and mind caused by not moving for a long time.","exampleJa":"寝たきりによる廃用症候群を予防する。","exampleEn":"Prevent disuse syndrome caused by staying in bed.","exampleRuby":"寝《ね》たきりによる廃用症候群《はいようしょうこうぐん》を予防《よぼう》する。","exampleGapRuby":"寝《ね》たきりによる{{GAP}}を予防《よぼう》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「廃用症候群」は使わないことで起こる。予防は離床と生活の中の活動。","noteEn":"Disuse syndrome comes from NOT using the body. Prevention is getting out of bed and daily activity.","gapTerm":"廃用症候群","termRuby":"廃用症候群《はいようしょうこうぐん》","easyJaRuby":"動《うご》かないことで、体《からだ》や脳《のう》の機能《きのう》が落《お》ちてしまうこと","noteJaRuby":"「廃用症候群《はいようしょうこうぐん》」は使《つか》わないことで起《お》こる。予防《よぼう》は離床《りしょう》と生活《せいかつ》の中《なか》の活動《かつどう》。","noteEnRuby":""},{"id":"KV114","term":"覚醒","kana":"かくせい","romaji":"kakusei","english":"arousal / wakefulness","easyJa":"目がしっかりと覚めていること","englishDesc":"Being awake and alert.","exampleJa":"日中の覚醒を促すためにレクリエーションに参加する。","exampleEn":"Take part in recreation to encourage daytime wakefulness.","exampleRuby":"日中《にっちゅう》の覚醒《かくせ
