"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"バイタルは体温・脈拍・呼吸・血圧（＋意識）。入浴前の測定は中止判断のため。","noteEn":"Vitals are temperature, pulse, respiration, blood pressure (and consciousness). Measured to decide whether bathing is safe.","gapTerm":"バイタルサイン","termRuby":"バイタルサイン","easyJaRuby":"体温《たいおん》、脈拍《みゃくはく》、血圧《けつあつ》、呼吸《こきゅう》など「生《い》きているサイン」","noteJaRuby":"バイタルは体温《たいおん》・脈拍《みゃくはく》・呼吸《こきゅう》・血圧《けつあつ》（＋意識《いしき》）。入浴前《にゅうよくまえ》の測定《そくてい》は中止判断《ちゅうしはんだん》のため。","noteEnRuby":""},{"id":"KV168","term":"服薬","kana":"ふくやく","romaji":"fukuyaku","english":"taking medicine","easyJa":"薬を飲むこと","englishDesc":"Taking medicine.","exampleJa":"食後に服薬したか、利用者の口の中を確認する。","exampleEn":"Check inside the user's mouth to confirm the medicine was taken after the meal.","exampleRuby":"食後《しょくご》に服薬《ふくやく》したか、利用者《りようしゃ》の口《くち》の中《なか》を確認《かくにん》する。","exampleGapRuby":"食後《しょくご》に{{GAP}}したか、利用者《りようしゃ》の口《くち》の中《なか》を確認《かくにん》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介護職は「服薬介助」はできるが「与薬の判断」はできない。飲み込んだ確認まで行う。","noteEn":"Care workers may assist with taking medicine but cannot decide dosing. Confirm it was swallowed.","gapTerm":"服薬","termRuby":"服薬《ふくやく》","easyJaRuby":"薬《くすり》を飲《の》むこと","noteJaRuby":"介護職《かいごしょく》は「服薬介助《ふくやくかいじょ》」はできるが「与薬《よやく》の判断《はんだん》」はできない。飲《の》み込《こ》んだ確認《かくにん》まで行《おこな》う。","noteEnRuby":""},{"id":"KV169","term":"水分補給","kana":"すいぶんほきゅう","romaji":"suibunhokyū","english":"hydration","easyJa":"水やお茶などを飲んで、体の水分を足すこと","englishDesc":"Drinking water so the body does not run short of it.","exampleJa":"おやつの時間に、こまめな水分補給を行う。","exampleEn":"Provide frequent fluids at snack time.","exampleRuby":"おやつの時間《じかん》に、こまめな水分補給《すいぶんほきゅう》を行《おこな》う。","exampleGapRuby":"おやつの時間《じかん》に、こまめな{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"1日の目安は約1,000〜1,500ml。一度に大量ではなく「こまめに」が原則。","noteEn":"About 1,000–1,500 ml a day. The rule is little and often, not a large amount at once.","gapTerm":"水分補給","termRuby":"水分補給《すいぶんほきゅう》","easyJaRuby":"水《みず》やお茶《ちゃ》などを飲《の》んで、体《からだ》の水分《すいぶん》を足《た》すこと","noteJaRuby":"1日《にち》の目安《めやす》は約《やく》1,000〜1,500ml。一度《いちど》に大量《たいりょう》ではなく「こまめに」が原則《げんそく》。","noteEnRuby":""},{"id":"KV170","term":"手浴","kana":"しゅよく","romaji":"shuyoku","english":"hand bath","easyJa":"手だけをお湯につけて洗ったり温めたりすること","englishDesc":"Putting only the hands in warm water.","exampleJa":"リラックス効果を促すために手浴を実施する。","exampleEn":"Carry out a hand bath to help the user relax.","exampleRuby":"リラックス効果《こうか》を促《うなが》すために手浴《しゅよく》を実施《じっし》する。","exampleGapRuby":"リラックス効果《こうか》を促《うなが》すために{{GAP}}を実施《じっし》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"手浴・足浴は「部分浴」。入浴できない日でも清潔とリラックスを保てる。","noteEn":"Hand and foot baths are partial baths, keeping the person clean and relaxed on non-bathing days.","gapTerm":"手浴","termRuby":"手浴《しゅよく》","easyJaRuby":"手《て》だけをお湯《ゆ》につけて洗《あら》ったり温《あたた》めたりすること","noteJaRuby":"手浴《しゅよく》・足浴《そくよく》は「部分浴《ぶぶんよく》」。入浴《にゅうよく》できない日《にち》でも清潔《せいけつ》とリラックスを保《たも》てる。","noteEnRuby":""},{"id":"KV171","term":"洗身","kana":"せんしん","romaji":"senshin","english":"washing the body","easyJa":"お風呂で体を洗うこと","englishDesc":"Washing the body.","exampleJa":"洗身介助では、心臓から遠い足先から洗い始める。","exampleEn":"In washing assistance, start from the feet, far from the heart.","exampleRuby":"洗身介助《せんしんかいじょ》では、心臓《しんぞう》から遠《とお》い足先《あしさき》から洗《あら》い始《はじ》める。","exampleGapRuby":"{{GAP}}介助《かいじょ》では、心臓《しんぞう》から遠《とお》い足先《あしさき》から洗《あら》い始《はじ》める。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"洗身は末梢（足先）から中枢へ。急に湯をかけると血圧が変動するので注意。","noteEn":"Wash from the extremities toward the centre. Sudden hot water changes blood pressure.","gapTerm":"洗身","termRuby":"洗身《せんしん》","easyJaRuby":"お風呂《ふろ》で体《からだ》を洗《あら》うこと","noteJaRuby":"洗身《せんしん》は末梢《まっしょう》（足先《あしさき》）から中枢《ちゅうすう》へ。急《きゅう》に湯《ゆ》をかけると血圧《けつあつ》が変動《へんどう》するので注意《ちゅうい》。","noteEnRuby":""},{"id":"KV172","term":"嚥下体操","kana":"えんげたいそう","romaji":"engetaisō","english":"swallowing exercises","easyJa":"飲み込む力をつけるための、口や首の体操","englishDesc":"Exercises done before meals to prepare for swallowing.","exampleJa":"食事の前に、全員で嚥下体操を行う。","exampleEn":"Everyone does swallowing exercises before the meal.","exampleRuby":"食事《しょくじ》の前《まえ》に、全員《ぜんいん》で嚥下体操《えんげたいそう》を行《おこな》う。","exampleGapRuby":"食事《しょくじ》の前《まえ》に、全員《ぜんいん》で{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"嚥下体操は食前に行う。食後に行うものではない点が問われる。","noteEn":"These are done BEFORE the meal, not after — a common exam point.","gapTerm":"嚥下体操","termRuby":"嚥下体操《えんげたいそう》","easyJaRuby":"飲《の》み込《こ》む力《ちから》をつけるための、口《くち》や首《くび》の体操《たいそう》","noteJaRuby":"嚥下体操《えんげたいそう》は食前《しょくぜん》に行《おこな》う。食後《しょくご》に行《おこな》うものではない点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV173","term":"記録","kana":"きろく","romaji":"kiroku","english":"recording / documentation","easyJa":"利用者の様子や介護の内容を紙やパソコンに書くこと","englishDesc":"Writing down what happened and what was done.","exampleJa":"介護記録は、客観的に書く。","exampleEn":"Care records should be written objectively.","exampleRuby":"介護記録《かいごきろく》は、客観的《きゃっかんてき》に書《か》く。","exampleGapRuby":"介護《かいご》{{GAP}}は、客観的《きゃっかんてき》に書《か》く。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"記録は「事実」と「解釈」を分ける。「〜のようだ」ではなく観察した事実を書く。記録は開示請求の対象。","noteEn":"Separate facts from interpretation. Records can be disclosed on request.","gapTerm":"記録","termRuby":"記録《きろく》","easyJaRuby":"利用者《りようしゃ》の様子《ようす》や介護《かいご》の内容《ないよう》を紙《かみ》やパソコンに書《か》くこと","noteJaRuby":"記録《きろく》は「事実《じじつ》」と「解釈《かいしゃく》」を分《わ》ける。「〜のようだ」ではなく観察《かんさつ》した事実《じじつ》を書《か》く。記録《きろく》は開示請求《かいじせいきゅう》の対象《たいしょう》。","noteEnRuby":""},{"id":"KV174","term":"申し送り","kana":"もうしおくり","romaji":"mōshiokuri","english":"handover / shift report","easyJa":"仕事を交代する時、次の人に必要な情報を伝えること","englishDesc":"Telling the next shift about the user's condition.","exampleJa":"夜勤者から日勤者へ、利用者の変化を申し送りする。","exampleEn":"The night shift hands over changes in the user to the day shift.","exampleRuby":"夜勤者《やきんしゃ》から日勤者《にっきんしゃ》へ、利用者《りようしゃ》の変化《へんか》を申《もう》し送《おく》りする。","exampleGapRuby":"夜勤者《やきんしゃ》から日勤者《にっきんしゃ》へ、利用者《りようしゃ》の変化《へんか》を{{GAP}}する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"申し送りは「変化があったこと」を優先。個人情報のため場所に配慮する。","noteEn":"Prioritise what changed. Because it involves personal information, mind where you do it.","gapTerm":"申し送り","termRuby":"申《もう》し送《おく》り","easyJaRuby":"仕事《しごと》を交代《こうたい》する時《とき》、次《つぎ》の人《ひと》に必要《ひつよう》な情報《じょうほう》を伝《つた》えること","noteJaRuby":"申《もう》し送《おく》りは「変化《へんか》があったこと」を優先《ゆうせん》。個人情報《こじんじょうほう》のため場所《ばしょ》に配慮《はいりょ》する。","noteEnRuby":""},{"id":"KV175","term":"仰臥位","kana":"ぎょうがい","romaji":"gyōgai","english":"supine position","easyJa":"仰向け（天井を向いて上向きに寝る姿勢）","englishDesc":"Lying face up on the back.","exampleJa":"ベッド上で仰臥位になってもらう。","exampleEn":"Have the user lie in the supine position on the bed.","exampleRuby":"ベッド上《じょう》で仰臥位《ぎょうがい》になってもらう。","exampleGapRuby":"ベッド上《じょう》で{{GAP}}になってもらう。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「仰臥位（ぎょうがい）」＝上向き。仙骨部に圧が集中し褥瘡ができやすい。","noteEn":"Read ぎょうがい (face up). Pressure concentrates on the sacrum, so pressure ulcers form easily.","gapTerm":"仰臥位","termRuby":"仰臥位《ぎょうがい》","easyJaRuby":"仰向《あおむ》け（天井《てんじょう》を向《む》いて上向《うわむ》きに寝《ね》る姿勢《しせい》）","noteJaRuby":"「仰臥位《ぎょうがい》」＝上向《うわむ》き。仙骨部《せんこつぶ》に圧《あつ》が集中《しゅうちゅう》し褥瘡《じょくそう》ができやすい。","noteEnRuby":""},{"id":"KV176","term":"腹臥位","kana":"ふくがい","romaji":"fukugai","english":"prone position","easyJa":"うつぶせ（お腹を下にして寝る姿勢）","englishDesc":"Lying face down on the stomach.","exampleJa":"腹臥位は胸が圧迫されて呼吸が苦しくなりやすい。","exampleEn":"The prone position presses the chest and makes breathing harder.","exampleRuby":"腹臥位《ふくがい》は胸《むね》が圧迫《あっぱく》されて呼吸《こきゅう》が苦《くる》しくなりやすい。","exampleGapRuby":"{{GAP}}は胸《むね》が圧迫《あっぱく》されて呼吸《こきゅう》が苦《くる》しくなりやすい。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「腹臥位」は高齢者には負担が大きい。呼吸・循環への影響を問う問題が出る。","noteEn":"The prone position is hard on older people. Questions ask about its effect on breathing and circulation.","gapTerm":"腹臥位","termRuby":"腹臥位《ふくがい》","easyJaRuby":"うつぶせ（お腹《なか》を下《した》にして寝《ね》る姿勢《しせい》）","noteJaRuby":"「腹臥位《ふくがい》」は高齢者《こうれいしゃ》には負担《ふたん》が大《おお》きい。呼吸《こきゅう》・循環《じゅんかん》への影響《えいきょう》を問《と》う問題《もんだい》が出《で》る。","noteEnRuby":""},{"id":"KV177","term":"入浴介助","kana":"にゅうよくかいじょ","romaji":"nyūyokukaijo","english":"bathing assistance","easyJa":"お風呂に入るのを手伝うこと","englishDesc":"Helping a person to bathe.","exampleJa":"安全に配慮して入浴介助を行う。","exampleEn":"Provide bathing assistance with attention to safety.","exampleRuby":"安全《あんぜん》に配慮《はいりょ》して入浴介助《にゅうよくかいじょ》を行《おこな》う。","exampleGapRuby":"安全《あんぜん》に配慮《はいりょ》して{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"入浴は血圧が変動しやすい。湯温は約40度、入浴時間は10〜15分、食直後・空腹時は避ける。","noteEn":"Bathing swings blood pressure. About 40°C, 10–15 minutes; avoid right after meals or when hungry.","gapTerm":"入浴介助","termRuby":"入浴介助《にゅうよくかいじょ》","easyJaRuby":"お風呂《ふろ》に入《はい》るのを手伝《てつだ》うこと","noteJaRuby":"入浴《にゅうよく》は血圧《けつあつ》が変動《へんどう》しやすい。湯温《ゆおん》は約《やく》40度《ど》、入浴時間《にゅうよくじかん》は10〜15分《ふん》、食直後《しょくちょくご》・空腹時《くうふくじ》は避《さ》ける。","noteEnRuby":""},{"id":"KV178","term":"おむつ交換","kana":"おむつこうかん","romaji":"omutsukōkan","english":"diaper change","easyJa":"汚れたおむつを新しいものに替えること","englishDesc":"Changing a used diaper for a clean one.","exampleJa":"食事の直前や直後のおむつ交換は避ける。","exampleEn":"Avoid changing diapers just before or just after a meal.","exampleRuby":"食事《しょくじ》の直前《ちょくぜん》や直後《ちょくご》のおむつ交換《こうかん》は避《さ》ける。","exampleGapRuby":"食事《しょくじ》の直前《ちょくぜん》や直後《ちょくご》の{{GAP}}は避《さ》ける。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"食事の直前・直後のおむつ交換は不適切（食欲・衛生の面）。プライバシーの確保も必須。","noteEn":"Changing right before or after meals is incorrect, for appetite and hygiene reasons.","gapTerm":"おむつ交換","termRuby":"おむつ交換《こうかん》","easyJaRuby":"汚《よご》れたおむつを新《あたら》しいものに替《か》えること","noteJaRuby":"食事《しょくじ》の直前《ちょくぜん》・直後《ちょくご》のおむつ交換《こうかん》は不適切《ふてきせつ》（食欲《しょくよく》・衛生《えいせい》の面《めん》）。プライバシーの確保《かくほ》も必須《ひっす》。","noteEnRuby":""},{"id":"KV179","term":"誘導","kana":"ゆうどう","romaji":"yūdō","english":"guiding / leading","easyJa":"目的の場所まで案内して連れて行くこと","englishDesc":"Showing or leading a person to a place.","exampleJa":"尿意があるため、トイレへ誘導する。","exampleEn":"Because the user feels the urge to urinate, guide them to the toilet.","exampleRuby":"尿意《にょうい》があるため、トイレへ誘導《ゆうどう》する。","exampleGapRuby":"尿意《にょうい》があるため、トイレへ{{GAP}}する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「誘導」は本人が動くのを導くこと。無理に連れて行く「連行」ではない。","noteEn":"誘導 means guiding the person as they move — never forcing them along.","gapTerm":"誘導","termRuby":"誘導《ゆうどう》","easyJaRuby":"目的《もくてき》の場所《ばしょ》まで案内《あんない》して連《つ》れて行《い》くこと","noteJaRuby":"「誘導《ゆうどう》」は本人《ほんにん》が動《うご》くのを導《みちび》くこと。無理《むり》に連《つ》れて行《い》く「連行《れんこう》」ではない。","noteEnRuby":"誘導《ゆうどう》 means guiding the person as they move — never forcing them along."},{"id":"KV180","term":"安否確認","kana":"あんぴかくにん","romaji":"anpikakunin","english":"safety check","easyJa":"利用者が無事かを確認すること","englishDesc":"Checking that a person is safe and well.","exampleJa":"訪問介護員が独居高齢者の安否確認を行う。","exampleEn":"The home helper checks on the safety of an older person living alone.","exampleRuby":"訪問介護員《ほうもんかいごいん》が独居高齢者《どっきょこうれいしゃ》の安否確認《あんぴかくにん》を行《おこな》う。","exampleGapRuby":"訪問介護員《ほうもんかいごいん》が独居高齢者《どっきょこうれいしゃ》の{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"独居高齢者の安否確認は地域包括ケアの一部。応答がない場合の手順が問われる。","noteEn":"Checking on people living alone is part of community-based care. Procedures for no response are tested.","gapTerm":"安否確認","termRuby":"安否確認《あんぴかくにん》","easyJaRuby":"利用者《りようしゃ》が無事《ぶじ》かを確認《かくにん》すること","noteJaRuby":"独居高齢者《どっきょこうれいしゃ》の安否確認《あんぴかくにん》は地域包括《ちいきほうかつ》ケアの一部《いちぶ》。応答《おうとう》がない場合《ばあい》の手順《てじゅん》が問《と》われる。","noteEnRuby":""},{"id":"KV181","term":"換気","kana":"かんき","romaji":"kanki","english":"ventilation","easyJa":"窓を開けて、部屋の空気を入れ替えること","englishDesc":"Letting fresh air into a room.","exampleJa":"感染予防のため、定期的に部屋の換気を行う。","exampleEn":"Ventilate the room regularly to prevent infection.","exampleRuby":"感染予防《かんせんよぼう》のため、定期的《ていきてき》に部屋《へや》の換気《かんき》を行《おこな》う。","exampleGapRuby":"感染予防《かんせんよぼう》のため、定期的《ていきてき》に部屋《へや》の{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"換気は感染対策の基本。冬でも定期的に行い、利用者が寒くないよう配慮する。","noteEn":"Ventilation is basic infection control. Do it even in winter, keeping users warm.","gapTerm":"換気","termRuby":"換気《かんき》","easyJaRuby":"窓《まど》を開《あ》けて、部屋《へや》の空気《くうき》を入《い》れ替《か》えること","noteJaRuby":"換気《かんき》は感染対策《かんせんたいさく》の基本《きほん》。冬《ふゆ》でも定期的《ていきてき》に行《おこな》い、利用者《りようしゃ》が寒《さむ》くないよう配慮《はいりょ》する。","noteEnRuby":""},{"id":"KV182","term":"消毒","kana":"しょうどく","romaji":"shōdoku","english":"disinfection","easyJa":"薬を使って、ばい菌やウイルスを殺すこと","englishDesc":"Killing germs with chemicals.","exampleJa":"嘔吐物を片付けた後、次亜塩素酸ナトリウムで消毒する。","exampleEn":"After cleaning up vomit, disinfect with sodium hypochlorite.","exampleRuby":"嘔吐物《おうとぶつ》を片付《かたづ》けた後《あと》、次亜塩素酸《じあえんそさん》ナトリウムで消毒《しょうどく》する。","exampleGapRuby":"嘔吐物《おうとぶつ》を片付《かたづ》けた後《あと》、次亜塩素酸《じあえんそさん》ナトリウムで{{GAP}}する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"ノロウイルスにはアルコールが効かない。次亜塩素酸ナトリウムを使う点が頻出。","noteEn":"Alcohol does not work on norovirus — sodium hypochlorite is required. Heavily tested.","gapTerm":"消毒","termRuby":"消毒《しょうどく》","easyJaRuby":"薬《くすり》を使《つか》って、ばい菌《きん》やウイルスを殺《ころ》すこと","noteJaRuby":"ノロウイルスにはアルコールが効《き》かない。次亜塩素酸《じあえんそさん》ナトリウムを使《つか》う点《てん》が頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV183","term":"体重測定","kana":"たいじゅうそくてい","romaji":"taijūsokutei","english":"weight measurement","easyJa":"体重（体の重さ）をはかること","englishDesc":"Measuring how heavy a person is.","exampleJa":"栄養状態を把握するため、毎月体重測定を行う。","exampleEn":"Weigh users every month to understand their nutritional condition.","exampleRuby":"栄養状態《えいようじょうたい》を把握《はあく》するため、毎月体重測定《まいつきたいじゅうそくてい》を行《おこな》う。","exampleGapRuby":"栄養状態《えいようじょうたい》を把握《はあく》するため、毎月《まいつき》{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"体重減少は低栄養のサイン。1か月で3%以上の減少は要注意。","noteEn":"Weight loss signals undernutrition. A loss of 3% or more in a month needs attention.","gapTerm":"体重測定","termRuby":"体重測定《たいじゅうそくてい》","easyJaRuby":"体重《たいじゅう》（体《からだ》の重《おも》さ）をはかること","noteJaRuby":"体重減少《たいじゅうげんしょう》は低栄養《ていえいよう》のサイン。1か月《つき》で3%以上《いじょう》の減少《げんしょう》は要注意《ようちゅうい》。","noteEnRuby":""},{"id":"KV184","term":"姿勢保持","kana":"しせいほじ","romaji":"shiseihoji","english":"posture maintenance","easyJa":"座ったり立ったりするポーズをキープすること","englishDesc":"Keeping the body in a good, stable position.","exampleJa":"車いすでの正しい姿勢保持をサポートする。","exampleEn":"Support correct posture maintenance in the wheelchair.","exampleRuby":"車《くるま》いすでの正《ただ》しい姿勢保持《しせいほじ》をサポートする。","exampleGapRuby":"車《くるま》いすでの正《ただ》しい{{GAP}}をサポートする。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"姿勢保持は「シーティング」ともいう。ずり落ちを防ぐのは拘束ではなくクッションで対応。","noteEn":"Also called seating. Prevent sliding with cushions, never with restraints.","gapTerm":"姿勢保持","termRuby":"姿勢保持《しせいほじ》","easyJaRuby":"座《すわ》ったり立《た》ったりするポーズをキープすること","noteJaRuby":"姿勢保持《しせいほじ》は「シーティング」ともいう。ずり落《お》ちを防《ふせ》ぐのは拘束《こうそく》ではなくクッションで対応《たいおう》。","noteEnRuby":""},{"id":"KV185","term":"ラポール","kana":"らぽーる","romaji":"rapōru","english":"rapport","easyJa":"お互いに信頼し合っている良い関係のこと","englishDesc":"A relationship of trust and comfort between two people.","exampleJa":"利用者との間にラポールを形成する。","exampleEn":"Form a rapport with the user.","exampleRuby":"利用者《りようしゃ》との間《あいだ》にラポールを形成《けいせい》する。","exampleGapRuby":"利用者《りようしゃ》との間《あいだ》に{{GAP}}を形成《けいせい》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「ラポール」は信頼関係。形成には時間がかかり、受容・傾聴・共感が土台。","noteEn":"Rapport takes time and is built on acceptance, attentive listening and empathy.","gapTerm":"ラポール","termRuby":"ラポール","easyJaRuby":"お互《たが》いに信頼《しんらい》し合《あ》っている良《よ》い関係《かんけい》のこと","noteJaRuby":"「ラポール」は信頼関係《しんらいかんけい》。形成《けいせい》には時間《じかん》がかかり、受容《じゅよう》・傾聴《けいちょう》・共感《きょうかん》が土台《どだい》。","noteEnRuby":""},{"id":"KV186","term":"非言語的","kana":"ひげんごてき","romaji":"higengoteki","english":"non-verbal","easyJa":"言葉を使わないこと（表情、身振り、視線など）","englishDesc":"Communication without words, such as expression and touch.","exampleJa":"笑顔で接するなど、非言語的コミュニケーションを用いる。","exampleEn":"Use non-verbal communication, such as a smile.","exampleRuby":"笑顔《えがお》で接《せっ》するなど、非言語的《ひげんごてき》コミュニケーションを用《もち》いる。","exampleGapRuby":"笑顔《えがお》で接《せっ》するなど、{{GAP}}コミュニケーションを用《もち》いる。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"非言語のほうが伝わる情報は多い。認知症の人には特に有効。","noteEn":"Non-verbal channels carry more information, and are especially effective with people with dementia.","gapTerm":"非言語的","termRuby":"非言語的《ひげんごてき》","easyJaRuby":"言葉《ことば》を使《つか》わないこと（表情《ひょうじょう》、身振《みぶ》り、視線《しせん》など）","noteJaRuby":"非言語《ひげんご》のほうが伝《つた》わる情報《じょうほう》は多《おお》い。認知症《にんちしょう》の人《ひと》には特《とく》に有効《ゆうこう》。","noteEnRuby":""},{"id":"KV187","term":"自己実現","kana":"じこじつげん","romaji":"jikojitsugen","english":"self-actualization","easyJa":"自分の夢や目標を叶えて、自分らしく生きること","englishDesc":"Becoming the person you truly want to be.","exampleJa":"マズローの欲求階層説における自己実現の欲求。","exampleEn":"The need for self-actualisation in Maslow's hierarchy of needs.","exampleRuby":"マズローの欲求階層説《よっきゅうかいそうせつ》における自己実現《じこじつげん》の欲求《よっきゅう》。","exampleGapRuby":"マズローの欲求階層説《よっきゅうかいそうせつ》における{{GAP}}の欲求《よっきゅう》。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"マズローの5段階は 生理的→安全→所属と愛→承認→自己実現。順番を問う問題が出る。","noteEn":"Maslow's five levels: physiological → safety → belonging → esteem → self-actualisation. Order is tested.","gapTerm":"自己実現","termRuby":"自己実現《じこじつげん》","easyJaRuby":"自分《じぶん》の夢《ゆめ》や目標《もくひょう》を叶《かな》えて、自分《じぶん》らしく生《い》きること","noteJaRuby":"マズローの5段階《だんかい》は 生理的《せいりてき》→安全《あんぜん》→所属《しょぞく》と愛《あい》→承認《しょうにん》→自己実現《じこじつげん》。順番《じゅんばん》を問《と》う問題《もんだい》が出《で》る。","noteEnRuby":""},{"id":"KV188","term":"ペーシング","kana":"ぺーしんぐ","romaji":"pēshingu","english":"pacing","easyJa":"話すスピードや声の大きさを、相手のペースに合わせること","englishDesc":"Matching your speed and tone to the other person.","exampleJa":"認知症利用者に対してペーシングを行う。","exampleEn":"Use pacing with a user who has dementia.","exampleRuby":"認知症利用者《にんちしょうりようしゃ》に対《たい》してペーシングを行《おこな》う。","exampleGapRuby":"認知症利用者《にんちしょうりようしゃ》に対《たい》して{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"認知症の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"ペーシングは相手の速さに合わせること。急かす対応は不適切。","noteEn":"Pacing means matching the person's speed. Rushing them is incorrect.","gapTerm":"ペーシング","termRuby":"ペーシング","easyJaRuby":"話《はな》すスピードや声《こえ》の大《おお》きさを、相手《あいて》のペースに合《あ》わせること","noteJaRuby":"ペーシングは相手《あいて》の速《はや》さに合《あ》わせること。急《せ》かす対応《たいおう》は不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV189","term":"防衛機制","kana":"ぼうえいきせい","romaji":"bōeikisei","english":"defense mechanism","easyJa":"心のストレスや不安から自分を守ろうとする無意識の働き","englishDesc":"An unconscious way the mind protects itself from stress.","exampleJa":"失敗を他人のせいにするのは防衛機制の一つである。","exampleEn":"Blaming others for a failure is one type of defence mechanism.","exampleRuby":"失敗《しっぱい》を他人《たにん》のせいにするのは防衛機制《ぼうえいきせい》の一《ひと》つである。","exampleGapRuby":"失敗《しっぱい》を他人《たにん》のせいにするのは{{GAP}}の一《ひと》つである。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"代表的な防衛機制：抑圧・投影・合理化・退行。名称と例を結ぶ問題が出る。","noteEn":"Common types: repression, projection, rationalisation, regression. Matching names to examples is tested.","gapTerm":"防衛機制","termRuby":"防衛機制《ぼうえいきせい》","easyJaRuby":"心《こころ》のストレスや不安《ふあん》から自分《じぶん》を守《まも》ろうとする無意識《むいしき》の働《はたら》き","noteJaRuby":"代表的《だいひょうてき》な防衛機制《ぼうえいきせい》：抑圧《よくあつ》・投影《とうえい》・合理化《ごうりか》・退行《たいこう》。名称《めいしょう》と例《れい》を結《むす》ぶ問題《もんだい》が出《で》る。","noteEnRuby":""},{"id":"KV190","term":"視線","kana":"しせん","romaji":"shisen","english":"line of sight / gaze","easyJa":"目の向いている方向、どこを見ているか","englishDesc":"The direction a person is looking.","exampleJa":"利用者と同じ高さに視線を合わせる。","exampleEn":"Match your eye level with the user's.","exampleRuby":"利用者《りようしゃ》と同《おな》じ高《たか》さに視線《しせん》を合《あ》わせる。","exampleGapRuby":"利用者《りようしゃ》と同《おな》じ高《たか》さに{{GAP}}を合《あ》わせる。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"立ったまま見下ろすのは威圧的。同じ高さに視線を合わせるのが原則。","noteEn":"Looking down while standing feels threatening. Match eye level.","gapTerm":"視線","termRuby":"視線《しせん》","easyJaRuby":"目《め》の向《む》いている方向《ほうこう》、どこを見《み》ているか","noteJaRuby":"立《た》ったまま見下《みお》ろすのは威圧的《いあつてき》。同《おな》じ高《たか》さに視線《しせん》を合《あ》わせるのが原則《げんそく》。","noteEnRuby":""},{"id":"KV191","term":"相づち","kana":"あいづち","romaji":"aizuchi","english":"nodding / brief responses","easyJa":"相手の話を聞きながら「はい」「そうですね」と反応すること","englishDesc":"Short responses such as \"yes\" or \"I see\" that show you are listening.","exampleJa":"適度に相づちを打ちながら傾聴する。","exampleEn":"Listen attentively while giving appropriate brief responses.","exampleRuby":"適度《てきど》に相《あい》づちを打《う》ちながら傾聴《けいちょう》する。","exampleGapRuby":"適度《てきど》に{{GAP}}を打《う》ちながら傾聴《けいちょう》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"相づちは傾聴の技法の一つ。多すぎても話を遮るので「適度に」が正解。","noteEn":"Brief responses are a listening technique — \"in moderation\" is the correct answer.","gapTerm":"相づち","termRuby":"相《あい》づち","easyJaRuby":"相手《あいて》の話《はな》を聞《き》きながら「はい」「そうですね」と反応《はんのう》すること","noteJaRuby":"相《あい》づちは傾聴《けいちょう》の技法《ぎほう》の一《ひと》つ。多《おお》すぎても話《はな》を遮《さえぎ》るので「適度《てきど》に」が正解《せいかい》。","noteEnRuby":""},{"id":"KV192","term":"価値観","kana":"かちかん","romaji":"kachikan","english":"sense of values","easyJa":"何が大切で何が良いことかという、その人の考え方","englishDesc":"What a person believes is important in life.","exampleJa":"利用者がこれまで大切にしてきた価値観を尊重する。","exampleEn":"Respect the values the user has cherished until now.","exampleRuby":"利用者《りようしゃ》がこれまで大切《たいせつ》にしてきた価値観《かちかん》を尊重《そんちょう》する。","exampleGapRuby":"利用者《りようしゃ》がこれまで大切《たいせつ》にしてきた{{GAP}}を尊重《そんちょう》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"人間の尊厳と自立","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"価値観は人それぞれ。介護職の価値観を押しつけるのは不適切。","noteEn":"Values differ by person. Imposing the care worker's values is incorrect.","gapTerm":"価値観","termRuby":"価値観《かちかん》","easyJaRuby":"何《なに》が大切《たいせつ》で何《なに》が良《よ》いことかという、その人《ひと》の考《かんが》え方《かた》","noteJaRuby":"価値観《かちかん》は人《ひと》それぞれ。介護職《かいごしょく》の価値観《かちかん》を押《お》しつけるのは不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV193","term":"回想法","kana":"かいそうほう","romaji":"kaisōhō","english":"reminiscence therapy","easyJa":"昔の懐かしい話をして、脳を元気にする心理療法","englishDesc":"A therapy in which the person talks about memories from the past.","exampleJa":"認知症の利用者に、昔の写真を見せて回想法を実施する。","exampleEn":"Do reminiscence therapy with a user with dementia using old photographs.","exampleRuby":"認知症《にんちしょう》の利用者《りようしゃ》に、昔《むかし》の写真《しゃしん》を見《み》せて回想法《かいそうほう》を実施《じっし》する。","exampleGapRuby":"認知症《にんちしょう》の利用者《りようしゃ》に、昔《むかし》の写真《しゃしん》を見《み》せて{{GAP}}を実施《じっし》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"認知症の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"回想法は昔の記憶（長期記憶）が保たれやすいことを利用する。正確さを訂正しないのが原則。","noteEn":"It uses long-term memory, which is better preserved. Do not correct factual errors.","gapTerm":"回想法","termRuby":"回想法《かいそうほう》","easyJaRuby":"昔《むかし》の懐《なつ》かしい話《はな》をして、脳《のう》を元気《げんき》にする心理療法《しんりりょうほう》","noteJaRuby":"回想法《かいそうほう》は昔《むかし》の記憶《きおく》（長期記憶《ちょうききおく》）が保《たも》たれやすいことを利用《りよう》する。正確《せいかく》さを訂正《ていせい》しないのが原則《げんそく》。","noteEnRuby":""},{"id":"KV194","term":"タッチング","kana":"たっちんぐ","romaji":"tatchingu","english":"touching","easyJa":"利用者の手や肩に優しく触れて安心させること","englishDesc":"Communicating by gently touching the person.","exampleJa":"不安を和らげるために、タッチングを用いる。","exampleEn":"Use touching to ease anxiety.","exampleRuby":"不安《ふあん》を和《やわ》らげるために、タッチングを用《もち》いる。","exampleGapRuby":"不安《ふあん》を和《やわ》らげるために、{{GAP}}を用《もち》いる。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"タッチングは必ず声かけの後に行う。急に触れると驚かせてしまう。","noteEn":"Always speak first. Touching without warning startles the person.","gapTerm":"タッチング","termRuby":"タッチング","easyJaRuby":"利用者《りようしゃ》の手《て》や肩《かた》に優《やさ》しく触《ふ》れて安心《あんしん》させること","noteJaRuby":"タッチングは必《かなら》ず声《こえ》かけの後《あと》に行《おこな》う。急《きゅう》に触《ふ》れると驚《おどろ》かせてしまう。","noteEnRuby":""},{"id":"KV195","term":"ボディメカニクス","kana":"ぼでぃめかにくす","romaji":"bodimekanikusu","english":"body mechanics","easyJa":"骨や筋肉の仕組みを利用して、小さな力で楽に介護する技術","englishDesc":"Using the body efficiently so that care is safer and easier.","exampleJa":"ボディメカニクスを活用して腰痛を予防する。","exampleEn":"Use body mechanics to prevent back pain.","exampleRuby":"ボディメカニクスを活用《かつよう》して腰痛《ようつう》を予防《よぼう》する。","exampleGapRuby":"{{GAP}}を活用《かつよう》して腰痛《ようつう》を予防《よぼう》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"原則：支持基底面を広く、重心を低く、利用者に近づく、大きな筋群を使う、てこを使う。","noteEn":"Principles: wide base, low centre of gravity, stay close, use large muscles, use leverage.","gapTerm":"ボディメカニクス","termRuby":"ボディメカニクス","easyJaRuby":"骨《ほね》や筋肉《きんにく》の仕組《しく》みを利用《りよう》して、小《ちい》さな力《ちから》で楽《らく》に介護《かいご》する技術《ぎじゅつ》","noteJaRuby":"原則《げんそく》：支持基底面《しじきていめん》を広《ひろ》く、重心《じゅうしん》を低《ひく》く、利用者《りようしゃ》に近《ちか》づく、大《おお》きな筋群《きんぐん》を使《つか》う、てこを使《つか》う。","noteEnRuby":""},{"id":"KV196","term":"脱健着患","kana":"だっけんちゃっかん","romaji":"dakkenchakkan","english":"dressing the affected side first, undressing the healthy side first","easyJa":"服を脱ぐ時は元気な方から、着る時は麻痺がある方から行うルール","englishDesc":"Undressing the healthy side first and dressing the affected side first.","exampleJa":"片麻痺の利用者の更衣介助は、脱健着患の原則で行う。","exampleEn":"Dressing assistance for a user with hemiplegia follows this principle.","exampleRuby":"片麻痺《かたまひ》の利用者《りようしゃ》の更衣介助《こういかいじょ》は、脱健着患《だっけんちゃっかん》の原則《げんそく》で行《おこな》う。","exampleGapRuby":"片麻痺《かたまひ》の利用者《りようしゃ》の更衣介助《こういかいじょ》は、{{GAP}}の原則《げんそく》で行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「脱健着患」＝脱ぐ→健側、着る→患側。この語の順番そのものが答えになる。","noteEn":"The word itself encodes the order: undress healthy, dress affected. The order is the answer.","gapTerm":"脱健着患","termRuby":"脱健着患《だっけんちゃっかん》","easyJaRuby":"服《ふく》を脱《ぬ》ぐ時《とき》は元気《げんき》な方《ほう》から、着《き》る時《とき》は麻痺《まひ》がある方《ほう》から行《おこな》うルール","noteJaRuby":"「脱健着患《だっけんちゃっかん》」＝脱《ぬ》ぐ→健側《けんそく》、着《き》る→患側《かんそく》。この語《ご》の順番《じゅんばん》そのものが答《こた》えになる。","noteEnRuby":""},{"id":"KV197","term":"残存機能","kana":"ざんぞんきのう","romaji":"zanzonkinō","english":"residual function","easyJa":"病気や麻痺があっても、まだ自分を動かせる力","englishDesc":"The abilities a person still has.","exampleJa":"利用者の残存機能を活かした自立支援を行う。","exampleEn":"Provide self-reliance support that uses the user's remaining abilities.","exampleRuby":"利用者《りようしゃ》の残存機能《ざんぞんきのう》を活《い》かした自立支援《じりつしえん》を行《おこな》う。","exampleGapRuby":"利用者《りようしゃ》の{{GAP}}を活《い》かした自立支援《じりつしえん》を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「できないこと」ではなく「できること」に着目するのがストレングス視点。","noteEn":"Focusing on what the person CAN do is the strengths perspective.","gapTerm":"残存機能","termRuby":"残存機能《ざんぞんきのう》","easyJaRuby":"病気《びょうき》や麻痺《まひ》があっても、まだ自分《じぶん》を動《うご》かせる力《ちから》","noteJaRuby":"「できないこと」ではなく「できること」に着目《ちゃくもく》するのがストレングス視点《してん》。","noteEnRuby":""},{"id":"KV198","term":"代償する","kana":"だいしょうする","romaji":"daishōsuru","english":"to compensate","easyJa":"できないことを、別の方法や道具で補うこと","englishDesc":"To make up for a lost ability using another one.","exampleJa":"視力の低下を、聴覚や触覚で代償する。","exampleEn":"Compensate for reduced eyesight with hearing and touch.","exampleRuby":"視力《しりょく》の低下《ていか》を、聴覚《ちょうかく》や触覚《しょっかく》で代償《だいしょう》する。","exampleGapRuby":"視力《しりょく》の低下《ていか》を、聴覚《ちょうかく》や触覚《しょっかく》で{{GAP}}。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「代償」は残った機能で補うこと。「代弁」（speak for）と混同しない。","noteEn":"代償 = compensate with remaining function. Do not confuse with 代弁 (speak on behalf of).","gapTerm":"代償する","termRuby":"代償《だいしょう》する","easyJaRuby":"できないことを、別《べつ》の方法《ほうほう》や道具《どうぐ》で補《おぎな》うこと","noteJaRuby":"「代償《だいしょう》」は残《のこ》った機能《きのう》で補《おぎな》うこと。「代弁《だいべん》」（speak for）と混同《こんどう》しない。","noteEnRuby":"代償《だいしょう》 = compensate with remaining function. Do not confuse with 代弁《だいべん》 (speak on behalf of)."},{"id":"KV199","term":"洗面","kana":"せんめん","romaji":"senmen","english":"washing the face","easyJa":"顔を洗うこと","englishDesc":"Washing the face.","exampleJa":"朝起きたら、ベッド上で洗面介助を行う。","exampleEn":"After waking, give washing assistance in bed.","exampleRuby":"朝起《あさお》きたら、ベッド上《じょう》で洗面介助《せんめんかいじょ》を行《おこな》う。","exampleGapRuby":"朝起《あさお》きたら、ベッド上《じょう》で{{GAP}}介助《かいじょ》を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"洗面は整容の一部。可能なら洗面所まで移動して行うほうが生活リズムを保てる。","noteEn":"Face washing is part of grooming; doing it at the washbasin helps keep daily rhythm.","gapTerm":"洗面","termRuby":"洗面《せんめん》","easyJaRuby":"顔《かお》を洗《あら》うこと","noteJaRuby":"洗面《せんめん》は整容《せいよう》の一部《いちぶ》。可能《かのう》なら洗面所《せんめんじょ》まで移動《いどう》して行《おこな》うほうが生活《せいかつ》リズムを保《たも》てる。","noteEnRuby":""},{"id":"KV200","term":"臥床","kana":"がしょう","romaji":"gashō","english":"resting in bed / bedridden","easyJa":"ベッドに横になって寝ていること","englishDesc":"Lying in bed for a long time.","exampleJa":"長期の臥床は、筋力低下や褥瘡のリスクを高める。","exampleEn":"Long periods in bed raise the risk of muscle weakness and pressure ulcers.","exampleRuby":"長期《ちょうき》の臥床《がしょう》は、筋力低下《きんりょくていか》や褥瘡《じょくそう》のリスクを高《たか》める。","exampleGapRuby":"長期《ちょうき》の{{GAP}}は、筋力低下《きんりょくていか》や褥瘡《じょくそう》のリスクを高《たか》める。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「臥床（がしょう）」。長期臥床は廃用症候群の原因。反対は「離床」。","noteEn":"Read がしょう. Long-term bed rest causes disuse syndrome; the opposite is 離床.","gapTerm":"臥床","termRuby":"臥床《がしょう》","easyJaRuby":"ベッドに横《よこ》になって寝《ね》ていること","noteJaRuby":"「臥床《がしょう》」。長期臥床《ちょうきがしょう》は廃用症候群《はいようしょうこうぐん》の原因《げんいん》。反対《はんたい》は「離床《りしょう》」。","noteEnRuby":"Read がしょう. Long-term bed rest causes disuse syndrome; the opposite is 離床《りしょう》."},{"id":"KV201","term":"ADL","kana":"えーでぃーえる","romaji":"ēdīeru","english":"Activities of Daily Living","easyJa":"日常生活動作（食事、排泄、着替えなど生きるための基本動作）","englishDesc":"Basic daily actions such as eating, dressing, bathing and toileting.","exampleJa":"利用者のADLの低下を防ぐ支援。","exampleEn":"Support to prevent decline in the user's activities of daily living.","exampleRuby":"利用者《りようしゃ》のADLの低下《ていか》を防《ふせ》ぐ支援《しえん》。","exampleGapRuby":"利用者《りようしゃ》の{{GAP}}の低下《ていか》を防《ふせ》ぐ支援《しえん》。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"ADLは基本動作（食事・排泄・移動・入浴・更衣・整容）。IADLとの区別が頻出。","noteEn":"ADL covers basic actions. Distinguishing it from IADL is frequently tested.","gapTerm":"ADL","termRuby":"ADL","easyJaRuby":"日常生活動作《にちじょうせいかつどうさ》（食事《しょくじ》、排泄《はいせつ》、着替《きが》えなど生《い》きるための基本動作《きほんどうさ》）","noteJaRuby":"ADLは基本動作《きほんどうさ》（食事《しょくじ》・排泄《はいせつ》・移動《いどう》・入浴《にゅうよく》・更衣《こうい》・整容《せいよう》）。IADLとの区別《くべつ》が頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV202","term":"IADL","kana":"あいえーでぃーえる","romaji":"aiēdīeru","english":"Instrumental ADL","easyJa":"手段的日常生活動作（買い物、料理、電話、お金の管理など）","englishDesc":"More complex daily activities such as shopping, cooking and managing money.","exampleJa":"認知症の初期は、ADLよりもIADLから低下しやすい。","exampleEn":"In early dementia, IADL declines before ADL.","exampleRuby":"認知症《にんちしょう》の初期《しょき》は、ADLよりもIADLから低下《ていか》しやすい。","exampleGapRuby":"認知症《にんちしょう》の初期《しょき》は、ADLよりも{{GAP}}から低下《ていか》しやすい。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護過程","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"IADLは買い物・調理・服薬管理・金銭管理・電話など。認知症の初期はIADLから低下する。","noteEn":"IADL includes shopping, cooking, medication and money management. It declines first in early dementia.","gapTerm":"IADL","termRuby":"IADL","easyJaRuby":"手段的日常生活動作《しゅだんてきにちじょうせいかつどうさ》（買《か》い物《もの》、料理《りょうり》、電話《でんわ》、お金《かね》の管理《かんり》など）","noteJaRuby":"IADLは買《か》い物《もの》・調理《ちょうり》・服薬管理《ふくやくかんり》・金銭管理《きんせんかんり》・電話《でんわ》など。認知症《にんちしょう》の初期《しょき》はIADLから低下《ていか》する。","noteEnRuby":""},{"id":"KV203","term":"全介助","kana":"ぜんかいじょ","romaji":"zenkaijo","english":"total assistance","easyJa":"利用者が自分では何もできず、介護者がすべて手伝うこと","englishDesc":"The care worker does everything for the person.","exampleJa":"食事はベッド上で全介助で行う。","exampleEn":"Meals are given with total assistance in bed.","exampleRuby":"食事《しょくじ》はベッド上《じょう》で全介助《ぜんかいじょ》で行《おこな》う。","exampleGapRuby":"食事《しょくじ》はベッド上《じょう》で{{GAP}}で行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「全介助」でも本人の意思確認と声かけは必要。自立支援の視点は失わない。","noteEn":"Even with total assistance, confirm the person's wishes and speak to them. Never lose the self-reliance view.","gapTerm":"全介助","termRuby":"全介助《ぜんかいじょ》","easyJaRuby":"利用者《りようしゃ》が自分《じぶん》では何《なに》もできず、介護者《かいごしゃ》がすべて手伝《てつだ》うこと","noteJaRuby":"「全介助《ぜんかいじょ》」でも本人《ほんにん》の意思確認《いしかくにん》と声《こえ》かけは必要《ひつよう》。自立支援《じりつしえん》の視点《してん》は失《うしな》わない。","noteEnRuby":""},{"id":"KV204","term":"一部介助","kana":"いちぶかいじょ","romaji":"ichibukaijo","english":"partial assistance","easyJa":"自分でできないところだけを、介護者が手伝うこと","englishDesc":"The care worker helps with only part of the action.","exampleJa":"ズボンを上げる時だけ一部介助をする。","exampleEn":"Only when pulling up the trousers is partial assistance given.","exampleRuby":"ズボンを上《あ》げる時《とき》だけ一部介助《いちぶかいじょ》をする。","exampleGapRuby":"ズボンを上《あ》げる時《とき》だけ{{GAP}}をする。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「一部介助」は自立の度合いを示す。できる部分は必ず本人にしてもらう。","noteEn":"Partial assistance shows the level of independence. Always let the person do what they can.","gapTerm":"一部介助","termRuby":"一部介助《いちぶかいじょ》","easyJaRuby":"自分《じぶん》でできないところだけを、介護者《かいごしゃ》が手伝《てつだ》うこと","noteJaRuby":"「一部介助《いちぶかいじょ》」は自立《じりつ》の度合《どあ》いを示《しめ》す。できる部分《ぶぶん》は必《かなら》ず本人《ほんにん》にしてもらう。","noteEnRuby":""},{"id":"KV205","term":"寄り添う","kana":"よりそう","romaji":"yorisō","english":"to stay close to / to support emotionally","easyJa":"相手のそばにいて、気持ちをわかろうとすること","englishDesc":"To stay beside someone and support their feelings.","exampleJa":"悲しんでいる利用者の気持ちに寄り添う。","exampleEn":"Stay close to the feelings of a user who is grieving.","exampleRuby":"悲《かな》しんでいる利用者《りようしゃ》の気持《きも》ちに寄《よ》り添《そ》う。","exampleGapRuby":"悲《かな》しんでいる利用者《りようしゃ》の気持《きも》ちに{{GAP}}。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「寄り添う」は解決策を示すことではない。まず気持ちを受け止める。","noteEn":"It does not mean offering solutions. First accept the person's feelings.","gapTerm":"寄り添う","termRuby":"寄《よ》り添《そ》う","easyJaRuby":"相手《あいて》のそばにいて、気持《きも》ちをわかろうとすること","noteJaRuby":"「寄《よ》り添《そ》う」は解決策《かいけつさく》を示《しめ》すことではない。まず気持《きも》ちを受《う》け止《と》める。","noteEnRuby":""},{"id":"KV206","term":"ジェスチャー","kana":"じぇすちゃー","romaji":"jesuchā","english":"gesture","easyJa":"身振り手振り（手や体を使って伝えたいことを表すこと）","englishDesc":"Hand and body movements used to communicate.","exampleJa":"言葉が通じにくい時はジェスチャーを交えて話す。","exampleEn":"When words are hard to understand, speak while using gestures.","exampleRuby":"言葉《ことば》が通《つう》じにくい時《とき》はジェスチャーを交《まじ》えて話《はな》す。","exampleGapRuby":"言葉《ことば》が通《つう》じにくい時《とき》は{{GAP}}を交《まじ》えて話《はな》す。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"ジェスチャーは失語症・難聴の人に有効。子ども扱いにならない態度が大切。","noteEn":"Gestures help people with aphasia or hearing loss. Keep an adult, respectful manner.","gapTerm":"ジェスチャー","termRuby":"ジェスチャー","easyJaRuby":"身振《みぶ》り手振《てぶ》り（手《て》や体《からだ》を使《つか》って伝《つた》えたいことを表《あらわ》すこと）","noteJaRuby":"ジェスチャーは失語症《しつごしょう》・難聴《なんちょう》の人《ひと》に有効《ゆうこう》。子《こ》ども扱《あつか》いにならない態度《たいど》が大切《たいせつ》。","noteEnRuby":""},{"id":"KV207","term":"代弁する","kana":"だいべんする","romaji":"daibensuru","english":"to speak on behalf of","easyJa":"自分で意見を言えない人の代わりに、気持ちを言ってあげること","englishDesc":"To say what another person wants when they cannot say it themselves.","exampleJa":"利用者の本当の希望を、家族に対して代弁する。","exampleEn":"Speak on the user's behalf about their true wishes to the family.","exampleRuby":"利用者《りようしゃ》の本当《ほんとう》の希望《きぼう》を、家族《かぞく》に対《たい》して代弁《だいべん》する。","exampleGapRuby":"利用者《りようしゃ》の本当《ほんとう》の希望《きぼう》を、家族《かぞく》に対《たい》して{{GAP}}。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"人間の尊厳と自立","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「代弁」はアドボカシー（権利擁護）の実践。介護職の考えを言うことではない。","noteEn":"Speaking on behalf is advocacy in practice — not stating the care worker's own opinion.","gapTerm":"代弁する","termRuby":"代弁《だいべん》する","easyJaRuby":"自分《じぶん》で意見《いけん》を言《い》えない人《ひと》の代《か》わりに、気持《きも》ちを言《い》ってあげること","noteJaRuby":"「代弁《だいべん》」はアドボカシー（権利擁護《けんりようご》）の実践《じっせん》。介護職《かいごしょく》の考《かんが》えを言《い》うことではない。","noteEnRuby":""},{"id":"KV208","term":"アプローチ","kana":"あぷろーち","romaji":"apurōchi","english":"approach","easyJa":"利用者に近づいて関わること、支援のやり方","englishDesc":"The way you approach or deal with a person or problem.","exampleJa":"認知症利用者への適切なアプローチの方法。","exampleEn":"Appropriate ways to approach a user with dementia.","exampleRuby":"認知症利用者《にんちしょうりようしゃ》への適切《てきせつ》なアプローチの方法《ほうほう》。","exampleGapRuby":"認知症利用者《にんちしょうりようしゃ》への適切《てきせつ》な{{GAP}}の方法《ほうほう》。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"認知症の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「アプローチ」は方法。認知症では本人の世界を否定しないアプローチが原則。","noteEn":"Approach = method. With dementia, the rule is not to deny the person's reality.","gapTerm":"アプローチ","termRuby":"アプローチ","easyJaRuby":"利用者《りようしゃ》に近《ちか》づいて関《かか》わること、支援《しえん》のやり方《かた》","noteJaRuby":"「アプローチ」は方法《ほうほう》。認知症《にんちしょう》では本人《ほんにん》の世界《せかい》を否定《ひてい》しないアプローチが原則《げんそく》。","noteEnRuby":""},{"id":"KV209","term":"摘便","kana":"てきべん","romaji":"tekiben","english":"manual bowel evacuation","easyJa":"指を肛門に入れて、固まったうんちをかき出すこと","englishDesc":"Removing hard stool from the rectum by hand.","exampleJa":"便秘がひどいため、看護師に摘便を依頼する。","exampleEn":"Because constipation is severe, ask the nurse to perform manual evacuation.","exampleRuby":"便秘《べんぴ》がひどいため、看護師《かんごし》に摘便《てきべん》を依頼《いらい》する。","exampleGapRuby":"便秘《べんぴ》がひどいため、看護師《かんごし》に{{GAP}}を依頼《いらい》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"摘便は医行為。介護福祉士は行えない。看護師に依頼するのが正解。","noteEn":"This is a medical act; care workers may not do it. Asking the nurse is the correct answer.","gapTerm":"摘便","termRuby":"摘便《てきべん》","easyJaRuby":"指《ゆび》を肛門《こうもん》に入《い》れて、固《かた》まったうんちをかき出《だ》すこと","noteJaRuby":"摘便《てきべん》は医行為《いこうい》。介護福祉士《かいごふくしし》は行《おこな》えない。看護師《かんごし》に依頼《いらい》するのが正解《せいかい》。","noteEnRuby":""},{"id":"KV210","term":"刻み食","kana":"きざみしょく","romaji":"kizamishoku","english":"chopped food","easyJa":"噛みやすいように、細かく切ってあるご飯","englishDesc":"Food that has been cut into small pieces.","exampleJa":"咀嚼機能が低下したため刻み食に変更する。","exampleEn":"Because chewing function declined, the meal was changed to chopped food.","exampleRuby":"咀嚼機能《そしゃくきのう》が低下《ていか》したため刻《きざ》み食《しょく》に変更《へんこう》する。","exampleGapRuby":"咀嚼機能《そしゃくきのう》が低下《ていか》したため{{GAP}}に変更《へんこう》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"刻み食は口の中でまとまりにくく、かえって誤嚥しやすい場合がある。ソフト食・とろみと比較して問われる。","noteEn":"Chopped food scatters in the mouth and can INCREASE aspiration risk. Compare with soft food and thickeners.","gapTerm":"刻み食","termRuby":"刻《きざ》み食《しょく》","easyJaRuby":"噛《か》みやすいように、細《こま》かく切《き》ってあるご飯《はん》","noteJaRuby":"刻《きざ》み食《しょく》は口《くち》の中《なか》でまとまりにくく、かえって誤嚥《ごえん》しやすい場合《ばあい》がある。ソフト食《しょく》・とろみと比較《ひかく》して問《と》われる。","noteEnRuby":""},{"id":"KV211","term":"流動食","kana":"りゅうどうしょく","romaji":"ryūdōshoku","english":"liquid diet","easyJa":"噛まなくても飲み込める、スープのようなドロドロのご飯","englishDesc":"Food in liquid form.","exampleJa":"胃腸への負担を減らすため流動食を提供する。","exampleEn":"Provide a liquid diet to reduce the burden on the stomach.","exampleRuby":"胃腸《いちょう》への負担《ふたん》を減《へ》らすため流動食《りゅうどうしょく》を提供《ていきょう》する。","exampleGapRuby":"胃腸《いちょう》への負担《ふたん》を減《へ》らすため{{GAP}}を提供《ていきょう》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"流動食は栄養が不足しやすい。長期間続ける場合は栄養士と連携する。","noteEn":"A liquid diet lacks nutrients easily; work with a dietitian if it continues.","gapTerm":"流動食","termRuby":"流動食《りゅうどうしょく》","easyJaRuby":"噛《か》まなくても飲《の》み込《こ》める、スープのようなドロドロのご飯《はん》","noteJaRuby":"流動食《りゅうどうしょく》は栄養《えいよう》が不足《ふそく》しやすい。長期間続《ちょうきかんつづ》ける場合《ばあい》は栄養士《えいようし》と連携《れんけい》する。","noteEnRuby":""},{"id":"KV212","term":"機械浴","kana":"きかいよく","romaji":"kikaiyoku","english":"mechanical bath","easyJa":"座ったままや寝たまま入れる、機械を使ったお風呂","englishDesc":"Bathing using a machine for people who cannot use a normal bath.","exampleJa":"全介助の利用者がストレッチャーに乗って機械浴を行う。","exampleEn":"A user needing total assistance takes a mechanical bath on a stretcher.","exampleRuby":"全介助《ぜんかいじょ》の利用者《りようしゃ》がストレッチャーに乗《の》って機械浴《きかいよく》を行《おこな》う。","exampleGapRuby":"全介助《ぜんかいじょ》の利用者《りようしゃ》がストレッチャーに乗《の》って{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"機械浴でもプライバシーとバイタル確認は必要。羞恥心への配慮が問われる。","noteEn":"Even with machines, privacy and vital signs matter. Consideration of embarrassment is tested.","gapTerm":"機械浴","termRuby":"機械浴《きかいよく》","easyJaRuby":"座《すわ》ったままや寝《ね》たまま入《い》れる、機械《きかい》を使《つか》ったお風呂《ふろ》","noteJaRuby":"機械浴《きかいよく》でもプライバシーとバイタル確認《かくにん》は必要《ひつよう》。羞恥心《しゅうちしん》への配慮《はいりょ》が問《と》われる。","noteEnRuby":""},{"id":"KV213","term":"面会","kana":"めんかい","romaji":"menkai","english":"visitation","easyJa":"家族や友達が、施設に会いに来ること","englishDesc":"A family member or friend coming to see the user.","exampleJa":"家族の面会後、利用者の気分が落ち込んでいる。","exampleEn":"After the family's visit, the user's mood is low.","exampleRuby":"家族《かぞく》の面会後《めんかいご》、利用者《りようしゃ》の気分《きぶん》が落《お》ち込《こ》んでいる。","exampleGapRuby":"家族《かぞく》の{{GAP}}後《あと》、利用者《りようしゃ》の気分《きぶん》が落《お》ち込《こ》んでいる。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"面会後の気分の変化は事例問題の定番。感情を否定せず傾聴し、記録・報告する。","noteEn":"Mood change after a visit is standard case material: listen without denying feelings, record and report.","gapTerm":"面会","termRuby":"面会《めんかい》","easyJaRuby":"家族《かぞく》や友達《ともだち》が、施設《しせつ》に会《あ》いに来《く》ること","noteJaRuby":"面会後《めんかいご》の気分《きぶん》の変化《へんか》は事例問題《じれいもんだい》の定番《ていばん》。感情《かんじょう》を否定《ひてい》せず傾聴《けいちょう》し、記録《きろく》・報告《ほうこく》する。","noteEnRuby":""},{"id":"KV214","term":"グリーフケア","kana":"ぐりーふけあ","romaji":"gurīfukea","english":"grief care","easyJa":"大切な人を亡くした人の、深い悲しみを癒やすサポート","englishDesc":"Support for the family's sadness after a death.","exampleJa":"家族に対するグリーフケア（悲嘆ケア）を実施する。","exampleEn":"Provide grief care for the family.","exampleRuby":"家族《かぞく》に対《たい》するグリーフケア（悲嘆《ひたん》ケア）を実施《じっし》する。","exampleGapRuby":"家族《かぞく》に対《たい》する{{GAP}}（悲嘆《ひたん》ケア）を実施《じっし》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"グリーフケアは死後の家族が対象。看取り介護の一部として続く。","noteEn":"Grief care is for the bereaved family and continues after the death, as part of end-of-life care.","gapTerm":"グリーフケア","termRuby":"グリーフケア","easyJaRuby":"大切《たいせつ》な人《ひと》を亡《な》くした人《ひと》の、深《ふか》い悲《かな》しみを癒《い》やすサポート","noteJaRuby":"グリーフケアは死後《しご》の家族《かぞく》が対象《たいしょう》。看取《みと》り介護《かいご》の一部《いちぶ》として続《つづ》く。","noteEnRuby":""},{"id":"KV215","term":"スピーチロック","kana":"すぴーちろっく","romaji":"supīchirokku","english":"verbal restraint","easyJa":"「動かないで！」など、キツイ言葉で利用者の動きを止めること","englishDesc":"Restricting a person with words instead of physical force.","exampleJa":"言葉による身体拘束であるスピーチロックを防ぐ。","exampleEn":"Prevent verbal restraint, which is restraint by words.","exampleRuby":"言葉《ことば》による身体拘束《しんたいこうそく》であるスピーチロックを防《ふせ》ぐ。","exampleGapRuby":"言葉《ことば》による身体拘束《しんたいこうそく》である{{GAP}}を防《ふせ》ぐ。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護の基本","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「スピーチロック」（言葉）「フィジカルロック」（物理）「ドラッグロック」（薬）の3つ。「ちょっと待って」も該当。","noteEn":"Three types: speech, physical and drug lock. Even \"wait a moment\" can count as speech lock.","gapTerm":"スピーチロック","termRuby":"スピーチロック","easyJaRuby":"「動《うご》かないで！」など、キツイ言葉《ことば》で利用者《りようしゃ》の動《うご》きを止《と》めること","noteJaRuby":"「スピーチロック」（言葉《ことば》）「フィジカルロック」（物理《ぶつり》）「ドラッグロック」（薬《くすり》）の3つ。「ちょっと待《ま》って」も該当《がいとう》。","noteEnRuby":""},{"id":"KV216","term":"リハビリテーション","kana":"りはびりてーしょん","romaji":"rihabiritēshon","english":"rehabilitation","easyJa":"体や心の機能を回復させるための訓練（リハビリ）","englishDesc":"Training to recover or maintain body and mind functions.","exampleJa":"理学療法士によるリハビリテーションを実施する。","exampleEn":"A physical therapist provides rehabilitation.","exampleRuby":"理学療法士《りがくりょうほうし》によるリハビリテーションを実施《じっし》する。","exampleGapRuby":"理学療法士《りがくりょうほうし》による{{GAP}}を実施《じっし》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"障害の理解","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"リハビリは訓練室だけでなく「生活リハビリ」として日常動作の中でも行う。","noteEn":"Rehabilitation is not only in the training room; daily activities are \"living rehabilitation\".","gapTerm":"リハビリテーション","termRuby":"リハビリテーション","easyJaRuby":"体《からだ》や心《こころ》の機能《きのう》を回復《かいふく》させるための訓練《くんれん》（リハビリ）","noteJaRuby":"リハビリは訓練室《くんれんしつ》だけでなく「生活《せいかつ》リハビリ」として日常動作《にちじょうどうさ》の中《なか》でも行《おこな》う。","noteEnRuby":""},{"id":"KV217","term":"ポータブルトイレ","kana":"ぽーたぶるといれ","romaji":"pōtaburutoire","english":"portable toilet","easyJa":"持ち運びができる部屋用のトイレ","englishDesc":"A toilet that can be carried and used beside the bed.","exampleJa":"夜間はベッドの横にポータブルトイレを設置する。","exampleEn":"At night, place a portable toilet beside the bed.","exampleRuby":"夜間《やかん》はベッドの横《よこ》にポータブルトイレを設置《せっち》する。","exampleGapRuby":"夜間《やかん》はベッドの横《よこ》に{{GAP}}を設置《せっち》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"ポータブルトイレは臭気・音・プライバシーへの配慮が必要。設置場所は健側に置く。","noteEn":"Mind smell, noise and privacy. Place it on the person's unaffected side.","gapTerm":"ポータブルトイレ","termRuby":"ポータブルトイレ","easyJaRuby":"持《も》ち運《はこ》びができる部屋用《へやよう》のトイレ","noteJaRuby":"ポータブルトイレは臭気《しゅうき》・音《おと》・プライバシーへの配慮《はいりょ》が必要《ひつよう》。設置場所《せっちばしょ》は健側《けんそく》に置《お》く。","noteEnRuby":""},{"id":"KV218","term":"スロープ","kana":"すろーぷ","romaji":"surōpu","english":"slope / ramp","easyJa":"段差をなくすための斜めの板や道","englishDesc":"A sloping board or path that removes a step.","exampleJa":"車いすで移動しやすいようにスロープを設置する。","exampleEn":"Install a ramp so the wheelchair can move easily.","exampleRuby":"車《くるま》いすで移動《いどう》しやすいようにスロープを設置《せっち》する。","exampleGapRuby":"車《くるま》いすで移動《いどう》しやすいように{{GAP}}を設置《せっち》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"スロープは長いほど傾斜がゆるく安全。急な角度は転落の危険がある。","noteEn":"The longer the ramp, the gentler and safer the slope. Steep ramps risk tipping.","gapTerm":"スロープ","termRuby":"スロープ","easyJaRuby":"段差《だんさ》をなくすための斜《なな》めの板《いた》や道《みち》","noteJaRuby":"スロープは長《なが》いほど傾斜《けいしゃ》がゆるく安全《あんぜん》。急《きゅう》な角度《かくど》は転落《てんらく》の危険《きけん》がある。","noteEnRuby":""},{"id":"KV219","term":"手すり","kana":"てすり","romaji":"tesuri","english":"handrail","easyJa":"歩くときや立つときに安全のために掴む棒","englishDesc":"A bar to hold on to when walking or standing up.","exampleJa":"転倒予防のために、廊下に手すりを取り付ける。","exampleEn":"Fit handrails in the corridor to prevent falls.","exampleRuby":"転倒予防《てんとうよぼう》のために、廊下《ろうか》に手《て》すりを取《と》り付《つ》ける。","exampleGapRuby":"転倒予防《てんとうよぼう》のために、廊下《ろうか》に{{GAP}}を取《と》り付《つ》ける。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"手すりは「健側」に設置する。介護保険の住宅改修（20万円まで）の対象。","noteEn":"Handrails go on the unaffected side. Covered by home-modification benefit (up to 200,000 yen).","gapTerm":"手すり","termRuby":"手《て》すり","easyJaRuby":"歩《ある》くときや立《た》つときに安全《あんぜん》のために掴《つか》む棒《ぼう》","noteJaRuby":"手《て》すりは「健側《けんそく》」に設置《せっち》する。介護保険《かいごほけん》の住宅改修《じゅうたくかいしゅう》（20万円《まんえん》まで）の対象《たいしょう》。","noteEnRuby":""},{"id":"KV220","term":"自助具","kana":"じじょぐ","romaji":"jijogu","english":"self-help device","easyJa":"自分でお箸を持ったり服を着たりしやすくする道具","englishDesc":"A tool that makes it easier to do things by yourself.","exampleJa":"スプーンを握りにくい利用者へ自助具を提案する。","exampleEn":"Suggest a self-help device to a user who cannot grip a spoon.","exampleRuby":"スプーンを握《にぎ》りにくい利用者《りようしゃ》へ自助具《じじょぐ》を提案《ていあん》する。","exampleGapRuby":"スプーンを握《にぎ》りにくい利用者《りようしゃ》へ{{GAP}}を提案《ていあん》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"自助具は「自分でできる」を増やす道具。介助を減らす道具ではない点が問われる。","noteEn":"Self-help devices increase what the person can do themselves — not tools to reduce staff work.","gapTerm":"自助具","termRuby":"自助具《じじょぐ》","easyJaRuby":"自分《じぶん》でお箸《はし》を持《も》ったり服《ふく》を着《き》たりしやすくする道具《どうぐ》","noteJaRuby":"自助具《じじょぐ》は「自分《じぶん》でできる」を増《ふ》やす道具《どうぐ》。介助《かいじょ》を減《へ》らす道具《どうぐ》ではない点《てん》が問《と》われる。","noteEnRuby":""},{"id":"KV221","term":"車いす","kana":"くるまいす","romaji":"kurumaisu","english":"wheelchair","easyJa":"歩くのが難しい人が座って移動する道具","englishDesc":"A chair with wheels for a person who cannot walk.","exampleJa":"車いすのブレーキがしっかりかかっているか確認する。","exampleEn":"Check that the wheelchair brakes are firmly applied.","exampleRuby":"車《くるま》いすのブレーキがしっかりかかっているか確認《かくにん》する。","exampleGapRuby":"{{GAP}}のブレーキがしっかりかかっているか確認《かくにん》する。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"移乗前は必ずブレーキ。段差はキャスターを上げる。下り坂は後ろ向きで下りる。","noteEn":"Always brake before transfer, lift the casters over steps, and go DOWN slopes backwards.","gapTerm":"車いす","termRuby":"車《くるま》いす","easyJaRuby":"歩《ある》くのが難《むずか》しい人《ひと》が座《すわ》って移動《いどう》する道具《どうぐ》","noteJaRuby":"移乗前《いじょうまえ》は必《かなら》ずブレーキ。段差《だんさ》はキャスターを上《あ》げる。下《くだ》り坂《さか》は後《うし》ろ向《む》きで下《お》りる。","noteEnRuby":""},{"id":"KV222","term":"歩行器","kana":"ほこうき","romaji":"hokōki","english":"walker","easyJa":"歩くのを助けるための枠や車輪がついた道具","englishDesc":"A frame with or without wheels that helps a person walk.","exampleJa":"歩行器を使って歩行訓練を行う。","exampleEn":"Do walking training using a walker.","exampleRuby":"歩行器《ほこうき》を使《つか》って歩行訓練《ほこうくんれん》を行《おこな》う。","exampleGapRuby":"{{GAP}}を使《つか》って歩行訓練《ほこうくんれん》を行《おこな》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"歩行器は体を支える範囲が広く、杖より安定する。使用前に高さとブレーキを点検。","noteEn":"A walker supports more of the body than a cane. Check height and brakes before use.","gapTerm":"歩行器","termRuby":"歩行器《ほこうき》","easyJaRuby":"歩《ある》くのを助《たす》けるための枠《わく》や車輪《しゃりん》がついた道具《どうぐ》","noteJaRuby":"歩行器《ほこうき》は体《からだ》を支《ささ》える範囲《はんい》が広《ひろ》く、杖《つえ》より安定《あんてい》する。使用前《しようまえ》に高《たか》さとブレーキを点検《てんけん》。","noteEnRuby":""},{"id":"KV223","ter Label":"基礎","levelEn":"Basic","noteJa":"ナースコールを手の届かない場所に置くのは身体拘束にあたる場合がある。","noteEn":"Placing the call button out of reach can amount to physical restraint.","gapTerm":"ナースコール","termRuby":"ナースコール","easyJaRuby":"職員《しょくいん》を呼《よ》ぶためのボタン","noteJaRuby":"ナースコールを手《て》の届《とど》かない場所《ばしょ》に置《お》くのは身体拘束《しんたいこうそく》にあたる場合《ばあい》がある。","noteEnRuby":""},{"id":"KV228","term":"サイドレール","kana":"さいどれーる","romaji":"saidorēru","english":"bed rails","easyJa":"ベッドから落ちないようにする柵","englishDesc":"Rails on the side of a bed to stop the person falling out.","exampleJa":"転落を防ぐため、ベッドにサイドレールを取り付ける。","exampleEn":"Fit side rails to the bed to prevent falls.","exampleRuby":"転落《てんらく》を防《ふせ》ぐため、ベッドにサイドレールを取《と》り付《つ》ける。","exampleGapRuby":"転落《てんらく》を防《ふせ》ぐため、ベッドに{{GAP}}を取《と》り付《つ》ける。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"4点すべてを柵で囲むと身体拘束にあたる。目的と方法の適切さが問われる。","noteEn":"Enclosing the bed with rails on all four sides counts as restraint. Purpose and method are tested.","gapTerm":"サイドレール","termRuby":"サイドレール","easyJaRuby":"ベッドから落《お》ちないようにする柵《さく》","noteJaRuby":"4点《てん》すべてを柵《さく》で囲《かこ》むと身体拘束《しんたいこうそく》にあたる。目的《もくてき》と方法《ほうほう》の適切《てきせつ》さが問《と》われる。","noteEnRuby":""},{"id":"KV229","term":"シャワーチェア","kana":"しゃわーちぇあ","romaji":"shawāchea","english":"shower chair","easyJa":"お風呂で体を洗う時に座る、濡れてもいい椅子","englishDesc":"A chair used in the bathroom for washing.","exampleJa":"シャワーチェアに深く座ってもらい、洗身を行う。","exampleEn":"Have the user sit well back on the shower chair and wash the body.","exampleRuby":"シャワーチェアに深《ふか》く座《すわ》ってもらい、洗身《せんしん》を行《おこな》う。","exampleGapRuby":"{{GAP}}に深《ふか》く座《すわ》ってもらい、洗身《せんしん》を行《おこな》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"シャワーチェアは高さ調節ができるものを選ぶ。足底が床につくことが安全の条件。","noteEn":"Choose a height-adjustable chair; the soles must reach the floor for safety.","gapTerm":"シャワーチェア","termRuby":"シャワーチェア","easyJaRuby":"お風呂《ふろ》で体《からだ》を洗《あら》う時《とき》に座《すわ》る、濡《ぬ》れてもいい椅子《いす》","noteJaRuby":"シャワーチェアは高《たか》さ調節《ちょうせつ》ができるものを選《えら》ぶ。足底《そくてい》が床《ゆか》につくことが安全《あんぜん》の条件《じょうけん》。","noteEnRuby":""},{"id":"KV230","term":"シルバーカー","kana":"しるばーかー","romaji":"shirubākā","english":"rollator","easyJa":"高齢者が歩く時に寄りかかる、タイヤのついた手押し車","englishDesc":"A wheeled walking aid with a basket, used outdoors by older people.","exampleJa":"買い物に行くため、シルバーカーの点検を行う。","exampleEn":"Inspect the rollator before going shopping.","exampleRuby":"買《か》い物《もの》に行《い》くため、シルバーカーの点検《てんけん》を行《おこな》う。","exampleGapRuby":"買《か》い物《もの》に行《い》くため、{{GAP}}の点検《てんけん》を行《おこな》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"シルバーカーは「歩ける人」の買い物用。歩行器（体を支える）と目的が違う。","noteEn":"A rollator is for people who can walk, used for shopping — unlike a walker, which supports the body.","gapTerm":"シルバーカー","termRuby":"シルバーカー","easyJaRuby":"高齢者《こうれいしゃ》が歩《ある》く時《とき》に寄《よ》りかかる、タイヤのついた手押《てお》し車《くるま》","noteJaRuby":"シルバーカーは「歩《ある》ける人《ひと》」の買《か》い物用《ものよう》。歩行器《ほこうき》（体《からだ》を支《ささ》える）と目的《もくてき》が違《ちが》う。","noteEnRuby":""},{"id":"KV231","term":"とろみ剤","kana":"とろみざい","romaji":"toromizai","english":"thickener","easyJa":"飲み物をドロドロにして、むせないようにする粉","englishDesc":"A powder that makes drinks thicker so they are easier to swallow.","exampleJa":"お茶にとろみ剤を入れて、誤嚥を防ぐ。","exampleEn":"Add thickener to the tea to prevent aspiration.","exampleRuby":"お茶《ちゃ》にとろみ剤《ざい》を入《い》れて、誤嚥《ごえん》を防《ふせ》ぐ。","exampleGapRuby":"お茶《ちゃ》に{{GAP}}を入《い》れて、誤嚥《ごえん》を防《ふせ》ぐ。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"とろみは濃すぎても飲み込みにくい。段階（薄い・中間・濃い）を本人に合わせる。","noteEn":"Too thick is also hard to swallow. Match the level (thin, moderate, thick) to the person.","gapTerm":"とろみ剤","termRuby":"とろみ剤《ざい》","easyJaRuby":"飲《の》み物《もの》をドロドロにして、むせないようにする粉《こな》","noteJaRuby":"とろみは濃《こ》すぎても飲《の》み込《こ》みにくい。段階《だんかい》（薄《うす》い・中間《ちゅうかん》・濃《こ》い）を本人《ほんにん》に合《あ》わせる。","noteEnRuby":""},{"id":"KV232","term":"差し込み便器","kana":"さしこみべんき","romaji":"sashikomibenki","english":"bedpan","easyJa":"ベッドに寝たまま排泄するための道具","englishDesc":"A container for toileting while lying in bed.","exampleJa":"仰臥位のまま、差し込み便器をあてる。","exampleEn":"Place the bedpan while the user stays in the supine position.","exampleRuby":"仰臥位《ぎょうがい》のまま、差《さ》し込《こ》み便器《べんき》をあてる。","exampleGapRuby":"仰臥位《ぎょうがい》のまま、{{GAP}}をあてる。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"差し込み便器は腰を上げてもらう。プライバシーとして下半身にタオルをかける。","noteEn":"Ask the person to lift the hips. Cover the lower body with a towel for privacy.","gapTerm":"差し込み便器","termRuby":"差《さ》し込《こ》み便器《べんき》","easyJaRuby":"ベッドに寝《ね》たまま排泄《はいせつ》するための道具《どうぐ》","noteJaRuby":"差《さ》し込《こ》み便器《べんき》は腰《こし》を上《あ》げてもらう。プライバシーとして下半身《かはんしん》にタオルをかける。","noteEnRuby":""},{"id":"KV233","term":"センサーマット","kana":"せんさーまっと","romaji":"sensāmatto","english":"sensor mat","easyJa":"踏むと職員に知らせる（音が鳴る）マット","englishDesc":"A mat that sounds an alarm to staff when stepped on.","exampleJa":"ベッドを離れると音が鳴るセンサーマットを敷く。","exampleEn":"Lay a sensor mat that sounds when the user leaves the bed.","exampleRuby":"ベッドを離《はな》れると音《おと》が鳴《な》るセンサーマットを敷《し》く。","exampleGapRuby":"ベッドを離《はな》れると音《おと》が鳴《な》る{{GAP}}を敷《し》く。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"センサーは転倒予防だが、本人に知らせず監視するのは尊厳の問題として問われる。","noteEn":"Sensors prevent falls, but unexplained monitoring raises dignity issues.","gapTerm":"センサーマット","termRuby":"センサーマット","easyJaRuby":"踏《ふ》むと職員《しょくいん》に知《し》らせる（音《おと》が鳴《な》る）マット","noteJaRuby":"センサーは転倒予防《てんとうよぼう》だが、本人《ほんにん》に知《し》らせず監視《かんし》するのは尊厳《そんげん》の問題《もんだい》として問《と》われる。","noteEnRuby":""},{"id":"KV234","term":"尿器","kana":"にょうき","romaji":"nyōki","english":"urinal","easyJa":"ベッドで寝たままおしっこをするためのボトル","englishDesc":"A bottle for passing urine while in bed.","exampleJa":"男性用尿器を使って排尿介助を行う。","exampleEn":"Provide urination assistance using a male urinal.","exampleRuby":"男性用尿器《だんせいようにょうき》を使《つか》って排尿介助《はいにょうかいじょ》を行《おこな》う。","exampleGapRuby":"男性用《だんせいよう》{{GAP}}を使《つか》って排尿介助《はいにょうかいじょ》を行《おこな》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"尿器使用時もプライバシーを守る。使用後はすぐ片づけ、量と色を観察する。","noteEn":"Protect privacy, remove it promptly, and observe volume and colour.","gapTerm":"尿器","termRuby":"尿器《にょうき》","easyJaRuby":"ベッドで寝《ね》たままおしっこをするためのボトル","noteJaRuby":"尿器使用時《にょうきしようじ》もプライバシーを守《まも》る。使用後《しようご》はすぐ片《かた》づけ、量《りょう》と色《いろ》を観察《かんさつ》する。","noteEnRuby":""},{"id":"KV235","term":"エプロン","kana":"えぷろん","romaji":"epuron","english":"apron / bib","easyJa":"服が汚れないように前につける布","englishDesc":"A cloth worn to keep clothes clean during meals.","exampleJa":"食べこぼしが多いため、食事用エプロンをつける。","exampleEn":"Because there is much spilling, a meal apron is used.","exampleRuby":"食《た》べこぼしが多《おお》いため、食事用《しょくじよう》エプロンをつける。","exampleGapRuby":"食《た》べこぼしが多《おお》いため、食事用《しょくじよう》{{GAP}}をつける。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"エプロンは必要な人にのみ。全員につけるのは尊厳の観点から不適切。","noteEn":"Use only for those who need it. Putting one on everyone is inappropriate for dignity.","gapTerm":"エプロン","termRuby":"エプロン","easyJaRuby":"服《ふく》が汚《よご》れないように前《まえ》につける布《ぬの》","noteJaRuby":"エプロンは必要《ひつよう》な人《ひと》にのみ。全員《ぜんいん》につけるのは尊厳《そんげん》の観点《かんてん》から不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV236","term":"吸水パッド","kana":"きゅうすいぱっど","romaji":"kyūsuipaddo","english":"incontinence pad","easyJa":"おしっこを吸い取るために下着やおむつの中に入れる紙","englishDesc":"A paper pad that absorbs urine, used inside underwear or a diaper.","exampleJa":"尿漏れを防ぐために、おむつの中に吸水パッドを敷く。","exampleEn":"Place an absorbent pad inside the diaper to prevent leakage.","exampleRuby":"尿漏《にょうも》れを防《ふせ》ぐために、おむつの中《なか》に吸水《きゅうすい》パッドを敷《し》く。","exampleGapRuby":"尿漏《にょうも》れを防《ふせ》ぐために、おむつの中《なか》に{{GAP}}を敷《し》く。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"パッドの重ね使いは吸収力が落ち、皮膚トラブルの原因になる。1枚が原則。","noteEn":"Stacking pads reduces absorbency and harms the skin. One pad is the rule.","gapTerm":"吸水パッド","termRuby":"吸水《きゅうすい》パッド","easyJaRuby":"おしっこを吸《す》い取《と》るために下着《したぎ》やおむつの中《なか》に入《い》れる紙《かみ》","noteJaRuby":"パッドの重《かさ》ね使《つか》いは吸収力《きゅうしゅうりょく》が落《お》ち、皮膚《ひふ》トラブルの原因《げんいん》になる。1枚《まい》が原則《げんそく》。","noteEnRuby":""},{"id":"KV237","term":"ギャッチベッド","kana":"ぎゃっちべっど","romaji":"gyatchibeddo","english":"adjustable bed","easyJa":"背中や足の高さを動かせる介護用のベッド","englishDesc":"A bed whose back and legs can be raised.","exampleJa":"ギャッチベッドの背上げ機能を使って上体を起こす。","exampleEn":"Use the back-raising function of the adjustable bed to sit the user up.","exampleRuby":"ギャッチベッドの背上《せあ》げ機能《きのう》を使《つか》って上体《じょうたい》を起《お》こす。","exampleGapRuby":"{{GAP}}の背上《せあ》げ機能《きのう》を使《つか》って上体《じょうたい》を起《お》こす。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"背上げの前に、体がずれないよう膝を先に上げる。背上げ後は背抜きを行う。","noteEn":"Raise the knees before the back, and relieve back pressure (背抜き) afterwards.","gapTerm":"ギャッチベッド","termRuby":"ギャッチベッド","easyJaRuby":"背中《せなか》や足《あし》の高《たか》さを動《うご》かせる介護用《かいごよう》のベッド","noteJaRuby":"背上《せあ》げの前《まえ》に、体《からだ》がずれないよう膝《ひざ》を先《さき》に上《あ》げる。背上《せあ》げ後《あと》は背抜《せぬ》きを行《おこな》う。","noteEnRuby":"Raise the knees before the back, and relieve back pressure (背抜《せぬ》き) afterwards."},{"id":"KV238","term":"義歯","kana":"ぎし","romaji":"gishi","english":"dentures","easyJa":"入れ歯のこと","englishDesc":"False teeth.","exampleJa":"夜寝る前は義歯を外し、洗浄剤につけておく。","exampleEn":"Before sleeping, remove the dentures and soak them in cleaning solution.","exampleRuby":"夜寝《よるね》る前《まえ》は義歯《ぎし》を外《はず》し、洗浄剤《せんじょうざい》につけておく。","exampleGapRuby":"夜寝《よるね》る前《まえ》は{{GAP}}を外《はず》し、洗浄剤《せんじょうざい》につけておく。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"義歯は必ず外して洗う。熱湯は変形するので使わない。装着したまま就寝は誤嚥の危険。","noteEn":"Always remove and clean dentures; never use hot water. Sleeping with them risks aspiration.","gapTerm":"義歯","termRuby":"義歯《ぎし》","easyJaRuby":"入《い》れ歯《は》のこと","noteJaRuby":"義歯《ぎし》は必《かなら》ず外《はず》して洗《あら》う。熱湯《ねっとう》は変形《へんけい》するので使《つか》わない。装着《そうちゃく》したまま就寝《しゅうしん》は誤嚥《ごえん》の危険《きけん》。","noteEnRuby":""},{"id":"KV239","term":"補聴器","kana":"ほちょうき","romaji":"hochōki","english":"hearing aid","easyJa":"音を大きくして耳に聞こえやすくする機械","englishDesc":"A device that makes sounds louder for the ear.","exampleJa":"入浴の時は、水に濡れないよう補聴器を外す。","exampleEn":"Remove the hearing aid at bath time so it does not get wet.","exampleRuby":"入浴《にゅうよく》の時《とき》は、水《みず》に濡《ぬ》れないよう補聴器《ほちょうき》を外《はず》す。","exampleGapRuby":"入浴《にゅうよく》の時《とき》は、水《みず》に濡《ぬ》れないよう{{GAP}}を外《はず》す。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"補聴器は水に弱い。電池切れ・ハウリングの確認も介護職の役割。","noteEn":"Hearing aids are damaged by water. Checking batteries and feedback is part of the care worker's role.","gapTerm":"補聴器","termRuby":"補聴器《ほちょうき》","easyJaRuby":"音《おと》を大《おお》きくして耳《みみ》に聞《き》こえやすくする機械《きかい》","noteJaRuby":"補聴器《ほちょうき》は水《みず》に弱《よわ》い。電池切《でんちぎ》れ・ハウリングの確認《かくにん》も介護職《かいごしょく》の役割《やくわり》。","noteEnRuby":""},{"id":"KV240","term":"スライディングボード","kana":"すらいでぃんぐぼーど","romaji":"suraidingubōdo","english":"sliding board","easyJa":"ベッドから車いすへ座ったまま滑って移動するための板","englishDesc":"A board used to slide a person between bed and wheelchair.","exampleJa":"移乗介助の負担を減らすため、スライディングボードを使う。","exampleEn":"Use a sliding board to reduce the burden of transfer.","exampleRuby":"移乗介助《いじょうかいじょ》の負担《ふたん》を減《へ》らすため、スライディングボードを使《つか》う。","exampleGapRuby":"移乗介助《いじょうかいじょ》の負担《ふたん》を減《へ》らすため、{{GAP}}を使《つか》う。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"スライディングボードは座ったまま移乗する。持ち上げないことで腰痛予防になる。","noteEn":"The person slides while seated. Not lifting protects the care worker's back.","gapTerm":"スライディングボード","termRuby":"スライディングボード","easyJaRuby":"ベッドから車《くるま》いすへ座《すわ》ったまま滑《すべ》って移動《いどう》するための板《いた》","noteJaRuby":"スライディングボードは座《すわ》ったまま移乗《いじょう》する。持《も》ち上《あ》げないことで腰痛予防《ようつうよぼう》になる。","noteEnRuby":""},{"id":"KV241","term":"クッション","kana":"くっしょん","romaji":"kusshon","english":"cushion","easyJa":"体の下に入れて、姿勢を安定させる柔らかいもの","englishDesc":"A soft item placed under the body to keep a position stable.","exampleJa":"側臥位を安定させるため、背中にクッションを当てる。","exampleEn":"Place a cushion against the back to stabilise the lateral position.","exampleRuby":"側臥位《そくがい》を安定《あんてい》させるため、背中《せなか》にクッションを当《あ》てる。","exampleGapRuby":"側臥位《そくがい》を安定《あんてい》させるため、背中《せなか》に{{GAP}}を当《あ》てる。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"クッションは体圧分散と姿勢保持のため。すき間を埋めるように置く。","noteEn":"Cushions spread pressure and hold posture; place them to fill the gaps.","gapTerm":"クッション","termRuby":"クッション","easyJaRuby":"体《からだ》の下《した》に入《い》れて、姿勢《しせい》を安定《あんてい》させる柔《やわ》らかいもの","noteJaRuby":"クッションは体圧分散《たいあつぶんさん》と姿勢保持《しせいほじ》のため。すき間《ま》を埋《う》めるように置《お》く。","noteEnRuby":""},{"id":"KV242","term":"体温計","kana":"たいおんけい","romaji":"taionkei","english":"thermometer","easyJa":"熱（体温）を測る道具","englishDesc":"A device that measures body temperature.","exampleJa":"毎朝、体温計で利用者の熱を測る。","exampleEn":"Every morning, measure users' temperature with a thermometer.","exampleRuby":"毎朝《まいあさ》、体温計《たいおんけい》で利用者《りようしゃ》の熱《ねつ》を測《はか》る。","exampleGapRuby":"毎朝《まいあさ》、{{GAP}}で利用者《りようしゃ》の熱《ねつ》を測《はか》る。","categoryId":4,"category":"福祉用具・生活環境","categoryEn":"Welfare equipment & living environment","subject":"医療的ケア","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"高齢者は平熱が低め。「いつもと比べてどうか」を見るのが重要。","noteEn":"Older people have lower baseline temperatures; compare with their own normal.","
