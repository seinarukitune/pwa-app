<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2f5d8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="介護のことば">
<title>介護のことば / Kaigo Words</title>
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#12212e; --sub:#5b6b7a; --line:#d8e0e8;
  --brand:#2f5d8a; --brand-d:#22466a; --brand-l:#e8eef4;
  --ok:#1c7a4a; --ok-bg:#e5f4ec; --ng:#b3261e; --ng-bg:#fbeae9;
  --warn:#8a5a00; --warn-bg:#fdf3e0;
  --r:14px; --fs:1;
}
html[data-size="s"]{--fs:.9}
html[data-size="l"]{--fs:1.15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:calc(16px * var(--fs)); line-height:1.7;
  -webkit-text-size-adjust:100%;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.en{color:var(--sub);font-size:.82em;line-height:1.45;display:block}
.hide{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font-size:1.05em;margin:0;font-weight:700;flex:1;line-height:1.3}
header h1 .en{color:#c9dcef}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;
  min-width:52px;min-height:44px;font-size:.85em;font-weight:700;cursor:pointer;font-family:inherit}
.iconbtn:active{background:rgba(255,255,255,.3)}

main{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px}

/* nav */
nav{position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 2px;min-height:60px;cursor:pointer;
  font-family:inherit;color:var(--sub);font-size:.78em;line-height:1.25;font-weight:600}
nav button .ic{display:block;font-size:1.45em;line-height:1.1;margin-bottom:2px}
nav button[aria-current="true"]{color:var(--brand)}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{margin:0 0 10px;font-size:1.02em}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}

button.btn{display:block;width:100%;min-height:56px;border-radius:12px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-family:inherit;font-size:1em;font-weight:700;
  padding:12px 14px;cursor:pointer;text-align:left;line-height:1.4}
button.btn:active{transform:translateY(1px)}
button.btn .en{font-weight:500}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;text-align:center}
button.primary .en{color:#cfe0ef}
button.ghost{background:var(--brand-l);border-color:#cddcea;color:var(--brand-d);text-align:center}
button.small{min-height:48px;font-size:.92em;width:auto;flex:1;text-align:center}
button:disabled{opacity:.5}

.modegrid{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:12px}
.mode .ic{font-size:1.7em;width:44px;text-align:center;flex:none}
.mode .tx{flex:1}
.mode .tx b{display:block;font-size:1.02em}
.mode .tx .d{display:block;font-size:.86em;color:var(--sub);font-weight:500;line-height:1.45}
.mode .tx .d.en{margin-bottom:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;
  min-height:44px;font-family:inherit;font-size:.9em;font-weight:600;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.kpi.two{grid-template-columns:repeat(2,1fr)}
.kpi b small{font-size:.55em;font-weight:700;color:var(--sub)}
.kpi div{background:var(--brand-l);border-radius:12px;padding:10px 4px}
.kpi b{display:block;font-size:1.5em;color:var(--brand-d);line-height:1.2}
.kpi span{font-size:.76em;color:var(--sub);line-height:1.3;display:block}

.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}

.prog{display:flex;align-items:center;gap:10px;font-size:.85em;color:var(--sub);font-weight:700}
.prog .bar{flex:1}

/* word card */
.term{font-size:2.1em;font-weight:800;line-height:1.25;letter-spacing:.01em}
.kana{font-size:.95em;color:var(--sub);font-weight:600}
.romaji{font-size:.86em;color:var(--sub);font-style:italic}
.tag{display:inline-block;background:var(--brand-l);color:var(--brand-d);border-radius:99px;
  padding:3px 10px;font-size:.74em;font-weight:700;margin:0 6px 6px 0}
.sec{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}
.sec .lb{font-size:.76em;font-weight:800;color:var(--brand-d);letter-spacing:.03em}
.sec .lb .en{display:inline;color:var(--sub);font-weight:600}
.ex{background:#f7f9fb;border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:10px 12px}
/* ふりがな / furigana */
ruby{ruby-align:center}
rt{font-size:.52em;font-weight:600;color:var(--sub);line-height:1.1;letter-spacing:0}
.hasruby{line-height:2.65}
.ex.hasruby{padding-top:14px;padding-bottom:12px}
.ja2{display:block;font-size:.86em;color:var(--sub);font-weight:500;margin-top:2px}
/* ふりがな表示中は、ルビが入りうる要素の行間を広げる */
html[data-ruby="1"] .card,
html[data-ruby="1"] .listitem,
html[data-ruby="1"] button.btn,
html[data-ruby="1"] .chip,
html[data-ruby="1"] .tag,
html[data-ruby="1"] .verdict,
html[data-ruby="1"] .prog,
html[data-ruby="1"] .foot,
html[data-ruby="1"] .kpi span,
html[data-ruby="1"] nav button,
html[data-ruby="1"] header h1{line-height:2.45}
html[data-ruby="1"] .tag{font-size:.82em;padding:1px 10px}
html[data-ruby="1"] .kpi span{font-size:.8em}
html[data-ruby="1"] nav button{font-size:.74em}
/* ルビが付いているときは、別行のふりがな表示は重複するので隠す */
html[data-ruby="1"] .kana-dup{display:none}
html[data-ruby="1"] .card{padding-top:20px}
html[data-ruby="1"] .card h2{line-height:2.2;margin-bottom:6px}
html[data-ruby="1"] .term{line-height:1.9}
html[data-ruby="1"] .mode .tx b{line-height:2.1}
html[data-ruby="1"] .mode .tx .d{line-height:2.2}
html[data-ruby="1"] header h1{padding-top:4px}
.note{background:var(--warn-bg);border-radius:10px;padding:10px 12px}

/* quiz */
.stem{font-size:1.12em;font-weight:700;line-height:1.6}
.gap{background:#fff2c9;border-bottom:2px solid var(--warn);padding:0 6px;border-radius:4px}
button.opt{position:relative;padding-left:46px}
button.opt .num{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);
  font-size:.8em;display:grid;place-items:center;font-weight:800}
button.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
button.opt.ok .num{background:var(--ok);color:#fff}
button.opt.ng{background:var(--ng-bg);border-color:var(--ng)}
button.opt.ng .num{background:var(--ng);color:#fff}
.verdict{border-radius:12px;padding:12px 14px;font-weight:800}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.ng{background:var(--ng-bg);color:var(--ng)}
.verdict .en{font-weight:600}

.listitem{display:flex;gap:10px;align-items:center;width:100%;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;min-height:56px;font-family:inherit;text-align:left;cursor:pointer}
.listitem .t{flex:1}
.listitem .t b{font-size:1.05em}
.listitem .t .en{font-size:.8em}
html[data-ruby="1"] .listitem .t .en{font-size:.86em;line-height:2.2}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line);flex:none}
.dot.b1{background:#f0c674}.dot.b2{background:#7fbf7f}.dot.b3{background:#3f9e5a}.dot.b4{background:var(--ok)}

input[type=search]{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:1em;font-family:inherit;background:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:56px;border-bottom:1px solid var(--line);padding:6px 0}
.switch:last-child{border-bottom:0}
.switch .lb{flex:1;font-weight:700}
.tg{width:60px;height:34px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.15s}
.tg[aria-checked="true"]{background:var(--ok)}
.tg[aria-checked="true"]::after{left:29px}
textarea#dlText{width:100%;height:180px;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-family:Consolas,"Courier New",monospace;font-size:.78em;
  line-height:1.5;background:#fbfcfd;color:var(--ink);resize:vertical}
.muted{color:var(--sub);font-size:.88em}
.center{text-align:center}
.foot{font-size:.76em;color:var(--sub);text-align:center;padding:4px 0 10px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn hide" id="backBtn" type="button"></button>
    <h1 id="hTitle"></h1>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

ったつ》と老化《ろうか》の理解《りかい》"},{"name":"認知症の理解","count":17,"nameRuby":"認知症《にんちしょう》の理解《りかい》"},{"name":"障害の理解","count":18,"nameRuby":"障害《しょうがい》の理解《りかい》"},{"name":"医療的ケア","count":27,"nameRuby":"医療的《いりょうてき》ケア"}],"levels":[{"level":1,"label":"基礎","labelEn":"Basic","count":79,"labelRuby":"基礎《きそ》"},{"level":2,"label":"標準","labelEn":"Standard","count":201,"labelRuby":"標準《ひょうじゅん》"},{"level":3,"label":"発展","labelEn":"Advanced","count":91,"labelRuby":"発展《はってん》"}],"words":[{"id":"KV001","term":"最も適切なもの","kana":"もっともてきせつなもの","romaji":"mottomotekisetsunamono","english":"the most appropriate","easyJa":"一番正しいもの、一番良いもの","englishDesc":"The best or most suitable choice. The standard instruction in this exam: pick the ONE best answer.","exampleJa":"次のうち、最も適切なものを1つ選びなさい。","exampleEn":"From the following, choose the ONE most appropriate answer.","exampleRuby":"次《つぎ》のうち、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","exampleGapRuby":"次《つぎ》のうち、{{GAP}}を1つ選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"全科目共通","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「最も」は「一番」の意味。「適切なもの」を選ぶ問題と「適切でないもの」を選ぶ問題を読み違えると全問落とす。設問の最後まで必ず読む。","noteEn":"\"最も\" means \"the most\". Misreading 適切 (appropriate) vs 適切でない (not appropriate) reverses your answer. Always read to the end of the question.","gapTerm":"最も適切なもの","termRuby":"最《もっと》も適切《てきせつ》なもの","easyJaRuby":"一番正《いちばんただ》しいもの、一番良《いちばんよ》いもの","noteJaRuby":"「最《もっと》も」は「一番《いちばん》」の意味《いみ》。「適切《てきせつ》なもの」を選《えら》ぶ問題《もんだい》と「適切《てきせつ》でないもの」を選《えら》ぶ問題《もんだい》を読《よ》み違《ちが》えると全問落《ぜんもんお》とす。設問《せつもん》の最後《さいご》まで必《かなら》ず読《よ》む。","noteEnRuby":"\"最《もっと》も\" means \"the most\". Misreading 適切《てきせつ》 (appropriate) vs 適切《てきせつ》でない (not appropriate) reverses your answer. Always read to the end of the question."},{"id":"KV002","term":"誤っているもの","kana":"あやまっているもの","romaji":"ayamatteirumono","english":"incorrect / wrong","easyJa":"間違っているもの","englishDesc":"Something that is wrong or mistaken. Used when the exam asks you to find the WRONG statement.","exampleJa":"この病気の説明として、誤っているものを1つ選びなさい。","exampleEn":"Choose the ONE incorrect explanation of this disease.","exampleRuby":"この病気《びょうき》の説明《せつめい》として、誤《あやま》っているものを1つ選《えら》びなさい。","exampleGapRuby":"この病気《びょうき》の説明《せつめい》として、{{GAP}}を1つ選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"全科目共通","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「誤っているもの」を選ぶ設問では、正しい選択肢が4つ並ぶ。正しいものを選んでしまうミスが非常に多い。「誤」の字に印をつける習慣を。","noteEn":"When asked for 誤っているもの, four of five options are correct. Marking the character 誤 as you read prevents the most common mistake.","gapTerm":"誤っているもの","termRuby":"誤《あやま》っているもの","easyJaRuby":"間違《まちが》っているもの","noteJaRuby":"「誤《あやま》っているもの」を選《えら》ぶ設問《せつもん》では、正《ただ》しい選択肢《せんたくし》が4つ並《なら》ぶ。正《ただ》しいものを選《えら》んでしまうミスが非常《ひじょう》に多《おお》い。「誤《あやま》」の字《じ》に印《しるし》をつける習慣《しゅうかん》を。","noteEnRuby":"When asked for 誤《あやま》っているもの, four of five options are correct. Marking the character 誤《あやま》 as you read prevents the most common mistake."},{"id":"KV003","term":"留意する","kana":"りゅういする","romaji":"ryūisuru","english":"to keep in mind / to pay attention","easyJa":"気をつける、注意する","englishDesc":"To keep something in mind and be careful about it.","exampleJa":"利用者のプライバシーに留意する。","exampleEn":"Keep the user's privacy in mind.","exampleRuby":"利用者《りようしゃ》のプライバシーに留意《りゅうい》する。","exampleGapRuby":"利用者《りようしゃ》のプライバシーに{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「注意する」より少し硬い書き言葉。「留意点＝気をつけること」。「留」は「とどめる」で、心にとどめる意味。","noteEn":"More formal than 注意する. 留 means \"to keep/retain\" — to keep something in your mind.","gapTerm":"留意する","termRuby":"留意《りゅうい》する","easyJaRuby":"気《き》をつける、注意《ちゅうい》する","noteJaRuby":"「注意《ちゅうい》する」より少《すこ》し硬《かた》い書《か》き言葉《ことば》。「留意点《りゅういてん》＝気《き》をつけること」。「留《りゅう》」は「とどめる」で、心《こころ》にとどめる意味《いみ》。","noteEnRuby":"More formal than 注意《ちゅうい》する. 留《りゅう》 means \"to keep/retain\" — to keep something in your mind."},{"id":"KV004","term":"促す","kana":"うながす","romaji":"unagasu","english":"to encourage / to prompt","easyJa":"利用者が自分でやるように声をかける","englishDesc":"To encourage a person to do something by themselves, with words.","exampleJa":"こまめな水分補給を促す。","exampleEn":"Encourage frequent fluid intake.","exampleRuby":"こまめな水分補給《すいぶんほきゅう》を促《うなが》す。","exampleGapRuby":"こまめな水分補給《すいぶんほきゅう》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「促す」は本人にやってもらう支援。「させる」（強制）とは違う。自立支援の設問では「促す」が正解になりやすい。","noteEn":"促す = encourage the person to act themselves. It is NOT forcing (させる). In self-reliance questions, 促す is often the correct choice.","gapTerm":"促す","termRuby":"促《うなが》す","easyJaRuby":"利用者《りようしゃ》が自分《じぶん》でやるように声《こえ》をかける","noteJaRuby":"「促《うなが》す」は本人《ほんにん》にやってもらう支援《しえん》。「させる」（強制《きょうせい》）とは違《ちが》う。自立支援《じりつしえん》の設問《せつもん》では「促《うなが》す」が正解《せいかい》になりやすい。","noteEnRuby":"促《うなが》す = encourage the person to act themselves. It is NOT forcing (させる). In self-reliance questions, 促《うなが》す is often the correct choice."},{"id":"KV005","term":"優先する","kana":"ゆうせんする","romaji":"yūsensuru","english":"to prioritize","easyJa":"一番先にやる、一番大事にする","englishDesc":"To do or treat something first, before other things.","exampleJa":"利用者の安全確認を優先する。","exampleEn":"Give priority to checking the user's safety.","exampleRuby":"利用者《りようしゃ》の安全確認《あんぜんかくにん》を優先《ゆうせん》する。","exampleGapRuby":"利用者《りようしゃ》の安全確認《あんぜんかくにん》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「優先する」＝一番先。試験では「安全」「本人の意思」が優先されることが多い。「優先順位」という形でも出る。","noteEn":"優先 = do first. In the exam, safety and the person's own wishes usually take priority. Also appears as 優先順位 (order of priority).","gapTerm":"優先する","termRuby":"優先《ゆうせん》する","easyJaRuby":"一番先《いちばんさき》にやる、一番大事《いちばんだいじ》にする","noteJaRuby":"「優先《ゆうせん》する」＝一番先《いちばんさき》。試験《しけん》では「安全《あんぜん》」「本人《ほんにん》の意思《いし》」が優先《ゆうせん》されることが多《おお》い。「優先順位《ゆうせんじゅんい》」という形《かたち》でも出《で》る。","noteEnRuby":"優先《ゆうせん》 = do first. In the exam, safety and the person's own wishes usually take priority. Also appears as 優先順位《ゆうせんじゅんい》 (order of priority)."},{"id":"KV006","term":"尊重する","kana":"そんちょうする","romaji":"sonchōsuru","english":"to respect","easyJa":"大切にする","englishDesc":"To treat a person's feelings and decisions as important.","exampleJa":"利用者の自己決定を尊重する。","exampleEn":"Respect the user's self-determination.","exampleRuby":"利用者《りようしゃ》の自己決定《じこけってい》を尊重《そんちょう》する。","exampleGapRuby":"利用者《りようしゃ》の自己決定《じこけってい》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"人間の尊厳と自立","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「尊重する」は人や意思に使う。物には使わない。「尊敬」（respect a person's greatness）とは別の語。","noteEn":"尊重 is used for a person's wishes or dignity, not for objects. Do not confuse with 尊敬 (admiring someone).","gapTerm":"尊重する","termRuby":"尊重《そんちょう》する","easyJaRuby":"大切《たいせつ》にする","noteJaRuby":"「尊重《そんちょう》する」は人《ひと》や意思《いし》に使《つか》う。物《もの》には使《つか》わない。「尊敬《そんけい》」（respect a person's greatness）とは別《べつ》の語《ご》。","noteEnRuby":"尊重《そんちょう》 is used for a person's wishes or dignity, not for objects. Do not confuse with 尊敬《そんけい》 (admiring someone)."},{"id":"KV007","term":"把握する","kana":"はあくする","romaji":"haakusuru","english":"to understand / to grasp","easyJa":"しっかりと分かる、状況を知る","englishDesc":"To correctly understand a situation or a person's condition.","exampleJa":"利用者の毎日の健康状態を把握する。","exampleEn":"Understand the user's daily health condition.","exampleRuby":"利用者《りようしゃ》の毎日《まいにち》の健康状態《けんこうじょうたい》を把握《はあく》する。","exampleGapRuby":"利用者《りようしゃ》の毎日《まいにち》の健康状態《けんこうじょうたい》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「把握」は「はあく」。「はいあく」ではない。「理解する」より「事実をつかむ」に近い。","noteEn":"Read as ha-a-ku, not \"haiaku\". Closer to \"grasp the facts\" than 理解する (understand a concept).","gapTerm":"把握する","termRuby":"把握《はあく》する","easyJaRuby":"しっかりと分《わ》かる、状況《じょうきょう》を知《し》る","noteJaRuby":"「把握《はあく》」は「はあく」。「はいあく」ではない。「理解《りかい》する」より「事実《じじつ》をつかむ」に近《ちか》い。","noteEnRuby":"Read as ha-a-ku, not \"haiaku\". Closer to \"grasp the facts\" than 理解《りかい》する (understand a concept)."},{"id":"KV008","term":"該当する","kana":"がいとうする","romaji":"gaitōsuru","english":"to apply to / to correspond to","easyJa":"当てはまる、条件に合う","englishDesc":"To fit or match a stated condition.","exampleJa":"次の症状に該当する疾患を選びなさい。","exampleEn":"Choose the disease that corresponds to the following symptoms.","exampleRuby":"次《つぎ》の症状《しょうじょう》に該当《がいとう》する疾患《しっかん》を選《えら》びなさい。","exampleGapRuby":"次《つぎ》の症状《しょうじょう》に{{GAP}}疾患《しっかん》を選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"全科目共通","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「該当する」と「該当しない」で答えが正反対になる。「〜に該当する」の助詞は「に」。","noteEn":"該当する and 該当しない give opposite answers. The particle is always に (〜に該当する).","gapTerm":"該当する","termRuby":"該当《がいとう》する","easyJaRuby":"当《あ》てはまる、条件《じょうけん》に合《あ》う","noteJaRuby":"「該当《がいとう》する」と「該当《がいとう》しない」で答《こた》えが正反対《せいはんたい》になる。「〜に該当《がいとう》する」の助詞《じょし》は「に」。","noteEnRuby":"該当《がいとう》する and 該当《がいとう》しない give opposite answers. The particle is always に (〜に該当《がいとう》する)."},{"id":"KV009","term":"配慮する","kana":"はいりょする","romaji":"hairyosuru","english":"to consider / to accommodate","easyJa":"相手のために気をつかう","englishDesc":"To be careful and thoughtful about the other person's feelings or situation.","exampleJa":"利用者の羞恥心に配慮する。","exampleEn":"Be considerate of the user's feelings of embarrassment.","exampleRuby":"利用者《りようしゃ》の羞恥心《しゅうちしん》に配慮《はいりょ》する。","exampleGapRuby":"利用者《りようしゃ》の羞恥心《しゅうちしん》に{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「配慮」は相手のために気をつかうこと。「遠慮」（refrain / hold back）と混同しやすい。","noteEn":"配慮 = consideration for others. Easily confused with 遠慮 (to hold back / decline).","gapTerm":"配慮する","termRuby":"配慮《はいりょ》する","easyJaRuby":"相手《あいて》のために気《き》をつかう","noteJaRuby":"「配慮《はいりょ》」は相手《あいて》のために気《き》をつかうこと。「遠慮《えんりょ》」（refrain / hold back）と混同《こんどう》しやすい。","noteEnRuby":"配慮《はいりょ》 = consideration for others. Easily confused with 遠慮《えんりょ》 (to hold back / decline)."},{"id":"KV010","term":"援助する","kana":"えんじょする","romaji":"enjosuru","english":"to assist / to support","easyJa":"手伝う、サポートする","englishDesc":"To help someone; to give support.","exampleJa":"日常生活動作（ADL）を援助する。","exampleEn":"Assist with activities of daily living (ADL).","exampleRuby":"日常生活動作《にちじょうせいかつどうさ》（ADL）を援助《えんじょ》する。","exampleGapRuby":"日常生活動作《にちじょうせいかつどうさ》（ADL）を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「援助」「支援」「介助」は似ているが、「介助」は体に直接触れる手助け、「支援」は生活全体を支えること。","noteEn":"援助 / 支援 / 介助 are similar. 介助 = hands-on physical help; 支援 = supporting the person's life overall.","gapTerm":"援助する","termRuby":"援助《えんじょ》する","easyJaRuby":"手伝《てつだ》う、サポートする","noteJaRuby":"「援助《えんじょ》」「支援《しえん》」「介助《かいじょ》」は似《に》ているが、「介助《かいじょ》」は体《からだ》に直接触《ちょくせつふ》れる手助《てだす》け、「支援《しえん》」は生活全体《せいかつぜんたい》を支《ささ》えること。","noteEnRuby":"援助《えんじょ》 / 支援《しえん》 / 介助《かいじょ》 are similar. 介助《かいじょ》 = hands-on physical help; 支援《しえん》 = supporting the person's life overall."},{"id":"KV011","term":"伴う","kana":"ともなう","romaji":"tomonau","english":"to accompany / to go with","easyJa":"一緒に起こる、〜のせいで起きる","englishDesc":"To happen together with something else; to be caused by it.","exampleJa":"加齢に伴う身体機能の変化について答えなさい。","exampleEn":"Answer about the changes in physical function that accompany ageing.","exampleRuby":"加齢《かれい》に伴《ともな》う身体機能《しんたいきのう》の変化《へんか》について答《こた》えなさい。","exampleGapRuby":"加齢《かれい》に{{GAP}}身体機能《しんたいきのう》の変化《へんか》について答《こた》えなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"発達と老化の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「〜に伴う」の形で出る。助詞は「に」。「伴って」と「伴い」は同じ意味の書き言葉。","noteEn":"Appears as 〜に伴う with the particle に. 伴って and 伴い mean the same in written style.","gapTerm":"伴う","termRuby":"伴《ともな》う","easyJaRuby":"一緒《いっしょ》に起《お》こる、〜のせいで起《お》きる","noteJaRuby":"「〜に伴《ともな》う」の形《かたち》で出《で》る。助詞《じょし》は「に」。「伴《ともな》って」と「伴《ともな》い」は同《おな》じ意味《いみ》の書《か》き言葉《ことば》。","noteEnRuby":"Appears as 〜に伴《ともな》う with the particle に. 伴《ともな》って and 伴《ともな》い mean the same in written style."},{"id":"KV012","term":"要因","kana":"よういん","romaji":"yōin","english":"primary factor / cause","easyJa":"原因、そうなる理由","englishDesc":"The main reason why something happens.","exampleJa":"転倒の主な要因として適切なものを選びなさい。","exampleEn":"Choose the appropriate main factor for a fall.","exampleRuby":"転倒《てんとう》の主《おも》な要因《よういん》として適切《てきせつ》なものを選《えら》びなさい。","exampleGapRuby":"転倒《てんとう》の主《おも》な{{GAP}}として適切《てきせつ》なものを選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「要因」＝原因。「主要因」は一番大きな原因。「用因」という語はない。","noteEn":"要因 = cause/factor. 主要因 = the main factor. There is no word 用因 — watch the kanji.","gapTerm":"要因","termRuby":"要因《よういん》","easyJaRuby":"原因《げんいん》、そうなる理由《りゆう》","noteJaRuby":"「要因《よういん》」＝原因《げんいん》。「主要因《しゅよういん》」は一番大《いちばんおお》きな原因《げんいん》。「用因《よういん》」という語《ご》はない。","noteEnRuby":"要因《よういん》 = cause/factor. 主要因《しゅよういん》 = the main factor. There is no word 用因《よういん》 — watch the kanji."},{"id":"KV013","term":"特徴","kana":"とくちょう","romaji":"tokuchō","english":"characteristic / feature","easyJa":"そのものだけが持つ特別なところ","englishDesc":"A special point that only that thing has.","exampleJa":"アルツハイマー型認知症の特徴に関する説明。","exampleEn":"An explanation of the characteristics of Alzheimer's-type dementia.","exampleRuby":"アルツハイマー型認知症《がたにんちしょう》の特徴《とくちょう》に関《かん》する説明《せつめい》。","exampleGapRuby":"アルツハイマー型認知症《がたにんちしょう》の{{GAP}}に関《かん》する説明《せつめい》。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"全科目共通","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「特徴」（characteristic, neutral）と「特長」（strong point, positive）は同じ「とくちょう」。試験では「特徴」。","noteEn":"特徴 (neutral characteristic) and 特長 (merit) are both read tokuchō. The exam uses 特徴.","gapTerm":"特徴","termRuby":"特徴《とくちょう》","easyJaRuby":"そのものだけが持《も》つ特別《とくべつ》なところ","noteJaRuby":"「特徴《とくちょう》」（characteristic, neutral）と「特長《とくちょう》」（strong point, positive）は同《おな》じ「とくちょう」。試験《しけん》では「特徴《とくちょう》」。","noteEnRuby":"特徴《とくちょう》 (neutral characteristic) and 特長《とくちょう》 (merit) are both read tokuchō. The exam uses 特徴《とくちょう》."},{"id":"KV014","term":"原則","kana":"げんそく","romaji":"gensoku","english":"principle / general rule","easyJa":"基本的なルール、いつも守ること","englishDesc":"A basic rule that is normally always followed.","exampleJa":"介護の原則に基づく対応として正しいものを選びなさい。","exampleEn":"Choose the correct response based on the principles of care.","exampleRuby":"介護《かいご》の原則《げんそく》に基《もと》づく対応《たいおう》として正《ただ》しいものを選《えら》びなさい。","exampleGapRuby":"介護《かいご》の{{GAP}}に基《もと》づく対応《たいおう》として正《ただ》しいものを選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「原則」は「例外がある基本ルール」。「原則禁止」＝「基本は禁止だが例外がある」。身体拘束の問題で頻出。","noteEn":"原則 means a basic rule that has exceptions. 原則禁止 = \"banned as a rule, with exceptions\" — key in physical-restraint questions.","gapTerm":"原則","termRuby":"原則《げんそく》","easyJaRuby":"基本的《きほんてき》なルール、いつも守《まも》ること","noteJaRuby":"「原則《げんそく》」は「例外《れいがい》がある基本《きほん》ルール」。「原則禁止《げんそくきんし》」＝「基本《きほん》は禁止《きんし》だが例外《れいがい》がある」。身体拘束《しんたいこうそく》の問題《もんだい》で頻出《ひんしゅつ》。","noteEnRuby":"原則《げんそく》 means a basic rule that has exceptions. 原則禁止《げんそくきんし》 = \"banned as a rule, with exceptions\" — key in physical-restraint questions."},{"id":"KV015","term":"低下する","kana":"ていかする","romaji":"teikasuru","english":"to decline / to decrease","easyJa":"力や機能が落ちる、弱くなる","englishDesc":"When ability or function becomes weaker.","exampleJa":"嚥下機能が低下した利用者への食事介助。","exampleEn":"Meal assistance for a user whose swallowing function has declined.","exampleRuby":"嚥下機能《えんげきのう》が低下《ていか》した利用者《りようしゃ》への食事介助《しょくじかいじょ》。","exampleGapRuby":"嚥下機能《えんげきのう》が{{GAP}}した利用者《りようしゃ》への食事介助《しょくじかいじょ》。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「低下」は機能が落ちること。「悪化」（get worse, for illness）と使い分ける。","noteEn":"低下 = function declines. Use 悪化 when a disease gets worse.","gapTerm":"低下","termRuby":"低下《ていか》する","easyJaRuby":"力《ちから》や機能《きのう》が落《お》ちる、弱《よわ》くなる","noteJaRuby":"「低下《ていか》」は機能《きのう》が落《お》ちること。「悪化《あっか》」（get worse, for illness）と使《つか》い分《わ》ける。","noteEnRuby":"低下《ていか》 = function declines. Use 悪化《あっか》 when a disease gets worse."},{"id":"KV016","term":"提供する","kana":"ていきょうする","romaji":"teikyōsuru","english":"to provide","easyJa":"サービスや物をあげる、行う","englishDesc":"To give a service or thing to someone.","exampleJa":"利用者に適切な介護サービスを提供する。","exampleEn":"Provide appropriate care services to the user.","exampleRuby":"利用者《りようしゃ》に適切《てきせつ》な介護《かいご》サービスを提供《ていきょう》する。","exampleGapRuby":"利用者《りようしゃ》に適切《てきせつ》な介護《かいご》サービスを{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「提供する」はサービスに使う。「あげる」より硬い書き言葉。「供」の字に注意。","noteEn":"提供 is used for services; it is the formal written form of \"give\". Note the kanji 供.","gapTerm":"提供する","termRuby":"提供《ていきょう》する","easyJaRuby":"サービスや物《もの》をあげる、行《おこな》う","noteJaRuby":"「提供《ていきょう》する」はサービスに使《つか》う。「あげる」より硬《かた》い書《か》き言葉《ことば》。「供《きょう》」の字《じ》に注意《ちゅうい》。","noteEnRuby":"提供《ていきょう》 is used for services; it is the formal written form of \"give\". Note the kanji 供《きょう》."},{"id":"KV017","term":"意図","kana":"いと","romaji":"ito","english":"intention","easyJa":"目的、どういうつもりでやったか","englishDesc":"The purpose or reason behind an action.","exampleJa":"著者の意図として最も適切なものを選びなさい。","exampleEn":"Choose the most appropriate intention of the writer.","exampleRuby":"著者《ちょしゃ》の意図《いと》として最《もっと》も適切《てきせつ》なものを選《えら》びなさい。","exampleGapRuby":"著者《ちょしゃ》の{{GAP}}として最《もっと》も適切《てきせつ》なものを選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"コミュニケーション技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「意図」（intention）と「意向」（wish）は似るが、「意図」は目的、「意向」は希望。","noteEn":"意図 (purpose behind an act) vs 意向 (a person's wish). They are different.","gapTerm":"意図","termRuby":"意図《いと》","easyJaRuby":"目的《もくてき》、どういうつもりでやったか","noteJaRuby":"「意図《いと》」（intention）と「意向《いこう》」（wish）は似《に》るが、「意図《いと》」は目的《もくてき》、「意向《いこう》」は希望《きぼう》。","noteEnRuby":"意図《いと》 (purpose behind an act) vs 意向《いこう》 (a person's wish). They are different."},{"id":"KV018","term":"制限する","kana":"せいげんする","romaji":"seigensuru","english":"to restrict / to limit","easyJa":"どこまでか決めて、それ以上はやらせないこと","englishDesc":"To set a limit and not allow more than that.","exampleJa":"水分摂取を制限されている利用者のケア。","exampleEn":"Care for a user whose fluid intake is restricted.","exampleRuby":"水分摂取《すいぶんせっしゅ》を制限《せいげん》されている利用者《りようしゃ》のケア。","exampleGapRuby":"水分摂取《すいぶんせっしゅ》を{{GAP}}されている利用者《りようしゃ》のケア。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「制限されている」は受身。誰が制限したか（医師）を読み取る。「制約」とほぼ同義だが試験は「制限」。","noteEn":"制限されている is passive — identify who set the limit (usually a doctor).","gapTerm":"制限","termRuby":"制限《せいげん》する","easyJaRuby":"どこまでか決《き》めて、それ以上《いじょう》はやらせないこと","noteJaRuby":"「制限《せいげん》されている」は受身《うけみ》。誰《だれ》が制限《せいげん》したか（医師《いし》）を読《よ》み取《と》る。「制約《せいやく》」とほぼ同義《どうぎ》だが試験《しけん》は「制限《せいげん》」。","noteEnRuby":"制限《せいげん》されている is passive — identify who set the limit (usually a doctor)."},{"id":"KV019","term":"促進する","kana":"そくしんする","romaji":"sokushinsuru","english":"to promote / to facilitate","easyJa":"物事が早く進むように助ける、促す","englishDesc":"To help something move forward faster.","exampleJa":"利用者の自立を促進するための支援。","exampleEn":"Support to promote the user's independence.","exampleRuby":"利用者《りようしゃ》の自立《じりつ》を促進《そくしん》するための支援《しえん》。","exampleGapRuby":"利用者《りようしゃ》の自立《じりつ》を{{GAP}}ための支援《しえん》。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「促進する」（push forward）と「促す」（encourage a person）を区別。「促進」は物事に、「促す」は人に使う。","noteEn":"促進 is used for processes; 促す is used for encouraging a person.","gapTerm":"促進する","termRuby":"促進《そくしん》する","easyJaRuby":"物事《ものごと》が早《はや》く進《すす》むように助《たす》ける、促《うなが》す","noteJaRuby":"「促進《そくしん》する」（push forward）と「促《うなが》す」（encourage a person）を区別《くべつ》。「促進《そくしん》」は物事《ものごと》に、「促《うなが》す」は人《ひと》に使《つか》う。","noteEnRuby":"促進《そくしん》 is used for processes; 促《うなが》す is used for encouraging a person."},{"id":"KV020","term":"推奨する","kana":"すいしょうする","romaji":"suishōsuru","english":"to recommend","easyJa":"これがいいよと勧める","englishDesc":"To say that something is good and should be done.","exampleJa":"感染予防のために推奨される手洗い方法。","exampleEn":"The hand-washing method recommended for infection prevention.","exampleRuby":"感染予防《かんせんよぼう》のために推奨《すいしょう》される手洗《てあら》い方法《ほうほう》。","exampleGapRuby":"感染予防《かんせんよぼう》のために{{GAP}}される手洗《てあら》い方法《ほうほう》。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「推奨」は「すすめる」。「推薦」（recommend a person）と混同しない。","noteEn":"推奨 = recommend a method. 推薦 = recommend a person. Do not mix them.","gapTerm":"推奨","termRuby":"推奨《すいしょう》する","easyJaRuby":"これがいいよと勧《すす》める","noteJaRuby":"「推奨《すいしょう》」は「すすめる」。「推薦《すいせん》」（recommend a person）と混同《こんどう》しない。","noteEnRuby":"推奨《すいしょう》 = recommend a method. 推薦《すいせん》 = recommend a person. Do not mix them."},{"id":"KV021","term":"目的","kana":"もくてき","romaji":"mokuteki","english":"purpose","easyJa":"何のためにそれをするかというゴール","englishDesc":"The goal; what something is done for.","exampleJa":"介護予防の目的として適切なものを選びなさい。","exampleEn":"Choose the appropriate purpose of care prevention.","exampleRuby":"介護予防《かいごよぼう》の目的《もくてき》として適切《てきせつ》なものを選《えら》びなさい。","exampleGapRuby":"介護予防《かいごよぼう》の{{GAP}}として適切《てきせつ》なものを選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「目的」（purpose）と「目標」（goal/target）は違う。介護過程では「目標」は測れる形で書く。","noteEn":"目的 = purpose; 目標 = measurable goal. In the care process they are used differently.","gapTerm":"目的","termRuby":"目的《もくてき》","easyJaRuby":"何《なに》のためにそれをするかというゴール","noteJaRuby":"「目的《もくてき》」（purpose）と「目標《もくひょう》」（goal/target）は違《ちが》う。介護過程《かいごかてい》では「目標《もくひょう》」は測《はか》れる形《かたち》で書《か》く。","noteEnRuby":"目的《もくてき》 = purpose; 目標《もくひょう》 = measurable goal. In the care process they are used differently."},{"id":"KV022","term":"維持する","kana":"いじする","romaji":"ijisuru","english":"to maintain","easyJa":"今の状態をそのまま保つ、悪くしない","englishDesc":"To keep the present condition and not let it get worse.","exampleJa":"利用者の残存機能を維持する。","exampleEn":"Maintain the user's remaining abilities.","exampleRuby":"利用者《りようしゃ》の残存機能《ざんぞんきのう》を維持《いじ》する。","exampleGapRuby":"利用者《りようしゃ》の残存機能《ざんぞんきのう》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「維持」は今のまま保つ。「向上」（improve）と反対の方向ではないので注意。","noteEn":"維持 = keep as is. It is not the opposite of 向上 (improve), just a different aim.","gapTerm":"維持する","termRuby":"維持《いじ》する","easyJaRuby":"今《いま》の状態《じょうたい》をそのまま保《たも》つ、悪《わる》くしない","noteJaRuby":"「維持《いじ》」は今《いま》のまま保《たも》つ。「向上《こうじょう》」（improve）と反対《はんたい》の方向《ほうこう》ではないので注意《ちゅうい》。","noteEnRuby":"維持《いじ》 = keep as is. It is not the opposite of 向上《こうじょう》 (improve), just a different aim."},{"id":"KV023","term":"予防する","kana":"よぼうする","romaji":"yobōsuru","english":"to prevent","easyJa":"悪いことが起きないように、先に防ぐ","englishDesc":"To stop a bad thing from happening before it starts.","exampleJa":"長期の臥床による褥瘡を予防する。","exampleEn":"Prevent pressure ulcers caused by long periods in bed.","exampleRuby":"長期《ちょうき》の臥床《がしょう》による褥瘡《じょくそう》を予防《よぼう》する。","exampleGapRuby":"長期《ちょうき》の臥床《がしょう》による褥瘡《じょくそう》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「予防」（before it happens）と「防止」（stop it）はほぼ同じ。「治療」（treat after it happens）とは別。","noteEn":"予防 and 防止 are close in meaning. Both differ from 治療 (treatment after onset).","gapTerm":"予防する","termRuby":"予防《よぼう》する","easyJaRuby":"悪《わる》いことが起《お》きないように、先《さき》に防《ふせ》ぐ","noteJaRuby":"「予防《よぼう》」（before it happens）と「防止《ぼうし》」（stop it）はほぼ同《おな》じ。「治療《ちりょう》」（treat after it happens）とは別《べつ》。","noteEnRuby":"予防《よぼう》 and 防止《ぼうし》 are close in meaning. Both differ from 治療《ちりょう》 (treatment after onset)."},{"id":"KV024","term":"観察する","kana":"かんさつする","romaji":"kansatsusuru","english":"to observe","easyJa":"状態がどうなっているか、よく見ること","englishDesc":"To look carefully at how a condition is.","exampleJa":"入浴中の利用者の顔色や呼吸を観察する。","exampleEn":"Observe the user's complexion and breathing during bathing.","exampleRuby":"入浴中《にゅうよくちゅう》の利用者《りようしゃ》の顔色《かおいろ》や呼吸《こきゅう》を観察《かんさつ》する。","exampleGapRuby":"入浴中《にゅうよくちゅう》の利用者《りようしゃ》の顔色《かおいろ》や呼吸《こきゅう》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「観察」は見るだけでなく「変化に気づく」こと。記録では観察した事実だけを書く。","noteEn":"観察 means noticing change, not just looking. Records should contain observed facts only.","gapTerm":"観察する","termRuby":"観察《かんさつ》する","easyJaRuby":"状態《じょうたい》がどうなっているか、よく見《み》ること","noteJaRuby":"「観察《かんさつ》」は見《み》るだけでなく「変化《へんか》に気《き》づく」こと。記録《きろく》では観察《かんさつ》した事実《じじつ》だけを書《か》く。","noteEnRuby":"観察《かんさつ》 means noticing change, not just looking. Records should contain observed facts only."},{"id":"KV025","term":"評価する","kana":"ひょうかする","romaji":"hyōkasuru","english":"to evaluate","easyJa":"計画がうまくいったかを確認すること","englishDesc":"To check whether a plan worked well.","exampleJa":"ケアプランの目標が達成できたか評価する。","exampleEn":"Evaluate whether the goals of the care plan were achieved.","exampleRuby":"ケアプランの目標《もくひょう》が達成《たっせい》できたか評価《ひょうか》する。","exampleGapRuby":"ケアプランの目標《もくひょう》が達成《たっせい》できたか{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"介護過程の順番は アセスメント→計画→実施→評価。「評価」は最後。順番を問う問題が頻出。","noteEn":"Care process order: assessment → planning → implementation → evaluation. Order questions are common.","gapTerm":"評価する","termRuby":"評価《ひょうか》する","easyJaRuby":"計画《けいかく》がうまくいったかを確認《かくにん》すること","noteJaRuby":"介護過程《かいごかてい》の順番《じゅんばん》は アセスメント→計画《けいかく》→実施《じっし》→評価《ひょうか》。「評価《ひょうか》」は最後《さいご》。順番《じゅんばん》を問《と》う問題《もんだい》が頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV026","term":"考慮する","kana":"こうりょする","romaji":"kōryosuru","english":"to consider","easyJa":"いろいろな事情をよく考えて決めること","englishDesc":"To think about various circumstances before deciding.","exampleJa":"利用者の生活習慣を考慮した支援を行う。","exampleEn":"Provide support that takes the user's lifestyle habits into account.","exampleRuby":"利用者《りようしゃ》の生活習慣《せいかつしゅうかん》を考慮《こうりょ》した支援《しえん》を行《おこな》う。","exampleGapRuby":"利用者《りようしゃ》の生活習慣《せいかつしゅうかん》を{{GAP}}した支援《しえん》を行《おこな》う。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「考慮」と「配慮」は近いが、「考慮」は考えること、「配慮」は気をつかって行動すること。","noteEn":"考慮 = to take into account (thinking); 配慮 = to act with consideration.","gapTerm":"考慮","termRuby":"考慮《こうりょ》する","easyJaRuby":"いろいろな事情《じじょう》をよく考《かんが》えて決《き》めること","noteJaRuby":"「考慮《こうりょ》」と「配慮《はいりょ》」は近《ちか》いが、「考慮《こうりょ》」は考《かんが》えること、「配慮《はいりょ》」は気《き》をつかって行動《こうどう》すること。","noteEnRuby":"考慮《こうりょ》 = to take into account (thinking); 配慮《はいりょ》 = to act with consideration."},{"id":"KV027","term":"確保する","kana":"かくほする","romaji":"kakuhosuru","english":"to secure","easyJa":"必要なものや安全を、確実にとること","englishDesc":"To make sure you get something you need, such as safety.","exampleJa":"車いすから移乗する前に、安全を確保する。","exampleEn":"Secure safety before transferring from the wheelchair.","exampleRuby":"車《くるま》いすから移乗《いじょう》する前《まえ》に、安全《あんぜん》を確保《かくほ》する。","exampleGapRuby":"車《くるま》いすから移乗《いじょう》する前《まえ》に、安全《あんぜん》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「確保する」は「必ず手に入れる／守る」。「安全を確保する」は定型表現として覚える。","noteEn":"確保 = make certain of. Learn 安全を確保する as a fixed phrase.","gapTerm":"確保する","termRuby":"確保《かくほ》する","easyJaRuby":"必要《ひつよう》なものや安全《あんぜん》を、確実《かくじつ》にとること","noteJaRuby":"「確保《かくほ》する」は「必《かなら》ず手《て》に入《い》れる／守《まも》る」。「安全《あんぜん》を確保《かくほ》する」は定型表現《ていけいひょうげん》として覚《おぼ》える。","noteEnRuby":"確保《かくほ》 = make certain of. Learn 安全《あんぜん》を確保《かくほ》する as a fixed phrase."},{"id":"KV028","term":"避ける","kana":"さける","romaji":"sakeru","english":"to avoid","easyJa":"そうならないように逃げる、やらないようにする","englishDesc":"To not do something so that a bad result does not happen.","exampleJa":"転倒のリスクがあるため、滑りやすい靴は避ける。","exampleEn":"Avoid slippery shoes because of the risk of falling.","exampleRuby":"転倒《てんとう》のリスクがあるため、滑《すべ》りやすい靴《くつ》は避《さ》ける。","exampleGapRuby":"転倒《てんとう》のリスクがあるため、滑《すべ》りやすい靴《くつ》は{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「避ける」は「さける」。「よける」とは読まない。「〜は避ける」＝しないほうがよい、という婉曲な禁止。","noteEn":"Read さける, not よける. 〜は避ける is an indirect way of saying \"should not do\".","gapTerm":"避ける","termRuby":"避《さ》ける","easyJaRuby":"そうならないように逃《に》げる、やらないようにする","noteJaRuby":"「避《さ》ける」は「さける」。「よける」とは読《よ》まない。「〜は避《さ》ける」＝しないほうがよい、という婉曲《えんきょく》な禁止《きんし》。","noteEnRuby":"Read さける, not よける. 〜は避《さ》ける is an indirect way of saying \"should not do\"."},{"id":"KV029","term":"状態","kana":"じょうたい","romaji":"jōtai","english":"condition / state","easyJa":"今の様子、その人の今の体のこと","englishDesc":"How a person or thing is right now.","exampleJa":"利用者の心身の状態に合わせた介護を行う。","exampleEn":"Provide care that matches the user's physical and mental condition.","exampleRuby":"利用者《りようしゃ》の心身《しんしん》の状態《じょうたい》に合《あ》わせた介護《かいご》を行《おこな》う。","exampleGapRuby":"利用者《りようしゃ》の心身《しんしん》の{{GAP}}に合《あ》わせた介護《かいご》を行《おこな》う。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「状態」（condition now）と「症状」（symptom）は別。「心身の状態」は定型表現。","noteEn":"状態 = present condition; 症状 = symptom. 心身の状態 is a set phrase.","gapTerm":"状態","termRuby":"状態《じょうたい》","easyJaRuby":"今《いま》の様子《ようす》、その人《ひと》の今《いま》の体《からだ》のこと","noteJaRuby":"「状態《じょうたい》」（condition now）と「症状《しょうじょう》」（symptom）は別《べつ》。「心身《しんしん》の状態《じょうたい》」は定型表現《ていけいひょうげん》。","noteEnRuby":"状態《じょうたい》 = present condition; 症状《しょうじょう》 = symptom. 心身《しんしん》の状態《じょうたい》 is a set phrase."},{"id":"KV030","term":"過程","kana":"かてい","romaji":"katei","english":"process","easyJa":"順番に進んでいく道すじ","englishDesc":"The steps that something goes through in order.","exampleJa":"介護の過程（介護過程）の順番として正しいもの。","exampleEn":"Choose the correct order of the care process.","exampleRuby":"介護《かいご》の過程《かてい》（介護過程《かいごかてい》）の順番《じゅんばん》として正《ただ》しいもの。","exampleGapRuby":"介護《かいご》の{{GAP}}（介護過程《かいごかてい》）の順番《じゅんばん》として正《ただ》しいもの。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「過程」（process）は「課程」（course of study）と同音。試験では「介護過程」。","noteEn":"過程 (process) and 課程 (school course) sound the same. The exam uses 介護過程.","gapTerm":"過程","termRuby":"過程《かてい》","easyJaRuby":"順番《じゅんばん》に進《すす》んでいく道《みち》すじ","noteJaRuby":"「過程《かてい》」（process）は「課程《かてい》」（course of study）と同音《どうおん》。試験《しけん》では「介護過程《かいごかてい》」。","noteEnRuby":"過程《かてい》 (process) and 課程《かてい》 (school course) sound the same. The exam uses 介護過程《かいごかてい》."},{"id":"KV031","term":"根拠","kana":"こんきょ","romaji":"konkyo","english":"basis / reason","easyJa":"なぜそうするのかという、はっきりとした理由","englishDesc":"A clear reason why you do something.","exampleJa":"介護を提供する時は、科学的根拠に基づく。","exampleEn":"Care should be provided based on scientific evidence.","exampleRuby":"介護《かいご》を提供《ていきょう》する時《とき》は、科学的根拠《かがくてきこんきょ》に基《もと》づく。","exampleGapRuby":"介護《かいご》を提供《ていきょう》する時《とき》は、科学的《かがくてき》{{GAP}}に基《もと》づく。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「根拠」は「理由＋証拠」。「〜に基づく」とセットで出る。助詞は「に」。","noteEn":"根拠 = reason plus evidence. Usually paired with 〜に基づく (based on).","gapTerm":"根拠","termRuby":"根拠《こんきょ》","easyJaRuby":"なぜそうするのかという、はっきりとした理由《りゆう》","noteJaRuby":"「根拠《こんきょ》」は「理由《りゆう》＋証拠《しょうこ》」。「〜に基《もと》づく」とセットで出《で》る。助詞《じょし》は「に」。","noteEnRuby":"根拠《こんきょ》 = reason plus evidence. Usually paired with 〜に基《もと》づく (based on)."},{"id":"KV032","term":"実施する","kana":"じっしする","romaji":"jisshisuru","english":"to implement / to execute","easyJa":"計画したことを実際にやること","englishDesc":"To actually do what was planned.","exampleJa":"ケアプランに基づいて介護を実施する。","exampleEn":"Implement care based on the care plan.","exampleRuby":"ケアプランに基《もと》づいて介護《かいご》を実施《じっし》する。","exampleGapRuby":"ケアプランに基《もと》づいて介護《かいご》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「実施」（carry out a plan）と「実行」（do）はほぼ同義だが、制度の文では「実施」。","noteEn":"実施 and 実行 are close; official and legal texts use 実施.","gapTerm":"実施する","termRuby":"実施《じっし》する","easyJaRuby":"計画《けいかく》したことを実際《じっさい》にやること","noteJaRuby":"「実施《じっし》」（carry out a plan）と「実行《じっこう》」（do）はほぼ同義《どうぎ》だが、制度《せいど》の文《ぶん》では「実施《じっし》」。","noteEnRuby":"実施《じっし》 and 実行《じっこう》 are close; official and legal texts use 実施《じっし》."},{"id":"KV033","term":"継続する","kana":"けいぞくする","romaji":"keizokusuru","english":"to continue","easyJa":"やめずに、ずっと続けること","englishDesc":"To keep doing something without stopping.","exampleJa":"同じ方法でリハビリを継続する。","exampleEn":"Continue rehabilitation using the same method.","exampleRuby":"同《おな》じ方法《ほうほう》でリハビリを継続《けいぞく》する。","exampleGapRuby":"同《おな》じ方法《ほうほう》でリハビリを{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「継続」（keep doing）と「持続」（keep lasting）を区別。「継続は人が続ける」「持続は状態が続く」。","noteEn":"継続 = a person keeps doing; 持続 = a state keeps lasting.","gapTerm":"継続する","termRuby":"継続《けいぞく》する","easyJaRuby":"やめずに、ずっと続《つづ》けること","noteJaRuby":"「継続《けいぞく》」（keep doing）と「持続《じぞく》」（keep lasting）を区別《くべつ》。「継続《けいぞく》は人《ひと》が続《つづ》ける」「持続《じぞく》は状態《じょうたい》が続《つづ》く」。","noteEnRuby":"継続《けいぞく》 = a person keeps doing; 持続《じぞく》 = a state keeps lasting."},{"id":"KV034","term":"段階","kana":"だんかい","romaji":"dankai","english":"stage / phase","easyJa":"物事が進んでいくステップ、レベル","englishDesc":"A step or level in how something progresses.","exampleJa":"認知症の進行段階に合わせたケアを行う。","exampleEn":"Provide care matched to the stage of dementia.","exampleRuby":"認知症《にんちしょう》の進行段階《しんこうだんかい》に合《あ》わせたケアを行《おこな》う。","exampleGapRuby":"認知症《にんちしょう》の進行《しんこう》{{GAP}}に合《あ》わせたケアを行《おこな》う。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「段階」は「レベル」。「初期・中期・後期」とセットで覚える。","noteEn":"段階 = stage/level. Learn it with 初期 (early), 中期 (middle), 後期 (late).","gapTerm":"段階","termRuby":"段階《だんかい》","easyJaRuby":"物事《ものごと》が進《すす》んでいくステップ、レベル","noteJaRuby":"「段階《だんかい》」は「レベル」。「初期《しょき》・中期《ちゅうき》・後期《こうき》」とセットで覚《おぼ》える。","noteEnRuby":"段階《だんかい》 = stage/level. Learn it with 初期《しょき》 (early), 中期《ちゅうき》 (middle), 後期《こうき》 (late)."},{"id":"KV035","term":"役割","kana":"やくわり","romaji":"yakuwari","english":"role","easyJa":"その人がやらなければならない仕事や立場","englishDesc":"The job or position a person must fill.","exampleJa":"介護福祉士の役割として最も適切なもの。","exampleEn":"Choose the most appropriate role of a certified care worker.","exampleRuby":"介護福祉士《かいごふくしし》の役割《やくわり》として最《もっと》も適切《てきせつ》なもの。","exampleGapRuby":"介護福祉士《かいごふくしし》の{{GAP}}として最《もっと》も適切《てきせつ》なもの。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「役割」（role）と「役職」（job title）は違う。試験は「役割」。","noteEn":"役割 (role) is not 役職 (job title). The exam uses 役割.","gapTerm":"役割","termRuby":"役割《やくわり》","easyJaRuby":"その人《ひと》がやらなければならない仕事《しごと》や立場《たちば》","noteJaRuby":"「役割《やくわり》」（role）と「役職《やくしょく》」（job title）は違《ちが》う。試験《しけん》は「役割《やくわり》」。","noteEnRuby":"役割《やくわり》 (role) is not 役職《やくしょく》 (job title). The exam uses 役割《やくわり》."},{"id":"KV036","term":"肯定する","kana":"こうていする","romaji":"kōteisuru","english":"to affirm / to acknowledge","easyJa":"「それでいい」と認めること","englishDesc":"To accept what someone says as OK.","exampleJa":"利用者の発言を否定せず、肯定する。","exampleEn":"Do not deny what the user says; affirm it.","exampleRuby":"利用者《りようしゃ》の発言《はつげん》を否定《ひてい》せず、肯定《こうてい》する。","exampleGapRuby":"利用者《りようしゃ》の発言《はつげん》を否定《ひてい》せず、{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「肯定」⇔「否定」。認知症ケアでは「否定しない」が原則。二重否定「否定しないことはない」に注意。","noteEn":"肯定 ⇔ 否定. In dementia care the rule is \"do not deny\". Watch for double negatives.","gapTerm":"肯定する","termRuby":"肯定《こうてい》する","easyJaRuby":"「それでいい」と認《みと》めること","noteJaRuby":"「肯定《こうてい》」⇔「否定《ひてい》」。認知症《にんちしょう》ケアでは「否定《ひてい》しない」が原則《げんそく》。二重否定《にじゅうひてい》「否定《ひてい》しないことはない」に注意《ちゅうい》。","noteEnRuby":"肯定《こうてい》 ⇔ 否定《ひてい》. In dementia care the rule is \"do not deny\". Watch for double negatives."},{"id":"KV037","term":"共通する","kana":"きょうつうする","romaji":"kyōtsūsuru","english":"to have in common","easyJa":"どちらにも同じように当てはまること","englishDesc":"To be the same in both cases.","exampleJa":"2つの病気に共通する症状を選びなさい。","exampleEn":"Choose the symptom that the two diseases have in common.","exampleRuby":"2つの病気《びょうき》に共通《きょうつう》する症状《しょうじょう》を選《えら》びなさい。","exampleGapRuby":"2つの病気《びょうき》に{{GAP}}症状《しょうじょう》を選《えら》びなさい。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"全科目共通","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「共通する」（shared by both）と「共有する」（share information）は別。","noteEn":"共通する = shared in both; 共有する = to share information with others.","gapTerm":"共通する","termRuby":"共通《きょうつう》する","easyJaRuby":"どちらにも同《おな》じように当《あ》てはまること","noteJaRuby":"「共通《きょうつう》する」（shared by both）と「共有《きょうゆう》する」（share information）は別《べつ》。","noteEnRuby":"共通《きょうつう》する = shared in both; 共有《きょうゆう》する = to share information with others."},{"id":"KV038","term":"判断する","kana":"はんだんする","romaji":"handansuru","english":"to judge / to decide","easyJa":"どうすればいいか、状況を見て自分で決めること","englishDesc":"To look at a situation and decide what to do.","exampleJa":"利用者の表情から痛みの有無を判断する。","exampleEn":"Judge whether there is pain from the user's facial expression.","exampleRuby":"利用者《りようしゃ》の表情《ひょうじょう》から痛《いた》みの有無《うむ》を判断《はんだん》する。","exampleGapRuby":"利用者《りようしゃ》の表情《ひょうじょう》から痛《いた》みの有無《うむ》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「判断」（decide）と「診断」（diagnose）は違う。介護職は「診断」をしてはいけない。","noteEn":"判断 (judge) is not 診断 (diagnose). Care workers must never diagnose.","gapTerm":"判断する","termRuby":"判断《はんだん》する","easyJaRuby":"どうすればいいか、状況《じょうきょう》を見《み》て自分《じぶん》で決《き》めること","noteJaRuby":"「判断《はんだん》」（decide）と「診断《しんだん》」（diagnose）は違《ちが》う。介護職《かいごしょく》は「診断《しんだん》」をしてはいけない。","noteEnRuby":"判断《はんだん》 (judge) is not 診断《しんだん》 (diagnose). Care workers must never diagnose."},{"id":"KV039","term":"解釈する","kana":"かいしゃくする","romaji":"kaishakusuru","english":"to interpret","easyJa":"どういう意味なのかを考えて理解すること","englishDesc":"To think about what something means and understand it.","exampleJa":"利用者の言葉の背景を解釈する。","exampleEn":"Interpret the background of the user's words.","exampleRuby":"利用者《りようしゃ》の言葉《ことば》の背景《はいけい》を解釈《かいしゃく》する。","exampleGapRuby":"利用者《りようしゃ》の言葉《ことば》の背景《はいけい》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"コミュニケーション技術","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「解釈」は事実ではなく「意味づけ」。記録では事実と解釈を分けて書く。","noteEn":"解釈 is your interpretation, not a fact. In records, separate facts from interpretation.","gapTerm":"解釈する","termRuby":"解釈《かいしゃく》する","easyJaRuby":"どういう意味《いみ》なのかを考《かんが》えて理解《りかい》すること","noteJaRuby":"「解釈《かいしゃく》」は事実《じじつ》ではなく「意味《いみ》づけ」。記録《きろく》では事実《じじつ》と解釈《かいしゃく》を分《わ》けて書《か》く。","noteEnRuby":"解釈《かいしゃく》 is your interpretation, not a fact. In records, separate facts from interpretation."},{"id":"KV040","term":"定義","kana":"ていぎ","romaji":"teigi","english":"definition","easyJa":"「これはこういう意味です」とはっきり決めたルール","englishDesc":"A clear statement of what a word means.","exampleJa":"WHOによる健康の定義。","exampleEn":"The WHO definition of health.","exampleRuby":"WHOによる健康《けんこう》の定義《ていぎ》。","exampleGapRuby":"WHOによる健康《けんこう》の{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「定義」は「ていぎ」。WHOの健康の定義（身体・精神・社会的に良好）は頻出。","noteEn":"Read ていぎ. The WHO definition of health (physical, mental and social well-being) is frequently tested.","gapTerm":"定義","termRuby":"定義《ていぎ》","easyJaRuby":"「これはこういう意味《いみ》です」とはっきり決《き》めたルール","noteJaRuby":"「定義《ていぎ》」は「ていぎ」。WHOの健康《けんこう》の定義《ていぎ》（身体《しんたい》・精神《せいしん》・社会的《しゃかいてき》に良好《りょうこう》）は頻出《ひんしゅつ》。","noteEnRuby":""},{"id":"KV041","term":"訴える","kana":"うったえる","romaji":"uttaeru","english":"to complain of / to appeal","easyJa":"「痛い」「苦しい」と口に出して強く言うこと","englishDesc":"To say that you have pain or a problem.","exampleJa":"利用者が胸の痛みを訴える。","exampleEn":"The user complains of chest pain.","exampleRuby":"利用者《りようしゃ》が胸《むね》の痛《いた》みを訴《うった》える。","exampleGapRuby":"利用者《りようしゃ》が胸《むね》の痛《いた》みを{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"事例問題の定番表現「〜と訴えている」＝本人が言っている（主観情報）。観察した事実とは区別する。","noteEn":"〜と訴えている is case-study language meaning the person says it (subjective). Distinguish it from observed facts.","gapTerm":"訴える","termRuby":"訴《うった》える","easyJaRuby":"「痛《いた》い」「苦《くる》しい」と口《くち》に出《だ》して強《つよ》く言《い》うこと","noteJaRuby":"事例問題《じれいもんだい》の定番表現《ていばんひょうげん》「〜と訴《うった》えている」＝本人《ほんにん》が言《い》っている（主観情報《しゅかんじょうほう》）。観察《かんさつ》した事実《じじつ》とは区別《くべつ》する。","noteEnRuby":"〜と訴《うった》えている is case-study language meaning the person says it (subjective). Distinguish it from observed facts."},{"id":"KV042","term":"拒否する","kana":"きょひする","romaji":"kyohisuru","english":"to refuse / to reject","easyJa":"「嫌だ」「やりたくない」と断ること","englishDesc":"To say no; to not accept.","exampleJa":"入浴を拒否する利用者への対応。","exampleEn":"How to respond to a user who refuses bathing.","exampleRuby":"入浴《にゅうよく》を拒否《きょひ》する利用者《りようしゃ》への対応《たいおう》。","exampleGapRuby":"入浴《にゅうよく》を{{GAP}}利用者《りようしゃ》への対応《たいおう》。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"認知症の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「拒否」（refuse）と「拒絶」（reject strongly）は近い。介護では拒否の理由を探すのが原則。","noteEn":"拒否 (refuse) and 拒絶 (reject) are close. The rule in care is to look for the reason behind the refusal.","gapTerm":"拒否する","termRuby":"拒否《きょひ》する","easyJaRuby":"「嫌《いや》だ」「やりたくない」と断《た》ること","noteJaRuby":"「拒否《きょひ》」（refuse）と「拒絶《きょぜつ》」（reject strongly）は近《ちか》い。介護《かいご》では拒否《きょひ》の理由《りゆう》を探《さが》すのが原則《げんそく》。","noteEnRuby":"拒否《きょひ》 (refuse) and 拒絶《きょぜつ》 (reject) are close. The rule in care is to look for the reason behind the refusal."},{"id":"KV043","term":"兆候","kana":"ちょうこう","romaji":"chōkō","english":"sign / indication","easyJa":"何かが起こる前のサイン、前ぶれ","englishDesc":"A small sign that something is starting.","exampleJa":"脱水が疑われる兆候として適切なもの。","exampleEn":"Choose the appropriate sign that dehydration is suspected.","exampleRuby":"脱水《だっすい》が疑《うたが》われる兆候《ちょうこう》として適切《てきせつ》なもの。","exampleGapRuby":"脱水《だっすい》が疑《うたが》われる{{GAP}}として適切《てきせつ》なもの。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「兆候」（sign before it happens）と「症状」（symptom that appeared）は違う。「前兆」も同義。","noteEn":"兆候 = an early sign; 症状 = a symptom already present.","gapTerm":"兆候","termRuby":"兆候《ちょうこう》","easyJaRuby":"何《なに》かが起《お》こる前《まえ》のサイン、前《まえ》ぶれ","noteJaRuby":"「兆候《ちょうこう》」（sign before it happens）と「症状《しょうじょう》」（symptom that appeared）は違《ちが》う。「前兆《ぜんちょう》」も同義《どうぎ》。","noteEnRuby":"兆候《ちょうこう》 = an early sign; 症状《しょうじょう》 = a symptom already present."},{"id":"KV044","term":"意向","kana":"いこう","romaji":"ikō","english":"intention / wish","easyJa":"その人が「どうしたいか」という気持ちや考え","englishDesc":"What a person wants or wishes to do.","exampleJa":"本人の意向を確認してから決定する。","exampleEn":"Decide after confirming the person's own wishes.","exampleRuby":"本人《ほんにん》の意向《いこう》を確認《かくにん》してから決定《けってい》する。","exampleGapRuby":"本人《ほんにん》の{{GAP}}を確認《かくにん》してから決定《けってい》する。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"人間の尊厳と自立","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「意向」は本人の希望。「本人の意向」は自己決定の設問で頻出。「意見」より丁寧。","noteEn":"意向 = the person's own wish. 本人の意向 appears often in self-determination questions.","gapTerm":"意向","termRuby":"意向《いこう》","easyJaRuby":"その人《ひと》が「どうしたいか」という気持《きも》ちや考《かんが》え","noteJaRuby":"「意向《いこう》」は本人《ほんにん》の希望《きぼう》。「本人《ほんにん》の意向《いこう》」は自己決定《じこけってい》の設問《せつもん》で頻出《ひんしゅつ》。「意見《いけん》」より丁寧《ていねい》。","noteEnRuby":"意向《いこう》 = the person's own wish. 本人《ほんにん》の意向《いこう》 appears often in self-determination questions."},{"id":"KV045","term":"経過","kana":"けいか","romaji":"keika","english":"process / course (of illness)","easyJa":"時間が経つにつれて状態がどう変わったか","englishDesc":"How a condition changes over time.","exampleJa":"服薬後の状態の経過を観察する。","exampleEn":"Observe the course of the condition after taking medicine.","exampleRuby":"服薬後《ふくやくご》の状態《じょうたい》の経過《けいか》を観察《かんさつ》する。","exampleGapRuby":"服薬後《ふくやくご》の状態《じょうたい》の{{GAP}}を観察《かんさつ》する。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「経過」（course over time）と「過程」（steps）を区別。「経過観察」は定型表現。","noteEn":"経過 = change over time; 過程 = the steps. 経過観察 (watchful waiting) is a set phrase.","gapTerm":"経過","termRuby":"経過《けいか》","easyJaRuby":"時間《じかん》が経《た》つにつれて状態《じょうたい》がどう変《か》わったか","noteJaRuby":"「経過《けいか》」（course over time）と「過程《かてい》」（steps）を区別《くべつ》。「経過観察《けいかかんさつ》」は定型表現《ていけいひょうげん》。","noteEnRuby":"経過《けいか》 = change over time; 過程《かてい》 = the steps. 経過観察《けいかかんさつ》 (watchful waiting) is a set phrase."},{"id":"KV046","term":"該当しない","kana":"がいとうしない","romaji":"gaitōshinai","english":"does not apply","easyJa":"当てはまらない（※否定形に注意）","englishDesc":"Does not fit the stated condition.","exampleJa":"介護保険のサービスに該当しないものを選べ。","exampleEn":"Choose the item that does NOT apply to long-term care insurance services.","exampleRuby":"介護保険《かいごほけん》のサービスに該当《がいとう》しないものを選《えら》べ。","exampleGapRuby":"介護保険《かいごほけん》のサービスに{{GAP}}ものを選《えら》べ。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"社会の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「該当しないもの」は否定の設問。選択肢4つが「該当する」ので混乱しやすい。","noteEn":"該当しないもの is a negative question: four options DO apply. Easy to answer backwards.","gapTerm":"該当しない","termRuby":"該当《がいとう》しない","easyJaRuby":"当《あ》てはまらない（※否定形《ひていけい》に注意《ちゅうい》）","noteJaRuby":"「該当《がいとう》しないもの」は否定《ひてい》の設問《せつもん》。選択肢《せんたくし》4つが「該当《がいとう》する」ので混乱《こんらん》しやすい。","noteEnRuby":"該当《がいとう》しないもの is a negative question: four options DO apply. Easy to answer backwards."},{"id":"KV047","term":"自覚する","kana":"じかくする","romaji":"jikakusuru","english":"to realize / to be aware of","easyJa":"自分自身の状態や病気に自分で気づくこと","englishDesc":"To notice and understand something about yourself.","exampleJa":"認知症の初期は、本人がもの忘れを自覚していることが多い。","exampleEn":"In early dementia, the person is often aware of their own forgetfulness.","exampleRuby":"認知症《にんちしょう》の初期《しょき》は、本人《ほんにん》がもの忘《わす》れを自覚《じかく》していることが多《おお》い。","exampleGapRuby":"認知症《にんちしょう》の初期《しょき》は、本人《ほんにん》がもの忘《わす》れを{{GAP}}していることが多《おお》い。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"認知症の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「自覚」は本人が気づくこと。「自覚症状」は本人が感じる症状。「他覚」は他人が見てわかる症状。","noteEn":"自覚 = the person notices it themselves. 自覚症状 = symptom the person feels; 他覚症状 = what others can observe.","gapTerm":"自覚","termRuby":"自覚《じかく》する","easyJaRuby":"自分自身《じぶんじしん》の状態《じょうたい》や病気《びょうき》に自分《じぶん》で気《き》づくこと","noteJaRuby":"「自覚《じかく》」は本人《ほんにん》が気《き》づくこと。「自覚症状《じかくしょうじょう》」は本人《ほんにん》が感《かん》じる症状《しょうじょう》。「他覚《たかく》」は他人《たにん》が見《み》てわかる症状《しょうじょう》。","noteEnRuby":"自覚《じかく》 = the person notices it themselves. 自覚症状《じかくしょうじょう》 = symptom the person feels; 他覚症状《たかくしょうじょう》 = what others can observe."},{"id":"KV048","term":"助言する","kana":"じょげんする","romaji":"jogensuru","english":"to advise","easyJa":"「こうしたらいいよ」とアドバイスをすること","englishDesc":"To tell someone what would be good to do.","exampleJa":"家族に対して、介護負担を減らすための助言する。","exampleEn":"Advise the family on ways to reduce the burden of care.","exampleRuby":"家族《かぞく》に対《たい》して、介護負担《かいごふたん》を減《へ》らすための助言《じょげん》する。","exampleGapRuby":"家族《かぞく》に対《たい》して、介護負担《かいごふたん》を減《へ》らすための{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「助言」（advice, equal position）と「指導」（instruction, from above）を区別。家族には「助言」。","noteEn":"助言 = advice between equals; 指導 = instruction from a superior. Families receive 助言.","gapTerm":"助言する","termRuby":"助言《じょげん》する","easyJaRuby":"「こうしたらいいよ」とアドバイスをすること","noteJaRuby":"「助言《じょげん》」（advice, equal position）と「指導《しどう》」（instruction, from above）を区別《くべつ》。家族《かぞく》には「助言《じょげん》」。","noteEnRuby":"助言《じょげん》 = advice between equals; 指導《しどう》 = instruction from a superior. Families receive 助言《じょげん》."},{"id":"KV049","term":"助長する","kana":"じょちょうする","romaji":"jochōsuru","english":"to promote / to worsen","easyJa":"悪い状態をさらに進めてしまうこと","englishDesc":"To make something (often something bad) grow stronger.","exampleJa":"安静にしすぎると、関節の拘縮を助長する。","exampleEn":"Too much rest promotes joint contracture.","exampleRuby":"安静《あんせい》にしすぎると、関節《かんせつ》の拘縮《こうしゅく》を助長《じょちょう》する。","exampleGapRuby":"安静《あんせい》にしすぎると、関節《かんせつ》の拘縮《こうしゅく》を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「助長」は良い意味では使わない。悪いことを強めるとき。「促進」との違いに注意。","noteEn":"助長 is used for making a BAD thing worse. Compare with 促進 (promote, neutral/positive).","gapTerm":"助長する","termRuby":"助長《じょちょう》する","easyJaRuby":"悪《わる》い状態《じょうたい》をさらに進《すす》めてしまうこと","noteJaRuby":"「助長《じょちょう》」は良《よ》い意味《いみ》では使《つか》わない。悪《わる》いことを強《つよ》めるとき。「促進《そくしん》」との違《ちが》いに注意《ちゅうい》。","noteEnRuby":"助長《じょちょう》 is used for making a BAD thing worse. Compare with 促進《そくしん》 (promote, neutral/positive)."},{"id":"KV050","term":"獲得する","kana":"かくとくする","romaji":"kakutokusuru","english":"to acquire","easyJa":"新しく手に入れる、できるようにする","englishDesc":"To newly get an ability or skill.","exampleJa":"リハビリによって新しいADL（日常生活動作）を獲得する。","exampleEn":"Acquire new activities of daily living through rehabilitation.","exampleRuby":"リハビリによって新《あたら》しいADL（日常生活動作《にちじょうせいかつどうさ》）を獲得《かくとく》する。","exampleGapRuby":"リハビリによって新《あたら》しいADL（日常生活動作《にちじょうせいかつどうさ》）を{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護過程","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「獲得」は新しく得ること。「維持」（keep）「回復」（get back）と区別。","noteEn":"獲得 = newly gain. Compare 維持 (keep) and 回復 (regain).","gapTerm":"獲得する","termRuby":"獲得《かくとく》する","easyJaRuby":"新《あたら》しく手《て》に入《い》れる、できるようにする","noteJaRuby":"「獲得《かくとく》」は新《あたら》しく得《え》ること。「維持《いじ》」（keep）「回復《かいふく》」（get back）と区別《くべつ》。","noteEnRuby":"獲得《かくとく》 = newly gain. Compare 維持《いじ》 (keep) and 回復《かいふく》 (regain)."},{"id":"KV051","term":"関与する","kana":"かんよする","romaji":"kan'yosuru","english":"to be involved / to participate","easyJa":"関係する、一緒に何かをすること","englishDesc":"To take part in something.","exampleJa":"介護福祉士もケアプランの作成に関与する。","exampleEn":"Certified care workers also take part in making the care plan.","exampleRuby":"介護福祉士《かいごふくしし》もケアプランの作成《さくせい》に関与《かんよ》する。","exampleGapRuby":"介護福祉士《かいごふくしし》もケアプランの作成《さくせい》に{{GAP}}。","categoryId":1,"category":"設問の指示語・独特の言い回し","categoryEn":"Exam instructions & question wording","subject":"介護の基本","level":2,"levelLab
