symptoms & diseases","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"交感神経（活動・緊張）と副交感神経（休息・リラックス）は反対。入浴・睡眠の設問で出る。","noteEn":"Sympathetic = activity and tension; parasympathetic = rest. Used in bathing and sleep questions.","gapTerm":"交感神経","termRuby":"交感神経《こうかんしんけい》","easyJaRuby":"緊張《きんちょう》している時《とき》や運動《うんどう》している時《とき》に働《はたら》く神経《しんけい》","noteJaRuby":"交感神経《こうかんしんけい》（活動《かつどう》・緊張《きんちょう》）と副交感神経《ふくこうかんしんけい》（休息《きゅうそく》・リラックス）は反対《はんたい》。入浴《にゅうよく》・睡眠《すいみん》の設問《せつもん》で出《で》る。","noteEnRuby":""},{"id":"KV117","term":"免疫","kana":"めんえき","romaji":"men'eki","english":"immunity","easyJa":"体の中に入ってきたばい菌やウイルスと戦う力","englishDesc":"The body's power to fight illness.","exampleJa":"加齢により免疫機能が低下する。","exampleEn":"Immune function declines with ageing.","exampleRuby":"加齢《かれい》により免疫機能《めんえききのう》が低下《ていか》する。","exampleGapRuby":"加齢《かれい》により{{GAP}}機能《きのう》が低下《ていか》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"免疫が下がるため高齢者は感染しやすく、重症化しやすい。","noteEn":"Because immunity falls, older people catch infections easily and become seriously ill.","gapTerm":"免疫","termRuby":"免疫《めんえき》","easyJaRuby":"体《からだ》の中《なか》に入《はい》ってきたばい菌《きん》やウイルスと戦《たたか》う力《ちから》","noteJaRuby":"免疫《めんえき》が下《お》がるため高齢者《こうれいしゃ》は感染《かんせん》しやすく、重症化《じゅうしょうか》しやすい。","noteEnRuby":""},{"id":"KV118","term":"骨盤","kana":"こつばん","romaji":"kotsuban","english":"pelvis","easyJa":"腰のあたりにある、内臓を支える大きなお椀型の骨","englishDesc":"The bones that form the hips.","exampleJa":"座る時は、骨盤を起こして深く座る。","exampleEn":"When sitting, tilt the pelvis upright and sit well back.","exampleRuby":"座《すわ》る時《とき》は、骨盤《こつばん》を起《お》こして深《ふか》く座《すわ》る。","exampleGapRuby":"座《すわ》る時《とき》は、{{GAP}}を起《お》こして深《ふか》く座《すわ》る。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"骨盤を立てて座ると誤嚥・褥瘡の予防になる。「仙骨座り（ずっこけ座り）」は不適切。","noteEn":"Sitting with an upright pelvis prevents aspiration and pressure ulcers. Sacral sitting is incorrect.","gapTerm":"骨盤","termRuby":"骨盤《こつばん》","easyJaRuby":"腰《こし》のあたりにある、内臓《ないぞう》を支《ささ》える大《おお》きなお椀型《わんがた》の骨《ほね》","noteJaRuby":"骨盤《こつばん》を立《た》てて座《すわ》ると誤嚥《ごえん》・褥瘡《じょくそう》の予防《よぼう》になる。「仙骨座《せんこつずわ》り（ずっこけ座《すわ》り）」は不適切《ふてきせつ》。","noteEnRuby":""},{"id":"KV119","term":"呼吸器","kana":"こきゅうき","romaji":"kokyūki","english":"respiratory system","easyJa":"鼻や肺など、息をするための体の部分","englishDesc":"The parts of the body used for breathing.","exampleJa":"加齢に伴う呼吸器系の変化について。","exampleEn":"About changes in the respiratory system caused by ageing.","exampleRuby":"加齢《かれい》に伴《ともな》う呼吸器系《こきゅうきけい》の変化《へんか》について。","exampleGapRuby":"加齢《かれい》に伴《ともな》う{{GAP}}系《けい》の変化《へんか》について。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"加齢で肺活量が減り、痰を出す力が弱くなる。誤嚥性肺炎につながる。","noteEn":"With age, lung capacity falls and the power to cough up sputum weakens, leading to aspiration pneumonia.","gapTerm":"呼吸器","termRuby":"呼吸器《こきゅうき》","easyJaRuby":"鼻《はな》や肺《はい》など、息《いき》をするための体《からだ》の部分《ぶぶん》","noteJaRuby":"加齢《かれい》で肺活量《はいかつりょう》が減《へ》り、痰《たん》を出《だ》す力《ちから》が弱《よわ》くなる。誤嚥性肺炎《ごえんせいはいえん》につながる。","noteEnRuby":""},{"id":"KV120","term":"消化器","kana":"しょうかき","romaji":"shōkaki","english":"digestive system","easyJa":"胃や腸など、食べ物を溶かして栄養を吸う体の部分","englishDesc":"The parts of the body used to digest food.","exampleJa":"消化器の機能が落ちると便秘になりやすい。","exampleEn":"When digestive function falls, constipation happens easily.","exampleRuby":"消化器《しょうかき》の機能《きのう》が落《お》ちると便秘《べんぴ》になりやすい。","exampleGapRuby":"{{GAP}}の機能《きのう》が落《お》ちると便秘《べんぴ》になりやすい。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"消化器の働きが落ちると便秘・低栄養になりやすい。","noteEn":"Reduced digestive function easily causes constipation and undernutrition.","gapTerm":"消化器","termRuby":"消化器《しょうかき》","easyJaRuby":"胃《い》や腸《ちょう》など、食《た》べ物《もの》を溶《と》かして栄養《えいよう》を吸《す》う体《からだ》の部分《ぶぶん》","noteJaRuby":"消化器《しょうかき》の働《はたら》きが落《お》ちると便秘《べんぴ》・低栄養《ていえいよう》になりやすい。","noteEnRuby":""},{"id":"KV121","term":"貧血","kana":"ひんけつ","romaji":"hinketsu","english":"anemia","easyJa":"血の栄養（鉄分など）が足りなくてフラフラすること","englishDesc":"Having too little of the substance in blood that carries oxygen.","exampleJa":"貧血によってめまいや立ちくらみが起こる。","exampleEn":"Anaemia causes dizziness and light-headedness when standing.","exampleRuby":"貧血《ひんけつ》によってめまいや立《た》ちくらみが起《お》こる。","exampleGapRuby":"{{GAP}}によってめまいや立《た》ちくらみが起《お》こる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"貧血によるふらつきは転倒の原因。急に立ち上がる動作を避ける。","noteEn":"Dizziness from anaemia causes falls. Avoid sudden standing up.","gapTerm":"貧血","termRuby":"貧血《ひんけつ》","easyJaRuby":"血《ち》の栄養《えいよう》（鉄分《てつぶん》など）が足《た》りなくてフラフラすること","noteJaRuby":"貧血《ひんけつ》によるふらつきは転倒《てんとう》の原因《げんいん》。急《きゅう》に立《た》ち上《あ》がる動作《どうさ》を避《さ》ける。","noteEnRuby":""},{"id":"KV122","term":"誤嚥性肺炎","kana":"ごえんせいはいえん","romaji":"goenseihaien","english":"aspiration pneumonia","easyJa":"食べ物や唾液が肺に入って起こる高齢者に多い病気","englishDesc":"Pneumonia caused by food or saliva entering the lungs.","exampleJa":"食後の口腔ケアは、誤嚥性肺炎の予防に効果がある。","exampleEn":"Oral care after meals is effective in preventing aspiration pneumonia.","exampleRuby":"食後《しょくご》の口腔《こうくう》ケアは、誤嚥性肺炎《ごえんせいはいえん》の予防《よぼう》に効果《こうか》がある。","exampleGapRuby":"食後《しょくご》の口腔《こうくう》ケアは、{{GAP}}の予防《よぼう》に効果《こうか》がある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"口腔ケアが最も有効な予防法。食後すぐ横にしないことも重要。","noteEn":"Oral care is the most effective prevention. Also avoid laying the person down right after meals.","gapTerm":"誤嚥性肺炎","termRuby":"誤嚥性肺炎《ごえんせいはいえん》","easyJaRuby":"食《た》べ物《もの》や唾液《だえき》が肺《はい》に入《はい》って起《お》こる高齢者《こうれいしゃ》に多《おお》い病気《びょうき》","noteJaRuby":"口腔《こうくう》ケアが最《もっと》も有効《ゆうこう》な予防法《よぼうほう》。食後《しょくご》すぐ横《よこ》にしないことも重要《じゅうよう》。","noteEnRuby":""},{"id":"KV123","term":"筋萎縮","kana":"きんいしゅく","romaji":"kin'ishuku","english":"muscle atrophy","easyJa":"筋肉が細く、弱くなること","englishDesc":"When muscles become thin and weak from not being used.","exampleJa":"寝たきりが続くと、全身の筋萎縮が進行する。","exampleEn":"When lying in bed continues, muscle atrophy progresses throughout the body.","exampleRuby":"寝《ね》たきりが続《つづ》くと、全身《ぜんしん》の筋萎縮《きんいしゅく》が進行《しんこう》する。","exampleGapRuby":"寝《ね》たきりが続《つづ》くと、全身《ぜんしん》の{{GAP}}が進行《しんこう》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「筋萎縮」は廃用症候群の代表。1週間で約10〜15%筋力が落ちるといわれる。","noteEn":"Muscle atrophy is the classic disuse symptom; strength can fall 10–15% in a single week.","gapTerm":"筋萎縮","termRuby":"筋萎縮《きんいしゅく》","easyJaRuby":"筋肉《きんにく》が細《こま》く、弱《よわ》くなること","noteJaRuby":"「筋萎縮《きんいしゅく》」は廃用症候群《はいようしょうこうぐん》の代表《だいひょう》。1週間《しゅうかん》で約《やく》10〜15%筋力《きんりょく》が落《お》ちるといわれる。","noteEnRuby":""},{"id":"KV124","term":"睡眠障害","kana":"すいみんしょうがい","romaji":"suiminshōgai","english":"sleep disorder","easyJa":"うまく眠れなくなる病気のこと","englishDesc":"A problem in which sleep is not normal.","exampleJa":"昼夜逆転による睡眠障害を改善するためのケア。","exampleEn":"Care to improve a sleep disorder caused by day-night reversal.","exampleRuby":"昼夜逆転《ちゅうやぎゃくてん》による睡眠障害《すいみんしょうがい》を改善《かいぜん》するためのケア。","exampleGapRuby":"昼夜逆転《ちゅうやぎゃくてん》による{{GAP}}を改善《かいぜん》するためのケア。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"睡眠障害の対応は日中の活動・朝の光・就寝環境。薬に頼る選択肢は不適切になりやすい。","noteEn":"Address it with daytime activity, morning light and the sleep environment, not medication first.","gapTerm":"睡眠障害","termRuby":"睡眠障害《すいみんしょうがい》","easyJaRuby":"うまく眠《ねむ》れなくなる病気《びょうき》のこと","noteJaRuby":"睡眠障害《すいみんしょうがい》の対応《たいおう》は日中《にっちゅう》の活動《かつどう》・朝《あさ》の光《ひかり》・就寝環境《しゅうしんかんきょう》。薬《くすり》に頼《たよ》る選択肢《せんたくし》は不適切《ふてきせつ》になりやすい。","noteEnRuby":""},{"id":"KV125","term":"疲労","kana":"ひろう","romaji":"hirō","english":"fatigue","easyJa":"疲れること、疲れ","englishDesc":"Feeling very tired in body or mind.","exampleJa":"介護を行っている家族の心身の疲労を軽減する。","exampleEn":"Reduce the physical and mental fatigue of the family providing care.","exampleRuby":"介護《かいご》を行《おこな》っている家族《かぞく》の心身《しんしん》の疲労《ひろう》を軽減《けいげん》する。","exampleGapRuby":"介護《かいご》を行《おこな》っている家族《かぞく》の心身《しんしん》の{{GAP}}を軽減《けいげん》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"介護の基本","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"家族の「介護疲れ」はレスパイトケアにつながる。虐待の背景要因としても問われる。","noteEn":"Family care fatigue links to respite care and is also tested as a background factor in abuse.","gapTerm":"疲労","termRuby":"疲労《ひろう》","easyJaRuby":"疲《つか》れること、疲《つか》れ","noteJaRuby":"家族《かぞく》の「介護疲《かいごづか》れ」はレスパイトケアにつながる。虐待《ぎゃくたい》の背景要因《はいけいよういん》としても問《と》われる。","noteEnRuby":""},{"id":"KV126","term":"頻脈","kana":"ひんみゃく","romaji":"hinmyaku","english":"tachycardia","easyJa":"心臓のドクドク（脈）がとても速いこと","englishDesc":"When the pulse is faster than normal.","exampleJa":"発熱や脱水があると、頻脈になりやすい。","exampleEn":"Fever or dehydration easily causes a fast pulse.","exampleRuby":"発熱《はつねつ》や脱水《だっすい》があると、頻脈《ひんみゃく》になりやすい。","exampleGapRuby":"発熱《はつねつ》や脱水《だっすい》があると、{{GAP}}になりやすい。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「頻脈」（速い）と「徐脈」（遅い）は反対。頻尿と字が似ているので注意。","noteEn":"頻脈 (fast) ⇔ 徐脈 (slow). The kanji resembles 頻尿 — read carefully.","gapTerm":"頻脈","termRuby":"頻脈《ひんみゃく》","easyJaRuby":"心臓《しんぞう》のドクドク（脈《みゃく》）がとても速《はや》いこと","noteJaRuby":"「頻脈《ひんみゃく》」（速《はや》い）と「徐脈《じょみゃく》」（遅《おそ》い）は反対《はんたい》。頻尿《ひんにょう》と字《じ》が似《に》ているので注意《ちゅうい》。","noteEnRuby":"頻脈《ひんみゃく》 (fast) ⇔ 徐脈《じょみゃく》 (slow). The kanji resembles 頻尿《ひんにょう》 — read carefully."},{"id":"KV127","term":"咀嚼","kana":"そしゃく","romaji":"soshaku","english":"chewing","easyJa":"食べ物を歯でよく噛んで細かくすること","englishDesc":"Biting and crushing food with the teeth.","exampleJa":"咀嚼機能が低下しているため、刻み食を提供する。","exampleEn":"Because chewing function has declined, chopped food is provided.","exampleRuby":"咀嚼機能《そしゃくきのう》が低下《ていか》しているため、刻《きざ》み食《しょく》を提供《ていきょう》する。","exampleGapRuby":"{{GAP}}機能《きのう》が低下《ていか》しているため、刻《きざ》み食《しょく》を提供《ていきょう》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「咀嚼（そしゃく）」＝噛む、「嚥下」＝飲み込む。刻み食は咀嚼が難しい人向けで、誤嚥予防食ではない。","noteEn":"咀嚼 = chewing, 嚥下 = swallowing. Chopped food helps chewing but does NOT prevent aspiration.","gapTerm":"咀嚼","termRuby":"咀嚼《そしゃく》","easyJaRuby":"食《た》べ物《もの》を歯《は》でよく噛《か》んで細《こま》かくすること","noteJaRuby":"「咀嚼《そしゃく》」＝噛《か》む、「嚥下《えんげ》」＝飲《の》み込《こ》む。刻《きざ》み食《しょく》は咀嚼《そしゃく》が難《むずか》しい人向《ひとむ》けで、誤嚥予防食《ごえんよぼうしょく》ではない。","noteEnRuby":"咀嚼《そしゃく》 = chewing, 嚥下《えんげ》 = swallowing. Chopped food helps chewing but does NOT prevent aspiration."},{"id":"KV128","term":"意識レベル","kana":"いしきれべる","romaji":"ishikireberu","english":"level of consciousness","easyJa":"どのくらいはっきりと目が覚めているかの度合い","englishDesc":"How awake and aware a person is.","exampleJa":"転倒後、すぐに利用者の意識レベルを確認する。","exampleEn":"After a fall, check the user's level of consciousness immediately.","exampleRuby":"転倒後《てんとうご》、すぐに利用者《りようしゃ》の意識《いしき》レベルを確認《かくにん》する。","exampleGapRuby":"転倒後《てんとうご》、すぐに利用者《りようしゃ》の{{GAP}}を確認《かくにん》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"医療的ケア","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"転倒後は意識レベル・出血・痛みを確認し、すぐ動かさず報告する。","noteEn":"After a fall, check consciousness, bleeding and pain; do not move the person, and report at once.","gapTerm":"意識レベル","termRuby":"意識《いしき》レベル","easyJaRuby":"どのくらいはっきりと目《め》が覚《さ》めているかの度合《どあ》い","noteJaRuby":"転倒後《てんとうご》は意識《いしき》レベル・出血《しゅっけつ》・痛《いた》みを確認《かくにん》し、すぐ動《うご》かさず報告《ほうこく》する。","noteEnRuby":""},{"id":"KV129","term":"倦怠感","kana":"けんたいかん","romaji":"kentaikan","english":"malaise / fatigue","easyJa":"体がだるい、重くて動かしたくない感じ","englishDesc":"A heavy, tired feeling in the whole body.","exampleJa":"発熱に伴う強い倦怠感を訴える。","exampleEn":"The user complains of strong malaise accompanying the fever.","exampleRuby":"発熱《はつねつ》に伴《ともな》う強《つよ》い倦怠感《けんたいかん》を訴《うった》える。","exampleGapRuby":"発熱《はつねつ》に伴《ともな》う強《つよ》い{{GAP}}を訴《うった》える。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「倦怠感」は本人の訴え（主観情報）。事例問題の定番表現。","noteEn":"Malaise is a subjective complaint — standard wording in case-study questions.","gapTerm":"倦怠感","termRuby":"倦怠感《けんたいかん》","easyJaRuby":"体《からだ》がだるい、重《おも》くて動《うご》かしたくない感《かん》じ","noteJaRuby":"「倦怠感《けんたいかん》」は本人《ほんにん》の訴《うった》え（主観情報《しゅかんじょうほう》）。事例問題《じれいもんだい》の定番表現《ていばんひょうげん》。","noteEnRuby":""},{"id":"KV130","term":"発疹","kana":"ほっしん","romaji":"hosshin","english":"rash","easyJa":"皮膚にブツブツや赤みが出ること","englishDesc":"Red spots that appear on the skin.","exampleJa":"薬を飲んだ後、お腹に発疹が現れた。","exampleEn":"After taking the medicine, a rash appeared on the abdomen.","exampleRuby":"薬《くすり》を飲《の》んだ後《あと》、お腹《なか》に発疹《ほっしん》が現《あらわ》れた。","exampleGapRuby":"薬《くすり》を飲《の》んだ後《あと》、お腹《なか》に{{GAP}}が現《あらわ》れた。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"薬の後の発疹は副作用の可能性。すぐ看護師・医師に報告する。","noteEn":"A rash after medication may be a side effect. Report to the nurse or doctor immediately.","gapTerm":"発疹","termRuby":"発疹《ほっしん》","easyJaRuby":"皮膚《ひふ》にブツブツや赤《あか》みが出《で》ること","noteJaRuby":"薬《くすり》の後《あと》の発疹《ほっしん》は副作用《ふくさよう》の可能性《かのうせい》。すぐ看護師《かんごし》・医師《いし》に報告《ほうこく》する。","noteEnRuby":""},{"id":"KV131","term":"息切れ","kana":"いきぎれ","romaji":"ikigire","english":"shortness of breath","easyJa":"息が「ハアハア」と荒くなること","englishDesc":"Difficulty breathing after only light activity.","exampleJa":"少し歩いただけで息切れがする。","exampleEn":"The user becomes short of breath after walking only a little.","exampleRuby":"少《すこ》し歩《ある》いただけで息切《いきぎ》れがする。","exampleGapRuby":"少《すこ》し歩《ある》いただけで{{GAP}}がする。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"息切れは心臓・肺の病気のサイン。安静とバイタル測定、報告が基本。","noteEn":"Shortness of breath signals heart or lung problems. Rest, check vitals and report.","gapTerm":"息切れ","termRuby":"息切《いきぎ》れ","easyJaRuby":"息《いき》が「ハアハア」と荒《あら》くなること","noteJaRuby":"息切《いきぎ》れは心臓《しんぞう》・肺《はい》の病気《びょうき》のサイン。安静《あんせい》とバイタル測定《そくてい》、報告《ほうこく》が基本《きほん》。","noteEnRuby":""},{"id":"KV132","term":"悪寒","kana":"おかん","romaji":"okan","english":"chills","easyJa":"熱が出る前などに、体がブルブル震えて寒気がすること","englishDesc":"Feeling cold and shivering when a fever is starting.","exampleJa":"インフルエンザの初期症状として悪寒がある。","exampleEn":"Chills are an early symptom of influenza.","exampleRuby":"インフルエンザの初期症状《しょきしょうじょう》として悪寒《おかん》がある。","exampleGapRuby":"インフルエンザの初期症状《しょきしょうじょう》として{{GAP}}がある。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"悪寒は熱が上がる前のサイン。この時点で温め、その後は解熱に合わせて調整する。","noteEn":"Chills come before the fever rises. Warm the person then, and adjust as the fever breaks.","gapTerm":"悪寒","termRuby":"悪寒《おかん》","easyJaRuby":"熱《ねつ》が出《で》る前《まえ》などに、体《からだ》がブルブル震《ふる》えて寒気《さむけ》がすること","noteJaRuby":"悪寒《おかん》は熱《ねつ》が上《あ》がる前《まえ》のサイン。この時点《じてん》で温《あたた》め、その後《あと》は解熱《げねつ》に合《あ》わせて調整《ちょうせい》する。","noteEnRuby":""},{"id":"KV133","term":"狭心症","kana":"きょうしんしょう","romaji":"kyōshinshō","english":"angina pectoris","easyJa":"心臓の血管が狭くなって、胸がギュッと痛くなる病気","englishDesc":"Chest pain caused by not enough blood reaching the heart.","exampleJa":"狭心症の発作が起きたため、薬（ニトログリセリン）を飲んでもらう。","exampleEn":"Because an angina attack occurred, the prescribed medicine was taken.","exampleRuby":"狭心症《きょうしんしょう》の発作《ほっさ》が起《お》きたため、薬《くすり》（ニトログリセリン）を飲《の》んでもらう。","exampleGapRuby":"{{GAP}}の発作《ほっさ》が起《お》きたため、薬《くすり》（ニトログリセリン）を飲《の》んでもらう。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"薬（ニトログリセリン）は本人が使うのを介助するのみ。介護職が判断して与薬はできない。","noteEn":"Care workers may only help the person take their own prescribed medicine; they cannot decide to give it.","gapTerm":"狭心症","termRuby":"狭心症《きょうしんしょう》","easyJaRuby":"心臓《しんぞう》の血管《けっかん》が狭《せま》くなって、胸《むね》がギュッと痛《いた》くなる病気《びょうき》","noteJaRuby":"薬《くすり》（ニトログリセリン）は本人《ほんにん》が使《つか》うのを介助《かいじょ》するのみ。介護職《かいごしょく》が判断《はんだん》して与薬《よやく》はできない。","noteEnRuby":""},{"id":"KV134","term":"皮下出血","kana":"ひかしゅっけつ","romaji":"hikashukketsu","english":"subcutaneous bleeding / bruising","easyJa":"皮膚の下で血が出て、青あざになること","englishDesc":"Bleeding under the skin, seen as a bruise.","exampleJa":"転倒した膝に皮下出血が見られる。","exampleEn":"Subcutaneous bleeding is seen on the knee that was hit in the fall.","exampleRuby":"転倒《てんとう》した膝《ひざ》に皮下出血《ひかしゅっけつ》が見《み》られる。","exampleGapRuby":"転倒《てんとう》した膝《ひざ》に{{GAP}}が見《み》られる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"高齢者は皮膚が弱く、軽い刺激でも内出血する。虐待との判別が問われることがある。","noteEn":"Older skin bruises easily. Questions may ask how to distinguish this from signs of abuse.","gapTerm":"皮下出血","termRuby":"皮下出血《ひかしゅっけつ》","easyJaRuby":"皮膚《ひふ》の下《した》で血《ち》が出《で》て、青《あお》あざになること","noteJaRuby":"高齢者《こうれいしゃ》は皮膚《ひふ》が弱《よわ》く、軽《かる》い刺激《しげき》でも内出血《ないしゅっけつ》する。虐待《ぎゃくたい》との判別《はんべつ》が問《と》われることがある。","noteEnRuby":""},{"id":"KV135","term":"結膜炎","kana":"けつまくえん","romaji":"ketsumakuen","english":"conjunctivitis / pink eye","easyJa":"目にばい菌が入って、白目が赤くなったり目やにが出る病気","englishDesc":"An eye infection that makes the eye red and itchy.","exampleJa":"目をこする利用者に結膜炎の症状がないか確認する。","exampleEn":"Check whether a user who rubs their eyes has symptoms of conjunctivitis.","exampleRuby":"目《め》をこする利用者《りようしゃ》に結膜炎《けつまくえん》の症状《しょうじょう》がないか確認《かくにん》する。","exampleGapRuby":"目《め》をこする利用者《りようしゃ》に{{GAP}}の症状《しょうじょう》がないか確認《かくにん》する。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"結膜炎は感染することがある。タオルを共用しないことが予防。","noteEn":"Conjunctivitis can spread. Not sharing towels is the key prevention.","gapTerm":"結膜炎","termRuby":"結膜炎《けつまくえん》","easyJaRuby":"目《め》にばい菌《きん》が入《はい》って、白目《しろめ》が赤《あか》くなったり目《め》やにが出《で》る病気《びょうき》","noteJaRuby":"結膜炎《けつまくえん》は感染《かんせん》することがある。タオルを共用《きょうよう》しないことが予防《よぼう》。","noteEnRuby":""},{"id":"KV136","term":"脂質異常症","kana":"ししついじょうしょう","romaji":"shishitsuijōshō","english":"dyslipidemia","easyJa":"血液の中のコレステロール（油分）が多すぎる病気","englishDesc":"A condition in which there is too much fat in the blood.","exampleJa":"脂質異常症の予防のために、食事の脂質を控える。","exampleEn":"To prevent dyslipidaemia, reduce fat in meals.","exampleRuby":"脂質異常症《ししついじょうしょう》の予防《よぼう》のために、食事《しょくじ》の脂質《ししつ》を控《ひか》える。","exampleGapRuby":"{{GAP}}の予防《よぼう》のために、食事《しょくじ》の脂質《ししつ》を控《ひか》える。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"生活習慣病の一つ。以前は「高脂血症」と呼ばれた。","noteEn":"One of the lifestyle-related diseases; formerly called 高脂血症.","gapTerm":"脂質異常症","termRuby":"脂質異常症《ししついじょうしょう》","easyJaRuby":"血液《けつえき》の中《なか》のコレステロール（油分《ゆぶん》）が多《おお》すぎる病気《びょうき》","noteJaRuby":"生活習慣病《せいかつしゅうかんびょう》の一《ひと》つ。以前《いぜん》は「高脂血症《こうしけっしょう》」と呼《よ》ばれた。","noteEnRuby":"One of the lifestyle-related diseases; formerly called 高脂血症《こうしけっしょう》."},{"id":"KV137","term":"転倒","kana":"てんとう","romaji":"tentō","english":"fall","easyJa":"つまずいたり、滑ったりして転ぶこと","englishDesc":"Losing balance and falling to the ground.","exampleJa":"転倒による骨折のリスクをアセスメントする。","exampleEn":"Assess the risk of fracture caused by a fall.","exampleRuby":"転倒《てんとう》による骨折《こっせつ》のリスクをアセスメントする。","exampleGapRuby":"{{GAP}}による骨折《こっせつ》のリスクをアセスメントする。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"転倒の要因は内的（筋力低下・薬）と外的（段差・照明）に分けて考える。","noteEn":"Fall factors split into internal (weak muscles, medication) and external (steps, lighting).","gapTerm":"転倒","termRuby":"転倒《てんとう》","easyJaRuby":"つまずいたり、滑《すべ》ったりして転《ころ》ぶこと","noteJaRuby":"転倒《てんとう》の要因《よういん》は内的《ないてき》（筋力低下《きんりょくていか》・薬《くすり》）と外的《がいてき》（段差《だんさ》・照明《しょうめい》）に分《わ》けて考《かんが》える。","noteEnRuby":""},{"id":"KV138","term":"発赤","kana":"ほっせき","romaji":"hosseki","english":"redness (of skin)","easyJa":"皮膚が赤くなること（床ずれの初期症状など）","englishDesc":"When the skin turns red, often the first sign of a pressure ulcer.","exampleJa":"仙骨部（おしりの骨）に発赤が見られる。","exampleEn":"Redness is seen on the sacral area.","exampleRuby":"仙骨部《せんこつぶ》（おしりの骨《ほね》）に発赤《ほっせき》が見《み》られる。","exampleGapRuby":"仙骨部《せんこつぶ》（おしりの骨《ほね》）に{{GAP}}が見《み》られる。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"発赤は褥瘡の第一段階。押しても赤みが消えなければ褥瘡を疑い、報告する。","noteEn":"Redness is stage one of a pressure ulcer. If it does not fade when pressed, suspect one and report.","gapTerm":"発赤","termRuby":"発赤《ほっせき》","easyJaRuby":"皮膚《ひふ》が赤《あか》くなること（床《とこ》ずれの初期症状《しょきしょうじょう》など）","noteJaRuby":"発赤《ほっせき》は褥瘡《じょくそう》の第一段階《だいいちだんかい》。押《お》しても赤《あか》みが消《け》えなければ褥瘡《じょくそう》を疑《うたが》い、報告《ほうこく》する。","noteEnRuby":""},{"id":"KV139","term":"喀痰","kana":"かくたん","romaji":"kakutan","english":"sputum / phlegm","easyJa":"喉の奥から出るネバネバしたもの（たん）","englishDesc":"Phlegm brought up from the lungs and throat.","exampleJa":"喀痰が絡んで息苦しそうにしている。","exampleEn":"The user seems short of breath because of sputum in the throat.","exampleRuby":"喀痰《かくたん》が絡《から》んで息苦《いきぐる》しそうにしている。","exampleGapRuby":"{{GAP}}が絡《から》んで息苦《いきぐる》しそうにしている。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"「喀痰吸引」は一定の研修を受けた介護福祉士のみ実施できる。範囲は咽頭手前まで。","noteEn":"Only certified care workers with the required training may suction, and only to the front of the pharynx.","gapTerm":"喀痰","termRuby":"喀痰《かくたん》","easyJaRuby":"喉《のど》の奥《おく》から出《で》るネバネバしたもの（たん）","noteJaRuby":"「喀痰吸引《かくたんきゅういん》」は一定《いってい》の研修《けんしゅう》を受《う》けた介護福祉士《かいごふくしし》のみ実施《じっし》できる。範囲《はんい》は咽頭手前《いんとうてまえ》まで。","noteEnRuby":""},{"id":"KV140","term":"視覚障害","kana":"しかくしょうがい","romaji":"shikakushōgai","english":"visual impairment","easyJa":"目が見えない、または見えにくい障害のこと","englishDesc":"Not being able to see, or seeing only a little.","exampleJa":"視覚障害のある利用者には、物の位置を時計の文字盤（クロックポジション）で伝える。","exampleEn":"For a user with visual impairment, describe positions using the clock face.","exampleRuby":"視覚障害《しかくしょうがい》のある利用者《りようしゃ》には、物《もの》の位置《いち》を時計《とけい》の文字盤《もじばん》（クロックポジション）で伝《つた》える。","exampleGapRuby":"{{GAP}}のある利用者《りようしゃ》には、物《もの》の位置《いち》を時計《とけい》の文字盤《もじばん》（クロックポジション）で伝《つた》える。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"クロックポジションは食事の説明で頻出。「前から支える」ではなく、半歩前を歩いて誘導する。","noteEn":"Clock position is standard for describing meals. When guiding, walk half a step ahead, not in front.","gapTerm":"視覚障害","termRuby":"視覚障害《しかくしょうがい》","easyJaRuby":"目《め》が見《み》えない、または見《み》えにくい障害《しょうがい》のこと","noteJaRuby":"クロックポジションは食事《しょくじ》の説明《せつめい》で頻出《ひんしゅつ》。「前《まえ》から支《ささ》える」ではなく、半歩前《はんぽまえ》を歩《ある》いて誘導《ゆうどう》する。","noteEnRuby":""},{"id":"KV141","term":"耳鳴り","kana":"みみなり","romaji":"miminari","english":"tinnitus","easyJa":"周りに音がないのに、耳の中で「キーン」と音が聞こえる病気","englishDesc":"Hearing a sound in the ears when there is no outside sound.","exampleJa":"めまいと耳鳴りを訴えている。","exampleEn":"The user complains of dizziness and tinnitus.","exampleRuby":"めまいと耳鳴《みみな》りを訴《うった》えている。","exampleGapRuby":"めまいと{{GAP}}を訴《うった》えている。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"耳鳴りとめまいが同時なら内耳の病気の可能性。転倒に注意して報告する。","noteEn":"Tinnitus with dizziness may mean an inner-ear problem. Watch for falls and report.","gapTerm":"耳鳴り","termRuby":"耳鳴《みみな》り","easyJaRuby":"周《まわ》りに音《おと》がないのに、耳《みみ》の中《なか》で「キーン」と音《おと》が聞《き》こえる病気《びょうき》","noteJaRuby":"耳鳴《みみな》りとめまいが同時《どうじ》なら内耳《ないじ》の病気《びょうき》の可能性《かのうせい》。転倒《てんとう》に注意《ちゅうい》して報告《ほうこく》する。","noteEnRuby":""},{"id":"KV142","term":"高次脳機能障害","kana":"こうじのうきのうしょうがい","romaji":"kōjinōkinōshōgai","english":"higher brain dysfunction","easyJa":"脳の病気やケガの後、記憶や集中、計画することが難しくなる障害","englishDesc":"Problems with memory, attention or behaviour after brain injury.","exampleJa":"交通事故による高次脳機能障害の症状。","exampleEn":"Symptoms of higher brain dysfunction caused by a traffic accident.","exampleRuby":"交通事故《こうつうじこ》による高次脳機能障害《こうじのうきのうしょうがい》の症状《しょうじょう》。","exampleGapRuby":"交通事故《こうつうじこ》による{{GAP}}の症状《しょうじょう》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"外見からわかりにくい「見えない障害」。記憶障害・注意障害・遂行機能障害・社会的行動障害が主症状。","noteEn":"It is an \"invisible\" disability. Main symptoms: memory, attention, executive function, social behaviour.","gapTerm":"高次脳機能障害","termRuby":"高次脳機能障害《こうじのうきのうしょうがい》","easyJaRuby":"脳《のう》の病気《びょうき》やケガの後《あと》、記憶《きおく》や集中《しゅうちゅう》、計画《けいかく》することが難《むずか》しくなる障害《しょうがい》","noteJaRuby":"外見《がいけん》からわかりにくい「見《み》えない障害《しょうがい》」。記憶障害《きおくしょうがい》・注意障害《ちゅういしょうがい》・遂行機能障害《すいこうきのうしょうがい》・社会的行動障害《しゃかいてきこうどうしょうがい》が主症状《しゅしょうじょう》。","noteEnRuby":""},{"id":"KV143","term":"循環器","kana":"じゅんかんき","romaji":"junkanki","english":"cardiovascular system","easyJa":"心臓や血管など、血液を体に回す働きをする部分","englishDesc":"The heart and blood vessels.","exampleJa":"加齢に伴う循環器系の変化に関する記述。","exampleEn":"A description of changes in the cardiovascular system with ageing.","exampleRuby":"加齢《かれい》に伴《ともな》う循環器系《じゅんかんきけい》の変化《へんか》に関《かん》する記述《きじゅつ》。","exampleGapRuby":"加齢《かれい》に伴《ともな》う{{GAP}}系《けい》の変化《へんか》に関《かん》する記述《きじゅつ》。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"こころとからだのしくみ","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"加齢で血管が硬くなり血圧が上がりやすい。入浴・排泄時の急変に注意。","noteEn":"With age, vessels stiffen and blood pressure rises. Watch for sudden changes during bathing and toileting.","gapTerm":"循環器","termRuby":"循環器《じゅんかんき》","easyJaRuby":"心臓《しんぞう》や血管《けっかん》など、血液《けつえき》を体《からだ》に回《まわ》す働《はたら》きをする部分《ぶぶん》","noteJaRuby":"加齢《かれい》で血管《けっかん》が硬《かた》くなり血圧《けつあつ》が上《あ》がりやすい。入浴《にゅうよく》・排泄時《はいせつじ》の急変《きゅうへん》に注意《ちゅうい》。","noteEnRuby":""},{"id":"KV144","term":"四肢麻痺","kana":"ししまひ","romaji":"shishimahi","english":"tetraplegia / quadriplegia","easyJa":"両手・両足（四肢）のすべてが動かないこと","englishDesc":"When all four limbs cannot move.","exampleJa":"頸髄（首の神経）の損傷による四肢麻痺。","exampleEn":"Tetraplegia caused by injury to the cervical spinal cord.","exampleRuby":"頸髄《けいずい》（首《くび》の神経《しんけい》）の損傷《そんしょう》による四肢麻痺《ししまひ》。","exampleGapRuby":"頸髄《けいずい》（首《くび》の神経《しんけい》）の損傷《そんしょう》による{{GAP}}。","categoryId":2,"category":"身体の部位・症状・病名","categoryEn":"Body, symptoms & diseases","subject":"障害の理解","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"損傷部位が高いほど麻痺の範囲が広い。頸髄損傷は四肢麻痺、胸腰髄損傷は対麻痺。","noteEn":"The higher the injury, the wider the paralysis: cervical → tetraplegia, thoracic/lumbar → paraplegia.","gapTerm":"四肢麻痺","termRuby":"四肢麻痺《ししまひ》","easyJaRuby":"両手《りょうて》・両足《りょうあし》（四肢《しし》）のすべてが動《うご》かないこと","noteJaRuby":"損傷部位《そんしょうぶい》が高《たか》いほど麻痺《まひ》の範囲《はんい》が広《ひろ》い。頸髄損傷《けいずいそんしょう》は四肢麻痺《ししまひ》、胸腰髄損傷《きょうようずいそんしょう》は対麻痺《ついまひ》。","noteEnRuby":""},{"id":"KV145","term":"移乗","kana":"いじょう","romaji":"ijō","english":"transfer","easyJa":"ベッドから車いすなどに乗り移ること","englishDesc":"Moving from one seat to another, such as bed to wheelchair.","exampleJa":"ベッドから車いすへの移乗介助を行う。","exampleEn":"Provide transfer assistance from the bed to the wheelchair.","exampleRuby":"ベッドから車《くるま》いすへの移乗介助《いじょうかいじょ》を行《おこな》う。","exampleGapRuby":"ベッドから車《くるま》いすへの{{GAP}}介助《かいじょ》を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「移乗」（乗り移る）と「移動」（動いて場所を変える）は別。移乗前はブレーキとフットレストを確認。","noteEn":"移乗 = moving between seats; 移動 = travelling from place to place. Check brakes and footrests first.","gapTerm":"移乗","termRuby":"移乗《いじょう》","easyJaRuby":"ベッドから車《くるま》いすなどに乗《の》り移《うつ》ること","noteJaRuby":"「移乗《いじょう》」（乗《の》り移《うつ》る）と「移動《いどう》」（動《うご》いて場所《ばしょ》を変《か》える）は別《べつ》。移乗前《いじょうまえ》はブレーキとフットレストを確認《かくにん》。","noteEnRuby":"移乗《いじょう》 = moving between seats; 移動《いどう》 = travelling from place to place. Check brakes and footrests first."},{"id":"KV146","term":"体位変換","kana":"たいいへんかん","romaji":"taiihenkan","english":"repositioning","easyJa":"寝ている姿勢を変えること","englishDesc":"Changing the position of a person lying down.","exampleJa":"褥瘡予防のため、2時間ごとに体位変換を行う。","exampleEn":"Reposition the user every two hours to prevent pressure ulcers.","exampleRuby":"褥瘡予防《じょくそうよぼう》のため、2時間《じかん》ごとに体位変換《たいいへんかん》を行《おこな》う。","exampleGapRuby":"褥瘡予防《じょくそうよぼう》のため、2時間《じかん》ごとに{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"原則は2時間ごと。ただし体圧分散マットを使う場合は間隔が変わることがある。","noteEn":"The rule is every two hours, but the interval may change when a pressure-relieving mattress is used.","gapTerm":"体位変換","termRuby":"体位変換《たいいへんかん》","easyJaRuby":"寝《ね》ている姿勢《しせい》を変《か》えること","noteJaRuby":"原則《げんそく》は2時間《じかん》ごと。ただし体圧分散《たいあつぶんさん》マットを使《つか》う場合《ばあい》は間隔《かんかく》が変《か》わることがある。","noteEnRuby":""},{"id":"KV147","term":"清拭","kana":"せいしき","romaji":"seishiki","english":"bed bath / wiping","easyJa":"体を拭いてきれいにすること","englishDesc":"Wiping the body clean with a warm towel instead of bathing.","exampleJa":"入浴できない利用者に全身清拭を行う。","exampleEn":"Give a full-body bed bath to a user who cannot bathe.","exampleRuby":"入浴《にゅうよく》できない利用者《りようしゃ》に全身清拭《ぜんしんせいしき》を行《おこな》う。","exampleGapRuby":"入浴《にゅうよく》できない利用者《りようしゃ》に全身《ぜんしん》{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"清拭は「心臓から遠いところから」「皮膚を強くこすらない」。室温とプライバシーに配慮する。","noteEn":"Start far from the heart, do not rub hard, and mind room temperature and privacy.","gapTerm":"清拭","termRuby":"清拭《せいしき》","easyJaRuby":"体《からだ》を拭《ふ》いてきれいにすること","noteJaRuby":"清拭《せいしき》は「心臓《しんぞう》から遠《とお》いところから」「皮膚《ひふ》を強《つよ》くこすらない」。室温《しつおん》とプライバシーに配慮《はいりょ》する。","noteEnRuby":""},{"id":"KV148","term":"端坐位","kana":"たんざい","romaji":"tanzai","english":"sitting on the edge of the bed","easyJa":"ベッドの端に足を下ろして座る姿勢","englishDesc":"Sitting on the edge of the bed with the feet down.","exampleJa":"食事の時は、できるだけ端坐位になってもらう。","exampleEn":"At mealtimes, have the user sit on the edge of the bed if possible.","exampleRuby":"食事《しょくじ》の時《とき》は、できるだけ端坐位《たんざい》になってもらう。","exampleGapRuby":"食事《しょくじ》の時《とき》は、できるだけ{{GAP}}になってもらう。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「端坐位（たんざい）」は食事や移乗の前の姿勢。足底が床につく高さにする。","noteEn":"Read たんざい. Used before meals and transfers; adjust bed height so the soles touch the floor.","gapTerm":"端坐位","termRuby":"端坐位《たんざい》","easyJaRuby":"ベッドの端《はし》に足《あし》を下《お》ろして座《すわ》る姿勢《しせい》","noteJaRuby":"「端坐位《たんざい》」は食事《しょくじ》や移乗《いじょう》の前《まえ》の姿勢《しせい》。足底《そくてい》が床《ゆか》につく高《たか》さにする。","noteEnRuby":""},{"id":"KV149","term":"更衣","kana":"こうい","romaji":"kōi","english":"changing clothes","easyJa":"着替えをすること","englishDesc":"Changing clothes.","exampleJa":"更衣介助では、脱健着患の原則を守る。","exampleEn":"In dressing assistance, follow the principle of undressing the healthy side first.","exampleRuby":"更衣介助《こういかいじょ》では、脱健着患《だっけんちゃっかん》の原則《げんそく》を守《まも》る。","exampleGapRuby":"{{GAP}}介助《かいじょ》では、脱健着患《だっけんちゃっかん》の原則《げんそく》を守《まも》る。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「脱健着患」＝脱ぐのは健側から、着るのは患側から。順番を逆に覚えるミスが非常に多い。","noteEn":"脱健着患: undress the HEALTHY side first, dress the AFFECTED side first. The order is easily reversed.","gapTerm":"更衣","termRuby":"更衣《こうい》","easyJaRuby":"着替《きが》えをすること","noteJaRuby":"「脱健着患《だっけんちゃっかん》」＝脱《ぬ》ぐのは健側《けんそく》から、着《き》るのは患側《かんそく》から。順番《じゅんばん》を逆《ぎゃく》に覚《おぼ》えるミスが非常《ひじょう》に多《おお》い。","noteEnRuby":"脱健着患《だっけんちゃっかん》: undress the HEALTHY side first, dress the AFFECTED side first. The order is easily reversed."},{"id":"KV150","term":"臥位","kana":"がい","romaji":"gai","english":"lying position","easyJa":"寝ている姿勢","englishDesc":"A position in which the person is lying down.","exampleJa":"仰臥位で休んでもらう。","exampleEn":"Have the user rest in the supine position.","exampleRuby":"仰臥位《ぎょうがい》で休《やす》んでもらう。","exampleGapRuby":"仰《ぎょう》{{GAP}}で休《やす》んでもらう。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「臥位」の種類：仰臥位（上向き）・側臥位（横向き）・腹臥位（うつぶせ）。読みは「がい」。","noteEn":"Types of 臥位: supine, lateral, prone. Read がい.","gapTerm":"臥位","termRuby":"臥位《がい》","easyJaRuby":"寝《ね》ている姿勢《しせい》","noteJaRuby":"「臥位《がい》」の種類《しゅるい》：仰臥位《ぎょうがい》（上向《うわむ》き）・側臥位《そくがい》（横向《よこむ》き）・腹臥位《ふくがい》（うつぶせ）。読《よ》みは「がい」。","noteEnRuby":"Types of 臥位《がい》: supine, lateral, prone. Read がい."},{"id":"KV151","term":"整容","kana":"せいよう","romaji":"seiyō","english":"grooming","easyJa":"洗顔や歯磨きなど身だしなみを整えること","englishDesc":"Taking care of appearance, such as washing the face and brushing teeth.","exampleJa":"毎朝の整容動作を支援する。","exampleEn":"Support the user's daily grooming.","exampleRuby":"毎朝《まいあさ》の整容動作《せいようどうさ》を支援《しえん》する。","exampleGapRuby":"毎朝《まいあさ》の{{GAP}}動作《どうさ》を支援《しえん》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「整容」は身だしなみ。自分でできる部分は自分でやってもらうのが自立支援。","noteEn":"整容 = grooming. Let the person do what they can — that is self-reliance support.","gapTerm":"整容","termRuby":"整容《せいよう》","easyJaRuby":"洗顔《せんがん》や歯磨《はみが》きなど身《み》だしなみを整《ととの》えること","noteJaRuby":"「整容《せいよう》」は身《み》だしなみ。自分《じぶん》でできる部分《ぶぶん》は自分《じぶん》でやってもらうのが自立支援《じりつしえん》。","noteEnRuby":"整容《せいよう》 = grooming. Let the person do what they can — that is self-reliance support."},{"id":"KV152","term":"見守り","kana":"みまもり","romaji":"mimamori","english":"watching over","easyJa":"自分でできることはやってもらい、安全を見ていること","englishDesc":"Staying nearby and watching for safety while the person does it themselves.","exampleJa":"歩行時は、すぐ後ろで見守りを行う。","exampleEn":"When the user walks, watch over them from just behind.","exampleRuby":"歩行時《ほこうじ》は、すぐ後《うし》ろで見守《みまも》りを行《おこな》う。","exampleGapRuby":"歩行時《ほこうじ》は、すぐ後《うし》ろで{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"介護の基本","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「見守り」は何もしないことではない。片麻痺の人の見守りは患側の斜め後ろに立つ。","noteEn":"Watching over is not doing nothing. For hemiplegia, stand diagonally behind on the affected side.","gapTerm":"見守り","termRuby":"見守《みまも》り","easyJaRuby":"自分《じぶん》でできることはやってもらい、安全《あんぜん》を見《み》ていること","noteJaRuby":"「見守《みまも》り」は何《なに》もしないことではない。片麻痺《かたまひ》の人《ひと》の見守《みまも》りは患側《かんそく》の斜《なな》め後《うし》ろに立《た》つ。","noteEnRuby":""},{"id":"KV153","term":"排泄","kana":"はいせつ","romaji":"haisetsu","english":"elimination","easyJa":"トイレにいくこと","englishDesc":"Passing urine and stool.","exampleJa":"排泄介助の際は、プライバシーを守る。","exampleEn":"When assisting with toileting, protect the user's privacy.","exampleRuby":"排泄介助《はいせつかいじょ》の際《さい》は、プライバシーを守《まも》る。","exampleGapRuby":"{{GAP}}介助《かいじょ》の際《さい》は、プライバシーを守《まも》る。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「排泄」（はいせつ）。排泄介助では羞恥心への配慮と、できるだけトイレでの排泄が原則。","noteEn":"Read はいせつ. Respect embarrassment, and use the toilet rather than a diaper whenever possible.","gapTerm":"排泄","termRuby":"排泄《はいせつ》","easyJaRuby":"トイレにいくこと","noteJaRuby":"「排泄《はいせつ》」（はいせつ）。排泄介助《はいせつかいじょ》では羞恥心《しゅうちしん》への配慮《はいりょ》と、できるだけトイレでの排泄《はいせつ》が原則《げんそく》。","noteEnRuby":""},{"id":"KV154","term":"側臥位","kana":"そくがい","romaji":"sokugai","english":"lateral position","easyJa":"横向きに寝る姿勢","englishDesc":"Lying on one's side.","exampleJa":"右側臥位にする。","exampleEn":"Turn the user onto their right side.","exampleRuby":"右側臥位《みぎそくがい》にする。","exampleGapRuby":"右《みぎ》{{GAP}}にする。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「右側臥位」＝体の右側を下にする。左右を逆に読むミスが多い。褥瘡予防の30度側臥位も頻出。","noteEn":"右側臥位 means the RIGHT side is DOWN. Sides are easily reversed. The 30-degree lateral position is also tested.","gapTerm":"側臥位","termRuby":"側臥位《そくがい》","easyJaRuby":"横向《よこむ》きに寝《ね》る姿勢《しせい》","noteJaRuby":"「右側臥位《みぎそくがい》」＝体《からだ》の右側《みぎがわ》を下《した》にする。左右《さゆう》を逆《ぎゃく》に読《よ》むミスが多《おお》い。褥瘡予防《じょくそうよぼう》の30度側臥位《どそくがい》も頻出《ひんしゅつ》。","noteEnRuby":"右側臥位《みぎそくがい》 means the RIGHT side is DOWN. Sides are easily reversed. The 30-degree lateral position is also tested."},{"id":"KV155","term":"声かけ","kana":"こえかけ","romaji":"koekake","english":"calling out","easyJa":"利用者に言葉をかけること","englishDesc":"Speaking to the user before and during care.","exampleJa":"介助の前に、必ず声かけを行って同意を得る。","exampleEn":"Always call out to the user before assisting, and get their agreement.","exampleRuby":"介助《かいじょ》の前《まえ》に、必《かなら》ず声《こえ》かけを行《おこな》って同意《どうい》を得《え》る。","exampleGapRuby":"介助《かいじょ》の前《まえ》に、必《かなら》ず{{GAP}}を行《おこな》って同意《どうい》を得《え》る。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"介助の前の声かけは「同意を得る」ため。無言での介助は不適切、必ず正面から声をかける。","noteEn":"Speaking first is how you obtain consent. Silent assistance is incorrect; approach from the front.","gapTerm":"声かけ","termRuby":"声《こえ》かけ","easyJaRuby":"利用者《りようしゃ》に言葉《ことば》をかけること","noteJaRuby":"介助《かいじょ》の前《まえ》の声《こえ》かけは「同意《どうい》を得《え》る」ため。無言《むごん》での介助《かいじょ》は不適切《ふてきせつ》、必《かなら》ず正面《しょうめん》から声《こえ》をかける。","noteEnRuby":""},{"id":"KV156","term":"傾聴","kana":"けいちょう","romaji":"keichō","english":"active listening","easyJa":"相手の話を心を込めてしっかり聞くこと","englishDesc":"Listening carefully and with full attention to what someone says.","exampleJa":"利用者の不安な気持ちを傾聴する。","exampleEn":"Listen attentively to the user's feelings of anxiety.","exampleRuby":"利用者《りようしゃ》の不安《ふあん》な気持《きも》ちを傾聴《けいちょう》する。","exampleGapRuby":"利用者《りようしゃ》の不安《ふあん》な気持《きも》ちを{{GAP}}する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"コミュニケーション技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「傾聴」は黙って聞くだけでなく、相づち・うなずきを含む。助言や説得より先に行う。","noteEn":"Attentive listening includes nodding and brief responses; it comes before advice or persuasion.","gapTerm":"傾聴","termRuby":"傾聴《けいちょう》","easyJaRuby":"相手《あいて》の話《はな》を心《こころ》を込《こ》めてしっかり聞《き》くこと","noteJaRuby":"「傾聴《けいちょう》」は黙《だま》って聞《き》くだけでなく、相《あい》づち・うなずきを含《ふく》む。助言《じょげん》や説得《せっとく》より先《さき》に行《おこな》う。","noteEnRuby":""},{"id":"KV157","term":"口腔ケア","kana":"こうくうけあ","romaji":"kōkūkea","english":"oral care","easyJa":"歯磨きなど、口の中をきれいにすること","englishDesc":"Cleaning the mouth, including brushing the teeth.","exampleJa":"誤嚥性肺炎を予防するために口腔ケアを行う。","exampleEn":"Provide oral care to prevent aspiration pneumonia.","exampleRuby":"誤嚥性肺炎《ごえんせいはいえん》を予防《よぼう》するために口腔《こうくう》ケアを行《おこな》う。","exampleGapRuby":"誤嚥性肺炎《ごえんせいはいえん》を予防《よぼう》するために{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"口腔ケアは食後だけでなく就寝前も重要。義歯の人にも必要（歯がなくても行う）。","noteEn":"Oral care matters before sleep as well as after meals, and is needed even for people with dentures.","gapTerm":"口腔ケア","termRuby":"口腔《こうくう》ケア","easyJaRuby":"歯磨《はみが》きなど、口《くち》の中《なか》をきれいにすること","noteJaRuby":"口腔《こうくう》ケアは食後《しょくご》だけでなく就寝前《しゅうしんまえ》も重要《じゅうよう》。義歯《ぎし》の人《ひと》にも必要《ひつよう》（歯《は》がなくても行《おこな》う）。","noteEnRuby":""},{"id":"KV158","term":"離床","kana":"りしょう","romaji":"rishō","english":"getting out of bed","easyJa":"ベッドから起きて離れること","englishDesc":"Getting up and leaving the bed.","exampleJa":"昼間はできるだけ離床して過ごすように促す。","exampleEn":"Encourage the user to spend the daytime out of bed as much as possible.","exampleRuby":"昼間《ひるま》はできるだけ離床《りしょう》して過《す》ごすように促《うなが》す。","exampleGapRuby":"昼間《ひるま》はできるだけ{{GAP}}して過《す》ごすように促《うなが》す。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「離床」は廃用症候群の予防。「離床センサー」は転倒対策の機器で、意味が違うので注意。","noteEn":"Getting out of bed prevents disuse syndrome. Note that 離床センサー is a fall-detection device — a different meaning.","gapTerm":"離床","termRuby":"離床《りしょう》","easyJaRuby":"ベッドから起《お》きて離《はな》れること","noteJaRuby":"「離床《りしょう》」は廃用症候群《はいようしょうこうぐん》の予防《よぼう》。「離床《りしょう》センサー」は転倒対策《てんとうたいさく》の機器《きき》で、意味《いみ》が違《ちが》うので注意《ちゅうい》。","noteEnRuby":"Getting out of bed prevents disuse syndrome. Note that 離床《りしょう》センサー is a fall-detection device — a different meaning."},{"id":"KV159","term":"洗髪","kana":"せんぱつ","romaji":"senpatsu","english":"washing hair","easyJa":"髪の毛を洗うこと","englishDesc":"Washing the hair.","exampleJa":"ベッド上での洗髪介助の際、お湯の温度を確認する。","exampleEn":"When washing hair in bed, check the temperature of the water.","exampleRuby":"ベッド上《じょう》での洗髪介助《せんぱつかいじょ》の際《さい》、お湯《ゆ》の温度《おんど》を確認《かくにん》する。","exampleGapRuby":"ベッド上《じょう》での{{GAP}}介助《かいじょ》の際《さい》、お湯《ゆ》の温度《おんど》を確認《かくにん》する。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"洗髪では湯温（約38〜40度）を必ず自分の手や腕で確認してから使う。","noteEn":"Always check the water (about 38–40°C) on your own hand or arm before using it.","gapTerm":"洗髪","termRuby":"洗髪《せんぱつ》","easyJaRuby":"髪《かみ》の毛《け》を洗《あら》うこと","noteJaRuby":"洗髪《せんぱつ》では湯温《ゆおん》（約《やく》38〜40度《ど》）を必《かなら》ず自分《じぶん》の手《て》や腕《うで》で確認《かくにん》してから使《つか》う。","noteEnRuby":""},{"id":"KV160","term":"足浴","kana":"そくよく","romaji":"sokuyoku","english":"foot bath","easyJa":"足だけをお湯につけて洗ったり温めたりすること","englishDesc":"Putting only the feet in warm water to wash or warm them.","exampleJa":"血液の流れを良くするために足浴を行う。","exampleEn":"Give a foot bath to improve blood circulation.","exampleRuby":"血液《けつえき》の流《なが》れを良《よ》くするために足浴《そくよく》を行《おこな》う。","exampleGapRuby":"血液《けつえき》の流《なが》れを良《よ》くするために{{GAP}}を行《おこな》う。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"足浴は入浴できない人にも実施でき、入眠を促す効果もある。","noteEn":"A foot bath can be given to people who cannot bathe, and it also helps sleep.","gapTerm":"足浴","termRuby":"足浴《そくよく》","easyJaRuby":"足《あし》だけをお湯《ゆ》につけて洗《あら》ったり温《あたた》めたりすること","noteJaRuby":"足浴《そくよく》は入浴《にゅうよく》できない人《ひと》にも実施《じっし》でき、入眠《にゅうみん》を促《うなが》す効果《こうか》もある。","noteEnRuby":""},{"id":"KV161","term":"喀痰吸引","kana":"かくたんきゅういん","romaji":"kakutankyūin","english":"sputum suctioning","easyJa":"機械を使って、喉の奥の痰を吸い取ること","englishDesc":"Using a machine to remove phlegm from the throat.","exampleJa":"介護福祉士が行う喀痰吸引の手順について。","exampleEn":"About the procedure for sputum suctioning by a certified care worker.","exampleRuby":"介護福祉士《かいごふくしし》が行《おこな》う喀痰吸引《かくたんきゅういん》の手順《てじゅん》について。","exampleGapRuby":"介護福祉士《かいごふくしし》が行《おこな》う{{GAP}}の手順《てじゅん》について。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"介護福祉士が行えるのは、研修修了＋医師の指示＋看護師との連携がある場合のみ。","noteEn":"Certified care workers may do this only with completed training, a doctor's instruction and nurse cooperation.","gapTerm":"喀痰吸引","termRuby":"喀痰吸引《かくたんきゅういん》","easyJaRuby":"機械《きかい》を使《つか》って、喉《のど》の奥《おく》の痰《たん》を吸《す》い取《と》ること","noteJaRuby":"介護福祉士《かいごふくしし》が行《おこな》えるのは、研修修了《けんしゅうしゅうりょう》＋医師《いし》の指示《しじ》＋看護師《かんごし》との連携《れんけい》がある場合《ばあい》のみ。","noteEnRuby":""},{"id":"KV162","term":"経管栄養","kana":"けいかんえいよう","romaji":"keikan'eiyō","english":"tube feeding","easyJa":"胃や鼻から管を入れて、栄養を入れること","englishDesc":"Giving nutrition through a tube into the stomach or nose.","exampleJa":"胃ろうを使った経管栄養の準備をする。","exampleEn":"Prepare tube feeding using a gastrostomy.","exampleRuby":"胃《い》ろうを使《つか》った経管栄養《けいかんえいよう》の準備《じゅんび》をする。","exampleGapRuby":"胃《い》ろうを使《つか》った{{GAP}}の準備《じゅんび》をする。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"医療的ケア","level":3,"levelLabel":"発展","levelEn":"Advanced","noteJa":"注入前は本人確認・体位（上半身30度以上）・注入物の温度を確認する。","noteEn":"Before feeding, confirm the person, raise the upper body at least 30 degrees, and check the temperature.","gapTerm":"経管栄養","termRuby":"経管栄養《けいかんえいよう》","easyJaRuby":"胃《い》や鼻《はな》から管《くだ》を入《い》れて、栄養《えいよう》を入《い》れること","noteJaRuby":"注入前《ちゅうにゅうまえ》は本人確認《ほんにんかくにん》・体位《たいい》（上半身《じょうはんしん》30度以上《どいじょう》）・注入物《ちゅうにゅうぶつ》の温度《おんど》を確認《かくにん》する。","noteEnRuby":""},{"id":"KV163","term":"立位","kana":"りつい","romaji":"ritsui","english":"standing position","easyJa":"立っている姿勢","englishDesc":"Standing up.","exampleJa":"トイレでズボンを下ろす時は、立位を保ってもらう。","exampleEn":"When lowering trousers in the toilet, have the user keep a standing position.","exampleRuby":"トイレでズボンを下《お》ろす時《とき》は、立位《りつい》を保《たも》ってもらう。","exampleGapRuby":"トイレでズボンを下《お》ろす時《とき》は、{{GAP}}を保《たも》ってもらう。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"生活支援技術","level":2,"levelLabel":"標準","levelEn":"Standard","noteJa":"「立位」は「りつい」。「立位保持」＝立ったままの姿勢を保つこと。","noteEn":"Read りつい. 立位保持 means keeping the standing position.","gapTerm":"立位","termRuby":"立位《りつい》","easyJaRuby":"立《た》っている姿勢《しせい》","noteJaRuby":"「立位《りつい》」は「りつい」。「立位保持《りついほじ》」＝立《た》ったままの姿勢《しせい》を保《たも》つこと。","noteEnRuby":"Read りつい. 立位保持《りついほじ》 means keeping the standing position."},{"id":"KV164","term":"自立","kana":"じりつ","romaji":"jiritsu","english":"independence","easyJa":"誰かの助けを借りずに、自分でやること","englishDesc":"Doing things by yourself without help.","exampleJa":"利用者の自立に向けた支援を第一に考える。","exampleEn":"Support aimed at the user's independence comes first.","exampleRuby":"利用者《りようしゃ》の自立《じりつ》に向《む》けた支援《しえん》を第一《だいいち》に考《かんが》える。","exampleGapRuby":"利用者《りようしゃ》の{{GAP}}に向《む》けた支援《しえん》を第一《だいいち》に考《かんが》える。","categoryId":3,"category":"介護動作・介助","categoryEn":"Care actions & assistance terms","subject":"人間の尊厳と自立","level":1,"levelLabel":"基礎","levelEn":"Basic","noteJa":"「自立」（自分でする）と「自律」（自分で決める）は同じ「じりつ」。介護保険は「自立支援」。","noteEn":"自立 (do it yourself) and 自律 (decide for yourself) are both jiritsu. The insurance system uses 自立支援.","gapTerm":"自立","termRuby":"自立《じりつ》","easyJaRuby":"誰《だれ》かの助《たす》けを借《か》りずに、自分《じぶん》でやること","noteJaRuby":"「自立《じりつ》」（自分《じぶん》でする）と「自律《じりつ》」（自分《じぶん》で決《き》める）は同《おな》じ「じりつ」。介護保険《かいごほけん》は「自立支援《じりつしえん》」。","noteEnRuby":"自立《じりつ》 (do it yourself) and 自律《じりつ》 (decide for yourself) are both jiritsu. The insurance system uses 自立支援《じりつしえん》."},{"id":"KV165","term":"看取り","kana":"みとり","romaji":"mitori","english":"end-of-life care","easyJa":"亡くなる前、最期の時間を安らかに過ごせるよう世話すること","englishDesc":"Caring for a person peacefully in their final days.","exampleJa":"施設での看取り介護において留意すべきこと。","exampleEn":"Points to keep in mind in end-of-life care at a facility.","exampleRuby":"施設《しせつ》での看取《みと
