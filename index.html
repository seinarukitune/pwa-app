der long-term care insurance.","jaRuby":"介護保険制度《かいごほけんせいど》において、要介護認定《ようかいごにんてい》を受《う》けた利用者《りようしゃ》が訪問看護《ほうもんかんご》を利用《りよう》することはできない。"},{"ja":"地域保健法に基づく保健所は、市区町村のすべての公民館に設置が義務づけられている。","en":"Public health centers under the Community Health Act must be placed in every community hall in every city, ward, town and village.","jaRuby":"地域保健法《ちいきほけんほう》に基《もと》づく保健所《ほけんじょ》は、市区町村《しくちょうそん》のすべての公民館《こうみんかん》に設置《せっち》が義務《ぎむ》づけられている。"},{"ja":"障害者総合支援法に基づく障害福祉サービスでは、居宅介護（ホームヘルプ）や重度訪問介護などが提供される。","en":"Disability welfare services under the Comprehensive Support Act include home care (home help) and visiting care for people with severe disabilities.","jaRuby":"障害者総合支援法《しょうがいしゃそうごうしえんほう》に基《もと》づく障害福祉《しょうがいふくし》サービスでは、居宅介護《きょたくかいご》（ホームヘルプ）や重度訪問介護《じゅうどほうもんかいご》などが提供《ていきょう》される。"},{"ja":"介護保険のサービス計画（ケアプラン）は、必ず主治医が作成しなければならない。","en":"The care plan for long-term care insurance must always be made by the family doctor.","jaRuby":"介護保険《かいごほけん》のサービス計画《けいかく》（ケアプラン）は、必《かなら》ず主治医《しゅじい》が作成《さくせい》しなければならない。"}],"answer":4,"expJa":"障害者総合支援法では、居宅介護や重度訪問介護などの障害福祉サービスが提供される。なお、医療保険は国民皆保険であり、介護保険でも訪問看護は利用可能である。","expEn":"The Comprehensive Support Act provides disability welfare services such as home care and visiting care for severe disabilities. Note: Japan has universal medical insurance, and home-visit nursing can also be used under long-term care insurance.","jaRuby":"日本《にほん》の保健医療《ほけんいりょう》・福祉《ふくし》に関《かん》する諸制度《しょせいど》の説明《せつめい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"障害者総合支援法《しょうがいしゃそうごうしえんほう》では、居宅介護《きょたくかいご》や重度訪問介護《じゅうどほうもんかいご》などの障害福祉《しょうがいふくし》サービスが提供《ていきょう》される。なお、医療保険《いりょうほけん》は国民皆保険《こくみんかいほけん》であり、介護保険《かいごほけん》でも訪問看護《ほうもんかんご》は利用可能《りようかのう》である。"},{"id":"MC08","no":8,"chapter":"mc2","ja":"医療的行為に関係する法律とその規定内容の組み合わせとして、最も適切なものを1つ選びなさい。","en":"Which pair of a law and its content about medical acts is most appropriate?","options":[{"ja":"保健師助産師看護師法 ―― 介護福祉士が単独で外科手術を行えることを規定している。","en":"Act on Public Health Nurses, Midwives and Nurses – allows certified care workers to do surgery alone.","jaRuby":"保健師助産師看護師法《ほけんしじょさんしかんごしほう》 ―― 介護福祉士《かいごふくしし》が単独《たんどく》で外科手術《げかしゅじゅつ》を行《おこな》えることを規定《きてい》している。"},{"ja":"社会福祉士及び介護福祉士法 ―― 介護福祉士に医薬品の処方権を認めている。","en":"Certified Social Workers and Certified Care Workers Act – gives care workers the right to prescribe medicine.","jaRuby":"社会福祉士及《しゃかいふくししおよ》び介護福祉士法《かいごふくししほう》 ―― 介護福祉士《かいごふくしし》に医薬品《いやくひん》の処方権《しょほうけん》を認《みと》めている。"},{"ja":"介護保険法 ―― 家族が在宅で喀痰吸引を行うことを全面的に禁止している。","en":"Long-Term Care Insurance Act – completely bans families from suctioning at home.","jaRuby":"介護保険法《かいごほけんほう》 ―― 家族《かぞく》が在宅《ざいたく》で喀痰吸引《かくたんきゅういん》を行《おこな》うことを全面的《ぜんめんてき》に禁止《きんし》している。"},{"ja":"医師法第17条 ――「医師でなければ、医業をなしてはならない」と規定されている。","en":"Medical Practitioners' Act, Article 17 – “No one except a doctor may practice medicine.”","jaRuby":"医師法第《いしほうだい》17条《じょう》 ――「医師《いし》でなければ、医業《いぎょう》をなしてはならない」と規定《きてい》されている。"},{"ja":"医療法 ―― 特別養護老人ホームを「病院」として定義している。","en":"Medical Care Act – defines special nursing homes for the elderly as “hospitals”.","jaRuby":"医療法《いりょうほう》 ―― 特別養護老人《とくべつようごろうじん》ホームを「病院《びょういん》」として定義《ていぎ》している。"}],"answer":4,"expJa":"医師法第17条には「医師でなければ、医業をなしてはならない」と規定されている。","expEn":"Article 17 of the Medical Practitioners' Act says: “No one except a doctor may practice medicine.”","jaRuby":"医療的行為《いりょうてきこうい》に関係《かんけい》する法律《ほうりつ》とその規定内容《きていないよう》の組《く》み合《あ》わせとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"医師法第《いしほうだい》17条《じょう》には「医師《いし》でなければ、医業《いぎょう》をなしてはならない」と規定《きてい》されている。"},{"id":"MC09","no":9,"chapter":"mc2","ja":"「医行為」の概念および介護職員が行える行為の解釈について、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about the idea of “medical acts” and what care workers can do?","options":[{"ja":"水銀体温計や電子体温計を用いて腋下（わきの下）で体温を測定する行為は、医師しか行えない医行為である。","en":"Taking a temperature under the arm with a mercury or electronic thermometer is a medical act only doctors can do.","jaRuby":"水銀体温計《すいぎんたいおんけい》や電子体温計《でんしたいおんけい》を用《もち》いて腋下《えきか》（わきの下《した》）で体温《たいおん》を測定《そくてい》する行為《こうい》は、医師《いし》しか行《おこな》えない医行為《いこうい》である。"},{"ja":"喀痰吸引や経管栄養は本来「医行為」であるが、一定の要件を満たした介護職員等が「特定行為」として実施することが法律で認められている。","en":"Suctioning and tube feeding are originally medical acts, but the law allows care workers who meet certain conditions to do them as “specified acts”.","jaRuby":"喀痰吸引《かくたんきゅういん》や経管栄養《けいかんえいよう》は本来《ほんらい》「医行為《いこうい》」であるが、一定《いってい》の要件《ようけん》を満《み》たした介護職員等《かいごしょくいんとう》が「特定行為《とくていこうい》」として実施《じっし》することが法律《ほうりつ》で認《みと》められている。"},{"ja":"自動血圧計を用いて血圧を測定する行為は、いかなる場合も看護師でなければ実施できない。","en":"Measuring blood pressure with an automatic monitor can only be done by a nurse in every case.","jaRuby":"自動血圧計《じどうけつあつけい》を用《もち》いて血圧《けつあつ》を測定《そくてい》する行為《こうい》は、いかなる場合《ばあい》も看護師《かんごし》でなければ実施《じっし》できない。"},{"ja":"軽微な切り傷に対して絆創膏を貼る行為は、重大な医行為にあたるため介護職員は行えない。","en":"Putting a plaster on a small cut is a serious medical act, so care workers cannot do it.","jaRuby":"軽微《けいび》な切《き》り傷《きず》に対《たい》して絆創膏《ばんそうこう》を貼《は》る行為《こうい》は、重大《じゅうだい》な医行為《いこうい》にあたるため介護職員《かいごしょくいん》は行《おこな》えない。"},{"ja":"耳垢（耳あか）を除去する行為は、鼓膜に付着している場合であってもすべて医行為には該当しない。","en":"Removing earwax is never a medical act, even when it is stuck to the eardrum.","jaRuby":"耳垢《じこう》（耳《みみ》あか）を除去《じょきょ》する行為《こうい》は、鼓膜《こまく》に付着《ふちゃく》している場合《ばあい》であってもすべて医行為《いこうい》には該当《がいとう》しない。"}],"answer":2,"expJa":"喀痰吸引や経管栄養は医行為であるが、「社会福祉士及び介護福祉士法」に基づき、一定の研修を修了した介護職員等が特定行為として実施することが認められている。なお、腋下での体温測定や自動血圧計による血圧測定、軽微な傷への絆創膏貼付などは原則として医行為には該当しない。","expEn":"Suctioning and tube feeding are medical acts, but under the Act, care workers who finish certain training may do them as specified acts. Taking a temperature under the arm, using an automatic blood pressure monitor, and putting a plaster on a small wound are in principle not medical acts.","jaRuby":"「医行為《いこうい》」の概念《がいねん》および介護職員《かいごしょくいん》が行《おこな》える行為《こうい》の解釈《かいしゃく》について、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"喀痰吸引《かくたんきゅういん》や経管栄養《けいかんえいよう》は医行為《いこうい》であるが、「社会福祉士及《しゃかいふくししおよ》び介護福祉士法《かいごふくししほう》」に基《もと》づき、一定《いってい》の研修《けんしゅう》を修了《しゅうりょう》した介護職員等《かいごしょくいんとう》が特定行為《とくていこうい》として実施《じっし》することが認《みと》められている。なお、腋下《えきか》での体温測定《たいおんそくてい》や自動血圧計《じどうけつあつけい》による血圧測定《けつあつそくてい》、軽微《けいび》な傷《きず》への絆創膏貼付《ばんそうこうちょうふ》などは原則《げんそく》として医行為《いこうい》には該当《がいとう》しない。"},{"id":"MC10","no":10,"chapter":"mc2","ja":"チーム医療と地域包括ケアシステムにおける多職種連携の考え方として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about team medical care and multi-professional cooperation in the Community-based Integrated Care System?","options":[{"ja":"チーム医療の中心は常に医師であり、利用者や家族の意向はチームの方針決定には含めない。","en":"The doctor is always the center of the team; the wishes of the user and family are not included in team decisions.","jaRuby":"チーム医療《いりょう》の中心《ちゅうしん》は常《つね》に医師《いし》であり、利用者《りようしゃ》や家族《かぞく》の意向《いこう》はチームの方針決定《ほうしんけってい》には含《ふく》めない。"},{"ja":"専門職同士の役割分担を厳密にするため、職種間での情報共有は行わないことが原則である。","en":"To keep roles strictly separate, professionals in principle do not share information.","jaRuby":"専門職同士《せんもんしょくどうし》の役割分担《やくわりぶんたん》を厳密《げんみつ》にするため、職種間《しょくしゅかん》での情報共有《じょうほうきょうゆう》は行《おこな》わないことが原則《げんそく》である。"},{"ja":"介護職員は医療職ではないため、チーム医療の構成メンバーには含まれない。","en":"Care workers are not medical staff, so they are not members of the medical team.","jaRuby":"介護職員《かいごしょくいん》は医療職《いりょうしょく》ではないため、チーム医療《いりょう》の構成《こうせい》メンバーには含《ふく》まれない。"},{"ja":"地域包括ケアシステムとは、高齢者が重度な要介護状態になっても、住み慣れた地域で自分らしい暮らしを人生の最後まで続けられるよう支援する体制である。","en":"The Community-based Integrated Care System supports older people to keep living their own way in their familiar community until the end of life, even if they need a lot of care.","jaRuby":"地域包括《ちいきほうかつ》ケアシステムとは、高齢者《こうれいしゃ》が重度《じゅうど》な要介護状態《ようかいごじょうたい》になっても、住《す》み慣《な》れた地域《ちいき》で自分《じぶん》らしい暮《く》らしを人生《じんせい》の最後《さいご》まで続《つづ》けられるよう支援《しえん》する体制《たいせい》である。"},{"ja":"ケアマネジャー（介護支援専門員）は、医療職との連携に関与してはならない。","en":"Care managers must not be involved in cooperation with medical staff.","jaRuby":"ケアマネジャー（介護支援専門員《かいごしえんせんもんいん》）は、医療職《いりょうしょく》との連携《れんけい》に関与《かんよ》してはならない。"}],"answer":4,"expJa":"チーム医療の中心は常に「利用者（患者）と家族」であり、地域包括ケアシステムでは医療・介護・予防・住まい・生活支援が一体的に提供されるよう多職種が連携する。","expEn":"The center of team care is always the user (patient) and family. In the Community-based Integrated Care System, many professions work together so that medical care, nursing care, prevention, housing and life support are given as one.","jaRuby":"チーム医療《いりょう》と地域包括《ちいきほうかつ》ケアシステムにおける多職種連携《たしょくしゅれんけい》の考《かんが》え方《かた》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"チーム医療《いりょう》の中心《ちゅうしん》は常《つね》に「利用者《りようしゃ》（患者《かんじゃ》）と家族《かぞく》」であり、地域包括《ちいきほうかつ》ケアシステムでは医療《いりょう》・介護《かいご》・予防《よぼう》・住《す》まい・生活支援《せいかつしえん》が一体的《いったいてき》に提供《ていきょう》されるよう多職種《たしょくしゅ》が連携《れんけい》する。"},{"id":"MC11","no":11,"chapter":"mc2","ja":"喀痰吸引や経管栄養を実施する際の「介護と看護の連携」に関する記述として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about cooperation between care workers and nurses in suctioning and tube feeding?","options":[{"ja":"看護職員は、利用者の口腔内や胃ろう部の状態を定期的に確認し、介護職員と情報を共有する。","en":"Nurses regularly check the condition of the user's mouth and gastrostomy site and share information with care workers.","jaRuby":"看護職員《かんごしょくいん》は、利用者《りようしゃ》の口腔内《こうくうない》や胃《い》ろう部《ぶ》の状態《じょうたい》を定期的《ていきてき》に確認《かくにん》し、介護職員《かいごしょくいん》と情報《じょうほう》を共有《きょうゆう》する。"},{"ja":"介護職員は、利用者に普段と違う様子があっても、自分の判断で吸引を続けて事後にまとめて報告すればよい。","en":"Even if the user looks different from usual, the care worker can keep suctioning on their own judgment and report later.","jaRuby":"介護職員《かいごしょくいん》は、利用者《りようしゃ》に普段《ふだん》と違《ちが》う様子《ようす》があっても、自分《じぶん》の判断《はんだん》で吸引《きゅういん》を続《つづ》けて事後《じご》にまとめて報告《ほうこく》すればよい。"},{"ja":"指示書の内容に疑問がある場合、介護職員は自己判断で内容を修正して実施する。","en":"If the care worker has doubts about the instruction sheet, they can change it on their own and carry it out.","jaRuby":"指示書《しじしょ》の内容《ないよう》に疑問《ぎもん》がある場合《ばあい》、介護職員《かいごしょくいん》は自己判断《じこはんだん》で内容《ないよう》を修正《しゅうせい》して実施《じっし》する。"},{"ja":"介護職員と看護職員の連携は、事故が発生した時のみ行えばよく、日常的な連絡は不要である。","en":"Care workers and nurses only need to cooperate when an accident happens; daily contact is not needed.","jaRuby":"介護職員《かいごしょくいん》と看護職員《かんごしょくいん》の連携《れんけい》は、事故《じこ》が発生《はっせい》した時《とき》のみ行《おこな》えばよく、日常的《にちじょうてき》な連絡《れんらく》は不要《ふよう》である。"},{"ja":"看護職員が不在の時間帯は、緊急時であっても看護職員へ連絡してはならない。","en":"When no nurse is on duty, care workers must not contact a nurse, even in an emergency.","jaRuby":"看護職員《かんごしょくいん》が不在《ふざい》の時間帯《じかんたい》は、緊急時《きんきゅうじ》であっても看護職員《かんごしょくいん》へ連絡《れんらく》してはならない。"}],"answer":1,"expJa":"安全な医療的ケアの提供には、日頃から看護職員による定期的な状態確認と、介護職員からの迅速・的確な報告および情報共有が不可欠である。","expEn":"For safe medical care, nurses must check the user's condition regularly, and care workers must report quickly and accurately and share information every day.","jaRuby":"喀痰吸引《かくたんきゅういん》や経管栄養《けいかんえいよう》を実施《じっし》する際《さい》の「介護《かいご》と看護《かんご》の連携《れんけい》」に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"安全《あんぜん》な医療的《いりょうてき》ケアの提供《ていきょう》には、日頃《ひごろ》から看護職員《かんごしょくいん》による定期的《ていきてき》な状態確認《じょうたいかくにん》と、介護職員《かいごしょくいん》からの迅速《じんそく》・的確《てきかく》な報告《ほうこく》および情報共有《じょうほうきょうゆう》が不可欠《ふかけつ》である。"},{"id":"MC12","no":12,"chapter":"mc2","ja":"登録喀痰吸引等事業者において、医療職と介護職などが参加し、安全な実施体制の確保やヒヤリハット事例の検討などを行うために設置される委員会として、正しいものを1つ選びなさい。","en":"At a registered suctioning provider, which committee is set up with medical and care staff to keep the system safe and review near-miss cases?","options":[{"ja":"感染症対策特別委員会","en":"Special committee for infection control","jaRuby":"感染症対策特別委員会《かんせんしょうたいさくとくべついいんかい》"},{"ja":"身体拘束廃止委員会","en":"Committee for abolishing physical restraint","jaRuby":"身体拘束廃止委員会《しんたいこうそくはいしいいんかい》"},{"ja":"給食運営委員会","en":"Meal service committee","jaRuby":"給食運営委員会《きゅうしょくうんえいいいんかい》"},{"ja":"安全委員会（安全対策委員会）","en":"Safety committee (safety measures committee)","jaRuby":"安全委員会《あんぜんいいんかい》（安全対策委員会《あんぜんたいさくいいんかい》）"},{"ja":"個人情報保護委員会","en":"Personal information protection committee","jaRuby":"個人情報保護委員会《こじんじょうほうほごいいんかい》"}],"answer":4,"expJa":"登録喀痰吸引等事業者には、医師、看護職員、介護職員等が参加する「安全委員会」を設置し、安全確保のための体制整備やヒヤリハット事例の検討・対策を行うことが求められている。","expEn":"Registered providers must set up a “safety committee” with doctors, nurses and care workers to build a safe system and review near-miss cases and countermeasures.","jaRuby":"登録喀痰吸引等事業者《とうろくかくたんきゅういんとうじぎょうしゃ》において、医療職《いりょうしょく》と介護職《かいごしょく》などが参加《さんか》し、安全《あんぜん》な実施体制《じっしたいせい》の確保《かくほ》やヒヤリハット事例《じれい》の検討《けんとう》などを行《おこな》うために設置《せっち》される委員会《いいんかい》として、正《ただ》しいものを1つ選《えら》びなさい。","expJaRuby":"登録喀痰吸引等事業者《とうろくかくたんきゅういんとうじぎょうしゃ》には、医師《いし》、看護職員《かんごしょくいん》、介護職員等《かいごしょくいんとう》が参加《さんか》する「安全委員会《あんぜんいいんかい》」を設置《せっち》し、安全確保《あんぜんかくほ》のための体制整備《たいせいせいび》やヒヤリハット事例《じれい》の検討《けんとう》・対策《たいさく》を行《おこな》うことが求《もと》められている。"},{"id":"MC13","no":13,"chapter":"mc3","ja":"医療的ケアにおけるリスクマネジメントの考え方として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate idea of risk management in medical care?","options":[{"ja":"事故が起きた際は、個人の責任を厳しく追及し、罰則を与えることで再発を防ぐ。","en":"When an accident happens, strictly blame and punish the person to prevent it from happening again.","jaRuby":"事故《じこ》が起《お》きた際《さい》は、個人《こじん》の責任《せきにん》を厳《きび》しく追及《ついきゅう》し、罰則《ばっそく》を与《あた》えることで再発《さいはつ》を防《ふせ》ぐ。"},{"ja":"「人間は誰でも誤りを犯す可能性がある」という前提に立ち、ミスが事故につながらない仕組みをつくる。","en":"Start from the idea that “anyone can make mistakes,” and build systems so mistakes do not lead to accidents.","jaRuby":"「人間《にんげん》は誰《だれ》でも誤《あやま》りを犯《おか》す可能性《かのうせい》がある」という前提《ぜんてい》に立《た》ち、ミスが事故《じこ》につながらない仕組《しく》みをつくる。"},{"ja":"ヒヤリハット（インシデント）は実害がないため、記録や報告をする必要はない。","en":"Near-misses (incidents) cause no real harm, so they do not need to be recorded or reported.","jaRuby":"ヒヤリハット（インシデント）は実害《じつがい》がないため、記録《きろく》や報告《ほうこく》をする必要《ひつよう》はない。"},{"ja":"マニュアルや手順書は初心者だけが見るものであり、慣れた職員は手順を省略してよい。","en":"Manuals are only for beginners; experienced staff may skip steps.","jaRuby":"マニュアルや手順書《てじゅんしょ》は初心者《しょしんしゃ》だけが見《み》るものであり、慣《な》れた職員《しょくいん》は手順《てじゅん》を省略《しょうりゃく》してよい。"},{"ja":"器具や機材の点検は、故障して動かなくなってから行えばよい。","en":"Check tools and equipment only after they break down.","jaRuby":"器具《きぐ》や機材《きざい》の点検《てんけん》は、故障《こしょう》して動《うご》かなくなってから行《おこな》えばよい。"}],"answer":2,"expJa":"「人は誰でも間違える（To Err is Human）」という前提に立ち、個人の注意だけに頼るのではなく、システムや手順の工夫によって事故を防ぐのがリスクマネジメントの基本である。","expEn":"Err is Human） The basis of risk management is the idea “To err is human.” Instead of relying only on each person being careful, prevent accidents by improving systems and procedures.","jaRuby":"医療的《いりょうてき》ケアにおけるリスクマネジメントの考《かんが》え方《かた》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"「人《ひと》は誰《だれ》でも間違《まちが》える（To Err is Human）」という前提《ぜんてい》に立《た》ち、個人《こじん》の注意《ちゅうい》だけに頼《たよ》るのではなく、システムや手順《てじゅん》の工夫《くふう》によって事故《じこ》を防《ふせ》ぐのがリスクマネジメントの基本《きほん》である。"},{"id":"MC14","no":14,"chapter":"mc3","ja":"「1件の重大事故の背後には、29件の軽微な事故があり、さらにその背後には300件のヒヤリハット（異常）が存在する」という法則の名称として、正しいものを1つ選びなさい。","en":"“Behind 1 serious accident there are 29 minor accidents, and behind those there are 300 near-misses.” What is this law called?","options":[{"ja":"ハインリッヒの法則","en":"Heinrich's law","jaRuby":"ハインリッヒの法則《ほうそく》"},{"ja":"マズローの法則","en":"Maslow's law","jaRuby":"マズローの法則《ほうそく》"},{"ja":"パレートの法則","en":"Pareto's law","jaRuby":"パレートの法則《ほうそく》"},{"ja":"キューブラー・ロスの法則","en":"Kübler-Ross's law","jaRuby":"キューブラー・ロスの法則《ほうそく》"},{"ja":"ナイチンゲールの法則","en":"Nightingale's law","jaRuby":"ナイチンゲールの法則《ほうそく》"}],"answer":1,"expJa":"1件の重大事故の背後に29件の軽微な事故と300件のヒヤリハットがあるという法則は「ハインリッヒの法則」である。","expEn":"The law that there are 29 minor accidents and 300 near-misses behind 1 serious accident is “Heinrich's law”.","jaRuby":"「1件《けん》の重大事故《じゅうだいじこ》の背後《はいご》には、29件《けん》の軽微《けいび》な事故《じこ》があり、さらにその背後《はいご》には300件《けん》のヒヤリハット（異常《いじょう》）が存在《そんざい》する」という法則《ほうそく》の名称《めいしょう》として、正《ただ》しいものを1つ選《えら》びなさい。","expJaRuby":"1件《けん》の重大事故《じゅうだいじこ》の背後《はいご》に29件《けん》の軽微《けいび》な事故《じこ》と300件《けん》のヒヤリハットがあるという法則《ほうそく》は「ハインリッヒの法則《ほうそく》」である。"},{"id":"MC15","no":15,"chapter":"mc3","ja":"ヒヤリハット報告書（インシデントレポート）を作成する目的として、最も適切なものを1つ選びなさい。","en":"What is the most appropriate purpose of writing a near-miss report (incident report)?","options":[{"ja":"原因を分析して業務環境や手順を見直し、将来の重大なアクシデント（事故）を未然に防ぐ。","en":"To analyze the cause, review the work environment and procedures, and prevent serious accidents in the future.","jaRuby":"原因《げんいん》を分析《ぶんせき》して業務環境《ぎょうむかんきょう》や手順《てじゅん》を見直《みなお》し、将来《しょうらい》の重大《じゅうだい》なアクシデント（事故《じこ》）を未然《みぜん》に防《ふせ》ぐ。"},{"ja":"ミスをした職員の給与を減額するための査定資料にする。","en":"To use it as evidence for cutting the pay of the staff member who made the mistake.","jaRuby":"ミスをした職員《しょくいん》の給与《きゅうよ》を減額《げんがく》するための査定資料《さていしりょう》にする。"},{"ja":"家族に対して介護職員の苦労をアピールするために活用する。","en":"To show the family how hard care workers work.","jaRuby":"家族《かぞく》に対《たい》して介護職員《かいごしょくいん》の苦労《くろう》をアピールするために活用《かつよう》する。"},{"ja":"報告書を書くこと自体を目的とし、他の職員には一切非公開にする。","en":"Writing the report is the goal itself; keep it completely secret from other staff.","jaRuby":"報告書《ほうこくしょ》を書《か》くこと自体《じたい》を目的《もくてき》とし、他《ほか》の職員《しょくいん》には一切非公開《いっさいひこうかい》にする。"},{"ja":"警察や裁判所へ提出するための始末書として保管する。","en":"To keep it as a written apology for the police or the courts.","jaRuby":"警察《けいさつ》や裁判所《さいばんしょ》へ提出《ていしゅつ》するための始末書《しまつしょ》として保管《ほかん》する。"}],"answer":1,"expJa":"ヒヤリハット報告書は、個人の責任追及や処罰のためではなく、原因を分析して再発防止策を立て、重大なアクシデントを未然に防ぐために作成・共有する。","expEn":"Near-miss reports are not for blaming or punishing a person. They are written and shared to analyze causes, make prevention plans and stop serious accidents before they happen.","jaRuby":"ヒヤリハット報告書《ほうこくしょ》（インシデントレポート）を作成《さくせい》する目的《もくてき》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"ヒヤリハット報告書《ほうこくしょ》は、個人《こじん》の責任追及《せきにんついきゅう》や処罰《しょばつ》のためではなく、原因《げんいん》を分析《ぶんせき》して再発防止策《さいはつぼうしさく》を立《た》て、重大《じゅうだい》なアクシデントを未然《みぜん》に防《ふせ》ぐために作成《さくせい》・共有《きょうゆう》する。"},{"id":"MC16","no":16,"chapter":"mc3","ja":"一次救命処置（BLS）の手順において、倒れている人を発見した際、周囲の安全を確認した直後に行う行動として、最も適切なものを1つ選びなさい。","en":"In Basic Life Support (BLS), when you find a person who has collapsed, what should you do right after checking that the area is safe?","options":[{"ja":"直ちに胸骨圧迫を開始する。","en":"Start chest compressions immediately.","jaRuby":"直《ただ》ちに胸骨圧迫《きょうこつあっぱく》を開始《かいし》する。"},{"ja":"すぐにAEDの電極パッドを胸に貼り付ける。","en":"Put the AED pads on the chest right away.","jaRuby":"すぐにAEDの電極《でんきょく》パッドを胸《むね》に貼《は》り付《つ》ける。"},{"ja":"水を飲ませて意識が戻るか様子を見る。","en":"Give them water and see if they wake up.","jaRuby":"水《みず》を飲《の》ませて意識《いしき》が戻《もど》るか様子《ようす》を見《み》る。"},{"ja":"肩を軽くたたきながら大声で呼びかけ、反応（意識）があるかを確認する。","en":"Tap the shoulders lightly and call out loudly to check if there is a response (consciousness).","jaRuby":"肩《かた》を軽《かる》くたたきながら大声《おおごえ》で呼《よ》びかけ、反応《はんのう》（意識《いしき》）があるかを確認《かくにん》する。"},{"ja":"脈拍を5分間かけて慎重に測定する。","en":"Carefully measure the pulse for 5 minutes.","jaRuby":"脈拍《みゃくはく》を5分間《ふんかん》かけて慎重《しんちょう》に測定《そくてい》する。"}],"answer":4,"expJa":"一次救命処置（BLS）では、周囲の安全を確認した後、まず肩を軽くたたきながら呼びかけて「反応（意識）の確認」を行い、反応がなければ応援と119番通報・AEDの手配を依頼する。","expEn":"In BLS, after checking the area is safe, first tap the shoulders and call out to check for a response (consciousness). If there is no response, call for help, call 119 and ask someone to bring an AED.","jaRuby":"一次救命処置《いちじきゅうめいしょち》（BLS）の手順《てじゅん》において、倒《たお》れている人《ひと》を発見《はっけん》した際《さい》、周囲《しゅうい》の安全《あんぜん》を確認《かくにん》した直後《ちょくご》に行《おこな》う行動《こうどう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"一次救命処置《いちじきゅうめいしょち》（BLS）では、周囲《しゅうい》の安全《あんぜん》を確認《かくにん》した後《あと》、まず肩《かた》を軽《かる》くたたきながら呼《よ》びかけて「反応《はんのう》（意識《いしき》）の確認《かくにん》」を行《おこな》い、反応《はんのう》がなければ応援《おうえん》と119番通報《ばんつうほう》・AEDの手配《てはい》を依頼《いらい》する。"},{"id":"MC17","no":17,"chapter":"mc3","ja":"成人の心肺蘇生における「胸骨圧迫」の方法として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate way to do chest compressions in adult CPR?","options":[{"ja":"左胸の心臓の真上を、胸が約1センチメートル沈む深さで、1分間に60回のテンポでゆっくり圧迫する。","en":"Press slowly right over the heart on the left chest, about 1 cm deep, 60 times per minute.","jaRuby":"左胸《ひだりむね》の心臓《しんぞう》の真上《まうえ》を、胸《むね》が約《やく》1センチメートル沈《しず》む深《ふか》さで、1分間《ふんかん》に60回《かい》のテンポでゆっくり圧迫《あっぱく》する。"},{"ja":"胸の真ん中（胸骨の下半分）を、胸が約5センチメートル沈む深さで、1分間に100〜120回のテンポで圧迫する。","en":"Press the center of the chest (lower half of the breastbone) about 5 cm deep, at 100–120 times per minute.","jaRuby":"胸《むね》の真《ま》ん中《なか》（胸骨《きょうこつ》の下半分《かはんぶん》）を、胸《むね》が約《やく》5センチメートル沈《しず》む深《ふか》さで、1分間《ふんかん》に100〜120回《かい》のテンポで圧迫《あっぱく》する。"},{"ja":"みぞおち（剣状突起）の上を、両手の指先だけで強く押し込む。","en":"Push hard on the pit of the stomach (xiphoid process) with only the fingertips of both hands.","jaRuby":"みぞおち（剣状突起《けんじょうとっき》）の上《うえ》を、両手《りょうて》の指先《ゆびさき》だけで強《つよ》く押《お》し込《こ》む。"},{"ja":"圧迫と圧迫の間は、胸が元の高さに戻らないように常に体重をかけ続ける。","en":"Between compressions, keep your body weight on so the chest does not go back up.","jaRuby":"圧迫《あっぱく》と圧迫《あっぱく》の間《あいだ》は、胸《むね》が元《もと》の高《たか》さに戻《もど》らないように常《つね》に体重《たいじゅう》をかけ続《つづ》ける。"},{"ja":"AEDが到着するまでの間、5分おきに休憩をはさみながら圧迫する。","en":"Until the AED arrives, take a break every 5 minutes.","jaRuby":"AEDが到着《とうちゃく》するまでの間《あいだ》、5分《ふん》おきに休憩《きゅうけい》をはさみながら圧迫《あっぱく》する。"}],"answer":2,"expJa":"成人の胸骨圧迫は、胸の真ん中（胸骨の下半分）を、約5センチメートル沈む深さ（6センチメートルを超えない）で、1分間に100〜120回のテンポで絶え間なく行う。圧迫と圧迫の間は胸が元の高さに戻るよう力を抜く（手を胸から離さない）。","expEn":"Adult chest compressions: press the center of the chest (lower half of the breastbone) about 5 cm deep (not more than 6 cm), 100–120 times per minute, without stopping. Between compressions, let the chest come back up (but keep your hands on the chest).","jaRuby":"成人《せいじん》の心肺蘇生《しんぱいそせい》における「胸骨圧迫《きょうこつあっぱく》」の方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"成人《せいじん》の胸骨圧迫《きょうこつあっぱく》は、胸《むね》の真《ま》ん中《なか》（胸骨《きょうこつ》の下半分《かはんぶん》）を、約《やく》5センチメートル沈《しず》む深《ふか》さ（6センチメートルを超《こ》えない）で、1分間《ふんかん》に100〜120回《かい》のテンポで絶《た》え間《あいだ》なく行《おこな》う。圧迫《あっぱく》と圧迫《あっぱく》の間《あいだ》は胸《むね》が元《もと》の高《たか》さに戻《もど》るよう力《ちから》を抜《ぬ》く（手《て》を胸《むね》から離《はな》さない）。"},{"id":"MC18","no":18,"chapter":"mc3","ja":"AED（自動体外式除細動器）の使用方法に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about using an AED (Automated External Defibrillator) is most appropriate?","options":[{"ja":"電極パッドを貼る位置が濡れている場合は、そのまま濡れた上からパッドを貼り付ける。","en":"If the skin where the pads go is wet, put the pads on over the wet skin.","jaRuby":"電極《でんきょく》パッドを貼《は》る位置《いち》が濡《ぬ》れている場合《ばあい》は、そのまま濡《ぬ》れた上《うえ》からパッドを貼《は》り付《つ》ける。"},{"ja":"電気ショックを行った後は、音声メッセージの指示を待たずに直ちに電極パッドをはがす。","en":"After the shock, remove the pads right away without waiting for the voice instructions.","jaRuby":"電気《でんき》ショックを行《おこな》った後《あと》は、音声《おんせい》メッセージの指示《しじ》を待《ま》たずに直《ただ》ちに電極《でんきょく》パッドをはがす。"},{"ja":"医療従事者でない介護職員は、法律によりAEDを使用することが禁止されている。","en":"Care workers who are not medical staff are banned by law from using an AED.","jaRuby":"医療従事者《いりょうじゅうじしゃ》でない介護職員《かいごしょくいん》は、法律《ほうりつ》によりAEDを使用《しよう》することが禁止《きんし》されている。"},{"ja":"ペースメーカーが植え込まれている場合は、その出っ張りの真上に電極パッドを重ねて貼る。","en":"If there is a pacemaker, put the pad right on top of the bump.","jaRuby":"ペースメーカーが植《う》え込《こ》まれている場合《ばあい》は、その出《で》っ張《ぱ》りの真上《まうえ》に電極《でんきょく》パッドを重《かさ》ねて貼《は》る。"},{"ja":"心電図の解析中や電気ショックを行う瞬間は、誰も傷病者の体に触れていないことを確認する。","en":"While the heart rhythm is being analyzed and at the moment of the shock, make sure no one is touching the person.","jaRuby":"心電図《しんでんず》の解析中《かいせきちゅう》や電気《でんき》ショックを行《おこな》う瞬間《しゅんかん》は、誰《だれ》も傷病者《しょうびょうしゃ》の体《からだ》に触《ふ》れていないことを確認《かくにん》する。"}],"answer":5,"expJa":"AEDの心電図解析中および電気ショック実施時は、感電や解析の妨げを防ぐため、誰も傷病者に触れていないことを確認する。体が濡れている場合は乾いたタオルで拭き取ってからパッドを貼る。","expEn":"During analysis and the shock, make sure no one touches the person, to prevent electric shock and wrong analysis. If the body is wet, wipe it with a dry towel before putting on the pads.","jaRuby":"AED（自動体外式除細動器《じどうたいがいしきじょさいどうき》）の使用方法《しようほうほう》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"AEDの心電図解析中《しんでんずかいせきちゅう》および電気《でんき》ショック実施時《じっしじ》は、感電《かんでん》や解析《かいせき》の妨《さまた》げを防《ふせ》ぐため、誰《だれ》も傷病者《しょうびょうしゃ》に触《ふ》れていないことを確認《かくにん》する。体《からだ》が濡《ぬ》れている場合《ばあい》は乾《かわ》いたタオルで拭《ふ》き取《と》ってからパッドを貼《は》る。"},{"id":"MC19","no":19,"chapter":"mc3","ja":"食事中などに食べ物が喉に詰まり、気道異物による窒息が疑われる利用者（意識はあるが声が出せず苦しんでいる状態）への初期対応として、最も適切なものを1つ選びなさい。","en":"A user may be choking on food (conscious, but cannot speak and is suffering). What is the most appropriate first response?","options":[{"ja":"水やお茶を大量に飲ませて、食べ物を胃へ流し込む。","en":"Make them drink a lot of water or tea to push the food into the stomach.","jaRuby":"水《みず》やお茶《ちゃ》を大量《たいりょう》に飲《の》ませて、食《た》べ物《もの》を胃《い》へ流《なが》し込《こ》む。"},{"ja":"背部叩打法（手のひらの付け根で左右の肩甲骨の中間を力強くたたく）や腹部突き上げ法を実施する。","en":"Do back blows (hit hard between the shoulder blades with the heel of the hand) or abdominal thrusts.","jaRuby":"背部叩打法《はいぶこうだほう》（手《て》のひらの付《つ》け根《ね》で左右《さゆう》の肩甲骨《けんこうこつ》の中間《ちゅうかん》を力強《ちからづよ》くたたく）や腹部突《ふくぶつ》き上《あ》げ法《ほう》を実施《じっし》する。"},{"ja":"掃除機のノズルや吸引チューブを喉の奥深くまで突っ込んで吸い出す。","en":"Push a vacuum cleaner nozzle or suction tube deep into the throat to suck it out.","jaRuby":"掃除機《そうじき》のノズルや吸引《きゅういん》チューブを喉《のど》の奥深《おくふか》くまで突《つ》っ込《こ》んで吸《す》い出《だ》す。"},{"ja":"仰向けに寝かせて、首の下に高い枕を入れる。","en":"Lay them on their back with a high pillow under the neck.","jaRuby":"仰向《あおむ》けに寝《ね》かせて、首《くび》の下《した》に高《たか》い枕《まくら》を入《い》れる。"},{"ja":"意識がなくなるまで何もせず、静かに見守る。","en":"Do nothing and quietly watch until they lose consciousness.","jaRuby":"意識《いしき》がなくなるまで何《なに》もせず、静《しず》かに見守《みまも》る。"}],"answer":2,"expJa":"気道異物による窒息が疑われ、強い咳ができない場合は、直ちに背部叩打法や腹部突き上げ法（ハイムリック法：妊婦や乳児には行わない）を実施して異物除去を試みる。","expEn":"If choking is suspected and the person cannot cough strongly, immediately try to remove the object with back blows or abdominal thrusts (Heimlich maneuver – not for pregnant women or infants).","jaRuby":"食事中《しょくじちゅう》などに食《た》べ物《もの》が喉《のど》に詰《つ》まり、気道異物《きどういぶつ》による窒息《ちっそく》が疑《うたが》われる利用者《りようしゃ》（意識《いしき》はあるが声《こえ》が出《で》せず苦《くる》しんでいる状態《じょうたい》）への初期対応《しょきたいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"気道異物《きどういぶつ》による窒息《ちっそく》が疑《うたが》われ、強《つよ》い咳《せき》ができない場合《ばあい》は、直《ただ》ちに背部叩打法《はいぶこうだほう》や腹部突《ふくぶつ》き上《あ》げ法《ほう》（ハイムリック法《ほう》：妊婦《にんぷ》や乳児《にゅうじ》には行《おこな》わない）を実施《じっし》して異物除去《いぶつじょきょ》を試《こころ》みる。"},{"id":"MC20","no":20,"chapter":"mc4","ja":"感染症が成立するための「感染の3要素」の組み合わせとして、正しいものを1つ選びなさい。","en":"Which is the correct set of the “3 elements of infection” needed for an infection to happen?","options":[{"ja":"細菌 ―― ウイルス ―― カビ（真菌）","en":"Bacteria – viruses – fungi (mold)","jaRuby":"細菌《さいきん》 ―― ウイルス ―― カビ（真菌《しんきん》）"},{"ja":"発熱 ―― 咳（せき） ―― 下痢","en":"Fever – cough – diarrhea","jaRuby":"発熱《はつねつ》 ―― 咳《せき》 ―― 下痢《げり》"},{"ja":"洗浄 ―― 消毒 ―― 滅菌","en":"Cleaning – disinfection – sterilization","jaRuby":"洗浄《せんじょう》 ―― 消毒《しょうどく》 ―― 滅菌《めっきん》"},{"ja":"感染源（病原体） ―― 感染経路 ―― 感受性宿主","en":"Source of infection (pathogen) – route of infection – susceptible host","jaRuby":"感染源《かんせんげん》（病原体《びょうげんたい》） ―― 感染経路《かんせんけいろ》 ―― 感受性宿主《かんじゅせいしゅくしゅ》"},{"ja":"マスク ―― 手袋 ―― エプロン","en":"Mask – gloves – apron","jaRuby":"マスク ―― 手袋《てぶくろ》 ―― エプロン"}],"answer":4,"expJa":"感染症は「感染源（病原体）」「感染経路」「感受性宿主（抵抗力の低下した人など）」の3要素が揃うことで成立する。","expEn":"An infection happens when 3 elements come together: the source (pathogen), the route of infection, and a susceptible host (e.g. a person with weak resistance).","jaRuby":"感染症《かんせんしょう》が成立《せいりつ》するための「感染《かんせん》の3要素《ようそ》」の組《く》み合《あ》わせとして、正《ただ》しいものを1つ選《えら》びなさい。","expJaRuby":"感染症《かんせんしょう》は「感染源《かんせんげん》（病原体《びょうげんたい》）」「感染経路《かんせんけいろ》」「感受性宿主《かんじゅせいしゅくしゅ》（抵抗力《ていこうりょく》の低下《ていか》した人《ひと》など）」の3要素《ようそ》が揃《そろ》うことで成立《せいりつ》する。"},{"id":"MC21","no":21,"chapter":"mc4","ja":"「スタンダード・プリコーション（標準予防策）」の基本的な考え方として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate basic idea of “standard precautions”?","options":[{"ja":"感染症と診断された利用者に対してのみ、手袋やマスクを着用して対応する。","en":"Wear gloves and masks only for users diagnosed with an infection.","jaRuby":"感染症《かんせんしょう》と診断《しんだん》された利用者《りようしゃ》に対《たい》してのみ、手袋《てぶくろ》やマスクを着用《ちゃくよう》して対応《たいおう》する。"},{"ja":"高齢者は免疫力が強いため、施設内では手洗いを省略しても感染は広がらない。","en":"Older people have strong immunity, so infection will not spread in the facility even if staff skip handwashing.","jaRuby":"高齢者《こうれいしゃ》は免疫力《めんえきりょく》が強《つよ》いため、施設内《しせつない》では手洗《てあら》いを省略《しょうりゃく》しても感染《かんせん》は広《ひろ》がらない。"},{"ja":"介護職員が一度装着した使い捨て手袋は、洗えば他の利用者のケアにも繰り返し使用できる。","en":"Disposable gloves can be washed and reused for other users.","jaRuby":"介護職員《かいごしょくいん》が一度装着《いちどそうちゃく》した使《つか》い捨《す》て手袋《てぶくろ》は、洗《あら》えば他《ほか》の利用者《りようしゃ》のケアにも繰《く》り返《かえ》し使用《しよう》できる。"},{"ja":"すべての利用者の血液、体液、分泌物（たんなど）、排泄物、傷のある皮膚・粘膜は、感染の可能性があるものとして取り扱う。","en":"Treat every user's blood, body fluids, secretions (such as phlegm), excretions, damaged skin and mucous membranes as possibly infectious.","jaRuby":"すべての利用者《りようしゃ》の血液《けつえき》、体液《たいえき》、分泌物《ぶんぴつぶつ》（たんなど）、排泄物《はいせつぶつ》、傷《きず》のある皮膚《ひふ》・粘膜《ねんまく》は、感染《かんせん》の可能性《かのうせい》があるものとして取《と》り扱《あつか》う。"},{"ja":"血液や体液に触れる可能性がない場合でも、常に防護服とゴーグルを着用しなければならない。","en":"Always wear protective clothing and goggles, even when there is no chance of touching blood or body fluids.","jaRuby":"血液《けつえき》や体液《たいえき》に触《ふ》れる可能性《かのうせい》がない場合《ばあい》でも、常《つね》に防護服《ぼうごふく》とゴーグルを着用《ちゃくよう》しなければならない。"}],"answer":4,"expJa":"スタンダード・プリコーション（標準予防策）では、感染症の有無にかかわらず、すべての人の血液、体液、分泌物、排泄物、創傷皮膚、粘膜などを感染の可能性があるものとして取り扱う。","expEn":"In standard precautions, whether or not someone has an infection, everyone's blood, body fluids, secretions, excretions, wounded skin and mucous membranes are treated as possibly infectious.","jaRuby":"「スタンダード・プリコーション（標準予防策《ひょうじゅんよぼうさく》）」の基本的《きほんてき》な考《かんが》え方《かた》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"スタンダード・プリコーション（標準予防策《ひょうじゅんよぼうさく》）では、感染症《かんせんしょう》の有無《うむ》にかかわらず、すべての人《ひと》の血液《けつえき》、体液《たいえき》、分泌物《ぶんぴつぶつ》、排泄物《はいせつぶつ》、創傷皮膚《そうしょうひふ》、粘膜《ねんまく》などを感染《かんせん》の可能性《かのうせい》があるものとして取《と》り扱《あつか》う。"},{"id":"MC22","no":22,"chapter":"mc4","ja":"手指衛生（手洗いおよびアルコール手指消毒）に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about hand hygiene (handwashing and alcohol hand rub) is most appropriate?","options":[{"ja":"ノロウイルス感染症が疑われる利用者のケア後は、速乾性アルコール手指消毒薬のみで消毒すれば十分である。","en":"After caring for a user with suspected norovirus, a quick-drying alcohol hand rub alone is enough.","jaRuby":"ノロウイルス感染症《かんせんしょう》が疑《うたが》われる利用者《りようしゃ》のケア後《あと》は、速乾性《そっかんせい》アルコール手指消毒薬《しゅししょうどくやく》のみで消毒《しょうどく》すれば十分《じゅうぶん》である。"},{"ja":"使い捨て手袋を着用してケアを行った場合は、手袋を外した後の手洗いは不要である。","en":"If you wore disposable gloves, you do not need to wash your hands after taking them off.","jaRuby":"使《つか》い捨《す》て手袋《てぶくろ》を着用《ちゃくよう》してケアを行《おこな》った場合《ばあい》は、手袋《てぶくろ》を外《はず》した後《あと》の手洗《てあら》いは不要《ふよう》である。"},{"ja":"手洗いの際、指先や爪の間、親指の周り、手首は汚れがつきにくいため洗わなくてよい。","en":"Fingertips, between the nails, around the thumbs and wrists do not get dirty, so you do not need to wash them.","jaRuby":"手洗《てあら》いの際《さい》、指先《ゆびさき》や爪《つめ》の間《あいだ》、親指《おやゆび》の周《まわ》り、手首《てくび》は汚《よご》れがつきにくいため洗《あら》わなくてよい。"},{"ja":"流水で手を洗った後は、職員全員で共用している布タオルで手を拭くのが最も衛生的である。","en":"After washing, drying hands with a cloth towel shared by all staff is the most hygienic.","jaRuby":"流水《りゅうすい》で手《て》を洗《あら》った後《あと》は、職員全員《しょくいんぜんいん》で共用《きょうよう》している布《ぬの》タオルで手《て》を拭《ふ》くのが最《もっと》も衛生的《えいせいてき》である。"},{"ja":"目に見える汚れ（血液や排泄物など）が手に付着している場合は、流水と石けんによる手洗いを行う。","en":"If there is visible dirt (blood, excretions, etc.) on the hands, wash with running water and soap.","jaRuby":"目《め》に見《み》える汚《よご》れ（血液《けつえき》や排泄物《はいせつぶつ》など）が手《て》に付着《ふちゃく》している場合《ばあい》は、流水《りゅうすい》と石《せっ》けんによる手洗《てあら》いを行《おこな》う。"}],"answer":5,"expJa":"目に見える汚れがある場合や、ノロウイルス（アルコールが効きにくい）などが疑われる場合は、流水と石けんによる手洗いを行う。手袋を外した後も必ず手指衛生を行い、ペーパータオルを使用する。","expEn":"If there is visible dirt, or if norovirus (alcohol does not work well against it) is suspected, wash with running water and soap. Always clean your hands after removing gloves, and use paper towels.","jaRuby":"手指衛生《しゅしえいせい》（手洗《てあら》いおよびアルコール手指消毒《しゅししょうどく》）に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"目《め》に見《み》える汚《よご》れがある場合《ばあい》や、ノロウイルス（アルコールが効《き》きにくい）などが疑《うたが》われる場合《ばあい》は、流水《りゅうすい》と石《せっ》けんによる手洗《てあら》いを行《おこな》う。手袋《てぶくろ》を外《はず》した後《あと》も必《かなら》ず手指衛生《しゅしえいせい》を行《おこな》い、ペーパータオルを使用《しよう》する。"},{"id":"MC23","no":23,"chapter":"mc4","ja":"個人防護具（PPE：手袋、エプロンなど）の着脱に関する留意点として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate point about putting on and taking off personal protective equipment (PPE: gloves, aprons, etc.)?","options":[{"ja":"ケアの途中で電話が鳴った場合、汚れた手袋をつけたまま受話器を取って対応する。","en":"If the phone rings during care, answer it with your dirty gloves on.","jaRuby":"ケアの途中《とちゅう》で電話《でんわ》が鳴《な》った場合《ばあい》、汚《よご》れた手袋《てぶくろ》をつけたまま受話器《じゅわき》を取《と》って対応《たいおう》する。"},{"ja":"使用後の手袋を外す際は、汚染された外側が素手に触れないように裏返しながら外す。","en":"When removing used gloves, turn them inside out so the dirty outside does not touch your bare hands.","jaRuby":"使用後《しようご》の手袋《てぶくろ》を外《はず》す際《さい》は、汚染《おせん》された外側《そとがわ》が素手《すで》に触《ふ》れないように裏返《うらがえ》しながら外《はず》す。"},{"ja":"プラスチックエプロンを脱ぐ際は、汚染されている外側の面を表にしてたたむ。","en":"When taking off a plastic apron, fold it with the dirty outside facing out.","jaRuby":"プラスチックエプロンを脱《ぬ》ぐ際《さい》は、汚染《おせん》されている外側《そとがわ》の面《めん》を表《あらわ》にしてたたむ。"},{"ja":"マスクを外す際は、フィルター部分の表面を素手でしっかりつかんで外す。","en":"When removing a mask, firmly hold the front of the filter with your bare hand.","jaRuby":"マスクを外《はず》す際《さい》は、フィルター部分《ぶぶん》の表面《ひょうめん》を素手《すで》でしっかりつかんで外《はず》す。"},{"ja":"吸引に使用した手袋は、ポケットに入れておき次回の吸引時に再利用する。","en":"Keep gloves used for suctioning in your pocket and reuse them next time.","jaRuby":"吸引《きゅういん》に使用《しよう》した手袋《てぶくろ》は、ポケットに入《い》れておき次回《じかい》の吸引時《きゅういんじ》に再利用《さいりよう》する。"}],"answer":2,"expJa":"使用後の手袋やエプロンは外側が汚染されているため、素手や衣服に触れないよう内側を表にして裏返しながら外し、使用後は1ケアごとに廃棄する。","expEn":"The outside of used gloves and aprons is dirty, so remove them by turning them inside out so they do not touch your hands or clothes. Throw them away after each care.","jaRuby":"個人防護具《こじんぼうごぐ》（PPE：手袋《てぶくろ》、エプロンなど）の着脱《ちゃくだつ》に関《かん》する留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"使用後《しようご》の手袋《てぶくろ》やエプロンは外側《そとがわ》が汚染《おせん》されているため、素手《すで》や衣服《いふく》に触《ふ》れないよう内側《うちがわ》を表《あらわ》にして裏返《うらがえ》しながら外《はず》し、使用後《しようご》は1ケアごとに廃棄《はいき》する。"},{"id":"MC24","no":24,"chapter":"mc4","ja":"主要な「感染経路」と「原因となる代表的な病原体・疾患」の組み合わせとして、最も適切なものを1つ選びなさい。","en":"Which pair of a main “route of infection” and typical pathogens/diseases is most appropriate?","options":[{"ja":"空気感染 ―― 結核菌、麻しんウイルス、水痘（みずぼうそう）ウイルス","en":"Airborne infection – tuberculosis, measles virus, chickenpox (varicella) virus","jaRuby":"空気感染《くうきかんせん》 ―― 結核菌《けっかくきん》、麻《ま》しんウイルス、水痘《すいとう》（みずぼうそう）ウイルス"},{"ja":"飛沫感染 ―― メチシリン耐性黄色ブドウ球菌（MRSA）、緑膿菌","en":"Droplet infection – MRSA, Pseudomonas aeruginosa","jaRuby":"飛沫感染《ひまつかんせん》 ―― メチシリン耐性黄色《たいせいおうしょく》ブドウ球菌《きゅうきん》（MRSA）、緑膿菌《りょくのうきん》"},{"ja":"接触感染 ―― インフルエンザウイルス（空気中を長時間漂うことによる感染）","en":"Contact infection – influenza virus (infection by floating in the air for a long time)","jaRuby":"接触感染《せっしょくかんせん》 ―― インフルエンザウイルス（空気中《くうきちゅう》を長時間漂《ちょうじかんただよ》うことによる感染《かんせん》）"},{"ja":"空気感染 ―― ノロウイルス（乾燥する前の嘔吐物に直接触れることによる感染）","en":"Airborne infection – norovirus (infection by touching vomit before it dries)","jaRuby":"空気感染《くうきかんせん》 ―― ノロウイルス（乾燥《かんそう》する前《まえ》の嘔吐物《おうとぶつ》に直接触《ちょくせつふ》れることによる感染《かんせん》）"},{"ja":"飛沫感染 ―― B型肝炎ウイルス、ヒト免疫不全ウイルス（HIV）","en":"Droplet infection – hepatitis B virus, HIV","jaRuby":"飛沫感染《ひまつかんせん》 ―― B型肝炎《がたかんえん》ウイルス、ヒト免疫不全《めんえきふぜん》ウイルス（HIV）"}],"answer":1,"expJa":"空気感染（飛沫核感染）する代表的な病原体は、結核菌、麻しんウイルス、水痘ウイルスである。MRSAや緑膿菌、ノロウイルスは主に接触感染（ノロは飛沫等もあり）、インフルエンザは主に飛沫感染である。","expEn":"Typical pathogens of airborne infection are tuberculosis, measles virus and chickenpox virus. MRSA, Pseudomonas and norovirus spread mainly by contact (norovirus also by droplets etc.), and influenza mainly by droplets.","jaRuby":"主要《しゅよう》な「感染経路《かんせんけいろ》」と「原因《げんいん》となる代表的《だいひょうてき》な病原体《びょうげんたい》・疾患《しっかん》」の組《く》み合《あ》わせとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"空気感染《くうきかんせん》（飛沫核感染《ひまつかくかんせん》）する代表的《だいひょうてき》な病原体《びょうげんたい》は、結核菌《けっかくきん》、麻《ま》しんウイルス、水痘《すいとう》ウイルスである。MRSAや緑膿菌《りょくのうきん》、ノロウイルスは主《おも》に接触感染《せっしょくかんせん》（ノロは飛沫等《ひまつとう》もあり）、インフルエンザは主《おも》に飛沫感染《ひまつかんせん》である。"},{"id":"MC25","no":25,"chapter":"mc4","ja":"療養環境の清潔やリネン類の取り扱いに関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about keeping the care environment clean and handling linens is most appropriate?","options":[{"ja":"血液や嘔吐物が付着したシーツは、乾燥して病原体が舞い散るのを防ぐため、すぐに振り払ってほこりを落とす。","en":"Sheets with blood or vomit on them should be shaken out right away to remove dust before they dry.","jaRuby":"血液《けつえき》や嘔吐物《おうとぶつ》が付着《ふちゃく》したシーツは、乾燥《かんそう》して病原体《びょうげんたい》が舞《ま》い散《ち》るのを防《ふせ》ぐため、すぐに振《ふ》り払《はら》ってほこりを落《お》とす。"},{"ja":"居室の掃除は、ほこりを部屋全体に広げるために、常に換気扇を止め、窓を閉め切って行う。","en":"When cleaning a room, always turn off the fan and close the windows to spread dust around the room.","jaRuby":"居室《きょしつ》の掃除《そうじ》は、ほこりを部屋全体《へやぜんたい》に広《ひろ》げるために、常《つね》に換気扇《かんきせん》を止《と》め、窓《まど》を閉《と》め切《き》って行《おこな》う。"},{"ja":"嘔吐物や排泄物で汚染されたリネン類や床の消毒には、次亜塩素酸ナトリウム（塩素系漂白剤など）が有効である。","en":"Sodium hypochlorite (chlorine bleach etc.) is effective for disinfecting linens and floors soiled with vomit or excretions.","jaRuby":"嘔吐物《おうとぶつ》や排泄物《はいせつぶつ》で汚染《おせん》されたリネン類《るい》や床《ゆか》の消毒《しょうどく》には、次亜塩素酸《じあえんそさん》ナトリウム（塩素系漂白剤《えんそけいひょうはくざい》など）が有効《ゆうこう》である。"},{"ja":"洗面所や浴室などの水回りは、常に湿った状態にしておくことで緑膿菌の繁殖を防げる。","en":"Keeping sinks and bathrooms always wet prevents Pseudomonas from growing.","jaRuby":"洗面所《せんめんじょ》や浴室《よくしつ》などの水回《みずまわ》りは、常《つね》に湿《しめ》った状態《じょうたい》にしておくことで緑膿菌《りょくのうきん》の繁殖《はんしょく》を防《ふせ》げる。"},{"ja":"感染性廃棄物（血液のついたガーゼなど）は、一般の燃えるゴミと混ぜて素手で押し込んで捨てる。","en":"Infectious waste (e.g. gauze with blood) is mixed with normal burnable garbage and pushed in with bare hands.","jaRuby":"感染性廃棄物《かんせんせいはいきぶつ》（血液《けつえき》のついたガーゼなど）は、一般《いっぱん》の燃《も》えるゴミと混《ま》ぜて素手《すで》で押《お》し込《こ》んで捨《す》てる。"}],"answer":3,"expJa":"嘔吐物や排泄物で汚染された箇所の消毒には次亜塩素酸ナトリウムが有効である。汚染されたリネンを振り払うと病原体が周囲に飛び散るため、静かにまとめる。","expEn":"Sodium hypochlorite is effective for disinfecting places soiled with vomit or excretions. Shaking dirty linens spreads pathogens, so fold them up gently.","jaRuby":"療養環境《りょうようかんきょう》の清潔《せいけつ》やリネン類《るい》の取《と》り扱《あつか》いに関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"嘔吐物《おうとぶつ》や排泄物《はいせつぶつ》で汚染《おせん》された箇所《かしょ》の消毒《しょうどく》には次亜塩素酸《じあえんそさん》ナトリウムが有効《ゆうこう》である。汚染《おせん》されたリネンを振《ふ》り払《はら》うと病原体《びょうげんたい》が周囲《しゅうい》に飛《と》び散《ち》るため、静《しず》かにまとめる。"},{"id":"MC26","no":26,"chapter":"mc4","ja":"「洗浄」「消毒」「滅菌」の用語の意味として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate meaning of “cleaning”, “disinfection” and “sterilization”?","options":[{"ja":"洗浄とは、すべての微生物やウイルスを化学薬品によって完全に死滅させることである。","en":"Cleaning means completely killing all microbes and viruses with chemicals.","jaRuby":"洗浄《せんじょう》とは、すべての微生物《びせいぶつ》やウイルスを化学薬品《かがくやくひん》によって完全《かんぜん》に死滅《しめつ》させることである。"},{"ja":"滅菌とは、水や洗剤を使って目に見える汚れを洗い流すことである。","en":"Sterilization means washing off visible dirt with water and detergent.","jaRuby":"滅菌《めっきん》とは、水《みず》や洗剤《せんざい》を使《つか》って目《め》に見《み》える汚《よご》れを洗《あら》い流《なが》すことである。"},{"ja":"消毒とは、対象物に付着している病原性のある微生物を、害のない程度まで減らす（または感染力をなくす）ことである。","en":"Disinfection means reducing harmful microbes on an object to a harmless level (or making them unable to infect).","jaRuby":"消毒《しょうどく》とは、対象物《たいしょうぶつ》に付着《ふちゃく》している病原性《びょうげんせい》のある微生物《びせいぶつ》を、害《がい》のない程度《ていど》まで減《へ》らす（または感染力《かんせんりょく》をなくす）ことである。"},{"ja":"消毒を行えば、事前に汚れを洗い流す「洗浄」の工程は一切不要になる。","en":"If you disinfect, you never need to clean (wash off dirt) beforehand.","jaRuby":"消毒《しょうどく》を行《おこな》えば、事前《じぜん》に汚《よご》れを洗《あら》い流《なが》す「洗浄《せんじょう》」の工程《こうてい》は一切不要《いっさいふよう》になる。"},{"ja":"滅菌された物品は、開封して素手で触れた後でも「滅菌状態」が永久に保たれる。","en":"A sterilized item stays sterile forever, even after it is opened and touched with bare hands.","jaRuby":"滅菌《めっきん》された物品《ぶっぴん》は、開封《かいふう》して素手《すで》で触《ふ》れた後《あと》でも「滅菌状態《めっきんじょうたい》」が永久《えいきゅう》に保《たも》たれる。"}],"answer":3,"expJa":"「洗浄」は汚れを洗い流すこと、「消毒」は病原微生物を害のない程度まで減らす（不活化する）こと、「滅菌」はすべての微生物を完全に死滅・除去することである。消毒の前には十分な洗浄が必要である。","expEn":"“Cleaning” = washing off dirt. “Disinfection” = reducing pathogens to a harmless level (inactivating them). “Sterilization” = completely killing/removing all microbes. Good cleaning is needed before disinfection.","jaRuby":"「洗浄《せんじょう》」「消毒《しょうどく》」「滅菌《めっきん》」の用語《ようご》の意味《いみ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"「洗浄《せんじょう》」は汚《よご》れを洗《あら》い流《なが》すこと、「消毒《しょうどく》」は病原微生物《びょうげんびせいぶつ》を害《がい》のない程度《ていど》まで減《へ》らす（不活化《ふかつか》する）こと、「滅菌《めっきん》」はすべての微生物《びせいぶつ》を完全《かんぜん》に死滅《しめつ》・除去《じょきょ》することである。消毒《しょうどく》の前《まえ》には十分《じゅうぶん》な洗浄《せんじょう》が必要《ひつよう》である。"},{"id":"MC27","no":27,"chapter":"mc4","ja":"介護職員自身の感染予防と健康管理に関する記述として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about care workers' own infection prevention and health care?","options":[{"ja":"手荒れや小さな傷があると、そこに病原体が定着しやすいため、ハンドケアで皮膚を保護することが大切である。","en":"Rough or cracked hands make it easier for pathogens to stay, so protecting the skin with hand care is important.","jaRuby":"手荒《てあ》れや小《ちい》さな傷《きず》があると、そこに病原体《びょうげんたい》が定着《ていちゃく》しやすいため、ハンドケアで皮膚《ひふ》を保護《ほご》することが大切《たいせつ》である。"},{"ja":"介護職員に発熱や激しい下痢、嘔吐などの症状がある場合でも、利用者のケアは通常通り行うべきである。","en":"Even if a care worker has fever, severe diarrhea or vomiting, they should give care to users as usual.","jaRuby":"介護職員《かいごしょくいん》に発熱《はつねつ》や激《はげ》しい下痢《げり》、嘔吐《おうと》などの症状《しょうじょう》がある場合《ばあい》でも、利用者《りようしゃ》のケアは通常通《つうじょうどお》り行《おこな》うべきである。"},{"ja":"ワクチン（予防接種）は、一度接種すればすべての感染症を100パーセント一生涯予防できる。","en":"A vaccine given once prevents all infections 100% for life.","jaRuby":"ワクチン（予防接種《よぼうせっしゅ》）は、一度接種《いちどせっしゅ》すればすべての感染症《かんせんしょう》を100パーセント一生涯予防《いっしょうがいよぼう》できる。"},{"ja":"入職時の健康診断さえ受けていれば、その後の定期健康診断を受ける必要はない。","en":"If you had a health check when you joined, you do not need regular health checks after that.","jaRuby":"入職時《にゅうしょくじ》の健康診断《けんこうしんだん》さえ受《う》けていれば、その後《あと》の定期健康診断《ていきけんこうしんだん》を受《う》ける必要《ひつよう》はない。"},{"ja":"睡眠不足や過労は免疫力とは無関係であるため、体調管理を意識する必要はない。","en":"Lack of sleep and overwork have nothing to do with immunity, so you do not need to think about your health.","jaRuby":"睡眠不足《すいみんぶそく》や過労《かろう》は免疫力《めんえきりょく》とは無関係《むかんけい》であるため、体調管理《たいちょうかんり》を意識《いしき》する必要《ひつよう》はない。"}],"answer":1,"expJa":"手荒れがあると皮膚のバリア機能が低下し、黄色ブドウ球菌などが定着しやすくなるため、ハンドクリーム等による保湿ケアも感染予防に重要である。職員自身に感染症状がある場合は管理者に報告し、就業制限等の指示に従う。","expEn":"Rough hands weaken the skin's barrier, so bacteria like Staphylococcus aureus stay more easily. Moisturizing with hand cream also helps prevent infection. If staff have infection symptoms, report to the manager and follow instructions such as work restrictions.","jaRuby":"介護職員自身《かいごしょくいんじしん》の感染予防《かんせんよぼう》と健康管理《けんこうかんり》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"手荒《てあ》れがあると皮膚《ひふ》のバリア機能《きのう》が低下《ていか》し、黄色《おうしょく》ブドウ球菌《きゅうきん》などが定着《ていちゃく》しやすくなるため、ハンドクリーム等《とう》による保湿《ほしつ》ケアも感染予防《かんせんよぼう》に重要《じゅうよう》である。職員自身《しょくいんじしん》に感染症状《かんせんしょうじょう》がある場合《ばあい》は管理者《かんりしゃ》に報告《ほうこく》し、就業制限等《しゅうぎょうせいげんとう》の指示《しじ》に従《したが》う。"},{"id":"MC28","no":28,"chapter":"mc5","ja":"世界保健機関（WHO）憲章における「健康」の定義に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about the definition of “health” in the WHO (World Health Organization) Constitution is most appropriate?","options":[{"ja":"健康とは、単に病気でないとか、弱っていないということだけを指す。","en":"Health only means not being sick or weak.","jaRuby":"健康《けんこう》とは、単《たん》に病気《びょうき》でないとか、弱《よわ》っていないということだけを指《さ》す。"},{"ja":"健康とは、身体的、精神的、および社会的に完全に良好な状態にあることをいう。","en":"Health is a state of complete physical, mental and social well-being.","jaRuby":"健康《けんこう》とは、身体的《しんたいてき》、精神的《せいしんてき》、および社会的《しゃかいてき》に完全《かんぜん》に良好《りょうこう》な状態《じょうたい》にあることをいう。"},{"ja":"障害や慢性疾患を持っている人は、いかなる場合も健康とは呼べない。","en":"People with disabilities or chronic diseases can never be called healthy.","jaRuby":"障害《しょうがい》や慢性疾患《まんせいしっかん》を持《も》っている人《ひと》は、いかなる場合《ばあい》も健康《けんこう》とは呼《よ》べない。"},{"ja":"高齢になって身体機能が低下することは、すべて異常な「病気」として扱われる。","en":"Any decline in body function with age is treated as an abnormal “disease”.","jaRuby":"高齢《こうれい》になって身体機能《しんたいきのう》が低下《ていか》することは、すべて異常《いじょう》な「病気《びょうき》」として扱《あつか》われる。"},{"ja":"健康状態は血液検査の数値のみで決まり、本人の主観や生活の満足度は関係ない。","en":"Health is decided only by blood test numbers; the person's feelings and life satisfaction do not matter.","jaRuby":"健康状態《けんこうじょうたい》は血液検査《けつえきけんさ》の数値《すうち》のみで決《き》まり、本人《ほんにん》の主観《しゅかん》や生活《せいかつ》の満足度《まんぞくど》は関係《かんけい》ない。"}],"answer":2,"expJa":"WHO憲章では「健康とは、身体的、精神的および社会的に完全に良好な状態であり、単に疾病または病弱の存在しないことではない」と定義されている。","expEn":"The WHO Constitution says: “Health is a state of complete physical, mental and social well-being and not merely the absence of disease or infirmity.”","jaRuby":"世界保健機関《せかいほけんきかん》（WHO）憲章《けんしょう》における「健康《けんこう》」の定義《ていぎ》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"WHO憲章《けんしょう》では「健康《けんこう》とは、身体的《しんたいてき》、精神的《せいしんてき》および社会的《しゃかいてき》に完全《かんぜん》に良好《りょうこう》な状態《じょうたい》であり、単《たん》に疾病《しっぺい》または病弱《びょうじゃく》の存在《そんざい》しないことではない」と定義《ていぎ》されている。"},{"id":"MC29","no":29,"chapter":"mc5","ja":"利用者の健康状態を観察する際の基本姿勢や「健康度『5快』」に関する記述として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about the basic attitude when observing a user's health and the “5 comforts (5-kai)”?","options":[{"ja":"利用者の状態は、全国一律の平均値と比較するだけでよく、その人自身の「平常状態（普段の姿）」を知る必要はない。","en":"Just compare the user with the national average; you do not need to know the person's own “normal state”.","jaRuby":"利用者《りようしゃ》の状態《じょうたい》は、全国一律《ぜんこくいちりつ》の平均値《へいきんち》と比較《ひかく》するだけでよく、その人自身《ひとじしん》の「平常状態《へいじょうじょうたい》（普段《ふだん》の姿《すがた》）」を知《し》る必要《ひつよう》はない。"},{"ja":"意欲や表情（顔貌）、顔色、食欲などは主観的なものであるため、観察項目から除外する。","en":"Motivation, facial expression, face color and appetite are subjective, so do not include them in observation.","jaRuby":"意欲《いよく》や表情《ひょうじょう》（顔貌《がんぼう》）、顔色《かおいろ》、食欲《しょくよく》などは主観的《しゅかんてき》なものであるため、観察項目《かんさつこうもく》から除外《じょがい》する。"},{"ja":"観察は医療的ケアを実施する前だけに行えばよく、実施中や実施後は観察しなくてよい。","en":"Observe only before medical care; no need to observe during or after it.","jaRuby":"観察《かんさつ》は医療的《いりょうてき》ケアを実施《じっし》する前《まえ》だけに行《おこな》えばよく、実施中《じっしちゅう》や実施後《じっしご》は観察《かんさつ》しなくてよい。"},{"ja":"健康度を知る目安である「5快」とは、快食・快眠・快便・快尿・快動（または快汗等を含む日常生活の快調さ）を指す。","en":"The “5 comforts” as a guide to health are: eating well, sleeping well, good bowel movements, good urination, and moving well (or good daily condition including sweating etc.).","jaRuby":"健康度《けんこうど》を知《し》る目安《めやす》である「5快《かい》」とは、快食《かいしょく》・快眠《かいみん》・快便《かいべん》・快尿《かいにょう》・快動《かいどう》（または快汗等《かいかんとう》を含《ふく》む日常生活《にちじょうせいかつ》の快調《かいちょう》さ）を指《さ》す。"},{"ja":"利用者が「どこも悪くない」と言った場合は、顔色が青白くてもバイタルサインの測定は行わない。","en":"If the user says “nothing is wrong,” do not measure vital signs even if their face is pale.","jaRuby":"利用者《りようしゃ》が「どこも悪《わる》くない」と言《い》った場合《ばあい》は、顔色《かおいろ》が青白《あおじろ》くてもバイタルサインの測定《そくてい》は行《おこな》わない。"}],"answer":4,"expJa":"利用者の健康状態を把握するには、普段の状態（平常状態）を知り、快食・快眠・快便・快尿・快動といった「5快」や、意欲・表情・顔色・食欲・行動などの変化を総合的に観察することが大切である。","expEn":"To understand a user's health, know their normal state and look at the whole picture: the “5 comforts” (eating, sleeping, bowels, urination, movement) and changes in motivation, expression, face color, appetite and behavior.","jaRuby":"利用者《りようしゃ》の健康状態《けんこうじょうたい》を観察《かんさつ》する際《さい》の基本姿勢《きほんしせい》や「健康度《けんこうど》『5快《かい》』」に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"利用者《りようしゃ》の健康状態《けんこうじょうたい》を把握《はあく》するには、普段《ふだん》の状態《じょうたい》（平常状態《へいじょうじょうたい》）を知《し》り、快食《かいしょく》・快眠《かいみん》・快便《かいべん》・快尿《かいにょう》・快動《かいどう》といった「5快《かい》」や、意欲《いよく》・表情《ひょうじょう》・顔色《かおいろ》・食欲《しょくよく》・行動《こうどう》などの変化《へんか》を総合的《そうごうてき》に観察《かんさつ》することが大切《たいせつ》である。"},{"id":"MC30","no":30,"chapter":"mc5","ja":"バイタルサイン（生命徴候）の1つである「体温」の特徴や測定時の留意点として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about “body temperature”, one of the vital signs, and points for measuring it?","options":[{"ja":"人間の体温は1日の中で変動（日内変動）があり、一般に早朝が最も低く、夕方にかけて高くなる。","en":"Body temperature changes during the day (daily variation); it is usually lowest early in the morning and higher toward evening.","jaRuby":"人間《にんげん》の体温《たいおん》は1日《にち》の中《なか》で変動《へんどう》（日内変動《にちないへんどう》）があり、一般《いっぱん》に早朝《そうちょう》が最《もっと》も低《ひく》く、夕方《ゆうがた》にかけて高《たか》くなる。"},{"ja":"高齢者は若年者に比べて基礎代謝が高いため、常に体温が高く発熱しやすい。","en":"Older people have a higher basal metabolism than young people, so their temperature is always high and they get fevers easily.","jaRuby":"高齢者《こうれいしゃ》は若年者《じゃくねんしゃ》に比《くら》べて基礎代謝《きそたいしゃ》が高《たか》いため、常《つね》に体温《たいおん》が高《たか》く発熱《はつねつ》しやすい。"},{"ja":"腋下（わきの下）で体温を測定する際は、汗を拭かずに濡れたまま体温計を挟むと正確に測れる。","en":"When measuring under the arm, you get an accurate result if you do not wipe off sweat.","jaRuby":"腋下《えきか》（わきの下《した》）で体温《たいおん》を測定《そくてい》する際《さい》は、汗《あせ》を拭《ふ》かずに濡《ぬ》れたまま体温計《たいおんけい》を挟《はさ》むと正確《せいかく》に測《はか》れる。"},{"ja":"麻痺（まひ）がある利用者の体温を測る際は、必ず麻痺側（患側）のわきの下で測定する。","en":"For a user with paralysis, always measure under the arm on the paralyzed (affected) side.","jaRuby":"麻痺《まひ》がある利用者《りようしゃ》の体温《たいおん》を測《はか》る際《さい》は、必《かなら》ず麻痺側《まひがわ》（患側《かんそく》）のわきの下《した》で測定《そくてい》する。"},{"ja":"運動直後や入浴直後は体温が最も安定しているため、検温に最適なタイミングである。","en":"Right after exercise or a bath, body temperature is most stable, so it is the best time to measure.","jaRuby":"運動直後《うんどうちょくご》や入浴直後《にゅうよくちょくご》は体温《たいおん》が最《もっと》も安定《あんてい》しているため、検温《けんおん》に最適《さいてき》なタイミングである。"}],"answer":1,"expJa":"体温には日内変動があり、一般に早朝が最も低く、午後から夕方にかけて高くなる。腋下の汗は拭き取ってから測定し、麻痺がある場合は健側で測定する。","expEn":"Body temperature changes during the day: usually lowest early in the morning and higher from afternoon to evening. Wipe sweat under the arm before measuring. If there is paralysis, measure on the healthy side.","jaRuby":"バイタルサイン（生命徴候《せいめいちょうこう》）の1つである「体温《たいおん》」の特徴《とくちょう》や測定時《そくていじ》の留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"体温《たいおん》には日内変動《にちないへんどう》があり、一般《いっぱん》に早朝《そうちょう》が最《もっと》も低《ひく》く、午後《ごご》から夕方《ゆうがた》にかけて高《たか》くなる。腋下《えきか》の汗《あせ》は拭《ふ》き取《と》ってから測定《そくてい》し、麻痺《まひ》がある場合《ばあい》は健側《けんそく》で測定《そくてい》する。"},{"id":"MC31","no":31,"chapter":"mc5","ja":"「脈拍」および「血圧」に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about “pulse” and “blood pressure” is most appropriate?","options":[{"ja":"成人の安静時の正常な脈拍数は、1分間に約150〜180回である。","en":"A normal resting pulse for adults is about 150–180 beats per minute.","jaRuby":"成人《せいじん》の安静時《あんせいじ》の正常《せいじょう》な脈拍数《みゃくはくすう》は、1分間《ふんかん》に約《やく》150〜180回《かい》である。"},{"ja":"脈拍が1分間に100回以上に増えた状態を「徐脈（じょみゃく）」という。","en":"A pulse of 100 or more per minute is called “bradycardia (slow pulse)”.","jaRuby":"脈拍《みゃくはく》が1分間《ふんかん》に100回以上《かいいじょう》に増《ふ》えた状態《じょうたい》を「徐脈《じょみゃく》」という。"},{"ja":"血圧測定の際、マンシェット（腕帯）は厚手のセーターの上からきつく巻き付ける。","en":"When measuring blood pressure, wrap the cuff tightly over a thick sweater.","jaRuby":"血圧測定《けつあつそくてい》の際《さい》、マンシェット（腕帯《わんたい》）は厚手《あつで》のセーターの上《うえ》からきつく巻《ま》き付《つ》ける。"},{"ja":"入浴中や排便時のいきみは、血圧を大幅に低下させるため安全である。","en":"Bathing and straining during bowel movements greatly lower blood pressure, so they are safe.","jaRuby":"入浴中《にゅうよくちゅう》や排便時《はいべんじ》のいきみは、血圧《けつあつ》を大幅《おおはば》に低下《ていか》させるため安全《あんぜん》である。"},{"ja":"血圧とは、心臓から送り出された血液が血管（動脈）の壁を押す圧力のことであり、心臓が収縮したときの血圧を「収縮期血圧（最高血圧）」という。","en":"Blood pressure is the pressure of blood pushed out from the heart against the artery walls; the pressure when the heart contracts is called “systolic blood pressure (highest pressure)”.","jaRuby":"血圧《けつあつ》とは、心臓《しんぞう》から送《おく》り出《で》された血液《けつえき》が血管《けっかん》（動脈《どうみゃく》）の壁《かべ》を押《お》す圧力《あつりょく》のことであり、心臓《しんぞう》が収縮《しゅうしゅく》したときの血圧《けつあつ》を「収縮期血圧《しゅうしゅくきけつあつ》（最高血圧《さいこうけつあつ》）」という。"}],"answer":5,"expJa":"心臓が収縮したときの血圧を収縮期血圧（最高血圧）、拡張したときの血圧を拡張期血圧（最低血圧）という。成人の安静時脈拍数は1分間に約60〜80回（100回以上は頻脈、60回未満は徐脈）である。","expEn":"Blood pressure when the heart contracts = systolic (highest) pressure; when it relaxes = diastolic (lowest) pressure. Adult resting pulse is about 60–80 per minute (100 or more = tachycardia, under 60 = bradycardia).","jaRuby":"「脈拍《みゃくはく》」および「血圧《けつあつ》」に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"心臓《しんぞう》が収縮《しゅうしゅく》したときの血圧《けつあつ》を収縮期血圧《しゅうしゅくきけつあつ》（最高血圧《さいこうけつあつ》）、拡張《かくちょう》したときの血圧《けつあつ》を拡張期血圧《かくちょうきけつあつ》（最低血圧《さいていけつあつ》）という。成人《せいじん》の安静時脈拍数《あんせいじみゃくはくすう》は1分間《ふんかん》に約《やく》60〜80回《かい》（100回以上《かいいじょう》は頻脈《ひんみゃく》、60回未満《かいみまん》は徐脈《じょみゃく》）である。"},{"id":"MC32","no":32,"chapter":"mc5","ja":"「呼吸」および「経皮的動脈血酸素飽和度（エスピーオーツー）」に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about “breathing” and “percutaneous arterial oxygen saturation (SpO2)” is most appropriate?","options":[{"ja":"成人の安静時の正常な呼吸数は、1分間に約40〜50回である。","en":"A normal resting breathing rate for adults is about 40–50 breaths per minute.","jaRuby":"成人《せいじん》の安静時《あんせいじ》の正常《せいじょう》な呼吸数《こきゅうすう》は、1分間《ふんかん》に約《やく》40〜50回《かい》である。"},{"ja":"呼吸数を測定する際は、利用者に「これから呼吸を測ります」と伝えて意識させながら測るのが良い。","en":"When counting breaths, it is good to tell the user “I will now count your breathing” so they are aware of it.","jaRuby":"呼吸数《こきゅうすう》を測定《そくてい》する際《さい》は、利用者《りようしゃ》に「これから呼吸《こきゅう》を測《はか》ります」と伝《つた》えて意識《いしき》させながら測《はか》るのが良《よ》い。"},{"ja":"パルスオキシメーターは、指先などに光を当てて動脈血中のヘモグロビンがどの程度酸素と結合しているかをパーセントで示す機器である。","en":"A pulse oximeter shines light on a fingertip etc. and shows in % how much hemoglobin in arterial blood is combined with oxygen.","jaRuby":"パルスオキシメーターは、指先《ゆびさき》などに光《ひかり》を当《あ》てて動脈血中《どうみゃくけっちゅう》のヘモグロビンがどの程度酸素《ていどさんそ》と結合《けつごう》しているかをパーセントで示《しめ》す機器《きき》である。"},{"ja":"パルスオキシメーターの測定値は、マニキュアの塗布や指先の冷え（末梢循環不全）があっても一切影響を受けない。","en":"Pulse oximeter readings are never affected by nail polish or cold fingers (poor circulation).","jaRuby":"パルスオキシメーターの測定値《そくていち》は、マニキュアの塗布《とふ》や指先《ゆびさき》の冷《ひ》え（末梢循環不全《まっしょうじゅんかんふぜん》）があっても一切影響《いっさいえいきょう》を受《う》けない。"},{"ja":"経皮的動脈血酸素飽和度の数値が70パーセントであれば、酸素が十分に足りている正常な状態と判断できる。","en":"An SpO2 of 70% means there is enough oxygen and it is normal.","jaRuby":"経皮的動脈血酸素飽和度《けいひてきどうみゃくけつさんそほうわど》の数値《すうち》が70パーセントであれば、酸素《さんそ》が十分《じゅうぶん》に足《た》りている正常《せいじょう》な状態《じょうたい》と判断《はんだん》できる。"}],"answer":3,"expJa":"パルスオキシメーターは経皮的動脈血酸素飽和度（標準値はおよそ96〜99パーセント程度）と脈拍数を測定する機器である。指先の冷え、マニキュア、体動などがあると正確に測定できないことがある。成人の安静時呼吸数は1分間に約12〜20回で、意識させないように測定する。","expEn":"A pulse oximeter measures SpO2 (normal about 96–99%) and pulse rate. Cold fingers, nail polish and body movement can make readings inaccurate. Adult resting breathing rate is about 12–20 per minute; count without the person noticing.","jaRuby":"「呼吸《こきゅう》」および「経皮的動脈血酸素飽和度《けいひてきどうみゃくけつさんそほうわど》（エスピーオーツー）」に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"パルスオキシメーターは経皮的動脈血酸素飽和度《けいひてきどうみゃくけつさんそほうわど》（標準値《ひょうじゅんち》はおよそ96〜99パーセント程度《ていど》）と脈拍数《みゃくはくすう》を測定《そくてい》する機器《きき》である。指先《ゆびさき》の冷《ひ》え、マニキュア、体動《たいどう》などがあると正確《せいかく》に測定《そくてい》できないことがある。成人《せいじん》の安静時呼吸数《あんせいじこきゅうすう》は1分間《ふんかん》に約《やく》12〜20回《かい》で、意識《いしき》させないように測定《そくてい》する。"},{"id":"MC33","no":33,"chapter":"mc5","ja":"意識レベルを評価する指標である「JCS（ジャパン・コーマ・スケール）」の分類に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about the JCS (Japan Coma Scale), a scale for level of consciousness, is most appropriate?","options":[{"ja":"1桁（1〜3）は、刺激しなくても覚醒している状態（1：だいたい意識清明だが、今ひとつはっきりしない、など）を表す。","en":"1 digit (1–3) means awake without stimulation (e.g. 1: mostly clear but not quite fully alert).","jaRuby":"1桁《けた》（1〜3）は、刺激《しげき》しなくても覚醒《かくせい》している状態《じょうたい》（1：だいたい意識清明《いしきせいめい》だが、今《いま》ひとつはっきりしない、など）を表《あらわ》す。"},{"ja":"2桁（10〜30）は、どんなに強い痛み刺激を与えても全く覚醒しない状態を表す。","en":"2 digits (10–30) means not awake at all no matter how strong the pain stimulus.","jaRuby":"2桁《けた》（10〜30）は、どんなに強《つよ》い痛《いた》み刺激《しげき》を与《あた》えても全《まった》く覚醒《かくせい》しない状態《じょうたい》を表《あらわ》す。"},{"ja":"3桁（100〜300）は、普通の呼びかけで容易に開眼する最も軽度な状態を表す。","en":"3 digits (100–300) is the mildest state, where the eyes open easily with a normal call.","jaRuby":"3桁《けた》（100〜300）は、普通《ふつう》の呼《よ》びかけで容易《ようい》に開眼《かいがん》する最《もっと》も軽度《けいど》な状態《じょうたい》を表《あらわ》す。"},{"ja":"JCSの数値が小さくなるほど、意識障害が重症であることを意味する。","en":"The smaller the JCS number, the more serious the disturbance of consciousness.","jaRuby":"JCSの数値《すうち》が小《ちい》さくなるほど、意識障害《いしきしょうがい》が重症《じゅうしょう》であることを意味《いみ》する。"},{"ja":"JCSは医師専用の指標であり、介護職員や看護職員が連絡・報告に用いることは禁止されている。","en":"JCS is only for doctors; care workers and nurses are banned from using it in reports.","jaRuby":"JCSは医師専用《いしせんよう》の指標《しひょう》であり、介護職員《かいごしょくいん》や看護職員《かんごしょくいん》が連絡《れんらく》・報告《ほうこく》に用《もち》いることは禁止《きんし》されている。"}],"answer":1,"expJa":"JCS（ジャパン・コーマ・スケール）は、1桁が「刺激しなくても覚醒している状態」、2桁が「刺激すると覚醒する状態」、3桁が「刺激しても覚醒しない状態」を表し、数値が大きいほど意識障害が重い。","expEn":"JCS: 1 digit = awake without stimulation; 2 digits = wakes when stimulated; 3 digits = does not wake even when stimulated. The bigger the number, the more serious the disturbance of consciousness.","jaRuby":"意識《いしき》レベルを評価《ひょうか》する指標《しひょう》である「JCS（ジャパン・コーマ・スケール）」の分類《ぶんるい》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"JCS（ジャパン・コーマ・スケール）は、1桁《けた》が「刺激《しげき》しなくても覚醒《かくせい》している状態《じょうたい》」、2桁《けた》が「刺激《しげき》すると覚醒《かくせい》する状態《じょうたい》」、3桁《けた》が「刺激《しげき》しても覚醒《かくせい》しない状態《じょうたい》」を表《あらわ》し、数値《すうち》が大《おお》きいほど意識障害《いしきしょうがい》が重《おも》い。"},{"id":"MC34","no":34,"chapter":"mc5","ja":"利用者の「急変状態」として、直ちに医療職への連絡や救急対応が必要となるサイン（症状）の組み合わせとして、最も適切なものを1つ選びなさい。","en":"Which set of signs (symptoms) shows a “sudden change” in a user that needs immediate contact with medical staff or emergency response?","options":[{"ja":"食後に少し眠そうにあくびをする ―― 入浴後に顔がほんのり赤くなる ―― 1日に1回の普通便が出る","en":"Yawning a little sleepily after a meal – face slightly red after a bath – one normal bowel movement a day","jaRuby":"食後《しょくご》に少《すこ》し眠《ねむ》そうにあくびをする ―― 入浴後《にゅうよくご》に顔《かお》がほんのり赤《あか》くなる ―― 1日《にち》に1回《かい》の普通便《ふつうべん》が出《で》る"},{"ja":"体温が36.5度である ―― 脈拍が1分間に70回で規則正しい ―― 笑顔で会話ができる","en":"Temperature 36.5°C – pulse 70 per minute and regular – talking with a smile","jaRuby":"体温《たいおん》が36.5度《ど》である ―― 脈拍《みゃくはく》が1分間《ふんかん》に70回《かい》で規則正《きそくただ》しい ―― 笑顔《えがお》で会話《かいわ》ができる"},{"ja":"唇や爪の色が紫色になる（チアノーゼ） ―― 呼びかけに対する反応が鈍い ―― 突然の激しい呼吸困難","en":"Lips and nails turn purple (cyanosis) – slow response when called – sudden severe difficulty breathing","jaRuby":"唇《くちびる》や爪《つめ》の色《いろ》が紫色《むらさきいろ》になる（チアノーゼ） ―― 呼《よ》びかけに対《たい》する反応《はんのう》が鈍《にぶ》い ―― 突然《とつぜん》の激《はげ》しい呼吸困難《こきゅうこんなん》"},{"ja":"夜間ぐっすり眠っている ―― 朝食を全量摂取した ―― 水分をコップ1杯飲んだ","en":"Sleeping well at night – ate all of breakfast – drank a cup of water","jaRuby":"夜間《やかん》ぐっすり眠《ねむ》っている ―― 朝食《ちょうしょく》を全量摂取《ぜんりょうせっしゅ》した ―― 水分《すいぶん》をコップ1杯飲《ぱいの》んだ"},{"ja":"居室の温度が22度である ―― テレビを見て笑っている ―― 手足が温かい","en":"Room temperature 22°C – laughing while watching TV – warm hands and feet","jaRuby":"居室《きょしつ》の温度《おんど》が22度《ど》である ―― テレビを見《み》て笑《わら》っている ―― 手足《てあし》が温《あたた》かい"}],"answer":3,"expJa":"チアノーゼの出現、意識レベルの低下、突然の呼吸困難などは生命に関わる急変のサインであり、直ちに医療職への連絡や救急対応が必要である。","expEn":"Cyanosis, lowered consciousness and sudden difficulty breathing are signs of a life-threatening change. Contact medical staff or start emergency response immediately.","jaRuby":"利用者《りようしゃ》の「急変状態《きゅうへんじょうたい》」として、直《ただ》ちに医療職《いりょうしょく》への連絡《れんらく》や救急対応《きゅうきゅうたいおう》が必要《ひつよう》となるサイン（症状《しょうじょう》）の組《く》み合《あ》わせとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"チアノーゼの出現《しゅつげん》、意識《いしき》レベルの低下《ていか》、突然《とつぜん》の呼吸困難《こきゅうこんなん》などは生命《せいめい》に関《かか》わる急変《きゅうへん》のサインであり、直《ただ》ちに医療職《いりょうしょく》への連絡《れんらく》や救急対応《きゅうきゅうたいおう》が必要《ひつよう》である。"},{"id":"MC35","no":35,"chapter":"mc5","ja":"利用者の急変時における介護職員の対応と事前準備として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate response and preparation by care workers for a sudden change in a user?","options":[{"ja":"急変を発見した際は、利用者を一人残してでも遠くの事務所まで走って報告に行く。","en":"When you find a sudden change, leave the user alone and run to the far office to report.","jaRuby":"急変《きゅうへん》を発見《はっけん》した際《さい》は、利用者《りようしゃ》を一人残《ひとりのこ》してでも遠《とお》くの事務所《じむしょ》まで走《はし》って報告《ほうこく》に行《い》く。"},{"ja":"緊急時の連絡先（主治医、訪問看護ステーション、家族など）は、事故が起きてから初めて調べるようにする。","en":"Look up emergency contacts (family doctor, home-visit nursing station, family) only after an accident happens.","jaRuby":"緊急時《きんきゅうじ》の連絡先《れんらくさき》（主治医《しゅじい》、訪問看護《ほうもんかんご》ステーション、家族《かぞく》など）は、事故《じこ》が起《お》きてから初《はじ》めて調《しら》べるようにする。"},{"ja":"急変時は動揺を防ぐため、バイタルサインの確認や発生時刻の記録は一切行わない。","en":"To avoid panic, do not check vital signs or record the time at all during a sudden change.","jaRuby":"急変時《きゅうへんじ》は動揺《どうよう》を防《ふせ》ぐため、バイタルサインの確認《かくにん》や発生時刻《はっせいじこく》の記録《きろく》は一切行《いっさいおこな》わない。"},{"ja":"嘔吐（おうと）している利用者は、吐物が気道に詰まらないよう、顔を横に向けるか側臥位（回復体位）にする。","en":"If a user is vomiting, turn their face to the side or place them on their side (recovery position) so vomit does not block the airway.","jaRuby":"嘔吐《おうと》している利用者《りようしゃ》は、吐物《とぶつ》が気道《きどう》に詰《つ》まらないよう、顔《かお》を横《よこ》に向《む》けるか側臥位《そくがい》（回復体位《かいふくたいい》）にする。"},{"ja":"救急車を呼ぶかどうかの判断基準や緊急連絡網は、施設長個人の手帳にのみ記載し、現場職員には知らせない。","en":"Keep the rules for calling an ambulance and the emergency contact list only in the director's personal notebook, and do not tell floor staff.","jaRuby":"救急車《きゅうきゅうしゃ》を呼《よ》ぶかどうかの判断基準《はんだんきじゅん》や緊急連絡網《きんきゅうれんらくもう》は、施設長個人《しせつちょうこじん》の手帳《てちょう》にのみ記載《きさい》し、現場職員《げんばしょくいん》には知《し》らせない。"}],"answer":4,"expJa":"嘔吐時は吐物による窒息や誤嚥を防ぐため、顔を横に向けるか側臥位（回復体位）にする。急変時は利用者のそばを離れず大声やナースコールで応援を呼び、日頃から緊急連絡網や対応手順を確認しておく。","expEn":"When vomiting, turn the face to the side or use the side-lying (recovery) position to prevent choking and aspiration. In a sudden change, stay with the user and call for help loudly or with the nurse call. Check the emergency contact list and procedures regularly.","jaRuby":"利用者《りようしゃ》の急変時《きゅうへんじ》における介護職員《かいごしょくいん》の対応《たいおう》と事前準備《じぜんじゅんび》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"嘔吐時《おうとじ》は吐物《とぶつ》による窒息《ちっそく》や誤嚥《ごえん》を防《ふせ》ぐため、顔《かお》を横《よこ》に向《む》けるか側臥位《そくがい》（回復体位《かいふくたいい》）にする。急変時《きゅうへんじ》は利用者《りようしゃ》のそばを離《はな》れず大声《おおごえ》やナースコールで応援《おうえん》を呼《よ》び、日頃《ひごろ》から緊急連絡網《きんきゅうれんらくもう》や対応手順《たいおうてじゅん》を確認《かくにん》しておく。"},{"id":"MC36","no":36,"chapter":"mc6","ja":"呼吸器官の名称としくみに関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about the names and structure of the respiratory organs is most appropriate?","options":[{"ja":"喉頭蓋（こうとうがい）は、食べ物を飲み込むときに気管の入り口を開き、空気を胃へ送り込む働きをする。","en":"The epiglottis opens the entrance of the trachea when swallowing food and sends air to the stomach.","jaRuby":"喉頭蓋《こうとうがい》は、食《た》べ物《もの》を飲《の》み込《こ》むときに気管《きかん》の入《い》り口《くち》を開《ひら》き、空気《くうき》を胃《い》へ送《おく》り込《こ》む働《はたら》きをする。"},{"ja":"左の気管支は右の気管支に比べて太く、角度が急（垂直に近い）であるため、異物が入りやすい。","en":"The left bronchus is wider and steeper (closer to vertical) than the right, so foreign objects enter it more easily.","jaRuby":"左《ひだり》の気管支《きかんし》は右《みぎ》の気管支《きかんし》に比《くら》べて太《ふと》く、角度《かくど》が急《きゅう》（垂直《すいちょく》に近《ちか》い）であるため、異物《いぶつ》が入《はい》りやすい。"},{"ja":"空気の通り道である気道は、鼻腔・口腔から始まり、咽頭、喉頭、気管、気管支を経て肺胞へとつながっている。","en":"The airway (path for air) starts at the nasal and oral cavities and goes through the pharynx, larynx, trachea and bronchi to the alveoli.","jaRuby":"空気《くうき》の通《とお》り道《みち》である気道《きどう》は、鼻腔《びくう》・口腔《こうくう》から始《はじ》まり、咽頭《いんとう》、喉頭《こうとう》、気管《きかん》、気管支《きかんし》を経《た》て肺胞《はいほう》へとつながっている。"},{"ja":"肺そのものには自分で膨らんだり縮んだりする筋肉が豊富にあるため、横隔膜がなくても呼吸ができる。","en":"The lungs themselves have many muscles to expand and shrink, so you can breathe without the diaphragm.","jaRuby":"肺《はい》そのものには自分《じぶん》で膨《ふく》らんだり縮《ちぢ》んだりする筋肉《きんにく》が豊富《ほうふ》にあるため、横隔膜《おうかくまく》がなくても呼吸《こきゅう》ができる。"},{"ja":"肺胞で行われる肺と血液との間のガス交換のことを「内呼吸」といい、細胞で行われるガス交換を「外呼吸」という。","en":"Gas exchange between the lungs and blood in the alveoli is called “internal respiration”, and gas exchange in cells is “external respiration”.","jaRuby":"肺胞《はいほう》で行《おこな》われる肺《はい》と血液《けつえき》との間《あいだ》のガス交換《こうかん》のことを「内呼吸《ないこきゅう》」といい、細胞《さいぼう》で行《おこな》われるガス交換《こうかん》を「外呼吸《がいこきゅう》」という。"}],"answer":3,"expJa":"気道は鼻腔・口腔→咽頭→喉頭→気管→気管支→肺胞へと続く。右気管支の方が左気管支より太く角度が急なため異物が入りやすい。肺自体には筋肉がなく、横隔膜や肋間筋の働きで呼吸が行われる。肺胞でのガス交換は「外呼吸」という。","expEn":"The airway goes: nasal/oral cavity → pharynx → larynx → trachea → bronchi → alveoli. The right bronchus is wider and steeper than the left, so objects enter it more easily. The lungs have no muscles; breathing is done by the diaphragm and intercostal muscles. Gas exchange in the alveoli is “external respiration”.","jaRuby":"呼吸器官《こきゅうきかん》の名称《めいしょう》としくみに関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"気道《きどう》は鼻腔《びくう》・口腔《こうくう》→咽頭《いんとう》→喉頭《こうとう》→気管《きかん》→気管支《きかんし》→肺胞《はいほう》へと続《つづ》く。右気管支《みぎきかんし》の方《ほう》が左気管支《ひだりきかんし》より太《ふと》く角度《かくど》が急《きゅう》なため異物《いぶつ》が入《はい》りやすい。肺自体《はいじたい》には筋肉《きんにく》がなく、横隔膜《おうかくまく》や肋間筋《ろっかんきん》の働《はたら》きで呼吸《こきゅう》が行《おこな》われる。肺胞《はいほう》でのガス交換《こうかん》は「外呼吸《がいこきゅう》」という。"},{"id":"MC37","no":37,"chapter":"mc6","ja":"「いつもと違う呼吸状態（異常な呼吸）」とその説明の組み合わせとして、最も適切なものを1つ選びなさい。","en":"Which pair of an “unusual breathing state” and its explanation is most appropriate?","options":[{"ja":"陥没呼吸 ―― 息を吸うときに、鎖骨の上や肋骨の間、みぞおちなどがへこむ呼吸状態。","en":"Retractive breathing – when breathing in, the area above the collarbone, between the ribs, or the pit of the stomach sinks in.","jaRuby":"陥没呼吸《かんぼつこきゅう》 ―― 息《いき》を吸《す》うときに、鎖骨《さこつ》の上《うえ》や肋骨《ろっこつ》の間《あいだ》、みぞおちなどがへこむ呼吸状態《こきゅうじょうたい》。"},{"ja":"下顎（かがく）呼吸 ―― 運動した後に見られる、元気で正常な深呼吸のこと。","en":"Mandibular (jaw) breathing – healthy, normal deep breathing seen after exercise.","jaRuby":"下顎《かがく》呼吸《こきゅう》 ―― 運動《うんどう》した後《あと》に見《み》られる、元気《げんき》で正常《せいじょう》な深呼吸《しんこきゅう》のこと。"},{"ja":"チアノーゼ ―― 血液中の酸素が過剰になり、皮膚や粘膜が鮮やかなピンク色になる状態。","en":"Cyanosis – too much oxygen in the blood makes skin and mucous membranes bright pink.","jaRuby":"チアノーゼ ―― 血液中《けつえきちゅう》の酸素《さんそ》が過剰《かじょう》になり、皮膚《ひふ》や粘膜《ねんまく》が鮮《あざ》やかなピンク色《いろ》になる状態《じょうたい》。"},{"ja":"喘鳴（ぜんめい） ―― 気道が完全に広がり、無音でスムーズに空気が通っている状態。","en":"Wheezing – the airway is fully open and air passes smoothly without sound.","jaRuby":"喘鳴《ぜんめい》 ―― 気道《きどう》が完全《かんぜん》に広《ひろ》がり、無音《むおん》でスムーズに空気《くうき》が通《かよ》っている状態《じょうたい》。"},{"ja":"起坐（きざ）呼吸 ―― 仰向けに寝ると呼吸が楽になり、起き上がると苦しくなる状態。","en":"Orthopnea – breathing is easier lying on the back and harder when sitting up.","jaRuby":"起坐《きざ》呼吸《こきゅう》 ―― 仰向《あおむ》けに寝《ね》ると呼吸《こきゅう》が楽《らく》になり、起《お》き上《あ》がると苦《くる》しくなる状態《じょうたい》。"}],"answer":1,"expJa":"気道狭窄などで息を吸うのが苦しいとき、鎖骨の上や肋間などがへこむ呼吸を「陥没呼吸」という。下顎呼吸は死期が迫った際などに見られる危険な呼吸、チアノーゼは酸素不足で皮膚や唇が青紫色になる状態、起坐呼吸は横になると苦しくなり座位になると楽になる呼吸である。","expEn":"When breathing in is hard (e.g. narrowed airway), the area above the collarbone and between the ribs sinks in: this is “retractive breathing”. Jaw breathing is a dangerous breathing seen near death; cyanosis is bluish-purple skin and lips from lack of oxygen; orthopnea is breathing that is hard lying down and easier sitting up.","jaRuby":"「いつもと違《ちが》う呼吸状態《こきゅうじょうたい》（異常《いじょう》な呼吸《こきゅう》）」とその説明《せつめい》の組《く》み合《あ》わせとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"気道狭窄《きどうきょうさく》などで息《いき》を吸《す》うのが苦《くる》しいとき、鎖骨《さこつ》の上《うえ》や肋間《ろっかん》などがへこむ呼吸《こきゅう》を「陥没呼吸《かんぼつこきゅう》」という。下顎呼吸《かがくこきゅう》は死期《しき》が迫《せま》った際《さい》などに見《み》られる危険《きけん》な呼吸《こきゅう》、チアノーゼは酸素不足《さんそぶそく》で皮膚《ひふ》や唇《くちびる》が青紫色《あおむらさきいろ》になる状態《じょうたい》、起坐呼吸《きざこきゅう》は横《よこ》になると苦《くる》しくなり座位《ざい》になると楽《らく》になる呼吸《こきゅう》である。"},{"id":"MC38","no":38,"chapter":"mc6","ja":"「たん（痰）」が生じるしくみと排出のメカニズムに関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about how “phlegm (sputum)” is made and removed is most appropriate?","options":[{"ja":"健康な人であれば、気道から粘液（気道分泌物）が分泌されることは一切ない。","en":"In a healthy person, the airway never produces mucus (airway secretions).","jaRuby":"健康《けんこう》な人《ひと》であれば、気道《きどう》から粘液《ねんえき》（気道分泌物《きどうぶんぴつぶつ》）が分泌《ぶんぴつ》されることは一切《いっさい》ない。"},{"ja":"空気の乾燥や体内の水分不足（脱水）が起きると、たんはサラサラになって排出しやすくなる。","en":"When the air is dry or the body lacks water (dehydration), phlegm becomes thin and easy to remove.","jaRuby":"空気《くうき》の乾燥《かんそう》や体内《たいない》の水分不足《すいぶんぶそく》（脱水《だっすい》）が起《お》きると、たんはサラサラになって排出《はいしゅつ》しやすくなる。"},{"ja":"咳（咳嗽反射）は体に有害な反応であるため、たんが溜まっていても常に我慢させるべきである。","en":"Coughing (cough reflex) is harmful, so the person should always hold it in, even if phlegm builds up.","jaRuby":"咳《せき》（咳嗽反射《がいそうはんしゃ》）は体《からだ》に有害《ゆうがい》な反応《はんのう》であるため、たんが溜《た》まっていても常《つね》に我慢《がまん》させるべきである。"},{"ja":"高齢者や神経筋疾患のある利用者は、咳をする力（咳嗽力）が強くなるため、たんの貯留は起こらない。","en":"Older people and users with neuromuscular diseases have a stronger cough, so phlegm does not build up.","jaRuby":"高齢者《こうれいしゃ》や神経筋疾患《しんけいきんしっかん》のある利用者《りようしゃ》は、咳《せき》をする力《ちから》（咳嗽力《がいそうりょく》）が強《つよ》くなるため、たんの貯留《ちょりゅう》は起《お》こらない。"},{"ja":"気道の粘膜には線毛（せんもう）があり、異物を絡め取った粘液を咽頭の方へ押し上げる「線毛運動」によって排出を促している。","en":"The airway lining has cilia; “ciliary movement” pushes mucus that has caught foreign matter up toward the pharynx to help remove it.","jaRuby":"気道《きどう》の粘膜《ねんまく》には線毛《せんもう》があり、異物《いぶつ》を絡《から》め取《と》った粘液《ねんえき》を咽頭《いんとう》の方《ほう》へ押《お》し上《あ》げる「線毛運動《せんもううんどう》」によって排出《はいしゅつ》を促《うなが》している。"}],"answer":5,"expJa":"気道粘膜の線毛運動と咳嗽（咳）反射によって、異物を絡め取ったたんが排出される。乾燥や脱水があると、たんの粘り気が強くなり（粘稠度が増し）、排出しにくくなる。","expEn":"Ciliary movement of the airway lining and the cough reflex remove phlegm that has caught foreign matter. Dryness or dehydration makes phlegm thicker (more sticky) and harder to remove.","jaRuby":"「たん（痰《たん》）」が生《しょう》じるしくみと排出《はいしゅつ》のメカニズムに関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"気道粘膜《きどうねんまく》の線毛運動《せんもううんどう》と咳嗽《がいそう》（咳《せき》）反射《はんしゃ》によって、異物《いぶつ》を絡《から》め取《と》ったたんが排出《はいしゅつ》される。乾燥《かんそう》や脱水《だっすい》があると、たんの粘《ねば》り気《き》が強《つよ》くなり（粘稠度《ねんちゅうど》が増《ふ》し）、排出《はいしゅつ》しにくくなる。"},{"id":"MC39","no":39,"chapter":"mc6","ja":"人工呼吸器療法の種類と特徴に関する記述として、最も適切なものを1つ選びなさい。","en":"Which statement about types of ventilator therapy is most appropriate?","options":[{"ja":"侵襲的陽圧換気療法（TPPV）は、気管カニューレを使用せず、鼻カニューラのみで酸素を流す方法である。","en":"Invasive positive pressure ventilation (TPPV) gives oxygen only through a nasal cannula, without a tracheal cannula.","jaRuby":"侵襲的陽圧換気療法《しんしゅうてきようあつかんきりょうほう》（TPPV）は、気管《きかん》カニューレを使用《しよう》せず、鼻《はな》カニューラのみで酸素《さんそ》を流《なが》す方法《ほうほう》である。"},{"ja":"マスク式の人工呼吸器（NPPV）を装着している利用者は、会話や食事が一生できなくなる。","en":"Users wearing a mask-type ventilator (NPPV) can never talk or eat again.","jaRuby":"マスク式《しき》の人工呼吸器《じんこうこきゅうき》（NPPV）を装着《そうちゃく》している利用者《りようしゃ》は、会話《かいわ》や食事《しょくじ》が一生《いっしょう》できなくなる。"},{"ja":"気管切開をして気管カニューレを挿入している利用者は、すべて声帯を摘出しているため、カフ付きやスピーチカニューレなどの種類はない。","en":"All users with a tracheal cannula have had their vocal cords removed, so there are no cuffed or speech cannulas.","jaRuby":"気管切開《きかんせっかい》をして気管《きかん》カニューレを挿入《そうにゅう》している利用者《りようしゃ》は、すべて声帯《せいたい》を摘出《てきしゅつ》しているため、カフ付《つ》きやスピーチカニューレなどの種類《しゅるい》はない。"},{"ja":"非侵襲的陽圧換気療法（NPPV）は、気管切開を行わず、鼻マスクや顔マスクなどを装着して換気を行う方法である。","en":"Non-invasive positive pressure ventilation (NPPV) uses a nasal or face mask, without a tracheostomy.","jaRuby":"非侵襲的陽圧換気療法《ひしんしゅうてきようあつかんきりょうほう》（NPPV）は、気管切開《きかんせっかい》を行《おこな》わず、鼻《はな》マスクや顔《かお》マスクなどを装着《そうちゃく》して換気《かんき》を行《おこな》う方法《ほうほう》である。"},{"ja":"人工呼吸器のアラームが鳴った場合、介護職員は原因を確認せずに電源スイッチを切ってよい。","en":"When a ventilator alarm sounds, the care worker may turn off the power without checking the cause.","jaRuby":"人工呼吸器《じんこうこきゅうき》のアラームが鳴《な》った場合《ばあい》、介護職員《かいごしょくいん》は原因《げんいん》を確認《かくにん》せずに電源《でんげん》スイッチを切《き》ってよい。"}],"answer":4,"expJa":"非侵襲的陽圧換気療法（NPPV）はマスクを用いて換気を行う方法で、着脱が可能であり会話や食事ができる場合もある。一方、気管切開や気管挿管を行う方法を侵襲的陽圧換気療法（TPPV）という。","expEn":"NPPV uses a mask for ventilation; it can be put on and taken off, and sometimes the user can talk and eat. Ventilation through a tracheostomy or tracheal intubation is called TPPV.","jaRuby":"人工呼吸器療法《じんこうこきゅうきりょうほう》の種類《しゅるい》と特徴《とくちょう》に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"非侵襲的陽圧換気療法《ひしんしゅうてきようあつかんきりょうほう》（NPPV）はマスクを用《もち》いて換気《かんき》を行《おこな》う方法《ほうほう》で、着脱《ちゃくだつ》が可能《かのう》であり会話《かいわ》や食事《しょくじ》ができる場合《ばあい》もある。一方《いっぽう》、気管切開《きかんせっかい》や気管挿管《きかんそうかん》を行《おこな》う方法《ほうほう》を侵襲的陽圧換気療法《しんしゅうてきようあつかんきりょうほう》（TPPV）という。"},{"id":"MC40","no":40,"chapter":"mc6","ja":"人工呼吸器を装着している利用者への喀痰吸引や生活支援上の注意点として、最も適切なものを1つ選びなさい。","en":"Which is the most appropriate point for suctioning and daily support for a user on a ventilator?","options":[{"ja":"気管カニューレ内部の吸引を行う際は、カニューレの先端を越えて気管の奥深くまでチューブを挿入して吸引する。","en":"When suctioning inside the tracheal cannula, insert the tube past the cannula tip deep into the trachea.","jaRuby":"気管《きかん》カニューレ内部《ないぶ》の吸引《きゅういん》を行《おこな》う際《さい》は、カニューレの先端《せんたん》を越《こ》えて気管《きかん》の奥深《おくふか》くまでチューブを挿入《そうにゅう》して吸引《きゅういん》する。"},{"ja":"気管カニューレを固定しているネックホルダー（固定テープ）が緩んでいても、抜ける心配はないため放置してよい。","en":"Even if the neck holder (tape) fixing the cannula is loose, it will not come out, so leave it.","jaRuby":"気管《きかん》カニューレを固定《こてい》しているネックホルダー（固定《こてい》テープ）が緩《ゆる》んでいても、抜《ぬ》ける心配《しんぱい》はないため放置《ほうち》してよい。"},{"ja":"体位変換や移動を行う際は、人工呼吸器の回路（蛇管）が引っ張られてカニューレが抜ける（計画外抜管）ことがないよう十分に注意する。","en":"When changing position or moving, take great care that the ventilator tubing is not pulled and the cannula does not come out (unplanned extubation).","jaRuby":"体位変換《たいいへんかん》や移動《いどう》を行《おこな》う際《さい》は、人工呼吸器《じんこうこきゅうき》の回路《かいろ》（蛇管《じゃかん》）が引《ひ》っ張《ぱ》られてカニューレが抜《ぬ》ける（計画外抜管《けいかくがいばっかん》）ことがないよう十分《じゅうぶん》に注意《ちゅうい》する。"},{"ja":"加温加湿器の水がなくなった場合は、水道水やジュースを継ぎ足して使用する。","en":"If the heated humidifier runs out of water, add tap water or juice.","jaRuby":"加温加湿器《かおんかしつき》の水《みず》がなくなった場合《ばあい》は、水道水《すいどうすい》やジュースを継《つ》ぎ足《た》して使用《しよう》する。"},{"ja":"人工呼吸器の蛇管（回路）の中に溜まった水滴（結露）は、利用者側の気管カニューレへ流し込んで処理する。","en":"Water drops (condensation) in the ventilator tubing should be drained into the user's tracheal cannula.","jaRuby":"人工呼吸器《じんこうこきゅうき》の蛇管《じゃかん》（回路《かいろ》）の中《なか》に溜《た》まった水滴《すいてき》（結露《けつろ》）は、利用者側《りようしゃがわ》の気管《きかん》カニューレへ流《なが》し込《こ》んで処理《しょり》する。"}],"answer":3,"expJa":"体位変換やケアの際は、人工呼吸器の回路が引っ張られて気管カニューレが抜ける事故（計画外抜管）を防ぐため細心の注意を払う。気管カニューレ内部の吸引はカニューレの先端を越えない深さで行い、加温加湿器には精製水（滅菌精製水）を用い、回路内の水滴は利用者側へ流れないよう処理する。","expEn":"During position changes and care, take great care to prevent the tubing from pulling the cannula out (unplanned extubation). Suction inside the cannula without going past its tip; use (sterile) purified water in the humidifier; and drain water in the tubing so it does not flow toward the user.","jaRuby":"人工呼吸器《じんこうこきゅうき》を装着《そうちゃく》している利用者《りようしゃ》への喀痰吸引《かくたんきゅういん》や生活支援上《せいかつしえんじょう》の注意点《ちゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"体位変換《たいいへんかん》やケアの際《さい》は、人工呼吸器《じんこうこきゅうき》の回路《かいろ》が引《ひ》っ張《ぱ》られて気管《きかん》カニューレが抜《ぬ》ける事故《じこ》（計画外抜管《けいかくがいばっかん》）を防《ふせ》ぐため細心《さいしん》の注意《ちゅうい》を払《はら》う。気管《きかん》カニューレ内部《ないぶ》の吸引《きゅういん》はカニューレの先端《せんたん》を越《こ》えない深《ふか》さで行《おこな》い、加温加湿器《かおんかしつき》には精製水《せいせいすい》（滅菌精製水《めっきんせいせいすい》）を用《もち》い、回路内《かいろない》の水滴《すいてき》は利用者側《りようしゃがわ》へ流《なが》れないよう処理《しょり》する。"},{"id":"MC41","no":41,"chapter":"mc6","ja":"子どもの喀痰吸引における特徴と留意点として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about the features of suctioning children and points to note?","options":[{"ja":"子どもの鼻腔や口腔は大人と同じ大きさがあるため、成人用の太い吸引チューブをそのまま使用する。","en":"Children's nose and mouth are the same size as adults', so use thick adult tubes as they are.","jaRuby":"子《こ》どもの鼻腔《びくう》や口腔《こうくう》は大人《おとな》と同《おな》じ大《おお》きさがあるため、成人用《せいじんよう》の太《ふと》い吸引《きゅういん》チューブをそのまま使用《しよう》する。"},{"ja":"子どもは成人に比べて気道が狭く、粘膜も傷つきやすいため、吸引圧は成人より低く設定し、細い吸引チューブを使用する。","en":"Children's airways are narrower and their lining is easily hurt, so set a lower suction pressure than for adults and use a thinner tube.","jaRuby":"子《こ》どもは成人《せいじん》に比《くら》べて気道《きどう》が狭《せま》く、粘膜《ねんまく》も傷《きず》つきやすいため、吸引圧《きゅういんあつ》は成人《せいじん》より低《ひく》く設定《せってい》し、細《ほそ》い吸引《きゅういん》チューブを使用《しよう》する。"},{"ja":"子どもが泣いたり暴れたりしているときは、無理やり押さえつけて長時間吸引を続ける。","en":"When a child cries or struggles, hold them down by force and keep suctioning for a long time.","jaRuby":"子《こ》どもが泣《な》いたり暴《あば》れたりしているときは、無理《むり》やり押《お》さえつけて長時間吸引《ちょうじかんきゅういん》を続《つづ》ける。"},{"ja":"外出や通学時に携帯用吸引器を持ち運ぶ際は、バッテリーの充電残量を確認する必要はない。","en":"When carrying a portable suction machine outside or to school, you do not need to check the battery.","jaRuby":"外出《がいしゅつ》や通学時《つうがくじ》に携帯用吸引器《けいたいようきゅういんき》を持《も》ち運《はこ》ぶ際《さい》は、バッテリーの充電残量《じゅうでんざんりょう》を確認《かくにん》する必要《ひつよう》はない。"},{"ja":"子どもに対しては、年齢や理解度にかかわらず、吸引前の声かけや説明は一切行わなくてよい。","en":"For children, you never need to talk to them or explain before suctioning, whatever their age or understanding.","jaRuby":"子《こ》どもに対《たい》しては、年齢《ねんれい》や理解度《りかいど》にかかわらず、吸引前《きゅういんまえ》の声《こえ》かけや説明《せつめい》は一切行《いっさいおこな》わなくてよい。"}],"answer":2,"expJa":"子どもは気道が狭く粘膜もデリケートなため、細いチューブを用い、低い吸引圧で短時間に吸引する。また、年齢に応じた声かけや安心できる関わりを行い、外出時は吸引器のバッテリー残量や予備物品を必ず確認する。","expEn":"Children have narrow airways and delicate linings, so use a thin tube, low pressure and a short time. Talk to them in a way that suits their age so they feel safe, and when going out, always check the battery and spare supplies.","jaRuby":"子《こ》どもの喀痰吸引《かくたんきゅういん》における特徴《とくちょう》と留意点《りゅういてん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"子《こ》どもは気道《きどう》が狭《せま》く粘膜《ねんまく》もデリケートなため、細《ほそ》いチューブを用《もち》い、低《ひく》い吸引圧《きゅういんあつ》で短時間《たんじかん》に吸引《きゅういん》する。また、年齢《ねんれい》に応《おう》じた声《こえ》かけや安心《あんしん》できる関《かか》わりを行《おこな》い、外出時《がいしゅつじ》は吸引器《きゅういんき》のバッテリー残量《ざんりょう》や予備物品《よびぶっぴん》を必《かなら》ず確認《かくにん》する。"},{"id":"MC42","no":42,"chapter":"mc6","ja":"喀痰吸引を受ける利用者や家族の気持ちへの理解と、「説明と同意（インフォームド・コンセント）」に関する記述として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about understanding the feelings of users and families receiving suctioning, and “informed consent”?","options":[{"ja":"吸引は毎日繰り返されるケアであるため、最初に一度同意書をもらえば、毎回の吸引時の声かけや同意確認は不要である。","en":"Suctioning is done every day, so after getting a consent form once, you do not need to talk to the user or check consent each time.","jaRuby":"吸引《きゅういん》は毎日繰《まいにちく》り返《かえ》されるケアであるため、最初《さいしょ》に一度同意書《いちどどういしょ》をもらえば、毎回《まいかい》の吸引時《きゅういんじ》の声《こえ》かけや同意確認《どういかくにん》は不要《ふよう》である。"},{"ja":"家族は吸引に慣れているはずなので、介護負担や精神的な不安を抱えることはない。","en":"Families should be used to suctioning, so they never feel a care burden or worry.","jaRuby":"家族《かぞく》は吸引《きゅういん》に慣《な》れているはずなので、介護負担《かいごふたん》や精神的《せいしんてき》な不安《ふあん》を抱《かか》えることはない。"},{"ja":"言葉を発することができない利用者に対しては、表情や視線などのサインを読み取る努力をする必要はない。","en":"For users who cannot speak, there is no need to try to read signs such as facial expression or eye movement.","jaRuby":"言葉《ことば》を発《はっ》することができない利用者《りようしゃ》に対《たい》しては、表情《ひょうじょう》や視線《しせん》などのサインを読《よ》み取《と》る努力《どりょく》をする必要《ひつよう》はない。"},{"ja":"同意書は口頭での約束だけで十分であり、書面として残す必要はない。","en":"A verbal promise is enough for consent; it does not need to be in writing.","jaRuby":"同意書《どういしょ》は口頭《こうとう》での約束《やくそく》だけで十分《じゅうぶん》であり、書面《しょめん》として残《のこ》す必要《ひつよう》はない。"},{"ja":"吸引は苦痛や恐怖心、羞恥心を伴うことがあるため、利用者の気持ちに寄り添い、プライバシーに配慮して実施する。","en":"Suctioning can bring pain, fear and embarrassment, so stay close to the user's feelings and protect their privacy.","jaRuby":"吸引《きゅういん》は苦痛《くつう》や恐怖心《きょうふしん》、羞恥心《しゅうちしん》を伴《ともな》うことがあるため、利用者《りようしゃ》の気持《きも》ちに寄《よ》り添《そ》い、プライバシーに配慮《はいりょ》して実施《じっし》する。"}],"answer":5,"expJa":"吸引は苦痛や不安を伴うため、書面での同意だけでなく、毎回の実施前にも丁寧な声かけと説明を行い、利用者の表情やサインから同意を確認しつつプライバシーに配慮して行う。","expEn":"Suctioning brings pain and worry. Besides written consent, talk to and explain to the user carefully every time before suctioning, check their agreement from expressions and signs, and protect their privacy.","jaRuby":"喀痰吸引《かくたんきゅういん》を受《う》ける利用者《りようしゃ》や家族《かぞく》の気持《きも》ちへの理解《りかい》と、「説明《せつめい》と同意《どうい》（インフォームド・コンセント）」に関《かん》する記述《きじゅつ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"吸引《きゅういん》は苦痛《くつう》や不安《ふあん》を伴《ともな》うため、書面《しょめん》での同意《どうい》だけでなく、毎回《まいかい》の実施前《じっしまえ》にも丁寧《ていねい》な声《こえ》かけと説明《せつめい》を行《おこな》い、利用者《りようしゃ》の表情《ひょうじょう》やサインから同意《どうい》を確認《かくにん》しつつプライバシーに配慮《はいりょ》して行《おこな》う。"},{"id":"MC43","no":43,"chapter":"mc6","ja":"喀痰吸引に関連して起こる「呼吸器系の感染」とその予防策として、最も適切なものを1つ選びなさい。","en":"Which is most appropriate about “respiratory infections” related to suctioning and how to prevent them?","options":[{"ja":"口腔内を吸引した後のチューブを、そのまま同じ手順で気管カニューレ内部に挿入して吸引する。","en":"After suctioning the mouth, insert the same tube into the tracheal cannula and suction in the same way.","jaRuby":"口腔内《こうくうない》を吸引《きゅういん》した後《あと》のチューブを、そのまま同《おな》じ手順《てじゅん》で気管《きかん》カニューレ内部《ないぶ》に挿入《そうにゅう》して吸引《きゅういん》する。"},{"ja":"吸引器の吸引びんに溜まった排液は、1か月に1回だけ捨てれば感染の危険はない。","en":"Waste fluid in the suction bottle only needs to be thrown away once a month.","jaRuby":"吸引器《きゅういんき》の吸引《きゅういん》びんに溜《た》まった排液《はいえき》は、1か月《つき》に1回《かい》だけ捨《す》てれば感染《かんせん》の危険《きけん》はない。"},{"ja":"気管カニューレ内部は無菌に近い状態であるため、吸引時は清潔操作を徹底し、口腔・鼻腔用のチューブとは厳密に区別する。","en":"The inside of the tracheal cannula is close to germ-free, so use strict clean technique and keep its tube strictly separate from mouth/nose tubes.","jaRuby":"気管《きかん》カニューレ内部《ないぶ》は無菌《むきん》に近《ちか》い状態《じょうたい》であるため、吸引時《きゅういんじ》は清潔操作《せいけつそうさ》を徹底《てってい》し、口腔《こうくう》・鼻腔用《びくうよう》のチューブとは厳密《げんみつ》に区別《くべつ》する。"},{"ja":"通水用の水（洗浄水）は、継ぎ足しながら1週間同じものを使い続ける。","en":"Keep using the same rinsing water for a week, topping it up.","jaRuby":"通水用《つうすいよう》の水《みず》（洗浄水《せんじょうすい》）は、継《つ》ぎ足《た》しながら1週間同《しゅうかんおな》じものを使《つか》い続《つづ》ける。"},{"ja":"口腔ケア（歯磨きなど）を行うと口の中の細菌が増えるため、吸引が必要な利用者には口腔ケアを行わない。","en":"Oral care (brushing teeth etc.) increases bacteria in the mouth, so do not give oral care to users who need suctioning.","jaRuby":"口腔《こうくう》ケア（歯磨《はみが》きなど）を行《おこな》うと口《くち》の中《なか》の細菌《さいきん》が増《ふ》えるため、吸引《きゅういん》が必要《ひつよう》な利用者《りようしゃ》には口腔《こうくう》ケアを行《おこな》わない。"}],"answer":3,"expJa":"口腔や鼻腔には常在菌が多く存在するため、気管カニューレ内部を吸引するチューブと口腔・鼻腔用のチューブは厳密に区別し、気管カニューレ内部の吸引では清潔（無菌）操作を徹底する。","expEn":"The mouth and nose have many normal bacteria, so keep tubes for the tracheal cannula strictly separate from mouth/nose tubes, and use strict clean (sterile) technique when suctioning inside the cannula.","jaRuby":"喀痰吸引《かくたんきゅういん》に関連《かんれん》して起《お》こる「呼吸器系《こきゅうきけい》の感染《かんせん》」とその予防策《よぼうさく》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"口腔《こうくう》や鼻腔《びくう》には常在菌《じょうざいきん》が多《おお》く存在《そんざい》するため、気管《きかん》カニューレ内部《ないぶ》を吸引《きゅういん》するチューブと口腔《こうくう》・鼻腔用《びくうよう》のチューブは厳密《げんみつ》に区別《くべつ》し、気管《きかん》カニューレ内部《ないぶ》の吸引《きゅういん》では清潔《せいけつ》（無菌《むきん》）操作《そうさ》を徹底《てってい》する。"},{"id":"MC44","no":44,"chapter":"mc6","ja":"喀痰吸引によって生じる可能性がある危険（合併症・副作用）の説明として、最も適切なものを1つ選びなさい。","en":"Which explains a possible danger (complication / side effect) of suctioning most appropriately?","options":[{"ja":"1回の吸引時間が長すぎたり、吸引圧が高すぎたりすると、たんと一緒に酸素も吸い出されて「低酸素血症」を起こす危険がある。","en":"If one suction is too long or the pressure too high, oxygen is sucked out with the phlegm, which can cause “hypoxemia” (low blood oxygen).","jaRuby":"1回《かい》の吸引時間《きゅういんじかん》が長《なが》すぎたり、吸引圧《きゅういんあつ》が高《たか》すぎたりすると、たんと一緒《いっしょ》に酸素《さんそ》も吸《す》い出《で》されて「低酸素血症《ていさんそけっしょう》」を起《お》こす危険《きけん》がある。"},{"ja":"吸引チューブを咽頭の奥に強く当てても、嘔吐反射（吐き気）や迷走神経反射（徐脈・血圧低下）が起きることはない。","en":"Even if the tube is pressed hard deep in the pharynx, the gag reflex and vagus nerve reflex (slow pulse, low blood pressure) never occur.","jaRuby":"吸引《きゅういん》チューブを咽頭《いんとう》の奥《おく》に強《つよ》く当《あ》てても、嘔吐反射《おうとはんしゃ》（吐《は》き気《き》）や迷走神経反射《めいそうしんけいはんしゃ》（徐脈《じょみゃく》・血圧低下《けつあつていか》）が起《お》きることはない。"},{"ja":"吸引圧を最大にしてチューブを粘膜に吸い付かせながら引き抜くと、粘膜の損傷や出血を予防できる。","en":"Pulling the tube out while it sticks to the lining at maximum pressure prevents damage and bleeding.","jaRuby":"吸引圧《きゅういんあつ》を最大《さいだい》にしてチューブを粘膜《ねんまく》に吸《す》い付《つ》かせながら引《ひ》き抜《ぬ》くと、粘膜《ねんまく》の損傷《そんしょう》や出血《しゅっけつ》を予防《よぼう》できる。"},{"ja":"食後すぐに咽頭を刺激して吸引を行うと、誤嚥（ごえん）を完全に防ぐことができる。","en":"Stimulating the pharynx and suctioning right after a meal fully prevents aspiration.","jaRuby":"食後《しょくご》すぐに咽頭《いんとう》を刺激《しげき》して吸引《きゅういん》を行《おこな》うと、誤嚥《ごえん》を完全《かんぜん》に防《ふせ》ぐことができる。"},{"ja":"鼻腔内吸引では、どの方向にチューブを進めても鼻出血が起きることは絶対にない。","en":"In nasal suctioning, nosebleeds never happen, whichever direction the tube goes.","jaRuby":"鼻腔内吸引《びくうないきゅういん》では、どの方向《ほうこう》にチューブを進《すす》めても鼻出血《びしゅっけつ》が起《お》きることは絶対《ぜったい》にない。"}],"answer":1,"expJa":"吸引時間が長すぎたり吸引圧が高すぎたりすると、肺内の酸素まで吸引されて低酸素血症を引き起こすほか、粘膜損傷や出血、迷走神経反射（徐脈、血圧低下、不整脈）などを起こす危険がある。","expEn":"If suctioning is too long or the pressure too high, oxygen in the lungs is also sucked out, causing hypoxemia. It can also cause damage to the lining, bleeding, and a vagus nerve reflex (slow pulse, low blood pressure, irregular heartbeat).","jaRuby":"喀痰吸引《かくたんきゅういん》によって生《しょう》じる可能性《かのうせい》がある危険《きけん》（合併症《がっぺいしょう》・副作用《ふくさよう》）の説明《せつめい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。","expJaRuby":"吸引時間《きゅういんじかん》が長《なが》すぎたり吸引圧《きゅういんあつ》が高《たか》すぎたりすると、肺内《はいない》の酸素《さんそ》まで吸引《きゅういん》されて低酸素血症《ていさんそけっしょう》を引《ひ》き起《お》こすほか、粘膜損傷《ねんまくそんしょう》や出血《しゅっけつ》、迷走神経反射《めいそうしんけいはんしゃ》（徐脈《じょみゃく》、血圧低下《けつあつていか》、不整脈《ふせいみゃく》）などを起《お》こす危険《きけん》がある。"},{"id":"MC45","no":45,"chapter":"mc6","ja":"喀痰吸引の実施中に、利用者の顔色が急に悪くなり（チアノーゼ）、パルスオキシメーターの数値が急激に低下した場合の対応として、最も適切なものを1つ選びなさい。","en":"During suctioning, the user's face color suddenly gets worse (cyanosis) and the pulse oximeter reading drops quickly. What is the most appropriate response?","options":[{"ja":"直ちに吸引を中止し、吸引チューブをゆっくり抜去して呼吸状態や意識を確認し、速やかに看護職員や医師へ連絡する。","en":"Stop suctioning immediately, slowly remove the tube, check breathing and consciousness, and quickly contact a nurse or doctor.","jaRuby":"直《ただ》ちに吸引《きゅういん》を中止《ちゅうし》し、吸引《きゅういん》チューブをゆっくり抜去《ばっきょ》して呼吸状態《こきゅうじょうたい》や意識《いしき》を確認《かくにん》し、速《すみ》やかに看護職員《かんごしょくいん》や医師《いし》へ連絡《れんらく》する。"},{"ja":"たんがすべて引き切れるまで、吸引圧を上げて吸引を継続する。","en":"Raise the pressure and keep suctioning until all the phlegm is out.","jaRuby":"たんがすべて引《ひ》き切《き》れるまで、吸引圧《きゅういんあつ》を上《あ》げて吸引《きゅういん》を継続《けいぞく》する。"},{"ja":"吸引チューブを入れたままの状態で、看護職員を探しに部屋を出る。","en":"Leave the room to find a nurse with the tube still inserted.","jaRuby":"吸引《きゅういん》チューブを入《い》れたままの状態《じょうたい》で、看護職員《かんごしょくいん》を探《さが》しに部屋《へや》を出《で》る。"},{"ja":"パルスオキシメーターの故障と判断し、機器の電源を切って様子を見る。","en":"Decide the pulse oximeter is broken, turn it off and wait and see.","jaRuby":"パルスオキシメーターの故障《こしょう》と判断《はんだん》し、機器《きき》の電源《でんげん》を切《き》って様子《ようす》を見《み》る。"},{"ja":
